    syntax:
      content: 'event: LiveDecisionCompleted'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveDecisionCompleted" />
  - name: event_id
    uid: '@azure/ai-projects.LiveServerEventLiveDecisionEvent.event_id'
    package: '@azure/ai-projects'
