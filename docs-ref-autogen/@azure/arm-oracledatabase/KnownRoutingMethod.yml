### YamlMime:TSEnum
name: KnownRoutingMethod
uid: '@azure/arm-oracledatabase.KnownRoutingMethod'
package: '@azure/arm-oracledatabase'
summary: Allowed network traffic routing method.
fullName: KnownRoutingMethod
remarks: ''
isDeprecated: false
fields:
  - name: DedicatedEndpoint
    uid: '@azure/arm-oracledatabase.KnownRoutingMethod.DedicatedEndpoint'
    package: '@azure/arm-oracledatabase'
    summary: >-
      Indicates that a dedicated private endpoint is created in the target VCN
      subnet for the connection.
  - name: SharedDeploymentEndpoint
    uid: '@azure/arm-oracledatabase.KnownRoutingMethod.SharedDeploymentEndpoint'
    package: '@azure/arm-oracledatabase'
    summary: >-
      Indicates that traffic flows from the assigned deployment's private
      endpoint through the deployment's subnet.
  - name: SharedServiceEndpoint
    uid: '@azure/arm-oracledatabase.KnownRoutingMethod.SharedServiceEndpoint'
    package: '@azure/arm-oracledatabase'
    summary: >-
      Indicates that traffic flows through the GoldenGate service network to
      public hosts.
