name: TablePlanEnum
uid: '@azure/provisioning-operationalinsights.types.TablePlanEnum'
package: '@azure/provisioning-operationalinsights'
summary: >-
  Instruct the system how to handle and charge the logs ingested to this table.


  Known values:


  - `"Basic"`: Medium-touch logs needed for troubleshooting and incident
  response.


  - `"Analytics"`: High-value logs used for continuous monitoring, real-time
  detection, and performance analytics.


  - `"Auxiliary"`: Low-touch logs, such as verbose logs, and data required for
  auditing and compliance.
