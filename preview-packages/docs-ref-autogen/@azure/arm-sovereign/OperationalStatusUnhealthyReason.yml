name: OperationalStatusUnhealthyReason
uid: '@azure/arm-sovereign.OperationalStatusUnhealthyReason'
package: '@azure/arm-sovereign'
summary: >-
  The reasons a sovereign view or an individual scope is unhealthy. \

  [KnownOperationalStatusUnhealthyReason](xref:@azure/arm-sovereign.KnownOperationalStatusUnhealthyReason)
  can be used interchangeably with OperationalStatusUnhealthyReason,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **MIMissing**: The managed identity is missing. \

  **MIPermissionMissing**: The managed identity is missing required permissions.
  \

  **PolicyAssignmentMissing**: A required policy assignment is missing.
