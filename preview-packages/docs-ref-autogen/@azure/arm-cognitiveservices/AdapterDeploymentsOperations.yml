  - name: createOrUpdate
    uid: '@azure/arm-cognitiveservices.AdapterDeploymentsOperations.createOrUpdate'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Creates an adapter deployment or re-targets it to another compatible

      managed compute deployment. The source model ID is immutable.

      Returns 201 for a new adapter or 200 for an existing adapter, including
      retries.

      Either response may require polling while provisioning is in progress.

      After polling completes, retrieve the final resource from the original
      resource URL.

      Omit conditional headers to allow either creation or update.

      To create only when absent, send If-None-Match: *.

      To update only a matching version, send If-Match with the ETag returned by
      GET.

      Conditional requests, including retries, return 412 if the precondition is
      not met.
    fullName: createOrUpdate
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        createOrUpdate: (resourceGroupName: string, accountName: string,
