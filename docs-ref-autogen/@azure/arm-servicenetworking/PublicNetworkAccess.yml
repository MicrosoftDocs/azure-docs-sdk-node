### YamlMime:TSTypeAlias
name: PublicNetworkAccess
uid: '@azure/arm-servicenetworking.PublicNetworkAccess'
package: '@azure/arm-servicenetworking'
summary: >-
  Whether public network access is allowed for the frontend. \

  [KnownPublicNetworkAccess](xref:@azure/arm-servicenetworking.KnownPublicNetworkAccess)
  can be used interchangeably with PublicNetworkAccess,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Public network access is enabled (public frontend accessible via
  a public IP address). \

  **Disabled**: Public network access is disabled (private frontend accessible
  only through a private endpoint).
fullName: PublicNetworkAccess
remarks: ''
isDeprecated: false
syntax: |
  type PublicNetworkAccess = string
