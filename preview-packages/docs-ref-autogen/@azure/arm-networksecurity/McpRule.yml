### YamlMime:TSType
name: McpRule
uid: '@azure/arm-networksecurity.McpRule'
package: '@azure/arm-networksecurity'
summary: A single rule within an MCP policy.
fullName: McpRule
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: action
    uid: '@azure/arm-networksecurity.McpRule.action'
    package: '@azure/arm-networksecurity'
    summary: The action to take for the specified MCP tools.
    fullName: action
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'action?: string'
      return:
        description: ''
        type: string
  - name: matchingConditions
    uid: '@azure/arm-networksecurity.McpRule.matchingConditions'
    package: '@azure/arm-networksecurity'
    summary: The conditions of the rule. A rule without an action uses defaultAction.
    fullName: matchingConditions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'matchingConditions?: McpRuleMatchingConditions'
      return:
        description: ''
        type: <xref uid="@azure/arm-networksecurity.McpRuleMatchingConditions" />
  - name: name
    uid: '@azure/arm-networksecurity.McpRule.name'
    package: '@azure/arm-networksecurity'
    summary: >-
      The name of the rule: 1 to 63 ASCII letters, digits, '_', '.' or '-',
      starting with a

      letter or digit, and unique within the policy ignoring case. Flow logs
      report the rule

      that decided as `mcp-<n>/<name>`.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name?: string'
      return:
        description: ''
        type: string
  - name: priority
    uid: '@azure/arm-networksecurity.McpRule.priority'
    package: '@azure/arm-networksecurity'
    summary: >-
      The priority of the rule, unique within the policy. Rules are tried from
      the lowest value

      and the first rule that matches decides; a policy has 1 to 5 rules. When
      none

      matches, defaultAction applies to every MCP request except session
      requests (initialize,

      ping, notifications, the list methods, JSON-RPC responses, and requests
      with no body such

      as GET and DELETE), which pass.
    fullName: priority
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'priority?: number'
      return:
        description: ''
        type: number
  - name: tools
    uid: '@azure/arm-networksecurity.McpRule.tools'
    package: '@azure/arm-networksecurity'
    summary: >-
      Deprecated. Legacy MCP tool names retained for compatibility; use
      matchingConditions.destinations.toolMatching.names for new rules.
    fullName: tools
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tools?: string[]'
      return:
        description: ''
        type: string[]
