name: FleetMode
uid: '@azure/arm-computefleet.FleetMode'
package: '@azure/arm-computefleet'
summary: >-
  Modes for Compute Fleet. \

  [KnownFleetMode](xref:@azure/arm-computefleet.KnownFleetMode) can be used
  interchangeably with FleetMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Managed**: Default. Managed mode where Compute Fleet provisions the VMs,
  manages them and their lifecycle. \

  **Launch**: Launch mode where Compute Fleet launches the VMs and the customer
  manages them and their lifecycle.
