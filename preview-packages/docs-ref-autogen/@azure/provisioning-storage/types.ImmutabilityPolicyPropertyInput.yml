name: ImmutabilityPolicyPropertyInput
uid: '@azure/provisioning-storage.types.ImmutabilityPolicyPropertyInput'
package: '@azure/provisioning-storage'
summary: Input type for The properties of an ImmutabilityPolicy of a blob container.
fullName: ImmutabilityPolicyPropertyInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: allowProtectedAppendWrites
    uid: >-
      @azure/provisioning-storage.types.ImmutabilityPolicyPropertyInput.allowProtectedAppendWrites
    package: '@azure/provisioning-storage'
    summary: >-
      This property can only be changed for unlocked time-based retention
      policies. When enabled, new blocks can be written to an append blob while
      maintaining immutability protection and compliance. Only new blocks can be
      added and any existing blocks cannot be modified or deleted. This property
      cannot be changed with ExtendImmutabilityPolicy API.
    fullName: allowProtectedAppendWrites
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowProtectedAppendWrites?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: allowProtectedAppendWritesAll
    uid: >-
      @azure/provisioning-storage.types.ImmutabilityPolicyPropertyInput.allowProtectedAppendWritesAll
    package: '@azure/provisioning-storage'
    summary: >-
      This property can only be changed for unlocked time-based retention
      policies. When enabled, new blocks can be written to both 'Append and Bock
      Blobs' while maintaining immutability protection and compliance. Only new
      blocks can be added and any existing blocks cannot be modified or deleted.
      This property cannot be changed with ExtendImmutabilityPolicy API. The
      'allowProtectedAppendWrites' and 'allowProtectedAppendWritesAll'
      properties are mutually exclusive.
    fullName: allowProtectedAppendWritesAll
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowProtectedAppendWritesAll?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: immutabilityPeriodSinceCreationInDays
    uid: >-
      @azure/provisioning-storage.types.ImmutabilityPolicyPropertyInput.immutabilityPeriodSinceCreationInDays
    package: '@azure/provisioning-storage'
    summary: >-
      The immutability period for the blobs in the container since the policy
      creation, in days.
    fullName: immutabilityPeriodSinceCreationInDays
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'immutabilityPeriodSinceCreationInDays?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
extends: >-
