### YamlMime:TSTypeAlias
name: WriteLockState
uid: '@azure/arm-providerhub.WriteLockState'
package: '@azure/arm-providerhub'
summary: >-
  The state of the write lock feature. \

  [KnownWriteLockState](xref:@azure/arm-providerhub.KnownWriteLockState) can be
  used interchangeably with WriteLockState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: The write lock feature is disabled. The write-operations on the
  resource will follow the last-write-wins semantics when the write lock feature
  is disabled. \

  **Enabled**: The write lock feature is enabled. Ensures that only one
  write-operation i.e., PUT, PATCH and DELETE, is allowed on a resource at any
  given time. Other concurrent write-operations, if any, will be rejected until
  the lock on the resource is released by the ongoing write-operation. The
  feature overrides the 'resourceConcurrencyControlOptions'.
fullName: WriteLockState
remarks: ''
isDeprecated: false
syntax: |
  type WriteLockState = string
