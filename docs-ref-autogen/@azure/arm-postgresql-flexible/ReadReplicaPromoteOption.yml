### YamlMime:TSTypeAlias
name: ReadReplicaPromoteOption
uid: '@azure/arm-postgresql-flexible.ReadReplicaPromoteOption'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Data synchronization option to use when processing the operation specified in
  the promoteMode property. This property is write only. \

  [KnownReadReplicaPromoteOption](xref:@azure/arm-postgresql-flexible.KnownReadReplicaPromoteOption)
  can be used interchangeably with ReadReplicaPromoteOption,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Planned**: Wait for data in the read replica to be fully synchronized with
  its source server before it initiates the operation. \

  **Forced**: Initiate the operation immediately, without waiting for data in
  the read replica to be synchronized with its source server.
fullName: ReadReplicaPromoteOption
remarks: ''
isDeprecated: false
syntax: |
  type ReadReplicaPromoteOption = string
