### YamlMime:TSType
name: HorizonDbClusterManagedServiceIdentityUpdate
uid: '@azure/arm-horizondb.HorizonDbClusterManagedServiceIdentityUpdate'
package: '@azure/arm-horizondb'
summary: >-
  The user-assigned managed identities assigned to a HorizonDB cluster. Omitting
  the entire top-level identity property from PUT or PATCH preserves all current
  assignments. When userAssignedIdentities is supplied, PUT replaces the
  complete set and PATCH merges the supplied entries with the existing set; a
  null PATCH entry removes that individual identity. Setting type to None clears
  all assignments. Removing an identity referenced by a change data capture
  identity assignment is rejected until the referencing assignment is deleted.
fullName: HorizonDbClusterManagedServiceIdentityUpdate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: type
    uid: '@azure/arm-horizondb.HorizonDbClusterManagedServiceIdentityUpdate.type'
    package: '@azure/arm-horizondb'
    summary: >-
      The managed identity type assigned to the cluster. Setting this property
      to None clears all managed identity assignments.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: string'
      return:
        description: ''
        type: string
  - name: userAssignedIdentities
    uid: >-
      @azure/arm-horizondb.HorizonDbClusterManagedServiceIdentityUpdate.userAssignedIdentities
    package: '@azure/arm-horizondb'
    summary: >-
      The user-assigned managed identities associated with the cluster. When
      supplied on PUT, this dictionary replaces the complete set of assignments.
      When supplied on PATCH, entries are merged with the existing set and a
      null value removes the corresponding identity. Each dictionary key must be
      the full Azure resource ID of a
      Microsoft.ManagedIdentity/userAssignedIdentities resource. Non-null
      request values can be empty objects; response values contain the
      service-populated clientId and principalId. Assigning an identity does not
      grant it access to destination resources; required role assignments must
      be configured separately.
    fullName: userAssignedIdentities
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'userAssignedIdentities?: Record<string, UserAssignedIdentityUpdate>'
      return:
        description: ''
        type: >-
          Record&lt;string, <xref
          uid="@azure/arm-horizondb.UserAssignedIdentityUpdate" />&gt;
