### YamlMime:TSEnum
name: KnownLoadBalancerSku
uid: '@azure/arm-containerservice.KnownLoadBalancerSku'
package: '@azure/arm-containerservice'
summary: >-
  The load balancer sku for the managed cluster. The default is 'standard'. See
  [Azure Load Balancer
  SKUs](https://docs.microsoft.com/azure/load-balancer/skus) for more
  information about the differences between load balancer SKUs.
fullName: KnownLoadBalancerSku
remarks: ''
isDeprecated: false
fields:
  - name: Basic
    uid: '@azure/arm-containerservice.KnownLoadBalancerSku.Basic'
    package: '@azure/arm-containerservice'
    summary: Use a basic Load Balancer with limited functionality.
  - name: Service
    uid: '@azure/arm-containerservice.KnownLoadBalancerSku.Service'
    package: '@azure/arm-containerservice'
    summary: >-
      Use a service Load Balancer, with native pod-level load balancing. This
      SKU is specifically built to scale for container-based workloads, with a
      single instance utilized for each application. For more information, see
      https://aka.ms/aks/container-native-slb
  - name: Standard
    uid: '@azure/arm-containerservice.KnownLoadBalancerSku.Standard'
    package: '@azure/arm-containerservice'
    summary: >-
      Use a a standard Load Balancer. This is the recommended Load Balancer SKU.
      For more information about on working with the load balancer in the
      managed cluster, see the [standard Load
      Balancer](https://docs.microsoft.com/azure/aks/load-balancer-standard)
      article.
