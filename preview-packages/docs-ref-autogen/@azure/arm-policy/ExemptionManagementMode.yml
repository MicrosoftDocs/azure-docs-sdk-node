### YamlMime:TSTypeAlias
name: ExemptionManagementMode
uid: '@azure/arm-policy.ExemptionManagementMode'
package: '@azure/arm-policy'
summary: >-
  The mode indicating how the policy exemption is managed. Possible values are
  Admin and UserSelfServe. \

  [KnownExemptionManagementMode](xref:@azure/arm-policy.KnownExemptionManagementMode)
  can be used interchangeably with ExemptionManagementMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Admin**: This mode means the exemption is managed by an administrator and
  requires permission for the policy exemption action. \

  **UserSelfServe**: This mode means the exemption is managed by the user it
  applies to, through the self-serve exemption settings on the policy
  assignment.
fullName: ExemptionManagementMode
remarks: ''
isDeprecated: false
syntax: |
  type ExemptionManagementMode = string
