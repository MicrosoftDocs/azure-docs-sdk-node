name: ImmutabilityStatus
uid: '@azure/arm-sql.ImmutabilityStatus'
package: '@azure/arm-sql'
summary: >-
  The immutability status of the backups governed by this short term retention
  policy. \

  [KnownImmutabilityStatus](xref:@azure/arm-sql.KnownImmutabilityStatus) can be
  used interchangeably with ImmutabilityStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

