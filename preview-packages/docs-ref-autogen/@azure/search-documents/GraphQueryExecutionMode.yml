name: GraphQueryExecutionMode
uid: '@azure/search-documents.GraphQueryExecutionMode'
package: '@azure/search-documents'
summary: >-
  Whether a graph query is executed or only planned. \

  [KnownGraphQueryExecutionMode](xref:@azure/search-documents.KnownGraphQueryExecutionMode)
  can be used interchangeably with GraphQueryExecutionMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **execute**: Build and execute the graph plan. \

  **planOnly**: Build the graph plan without executing backend searches.
