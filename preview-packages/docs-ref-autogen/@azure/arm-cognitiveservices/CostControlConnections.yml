### YamlMime:TSType
name: CostControlConnections
uid: '@azure/arm-cognitiveservices.CostControlConnections'
package: '@azure/arm-cognitiveservices'
summary: >-
  Defines account-level connections used to publish cost-control telemetry and
  events.

  Application Insights is optional and may be removed while policies remain
  attached.

  Event Grid is required for alerts; supplied connection references must still
  be valid.
fullName: CostControlConnections
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: appInsightsConnectionId
    uid: >-
      @azure/arm-cognitiveservices.CostControlConnections.appInsightsConnectionId
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Gets or sets the full resource ID of the optional Application Insights
      connection.
    fullName: appInsightsConnectionId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'appInsightsConnectionId?: string'
      return:
        description: ''
        type: string
  - name: eventGridConnectionId
    uid: '@azure/arm-cognitiveservices.CostControlConnections.eventGridConnectionId'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The full resource ID of the Event Grid connection used for cost control
      alerts. This connection must be configured when an attached cost control
      contains an alert threshold action and cannot be removed while such an
      action remains attached.
    fullName: eventGridConnectionId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'eventGridConnectionId?: string'
      return:
        description: ''
        type: string
