### YamlMime:TSType
name: KnowledgeSourceCache
uid: '@azure/search-documents.KnowledgeSourceCache'
package: '@azure/search-documents'
summary: >-
  Configures storage for cached knowledge source enrichment results. Requires a
  GPv2 storage account with Blob and Table endpoints. The cache storage binding
  and identity cannot be changed after creation, and the cache cannot be removed
  while using the graph extraction workflow.
fullName: KnowledgeSourceCache
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: enableReprocessing
    uid: '@azure/search-documents.KnowledgeSourceCache.enableReprocessing'
    package: '@azure/search-documents'
    summary: >-
      Whether cached enrichment results can be reprocessed when the enrichment
      configuration changes. Must be true for graph extraction cache replay.
    fullName: enableReprocessing
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enableReprocessing?: boolean'
      return:
        description: ''
        type: boolean
  - name: identity
    uid: '@azure/search-documents.KnowledgeSourceCache.identity'
    package: '@azure/search-documents'
    summary: >-
      The managed identity used to connect to the enrichment cache. If omitted
      for a ResourceId connection string, the system-assigned managed identity
      is used. The identity cannot be changed after the cache is configured.
    fullName: identity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'identity?: SearchIndexerDataIdentityUnion'
      return:
        description: ''
        type: <xref uid="@azure/search-documents.SearchIndexerDataIdentityUnion" />
  - name: storageConnectionString
    uid: '@azure/search-documents.KnowledgeSourceCache.storageConnectionString'
    package: '@azure/search-documents'
    summary: >-
      The connection string to the storage account where cached enrichment
      results are persisted.
    fullName: storageConnectionString
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'storageConnectionString: string'
      return:
        description: ''
        type: string
