  - name: calculateCost
    uid: >-
      @azure/arm-containerserviceaimanager.CustomAIModelsOperations.calculateCost
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      Returns a ranked list of GPU SKU pricing plans for deploying this custom
      model in the target region, each annotated with feasibility and
      per-replica hourly cost. Feasibility is determined by region availability,
      GPU quota, and model architecture fit (verified at registration time).
      `servingPerformanceEstimation` is omitted for custom models. No Azure or
      Kubernetes resources are provisioned.
    fullName: calculateCost
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
