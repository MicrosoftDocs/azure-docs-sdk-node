name: SmbOplocks
uid: '@azure/arm-netapp.SmbOplocks'
package: '@azure/arm-netapp'
summary: >-
  SMB opportunistic-lock setting shared by volume and cache resources. Omit the
  property when unspecified. \

  [KnownSmbOplocks](xref:@azure/arm-netapp.KnownSmbOplocks) can be used
  interchangeably with SmbOplocks,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: SMB opportunistic locks share setting is disabled. \

  **Enabled**: SMB opportunistic locks share setting is enabled.
