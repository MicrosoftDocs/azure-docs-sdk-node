### YamlMime:TSTypeAlias
name: IpAddressType
uid: '@azure/arm-servicebus.IpAddressType'
package: '@azure/arm-servicebus'
summary: >-
  The IP address type for the namespace. Determines whether the namespace
  supports IPv4 only or both IPv4 and IPv6 (dual stack). \

  [KnownIpAddressType](xref:@azure/arm-servicebus.KnownIpAddressType) can be
  used interchangeably with IpAddressType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **IPv4**: The namespace supports IPv4 addresses only. \

  **DualStack**: The namespace supports both IPv4 and IPv6 addresses (dual
  stack).
fullName: IpAddressType
remarks: ''
isDeprecated: false
syntax: |
  type IpAddressType = string
