name: CloudShellProfileMode
uid: '@azure/arm-containerservice.CloudShellProfileMode'
package: '@azure/arm-containerservice'
summary: >-
  Cloud Shell connectivity mode. \

  [KnownCloudShellProfileMode](xref:@azure/arm-containerservice.KnownCloudShellProfileMode)
  can be used interchangeably with CloudShellProfileMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: Cloud Shell connectivity is disabled. \

  **Managed**: Cloud Shell connectivity uses network resources managed by AKS. \

  **Custom**: Cloud Shell connectivity uses network resources provided by the
  user.
