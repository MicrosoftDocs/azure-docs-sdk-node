### YamlMime:TSEnum
name: KnownIndexerPermissionOption
uid: '@azure/search-documents.KnownIndexerPermissionOption'
package: '@azure/search-documents'
summary: Options with various types of permission data to index.
fullName: KnownIndexerPermissionOption
remarks: ''
isDeprecated: false
fields:
  - name: GroupIds
    uid: '@azure/search-documents.KnownIndexerPermissionOption.GroupIds'
    package: '@azure/search-documents'
    summary: Indexer to ingest ACL groupIds from data source to index.
  - name: OneLakeLakehouseId
    uid: '@azure/search-documents.KnownIndexerPermissionOption.OneLakeLakehouseId'
    package: '@azure/search-documents'
    summary: >-
      For OneLake data sources only, ingest the source item's lakehouse ID for
      mapping to an index field with permissionFilter 'oneLakeLakehouseId'. The
      index must also specify 'oneLakeSecuritySource'.
  - name: OneLakeParentFolders
    uid: '@azure/search-documents.KnownIndexerPermissionOption.OneLakeParentFolders'
    package: '@azure/search-documents'
    summary: >-
      For OneLake data sources only, ingest all ancestor folder paths from
      '/Files' through the immediate parent, excluding the file name, as the
      string collection 'metadata_onelake_parent_folders'. Use indexer
      fieldMappings to map this source metadata to a filterable
      Collection(Edm.String) field with permissionFilter 'oneLakeParentFolders';
      index projections use source '/document/metadata_onelake_parent_folders'.
      The index must also specify 'oneLakeSecuritySource'.
  - name: RbacScope
    uid: '@azure/search-documents.KnownIndexerPermissionOption.RbacScope'
    package: '@azure/search-documents'
    summary: Indexer to ingest Azure RBAC scope from data source to index.
  - name: UserIds
    uid: '@azure/search-documents.KnownIndexerPermissionOption.UserIds'
    package: '@azure/search-documents'
    summary: Indexer to ingest ACL userIds from data source to index.
