### YamlMime:TSTypeAlias
name: StatusType
uid: '@azure/arm-redhatopenshifthcp.StatusType'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  Representation of the possible values of a condition status. \

  [KnownStatusType](xref:@azure/arm-redhatopenshifthcp.KnownStatusType) can be
  used interchangeably with StatusType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **True**: Indicates that the condition status is True. \

  **False**: Indicates that the condition status is False. \

  **Unknown**: Indicates that the condition status is unknown.
fullName: StatusType
remarks: ''
isDeprecated: false
syntax: |
  type StatusType = string
