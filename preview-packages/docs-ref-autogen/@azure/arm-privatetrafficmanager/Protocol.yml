### YamlMime:TSTypeAlias
name: Protocol
uid: '@azure/arm-privatetrafficmanager.Protocol'
package: '@azure/arm-privatetrafficmanager'
summary: >-
  The protocol (HTTP, HTTPS or TCP) used to probe for endpoint health. \

  [KnownProtocol](xref:@azure/arm-privatetrafficmanager.KnownProtocol) can be
  used interchangeably with Protocol,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **HTTP**: Hypertext Transfer Protocol for health probing. \

  **HTTPS**: Hypertext Transfer Protocol Secure for health probing. \

  **TCP**: Transmission Control Protocol for health probing.
fullName: Protocol
remarks: ''
isDeprecated: false
syntax: |
  type Protocol = string
