### YamlMime:TSTypeAlias
name: PlacementScoreValue
uid: '@azure/arm-computerecommender.PlacementScoreValue'
package: '@azure/arm-computerecommender'
summary: >-
  Placement score value indicating the likelihood of successfully allocating the
  requested VM(s). \

  [KnownPlacementScoreValue](xref:@azure/arm-computerecommender.KnownPlacementScoreValue)
  can be used interchangeably with PlacementScoreValue,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **High**: High likelihood of successful allocation. \

  **Medium**: Medium likelihood of successful allocation. \

  **Low**: Low likelihood of successful allocation. \

  **RestrictedSkuNotAvailable**: The requested SKU is restricted and not
  available. \

  **InsufficientQuota**: Insufficient quota is available to fulfill the request.
  \

  **DataNotFoundOrStale**: Data was not found or is stale.
fullName: PlacementScoreValue
remarks: ''
isDeprecated: false
syntax: |
  type PlacementScoreValue = string
