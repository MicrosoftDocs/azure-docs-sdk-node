### YamlMime:TSTypeAlias
name: OperationalStatusStates
uid: '@azure/arm-sovereign.OperationalStatusStates'
package: '@azure/arm-sovereign'
summary: >-
  The overall operational status states for a sovereign view. \

  [KnownOperationalStatusStates](xref:@azure/arm-sovereign.KnownOperationalStatusStates)
  can be used interchangeably with OperationalStatusStates,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Healthy**: The sovereign view is healthy and fully operational. \

  **Unhealthy**: The sovereign view is unhealthy and its operability is
  impacted. \

  **Unknown**: The operational status of the sovereign view could not be
  determined.
fullName: OperationalStatusStates
remarks: ''
isDeprecated: false
syntax: |
  type OperationalStatusStates = string
