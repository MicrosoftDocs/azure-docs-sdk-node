name: ResolutionStrategy
uid: '@azure/arm-azurestackhci.ResolutionStrategy'
package: '@azure/arm-azurestackhci'
summary: >-
  Strategy for resolving configuration drift. \

  [KnownResolutionStrategy](xref:@azure/arm-azurestackhci.KnownResolutionStrategy)
  can be used interchangeably with ResolutionStrategy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ApplyDesired**: Trust Cloud. Push the desiredConfiguration down to the
  device. \

  **AcceptReported**: Trust Device. Update the desiredConfiguration in ARM to
  match the reported state.
fullName: ResolutionStrategy
remarks: ''
isDeprecated: false
syntax: |
  type ResolutionStrategy = string
