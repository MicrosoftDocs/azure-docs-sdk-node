### YamlMime:TSType
name: RebalanceJobPropertiesStatus
uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus'
package: '@azure/arm-storagecache'
summary: The status of the rebalance job.
fullName: RebalanceJobPropertiesStatus
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: balancePercent
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.balancePercent'
    package: '@azure/arm-storagecache'
    summary: >-
      The balance percentage (0-100). Represents cumulative progress since the
      rebalance started. Reported in periodic rebalance status updates. Resets
      to 0 if the rebalancer node restarts.
    fullName: balancePercent
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'balancePercent?: number'
      return:
        description: ''
        type: number
  - name: bytesMoved
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.bytesMoved'
    package: '@azure/arm-storagecache'
    summary: >-
      Total number of bytes moved since the rebalance started. Reported in
      periodic rebalance status updates. Resets to 0 if the rebalancer node
      restarts.
    fullName: bytesMoved
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'bytesMoved?: number'
      return:
        description: ''
        type: number
  - name: completionTimeUTC
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.completionTimeUTC'
    package: '@azure/arm-storagecache'
    summary: >-
      The time (in UTC) when the rebalance job completed. Only populated when
      the job reaches a terminal state (Completed, Failed, or Canceled).
    fullName: completionTimeUTC
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'completionTimeUTC?: Date'
      return:
        description: ''
        type: Date
  - name: dirsMigrated
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.dirsMigrated'
    package: '@azure/arm-storagecache'
    summary: >-
      Total number of directories migrated since the rebalance started. Counts
      MDT-phase (metadata) work items, reported separately from filesMigrated
      (OST-phase data migrations). Reported in periodic rebalance status
      updates. Resets to 0 if the rebalancer node restarts.
    fullName: dirsMigrated
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'dirsMigrated?: number'
      return:
        description: ''
        type: number
  - name: estimatedRemainingSeconds
    uid: >-
      @azure/arm-storagecache.RebalanceJobPropertiesStatus.estimatedRemainingSeconds
    package: '@azure/arm-storagecache'
    summary: >-
      Estimated remaining time in seconds. Omitted during initial assessment
      before the rebalancer has enough data to estimate.
    fullName: estimatedRemainingSeconds
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'estimatedRemainingSeconds?: number'
      return:
        description: ''
        type: number
  - name: filesMigrated
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.filesMigrated'
    package: '@azure/arm-storagecache'
    summary: >-
      Total number of files migrated since the rebalance started. Counts
      OST-phase (data) work items. Reported in periodic rebalance status
      updates. Resets to 0 if the rebalancer node restarts.
    fullName: filesMigrated
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'filesMigrated?: number'
      return:
        description: ''
        type: number
  - name: filesMovedPerSecond
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.filesMovedPerSecond'
    package: '@azure/arm-storagecache'
    summary: Average files moved per second over the most recent reporting interval.
    fullName: filesMovedPerSecond
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'filesMovedPerSecond?: number'
      return:
        description: ''
        type: number
  - name: percentComplete
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.percentComplete'
    package: '@azure/arm-storagecache'
    summary: The percentage of rebalance job completion.
    fullName: percentComplete
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'percentComplete?: number'
      return:
        description: ''
        type: number
  - name: startTimeUTC
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.startTimeUTC'
    package: '@azure/arm-storagecache'
    summary: The time (in UTC) the rebalance job started.
    fullName: startTimeUTC
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'startTimeUTC?: Date'
      return:
        description: ''
        type: Date
  - name: state
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.state'
    package: '@azure/arm-storagecache'
    summary: >-
      The operational state of the rebalance job. InProgress indicates the
      rebalance is running on the cluster. Cancelling indicates a cancel has
      been requested. Canceled indicates the rebalance was cancelled. Completed
      indicates the rebalance finished successfully. Failed indicates the
      rebalance was unable to complete due to a fatal error. Deleting indicates
      the job is being cleaned up during deletion. RollingBack indicates the
      orchestrator is rolling back provisioned resources after a failure.
    fullName: state
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'state?: string'
      return:
        description: ''
        type: string
  - name: statusCode
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.statusCode'
    package: '@azure/arm-storagecache'
    summary: Server-defined status code for rebalance job.
    fullName: statusCode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'statusCode?: string'
      return:
        description: ''
        type: string
  - name: statusMessage
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.statusMessage'
    package: '@azure/arm-storagecache'
    summary: Server-defined status message for rebalance job.
    fullName: statusMessage
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'statusMessage?: string'
      return:
        description: ''
        type: string
  - name: throughputMiBps
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.throughputMiBps'
    package: '@azure/arm-storagecache'
    summary: >-
      Average throughput in mebibytes per second (1024x1024 bytes per second)
      over the most recent reporting interval.
    fullName: throughputMiBps
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'throughputMiBps?: number'
      return:
        description: ''
        type: number
  - name: totalErrors
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.totalErrors'
    package: '@azure/arm-storagecache'
    summary: >-
      Total cumulative non-skip errors since the rebalance started. Reported in
      periodic rebalance status updates. Resets to 0 if the rebalancer node
      restarts.
    fullName: totalErrors
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'totalErrors?: number'
      return:
        description: ''
        type: number
  - name: totalSkipped
    uid: '@azure/arm-storagecache.RebalanceJobPropertiesStatus.totalSkipped'
    package: '@azure/arm-storagecache'
    summary: >-
      Total cumulative benign skips since the rebalance started: files
      intentionally not migrated (for example, a lost migration lease or a stale
      layout), as distinct from the hard failures counted in totalErrors.
      Reported in periodic rebalance status updates. Resets to 0 if the
      rebalancer node restarts.
    fullName: totalSkipped
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'totalSkipped?: number'
      return:
        description: ''
        type: number
