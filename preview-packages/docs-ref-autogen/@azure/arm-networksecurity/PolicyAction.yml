name: PolicyAction
uid: '@azure/arm-networksecurity.PolicyAction'
package: '@azure/arm-networksecurity'
summary: >-
  The action to take when a network security policy or rule matches traffic. \

  [KnownPolicyAction](xref:@azure/arm-networksecurity.KnownPolicyAction) can be
  used interchangeably with PolicyAction,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Allow**: Allow the matching traffic. \

  **Deny**: Deny the matching traffic.
