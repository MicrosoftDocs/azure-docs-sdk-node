### YamlMime:TSTypeAlias
name: StorageInitiatorType
uid: '@azure/arm-azurestackhci.StorageInitiatorType'
package: '@azure/arm-azurestackhci'
summary: >-
  Transport type of a storage fabric initiator port on the edge machine. \

  [KnownStorageInitiatorType](xref:@azure/arm-azurestackhci.KnownStorageInitiatorType)
  can be used interchangeably with StorageInitiatorType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **iSCSI**: iSCSI initiator. The initiator identifier is an IQN (iSCSI
  Qualified Name). \

  **FibreChannel**: Fibre Channel initiator. The initiator identifier is the
  node WWN (WWNN); the port is identified by its WWPN. \

  **Unknown**: The initiator transport type could not be determined.
fullName: StorageInitiatorType
remarks: ''
isDeprecated: false
syntax: |
  type StorageInitiatorType = string
