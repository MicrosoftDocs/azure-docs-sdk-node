  - name: query
    uid: '@azure/ai-projects.VoiceAgentRealtimeClientConnectOptions.query'
    package: '@azure/ai-projects'
    summary: >-
      Additional query parameters for this connection's WebSocket upgrade URL.

      Provide a plain object, including a null-prototype object.

      Values override matching endpoint query parameters; `undefined` removes a
      parameter.

      Values are URL-encoded automatically. Numbers must be finite.

      SDK-managed parameters, authentication parameters, and names starting with
      `h-` are

      reserved (case-insensitively) and cause a `TypeError`. Use the
      corresponding typed

      options for session, version, storage, transport, and structured prompt
      inputs instead.

      Both `structured_input` and `structured_inputs` are reserved.

      Do not include secrets: query parameters can appear in server or proxy
      logs.
    fullName: query
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'query?: Readonly<Record<string, string | number | boolean | undefined>>'
      return:
        description: ''
        type: >-
          Readonly&lt;Record&lt;string, string | number | boolean |
          undefined&gt;&gt;
  - name: store
    uid: '@azure/ai-projects.VoiceAgentRealtimeClientConnectOptions.store'
    package: '@azure/ai-projects'
    summary: Overrides whether the conversation created by this session is persisted.
    fullName: store
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'store?: boolean'
