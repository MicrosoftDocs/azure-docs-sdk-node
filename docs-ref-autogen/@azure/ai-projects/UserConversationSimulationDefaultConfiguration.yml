### YamlMime:TSType
name: UserConversationSimulationDefaultConfiguration
uid: '@azure/ai-projects.UserConversationSimulationDefaultConfiguration'
package: '@azure/ai-projects'
summary: >-
  Configures default conversation behavior and optional run-wide persistence of
  generated conversations.
fullName: UserConversationSimulationDefaultConfiguration
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio_effects
    uid: >-
      @azure/ai-projects.UserConversationSimulationDefaultConfiguration.audio_effects
    package: '@azure/ai-projects'
    summary: >-
      Audio effects applied to voice conversation simulations. This property is
      ignored for text-only simulations.
    fullName: audio_effects
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio_effects?: UserConversationSimulationAudioEffectsConfiguration'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/ai-projects.UserConversationSimulationAudioEffectsConfiguration"
          />
  - name: conversation_repetitions
    uid: >-
      @azure/ai-projects.UserConversationSimulationDefaultConfiguration.conversation_repetitions
    package: '@azure/ai-projects'
    summary: >-
      Number of independent conversation repetitions for each test case.
      Defaults to 1 when not specified at either the data-source or test-case
      level.
    fullName: conversation_repetitions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'conversation_repetitions?: number'
      return:
        description: ''
        type: number
  - name: desired_num_turns
    uid: >-
      @azure/ai-projects.UserConversationSimulationDefaultConfiguration.desired_num_turns
    package: '@azure/ai-projects'
    summary: >-
      Target number of turns in each conversation. The effective value cannot
      exceed the effective `max_num_turns`. When omitted, no target is set and
      the simulation model determines the conversation length dynamically from
      the scenario.
    fullName: desired_num_turns
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'desired_num_turns?: number'
      return:
        description: ''
        type: number
  - name: enable_conversation_dataset_generation
    uid: >-
      @azure/ai-projects.UserConversationSimulationDefaultConfiguration.enable_conversation_dataset_generation
    package: '@azure/ai-projects'
    summary: >-
      Whether to write all generated conversations to a versioned Foundry
      dataset. When enabled, the completed run includes a
      `simulated_user_conversations` entry in `output_datasets`. When omitted,
      the service defaults to `false`.
    fullName: enable_conversation_dataset_generation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enable_conversation_dataset_generation?: boolean'
      return:
        description: ''
        type: boolean
  - name: max_num_turns
    uid: >-
      @azure/ai-projects.UserConversationSimulationDefaultConfiguration.max_num_turns
    package: '@azure/ai-projects'
    summary: >-
      Hard limit on turns in each conversation. When omitted, the service
      defaults to 20.
    fullName: max_num_turns
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_num_turns?: number'
      return:
        description: ''
        type: number
  - name: output_conversation_dataset_name
    uid: >-
      @azure/ai-projects.UserConversationSimulationDefaultConfiguration.output_conversation_dataset_name
    package: '@azure/ai-projects'
    summary: >-
      Name of the dataset to which generated conversations are written. This
      property is used only when `enable_conversation_dataset_generation` is
      `true`. When omitted, the service generates a dataset name.
    fullName: output_conversation_dataset_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'output_conversation_dataset_name?: string'
      return:
        description: ''
        type: string
  - name: user_behavior
    uid: >-
      @azure/ai-projects.UserConversationSimulationDefaultConfiguration.user_behavior
    package: '@azure/ai-projects'
    summary: Conversation behavior of the simulated user.
    fullName: user_behavior
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'user_behavior?: UserConversationSimulationUserBehaviorConfiguration'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/ai-projects.UserConversationSimulationUserBehaviorConfiguration"
          />
