    package: '@azure/ai-projects'
    summary: The Unix timestamp (in seconds) for when the response was created.
    fullName: created_at
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'created_at?: Date'
      return:
        description: ''
        type: Date
  - name: id
    uid: '@azure/ai-projects.VoiceResponse.id'
    package: '@azure/ai-projects'
    summary: The unique id of the response.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id: string'
      return:
        description: ''
        type: string
  - name: metadata
    uid: '@azure/ai-projects.VoiceResponse.metadata'
    package: '@azure/ai-projects'
    summary: A set of key-value pairs attached to the response.
    fullName: metadata
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'metadata?: Record<string, string>'
      return:
