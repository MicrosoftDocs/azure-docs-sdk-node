### YamlMime:TSType
name: KnowledgeBaseToolKnowledgeSourceReference
uid: '@azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference'
package: '@azure/search-documents'
summary: >-
  A reference to an existing knowledge source and a selected subset of persisted
  retrieval defaults, not the complete request-time parameter model. The
  referenced source determines the kind; incompatible defaults are rejected when
  the knowledge base is saved. Explicit retrieve-request values take precedence,
  except filters are combined with AND.
fullName: KnowledgeBaseToolKnowledgeSourceReference
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: alwaysQuerySource
    uid: >-
      @azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference.alwaysQuerySource
    package: '@azure/search-documents'
    summary: >-
      Whether the source must be queried. Not supported for MCP server sources.
      An explicit request exclusion takes precedence.
    fullName: alwaysQuerySource
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'alwaysQuerySource?: boolean'
      return:
        description: ''
        type: boolean
  - name: failOnError
    uid: >-
      @azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference.failOnError
    package: '@azure/search-documents'
    summary: Whether retrieval should fail if this source encounters an error.
    fullName: failOnError
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'failOnError?: boolean'
      return:
        description: ''
        type: boolean
  - name: filterAddOn
    uid: >-
      @azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference.filterAddOn
    package: '@azure/search-documents'
    summary: >-
      An additional OData filter for search index sources. Rejected for
      unsupported source kinds when the knowledge base is saved. Combined with
      source and request filters using AND.
    fullName: filterAddOn
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'filterAddOn?: string'
      return:
        description: ''
        type: string
  - name: maxOutputDocuments
    uid: >-
      @azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference.maxOutputDocuments
    package: '@azure/search-documents'
    summary: >-
      The maximum number of documents retrieved from this source, between 50 and
      200.
    fullName: maxOutputDocuments
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxOutputDocuments?: number'
      return:
        description: ''
        type: number
  - name: name
    uid: '@azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference.name'
    package: '@azure/search-documents'
    summary: The name of a knowledge source in the knowledge base.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: rerankerThreshold
    uid: >-
      @azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference.rerankerThreshold
    package: '@azure/search-documents'
    summary: >-
      The minimum reranker score for returned documents. Requires reranking to
      be enabled.
    fullName: rerankerThreshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'rerankerThreshold?: number'
      return:
        description: ''
        type: number
