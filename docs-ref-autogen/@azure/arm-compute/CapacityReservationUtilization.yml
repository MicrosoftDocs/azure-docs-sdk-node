### YamlMime:TSType
name: CapacityReservationUtilization
uid: '@azure/arm-compute.CapacityReservationUtilization'
package: '@azure/arm-compute'
summary: >-
  Represents the capacity reservation utilization in terms of resources
  allocated.
fullName: CapacityReservationUtilization
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: currentCapacity
    uid: '@azure/arm-compute.CapacityReservationUtilization.currentCapacity'
    package: '@azure/arm-compute'
    summary: >-
      The value provides the current capacity of the VM size which was reserved
      successfully and for which the customer is getting billed. Minimum
      api-version: 2022-08-01.
    fullName: currentCapacity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'currentCapacity?: number'
      return:
        description: ''
        type: number
  - name: usedReservedCountBySubscription
    uid: >-
      @azure/arm-compute.CapacityReservationUtilization.usedReservedCountBySubscription
    package: '@azure/arm-compute'
    summary: >-
      For open capacity reservations, this provides a map of the used reserved
      capacity count keyed by the subscription id (a GUID) that is consuming the
      capacity, i.e. each entry maps a consuming subscription id to the count of
      reserved capacity it is currently using. This is populated only for open
      capacity reservations and is not reported for targeted and block capacity
      reservations, which instead report allocation through
      virtualMachinesAllocated. Minimum api-version: 2026-04-01.
    fullName: usedReservedCountBySubscription
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'usedReservedCountBySubscription?: Record<string, number>'
      return:
        description: ''
        type: Record&lt;string, number&gt;
  - name: virtualMachinesAllocated
    uid: '@azure/arm-compute.CapacityReservationUtilization.virtualMachinesAllocated'
    package: '@azure/arm-compute'
    summary: >-
      A list of all virtual machines resource ids allocated against the capacity
      reservation.
    fullName: virtualMachinesAllocated
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'virtualMachinesAllocated?: SubResourceReadOnly[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute.SubResourceReadOnly" />[]
