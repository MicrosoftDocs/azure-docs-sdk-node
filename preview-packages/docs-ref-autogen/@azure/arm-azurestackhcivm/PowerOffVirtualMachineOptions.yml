### YamlMime:TSType
name: PowerOffVirtualMachineOptions
uid: '@azure/arm-azurestackhcivm.PowerOffVirtualMachineOptions'
package: '@azure/arm-azurestackhcivm'
summary: >-
  The operation gracefully shuts down a virtual machine by requesting the
  operating system to shut down. The virtual machine can be restarted with the
  same provisioned resources. To force an immediate shut down, see the
  skipShutdown flag.
fullName: PowerOffVirtualMachineOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: skipShutdown
    uid: '@azure/arm-azurestackhcivm.PowerOffVirtualMachineOptions.skipShutdown'
    package: '@azure/arm-azurestackhcivm'
    summary: >-
      Indicates whether to perform an immediate shut down. When set to true, the
      VM is forcefully shut down. If not specified, the default value is false,
      and the operation attempts a graceful shut down of the VM.
    fullName: skipShutdown
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'skipShutdown?: boolean'
      return:
        description: ''
        type: boolean
