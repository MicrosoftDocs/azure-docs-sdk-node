### YamlMime:TSType
name: VoiceAudioItem
uid: '@azure/ai-projects.VoiceAudioItem'
package: '@azure/ai-projects'
summary: >-
  Metadata for a single conversation item's audio segment. For
  bring-your-own-storage (BYOS), the response includes

  `blob_uri`, a direct customer-storage URI without a SAS token, that the
  customer accesses with their own

  credentials. For Foundry-managed storage, `blob_uri` is absent and the bytes
  are streamed through the item's

  `/audio/content` route.
fullName: VoiceAudioItem
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: blob_uri
    uid: '@azure/ai-projects.VoiceAudioItem.blob_uri'
    package: '@azure/ai-projects'
    summary: >-
      For bring-your-own-storage (BYOS) recordings only: the URI of the
      recording in the customer's own storage, without a SAS token. The customer
      downloads it using their own storage credentials. Absent for
      Foundry-managed storage, where the bytes are streamed via the item's
      `/audio/content` route instead.
    fullName: blob_uri
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'blob_uri?: string'
      return:
        description: ''
        type: string
  - name: channels
