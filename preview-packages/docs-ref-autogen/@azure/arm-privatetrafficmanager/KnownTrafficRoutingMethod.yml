fields:
  - name: Priority
    uid: '@azure/arm-privatetrafficmanager.KnownTrafficRoutingMethod.Priority'
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      Routes traffic to endpoints based on priority values, directing to the
      highest priority available endpoint.
  - name: VNet
    uid: '@azure/arm-privatetrafficmanager.KnownTrafficRoutingMethod.VNet'
