### YamlMime:TSTypeAlias
name: AuthorizationScopeFilter
uid: '@azure/arm-terraform.AuthorizationScopeFilter'
package: '@azure/arm-terraform'
summary: >-
  The Azure Resource Graph Authorization Scope Filter parameter \

  [KnownAuthorizationScopeFilter](xref:@azure/arm-terraform.KnownAuthorizationScopeFilter)
  can be used interchangeably with AuthorizationScopeFilter,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AtScopeAndBelow**: Returns assignments for the given scope and all child
  scopes. \

  **AtScopeAndAbove**: Returns assignments for the given scope and all parent
  scopes, but not child scopes. \

  **AtScopeAboveAndBelow**: Returns assignments for the given scope, all parent
  scopes, and all child scopes. \

  **AtScopeExact**: Returns assignments only for the given scope; no parent or
  child scopes are included.
fullName: AuthorizationScopeFilter
remarks: ''
isDeprecated: false
syntax: |
  type AuthorizationScopeFilter = string
