### YamlMime:TSType
name: LiveClientEventLiveInstructionsAppendParam
uid: '@azure/ai-projects.LiveClientEventLiveInstructionsAppendParam'
package: '@azure/ai-projects'
summary: >-
  Append developer instructions to the Live conversation while it is running,
  optionally associating them with an existing client delegation. Rejected while
  an audio fixture is active. These instructions remain in conversation history
  through compaction and are included in future backend delegations. For
  external audio, describe content already delivered so the assistant does not
  repeat it.
fullName: LiveClientEventLiveInstructionsAppendParam
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: content
    uid: '@azure/ai-projects.LiveClientEventLiveInstructionsAppendParam.content'
    package: '@azure/ai-projects'
    summary: >-
      Instruction text to append, limited to 500 tokens. This is a plain string,
      not an array of content parts.
    fullName: content
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'content: string'
      return:
        description: ''
        type: string
  - name: delegation_id
    uid: >-
      @azure/ai-projects.LiveClientEventLiveInstructionsAppendParam.delegation_id
    package: '@azure/ai-projects'
    summary: >-
      The ID of the delegation associated with this content, or null when the
      content is not associated with a delegation.
    fullName: delegation_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delegation_id: string | null'
      return:
        description: ''
        type: string | null
  - name: event_id
    uid: '@azure/ai-projects.LiveClientEventLiveInstructionsAppendParam.event_id'
    package: '@azure/ai-projects'
    summary: A client-generated ID used to correlate this command with server events.
    fullName: event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'event_id?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/ai-projects.LiveClientEventLiveInstructionsAppendParam.type'
    package: '@azure/ai-projects'
    summary: The Live client event type. Always `session.instructions.append`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "session.instructions.append"'
      return:
        description: ''
        type: '"<xref uid="session.instructions.append" />"'
extends: <xref uid="@azure/ai-projects.LiveClientEvent" />
