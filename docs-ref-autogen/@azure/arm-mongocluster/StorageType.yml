### YamlMime:TSTypeAlias
name: StorageType
uid: '@azure/arm-mongocluster.StorageType'
package: '@azure/arm-mongocluster'
summary: >-
  The type of storage that a DocumentDB cluster can be provisioned with. \

  [KnownStorageType](xref:@azure/arm-mongocluster.KnownStorageType) can be used
  interchangeably with StorageType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **PremiumSSD**: Premium SSD storage. Premium SSD v2 is recommended for better
  performance. \

  **PremiumSSDv2**: Premium SSD v2 storage. Recommended for better performance.
fullName: StorageType
remarks: ''
isDeprecated: false
syntax: |
  type StorageType = string
