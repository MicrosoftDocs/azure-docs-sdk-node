### YamlMime:TSEnum
name: KnownDiagnosticOperation
uid: '@azure/arm-network.KnownDiagnosticOperation'
package: '@azure/arm-network'
summary: The type of diagnostic operation to run on a connection analyzer.
fullName: KnownDiagnosticOperation
remarks: ''
isDeprecated: false
fields:
  - name: ConnectivityCheck
    uid: '@azure/arm-network.KnownDiagnosticOperation.ConnectivityCheck'
    package: '@azure/arm-network'
    summary: >-
      Performs an end-to-end connectivity check between the source and
      destination.
  - name: ExpressRouteDiagnostic
    uid: '@azure/arm-network.KnownDiagnosticOperation.ExpressRouteDiagnostic'
    package: '@azure/arm-network'
    summary: Runs Express Route specific diagnostics for the connection.
  - name: NextHop
    uid: '@azure/arm-network.KnownDiagnosticOperation.NextHop'
    package: '@azure/arm-network'
    summary: Determines the next hop for traffic from the source to the destination.
  - name: NSG
    uid: '@azure/arm-network.KnownDiagnosticOperation.NSG'
    package: '@azure/arm-network'
    summary: Evaluates the network security group rules that apply to the traffic.
  - name: PortScan
    uid: '@azure/arm-network.KnownDiagnosticOperation.PortScan'
    package: '@azure/arm-network'
    summary: Scans the destination ports to determine their reachability.
