properties:
  - name: allowProtectedAppendWrites
    uid: >-
      @azure/provisioning-storage.types.UpdateHistoryPropertyView.allowProtectedAppendWrites
    package: '@azure/provisioning-storage'
    summary: >-
      Read-only output: This property can only be changed for unlocked
      time-based retention policies. When enabled, new blocks can be written to
      an append blob while maintaining immutability protection and compliance.
      Only new blocks can be added and any existing blocks cannot be modified or
      deleted. This property cannot be changed with ExtendImmutabilityPolicy
      API.
    fullName: allowProtectedAppendWrites
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowProtectedAppendWrites?: Expression<boolean>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;boolean&gt;
  - name: allowProtectedAppendWritesAll
    uid: >-
      @azure/provisioning-storage.types.UpdateHistoryPropertyView.allowProtectedAppendWritesAll
    package: '@azure/provisioning-storage'
    summary: >-
      Read-only output: This property can only be changed for unlocked
      time-based retention policies. When enabled, new blocks can be written to
      both 'Append and Bock Blobs' while maintaining immutability protection and
      compliance. Only new blocks can be added and any existing blocks cannot be
      modified or deleted. This property cannot be changed with
      ExtendImmutabilityPolicy API. The 'allowProtectedAppendWrites' and
      'allowProtectedAppendWritesAll' properties are mutually exclusive.
    fullName: allowProtectedAppendWritesAll
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowProtectedAppendWritesAll?: Expression<boolean>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;boolean&gt;
