### YamlMime:TSTypeAlias
name: DetectorRenderingType
uid: '@azure/arm-durabletask.DetectorRenderingType'
package: '@azure/arm-durabletask'
summary: >-
  The rendering type for a detector dataset. \

  [KnownDetectorRenderingType](xref:@azure/arm-durabletask.KnownDetectorRenderingType)
  can be used interchangeably with DetectorRenderingType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **1**: A table rendering. \

  **2**: A time series graph rendering. \

  **3**: A time series per-instance graph rendering. \

  **4**: A pie chart rendering. \

  **5**: A data summary rendering. \

  **6**: An email snippet rendering. \

  **7**: An insight rendering. \

  **8**: A dynamic insight rendering. \

  **9**: A Markdown rendering.
fullName: DetectorRenderingType
remarks: ''
isDeprecated: false
syntax: |
  type DetectorRenderingType = number
