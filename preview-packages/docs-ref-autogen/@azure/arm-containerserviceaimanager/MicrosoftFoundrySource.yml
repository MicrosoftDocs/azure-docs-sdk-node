### YamlMime:TSType
name: MicrosoftFoundrySource
uid: '@azure/arm-containerserviceaimanager.MicrosoftFoundrySource'
package: '@azure/arm-containerserviceaimanager'
summary: >-
  Reference to a Microsoft Foundry project that backs a `MicrosoftFoundry`

  ModelSource. Only the project Azure id is required; the Foundry account and
  its

  data-plane endpoint (`*.services.ai.azure.com`) are resolved by the platform

  from the project (the account is the project's parent resource).


  Authentication uses the user-assigned managed identity referenced in the

  ModelSource `credential.managedIdentity`, which the user must grant the

  `Foundry User` role (role definition id 53ca6127-db72-4b80-b1b0-d745d6d5456d)

  on this project. See https://aka.ms/aks/aim-modelsource for more details.
fullName: MicrosoftFoundrySource
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: projectResourceId
    uid: >-
      @azure/arm-containerserviceaimanager.MicrosoftFoundrySource.projectResourceId
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      The ARM resource id of the Foundry project. The scope on which the
      referenced managed identity must hold the `Foundry User` role. The account
      and endpoint host are derived from this id.
    fullName: projectResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'projectResourceId: string'
      return:
        description: ''
        type: string
