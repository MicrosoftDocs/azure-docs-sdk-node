name: AgentOptimizationResultCandidateSummary
uid: '@azure/ai-projects.AgentOptimizationResultCandidateSummary'
package: '@azure/ai-projects'
summary: Summary of candidates produced by an agent optimization job.
fullName: AgentOptimizationResultCandidateSummary
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: baseline_id
    uid: '@azure/ai-projects.AgentOptimizationResultCandidateSummary.baseline_id'
    package: '@azure/ai-projects'
    summary: >-
      Candidate ID of the original baseline. Omitted until the baseline
      candidate is available.
    fullName: baseline_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'baseline_id?: string'
      return:
        description: ''
        type: string
  - name: baseline_score
    uid: '@azure/ai-projects.AgentOptimizationResultCandidateSummary.baseline_score'
    package: '@azure/ai-projects'
    summary: >-
      Normalized score of the baseline candidate from 0.0 to 1.0 for a
      comparatively evaluated job. Omitted otherwise and until baseline
      evaluation completes.
    fullName: baseline_score
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'baseline_score?: number'
      return:
        description: ''
        type: number
  - name: best_id
    uid: '@azure/ai-projects.AgentOptimizationResultCandidateSummary.best_id'
    package: '@azure/ai-projects'
    summary: >-
      Candidate ID of the highest-scoring candidate for evaluated jobs, or the
      selected transformed output for non-comparative jobs. Omitted until a
      candidate has been selected.
    fullName: best_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'best_id?: string'
      return:
        description: ''
        type: string
  - name: best_score
    uid: '@azure/ai-projects.AgentOptimizationResultCandidateSummary.best_score'
    package: '@azure/ai-projects'
    summary: >-
      Best normalized score observed from 0.0 to 1.0 for a comparatively
      evaluated job. Omitted otherwise and until a candidate completes
      evaluation.
    fullName: best_score
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'best_score?: number'
      return:
        description: ''
        type: number
