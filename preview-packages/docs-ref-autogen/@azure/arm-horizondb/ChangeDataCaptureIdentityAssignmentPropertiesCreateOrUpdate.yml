  - name: identityResourceId
    uid: >-
      @azure/arm-horizondb.ChangeDataCaptureIdentityAssignmentPropertiesCreateOrUpdate.identityResourceId
    package: '@azure/arm-horizondb'
    summary: >-
      The immutable resource ID of the user-assigned managed identity selected
      for this destination. The ID must exactly match a key in the parent
      cluster's top-level identity.userAssignedIdentities dictionary; otherwise
      creation is rejected. Attaching the identity to the cluster does not grant
      destination access, so required role assignments must be configured
      separately. Resubmitting the same value is accepted; changing it requires
      deleting and recreating the assignment.
