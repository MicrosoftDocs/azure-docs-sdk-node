### YamlMime:TSTypeAlias
name: VirtualMachineDiskDelayAction
uid: '@azure/arm-compute.VirtualMachineDiskDelayAction'
package: '@azure/arm-compute'
summary: >-
  Determines how to handle disks with slow I/O. \

  [KnownVirtualMachineDiskDelayAction](xref:@azure/arm-compute.KnownVirtualMachineDiskDelayAction)
  can be used interchangeably with VirtualMachineDiskDelayAction,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: Defaults to behavior without availability policy specified, which is
  VM restart upon slow disk I/O. \

  **AutomaticReattach**: Upon a disk I/O failure or slow response, try detaching
  then reattaching the disk.
fullName: VirtualMachineDiskDelayAction
remarks: ''
isDeprecated: false
syntax: |
  type VirtualMachineDiskDelayAction = string
