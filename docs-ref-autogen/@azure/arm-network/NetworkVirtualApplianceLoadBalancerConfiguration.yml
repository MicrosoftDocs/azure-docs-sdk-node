  - name: loadDistribution
    uid: >-
      @azure/arm-network.NetworkVirtualApplianceLoadBalancerConfiguration.loadDistribution
    package: '@azure/arm-network'
    summary: >-
      The load distribution policy. Default uses a five-tuple hash of source IP,
      destination IP, source port, destination port, and protocol. SourceIP uses
      a two-tuple hash of source IP and destination IP. SourceIPProtocol uses a
      three-tuple hash of source IP, destination IP, and protocol. When omitted,
      Default is used.
