### YamlMime:TSType
name: EventNameFilterInput
uid: '@azure/provisioning-webpubsub.types.EventNameFilterInput'
package: '@azure/provisioning-webpubsub'
summary: Input type for Filter events by their name.
fullName: EventNameFilterInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: systemEvents
    uid: '@azure/provisioning-webpubsub.types.EventNameFilterInput.systemEvents'
    package: '@azure/provisioning-webpubsub'
    summary: >-
      Gets or sets a list of system events. Supported events: "connected" and
      "disconnected". Blocking event "connect" is not supported because it
      requires a response.
    fullName: systemEvents
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'systemEvents?: any'
      return:
        description: ''
        type: any
  - name: type
    uid: '@azure/provisioning-webpubsub.types.EventNameFilterInput.type'
    package: '@azure/provisioning-webpubsub'
    summary: Selects this variant. Must be "EventName".
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "EventName"'
      return:
        description: ''
        type: '"EventName"'
  - name: userEventPattern
    uid: '@azure/provisioning-webpubsub.types.EventNameFilterInput.userEventPattern'
    package: '@azure/provisioning-webpubsub'
    summary: >-
      Gets or sets a matching pattern for event names.

      There are 3 kinds of patterns supported:

      1. "*", it matches any event name

      2. Combine multiple events with ",", for example "event1,event2", it
      matches events "event1" and "event2"

      3. A single event name, for example, "event1", it matches "event1"
    fullName: userEventPattern
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'userEventPattern?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
extends: >-
  unknown&lt;<xref uid="@azure/provisioning-webpubsub.types.EventNameFilter"
  />&gt;
