### YamlMime:TSEnum
name: KnownRecoveryNetworkConfigAutoSyncPolicy
uid: >-
  @azure/arm-recoveryservices-siterecovery.KnownRecoveryNetworkConfigAutoSyncPolicy
package: '@azure/arm-recoveryservices-siterecovery'
summary: >-
  The vault level policy controlling whether the A2A recovery network
  configuration is automatically kept in sync with the source virtual machine.
fullName: KnownRecoveryNetworkConfigAutoSyncPolicy
remarks: ''
isDeprecated: false
fields:
  - name: Disabled
    uid: >-
      @azure/arm-recoveryservices-siterecovery.KnownRecoveryNetworkConfigAutoSyncPolicy.Disabled
    package: '@azure/arm-recoveryservices-siterecovery'
    summary: >-
      Automatic synchronization of the recovery network configuration is turned
      off. Recovery NIC settings are changed only through an explicit update
      operation.
  - name: Enabled
    uid: >-
      @azure/arm-recoveryservices-siterecovery.KnownRecoveryNetworkConfigAutoSyncPolicy.Enabled
    package: '@azure/arm-recoveryservices-siterecovery'
    summary: >-
      Automatic synchronization of the recovery network configuration is turned
      on. Recovery NIC settings are refreshed from the source virtual machine as
      its network configuration changes.
