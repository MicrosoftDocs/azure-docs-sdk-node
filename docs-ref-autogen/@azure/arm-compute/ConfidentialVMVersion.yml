name: ConfidentialVMVersion
uid: '@azure/arm-compute.ConfidentialVMVersion'
package: '@azure/arm-compute'
summary: >-
  Indicates the version of Confidential VM for the resource. \

  [KnownConfidentialVMVersion](xref:@azure/arm-compute.KnownConfidentialVMVersion)
  can be used interchangeably with ConfidentialVMVersion,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **V1**: V1 indicates the resource does not have an associated Virtual Machine
  Metadata. \

  **V2**: V2 indicates the resource has an associated Virtual Machine Metadata.
