name: OperationalStatusRequestMode
uid: '@azure/arm-sovereign.OperationalStatusRequestMode'
package: '@azure/arm-sovereign'
summary: >-
  The level of detail to return in the sovereign view operational status
  response. \

  [KnownOperationalStatusRequestMode](xref:@azure/arm-sovereign.KnownOperationalStatusRequestMode)
  can be used interchangeably with OperationalStatusRequestMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Summary**: Returns a high-level operational status suitable for quickly
  determining overall view health. \

  **Detailed**: Returns a comprehensive operational status, including detailed
  information about individual checks, dependencies, and any issues impacting
  view operability.
