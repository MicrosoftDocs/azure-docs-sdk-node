name: NodeImageUpgradeInsightProperties
uid: '@azure/arm-containerservice.NodeImageUpgradeInsightProperties'
package: '@azure/arm-containerservice'
summary: Properties for a single agent pool node OS image upgrade insight.
fullName: NodeImageUpgradeInsightProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: agentPoolName
    uid: >-
      @azure/arm-containerservice.NodeImageUpgradeInsightProperties.agentPoolName
    package: '@azure/arm-containerservice'
    summary: The name of the agent pool this insight applies to.
    fullName: agentPoolName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agentPoolName?: string'
      return:
        description: ''
        type: string
  - name: context
    uid: '@azure/arm-containerservice.NodeImageUpgradeInsightProperties.context'
    package: '@azure/arm-containerservice'
    summary: >-
      Contextual information about how this upgrade is managed, such as the
      upgrade strategy, next maintenance window, and last successful upgrade
      time.
    fullName: context
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'context?: UpgradeContext'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.UpgradeContext" />
  - name: currentNodeImageVersion
    uid: >-
      @azure/arm-containerservice.NodeImageUpgradeInsightProperties.currentNodeImageVersion
    package: '@azure/arm-containerservice'
    summary: >-
      The node OS image version the agent pool was evaluated from (the upgrade
      source version it is currently running). Lets consumers read the result as
