### YamlMime:TSType
name: EndpointProperties
uid: '@azure/arm-horizondb.EndpointProperties'
package: '@azure/arm-horizondb'
summary: Properties of a service-generated HorizonDB endpoint.
fullName: EndpointProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: associatedResourceId
    uid: '@azure/arm-horizondb.EndpointProperties.associatedResourceId'
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure resource ID of the Endpoint's lifecycle owner. For Cluster
      scope, this identifies the parent Cluster with which the Endpoint is
      created and deleted. For Pool scope, this identifies the Pool with which
      the Endpoint is created and deleted; the Pool must be a child of the
      Endpoint's parent Cluster.
    fullName: associatedResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'associatedResourceId: string'
      return:
        description: ''
        type: string
  - name: fullyQualifiedDomainName
    uid: '@azure/arm-horizondb.EndpointProperties.fullyQualifiedDomainName'
    package: '@azure/arm-horizondb'
    summary: >-
      The service-generated fully qualified domain name of the endpoint. A
      Cluster-scoped Endpoint uses
      <cluster>.<clusterid>.<region>.horizondb.azure.com. A Pool-scoped Endpoint
      uses <poolid>.<cluster>.<clusterid>.<region>.horizondb.azure.com.
    fullName: fullyQualifiedDomainName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'fullyQualifiedDomainName: string'
      return:
        description: ''
        type: string
  - name: role
    uid: '@azure/arm-horizondb.EndpointProperties.role'
    package: '@azure/arm-horizondb'
    summary: >-
      The routing role of the endpoint. A Cluster-scoped Endpoint normally has
      the ReadWrite role. Pool-scoped Endpoints have the ReadOnly role and route
      only to allocated nodes in the associated Pool that are not currently
      playing the read-write role. A Pool-scoped ReadOnly Endpoint has no
      routing destination unless at least one such node exists, including when
      the Pool is Stopped, has zero allocated nodes, or has only one allocated
      node and that node is playing the read-write role.
    fullName: role
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'role: string'
      return:
        description: ''
        type: string
  - name: scope
    uid: '@azure/arm-horizondb.EndpointProperties.scope'
    package: '@azure/arm-horizondb'
    summary: >-
      The scope of the endpoint. Cluster-scoped Endpoints provide the cluster
      connection, and Pool-scoped Endpoints provide read-only connections to
      eligible nodes in one pool.
    fullName: scope
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scope: string'
      return:
        description: ''
        type: string
