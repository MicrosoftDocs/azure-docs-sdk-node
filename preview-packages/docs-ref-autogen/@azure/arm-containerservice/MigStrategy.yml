### YamlMime:TSTypeAlias
name: MigStrategy
uid: '@azure/arm-containerservice.MigStrategy'
package: '@azure/arm-containerservice'
summary: >-
  Sets the MIG (Multi-Instance GPU) strategy that will be used for managed MIG
  support. For more information about the different strategies, visit
  aka.ms/aks/managed-gpu. When not specified, the default is None. \

  [KnownMigStrategy](xref:@azure/arm-containerservice.KnownMigStrategy) can be
  used interchangeably with MigStrategy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: No MIG partitioning is applied; the GPU is exposed as a single
  unified whole-device instance. Specifying this value removes any previously
  active MIG strategy. \

  **Single**: All MIG partitions on every GPU in the pool are the same size
  (`nvidia.com/mig.strategy: single`). The uniform partition size is controlled
  by `nvidia.migProfiles` (exactly one element required). \

  **Mixed**: Each GPU in the pool can host heterogeneous partitions of different
  sizes simultaneously (`nvidia.com/mig.strategy: mixed`). The exact partition
  mix per GPU is declared via `nvidia.migProfiles`.
fullName: MigStrategy
remarks: ''
isDeprecated: false
syntax: |
  type MigStrategy = string
