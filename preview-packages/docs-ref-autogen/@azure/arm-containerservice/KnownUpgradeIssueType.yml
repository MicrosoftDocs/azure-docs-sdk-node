### YamlMime:TSEnum
name: KnownUpgradeIssueType
uid: '@azure/arm-containerservice.KnownUpgradeIssueType'
package: '@azure/arm-containerservice'
summary: The type of a detected upgrade issue.
fullName: KnownUpgradeIssueType
remarks: ''
isDeprecated: false
fields:
  - name: APIBreakingChange
    uid: '@azure/arm-containerservice.KnownUpgradeIssueType.APIBreakingChange'
    package: '@azure/arm-containerservice'
    summary: >-
      The cluster is using deprecated Kubernetes APIs that are removed in the
      target version. See
      https://aka.ms/aks/upgrade-insights/api-breaking-change for remediation
      guidance.
  - name: ComponentVersionMismatch
    uid: '@azure/arm-containerservice.KnownUpgradeIssueType.ComponentVersionMismatch'
    package: '@azure/arm-containerservice'
    summary: >-
      An add-on or system component is not compatible with the target Kubernetes
      version. See
      https://aka.ms/aks/upgrade-insights/component-version-mismatch for
      remediation guidance.
  - name: NodeImageOutOfSLA
    uid: '@azure/arm-containerservice.KnownUpgradeIssueType.NodeImageOutOfSLA'
    package: '@azure/arm-containerservice'
    summary: >-
      The cluster node image has not been upgraded within the required
      compliance interval. See
      https://aka.ms/aks/upgrade-insights/node-image-out-of-sla for remediation
      guidance.
  - name: PDBConstraint
    uid: '@azure/arm-containerservice.KnownUpgradeIssueType.PDBConstraint'
    package: '@azure/arm-containerservice'
    summary: >-
      A restrictive PodDisruptionBudget prevents node drain during upgrade. See
      https://aka.ms/aks/upgrade-insights/pdb-constraint for remediation
      guidance.
  - name: QuotaExceeded
    uid: '@azure/arm-containerservice.KnownUpgradeIssueType.QuotaExceeded'
    package: '@azure/arm-containerservice'
    summary: >-
      Compute quota for the node pool VM SKU is insufficient to accommodate
      surge nodes during upgrade. See
      https://aka.ms/aks/upgrade-insights/quota-exceeded for remediation
      guidance.
  - name: SubnetIPExhausted
    uid: '@azure/arm-containerservice.KnownUpgradeIssueType.SubnetIPExhausted'
    package: '@azure/arm-containerservice'
    summary: >-
      The cluster subnet does not have sufficient available IP addresses for
      surge nodes during upgrade. See
      https://aka.ms/aks/upgrade-insights/subnet-ip-exhaustion for remediation
      guidance.
  - name: UnsupportedKubernetesVersion
    uid: >-
      @azure/arm-containerservice.KnownUpgradeIssueType.UnsupportedKubernetesVersion
    package: '@azure/arm-containerservice'
    summary: >-
      The cluster is running a Kubernetes version that is no longer supported.
      See https://aka.ms/aks/upgrade-insights/unsupported-kubernetes-version for
      remediation guidance.
