### YamlMime:TSType
name: Resource
uid: '@azure/provisioning-core.Resource'
package: '@azure/provisioning-core'
summary: >+
  Base class for all Azure resources.


  **Example**


  ```typescript snippet:ignore

  import { ResourceGroup, Stack } from "@azure/provisioning-core";

  import { KeyVault } from "@azure/provisioning-keyvault";


  const stack = new Stack("my-app", { targetScope: "subscription" });

  const rg = new ResourceGroup(stack, { name: "rg-my-app", location: "eastus"
  });

  const vault = new KeyVault(rg, {
    name: "kv-my-app",
    properties: {
      tenantId: "11111111-1111-1111-1111-111111111111",
      sku: { family: "A", name: "standard" },
    },
  });


  // vault.name is an Expression, not a string

  // vault.id compiles to resourceId(...)

  ```

fullName: Resource<TType>
remarks: |-
  Resources are fully initialized at construction time. Pass a parent
  `ProvisioningComponent` (typically a `Stack` or `ResourceGroup`) as the first
  argument — the resource registers itself in the tree automatically.

  Properties use expression-backed proxies: reading `resource.name`
  returns an `Expression` that compiles to a Bicep symbolic reference,
  not a plain string. Use `this.expr()` in subclasses to create
  property getters and `this.setProperty()` for setters.
isDeprecated: false
type: class
