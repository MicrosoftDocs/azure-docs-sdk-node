### YamlMime:TSType
name: HorizonDbClusterDataEncryption
uid: '@azure/arm-horizondb.HorizonDbClusterDataEncryption'
package: '@azure/arm-horizondb'
summary: >-
  The Cluster-level data encryption configuration. The encryption type is
  selected at cluster creation; switching between SystemManaged and
  AzureKeyVault after creation is not supported. For AzureKeyVault encryption,
  primaryKeyUri and primaryUserAssignedIdentityId are required, and
  backup.geoRedundancy must be Disabled. Both primaryKeyUri and
  primaryUserAssignedIdentityId can be provided during initial cluster creation.
  For updates to an existing cluster through PUT or PATCH, only one of these
  properties can change per request, and that update must complete before
  submitting a separate update to change the other property. Customer-managed
  key identities must also be assigned to the Cluster through its top-level
  identity property. Only versionless Azure Key Vault key URIs are supported;
  key version paths are rejected. For SystemManaged encryption, key and identity
  properties must be omitted.
fullName: HorizonDbClusterDataEncryption
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: primaryEncryptionKeyCurrentVersion
    uid: >-
      @azure/arm-horizondb.HorizonDbClusterDataEncryption.primaryEncryptionKeyCurrentVersion
    package: '@azure/arm-horizondb'
    summary: >-
      The current version of the primary encryption key used by the cluster.
      This property is returned for AzureKeyVault encryption and is absent for
      SystemManaged encryption.
    fullName: primaryEncryptionKeyCurrentVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'primaryEncryptionKeyCurrentVersion?: string'
      return:
        description: ''
        type: string
  - name: primaryEncryptionKeyStatus
    uid: >-
      @azure/arm-horizondb.HorizonDbClusterDataEncryption.primaryEncryptionKeyStatus
    package: '@azure/arm-horizondb'
    summary: >-
      The validation status of the primary encryption key. This property is
      returned for AzureKeyVault encryption and is absent for SystemManaged
      encryption.
    fullName: primaryEncryptionKeyStatus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'primaryEncryptionKeyStatus?: string'
      return:
        description: ''
        type: string
  - name: primaryKeyUri
    uid: '@azure/arm-horizondb.HorizonDbClusterDataEncryption.primaryKeyUri'
    package: '@azure/arm-horizondb'
    summary: >-
      The versionless Azure Key Vault key URI used to encrypt the cluster's
      primary storage. Key version paths are not supported. During initial
      cluster creation, this property can be provided together with
      primaryUserAssignedIdentityId. For updates to an existing cluster through
      PUT or PATCH, this property and primaryUserAssignedIdentityId cannot both
      change in the same request; the first update must complete before
      submitting a separate update for the other property.
    fullName: primaryKeyUri
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'primaryKeyUri?: string'
      return:
        description: ''
        type: string
  - name: primaryUserAssignedIdentityId
    uid: >-
      @azure/arm-horizondb.HorizonDbClusterDataEncryption.primaryUserAssignedIdentityId
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure resource ID of the user-assigned managed identity used to access
      the primary encryption key. The identity must also be assigned to the
      Cluster through its top-level identity property. During initial cluster
      creation, this property can be provided together with primaryKeyUri. For
      updates to an existing cluster through PUT or PATCH, this property and
      primaryKeyUri cannot both change in the same request; the first update
      must complete before submitting a separate update for the other property.
    fullName: primaryUserAssignedIdentityId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'primaryUserAssignedIdentityId?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-horizondb.HorizonDbClusterDataEncryption.type'
    package: '@azure/arm-horizondb'
    summary: >-
      The type of data encryption used by the cluster. When the data encryption
      configuration is supplied during initial cluster creation, this property
      is required. For PUT updates of an existing cluster, this property may be
      omitted; if provided, it must match the existing encryption type. This
      value is selected at cluster creation and cannot later be changed from
      SystemManaged to AzureKeyVault or from AzureKeyVault to SystemManaged.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type?: string'
      return:
        description: ''
        type: string
