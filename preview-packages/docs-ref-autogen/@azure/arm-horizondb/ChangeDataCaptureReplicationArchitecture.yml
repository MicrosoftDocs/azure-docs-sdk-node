uid: '@azure/arm-horizondb.ChangeDataCaptureReplicationArchitecture'
package: '@azure/arm-horizondb'
summary: >-
  The implementation architecture used to capture and publish changes. \

  [KnownChangeDataCaptureReplicationArchitecture](xref:@azure/arm-horizondb.KnownChangeDataCaptureReplicationArchitecture)
  can be used interchangeably with ChangeDataCaptureReplicationArchitecture,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ComputeBased**: Change capture runs with the HorizonDB compute layer. \

  **StorageBased**: Change capture runs with the HorizonDB storage layer. \

  **Hybrid**: Change capture uses both compute and storage components.
