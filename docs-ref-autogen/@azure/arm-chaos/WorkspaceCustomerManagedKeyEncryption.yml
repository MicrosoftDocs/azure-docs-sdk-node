### YamlMime:TSType
name: WorkspaceCustomerManagedKeyEncryption
uid: '@azure/arm-chaos.WorkspaceCustomerManagedKeyEncryption'
package: '@azure/arm-chaos'
summary: A customer-managed key reference, not key material.
fullName: WorkspaceCustomerManagedKeyEncryption
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: keyEncryptionKeyUrl
    uid: '@azure/arm-chaos.WorkspaceCustomerManagedKeyEncryption.keyEncryptionKeyUrl'
    package: '@azure/arm-chaos'
    summary: >-
      The versionless HTTPS Key Vault key URI in the supported cloud and
      Workspace

      tenant. The key vault must belong to the same Microsoft Entra tenant as

      the Workspace. Its HTTPS origin must match the vault referenced by

      keyVaultResourceId. The service validates the effective pair and caller

      vault-read permission synchronously through Azure Resource Manager before

      creating public operation metadata, accepting the configuration operation,

      persisting requested encryption, or changing Storage or customer data.

      Supports RSA keys in Azure Key Vault and RSA-HSM keys in Premium Key
      Vault,

      with key sizes of 2048, 3072, or 4096 bits. Premium RSA-HSM keys use the
      same

      vault URL. The separate Azure Managed HSM service is not supported;

      Managed HSM endpoints are rejected before operation acceptance.

      A key version, query string, or fragment is not permitted.

      Azure Storage follows key versions automatically. Keep the previous
      version

      available for at least 24 hours after rotation.
    fullName: keyEncryptionKeyUrl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'keyEncryptionKeyUrl: string'
      return:
        description: ''
        type: string
  - name: keyVaultResourceId
    uid: '@azure/arm-chaos.WorkspaceCustomerManagedKeyEncryption.keyVaultResourceId'
    package: '@azure/arm-chaos'
    summary: >-
      The fully qualified Azure resource ID of the key vault that contains the
      key.

      Use
      /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.KeyVault/vaults/{vaultName},

      not a key child resource, Managed HSM, or URL. Full PUT with CMK and PATCH

      that changes either CMK member require Microsoft.KeyVault/vaults/read on

      the effective vault. The service compares its canonical ID, tenant, and

      vault URI with the requested pair before accepting the operation.
    fullName: keyVaultResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'keyVaultResourceId: string'
      return:
        description: ''
        type: string
