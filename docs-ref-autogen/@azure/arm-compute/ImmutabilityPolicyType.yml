### YamlMime:TSTypeAlias
name: ImmutabilityPolicyType
uid: '@azure/arm-compute.ImmutabilityPolicyType'
package: '@azure/arm-compute'
summary: >-
  The type of the immutability policy. 'Unlocked' allows the policy to be
  modified by privileged users; 'Locked' prevents reduction of the immutability
  duration but allows extension of the lock period. \

  [KnownImmutabilityPolicyType](xref:@azure/arm-compute.KnownImmutabilityPolicyType)
  can be used interchangeably with ImmutabilityPolicyType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unlocked**: Privileged users can modify the snapshot's immutability policy,
  if it is unlocked type. \

  **Locked**: The snapshot immutability policy duration cannot be reduced but
  can be extended. The policy cannot be removed until the lock period expires.
fullName: ImmutabilityPolicyType
remarks: ''
isDeprecated: false
syntax: |
  type ImmutabilityPolicyType = string
