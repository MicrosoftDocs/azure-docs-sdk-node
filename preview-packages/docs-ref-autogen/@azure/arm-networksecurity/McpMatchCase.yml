### YamlMime:TSTypeAlias
name: McpMatchCase
uid: '@azure/arm-networksecurity.McpMatchCase'
package: '@azure/arm-networksecurity'
summary: >-
  Whether an MCP string condition compares case-sensitively. \

  [KnownMcpMatchCase](xref:@azure/arm-networksecurity.KnownMcpMatchCase) can be
  used interchangeably with McpMatchCase,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **CaseSensitive**: Compare strings exactly. This is the default. \

  **CaseInsensitive**: Compare strings after case folding both sides: uppercase,
  then lowercase.
fullName: McpMatchCase
remarks: ''
isDeprecated: false
syntax: |
  type McpMatchCase = string
