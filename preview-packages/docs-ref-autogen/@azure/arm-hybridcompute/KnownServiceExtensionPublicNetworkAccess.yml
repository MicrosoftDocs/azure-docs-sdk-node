### YamlMime:TSEnum
name: KnownServiceExtensionPublicNetworkAccess
uid: '@azure/arm-hybridcompute.KnownServiceExtensionPublicNetworkAccess'
package: '@azure/arm-hybridcompute'
summary: >-
  The network access policy to determine if the specified Azure Arc Extension
  can use public Azure Arc Extension service endpoints.
fullName: KnownServiceExtensionPublicNetworkAccess
remarks: ''
isDeprecated: false
fields:
  - name: Disabled
    uid: '@azure/arm-hybridcompute.KnownServiceExtensionPublicNetworkAccess.Disabled'
    package: '@azure/arm-hybridcompute'
    summary: >-
      Does not allow Azure Arc Extension agents to communicate with Azure Arc
      services over public (internet) endpoints. The agents must use the private
      link.
  - name: Enabled
    uid: '@azure/arm-hybridcompute.KnownServiceExtensionPublicNetworkAccess.Enabled'
    package: '@azure/arm-hybridcompute'
    summary: >-
      Allows Azure Arc Extension agents to communicate with Azure Arc services
      over both public (internet) and private endpoints.
