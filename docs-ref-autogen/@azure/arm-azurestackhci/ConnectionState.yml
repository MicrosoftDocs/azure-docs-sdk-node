### YamlMime:TSTypeAlias
name: ConnectionState
uid: '@azure/arm-azurestackhci.ConnectionState'
package: '@azure/arm-azurestackhci'
summary: >-
  WiFi connection state. \

  [KnownConnectionState](xref:@azure/arm-azurestackhci.KnownConnectionState) can
  be used interchangeably with ConnectionState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotConfigured**: WiFi is not configured. \

  **Connected**: WiFi is connected. \

  **Disconnected**: WiFi is disconnected. \

  **Connecting**: WiFi is connecting. \

  **Disconnecting**: WiFi is disconnecting. \

  **AuthenticationFailed**: WiFi authentication failed.
fullName: ConnectionState
remarks: ''
isDeprecated: false
syntax: |
  type ConnectionState = string
