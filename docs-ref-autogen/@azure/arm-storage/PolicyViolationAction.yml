### YamlMime:TSTypeAlias
name: PolicyViolationAction
uid: '@azure/arm-storage.PolicyViolationAction'
package: '@azure/arm-storage'
summary: >-
  The action to perform when a user delegation SAS (shared access signature)
  policy requirement is violated. \

  [KnownPolicyViolationAction](xref:@azure/arm-storage.KnownPolicyViolationAction)
  can be used interchangeably with PolicyViolationAction,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: No action is taken when the policy requirement is violated. \

  **Log**: The policy violation is logged for audit purposes. \

  **Block**: The request is blocked and denied when the policy requirement is
  violated.
fullName: PolicyViolationAction
remarks: ''
isDeprecated: false
syntax: |
  type PolicyViolationAction = string
