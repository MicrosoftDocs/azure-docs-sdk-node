### YamlMime:TSTypeAlias
name: ExternalCacheConnectionStatus
uid: '@azure/arm-netapp.ExternalCacheConnectionStatus'
package: '@azure/arm-netapp'
summary: >-
  Represents the status of an external cache connection \

  [KnownExternalCacheConnectionStatus](xref:@azure/arm-netapp.KnownExternalCacheConnectionStatus)
  can be used interchangeably with ExternalCacheConnectionStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Pending**: The cache connection is pending \

  **Connected**: The cache is connected \

  **Disconnected**: The cache is disconnected \

  **Unknown**: The cache status is unknown. This is a transient state and should
  change to either connected or disconnected. \

  **Unsupported**: The cache was discovered on-premises but has no corresponding
  ExternalCacheConnection resource
fullName: ExternalCacheConnectionStatus
remarks: ''
isDeprecated: false
syntax: |
  type ExternalCacheConnectionStatus = string
