### YamlMime:TSType
name: PoolParameterGroupReferenceCreateOrUpdate
uid: '@azure/arm-horizondb.PoolParameterGroupReferenceCreateOrUpdate'
package: '@azure/arm-horizondb'
summary: >-
  A reference to the parameter group associated with a HorizonDB pool. The
  schema represents both default and customer-created parameter groups for
  create and update compatibility. In this API version, initial pool creation
  accepts only the corresponding default parameter group; PUT updates to an
  existing pool can associate either group type.
fullName: PoolParameterGroupReferenceCreateOrUpdate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: applyMethod
    uid: '@azure/arm-horizondb.PoolParameterGroupReferenceCreateOrUpdate.applyMethod'
    package: '@azure/arm-horizondb'
    summary: >-
      Determines when dynamic parameter changes from the associated parameter
      group become effective. Static parameter changes always require a
      customer-initiated pool Restart, regardless of this value. Stop followed
      by Start and scheduled maintenance do not apply pending parameter changes.
    fullName: applyMethod
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'applyMethod: string'
      return:
        description: ''
        type: string
  - name: parameterGroupResourceId
    uid: >-
      @azure/arm-horizondb.PoolParameterGroupReferenceCreateOrUpdate.parameterGroupResourceId
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure resource ID of the associated parameter group. Initial pool
      creation in this API version requires the corresponding
      Microsoft.HorizonDb/locations/parameterGroups resource. For an existing
      pool, PUT can specify either the corresponding default group or a
      customer-created Microsoft.HorizonDb/parameterGroups resource.
    fullName: parameterGroupResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parameterGroupResourceId: string'
      return:
        description: ''
        type: string
