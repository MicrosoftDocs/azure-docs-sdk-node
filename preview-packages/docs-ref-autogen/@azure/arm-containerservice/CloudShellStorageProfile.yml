    summary: >-
      Whether persistent storage is disabled, managed by AKS, or provided by the
      user. Defaults to Disabled when

      omitted during initial Cloud Shell enablement. On update, omission
      preserves the existing mode.
    fullName: mode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'mode?: string'
      return:
        description: ''
        type: string
  - name: storageAccountId
    uid: '@azure/arm-containerservice.CloudShellStorageProfile.storageAccountId'
    package: '@azure/arm-containerservice'
    summary: >-
      Storage account used for Cloud Shell files. For Custom storage, grant the
