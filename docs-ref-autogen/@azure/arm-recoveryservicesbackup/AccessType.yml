name: AccessType
uid: '@azure/arm-recoveryservicesbackup.AccessType'
package: '@azure/arm-recoveryservicesbackup'
summary: >-
  Whether access to the storage account is key-based or identity-based. \

  [KnownAccessType](xref:@azure/arm-recoveryservicesbackup.KnownAccessType) can
  be used interchangeably with AccessType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **KeyBased**: Access using storage account keys. \

  **IdentityBased**: Access using managed identity.
