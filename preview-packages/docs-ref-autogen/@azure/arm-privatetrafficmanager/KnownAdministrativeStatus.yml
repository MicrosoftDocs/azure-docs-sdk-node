name: KnownAdministrativeStatus
uid: '@azure/arm-privatetrafficmanager.KnownAdministrativeStatus'
package: '@azure/arm-privatetrafficmanager'
summary: >-
  The status of the endpoint. If the endpoint is Enabled, it is probed for
  endpoint health and is included in the traffic routing method.
fullName: KnownAdministrativeStatus
remarks: ''
isDeprecated: false
fields:
  - name: Disabled
    uid: '@azure/arm-privatetrafficmanager.KnownAdministrativeStatus.Disabled'
    package: '@azure/arm-privatetrafficmanager'
    summary: The endpoint is disabled and is not probed for health.
  - name: Enabled
    uid: '@azure/arm-privatetrafficmanager.KnownAdministrativeStatus.Enabled'
    package: '@azure/arm-privatetrafficmanager'
    summary: The endpoint is enabled and is probed for health.
