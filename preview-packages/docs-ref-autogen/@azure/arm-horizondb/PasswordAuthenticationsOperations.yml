  - name: update
    uid: '@azure/arm-horizondb.PasswordAuthenticationsOperations.update'
    package: '@azure/arm-horizondb'
    summary: >-
      Updates the service-created PostgreSQL username-and-password
      authentication method. The request is sparse and omitted properties
      preserve their current values. This API version supports enabling the
      method, disabling the method, and resetting its password. For a cluster
      that already has an administrator but currently has password
      authentication disabled, state Enabled and administratorLoginPassword can
      be supplied together to re-enable password authentication and reset the
      password. Disabling cannot include credentials and does not remove or
      modify existing database users or roles. Administrator rename is not
      supported in this API version.
    fullName: update
