name: LookBackWindow
uid: '@azure/arm-cloudhealth.LookBackWindow'
package: '@azure/arm-cloudhealth'
summary: >-
  Allowed look-back window durations for dynamic threshold computation \

  [KnownLookBackWindow](xref:@azure/arm-cloudhealth.KnownLookBackWindow) can be
  used interchangeably with LookBackWindow,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **PT5M**: Five minutes \

  **PT15M**: Fifteen minutes \

  **PT30M**: Thirty minutes \

  **PT1H**: One hour
fullName: LookBackWindow
remarks: ''
isDeprecated: false
