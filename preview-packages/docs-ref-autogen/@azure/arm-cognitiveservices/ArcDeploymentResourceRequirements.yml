### YamlMime:TSType
name: ArcDeploymentResourceRequirements
uid: '@azure/arm-cognitiveservices.ArcDeploymentResourceRequirements'
package: '@azure/arm-cognitiveservices'
summary: >-
  Kubernetes resource requirements for an Arc deployment replica.

  Specify either cpu and memory together, or gpu. GPU is supported only in
  limits, not requests.
fullName: ArcDeploymentResourceRequirements
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: cpu
    uid: '@azure/arm-cognitiveservices.ArcDeploymentResourceRequirements.cpu'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Kubernetes CPU quantity string, for example 500m, 2, 4, or 8.

      Required with memory when specifying CPU and memory limits. Do not specify
      with gpu.
    fullName: cpu
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cpu?: string'
      return:
        description: ''
        type: string
  - name: gpu
    uid: '@azure/arm-cognitiveservices.ArcDeploymentResourceRequirements.gpu'
    package: '@azure/arm-cognitiveservices'
    summary: |-
      Kubernetes GPU quantity, for example 1, 2, or 5.
      Required when specifying GPU limits. Do not specify with cpu or memory.
    fullName: gpu
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'gpu?: number'
      return:
        description: ''
        type: number
  - name: memory
    uid: '@azure/arm-cognitiveservices.ArcDeploymentResourceRequirements.memory'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Kubernetes memory quantity string, for example 512Mi, 2Gi, or 16Gi.

      Required with cpu when specifying CPU and memory limits. Do not specify
      with gpu.
    fullName: memory
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'memory?: string'
      return:
        description: ''
        type: string
