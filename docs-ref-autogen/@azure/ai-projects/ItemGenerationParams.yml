### YamlMime:TSType
name: ItemGenerationParams
uid: '@azure/ai-projects.ItemGenerationParams'
package: '@azure/ai-projects'
summary: >-
  Configures how the service prepares input items for an evaluation run before
  applying testing criteria.


  Depending on `type`, preparation can generate new inputs, retrieve existing
  responses, transform source data, or simulate conversations. Each `type`
  selects a workflow-specific model with the parameters required by that
  preparation workflow. These parameters do not define the evaluated target or
  the testing criteria.
fullName: ItemGenerationParams
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: type
    uid: '@azure/ai-projects.ItemGenerationParams.type'
    package: '@azure/ai-projects'
    summary: >-
      The discriminator possible values: red_team, red_team_seed_prompts,
      red_team_taxonomy, response_retrieval, synthetic_data_gen,
      target_completion
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: ItemGenerationParamsType'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.ItemGenerationParamsType" />
