### YamlMime:TSEnum
name: KnownAzureMonitorWorkspaceIngestionMode
uid: '@azure/arm-appinsights.KnownAzureMonitorWorkspaceIngestionMode'
package: '@azure/arm-appinsights'
summary: >-
  Indicates the state of the OpenTelemetry ingestion into the Azure Monitor
  workspace that is linked to the Application Insights component.
fullName: KnownAzureMonitorWorkspaceIngestionMode
remarks: ''
isDeprecated: false
fields:
  - name: Disabled
    uid: '@azure/arm-appinsights.KnownAzureMonitorWorkspaceIngestionMode.Disabled'
    package: '@azure/arm-appinsights'
    summary: >-
      Azure Monitor workspace ingestion is disabled for the component because
      the link to the Azure Monitor workspace is broken. This value is set only
      by the service and is rejected if specified by a client.
  - name: Enabled
    uid: '@azure/arm-appinsights.KnownAzureMonitorWorkspaceIngestionMode.Enabled'
    package: '@azure/arm-appinsights'
    summary: >-
      Azure Monitor workspace ingestion is enabled for the component. Clients
      may specify this value to opt in. Opting back out after ingestion has been
      enabled is not supported.
  - name: NotOptedIn
    uid: '@azure/arm-appinsights.KnownAzureMonitorWorkspaceIngestionMode.NotOptedIn'
    package: '@azure/arm-appinsights'
    summary: >-
      The component has not been opted in to Azure Monitor workspace ingestion.
      Clients may specify this value on create to decline Azure Monitor
      workspace ingestion.
