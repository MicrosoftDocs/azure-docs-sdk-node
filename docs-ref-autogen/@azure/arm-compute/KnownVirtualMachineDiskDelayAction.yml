### YamlMime:TSEnum
name: KnownVirtualMachineDiskDelayAction
uid: '@azure/arm-compute.KnownVirtualMachineDiskDelayAction'
package: '@azure/arm-compute'
summary: Determines how to handle disks with slow I/O.
fullName: KnownVirtualMachineDiskDelayAction
remarks: ''
isDeprecated: false
fields:
  - name: AutomaticReattach
    uid: '@azure/arm-compute.KnownVirtualMachineDiskDelayAction.AutomaticReattach'
    package: '@azure/arm-compute'
    summary: >-
      Upon a disk I/O failure or slow response, try detaching then reattaching
      the disk.
  - name: None
    uid: '@azure/arm-compute.KnownVirtualMachineDiskDelayAction.None'
    package: '@azure/arm-compute'
    summary: >-
      Defaults to behavior without availability policy specified, which is VM
      restart upon slow disk I/O.
