### YamlMime:TSType
name: SoftEvictionGracePeriod
uid: '@azure/arm-containerservice.SoftEvictionGracePeriod'
package: '@azure/arm-containerservice'
summary: >-
  Grace periods for kubelet soft eviction thresholds. Each field is a Go-style
  duration string (e.g. '1m30s') that specifies how long the corresponding soft
  eviction signal must be crossed before pod eviction is triggered. A grace
  period only applies when the matching soft eviction threshold is set.
fullName: SoftEvictionGracePeriod
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: memoryAvailable
    uid: '@azure/arm-containerservice.SoftEvictionGracePeriod.memoryAvailable'
    package: '@azure/arm-containerservice'
    summary: >-
      The grace period for the memoryAvailable soft eviction signal, expressed
      as a Go-style duration string (e.g. '30s', '1m30s'). Supported units are
      'ns', 'us', 'ms', 's', 'm', and 'h'. Must be greater than or equal to
      '30s'. Default is '30s'.
    fullName: memoryAvailable
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'memoryAvailable?: string'
      return:
        description: ''
        type: string
  - name: nodeFsAvailable
    uid: '@azure/arm-containerservice.SoftEvictionGracePeriod.nodeFsAvailable'
    package: '@azure/arm-containerservice'
    summary: >-
      The grace period for the nodeFsAvailable soft eviction signal, expressed
      as a Go-style duration string (e.g. '30s', '1m30s'). Supported units are
      'ns', 'us', 'ms', 's', 'm', and 'h'. Must be greater than or equal to
      '30s'. Default is '2m'.
    fullName: nodeFsAvailable
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'nodeFsAvailable?: string'
      return:
        description: ''
        type: string
  - name: nodeFsInodesFree
    uid: '@azure/arm-containerservice.SoftEvictionGracePeriod.nodeFsInodesFree'
    package: '@azure/arm-containerservice'
    summary: >-
      The grace period for the nodeFsInodesFree soft eviction signal, expressed
      as a Go-style duration string (e.g. '30s', '1m30s'). Supported units are
      'ns', 'us', 'ms', 's', 'm', and 'h'. Must be greater than or equal to
      '30s'. Default is '2m'.
    fullName: nodeFsInodesFree
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'nodeFsInodesFree?: string'
      return:
        description: ''
        type: string
