### YamlMime:TSTypeAlias
name: RecommendationTypeParameterEnum
uid: '@azure/arm-postgresql-flexible.RecommendationTypeParameterEnum'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Recommendations list filter. Retrieves recommendations based on type. \

  [KnownRecommendationTypeParameterEnum](xref:@azure/arm-postgresql-flexible.KnownRecommendationTypeParameterEnum)
  can be used interchangeably with RecommendationTypeParameterEnum,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **CreateIndex**: Recommendation to create an index to improve query
  performance. \

  **DropIndex**: Recommendation to drop an existing index because it's duplicate
  or unused. \

  **ReIndex**: Recommendation to reindex an existing invalid index. \

  **AnalyzeTable**: Recommendation to analyze a table to update statistics for
  the query optimizer. \

  **VacuumTable**: Recommendation to vacuum a table to reclaim storage and
  optimize performance.
fullName: RecommendationTypeParameterEnum
remarks: ''
isDeprecated: false
syntax: |
  type RecommendationTypeParameterEnum = string
