  - name: enabled
    uid: '@azure/provisioning-storage.types.EncryptionServiceView.enabled'
    package: '@azure/provisioning-storage'
    summary: >-
      A boolean indicating whether or not the service encrypts the data as it is
      stored. Encryption at rest is enabled by default today and cannot be
      disabled.
    fullName: enabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabled?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: keyType
    uid: '@azure/provisioning-storage.types.EncryptionServiceView.keyType'
    package: '@azure/provisioning-storage'
    summary: >-
      Encryption key type to be used for the encryption service. 'Account' key
      type implies that an account-scoped encryption key will be used. 'Service'
      key type implies that a default service key is used.
    fullName: keyType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'keyType?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
