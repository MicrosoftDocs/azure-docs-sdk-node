### YamlMime:TSTypeAlias
name: ArrayAccessIndex
uid: '@azure/provisioning-core.ArrayAccessIndex'
package: '@azure/provisioning-core'
summary: >-
  The index stored on an
  [ArrayAccessExpressionNode](xref:@azure/provisioning-core.ArrayAccessExpressionNode):
  a literal

  `number` or `string`, or a raw
  [ExpressionNode](xref:@azure/provisioning-core.ExpressionNode) evaluated at

  serialize time (e.g. a loop's `symbolic-value` index, or a `binary` /

  `fn-call` node for a computed offset). `Expression<T>` proxies are

  unwrapped to their raw node before being stored, so the proxy type is

  intentionally absent here.
fullName: ArrayAccessIndex
remarks: ''
isDeprecated: false
syntax: |
  type ArrayAccessIndex = number | string | ExpressionNode
