  - name: deleteDeviceClass
    uid: '@azure/iot-device-update.DeviceManagementOperations.deleteDeviceClass'
    package: '@azure/iot-device-update'
    summary: >-
      Deletes a device class. Device classes are created automatically when
      Device

      Update-enabled devices are connected to the hub but are not automatically

      cleaned up since they are referenced by DeviceClassSubgroups. If the user
      has

      deleted all DeviceClassSubgroups for a device class they can also delete
      the

      device class to remove the records from the system and to stop checking
      the

      compatibility of this device class with new updates. If a device is ever

      reconnected for this device class it will be re-created.
    fullName: deleteDeviceClass
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        deleteDeviceClass: (deviceClassId: string, options?:
        DeviceManagementDeleteDeviceClassOptionalParams) => Promise<void>
      return:
        description: ''
        type: >-
          (deviceClassId: string, options?:
          DeviceManagementDeleteDeviceClassOptionalParams) =&gt;
          Promise&lt;void&gt;
  - name: deleteDeviceClassSubgroup
    uid: >-
      @azure/iot-device-update.DeviceManagementOperations.deleteDeviceClassSubgroup
    package: '@azure/iot-device-update'
    summary: >-
      Deletes a device class subgroup. This subgroup is automatically created
      when a

      Device Update-enabled device is connected to the hub and reports its

      properties. Groups, subgroups, and deployments are not automatically
      cleaned up

      but are retained for history purposes. Users can call this method to
      delete a

      subgroup if they do not need to retain any of the history of the subgroup
      and

      no longer need it. If a device is ever connected again for this subgroup
      after

      the subgroup was deleted it will be automatically re-created but there
      will be

      no history.
    fullName: deleteDeviceClassSubgroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        deleteDeviceClassSubgroup: (groupId: string, deviceClassId: string,
        options?: DeviceManagementDeleteDeviceClassSubgroupOptionalParams) =>
        Promise<void>
      return:
        description: ''
        type: >-
          (groupId: string, deviceClassId: string, options?:
          DeviceManagementDeleteDeviceClassSubgroupOptionalParams) =&gt;
          Promise&lt;void&gt;
  - name: deleteGroup
    uid: '@azure/iot-device-update.DeviceManagementOperations.deleteGroup'
    package: '@azure/iot-device-update'
    summary: >-
      Deletes a device group. This group is automatically created when a Device

      Update-enabled device is connected to the hub and reports its properties.

      Groups, subgroups, and deployments are not automatically cleaned up but
      are

      retained for history purposes. Users can call this method to delete a
      group if

      they do not need to retain any of the history of the group and no longer
      need

      it. If a device is ever connected again for this group after the group was

      deleted it will be automatically re-created but there will be no history.
    fullName: deleteGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        deleteGroup: (groupId: string, options?:
        DeviceManagementDeleteGroupOptionalParams) => Promise<void>
      return:
        description: ''
        type: >-
          (groupId: string, options?: DeviceManagementDeleteGroupOptionalParams)
          =&gt; Promise&lt;void&gt;
