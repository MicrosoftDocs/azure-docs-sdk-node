### YamlMime:TSTypeAlias
name: ProvisioningState
uid: '@azure/arm-platformvalidation.ProvisioningState'
package: '@azure/arm-platformvalidation'
summary: >-
  The resource provisioning state. \

  [KnownProvisioningState](xref:@azure/arm-platformvalidation.KnownProvisioningState)
  can be used interchangeably with ProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: Resource has been created. \

  **Failed**: Resource creation failed. \

  **Canceled**: Resource creation was canceled. \

  **Creating**: The resource is being provisioned. \

  **Updating**: The resource is updating. \

  **Disabling**: The resource is being disabled. \

  **Deleting**: The resource is being deleted \

  **Accepted**: The resource create request has been accepted
fullName: ProvisioningState
remarks: ''
isDeprecated: false
syntax: |
  type ProvisioningState = string
