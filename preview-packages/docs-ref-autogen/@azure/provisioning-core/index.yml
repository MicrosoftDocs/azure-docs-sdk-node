  - name: createParameter<T, A>(Stack, string, T, ParameterOptions<T, A>)
    uid: '@azure/provisioning-core.createParameter'
    package: '@azure/provisioning-core'
    summary: |+
      A deploy-time input to a stack, compiled to a Bicep `param` declaration.

      **Example**

      ```typescript snippet:ignore
      import { Stack, createParameter } from "@azure/provisioning-core";

      const stack = new Stack("my-app", { targetScope: "resourceGroup" });
      const env = createParameter(stack, "env", "string", {
        allowed: ["dev", "staging", "prod"] as const,
        defaultValue: "dev",
      });
      ```

    remarks: |-
      The returned value is an `Expression` that can be passed to resource
      properties. At deploy time, the user supplies the actual value. The
      declaration metadata is stored separately on the stack, keyed by name.
    isDeprecated: false
    syntax:
      content: >-
        function createParameter<T, A>(stack: Stack, name: string, type: T,
        options?: ParameterOptions<T, A>): Parameter<T, A>
      parameters:
        - id: stack
          type: <xref uid="@azure/provisioning-core.Stack" />
          description: ''
        - id: name
          type: string
          description: ''
        - id: type
          type: T
          description: ''
        - id: options
          type: <xref uid="@azure/provisioning-core.ParameterOptions" />&lt;T, A&gt;
          description: ''
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Parameter" />&lt;T, A&gt;
