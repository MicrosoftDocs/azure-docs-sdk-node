### YamlMime:TSTypeAlias
name: IndexedSharePointContainerName
uid: '@azure/search-documents.IndexedSharePointContainerName'
package: '@azure/search-documents'
summary: >-
  Specifies which SharePoint libraries to access. \

  [KnownIndexedSharePointContainerName](xref:@azure/search-documents.KnownIndexedSharePointContainerName)
  can be used interchangeably with IndexedSharePointContainerName,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **defaultSiteLibrary**: Index content from the site's default document
  library. \

  **allSiteLibraries**: Index content from every document library in the site. \

  **useQuery**: Use a query to filter SharePoint content. \

  **allSiteLists**: Index content from every list in the site. \

  **allSitePages**: Index content from every page in the site. \

  **allSiteContent**: Index content from all supported libraries, lists, and
  pages in the site.
fullName: IndexedSharePointContainerName
remarks: ''
isDeprecated: false
syntax: |
  type IndexedSharePointContainerName = string
