### YamlMime:TSType
name: AgentPoolNICPublicIPAddressConfiguration
uid: '@azure/arm-containerservice.AgentPoolNICPublicIPAddressConfiguration'
package: '@azure/arm-containerservice'
summary: >-
  Public IP configuration applied to a secondary NIC on an agent pool. `ipTags`
  and `publicIPPrefixID` are mutually exclusive, matching the primary NIC's
  behavior. For more information, see https://aka.ms/aks/multi-nic
fullName: AgentPoolNICPublicIPAddressConfiguration
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: ipTags
    uid: >-
      @azure/arm-containerservice.AgentPoolNICPublicIPAddressConfiguration.ipTags
    package: '@azure/arm-containerservice'
    summary: >-
      IP tags to attach to the public IP allocated for this NIC. Each tag's
      `ipTagType` must be `FirstPartyUsage`, `NetworkDomain`, or
      `RoutingPreference`. Mutually exclusive with `publicIPPrefixID`.
    fullName: ipTags
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ipTags?: IPTag[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.IPTag" />[]
  - name: publicIPAddressVersion
    uid: >-
      @azure/arm-containerservice.AgentPoolNICPublicIPAddressConfiguration.publicIPAddressVersion
    package: '@azure/arm-containerservice'
    summary: >-
      IP version of the public IP provisioned for this NIC. Required: its
      presence is what enables public IP provisioning, so an empty configuration
      allocates nothing. `IPv4` is the only accepted value.
    fullName: publicIPAddressVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publicIPAddressVersion: string'
      return:
        description: ''
        type: string
  - name: publicIPPrefixID
    uid: >-
      @azure/arm-containerservice.AgentPoolNICPublicIPAddressConfiguration.publicIPPrefixID
    package: '@azure/arm-containerservice'
    summary: >-
      The resource ID of a public IP prefix to draw this NIC's public IP from.
      Mutually exclusive with `ipTags`.
    fullName: publicIPPrefixID
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publicIPPrefixID?: string'
      return:
        description: ''
        type: string
