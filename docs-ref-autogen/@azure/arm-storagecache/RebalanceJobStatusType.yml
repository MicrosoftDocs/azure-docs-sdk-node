### YamlMime:TSTypeAlias
name: RebalanceJobStatusType
uid: '@azure/arm-storagecache.RebalanceJobStatusType'
package: '@azure/arm-storagecache'
summary: >-
  The operational state of the rebalance job. InProgress indicates the rebalance
  is running on the cluster. Cancelling indicates a cancel has been requested.
  Canceled indicates the rebalance was cancelled. Completed indicates the
  rebalance finished successfully (imbalance below low watermark). Failed
  indicates the rebalance was unable to complete due to a fatal error. Deleting
  indicates the job is being cleaned up during deletion. RollingBack indicates
  the orchestrator is rolling back provisioned resources after a failure. \

  [KnownRebalanceJobStatusType](xref:@azure/arm-storagecache.KnownRebalanceJobStatusType)
  can be used interchangeably with RebalanceJobStatusType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **InProgress**: The rebalance job is currently running on the cluster. \

  **Cancelling**: A cancel has been requested and the job is stopping. \

  **Canceled**: The rebalance job was canceled before completion. \

  **Completed**: The rebalance job finished successfully. \

  **Failed**: The rebalance job failed due to a fatal error. \

  **Deleting**: The job is being cleaned up during deletion. \

  **RollingBack**: The orchestrator is rolling back provisioned resources after
  a failure.
fullName: RebalanceJobStatusType
remarks: ''
isDeprecated: false
syntax: |
  type RebalanceJobStatusType = string
