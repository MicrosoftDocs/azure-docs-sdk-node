name: KubeLabelSelector
uid: '@azure/arm-network.KubeLabelSelector'
package: '@azure/arm-network'
summary: Kubernetes Label Selector for matching labels in Kubernetes Selector Groups.
fullName: KubeLabelSelector
remarks: ''
