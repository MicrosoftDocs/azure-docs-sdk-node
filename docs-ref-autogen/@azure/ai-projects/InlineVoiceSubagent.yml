### YamlMime:TSType
name: InlineVoiceSubagent
uid: '@azure/ai-projects.InlineVoiceSubagent'
package: '@azure/ai-projects'
summary: >-
  One inline voice subagent owned and versioned with its parent Voice Agent, not
  a separate Agent resource.
fullName: InlineVoiceSubagent
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio_output
    uid: '@azure/ai-projects.InlineVoiceSubagent.audio_output'
    package: '@azure/ai-projects'
    summary: >-
      The output voice configuration activated for this subagent, using the same
      flat voice fields as the top-level audio output. Omission inherits the
      entrypoint configuration; a supplied object replaces the voice-specific
      settings.
    fullName: audio_output
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio_output?: VoiceAgentVoiceConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentVoiceConfig" />
  - name: display_description
    uid: '@azure/ai-projects.InlineVoiceSubagent.display_description'
    package: '@azure/ai-projects'
    summary: >-
      A non-empty display-only description of the specialist behavior. This
      value is not provided to the model.
    fullName: display_description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'display_description: string'
      return:
        description: ''
        type: string
  - name: handoff_conditions
    uid: '@azure/ai-projects.InlineVoiceSubagent.handoff_conditions'
    package: '@azure/ai-projects'
    summary: >-
      Outgoing handoffs from this subagent. The containing subagent supplies
      each condition's source. The service permits at most 128 conditions across
      the entire Agent.
    fullName: handoff_conditions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'handoff_conditions?: VoiceAgentHandoffCondition[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentHandoffCondition" />[]
  - name: id
    uid: '@azure/ai-projects.InlineVoiceSubagent.id'
    package: '@azure/ai-projects'
    summary: >-
      The subagent identifier. New Handoff authoring requires `$entrypoint` as
      the first subagent; other values use the normal handoff ID grammar.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id: string'
      return:
        description: ''
        type: string
  - name: inherit_base_instructions
    uid: '@azure/ai-projects.InlineVoiceSubagent.inherit_base_instructions'
    package: '@azure/ai-projects'
    summary: >-
      Whether the subagent inherits the original top-level instructions before
      applying its own non-empty instructions. Defaults to true; set to false to
      opt out.
    fullName: inherit_base_instructions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'inherit_base_instructions?: boolean'
      return:
        description: ''
        type: boolean
  - name: instructions
    uid: '@azure/ai-projects.InlineVoiceSubagent.instructions'
    package: '@azure/ai-projects'
    summary: >-
      Subagent-specific instructions. With default inheritance, non-empty
      instructions follow the original top-level instructions. Omission, null,
      or an empty string adds nothing after that base. With inheritance
      disabled, only this value applies.
    fullName: instructions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instructions?: string'
      return:
        description: ''
        type: string
  - name: interface
    uid: '@azure/ai-projects.InlineVoiceSubagent.interface'
    package: '@azure/ai-projects'
    summary: >-
      The interaction interface. This phase supports only `voice`; text
      delegation is deferred.
    fullName: interface
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'interface: "voice"'
      return:
        description: ''
        type: '"voice"'
  - name: interim_response
    uid: '@azure/ai-projects.InlineVoiceSubagent.interim_response'
    package: '@azure/ai-projects'
    summary: >-
      Interim-response settings for this subagent. Null disables interim
      responses.
    fullName: interim_response
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'interim_response?: VoiceAgentInterimResponseConfigUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentInterimResponseConfigUnion" />
  - name: max_response_output_tokens
    uid: '@azure/ai-projects.InlineVoiceSubagent.max_response_output_tokens'
    package: '@azure/ai-projects'
    summary: >-
      The maximum output-token count for one response while this subagent is
      active.
    fullName: max_response_output_tokens
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_response_output_tokens?: VoiceAgentHandoffMaxOutputTokens'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentHandoffMaxOutputTokens" />
  - name: model
    uid: '@azure/ai-projects.InlineVoiceSubagent.model'
    package: '@azure/ai-projects'
    summary: >-
      The target model for a cascaded graph. Realtime graphs reject this
      property and retain the connection model.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model?: string'
      return:
        description: ''
        type: string
  - name: parallel_tool_calls
    uid: '@azure/ai-projects.InlineVoiceSubagent.parallel_tool_calls'
    package: '@azure/ai-projects'
    summary: >-
      Whether this subagent may call customer tools in parallel. If omitted, the
      service defaults to false. Subagents with outgoing handoff conditions must
      use `false`.
    fullName: parallel_tool_calls
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parallel_tool_calls?: boolean'
      return:
        description: ''
        type: boolean
  - name: reasoning_effort
    uid: '@azure/ai-projects.InlineVoiceSubagent.reasoning_effort'
    package: '@azure/ai-projects'
    summary: Reasoning effort for a compatible subagent model.
    fullName: reasoning_effort
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'reasoning_effort?: VoiceAgentHandoffReasoningEffort'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentHandoffReasoningEffort" />
  - name: source
    uid: '@azure/ai-projects.InlineVoiceSubagent.source'
    package: '@azure/ai-projects'
    summary: >-
      The definition source. This phase supports only `inline`; referenced Agent
      resources are deferred.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source: "inline"'
      return:
        description: ''
        type: '"inline"'
  - name: temperature
    uid: '@azure/ai-projects.InlineVoiceSubagent.temperature'
    package: '@azure/ai-projects'
    summary: >-
      The sampling temperature for a compatible subagent model, from 0 through
      2.
    fullName: temperature
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'temperature?: number'
      return:
        description: ''
        type: number
  - name: tools
    uid: '@azure/ai-projects.InlineVoiceSubagent.tools'
    package: '@azure/ai-projects'
    summary: >-
      Customer tools available to this subagent. Omission or null selects an
      empty customer tool set.
    fullName: tools
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tools?: VoiceAgentToolUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentToolUnion" />[]
  - name: tool_choice
    uid: '@azure/ai-projects.InlineVoiceSubagent.tool_choice'
    package: '@azure/ai-projects'
    summary: >-
      Tool-selection behavior for this subagent. If omitted, the service
      defaults to auto. Null also selects auto.
    fullName: tool_choice
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tool_choice?: VoiceAgentToolChoice'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentToolChoice" />
  - name: voice_adaptation
    uid: '@azure/ai-projects.InlineVoiceSubagent.voice_adaptation'
    package: '@azure/ai-projects'
    summary: >-
      Voice-optimized instruction adaptation for this subagent. Null disables
      adaptation.
    fullName: voice_adaptation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'voice_adaptation?: VoiceAgentHandoffVoiceAdaptation'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentHandoffVoiceAdaptation" />
