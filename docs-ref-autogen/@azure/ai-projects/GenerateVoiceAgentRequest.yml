### YamlMime:TSType
name: GenerateVoiceAgentRequest
uid: '@azure/ai-projects.GenerateVoiceAgentRequest'
package: '@azure/ai-projects'
summary: >-
  The inputs for generating a voice agent. Only `kind` and `name` are always
  required.

  The authoring service expands these inputs into a full, editable
  `VoiceAgentDefinition`, which is then created through `POST /agents`.

  The generated `instructions` and audio/voice settings are stored as separate
  fields on the resulting agent

  definition, so the caller can edit or override any of them afterward via
  standard agent versioning.
fullName: GenerateVoiceAgentRequest
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: description
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.description'
    package: '@azure/ai-projects'
    summary: >-
      An optional agent description. The authoring service resolves its fallback
      when omitted.
    fullName: description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'description?: string'
      return:
        description: ''
        type: string
  - name: draft
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.draft'
    package: '@azure/ai-projects'
    summary: >-
      (Preview) When `true`, the generated voice agent is created as a draft —
      an editable, unpublished version the caller can review and refine before
      publishing it via the standard create/version path. The service defaults
      to `false` if a value is not specified by the caller, in which case the
      agent is created and published normally.
    fullName: draft
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'draft?: boolean'
      return:
        description: ''
        type: boolean
  - name: goal
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.goal'
    package: '@azure/ai-projects'
    summary: >-
      An optional natural-language description of what the agent should do. When
      supplied, it seeds the generated instructions.
    fullName: goal
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'goal?: string'
      return:
        description: ''
        type: string
  - name: kind
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.kind'
    package: '@azure/ai-projects'
    summary: The agent kind. Always `voice`.
    fullName: kind
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'kind: "voice"'
      return:
        description: ''
        type: '"voice"'
  - name: model
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.model'
    package: '@azure/ai-projects'
    summary: >-
      Optional model identifier. Required when `model_type` is `self_deployed`;
      optional when `model_type` is `managed` or omitted. The service never
      invents a customer deployment name.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model?: string'
      return:
        description: ''
        type: string
  - name: model_type
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.model_type'
    package: '@azure/ai-projects'
    summary: >-
      Optional inference mode. When omitted, the authoring service uses
      `managed`. When supplied, use `managed` or `self_deployed`.
    fullName: model_type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model_type?: VoiceModelType'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceModelType" />
  - name: name
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.name'
    package: '@azure/ai-projects'
    summary: >-
      The unique name for the agent to create. Must be a non-empty DNS-like
      agent name.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: tools
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.tools'
    package: '@azure/ai-projects'
    summary: >-
      Optional tools carried through verbatim onto the generated agent (see
      `VoiceAgentTool`).
    fullName: tools
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tools?: VoiceAgentToolUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentToolUnion" />[]
  - name: use_case
    uid: '@azure/ai-projects.GenerateVoiceAgentRequest.use_case'
    package: '@azure/ai-projects'
    summary: An optional authoring use case. An empty string is accepted.
    fullName: use_case
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'use_case?: string'
      return:
        description: ''
        type: string
