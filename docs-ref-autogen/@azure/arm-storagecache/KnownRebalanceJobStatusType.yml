### YamlMime:TSEnum
name: KnownRebalanceJobStatusType
uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType'
package: '@azure/arm-storagecache'
summary: >-
  The operational state of the rebalance job. InProgress indicates the rebalance
  is running on the cluster. Cancelling indicates a cancel has been requested.
  Canceled indicates the rebalance was cancelled. Completed indicates the
  rebalance finished successfully (imbalance below low watermark). Failed
  indicates the rebalance was unable to complete due to a fatal error. Deleting
  indicates the job is being cleaned up during deletion. RollingBack indicates
  the orchestrator is rolling back provisioned resources after a failure.
fullName: KnownRebalanceJobStatusType
remarks: ''
isDeprecated: false
fields:
  - name: Canceled
    uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType.Canceled'
    package: '@azure/arm-storagecache'
    summary: The rebalance job was canceled before completion.
  - name: Cancelling
    uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType.Cancelling'
    package: '@azure/arm-storagecache'
    summary: A cancel has been requested and the job is stopping.
  - name: Completed
    uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType.Completed'
    package: '@azure/arm-storagecache'
    summary: The rebalance job finished successfully.
  - name: Deleting
    uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType.Deleting'
    package: '@azure/arm-storagecache'
    summary: The job is being cleaned up during deletion.
  - name: Failed
    uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType.Failed'
    package: '@azure/arm-storagecache'
    summary: The rebalance job failed due to a fatal error.
  - name: InProgress
    uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType.InProgress'
    package: '@azure/arm-storagecache'
    summary: The rebalance job is currently running on the cluster.
  - name: RollingBack
    uid: '@azure/arm-storagecache.KnownRebalanceJobStatusType.RollingBack'
    package: '@azure/arm-storagecache'
    summary: The orchestrator is rolling back provisioned resources after a failure.
