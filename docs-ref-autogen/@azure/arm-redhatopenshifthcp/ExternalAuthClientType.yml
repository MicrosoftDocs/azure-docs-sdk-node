### YamlMime:TSTypeAlias
name: ExternalAuthClientType
uid: '@azure/arm-redhatopenshifthcp.ExternalAuthClientType'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  Representation of the possible values of an external authentication client's
  type \

  [KnownExternalAuthClientType](xref:@azure/arm-redhatopenshifthcp.KnownExternalAuthClientType)
  can be used interchangeably with ExternalAuthClientType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Confidential**: Indicates that the client is confidential.

  Confidential clients must provide a client secret.

  The secret should be provided within the cluster itself. \

  **Public**: Indicates that the client is public.

  Public clients must not provide a client secret.
fullName: ExternalAuthClientType
remarks: ''
isDeprecated: false
syntax: |
  type ExternalAuthClientType = string
