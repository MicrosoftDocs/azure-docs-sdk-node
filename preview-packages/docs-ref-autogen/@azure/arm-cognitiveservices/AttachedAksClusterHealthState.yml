name: AttachedAksClusterHealthState
uid: '@azure/arm-cognitiveservices.AttachedAksClusterHealthState'
package: '@azure/arm-cognitiveservices'
summary: >-
  Health state of an attachment or one of its components. \

  [KnownAttachedAksClusterHealthState](xref:@azure/arm-cognitiveservices.KnownAttachedAksClusterHealthState)
  can be used interchangeably with AttachedAksClusterHealthState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: Health has not yet been established. \

  **Healthy**: The attachment or component is healthy. \

  **Degraded**: The attachment or component is degraded. \

  **Unhealthy**: The attachment or component is unhealthy.
