name: UpdateTelephonyBindingRequest
uid: '@azure/ai-projects.UpdateTelephonyBindingRequest'
package: '@azure/ai-projects'
summary: >-
  The request to update an existing telephony binding. Every property is
  optional and the binding's provider is immutable.
