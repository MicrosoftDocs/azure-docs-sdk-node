### YamlMime:TSEnum
name: KnownTlsInspectionAction
uid: '@azure/arm-networksecurity.KnownTlsInspectionAction'
package: '@azure/arm-networksecurity'
summary: The TLS inspection action.
fullName: KnownTlsInspectionAction
remarks: ''
isDeprecated: false
fields:
  - name: Bypass
    uid: '@azure/arm-networksecurity.KnownTlsInspectionAction.Bypass'
    package: '@azure/arm-networksecurity'
    summary: >-
      Do not intercept the TLS connection. FQDN filtering still applies, using
      the TLS server name (SNI).
  - name: Inspect
    uid: '@azure/arm-networksecurity.KnownTlsInspectionAction.Inspect'
    package: '@azure/arm-networksecurity'
    summary: >-
      Intercept and decrypt the TLS connection, so policies that read the HTTP
      request apply.
