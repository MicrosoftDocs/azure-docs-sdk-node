### YamlMime:TSTypeAlias
name: VoiceConversationStatus
uid: '@azure/ai-projects.VoiceConversationStatus'
package: '@azure/ai-projects'
summary: >-
  The lifecycle status of a persisted voice conversation:

  - `in_progress`: the live session is active, or post-session persistence
  finalization is pending.

  - `completed`: finalization succeeded after normal or client close,
  `end_conversation`, a max-duration `1001`
    close, or a client or network disconnect that the service can still finalize.
  - `failed`: a terminal service, bridge, storage, or unrecoverable transport
  failure prevented finalization.
fullName: VoiceConversationStatus
remarks: ''
isDeprecated: false
syntax: |
  type VoiceConversationStatus = "in_progress" | "completed" | "failed"
