### YamlMime:TSType
name: ToolControlEntry
uid: '@azure/arm-cognitiveservices.ToolControlEntry'
package: '@azure/arm-cognitiveservices'
summary: >-
  Identifies a tool by its canonical type and optional MCP server URL or
  connector.
fullName: ToolControlEntry
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: connectorId
    uid: '@azure/arm-cognitiveservices.ToolControlEntry.connectorId'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The opaque MCP connector catalog identifier, not an Azure resource ID.
      Applies only to type mcp and cannot be specified together with serverUrl.
    fullName: connectorId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'connectorId?: string'
      return:
        description: ''
        type: string
  - name: serverUrl
    uid: '@azure/arm-cognitiveservices.ToolControlEntry.serverUrl'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The absolute HTTPS URL or URL pattern of an MCP server, stored as a string
      to support wildcards. The entire URL may contain at most one literal '*'
      across its hostname, path, query, and fragment. Supported patterns include
      https://*.contoso.com/mcp, https://contoso.com/mcp/*,
      https://contoso.com/mcp?tenant=*, and https://contoso.com/mcp#*. A
      hostname wildcard must be the leftmost label. The URL must not contain
      user information. Applies only to type mcp and cannot be specified
      together with connectorId.
    fullName: serverUrl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'serverUrl?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-cognitiveservices.ToolControlEntry.type'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The canonical tool type. For type mcp, exactly one of serverUrl or
      connectorId must be specified. Other tool types must omit both properties.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: string'
      return:
        description: ''
        type: string
