### YamlMime:TSType
name: ContentInspectionProfile
uid: '@azure/arm-networksecurity.ContentInspectionProfile'
package: '@azure/arm-networksecurity'
summary: >-
  A connection to a customer-owned Azure Content Safety account. Configuring the
  connection

  does not create or attach a ContentInspection policy or select traffic for
  inspection.

  The endpoint routes Content Safety calls; a key alone cannot identify the
  account endpoint.

  The customer supplies the key, so the service does not discover account keys
  through Azure

  Resource Manager or require permission to perform the account's listKeys
  action.

  Fields are schema-optional to allow an empty request object. Service
  cross-field validation

  requires both endpoint and apiKey in a nonempty request profile. Read
  responses contain only

  the endpoint; they are not complete connection-update inputs.
fullName: ContentInspectionProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: apiKey
    uid: '@azure/arm-networksecurity.ContentInspectionProfile.apiKey'
    package: '@azure/arm-networksecurity'
    summary: >-
      The nonempty API key for the specified account. Required together with
      endpoint in every

      nonempty request profile, even when the endpoint is unchanged. Supplying a
      different key

      with the endpoint on PUT rotates the stored credential. A missing key in a
      nonempty profile

      is rejected without retrieving a saved key or comparing with the saved
      endpoint to permit omission.

      Null and empty values are rejected, not treated as removal. The key is
      never returned in

      resource, list, or long-running operation responses.
    fullName: apiKey
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'apiKey?: string'
      return:
        description: ''
        type: string
  - name: endpoint
    uid: '@azure/arm-networksecurity.ContentInspectionProfile.endpoint'
    package: '@azure/arm-networksecurity'
    summary: >-
      The HTTPS account endpoint, for example
      `https://contoso.cognitiveservices.azure.com/`.

      Only Azure Content Safety account endpoints in the service's supported
      Azure cloud are

      accepted. Credentials must not be forwarded to other destinations,
      including redirects.

      Required together with apiKey in a nonempty request profile, including key
      rotation.

      Changing the endpoint requires a key for the new account; the stored key
      is not reused.
    fullName: endpoint
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'endpoint?: string'
      return:
        description: ''
        type: string
