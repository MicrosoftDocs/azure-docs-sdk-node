name: AgenticSearchDebugInfo
uid: '@azure/search-documents.AgenticSearchDebugInfo'
package: '@azure/search-documents'
summary: >-
  Bounded diagnostics returned for agentic search when debug selects agentic or
  all. Retrieved documents remain in value; prompts and raw model reasoning are
  excluded. Disabling diagnostics does not disable usage accounting or
  actionable error reporting.
fullName: AgenticSearchDebugInfo
remarks: ''
isDeprecated: false
