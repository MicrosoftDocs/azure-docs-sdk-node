    uid: '@azure/provisioning-storage.types.FileSharePropertiesInput.provisionedIops'
    package: '@azure/provisioning-storage'
    summary: >-
      The provisioned IOPS of the share. This property is only for file shares
      created under Files Provisioned v2 account type. Please refer to the
