### YamlMime:TSType
name: GetSignalRecommendationsResponse
uid: '@azure/arm-cloudhealth.GetSignalRecommendationsResponse'
package: '@azure/arm-cloudhealth'
summary: >-
  Response from `getSignalRecommendations` containing two independent suggestion
  streams for the Azure resource type represented by the target Entity.
  `recommendedSignals` lists signals broadly recommended to be enabled by
  default; `recommendedConfigurations` lists additional metrics that are not
  broadly applicable but, if a caller chooses to monitor one of them, ship with
  suggested starting-point thresholds. The two arrays are independent — items
  are not paired by index, and callers should treat them as two separate
  suggestion streams.
fullName: GetSignalRecommendationsResponse
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: recommendedConfigurations
    uid: >-
      @azure/arm-cloudhealth.GetSignalRecommendationsResponse.recommendedConfigurations
    package: '@azure/arm-cloudhealth'
    summary: >-
      Additional signal configurations for metrics that are not broadly
      applicable to every health model for an Entity of this resource type, but
      if a caller chooses to monitor one of these metrics, the provided
      thresholds are suggested as a starting point. Independent of
      `recommendedSignals` — not paired by index.
    fullName: recommendedConfigurations
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recommendedConfigurations: SignalConfiguration[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-cloudhealth.SignalConfiguration" />[]
  - name: recommendedSignals
    uid: '@azure/arm-cloudhealth.GetSignalRecommendationsResponse.recommendedSignals'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Signals that are broadly recommended to be enabled by default for health
      models monitoring an Entity of this resource type. Each entry is a
      complete signal configuration (metric, aggregation, thresholds) ready to
      be added to a health model. Independent of `recommendedConfigurations` —
      not paired by index.
    fullName: recommendedSignals
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recommendedSignals: SignalConfiguration[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-cloudhealth.SignalConfiguration" />[]
