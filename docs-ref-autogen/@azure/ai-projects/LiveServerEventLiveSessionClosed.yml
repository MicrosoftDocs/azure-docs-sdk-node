### YamlMime:TSType
name: LiveServerEventLiveSessionClosed
uid: '@azure/ai-projects.LiveServerEventLiveSessionClosed'
package: '@azure/ai-projects'
summary: >-
  Returned after the Live session finishes finalizing, with the close reason,
  final session snapshot, and cumulative audio usage. A connection closing
  without this event does not confirm successful finalization.
fullName: LiveServerEventLiveSessionClosed
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: client_event_id
    uid: '@azure/ai-projects.LiveServerEventLiveSessionClosed.client_event_id'
    package: '@azure/ai-projects'
    summary: >-
      The event_id of the client command associated with this server event, when
      supplied.
    fullName: client_event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'client_event_id?: string'
      return:
        description: ''
        type: string
  - name: event_id
    uid: '@azure/ai-projects.LiveServerEventLiveSessionClosed.event_id'
    package: '@azure/ai-projects'
    summary: The unique ID of the Live server event.
    fullName: event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'event_id: string'
      return:
        description: ''
        type: string
  - name: reason
    uid: '@azure/ai-projects.LiveServerEventLiveSessionClosed.reason'
    package: '@azure/ai-projects'
    summary: >-
      Why the Live session ended: `close_requested` for an application close or
      hangup request, `expired` for the session duration limit, `content` for a
      safety filter, `remote_hangup` for a graceful remote disconnect, or
      `connection_lost` for an unexpected primary or upstream disconnection.
    fullName: reason
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        reason: "expired" | "close_requested" | "content" | "remote_hangup" |
        "connection_lost"
      return:
        description: ''
        type: >-
          "expired" | "close_requested" | "content" | "remote_hangup" |
          "connection_lost"
  - name: session
    uid: '@azure/ai-projects.LiveServerEventLiveSessionClosed.session'
    package: '@azure/ai-projects'
    summary: >-
      The final Live session snapshot. Its status remains active; the
      session.closed event indicates closure.
    fullName: session
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'session: VoiceAgentLiveSessionResource'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentLiveSessionResource" />
  - name: type
    uid: '@azure/ai-projects.LiveServerEventLiveSessionClosed.type'
    package: '@azure/ai-projects'
    summary: The event type, always `session.closed`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "session.closed"'
      return:
        description: ''
        type: '"<xref uid="session.closed" />"'
  - name: usage
    uid: '@azure/ai-projects.LiveServerEventLiveSessionClosed.usage'
    package: '@azure/ai-projects'
    summary: The final cumulative Live audio usage after session finalization.
    fullName: usage
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'usage: LiveSessionUsage'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveSessionUsage" />
extends: <xref uid="@azure/ai-projects.LiveServerEvent" />
