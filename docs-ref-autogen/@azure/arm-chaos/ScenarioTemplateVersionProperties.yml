### YamlMime:TSType
name: ScenarioTemplateVersionProperties
uid: '@azure/arm-chaos.ScenarioTemplateVersionProperties'
package: '@azure/arm-chaos'
summary: >-
  Model that represents the properties of a single published version of a
  scenario template —

  the blueprint content itself.
fullName: ScenarioTemplateVersionProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: actions
    uid: '@azure/arm-chaos.ScenarioTemplateVersionProperties.actions'
    package: '@azure/arm-chaos'
    summary: >-
      The actions that define the template's orchestration. These are the same
      model a scenario

      publishes, and carry unresolved `%%\{...\}%%` macros; the macros are
      substituted when the

      scenario runs, not when it is read or created.


      Three macro namespaces may appear:


      - `%%\{parameters.\<name\>\}%%` — resolves from the parameter values
      supplied when the

      scenario is configured. The accepted names are declared by `parameters`.

      - `%%\{resourceTargeting.include.\<dimension\>\}%%` — resolves from the
      resource targeting

      of the scenario's configuration (for example `zones`, `locations`). The
      template does not

      declare these; they are dimensions of the configuration supplied at run
      time.

      - `%%\{filters.\<dimension\>\}%%` — deprecated spelling of
      `resourceTargeting.include.`,

      retained only so that superseded template versions keep resolving. Do not
      depend on it;

      the newest version of every template uses `resourceTargeting.include.`.


      An action's `failureBehavior` overrides the template-wide
      `failureBehavior` for that action

      alone; an action that does not carry one inherits the template-wide value.
    fullName: actions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'actions: ScenarioAction[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ScenarioAction" />[]
  - name: description
    uid: '@azure/arm-chaos.ScenarioTemplateVersionProperties.description'
    package: '@azure/arm-chaos'
    summary: >-
      Description of what the template does, and what resilience question it
      answers.
    fullName: description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'description?: string'
      return:
        description: ''
        type: string
  - name: displayName
    uid: '@azure/arm-chaos.ScenarioTemplateVersionProperties.displayName'
    package: '@azure/arm-chaos'
    summary: Localized display name of the template.
    fullName: displayName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'displayName?: string'
      return:
        description: ''
        type: string
  - name: failureBehavior
    uid: '@azure/arm-chaos.ScenarioTemplateVersionProperties.failureBehavior'
    package: '@azure/arm-chaos'
    summary: >-
      Template-wide default for how a scenario run reacts when one of this
      template's actions

      fails. An action that does not carry its own `failureBehavior` inherits
      this value; when

      neither is present the effective behavior is `Stop`.


      A scenario created from this template takes this policy with the rest of
      the template's

      structure, so it is also the scenario's resolved `failureBehavior`.
      Template versions

      published before this policy existed do not carry one and report it as
      absent, which the

      run resolves as `Stop`.
    fullName: failureBehavior
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'failureBehavior?: string'
      return:
        description: ''
        type: string
  - name: parameters
    uid: '@azure/arm-chaos.ScenarioTemplateVersionProperties.parameters'
    package: '@azure/arm-chaos'
    summary: >-
      Parameter definitions the template accepts. Values are supplied when the
      scenario created

      from this template is configured, and are referenced from an action
      through the

      `%%\{parameters.\<name\>\}%%` macro.
    fullName: parameters
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parameters?: ScenarioParameter[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ScenarioParameter" />[]
