### YamlMime:TSTypeAlias
name: PolicyAction
uid: '@azure/arm-policy.PolicyAction'
package: '@azure/arm-policy'
summary: >-
  The effective outcome of the policy evaluation based on both the policy effect
  and evaluation result. Possible values are Unknown, Allow, Audit, Deny, Error.
  \

  [KnownPolicyAction](xref:@azure/arm-policy.KnownPolicyAction) can be used
  interchangeably with PolicyAction,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: The effective outcome of policy evaluation is unknown. \

  **Allow**: The effective outcome of policy evaluation is to allow the request.
  \

  **Audit**: The effective outcome of policy evaluation is to audit the request.
  \

  **Deny**: The effective outcome of policy evaluation is to deny the request. \

  **Error**: The policy evaluation resulted in an error.
fullName: PolicyAction
remarks: ''
isDeprecated: false
syntax: |
  type PolicyAction = string
