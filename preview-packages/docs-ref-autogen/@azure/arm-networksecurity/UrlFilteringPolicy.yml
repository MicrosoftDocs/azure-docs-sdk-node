  - name: rules
    uid: '@azure/arm-networksecurity.UrlFilteringPolicy.rules'
    package: '@azure/arm-networksecurity'
    summary: >-
      The list of URL filtering rules. Service validation may limit rules-based
      policies to 1 to 5

      rules; the schema retains the earlier array shape for compatibility. Rules
      are evaluated in

      ascending priority order and the first matching rule decides; rule
      priorities must be unique

      within the policy. A rule without an action uses the policy defaultAction.
      When no rule matches

      a request to a host that a rule names, the policy defaultAction applies.
      Requests to other

      hosts are not decided by this policy.
