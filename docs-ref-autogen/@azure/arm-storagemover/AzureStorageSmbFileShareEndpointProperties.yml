properties:
  - name: allowedStorageAccounts
    uid: >-
      @azure/arm-storagemover.AzureStorageSmbFileShareEndpointProperties.allowedStorageAccounts
    package: '@azure/arm-storagemover'
    summary: >-
      Full ARM resource IDs of partner-tenant storage accounts that are allowed

      to be the other side of a cross-tenant data transfer pair with this

      endpoint. For a source endpoint this lists allowed target storage
      accounts;

      for a target endpoint this lists allowed source storage accounts.

      The full list is replaced on PATCH (omit an entry to remove it; include

      an entry to add it). Mutual presence in both endpoints' allow lists is

      re-validated at every job run start, so removing an entry blocks future

      runs that reference the removed storage account.
    fullName: allowedStorageAccounts
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowedStorageAccounts?: string[]'
      return:
        description: ''
        type: string[]
  - name: enableCrossTenantTransfer
    uid: >-
      @azure/arm-storagemover.AzureStorageSmbFileShareEndpointProperties.enableCrossTenantTransfer
    package: '@azure/arm-storagemover'
    summary: >-
      Opt-in flag enabling this endpoint to be used as one side of a
      cross-tenant

      data transfer pair. When set to true, RBAC for the endpoint's managed

      identity is granted on the customer's storage account so that
      authorization

      can be performed entirely in the tenant where this endpoint lives.
      Defaults

      to false. Can be updated via PATCH.
    fullName: enableCrossTenantTransfer
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enableCrossTenantTransfer?: boolean'
      return:
        description: ''
        type: boolean
  - name: endpointType
    uid: >-
      @azure/arm-storagemover.AzureStorageSmbFileShareEndpointProperties.endpointType
