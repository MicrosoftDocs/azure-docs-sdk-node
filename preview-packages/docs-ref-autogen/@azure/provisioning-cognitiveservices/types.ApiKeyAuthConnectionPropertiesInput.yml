name: ApiKeyAuthConnectionPropertiesInput
uid: >-
  @azure/provisioning-cognitiveservices.types.ApiKeyAuthConnectionPropertiesInput
package: '@azure/provisioning-cognitiveservices'
summary: >-
  Input type for This connection type covers the generic ApiKey auth connection
  categories, for examples:

  AzureOpenAI:

  Category:= AzureOpenAI

  AuthType:= ApiKey (as type discriminator)

  Credentials:= {ApiKey} as .ApiKey

  Target:= {ApiBase}


  CognitiveService:

  Category:= CognitiveService

  AuthType:= ApiKey (as type discriminator)

  Credentials:= {SubscriptionKey} as ApiKey

  Target:= ServiceRegion={serviceRegion}


  CognitiveSearch:

  Category:= CognitiveSearch

  AuthType:= ApiKey (as type discriminator)

  Credentials:= {Key} as ApiKey

  Target:= {Endpoint}


  Use Metadata property bag for ApiType, ApiVersion, Kind and other metadata
  fields
