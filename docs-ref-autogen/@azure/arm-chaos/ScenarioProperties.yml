### YamlMime:TSType
name: ScenarioProperties
uid: '@azure/arm-chaos.ScenarioProperties'
package: '@azure/arm-chaos'
summary: Model that represents the properties of the scenario.
fullName: ScenarioProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: actions
    uid: '@azure/arm-chaos.ScenarioProperties.actions'
    package: '@azure/arm-chaos'
    summary: Array of actions that define the scenario's orchestration.
    fullName: actions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'actions?: ScenarioAction[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ScenarioAction" />[]
  - name: createdFrom
    uid: '@azure/arm-chaos.ScenarioProperties.createdFrom'
    package: '@azure/arm-chaos'
    summary: >-
      Resource ID of the template version this scenario was created from
      (optional).

      The ID has the form

      `/providers/Microsoft.Chaos/scenarioTemplates/{scenarioTemplateName}/versions/{version}`.

      This property retains its existing string representation for compatibility

      with earlier API versions and SDKs.


      A scenario's structure comes from exactly one of two mutually exclusive
      sources.

      When `createdFrom` is supplied on create, the referenced template version
      is the

      authoritative source for the scenario's structure; inline `parameters` and

      `actions` are not used. When `createdFrom` is absent, the structure comes
      from

      the inline `parameters` and `actions` supplied in the request.

      Supplying neither source is rejected by request validation.
    fullName: createdFrom
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'createdFrom?: string'
      return:
        description: ''
        type: string
  - name: description
    uid: '@azure/arm-chaos.ScenarioProperties.description'
    package: '@azure/arm-chaos'
    summary: Description of what this scenario does (optional).
    fullName: description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'description?: string'
      return:
        description: ''
        type: string
  - name: failureBehavior
    uid: '@azure/arm-chaos.ScenarioProperties.failureBehavior'
    package: '@azure/arm-chaos'
    summary: >-
      Scenario-wide default for how a scenario run reacts when one of its
      actions fails.

      An action that does not supply its own `failureBehavior` inherits this
      value; when

      neither is supplied the effective behavior is `Stop`.


      Not used when `createdFrom` is supplied, for the same reason as
      `parameters` and

      `actions`: the referenced template version is then the authoritative
      source for the

      scenario's structure, and it supplies this policy too. A value sent in the
      request is

      ignored in that case — on create the referenced template's policy is used,
      and on update

      the policy of the already persisted template is preserved.
    fullName: failureBehavior
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'failureBehavior?: string'
      return:
        description: ''
        type: string
  - name: parameters
    uid: '@azure/arm-chaos.ScenarioProperties.parameters'
    package: '@azure/arm-chaos'
    summary: Parameter definitions for the scenario.
    fullName: parameters
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parameters?: ScenarioParameter[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ScenarioParameter" />[]
  - name: provisioningState
    uid: '@azure/arm-chaos.ScenarioProperties.provisioningState'
    package: '@azure/arm-chaos'
    summary: Most recent provisioning state for the given scenario resource.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: recommendation
    uid: '@azure/arm-chaos.ScenarioProperties.recommendation'
    package: '@azure/arm-chaos'
    summary: The recommendation information for this scenario.
    fullName: recommendation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recommendation?: Recommendation'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.Recommendation" />
  - name: version
    uid: '@azure/arm-chaos.ScenarioProperties.version'
    package: '@azure/arm-chaos'
    summary: >-
      Version of the scenario, supplied by the author. Defaults to `1.0` when
      not

      supplied on create. This is the scenario's own version and is independent
      of

      the version of any template it was created from.
    fullName: version
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'version?: string'
      return:
        description: ''
        type: string
