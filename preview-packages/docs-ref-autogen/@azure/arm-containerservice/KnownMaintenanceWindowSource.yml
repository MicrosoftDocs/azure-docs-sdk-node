fields:
  - name: ClusterAutoUpgradeSchedule
    uid: >-
      @azure/arm-containerservice.KnownMaintenanceWindowSource.ClusterAutoUpgradeSchedule
    package: '@azure/arm-containerservice'
    summary: >-
      The window is derived from the cluster auto-upgrade schedule
      (aksManagedAutoUpgradeSchedule), which governs Kubernetes version
      upgrades.
  - name: NodeOSUpgradeSchedule
    uid: >-
      @azure/arm-containerservice.KnownMaintenanceWindowSource.NodeOSUpgradeSchedule
    package: '@azure/arm-containerservice'
    summary: >-
      The window is derived from the node OS auto-upgrade schedule
      (aksManagedNodeOSUpgradeSchedule), which governs node OS image upgrades.
