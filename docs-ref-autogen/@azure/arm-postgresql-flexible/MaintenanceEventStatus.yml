### YamlMime:TSTypeAlias
name: MaintenanceEventStatus
uid: '@azure/arm-postgresql-flexible.MaintenanceEventStatus'
package: '@azure/arm-postgresql-flexible'
summary: >-
  The status of a maintenance event. \

  [KnownMaintenanceEventStatus](xref:@azure/arm-postgresql-flexible.KnownMaintenanceEventStatus)
  can be used interchangeably with MaintenanceEventStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Planned**: The maintenance event is scheduled and has not yet started. \

  **InProgress**: The maintenance event is currently in progress. \

  **Complete**: The maintenance event has completed successfully. \

  **Rescheduled**: The maintenance event has been rescheduled (postponed) by the
  customer. \

  **Canceled**: The maintenance event was canceled, failed, or timed out.
fullName: MaintenanceEventStatus
remarks: ''
isDeprecated: false
syntax: |
  type MaintenanceEventStatus = string
