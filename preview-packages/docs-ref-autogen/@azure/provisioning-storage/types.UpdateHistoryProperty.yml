### YamlMime:TSType
name: UpdateHistoryProperty
uid: '@azure/provisioning-storage.types.UpdateHistoryProperty'
package: '@azure/provisioning-storage'
summary: An update history of the ImmutabilityPolicy of a blob container.
fullName: UpdateHistoryProperty
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: allowProtectedAppendWrites
    uid: >-
      @azure/provisioning-storage.types.UpdateHistoryProperty.allowProtectedAppendWrites
    package: '@azure/provisioning-storage'
    summary: >-
      This property can only be changed for unlocked time-based retention
      policies. When enabled, new blocks can be written to an append blob while
      maintaining immutability protection and compliance. Only new blocks can be
      added and any existing blocks cannot be modified or deleted. This property
      cannot be changed with ExtendImmutabilityPolicy API.
    fullName: allowProtectedAppendWrites
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowProtectedAppendWrites?: boolean'
      return:
        description: ''
        type: boolean
  - name: allowProtectedAppendWritesAll
    uid: >-
      @azure/provisioning-storage.types.UpdateHistoryProperty.allowProtectedAppendWritesAll
    package: '@azure/provisioning-storage'
    summary: >-
      This property can only be changed for unlocked time-based retention
      policies. When enabled, new blocks can be written to both 'Append and Bock
      Blobs' while maintaining immutability protection and compliance. Only new
      blocks can be added and any existing blocks cannot be modified or deleted.
      This property cannot be changed with ExtendImmutabilityPolicy API. The
      'allowProtectedAppendWrites' and 'allowProtectedAppendWritesAll'
      properties are mutually exclusive.
    fullName: allowProtectedAppendWritesAll
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowProtectedAppendWritesAll?: boolean'
      return:
        description: ''
        type: boolean
  - name: immutabilityPeriodSinceCreationInDays
    uid: >-
      @azure/provisioning-storage.types.UpdateHistoryProperty.immutabilityPeriodSinceCreationInDays
    package: '@azure/provisioning-storage'
    summary: >-
      The immutability period for the blobs in the container since the policy
      creation, in days.
    fullName: immutabilityPeriodSinceCreationInDays
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'immutabilityPeriodSinceCreationInDays?: number'
      return:
        description: ''
        type: number
  - name: objectIdentifier
    uid: '@azure/provisioning-storage.types.UpdateHistoryProperty.objectIdentifier'
    package: '@azure/provisioning-storage'
    summary: Returns the Object ID of the user who updated the ImmutabilityPolicy.
    fullName: objectIdentifier
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'objectIdentifier?: string'
      return:
        description: ''
        type: string
  - name: tenantId
    uid: '@azure/provisioning-storage.types.UpdateHistoryProperty.tenantId'
    package: '@azure/provisioning-storage'
    summary: >-
      Returns the Tenant ID that issued the token for the user who updated the
      ImmutabilityPolicy.
    fullName: tenantId
    remarks: ''
    isDeprecated: false
    syntax:
