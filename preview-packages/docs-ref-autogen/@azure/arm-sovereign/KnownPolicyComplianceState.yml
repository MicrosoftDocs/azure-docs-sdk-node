### YamlMime:TSEnum
name: KnownPolicyComplianceState
uid: '@azure/arm-sovereign.KnownPolicyComplianceState'
package: '@azure/arm-sovereign'
summary: Supported compliance states for the policy initiatives.
fullName: KnownPolicyComplianceState
remarks: ''
isDeprecated: false
fields:
  - name: Compliant
    uid: '@azure/arm-sovereign.KnownPolicyComplianceState.Compliant'
    package: '@azure/arm-sovereign'
    summary: The resource is compliant with respect to the given policy.
  - name: Conflict
    uid: '@azure/arm-sovereign.KnownPolicyComplianceState.Conflict'
    package: '@azure/arm-sovereign'
    summary: The resource is in a conflict with respect to the given policy.
  - name: Constrained
    uid: '@azure/arm-sovereign.KnownPolicyComplianceState.Constrained'
    package: '@azure/arm-sovereign'
    summary: >-
      The resource is non-compliant for Business Continuity, but a validated
      actionable escape path is available.
  - name: NonCompliant
    uid: '@azure/arm-sovereign.KnownPolicyComplianceState.NonCompliant'
    package: '@azure/arm-sovereign'
    summary: The resource is not compliant with respect to the given policy.
  - name: NotApplicable
    uid: '@azure/arm-sovereign.KnownPolicyComplianceState.NotApplicable'
    package: '@azure/arm-sovereign'
    summary: The resource is in a state that is not applicable to the given policy.
  - name: NotEvaluated
    uid: '@azure/arm-sovereign.KnownPolicyComplianceState.NotEvaluated'
    package: '@azure/arm-sovereign'
    summary: >-
      The resource has not been evaluated for compliance with respect to the
      given policy.
  - name: Others
    uid: '@azure/arm-sovereign.KnownPolicyComplianceState.Others'
    package: '@azure/arm-sovereign'
    summary: >-
      The resource is in a compliance state other than Compliant, NonCompliant,
