### YamlMime:TSType
name: UsernameClaimProfile
uid: '@azure/arm-redhatopenshifthcp.UsernameClaimProfile'
package: '@azure/arm-redhatopenshifthcp'
summary: |-
  External Auth claim profile
  This configures how the username of a cluster identity should be constructed
  from the claims in a JWT token issued by the identity provider.
fullName: UsernameClaimProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: claim
    uid: '@azure/arm-redhatopenshifthcp.UsernameClaimProfile.claim'
    package: '@azure/arm-redhatopenshifthcp'
    summary: Claim name of the external profile
    fullName: claim
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'claim: string'
      return:
        description: ''
        type: string
  - name: prefix
    uid: '@azure/arm-redhatopenshifthcp.UsernameClaimProfile.prefix'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      Prefix for the claim external profile

      Must be set when the prefixPolicy field is set to 'Prefix' and must be
      unset

      otherwise.
    fullName: prefix
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'prefix?: string'
      return:
        description: ''
        type: string
  - name: prefixPolicy
    uid: '@azure/arm-redhatopenshifthcp.UsernameClaimProfile.prefixPolicy'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      Prefix policy is an optional field that configures how a prefix should be

      applied to the value of the JWT claim specified in the 'claim' field.


      Allowed values are 'Prefix', 'NoPrefix', and 'None'. If not specified, the

      default policy is 'None'.


      When set to 'Prefix', the value specified in the prefix field will be

      prepended to the value of the JWT claim.

      The prefix field must be set when prefixPolicy is 'Prefix'.


      When set to 'NoPrefix', no prefix will be prepended to the value

      of the JWT claim.


      When set to 'None', this means no opinion and the platform is left to
      choose

      any prefixes that are applied which is subject to change over time.

      Currently, the platform prepends `{issuerURL}#` to the value of the JWT
      claim

      when the claim is not 'email'.

      As an example, consider the following scenario:

      `prefix` is unset, `issuerURL` is set to `https://myoidc.tld`,

      the JWT claims include "username":"userA" and "email":"userA
    fullName: prefixPolicy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'prefixPolicy?: string'
      return:
        description: ''
        type: string
