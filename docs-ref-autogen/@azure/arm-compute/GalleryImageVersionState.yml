### YamlMime:TSTypeAlias
name: GalleryImageVersionState
uid: '@azure/arm-compute.GalleryImageVersionState'
package: '@azure/arm-compute'
summary: >-
  The state of a gallery image version, derived from its soft-delete status. \

  [KnownGalleryImageVersionState](xref:@azure/arm-compute.KnownGalleryImageVersionState)
  can be used interchangeably with GalleryImageVersionState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Active**: The gallery image version is active and available for use. \

  **SoftDeleted**: The gallery image version has been soft-deleted. It is
  available for use only when a specific version is requested, and it will not
  be resolved as the latest version.
fullName: GalleryImageVersionState
remarks: ''
isDeprecated: false
syntax: |
  type GalleryImageVersionState = string
