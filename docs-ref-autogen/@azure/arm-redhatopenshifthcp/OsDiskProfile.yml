  - name: encryptionSetId
    uid: '@azure/arm-redhatopenshifthcp.OsDiskProfile.encryptionSetId'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      The ID of the DiskEncryptionSet resource to use to encrypt the OS disks
      for the VMs.

      This needs to exist in the same subscription id listed in the Hosted
      Cluster, HostedCluster.Spec.Platform.Azure.SubscriptionID.

      DiskEncryptionSetID should also exist in a resource group under the same
      subscription id and the same location

      listed in the Hosted Cluster, HostedCluster.Spec.Platform.Azure.Location.


      Details on how to create a Disk Encryption Set can be found here:

      https://learn.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys-portal#set-up-your-disk-encryption-set
    fullName: encryptionSetId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'encryptionSetId?: string'
      return:
        description: ''
        type: string
  - name: sizeGiB
    uid: '@azure/arm-redhatopenshifthcp.OsDiskProfile.sizeGiB'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      The OS disk size in GiB. Maximum is 4095 GiB for Managed disks. For
      Ephemeral disks,

      the maximum is 2040 GiB; Azure may enforce a lower effective limit based
      on the

      selected VM size's local cache, temp, or NVMe capacity.
    fullName: sizeGiB
    remarks: ''
    isDeprecated: false
    syntax:
