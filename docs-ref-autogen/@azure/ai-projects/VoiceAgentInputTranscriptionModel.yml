### YamlMime:TSTypeAlias
name: VoiceAgentInputTranscriptionModel
uid: '@azure/ai-projects.VoiceAgentInputTranscriptionModel'
package: '@azure/ai-projects'
summary: >-
  The input-audio transcription model identifier. This is a model name, not a
  Foundry deployment name. Mirrors the transcription models supported by the
  managed

  voice backend, covering the OpenAI Realtime transcription models plus the
  Azure and MAI models.

  `azure-speech-streaming` is supported for cascaded text-model conversations
  only (not realtime speech-to-speech models), requires a nonempty `language`
  such as `en-US` (comma-separated locales are supported), and supports
  `custom_speech`, `phrase_list`, and `profanity_filter`.

  Additional values may be added over time.
fullName: VoiceAgentInputTranscriptionModel
remarks: ''
isDeprecated: false
syntax: |
  type VoiceAgentInputTranscriptionModel =
    | "whisper-1"
    | "gpt-realtime-whisper"
    | "gpt-4o-transcribe"
    | "gpt-4o-mini-transcribe"
    | "gpt-4o-transcribe-diarize"
    | "gpt-transcribe"
    | "gpt-live-transcribe"
    | "mai-transcribe"
    | "azure-speech"
    | "azure-speech-streaming"
