package: '@azure/arm-cognitiveservices'
summary: >-
  Built-in request attributes supported for traffic filtering. \

  [KnownCostControlFilterName](xref:@azure/arm-cognitiveservices.KnownCostControlFilterName)
  can be used interchangeably with CostControlFilterName,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **agent**: The Foundry agent name within the single explicitly selected
  Foundry project. \

  **sessionId**: The Foundry session ID. \

  **project**: The Foundry project name within the owning account. \

  **deployment**: The deployment name within the owning account. \

  **tokenType**: The input or output token category.
