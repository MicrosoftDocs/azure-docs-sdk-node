### YamlMime:TSTypeAlias
name: BenchmarkLevel
uid: '@azure/arm-aiinfraoptimization.BenchmarkLevel'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  How closely benchmark evidence matches a recommended topology. \

  [KnownBenchmarkLevel](xref:@azure/arm-aiinfraoptimization.KnownBenchmarkLevel)
  can be used interchangeably with BenchmarkLevel,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Benchmarked**: The accelerator family has benchmark evidence at a different
  topology. \

  **TopologyMatched**: The benchmark matches the recommended node and
  accelerator counts.
fullName: BenchmarkLevel
remarks: ''
isDeprecated: false
syntax: |
  type BenchmarkLevel = string
