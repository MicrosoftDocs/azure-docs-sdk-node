name: KnowledgeBaseModelKind
uid: '@azure/search-documents.KnowledgeBaseModelKind'
package: '@azure/search-documents'
summary: >-
  The AI model to be used for query planning. \

  [KnownKnowledgeBaseModelKind](xref:@azure/search-documents.KnownKnowledgeBaseModelKind)
  can be used interchangeably with KnowledgeBaseModelKind,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **azureOpenAI**: Use Azure Open AI models for query planning. \

  **openAICompatible**: Use a customer-controlled OpenAI-compatible endpoint for
  knowledge base retrieval or knowledge source image verbalization. \

  **microsoftRetriever1**: Use Microsoft Retriever 1 for query planning and
  retrieval.
