### YamlMime:TSType
name: Nat64Capability
uid: '@azure/arm-network.Nat64Capability'
package: '@azure/arm-network'
summary: >-
  The NAT64 capability. Enables stateful NAT64 translation (IPv6-only workloads
  reaching IPv4

  destinations) on the appliance's floating NIC; supported on a dual-stack
  appliance. This kind is

  property-less: it carries no `ipVersion` (the parent appliance's dual-stack
  configuration is the

  precondition, service-validated) beyond the properties common to every
  capability.
fullName: Nat64Capability
remarks: ''
isDeprecated: false
type: interface
