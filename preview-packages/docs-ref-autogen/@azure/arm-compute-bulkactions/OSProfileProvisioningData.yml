### YamlMime:TSType
name: OSProfileProvisioningData
uid: '@azure/arm-compute-bulkactions.OSProfileProvisioningData'
package: '@azure/arm-compute-bulkactions'
summary: >-
  Additional parameters for reimaging a virtual machine that does not use an
  ephemeral operating system disk.
fullName: OSProfileProvisioningData
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: adminPassword
    uid: '@azure/arm-compute-bulkactions.OSProfileProvisioningData.adminPassword'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      The password for the virtual machine administrator account. The password
      must be 8 to 123 characters long for Windows virtual machines or 6 to 72
      characters long for Linux virtual machines. It must contain characters
      from at least three of these categories: lowercase letters, uppercase
      letters, digits, and special characters. The following values are not
      allowed: `abc@123`, `P@$$w0rd`, `P@ssw0rd`, `P@ssword123`, `Pa$$word`,
      `pass@word1`, `Password!`, `Password1`, `Password22`, and `iloveyou!`.
      This secret is accepted only in the request and is not returned in
      responses.
    fullName: adminPassword
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'adminPassword?: string'
      return:
        description: ''
        type: string
  - name: customData
    uid: '@azure/arm-compute-bulkactions.OSProfileProvisioningData.customData'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Base64-encoded custom data provided to the virtual machine. The decoded
      data can contain up to 65,535 bytes. Do not include secrets or passwords.
    fullName: customData
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'customData?: string'
      return:
        description: ''
        type: string
