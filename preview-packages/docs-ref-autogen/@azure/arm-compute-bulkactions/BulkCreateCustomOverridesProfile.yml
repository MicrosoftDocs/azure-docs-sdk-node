name: BulkCreateCustomOverridesProfile
uid: '@azure/arm-compute-bulkactions.BulkCreateCustomOverridesProfile'
package: '@azure/arm-compute-bulkactions'
summary: >-
  Groups the per-VM overrides with the name prefix that names any override that
  does not supply its own VM name.
fullName: BulkCreateCustomOverridesProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: overrides
    uid: '@azure/arm-compute-bulkactions.BulkCreateCustomOverridesProfile.overrides'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Per-VM overrides. The count is the VM count and must equal capacity. Each
      override maps to VM index i.
    fullName: overrides
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'overrides?: BulkCreateCustomOverride[]'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-compute-bulkactions.BulkCreateCustomOverride"
          />[]
  - name: virtualMachineNamePrefix
    uid: >-
      @azure/arm-compute-bulkactions.BulkCreateCustomOverridesProfile.virtualMachineNamePrefix
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Prefix used to build the ARM VM name ({prefix}_{index}) for overrides that
      omit a virtualMachineName. Required when any override is unnamed and
      rejected when every override is named.
    fullName: virtualMachineNamePrefix
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'virtualMachineNamePrefix?: string'
