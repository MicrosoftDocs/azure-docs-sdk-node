name: GeoReplicationStatsView
uid: '@azure/provisioning-storage.types.GeoReplicationStatsView'
package: '@azure/provisioning-storage'
summary: >-
  View type for Statistics related to replication for storage account's Blob,
  Table, Queue and File services. It is only available when geo-redundant
  replication is enabled for the storage account.
fullName: GeoReplicationStatsView
remarks: ''
isDeprecated: false
type: interface
