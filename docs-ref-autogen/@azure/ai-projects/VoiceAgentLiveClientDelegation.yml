name: VoiceAgentLiveClientDelegation
uid: '@azure/ai-projects.VoiceAgentLiveClientDelegation'
package: '@azure/ai-projects'
summary: Delegates work to the application using native client delegation.
fullName: VoiceAgentLiveClientDelegation
remarks: ''
