name: AgentOptimizationTraceIdsTraceWindow
uid: '@azure/ai-projects.AgentOptimizationTraceIdsTraceWindow'
package: '@azure/ai-projects'
summary: >-
  Selects explicit trace IDs within the configured telemetry source and a
  lookback interval ending at job creation.
fullName: AgentOptimizationTraceIdsTraceWindow
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: lookback_hours
    uid: '@azure/ai-projects.AgentOptimizationTraceIdsTraceWindow.lookback_hours'
    package: '@azure/ai-projects'
    summary: >-
      Telemetry lookup horizon in hours, at least 1. The half-open lookup
      interval starts this many hours before job creation and ends at job
      creation; retries do not move the anchor.
    fullName: lookback_hours
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lookback_hours: number'
      return:
        description: ''
        type: number
  - name: trace_ids
    uid: '@azure/ai-projects.AgentOptimizationTraceIdsTraceWindow.trace_ids'
    package: '@azure/ai-projects'
    summary: >-
      At least one explicit trace identifier to look up within the configured
      telemetry source. Service support, maximum list size, duplicate handling,
      and missing-ID behavior are TBD.
    fullName: trace_ids
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'trace_ids: string[]'
      return:
        description: ''
        type: string[]
  - name: type
    uid: '@azure/ai-projects.AgentOptimizationTraceIdsTraceWindow.type'
    package: '@azure/ai-projects'
    summary: Explicit trace-ID selection discriminator.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "trace_ids"'
      return:
        description: ''
        type: '"trace_ids"'
extends: <xref uid="@azure/ai-projects.AgentOptimizationTraceWindow" />
