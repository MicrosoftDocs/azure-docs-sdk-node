  - name: query
    uid: '@azure/ai-projects.VoiceAgentRealtimeClientConnectOptions.query'
    package: '@azure/ai-projects'
    summary: >-
      Custom URL query parameters. Values are URL-encoded; undefined removes a
      parameter.

      Realtime connections accept an explicit structured_inputs JSON-object
      string instead of

      structuredInputs. Other SDK/authentication, structured-input, and h-* keys
      are reserved.

      Never include sensitive values; URLs may be logged.
