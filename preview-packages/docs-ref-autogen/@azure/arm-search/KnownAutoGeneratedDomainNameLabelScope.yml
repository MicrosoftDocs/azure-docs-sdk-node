### YamlMime:TSEnum
name: KnownAutoGeneratedDomainNameLabelScope
uid: '@azure/arm-search.KnownAutoGeneratedDomainNameLabelScope'
package: '@azure/arm-search'
summary: >-
  Defines the level of reuse for the auto-generated domain name label for the
  search service.
fullName: KnownAutoGeneratedDomainNameLabelScope
remarks: ''
isDeprecated: false
fields:
  - name: NoReuse
    uid: '@azure/arm-search.KnownAutoGeneratedDomainNameLabelScope.NoReuse'
    package: '@azure/arm-search'
    summary: >-
      Service name will always have a unique auto-generated hash (regardless of
      tenant or subscription).
  - name: SubscriptionReuse
    uid: '@azure/arm-search.KnownAutoGeneratedDomainNameLabelScope.SubscriptionReuse'
    package: '@azure/arm-search'
    summary: >-
      Service name will always have the same auto-generated hash within the same
      subscription.
  - name: TenantReuse
    uid: '@azure/arm-search.KnownAutoGeneratedDomainNameLabelScope.TenantReuse'
    package: '@azure/arm-search'
    summary: >-
      Service name will always have the same auto-generated hash within the same
      tenant.
