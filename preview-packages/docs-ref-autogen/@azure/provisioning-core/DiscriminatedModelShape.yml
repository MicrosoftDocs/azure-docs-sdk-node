### YamlMime:TSType
name: DiscriminatedModelShape
uid: '@azure/provisioning-core.DiscriminatedModelShape'
package: '@azure/provisioning-core'
summary: |-
  A name-discriminated group of variants that share one parent key
  (an ARM `(type, apiVersion)` at the registry level, or a parent
  model's `@discriminator` field elsewhere). The `discriminator` names
  the field whose value selects a variant.
fullName: DiscriminatedModelShape
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: byValue
    uid: '@azure/provisioning-core.DiscriminatedModelShape.byValue'
    package: '@azure/provisioning-core'
    summary: |-
      Map from discriminator value (e.g. `"signin"`) to the shape for
      that variant. A value with no entry here doesn't end resolution —
      <xref:resolveModelShape> infers the variant from the payload's
      structure instead.

      Entries may be:
       - a [FlatModelShape](xref:@azure/provisioning-core.FlatModelShape) — the terminal, common case;
       - a [DeferredShape](xref:@azure/provisioning-core.DeferredShape) — breaks emit-order / cyclic-reference
         hazards, exactly as [PropertyShape.value](xref:@azure/provisioning-core.PropertyShape.value) does;
       - a nested [DiscriminatedModelShape](xref:@azure/provisioning-core.DiscriminatedModelShape) — a variant that is
         itself a discriminated base on a *different* field. TypeSpec
         permits this (`@discriminator("kind") model Pet`, then
         `@discriminator("breed") model Cat extends Pet`), so selecting
         a concrete shape may take more than one hop. See
         <xref:resolveModelShape>.

      Note that a hierarchy re-using the *same* discriminator field at
      every level (abstract intermediates) is flattened by the emitter
      into a single level here — only a change of discriminator field
      produces a nested entry.
    fullName: byValue
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'byValue: {[value: string]: ModelShape | DeferredShape<ModelShape>}'
      return:
        description: ''
        type: >-
          {[value: string]: <xref uid="@azure/provisioning-core.ModelShape" /> |
          <xref uid="@azure/provisioning-core.DeferredShape" />&lt;<xref
          uid="@azure/provisioning-core.ModelShape" />&gt;}
  - name: discriminator
    uid: '@azure/provisioning-core.DiscriminatedModelShape.discriminator'
    package: '@azure/provisioning-core'
    summary: Names of the field used to select a variant.
    fullName: discriminator
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'discriminator: DiscriminatorNames'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.DiscriminatorNames" />
  - name: kind
    uid: '@azure/provisioning-core.DiscriminatedModelShape.kind'
    package: '@azure/provisioning-core'
    summary: ''
    fullName: kind
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'kind: "discriminatedModel"'
      return:
        description: ''
        type: '"discriminatedModel"'
