### YamlMime:TSTypeAlias
name: CertificateRevocationCheckEnabledState
uid: '@azure/arm-cdn.CertificateRevocationCheckEnabledState'
package: '@azure/arm-cdn'
summary: >-
  Set to Enabled by default. If set to Disabled, revocation status of client
  certificate chain will be checked before establishing mutual TLS connection. \

  [KnownCertificateRevocationCheckEnabledState](xref:@azure/arm-cdn.KnownCertificateRevocationCheckEnabledState)
  can be used interchangeably with CertificateRevocationCheckEnabledState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled** \

  **Disabled**
fullName: CertificateRevocationCheckEnabledState
remarks: ''
isDeprecated: false
syntax: |
  type CertificateRevocationCheckEnabledState = string
