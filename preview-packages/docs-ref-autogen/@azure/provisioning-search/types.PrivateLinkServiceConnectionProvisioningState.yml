name: PrivateLinkServiceConnectionProvisioningState
uid: '@azure/provisioning-search.types.PrivateLinkServiceConnectionProvisioningState'
package: '@azure/provisioning-search'
summary: >-
  The provisioning state of the private link service connection. Valid values
  are Updating, Deleting, Failed, Succeeded, Incomplete, or Canceled.


  Known values:


  - `"Updating"`: The private link service connection is in the process of being
  created along with other resources for it to be fully functional.


  - `"Deleting"`: The private link service connection is in the process of being
  deleted.


  - `"Failed"`: The private link service connection has failed to be provisioned
  or deleted.


  - `"Succeeded"`: The private link service connection has finished provisioning
  and is ready for approval.


  - `"Incomplete"`: Provisioning request for the private link service connection
  resource has been accepted but the process of creation has not commenced yet.


  - `"Canceled"`: Provisioning request for the private link service connection
  resource has been canceled.
fullName: PrivateLinkServiceConnectionProvisioningState
remarks: ''
isDeprecated: false
syntax: |
  type PrivateLinkServiceConnectionProvisioningState = string
