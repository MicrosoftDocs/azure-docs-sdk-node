### YamlMime:TSTypeAlias
name: DataIngestionStatus
uid: '@azure/provisioning-operationalinsights.types.DataIngestionStatus'
package: '@azure/provisioning-operationalinsights'
summary: >-
  The status of data ingestion for this workspace.


  Known values:


  - `"RespectQuota"`: Ingestion enabled following daily cap quota reset, or
  subscription enablement.


  - `"ForceOn"`: Ingestion started following service setting change.


  - `"ForceOff"`: Ingestion stopped following service setting change.


  - `"OverQuota"`: Reached daily cap quota, ingestion stopped.


  - `"SubscriptionSuspended"`: Ingestion stopped following suspended
  subscription.


  - `"ApproachingQuota"`: 80% of daily cap quota reached.
fullName: DataIngestionStatus
remarks: ''
isDeprecated: false
syntax: |
  type DataIngestionStatus = string
