name: ChangeDataCaptureExtensionState
uid: '@azure/arm-horizondb.ChangeDataCaptureExtensionState'
package: '@azure/arm-horizondb'
summary: >-
  The lifecycle state of the HorizonDB change data capture extension. \

  [KnownChangeDataCaptureExtensionState](xref:@azure/arm-horizondb.KnownChangeDataCaptureExtensionState)
  can be used interchangeably with ChangeDataCaptureExtensionState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotInstalled**: The extension is not installed. \

  **Installing**: The extension is being installed. \

  **Ready**: The extension is ready. \

  **Upgrading**: The extension is being upgraded. \

  **Removing**: The extension is being removed. \

  **Failed**: The extension operation failed.
fullName: ChangeDataCaptureExtensionState
