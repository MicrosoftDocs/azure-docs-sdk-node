package: '@azure/arm-compute'
summary: >-
  confidential VM encryption types \

  [KnownConfidentialVMEncryptionType](xref:@azure/arm-compute.KnownConfidentialVMEncryptionType)
  can be used interchangeably with ConfidentialVMEncryptionType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **EncryptedVMGuestStateOnlyWithPmk** \

  **EncryptedWithPmk** \

  **EncryptedWithCmk** \

  **NonPersistedTPM** \

  **DataDiskEncryptedWithCmk**: Confidential VM Encryption Type which should be
  used for encrypting the data disks with customer managed keys. This Encryption
  type should only be used for data disks, and should not be used for OS disk
  encryption. When this encryption type is used for data disk
  encryption.Subscriptions need to be enrolled for Confidential VM with data
  encryption through following AFEC -
  Microsoft.Compute/ConfidentialVMDataDiskEncryptionPreview
