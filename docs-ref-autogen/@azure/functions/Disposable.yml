### YamlMime:TSType
name: Disposable
uid: '@azure/functions.Disposable'
package: '@azure/functions'
summary: >-
  Represents a type which can release resources, such as event listening or a
  timer.
fullName: Disposable
remarks: ''
isDeprecated: false
type: class
constructors:
  - name: Disposable(() => any)
    uid: '@azure/functions.Disposable.constructor'
    package: '@azure/functions'
    summary: |-
      Creates a new disposable that calls the provided function on dispose.
      *Note* that an asynchronous function is not awaited.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'new Disposable(callOnDispose: () => any)'
      parameters:
        - id: callOnDispose
          type: () =&gt; any
          description: Function that disposes something.
methods:
  - name: dispose()
    uid: '@azure/functions.Disposable.dispose'
    package: '@azure/functions'
    summary: Dispose this object.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function dispose(): any'
      return:
        description: ''
        type: any
  - name: 'from({ dispose: () => any }[])'
    uid: '@azure/functions.Disposable.from'
    package: '@azure/functions'
    summary: >-
      Combine many disposable-likes into one. You can use this method when
      having objects with a dispose function which aren't instances of
      `Disposable`.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        static function from(disposableLikes: { dispose: () => any }[]):
        Disposable
      parameters:
        - id: disposableLikes
          type: '{ dispose: () =&gt; any }[]'
          description: >-
            Objects that have at least a `dispose`-function member. Note that
            asynchronous dispose-functions aren't awaited.
      return:
        description: >-
          Returns a new disposable which, upon dispose, will dispose all
          provided disposables.
        type: <xref uid="@azure/functions.Disposable" />
