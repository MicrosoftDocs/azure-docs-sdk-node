### YamlMime:TSTypeAlias
name: HorizonDbClusterDataEncryptionType
uid: '@azure/arm-horizondb.HorizonDbClusterDataEncryptionType'
package: '@azure/arm-horizondb'
summary: >-
  The type of data encryption used by a HorizonDB cluster. The type is selected
  at cluster creation; switching between SystemManaged and AzureKeyVault after
  creation is not supported. \

  [KnownHorizonDbClusterDataEncryptionType](xref:@azure/arm-horizondb.KnownHorizonDbClusterDataEncryptionType)
  can be used interchangeably with HorizonDbClusterDataEncryptionType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **SystemManaged**: Data encryption is managed by Azure using platform-managed
  keys. \

  **AzureKeyVault**: Data encryption uses customer-managed keys stored in Azure
  Key Vault.
fullName: HorizonDbClusterDataEncryptionType
remarks: ''
isDeprecated: false
syntax: |
  type HorizonDbClusterDataEncryptionType = string
