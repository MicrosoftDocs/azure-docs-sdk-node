### YamlMime:TSType
name: Resource
uid: '@azure/provisioning-core.Resource'
package: '@azure/provisioning-core'
summary: >+
  Base class for all Azure resources.


  **Example**


  ```typescript snippet:ignore

  import { Stack } from "@azure/provisioning-core";

  import { KeyVault } from "@azure/provisioning-keyvault";


  const stack = new Stack("my-app", { targetScope: "resourceGroup", location:
  "eastus" });

  const vault = new KeyVault(stack, {
    name: "kv-my-app",
    properties: {
      tenantId: "11111111-1111-1111-1111-111111111111",
      sku: { family: "A", name: "standard" },
    },
  });


  // Use vault.name and vault.id as deployment-time expressions.

  ```

fullName: Resource<TType>
remarks: |-
  Pass the containing stack, resource-owning module, or custom component as the
  first argument to define a resource there.

  Reading a resource property such as `resource.name` returns an expression
  resolved at deployment time, not a local value. Resource subclasses can use
  `this.expr()` for property getters and `this.setProperty()` for setters.
isDeprecated: false
type: class
