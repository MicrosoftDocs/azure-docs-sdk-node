### YamlMime:TSType
name: SkuMixPlacementCapacityLimit
uid: '@azure/arm-computerecommender.SkuMixPlacementCapacityLimit'
package: '@azure/arm-computerecommender'
summary: >-
  Capacity availability for a single requested (VM size, zone) combination,
  independent of the

  recommended placement.
fullName: SkuMixPlacementCapacityLimit
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: limit
    uid: '@azure/arm-computerecommender.SkuMixPlacementCapacityLimit.limit'
    package: '@azure/arm-computerecommender'
    summary: >-
      Upper bound, in VMs, on how much capacity can be allocated for this (VM
      size, zone): the smallest of

      the requested capacity, the available capacity, and the available quota,
      but never below the capacity

      already recommended for the slot. 0 when nothing is available.
    fullName: limit
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'limit: number'
      return:
        description: ''
        type: number
  - name: name
    uid: '@azure/arm-computerecommender.SkuMixPlacementCapacityLimit.name'
    package: '@azure/arm-computerecommender'
    summary: VM size name (e.g. Standard_D2s_v3).
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: priority
    uid: '@azure/arm-computerecommender.SkuMixPlacementCapacityLimit.priority'
    package: '@azure/arm-computerecommender'
    summary: Priority of this entry (Regular or Spot).
    fullName: priority
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'priority: string'
      return:
        description: ''
        type: string
  - name: reason
    uid: '@azure/arm-computerecommender.SkuMixPlacementCapacityLimit.reason'
    package: '@azure/arm-computerecommender'
    summary: >-
      Why the limit is below the requested capacity, or None when the request is
      fully available.
    fullName: reason
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'reason: string'
      return:
        description: ''
        type: string
  - name: zone
    uid: '@azure/arm-computerecommender.SkuMixPlacementCapacityLimit.zone'
    package: '@azure/arm-computerecommender'
    summary: Logical zone (e.g. "1", "2", "3"). Omitted or empty for regional requests.
    fullName: zone
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'zone?: string'
      return:
        description: ''
        type: string
