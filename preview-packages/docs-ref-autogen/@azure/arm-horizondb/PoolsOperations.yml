  - name: restart
    uid: '@azure/arm-horizondb.PoolsOperations.restart'
    package: '@azure/arm-horizondb'
    summary: >-
      Restarts the PostgreSQL container on all allocated nodes in a ready
      HorizonDB pool and applies pending dynamic and static parameter changes.
      This customer-initiated Restart is the only operation that applies static
      parameter changes or dynamic parameter changes requested with
      PendingReboot; Stop followed by Start and scheduled maintenance do not
      apply them. Power operations are supported only at pool scope in this API
      version; there is no cluster-level restart action. When the pool has no
      allocated nodes, the operation succeeds without restarting any nodes,
      pending changes are considered applied, parameterGroup.syncStatus becomes
      InSync, and the resulting configuration applies to nodes allocated later.
      The request fails with 409 Conflict when another operation is in progress
      or the pool is in any other incompatible state.
    fullName: restart
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        restart: (resourceGroupName: string, clusterName: string, poolName:
        string, options?: PoolsRestartOptionalParams) =>
        PollerLike<OperationState<Pool>, Pool>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, clusterName: string, poolName: string,
          options?: PoolsRestartOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;Pool&gt;, Pool&gt;
  - name: start
    uid: '@azure/arm-horizondb.PoolsOperations.start'
    package: '@azure/arm-horizondb'
    summary: >-
      Starts a stopped HorizonDB pool. Power operations are supported only at
      pool scope in this API version; there is no cluster-level start action.
      Start does not apply pending dynamic or static parameter changes;
      parameterGroup.syncStatus remains PendingReboot until a customer-initiated
      Restart. When the pool is already Ready, the operation succeeds as a true
      idempotent no-op and likewise leaves pending parameter changes pending.
      The operation is allowed when the pool has no allocated nodes. After the
      Pool is running, its Pool-scoped ReadOnly Endpoint routes only when at
      least one allocated node is not currently playing the read-write role. The
      request fails with 409 Conflict when another operation is in progress or
      the pool is in any other incompatible state.
    fullName: start
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        start: (resourceGroupName: string, clusterName: string, poolName:
        string, options?: PoolsStartOptionalParams) =>
        PollerLike<OperationState<Pool>, Pool>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, clusterName: string, poolName: string,
          options?: PoolsStartOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;Pool&gt;, Pool&gt;
  - name: stop
    uid: '@azure/arm-horizondb.PoolsOperations.stop'
    package: '@azure/arm-horizondb'
    summary: >-
      Stops a running HorizonDB pool and deallocates compute. Power operations
      are supported only at pool scope in this API version; there is no
      cluster-level stop action. Stop does not apply pending dynamic or static
      parameter changes; parameterGroup.syncStatus remains PendingReboot. A
      subsequent Start also preserves those pending changes. The operation
      succeeds as an idempotent no-op when the pool is already Stopped. It is
      allowed when the pool has no allocated nodes. The Pool-scoped ReadOnly
      Endpoint remains discoverable but has no routing destination while the
      Pool is Stopped. The request fails with 409 Conflict when another
      operation is in progress or the pool is in any other incompatible state.
    fullName: stop
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        stop: (resourceGroupName: string, clusterName: string, poolName: string,
        options?: PoolsStopOptionalParams) => PollerLike<OperationState<Pool>,
        Pool>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, clusterName: string, poolName: string,
          options?: PoolsStopOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;Pool&gt;, Pool&gt;
  - name: update
    uid: '@azure/arm-horizondb.PoolsOperations.update'
    package: '@azure/arm-horizondb'
    summary: >-
      Updates an existing HorizonDB pool, including its node allocation,
      selected compute model properties, compute model type, high-availability
      configuration, or associated parameter group. Omitted nodeCount and
      highAvailability.mode values preserve their existing values; the service
      recursively merges the PATCH before atomically validating the effective
      tuple. nodeCount, when supplied, must be 1 through 16. Disabled is valid
      only when the effective nodeCount is 1. AnyZone and ZoneRedundant are
      valid only when the effective nodeCount is 2 through 16. Therefore,
      crossing between those node-count ranges requires nodeCount and
      highAvailability.mode to be changed together. AnyZone permits same-zone or
      cross-zone placement. Changing from AnyZone to ZoneRedundant may allocate
      a replacement node in another availability zone and replace a read-only
      node, disconnecting connections to the replaced node. If all requested
      nodes or the required zonal topology cannot be provisioned, the
      long-running operation fails and the previous resource state is preserved.
      To deallocate runtime compute without changing the configured nodeCount,
      use the Pool stop action. When parameterGroup is supplied, both
      parameterGroupResourceId and applyMethod are required. The pool can switch
      its association in either direction between the corresponding default
      parameter group and a customer-created parameter group. applyMethod
      controls when dynamic parameter changes become effective. Static parameter
      changes always require a customer-initiated Restart; Stop followed by
      Start and scheduled maintenance do not apply pending changes.
      Subtype-specific compute constraints are validated against the recursively
      merged configuration.
    fullName: update
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        update: (resourceGroupName: string, clusterName: string, poolName:
        string, properties: PoolForPatchUpdateUpdate, options?:
        PoolsUpdateOptionalParams) => PollerLike<OperationState<Pool>, Pool>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, clusterName: string, poolName: string,
          properties: PoolForPatchUpdateUpdate, options?:
          PoolsUpdateOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;Pool&gt;, Pool&gt;
