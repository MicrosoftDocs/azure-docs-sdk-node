### YamlMime:TSTypeAlias
name: MigrationType
uid: '@azure/arm-network.MigrationType'
package: '@azure/arm-network'
summary: >-
  The type of migration workflow performed on a Network Virtual Appliance. \

  [KnownMigrationType](xref:@azure/arm-network.KnownMigrationType) can be used
  interchangeably with MigrationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **MigrateToNewOSVersion**: Migrate the Network Virtual Appliance to a new OS /
  marketplace image version. \

  **MigrateToNewILBArchitecture**: Migrate the Network Virtual Appliance to the
  new internal load balancer architecture.
fullName: MigrationType
remarks: ''
isDeprecated: false
syntax: |
  type MigrationType = string
