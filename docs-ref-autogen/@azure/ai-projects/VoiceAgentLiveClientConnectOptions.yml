name: VoiceAgentLiveClientConnectOptions
uid: '@azure/ai-projects.VoiceAgentLiveClientConnectOptions'
package: '@azure/ai-projects'
summary: >-
  Settings for one GPT Live connection. Live does not use transport or
  agentSessionId.

  The complete structuredInputs value is sent in the WebSocket URL query in
  every environment,

  including Node.js. Do not include sensitive values: proxy and server access
  logs can retain URLs.
fullName: VoiceAgentLiveClientConnectOptions
remarks: ''
isDeprecated: false
type: interface
properties:
