### YamlMime:TSTypeAlias
name: ManagedEnvironmentMode
uid: '@azure/arm-appcontainers.ManagedEnvironmentMode'
package: '@azure/arm-appcontainers'
summary: >-
  Mode of the managed environment. \

  [KnownManagedEnvironmentMode](xref:@azure/arm-appcontainers.KnownManagedEnvironmentMode)
  can be used interchangeably with ManagedEnvironmentMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ConsumptionOnly**: The environment supports consumption-only workloads. \

  **WorkloadProfiles**: The environment supports workload profiles. \

  **Express**: The environment uses the Express mode. \

  **Archived**: The environment is archived.
fullName: ManagedEnvironmentMode
remarks: ''
isDeprecated: false
syntax: |
  type ManagedEnvironmentMode = string
