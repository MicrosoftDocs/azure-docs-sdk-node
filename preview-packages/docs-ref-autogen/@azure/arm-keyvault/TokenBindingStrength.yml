### YamlMime:TSTypeAlias
name: TokenBindingStrength
uid: '@azure/arm-keyvault.TokenBindingStrength'
package: '@azure/arm-keyvault'
summary: >-
  Must be one of the following values "NoValidation", "Unattested",
  "AttestedTrustedLaunch", "AttestedConfidential". Strength of the token binding
  increases with each value in that order. \

  [KnownTokenBindingStrength](xref:@azure/arm-keyvault.KnownTokenBindingStrength)
  can be used interchangeably with TokenBindingStrength,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NoValidation**: This is default when token binding is not enabled. \

  **Unattested**: No attestation proof is required for the bounded token. \

  **AttestedTrustedLaunch**: Bounded Entra token must originate from a trusted
  launch VM with attestation proof from the attestation authority like Microsoft
  Azure Attestation. \

  **AttestedConfidential**: Bounded Entra token must originate from a
  confidential VM with attestation proof from the attestation authority like
  Microsoft Azure Attestation.
fullName: TokenBindingStrength
remarks: ''
isDeprecated: false
syntax: |
  type TokenBindingStrength = string
