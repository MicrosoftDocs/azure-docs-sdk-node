### YamlMime:TSType
name: NamespaceAccessInfo
uid: '@azure/arm-containerserviceaimanager.NamespaceAccessInfo'
package: '@azure/arm-containerserviceaimanager'
summary: >-
  Access information for an AI Manager namespace, including the
  OpenAI-compatible gateway endpoint and the API keys used to authenticate
  against it.
fullName: NamespaceAccessInfo
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: endpoint
    uid: '@azure/arm-containerserviceaimanager.NamespaceAccessInfo.endpoint'
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      OpenAI-compatible inference gateway base URL (for example,
      `https://team-alpha.<cluster>.<region>.aksapp.io/v1`).
    fullName: endpoint
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'endpoint: string'
      return:
        description: ''
        type: string
  - name: lastRotatedAt
    uid: '@azure/arm-containerserviceaimanager.NamespaceAccessInfo.lastRotatedAt'
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      UTC time the keys were last rotated by `rotateKeys`. Absent until the
      first rotation. Clients can use this to detect rotation and refresh cached
      credentials.
    fullName: lastRotatedAt
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastRotatedAt?: Date'
      return:
        description: ''
        type: Date
  - name: primaryKey
    uid: '@azure/arm-containerserviceaimanager.NamespaceAccessInfo.primaryKey'
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      Primary API key. Send as `Authorization: Bearer <key>` or `api-key:
      <key>`. Treat as secret; do not log or persist in plaintext.
    fullName: primaryKey
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'primaryKey: string'
      return:
        description: ''
        type: string
  - name: secondaryKey
    uid: '@azure/arm-containerserviceaimanager.NamespaceAccessInfo.secondaryKey'
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      Secondary API key, accepted by the gateway in the same headers as
      `primaryKey`. Generated independently when the namespace is created, then
      overwritten by the previous `primaryKey` on each `rotateKeys` call so
      clients can roll over without downtime. Treat as secret; do not log or
      persist in plaintext.
    fullName: secondaryKey
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'secondaryKey: string'
      return:
        description: ''
        type: string
