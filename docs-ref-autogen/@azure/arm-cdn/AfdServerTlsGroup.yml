### YamlMime:TSTypeAlias
name: AfdServerTlsGroup
uid: '@azure/arm-cdn.AfdServerTlsGroup'
package: '@azure/arm-cdn'
summary: >-
  Supported key-exchange groups and curves. The ML-KEM groups are hybrid
  post-quantum groups. \

  [KnownAfdServerTlsGroup](xref:@azure/arm-cdn.KnownAfdServerTlsGroup) can be
  used interchangeably with AfdServerTlsGroup,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **SecP256r1MLKEM768**: Hybrid post-quantum group combining secp256r1 with
  ML-KEM-768. \

  **SecP384r1MLKEM1024**: Hybrid post-quantum group combining secp384r1 with
  ML-KEM-1024. \

  **X25519MLKEM768**: Hybrid post-quantum group combining X25519 with
  ML-KEM-768. \

  **prime256v1**: The prime256v1 elliptic curve group. \

  **X25519**: The X25519 elliptic curve group. \

  **secp384r1**: The secp384r1 elliptic curve group. \

  **secp521r1**: The secp521r1 elliptic curve group.
fullName: AfdServerTlsGroup
remarks: ''
isDeprecated: false
syntax: |
  type AfdServerTlsGroup = string
