name: WorkspaceDiscoveryWarningReason
uid: '@azure/arm-chaos.WorkspaceDiscoveryWarningReason'
package: '@azure/arm-chaos'
summary: >-
  The confirmed guidance reason. Unknown future reasons preserve the common
  warning fields and must not be interpreted as a permission denial. \

  [KnownWorkspaceDiscoveryWarningReason](xref:@azure/arm-chaos.KnownWorkspaceDiscoveryWarningReason)
  can be used interchangeably with WorkspaceDiscoveryWarningReason,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **RbacValidationFailed**: The affected resource could not be read because of a
  confirmed authorization denial. \

  **TargetNotFound**: The affected resource or configured membership was
  confirmed missing. \

  **AccessIndeterminate**: Access versus absence could not be determined;
  guidance must state both possibilities.
