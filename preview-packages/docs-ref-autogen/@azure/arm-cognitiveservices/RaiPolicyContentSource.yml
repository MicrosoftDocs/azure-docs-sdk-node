summary: >-
  Content source to apply the Content Filters. \

  [KnownRaiPolicyContentSource](xref:@azure/arm-cognitiveservices.KnownRaiPolicyContentSource)
  can be used interchangeably with RaiPolicyContentSource,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Prompt** \

  **Completion** \

  **PreToolCall** \

  **PostToolCall** \

  **PreRun** \

  **PostRun** \

  **AgentStartup**: Content evaluated when an agent execution session starts. \

  **PreModelCall**: Content evaluated before a model call is made. \

  **PostModelCall**: Content evaluated after a model call returns. \

  **AgentShutdown**: Content evaluated when an agent execution session shuts
  down.
