### YamlMime:TSTypeAlias
name: SecureLdapType
uid: '@azure/arm-netapp.SecureLdapType'
package: '@azure/arm-netapp'
summary: >-
  Indicates the secure LDAP mode for encrypting communication between ANF
  storage and customer LDAP servers. \

  [KnownSecureLdapType](xref:@azure/arm-netapp.KnownSecureLdapType) can be used
  interchangeably with SecureLdapType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **LdapOverTLS**: LDAP traffic is encrypted using LDAP over TLS. \

  **None**: LDAP traffic is not encrypted.
fullName: SecureLdapType
remarks: ''
isDeprecated: false
syntax: |
  type SecureLdapType = string
