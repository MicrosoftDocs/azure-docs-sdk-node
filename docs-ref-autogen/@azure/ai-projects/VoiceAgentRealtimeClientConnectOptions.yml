  - name: structuredInputs
    uid: '@azure/ai-projects.VoiceAgentRealtimeClientConnectOptions.structuredInputs'
    package: '@azure/ai-projects'
    summary: >-
      Prompt-variable values captured when connect() is called. Realtime
      connections use

      a header in Node.js and the URL query in browsers. GPT Live uses the URL
      query.

      For explicit Realtime URL transport, use query.structured_inputs instead.

      Do not put sensitive data in URL-carried inputs.
    fullName: structuredInputs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'structuredInputs?: Record<string, unknown>'
      return:
        description: ''
