  - name: transport
    uid: '@azure/ai-projects.VoiceAgentRealtimeClientConnectOptions.transport'
    package: '@azure/ai-projects'
    summary: >-
      Selects the transport used for the realtime connection. Defaults to
      `"websocket"`. Set to

      `"webrtc"` to negotiate a WebRTC peer connection instead; the caller is
      responsible for

      completing the SDP offer/answer exchange using the `rtc.call.sdp.create`
      and

      `rtc.call.sdp.created` events (see
      [VoiceAgentRealtimeEvent](xref:@azure/ai-projects.VoiceAgentRealtimeEvent)).
    fullName: transport
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'transport?: VoiceAgentTransport'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentTransport" />
