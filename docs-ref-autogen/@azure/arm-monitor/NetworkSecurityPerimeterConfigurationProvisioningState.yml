name: NetworkSecurityPerimeterConfigurationProvisioningState
uid: '@azure/arm-monitor.NetworkSecurityPerimeterConfigurationProvisioningState'
package: '@azure/arm-monitor'
summary: >-
  Provisioning state of a network security perimeter configuration that is being
  created or updated. \

  [KnownNetworkSecurityPerimeterConfigurationProvisioningState](xref:@azure/arm-monitor.KnownNetworkSecurityPerimeterConfigurationProvisioningState)
  can be used interchangeably with
  NetworkSecurityPerimeterConfigurationProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: The configuration was provisioned successfully. \

  **Creating**: The configuration is being created. \

  **Updating**: The configuration is being updated. \

  **Deleting**: The configuration is being deleted. \

  **Accepted**: The configuration request was accepted and provisioning has not
  started yet. \

  **Failed**: The configuration failed to provision. \

  **Canceled**: The configuration provisioning was canceled.
fullName: NetworkSecurityPerimeterConfigurationProvisioningState
