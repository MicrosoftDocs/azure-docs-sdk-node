### YamlMime:TSTypeAlias
name: AzureMonitorWorkspaceIngestionMode
uid: '@azure/arm-appinsights.AzureMonitorWorkspaceIngestionMode'
package: '@azure/arm-appinsights'
summary: >-
  Indicates the state of the OpenTelemetry ingestion into the Azure Monitor
  workspace that is linked to the Application Insights component. \

  [KnownAzureMonitorWorkspaceIngestionMode](xref:@azure/arm-appinsights.KnownAzureMonitorWorkspaceIngestionMode)
  can be used interchangeably with AzureMonitorWorkspaceIngestionMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotOptedIn**: The component has not been opted in to Azure Monitor workspace
  ingestion. Clients may specify this value on create to decline Azure Monitor
  workspace ingestion. \

  **Enabled**: Azure Monitor workspace ingestion is enabled for the component.
  Clients may specify this value to opt in. Opting back out after ingestion has
  been enabled is not supported. \

  **Disabled**: Azure Monitor workspace ingestion is disabled for the component
  because the link to the Azure Monitor workspace is broken. This value is set
  only by the service and is rejected if specified by a client.
fullName: AzureMonitorWorkspaceIngestionMode
remarks: ''
isDeprecated: false
syntax: |
  type AzureMonitorWorkspaceIngestionMode = string
