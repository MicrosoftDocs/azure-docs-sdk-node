### YamlMime:TSEnum
name: KnownParameterGroupSyncStatus
uid: '@azure/arm-horizondb.KnownParameterGroupSyncStatus'
package: '@azure/arm-horizondb'
summary: >-
  Indicates synchronization status between a HorizonDB resource and its
  parameter group.
fullName: KnownParameterGroupSyncStatus
remarks: ''
isDeprecated: false
fields:
  - name: Applying
    uid: '@azure/arm-horizondb.KnownParameterGroupSyncStatus.Applying'
    package: '@azure/arm-horizondb'
    summary: Parameter updates are currently being applied.
  - name: FailedToApply
    uid: '@azure/arm-horizondb.KnownParameterGroupSyncStatus.FailedToApply'
    package: '@azure/arm-horizondb'
    summary: Applying parameter updates failed.
  - name: InSync
    uid: '@azure/arm-horizondb.KnownParameterGroupSyncStatus.InSync'
    package: '@azure/arm-horizondb'
    summary: Parameter values are synchronized and up to date.
  - name: PendingReboot
    uid: '@azure/arm-horizondb.KnownParameterGroupSyncStatus.PendingReboot'
    package: '@azure/arm-horizondb'
    summary: >-
      Parameter updates are pending and require a customer-initiated pool
      Restart to take effect. Stop followed by Start and scheduled maintenance
      preserve this status.
