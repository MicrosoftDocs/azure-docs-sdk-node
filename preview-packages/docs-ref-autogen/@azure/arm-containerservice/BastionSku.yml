### YamlMime:TSTypeAlias
name: BastionSku
uid: '@azure/arm-containerservice.BastionSku'
package: '@azure/arm-containerservice'
summary: >-
  The SKU of the managed Azure Bastion. The default is 'Standard'. See
  https://aka.ms/aks/BastionSKUs for more information about the differences
  between Azure Bastion SKUs. \

  [KnownBastionSku](xref:@azure/arm-containerservice.KnownBastionSku) can be
  used interchangeably with BastionSku,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Standard**: Use the standard SKU of Azure Bastion. \

  **Premium**: Use the premium SKU of Azure Bastion.
fullName: BastionSku
remarks: ''
isDeprecated: false
syntax: |
  type BastionSku = string
