### YamlMime:TSType
name: VoiceAgentHandoffCondition
uid: '@azure/ai-projects.VoiceAgentHandoffCondition'
package: '@azure/ai-projects'
summary: One allowed outgoing handoff from an inline voice subagent.
fullName: VoiceAgentHandoffCondition
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: cancel_on_interruption
    uid: '@azure/ai-projects.VoiceAgentHandoffCondition.cancel_on_interruption'
    package: '@azure/ai-projects'
    summary: >-
      Whether user interruption before commit cancels the pending handoff. If
      omitted, the service defaults to false.
    fullName: cancel_on_interruption
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cancel_on_interruption?: boolean'
      return:
        description: ''
        type: boolean
  - name: condition
    uid: '@azure/ai-projects.VoiceAgentHandoffCondition.condition'
    package: '@azure/ai-projects'
    summary: >-
      Natural-language routing guidance supplied alongside the active subagent
      instructions, from 1 through 500 characters. This is not an executable
      Boolean predicate.
    fullName: condition
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'condition: string'
      return:
        description: ''
        type: string
  - name: delay_ms
    uid: '@azure/ai-projects.VoiceAgentHandoffCondition.delay_ms'
    package: '@azure/ai-projects'
    summary: >-
      The minimum delay before target activation, in milliseconds, from 0
      through 10000. If omitted, the service defaults to 0.
    fullName: delay_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delay_ms?: number'
      return:
        description: ''
        type: number
  - name: id
    uid: '@azure/ai-projects.VoiceAgentHandoffCondition.id'
    package: '@azure/ai-projects'
    summary: The handoff condition identifier.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id: string'
      return:
        description: ''
        type: string
  - name: target
    uid: '@azure/ai-projects.VoiceAgentHandoffCondition.target'
    package: '@azure/ai-projects'
    summary: >-
      The target subagent identifier or `$entrypoint`. The containing subagent
      supplies the source.
    fullName: target
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'target: string'
      return:
        description: ''
        type: string
  - name: target_response
    uid: '@azure/ai-projects.VoiceAgentHandoffCondition.target_response'
    package: '@azure/ai-projects'
    summary: >-
      Whether Voice Live automatically starts a response after target
      activation. If omitted, the service defaults to `auto`.
    fullName: target_response
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'target_response?: VoiceAgentHandoffTargetResponse'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentHandoffTargetResponse" />
  - name: transfer_message
    uid: '@azure/ai-projects.VoiceAgentHandoffCondition.transfer_message'
    package: '@azure/ai-projects'
    summary: >-
      Optional deterministic source-voice announcement played before target
      activation. Supported by cascaded

      pipelines and realtime pipelines using local Azure TTS; model-native
      realtime voice requires omission or null.

      At most 500 characters. If omitted or null, no announcement is played.
    fullName: transfer_message
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'transfer_message?: string'
      return:
        description: ''
        type: string
