uid: '@azure/arm-horizondb.LogCaptureState'
package: '@azure/arm-horizondb'
summary: >-
  Specifies whether HorizonDB captures log files. \

  [KnownLogCaptureState](xref:@azure/arm-horizondb.KnownLogCaptureState) can be
  used interchangeably with LogCaptureState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Log capture is enabled. \

  **Disabled**: Log capture is disabled.
