name: EnforceMtlsEnabledState
uid: '@azure/arm-cdn.EnforceMtlsEnabledState'
package: '@azure/arm-cdn'
summary: >-
  Set to Disabled by default. If set to Enabled, only custom domains with mTLS
  enabled can be added to child Route resources. \

  [KnownEnforceMtlsEnabledState](xref:@azure/arm-cdn.KnownEnforceMtlsEnabledState)
  can be used interchangeably with EnforceMtlsEnabledState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled** \

  **Disabled**
fullName: EnforceMtlsEnabledState
remarks: ''
isDeprecated: false
