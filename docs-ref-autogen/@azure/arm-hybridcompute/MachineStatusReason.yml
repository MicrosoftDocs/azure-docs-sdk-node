name: MachineStatusReason
uid: '@azure/arm-hybridcompute.MachineStatusReason'
package: '@azure/arm-hybridcompute'
summary: >-
  The reason describing why the service set the machine status to a particular
  value. \

  [KnownMachineStatusReason](xref:@azure/arm-hybridcompute.KnownMachineStatusReason)
  can be used interchangeably with MachineStatusReason,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Cloned**: Indicates the service has detected that this Arc machine is a
  clone of another onboarded machine.
