  - name: update
    uid: '@azure/arm-horizondb.ParameterGroupsOperations.update'
    package: '@azure/arm-horizondb'
    summary: >-
      Updates an existing HorizonDB parameter group. Each connected pool's
      applyMethod setting controls whether dynamic parameter changes become
      effective immediately or remain pending until a customer-initiated pool
      Restart. Static parameter changes always remain pending until a
      customer-initiated pool Restart. Stop followed by Start and scheduled
      maintenance do not apply pending changes. The operation fails with a
      conflict while a previous update to this parameter group is still being
      processed.
    fullName: update
    remarks: ''
    isDeprecated: false
