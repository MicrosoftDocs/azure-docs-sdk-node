### YamlMime:TSType
name: CloudShellProfile
uid: '@azure/arm-containerservice.CloudShellProfile'
package: '@azure/arm-containerservice'
summary: |-
  Cloud Shell connectivity and storage settings for a private managed cluster.
  For more information, see https://aka.ms/aks/CloudShellConnect.
fullName: CloudShellProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: mode
    uid: '@azure/arm-containerservice.CloudShellProfile.mode'
    package: '@azure/arm-containerservice'
    summary: >-
      Whether Cloud Shell connectivity is disabled, uses AKS-managed network
      resources, or uses user-provided

      network resources. Defaults to Disabled when omitted during create. On
      update, omission preserves the existing

      mode. Setting this property to Disabled removes AKS-created resources and
      connectivity artifacts. For Custom

      mode, AKS unregisters the user-provided resources but does not delete
      them.
    fullName: mode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'mode?: string'
      return:
        description: ''
        type: string
  - name: network
    uid: '@azure/arm-containerservice.CloudShellProfile.network'
    package: '@azure/arm-containerservice'
    summary: >-
      Network resources used by Cloud Shell. When configuring Custom networking,
      users must provide

      both subnetId and relayNamespaceId. When updating an existing Custom
      configuration, either resource ID can be

      changed independently; omitted fields preserve their existing values. In
      Custom mode, AKS returns the user-provided

      values. In Managed mode, AKS populates the effective values. Users may
      omit Managed values or resubmit values

      returned by GET unchanged; different values are rejected. This property
      must be omitted when mode is Disabled.

      See https://aka.ms/aks/CloudShellConnect for Custom networking
      requirements.
    fullName: network
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'network?: CloudShellNetworkProfile'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.CloudShellNetworkProfile" />
  - name: storage
    uid: '@azure/arm-containerservice.CloudShellProfile.storage'
    package: '@azure/arm-containerservice'
    summary: >-
      Storage resources used for Cloud Shell file persistence. When configuring
      Custom storage, users

      must provide both storageAccountId and fileShareName. When updating an
      existing Custom configuration, either

      property can be changed independently; omitted fields preserve their
      existing values. In Custom mode, AKS returns

      the user-provided values. In Managed mode, AKS populates the effective
      values. Users may omit Managed values or

      resubmit values returned by GET unchanged; different values are rejected.
      Both properties must be omitted when

      mode is Disabled. See https://aka.ms/aks/CloudShellConnect for Custom
      storage requirements.
    fullName: storage
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'storage?: CloudShellStorageProfile'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.CloudShellStorageProfile" />
