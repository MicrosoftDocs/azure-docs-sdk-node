### YamlMime:TSEnum
name: KnownCostControlGroupingName
uid: '@azure/arm-cognitiveservices.KnownCostControlGroupingName'
package: '@azure/arm-cognitiveservices'
summary: Built-in attributes supported for additional budget partitioning.
fullName: KnownCostControlGroupingName
remarks: ''
isDeprecated: false
fields:
  - name: Agent
    uid: '@azure/arm-cognitiveservices.KnownCostControlGroupingName.Agent'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Creates an independent counter for each Foundry agent, qualified by its
      Foundry project so identical agent names in different projects do not
      share counters.
  - name: Project
    uid: '@azure/arm-cognitiveservices.KnownCostControlGroupingName.Project'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Creates an independent counter for each Foundry project in the owning
      account.
  - name: SessionId
    uid: '@azure/arm-cognitiveservices.KnownCostControlGroupingName.SessionId'
    package: '@azure/arm-cognitiveservices'
    summary: Creates an independent counter for each Foundry session ID.
