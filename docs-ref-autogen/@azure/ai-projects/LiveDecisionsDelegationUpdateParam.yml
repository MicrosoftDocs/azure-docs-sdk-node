properties:
  - name: acknowledgement_delay_ms
    uid: >-
      @azure/ai-projects.LiveDecisionsDelegationUpdateParam.acknowledgement_delay_ms
    package: '@azure/ai-projects'
    summary: >-
      Milliseconds to wait before requesting an automatic spoken acknowledgement
      for a delegation. The model may still speak before this delay. Any
      commentary or thinking appended to the session cancels all pending
      acknowledgements, including those for other delegations. Defaults to 400
      for Decisions sessions and 0 (request immediately) for other sessions.
      Omission in a session update preserves the current value. Updates apply to
      subsequent delegations.
    fullName: acknowledgement_delay_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'acknowledgement_delay_ms?: number'
      return:
        description: ''
        type: number
  - name: decisions
    uid: '@azure/ai-projects.LiveDecisionsDelegationUpdateParam.decisions'
    package: '@azure/ai-projects'
    summary: >-
      Updates to the Decision model and questions used for subsequent
      delegations. Omit to keep the current settings.
    fullName: decisions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'decisions?: LiveDecisionsSettingsUpdateParam'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveDecisionsSettingsUpdateParam" />
  - name: type
    uid: '@azure/ai-projects.LiveDecisionsDelegationUpdateParam.type'
