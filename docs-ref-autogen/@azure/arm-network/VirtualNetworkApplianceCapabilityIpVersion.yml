name: VirtualNetworkApplianceCapabilityIpVersion
uid: '@azure/arm-network.VirtualNetworkApplianceCapabilityIpVersion'
package: '@azure/arm-network'
summary: >-
  The IP versions a virtual network appliance capability can apply to. See
  `ipVersion` on

  VirtualNetworkApplianceCapabilityProperties for the per-`kind` constraint. \

  [KnownVirtualNetworkApplianceCapabilityIpVersion](xref:@azure/arm-network.KnownVirtualNetworkApplianceCapabilityIpVersion)
  can be used interchangeably with VirtualNetworkApplianceCapabilityIpVersion,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **IPv6**: Single stack IPv6 only. \

  **DualStack**: Dual stack (both IPv4 and IPv6).
