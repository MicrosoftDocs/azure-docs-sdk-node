### YamlMime:TSEnum
name: KnownKnowledgeSourceNetworkAccessMode
uid: '@azure/search-documents.KnownKnowledgeSourceNetworkAccessMode'
package: '@azure/search-documents'
summary: >-
  Specifies the network access mode for knowledge source ingestion. Default is
  'public'.
fullName: KnownKnowledgeSourceNetworkAccessMode
remarks: ''
isDeprecated: false
fields:
  - name: Private
    uid: '@azure/search-documents.KnownKnowledgeSourceNetworkAccessMode.Private'
    package: '@azure/search-documents'
    summary: >-
      Ingestion runs in a private execution environment so it can reach data
      sources and dependencies over a private network (private endpoint / shared
      private link).
  - name: Public
    uid: '@azure/search-documents.KnownKnowledgeSourceNetworkAccessMode.Public'
    package: '@azure/search-documents'
    summary: >-
      Ingestion runs in the standard, publicly reachable execution environment.
      This is the default.
