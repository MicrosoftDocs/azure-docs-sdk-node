### YamlMime:TSType
name: SignalAggregationGroup
uid: '@azure/arm-cloudhealth.SignalAggregationGroup'
package: '@azure/arm-cloudhealth'
summary: >-
  A logical group of signals on an entity, evaluated under a configurable
  aggregation strategy. Groups are independent even when they share members.
  Each group's aggregated state is one of the inputs to the entity's composite
  health computation alongside any signals not declared in any group's
  members[].
fullName: SignalAggregationGroup
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: aggregatedHealthState
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.aggregatedHealthState'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Computed aggregated health state of the group as of the last entity
      evaluation. Unknown if no resolvable members or all members filtered out.
    fullName: aggregatedHealthState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'aggregatedHealthState?: string'
      return:
        description: ''
        type: string
  - name: aggregationType
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.aggregationType'
    package: '@azure/arm-cloudhealth'
    summary: Aggregation strategy applied across the members of this group.
    fullName: aggregationType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'aggregationType?: string'
      return:
        description: ''
        type: string
  - name: degradedThreshold
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.degradedThreshold'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Degraded threshold for threshold-bearing strategies (MinHealthy,
      MaxNotHealthy). For MinHealthy: group is degraded when the healthy member
      count/percentage falls to or below this value. For MaxNotHealthy: group is
      degraded when the not-healthy member count/percentage reaches or exceeds
      this value. Optional — if not set, the group transitions directly between
      Healthy and Unhealthy. MUST NOT be set when aggregationType is WorstOf or
      BestOf.
    fullName: degradedThreshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'degradedThreshold?: number'
      return:
        description: ''
        type: number
  - name: displayName
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.displayName'
    package: '@azure/arm-cloudhealth'
    summary: Display name
    fullName: displayName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'displayName?: string'
      return:
        description: ''
        type: string
  - name: ignoreUnknown
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.ignoreUnknown'
    package: '@azure/arm-cloudhealth'
    summary: >-
      If true (default), members reporting Unknown are excluded from the
      aggregation. For MinHealthy and MaxNotHealthy this flag affects the
      denominator/count and is meaningful. For WorstOf and BestOf the flag has
      no observable effect: under WorstOf, Unknown=0 is the lowest severity and
      can never beat any non-Unknown member in a Max() so filtering it changes
      nothing observable; under BestOf, Unknown is unconditionally excluded by
      the strategy itself irrespective of the flag. The flag is retained on the
      contract for vocabulary symmetry across all four strategies.
    fullName: ignoreUnknown
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ignoreUnknown?: boolean'
      return:
        description: ''
        type: boolean
  - name: members
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.members'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Names of signals on this entity which are members of the group. Members
      are matched by name; references to signals that do not currently exist on
      the entity are accepted (typically for pre-declared external signals) and
      surfaced via 'unresolvedMembers'. A signal may be listed in multiple
      groups; no duplicates within this list.
    fullName: members
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'members: string[]'
      return:
        description: ''
        type: string[]
  - name: name
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.name'
    package: '@azure/arm-cloudhealth'
    summary: Name of the aggregation group. Unique within the entity.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: unhealthyThreshold
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.unhealthyThreshold'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Unhealthy threshold for threshold-bearing strategies. Required when
      aggregationType is MinHealthy or MaxNotHealthy; MUST NOT be set otherwise.
    fullName: unhealthyThreshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'unhealthyThreshold?: number'
      return:
        description: ''
        type: number
  - name: unit
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.unit'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Unit type for the thresholds. Required when aggregationType is MinHealthy
      or MaxNotHealthy; MUST NOT be set otherwise.
    fullName: unit
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'unit?: string'
      return:
        description: ''
        type: string
  - name: unresolvedMembers
    uid: '@azure/arm-cloudhealth.SignalAggregationGroup.unresolvedMembers'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Members listed in 'members' that do not currently resolve to a signal on
      this entity at the time of the last entity evaluation. Treated as Unknown
      during aggregation. Empty/omitted when every member resolves.
    fullName: unresolvedMembers
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'unresolvedMembers?: string[]'
      return:
        description: ''
        type: string[]
