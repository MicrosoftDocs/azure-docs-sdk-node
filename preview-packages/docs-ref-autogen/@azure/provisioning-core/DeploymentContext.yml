### YamlMime:TSType
name: DeploymentContext
uid: '@azure/provisioning-core.DeploymentContext'
package: '@azure/provisioning-core'
summary: Default location, tags, and naming policy for resources in a stack or module.
fullName: DeploymentContext
remarks: |-
  Resources inherit these settings from their containing stack, module, and
  custom components:

  - Location and naming policy use the closest containing override.
  - Tags are combined, with closer overrides taking precedence.

  These defaults do not select the deployment scope; that is set by the stack
  or module. Defaults inherit into child modules, but any expressions they
  contain must be valid where the receiving resources are declared.
isDeprecated: false
type: interface
