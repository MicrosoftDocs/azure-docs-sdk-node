properties:
  - name: cancel
    uid: '@azure/ai-projects.BetaVoiceAgentsTelephonyOperations.cancel'
    package: '@azure/ai-projects'
    summary: >-
      Cancels a validating or running Campaign using If-Match. Stops new calls
      and retries; connected calls finish naturally. Returns 202 with an
      operation monitor to track completion.
    fullName: cancel
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        cancel: (agentName: string, campaignName: string, ifMatch: string,
        options?: BetaVoiceAgentsTelephonyCancelOptionalParams) =>
        PollerLike<OperationState<TelephonyCampaign>, TelephonyCampaign>
      return:
        description: ''
        type: >-
          (agentName: string, campaignName: string, ifMatch: string, options?:
          BetaVoiceAgentsTelephonyCancelOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;TelephonyCampaign&gt;,
          TelephonyCampaign&gt;
  - name: create
    uid: '@azure/ai-projects.BetaVoiceAgentsTelephonyOperations.create'
    package: '@azure/ai-projects'
    summary: >-
      Creates a Campaign or fully replaces failed preparation; no PATCH. All
      recipients must validate and have CallJobs before dialing. Immediate calls
      may begin before the preparation poller returns.
    fullName: create
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        create: (agentName: string, campaignName: string, campaign:
        TelephonyCampaignCreate, options?:
        BetaVoiceAgentsTelephonyCreateOptionalParams) =>
        PollerLike<OperationState<TelephonyCampaign>, TelephonyCampaign>
      return:
        description: ''
        type: >-
          (agentName: string, campaignName: string, campaign:
          TelephonyCampaignCreate, options?:
          BetaVoiceAgentsTelephonyCreateOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;TelephonyCampaign&gt;,
          TelephonyCampaign&gt;
  - name: deleteCampaign
    uid: '@azure/ai-projects.BetaVoiceAgentsTelephonyOperations.deleteCampaign'
    package: '@azure/ai-projects'
    summary: >-
      Deletes a terminal Campaign and its recipient/task data asynchronously.
      Returns bodyless 202 with a monitor, not a tombstone; completion makes GET
      return 404 and lists omit it. Dataset, connections, Agent, independent
      jobs and call history are preserved.
    fullName: deleteCampaign
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        deleteCampaign: (agentName: string, campaignName: string, ifMatch:
        string, options?: BetaVoiceAgentsTelephonyDeleteOptionalParams) =>
