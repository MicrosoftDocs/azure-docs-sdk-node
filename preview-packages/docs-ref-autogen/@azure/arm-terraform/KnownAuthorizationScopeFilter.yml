### YamlMime:TSEnum
name: KnownAuthorizationScopeFilter
uid: '@azure/arm-terraform.KnownAuthorizationScopeFilter'
package: '@azure/arm-terraform'
summary: The Azure Resource Graph Authorization Scope Filter parameter
fullName: KnownAuthorizationScopeFilter
remarks: ''
isDeprecated: false
fields:
  - name: AtScopeAboveAndBelow
    uid: '@azure/arm-terraform.KnownAuthorizationScopeFilter.AtScopeAboveAndBelow'
    package: '@azure/arm-terraform'
    summary: >-
      Returns assignments for the given scope, all parent scopes, and all child
      scopes.
  - name: AtScopeAndAbove
    uid: '@azure/arm-terraform.KnownAuthorizationScopeFilter.AtScopeAndAbove'
    package: '@azure/arm-terraform'
    summary: >-
      Returns assignments for the given scope and all parent scopes, but not
      child scopes.
  - name: AtScopeAndBelow
    uid: '@azure/arm-terraform.KnownAuthorizationScopeFilter.AtScopeAndBelow'
    package: '@azure/arm-terraform'
    summary: Returns assignments for the given scope and all child scopes.
  - name: AtScopeExact
    uid: '@azure/arm-terraform.KnownAuthorizationScopeFilter.AtScopeExact'
    package: '@azure/arm-terraform'
    summary: >-
      Returns assignments only for the given scope; no parent or child scopes
      are included.
