### YamlMime:TSTypeAlias
name: RaiAcsToolNameSelector
uid: '@azure/arm-cognitiveservices.RaiAcsToolNameSelector'
package: '@azure/arm-cognitiveservices'
summary: >-
  Snapshot paths for selecting a tool catalog entry.

  The listed values are recognized by the Azure AI Content Safety Unified
  Moderate host profile; other values are allowed for forward compatibility. \

  [KnownRaiAcsToolNameSelector](xref:@azure/arm-cognitiveservices.KnownRaiAcsToolNameSelector)
  can be used interchangeably with RaiAcsToolNameSelector,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **$snap.tool_call.name**: Selects the tool-call name from the canonical
  snapshot root. \

  **$.tool_call.name**: Selects the tool-call name through the snapshot-root
  alias.
fullName: RaiAcsToolNameSelector
remarks: ''
isDeprecated: false
syntax: |
  type RaiAcsToolNameSelector = string
