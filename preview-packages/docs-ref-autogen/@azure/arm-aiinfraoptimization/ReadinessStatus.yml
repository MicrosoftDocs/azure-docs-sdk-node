### YamlMime:TSTypeAlias
name: ReadinessStatus
uid: '@azure/arm-aiinfraoptimization.ReadinessStatus'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  The current actionability of a recommended option. \

  [KnownReadinessStatus](xref:@azure/arm-aiinfraoptimization.KnownReadinessStatus)
  can be used interchangeably with ReadinessStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ReadyToAttempt**: The option can be attempted without a known prerequisite
  action. \

  **QuotaIncreaseRequired**: The option requires a quota increase before
  deployment. \

  **VerificationRequired**: The option requires an external verification before
  deployment. \

  **Unavailable**: The option is not available to the subscription in the
  requested region.
fullName: ReadinessStatus
remarks: ''
isDeprecated: false
syntax: |
  type ReadinessStatus = string
