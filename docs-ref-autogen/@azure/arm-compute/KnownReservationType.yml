### YamlMime:TSEnum
name: KnownReservationType
uid: '@azure/arm-compute.KnownReservationType'
package: '@azure/arm-compute'
summary: >-
  Indicates the type of capacity reservation. Allowed values are 'Block' for
  block capacity reservations that enable a VM to consume capacity only from
  this capacity block when it is associated using a capacity reservation group,
  'Targeted' for reservations that enable a VM to consume capacity from an
  explicitly associated capacity reservation group and fall back to the publicly
  available capacity if the reservation is full, and 'Open' for reservations
  that a VM consumes when it is eligible from an implicitly associated capacity
  reservation group with the matching VM size and zone without associating that
  capacity reservation group and fall back to the publicly available capacity if
  the reservation is full. Future capacity reservations can be created in
  'Targeted' or 'Open' capacity reservation groups. The reservation type is
  immutable and cannot be changed after the capacity reservation group is
  created.
fullName: KnownReservationType
remarks: ''
isDeprecated: false
fields:
  - name: Block
    uid: '@azure/arm-compute.KnownReservationType.Block'
    package: '@azure/arm-compute'
    summary: >-
      Block capacity reservations that enable a VM to consume capacity only from
      this capacity block when it is associated using a capacity reservation
      group.
  - name: Open
    uid: '@azure/arm-compute.KnownReservationType.Open'
    package: '@azure/arm-compute'
    summary: >-
      Reservations that a VM consumes when it is eligible from an implicitly
      associated capacity reservation group with the matching VM size and zone
      without associating that capacity reservation group, and fall back to the
      publicly available capacity if the reservation is full. Minimum
      api-version: 2026-04-01.
  - name: Targeted
    uid: '@azure/arm-compute.KnownReservationType.Targeted'
    package: '@azure/arm-compute'
    summary: >-
      Reservations that enable a VM to consume capacity from an explicitly
      associated capacity reservation group and fall back to the publicly
      available capacity if the reservation is full.
