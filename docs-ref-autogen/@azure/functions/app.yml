  - name: warmup(string, WarmupFunctionOptions)
    uid: '@azure/functions.app.warmup'
    package: '@azure/functions'
    summary: >-
      Registers a function in your app that will be triggered when an instance
      is added to scale a running function app.

      The warmup trigger is only called during scale-out operations, not during
      restarts or other non-scale startups.

      Make sure your logic can load all required dependencies without relying on
      the warmup trigger.

      Lazy loading is a good pattern to achieve this goal.

      The warmup trigger isn't available to apps running on the Consumption
      plan.

      For more information, please see the [Azure Functions warmup trigger
      documentation](https://learn.microsoft.com/azure/azure-functions/functions-bindings-warmup?tabs=isolated-process&pivots=programming-language-javascript).
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function warmup(name: string, options: WarmupFunctionOptions)'
      parameters:
        - id: name
          type: string
          description: >-
            The name of the function. The name must be unique within your app
            and will mostly be used for your own tracking purposes
        - id: options
          type: <xref uid="@azure/functions.WarmupFunctionOptions" />
          description: >-
            Configuration options describing the inputs, outputs, and handler
            for this function
