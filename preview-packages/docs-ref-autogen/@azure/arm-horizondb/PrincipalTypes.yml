### YamlMime:TSTypeAlias
name: PrincipalTypes
uid: '@azure/arm-horizondb.PrincipalTypes'
package: '@azure/arm-horizondb'
summary: >-
  The type of Microsoft Entra principal mapped to a PostgreSQL role. \

  [KnownPrincipalTypes](xref:@azure/arm-horizondb.KnownPrincipalTypes) can be
  used interchangeably with PrincipalTypes,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: An unknown or unrecognized type. This value is for internal use
  and is not accepted in requests. \

  **User**: A Microsoft Entra ID user account. \

  **Group**: A Microsoft Entra ID security group. All members of the group
  inherit administrator privileges. \

  **ServicePrincipal**: A Microsoft Entra ID application or service principal
  used for automated workloads.
fullName: PrincipalTypes
remarks: ''
isDeprecated: false
syntax: |
  type PrincipalTypes = string
