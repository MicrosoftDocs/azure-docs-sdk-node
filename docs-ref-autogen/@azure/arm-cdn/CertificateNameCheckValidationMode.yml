### YamlMime:TSTypeAlias
name: CertificateNameCheckValidationMode
uid: '@azure/arm-cdn.CertificateNameCheckValidationMode'
package: '@azure/arm-cdn'
summary: >-
  The validation mode for certificate name check at origin level. Only
  applicable when enforceCertificateNameCheck is true. \

  [KnownCertificateNameCheckValidationMode](xref:@azure/arm-cdn.KnownCertificateNameCheckValidationMode)
  can be used interchangeably with CertificateNameCheckValidationMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **OriginHostname**: Validate the certificate against the origin hostname. \

  **CustomCertificateSubject**: Validate the certificate against custom
  certificate subjects. \

  **IncomingHostHeader**: Validate the certificate against the incoming host
  header.
fullName: CertificateNameCheckValidationMode
remarks: ''
isDeprecated: false
syntax: |
  type CertificateNameCheckValidationMode = string
