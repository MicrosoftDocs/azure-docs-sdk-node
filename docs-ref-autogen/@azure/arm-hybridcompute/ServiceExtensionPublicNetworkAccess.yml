### YamlMime:TSTypeAlias
name: ServiceExtensionPublicNetworkAccess
uid: '@azure/arm-hybridcompute.ServiceExtensionPublicNetworkAccess'
package: '@azure/arm-hybridcompute'
summary: >-
  The network access policy to determine if the specified Azure Arc Extension
  can use public Azure Arc Extension service endpoints. \

  [KnownServiceExtensionPublicNetworkAccess](xref:@azure/arm-hybridcompute.KnownServiceExtensionPublicNetworkAccess)
  can be used interchangeably with ServiceExtensionPublicNetworkAccess,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Allows Azure Arc Extension agents to communicate with Azure Arc
  services over both public (internet) and private endpoints. \

  **Disabled**: Does not allow Azure Arc Extension agents to communicate with
  Azure Arc services over public (internet) endpoints. The agents must use the
  private link.
fullName: ServiceExtensionPublicNetworkAccess
remarks: ''
isDeprecated: false
syntax: |
  type ServiceExtensionPublicNetworkAccess = string
