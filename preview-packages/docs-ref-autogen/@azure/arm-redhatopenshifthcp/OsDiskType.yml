### YamlMime:TSTypeAlias
name: OsDiskType
uid: '@azure/arm-redhatopenshifthcp.OsDiskType'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  The type of the OS disk

  - https://learn.microsoft.com/en-us/azure/virtual-machines/ephemeral-os-disks
  \

  [KnownOsDiskType](xref:@azure/arm-redhatopenshifthcp.KnownOsDiskType) can be
  used interchangeably with OsDiskType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Managed**: Managed OS disk - stored as an Azure managed disk
  (network-attached).

  Default behavior for VMs without sufficient cache. \

  **Ephemeral**: Ephemeral OS disk - stored on local VM cache/temporary storage.

  Provides lower latency and faster node operations.

  Requires VM with sufficient cache size.
fullName: OsDiskType
remarks: ''
isDeprecated: false
syntax: |
  type OsDiskType = string
