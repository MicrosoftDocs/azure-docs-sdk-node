### YamlMime:TSEnum
name: KnownProcessorMode
uid: '@azure/arm-compute.KnownProcessorMode'
package: '@azure/arm-compute'
summary: >-
  Specifies the processor frequency behavior for the virtual machine. See each
  member for the behavior it controls.
fullName: KnownProcessorMode
remarks: ''
isDeprecated: false
fields:
  - name: Deterministic
    uid: '@azure/arm-compute.KnownProcessorMode.Deterministic'
    package: '@azure/arm-compute'
    summary: >-
      Ensures predictable and consistent processor frequency at the base/nominal
      level. Turbo/Boost is disabled.
  - name: Opportunistic
    uid: '@azure/arm-compute.KnownProcessorMode.Opportunistic'
    package: '@azure/arm-compute'
    summary: Allows higher frequency bursts when thermal and power headroom permits.
