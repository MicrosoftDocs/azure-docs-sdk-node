  - name: target
    uid: '@azure/provisioning-core.ExternalModuleOptions.target'
    package: '@azure/provisioning-core'
    summary: >-
      The external template reference to deploy. Relative file paths are
      resolved

      from the containing stack's generated Bicep file.


      Examples:

      - `"./storage.bicep"`: a local Bicep template.

      - `"./storage.json"`: a local ARM template.

      - `"br:registry.azurecr.io/modules/storage:v1"`: a registry module.

      - `"ts:00000000-0000-0000-0000-000000000000/templates/storage:1.0"`:
        a versioned template spec.
    fullName: target
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'target: string'
      return:
        description: ''
        type: string
