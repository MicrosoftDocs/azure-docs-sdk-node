### YamlMime:TSTypeAlias
name: ChangeDataCaptureReplicationState
uid: '@azure/arm-horizondb.ChangeDataCaptureReplicationState'
package: '@azure/arm-horizondb'
summary: >-
  The state of a destination-owned replication session. \

  [KnownChangeDataCaptureReplicationState](xref:@azure/arm-horizondb.KnownChangeDataCaptureReplicationState)
  can be used interchangeably with ChangeDataCaptureReplicationState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotApplicable**: A destination session does not apply to the current
  resource state. \

  **NotConnected**: No destination session is connected. \

  **Connecting**: A destination session is connecting. \

  **Replicating**: A destination session is replicating changes. \

  **Reconnecting**: A destination session is reconnecting after an interruption.
  \

  **Paused**: The destination session is paused. \

  **Stopping**: The destination session is stopping. \

  **Degraded**: The destination session is operating with impaired health. \

  **Failed**: The destination session failed.
fullName: ChangeDataCaptureReplicationState
remarks: ''
isDeprecated: false
syntax: |
  type ChangeDataCaptureReplicationState = string
