### YamlMime:TSTypeAlias
name: TokenBindingMode
uid: '@azure/arm-keyvault.TokenBindingMode'
package: '@azure/arm-keyvault'
summary: >-
  This specifies whether token binding is disabled, enabled or enforced. \

  [KnownTokenBindingMode](xref:@azure/arm-keyvault.KnownTokenBindingMode) can be
  used interchangeably with TokenBindingMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enforced**: Token binding is enforced for the vault. Only bounded tokens
  will be accepted. Bearer tokens will be rejected. \

  **NotEnforced**: Token binding is not enforced for the vault. Bounded tokens
  will be rejected.
fullName: TokenBindingMode
remarks: ''
isDeprecated: false
syntax: |
  type TokenBindingMode = string
