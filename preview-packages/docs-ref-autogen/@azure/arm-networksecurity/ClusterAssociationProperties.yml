### YamlMime:TSType
name: ClusterAssociationProperties
uid: '@azure/arm-networksecurity.ClusterAssociationProperties'
package: '@azure/arm-networksecurity'
summary: ClusterAssociation properties
fullName: ClusterAssociationProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: clusterResourceId
    uid: '@azure/arm-networksecurity.ClusterAssociationProperties.clusterResourceId'
    package: '@azure/arm-networksecurity'
    summary: >-
      The AKS managed cluster or ACI SandboxGroup to enroll. The resource must
      be

      in the same subscription as the AgentFabric; a different resource group is

      allowed. Set at creation and immutable thereafter; to enroll a different

      resource, delete and recreate the association. AF rejects the request if

      the resource is already associated with another fabric.
    fullName: clusterResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clusterResourceId: string'
      return:
        description: ''
        type: string
  - name: provisioningState
    uid: '@azure/arm-networksecurity.ClusterAssociationProperties.provisioningState'
    package: '@azure/arm-networksecurity'
    summary: The provisioning state of the resource.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: sku
    uid: '@azure/arm-networksecurity.ClusterAssociationProperties.sku'
    package: '@azure/arm-networksecurity'
    summary: |-
      Determines which AgentFabric components are deployed to the cluster.
      Defaults to Standard when omitted at creation. An update may upgrade
      Standard to Premium but cannot downgrade Premium to Standard. The SKU
      remains unchanged when omitted during an update.
    fullName: sku
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sku?: string'
      return:
        description: ''
        type: string
  - name: status
    uid: '@azure/arm-networksecurity.ClusterAssociationProperties.status'
    package: '@azure/arm-networksecurity'
    summary: |-
      Error code and message for a failed association. A failed association is
      retained rather than deleted, so the failure can be inspected and retried.
      Read-only.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status?: ClusterAssociationStatus'
      return:
        description: ''
        type: <xref uid="@azure/arm-networksecurity.ClusterAssociationStatus" />
  - name: workloadClusterGatewayIp
    uid: >-
      @azure/arm-networksecurity.ClusterAssociationProperties.workloadClusterGatewayIp
    package: '@azure/arm-networksecurity'
    summary: |-
      The IPv4 or IPv6 address of the workload cluster gateway used for
      internal Agent Fabric routing. The resource provider validates the value.
    fullName: workloadClusterGatewayIp
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'workloadClusterGatewayIp?: string'
      return:
        description: ''
        type: string
