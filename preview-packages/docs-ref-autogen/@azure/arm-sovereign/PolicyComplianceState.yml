### YamlMime:TSTypeAlias
name: PolicyComplianceState
uid: '@azure/arm-sovereign.PolicyComplianceState'
package: '@azure/arm-sovereign'
summary: >-
  Supported compliance states for the policy initiatives. \

  [KnownPolicyComplianceState](xref:@azure/arm-sovereign.KnownPolicyComplianceState)
  can be used interchangeably with PolicyComplianceState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Compliant**: The resource is compliant with respect to the given policy. \

  **NonCompliant**: The resource is not compliant with respect to the given
  policy. \

  **Conflict**: The resource is in a conflict with respect to the given policy.
  \

  **NotApplicable**: The resource is in a state that is not applicable to the
  given policy. \

  **NotEvaluated**: The resource has not been evaluated for compliance with
  respect to the given policy. \

  **Constrained**: The resource is non-compliant for Business Continuity, but a
  validated actionable escape path is available. \

  **Others**: The resource is in a compliance state other than Compliant,
  NonCompliant, Conflict, NotApplicable, or NotEvaluated.
fullName: PolicyComplianceState
remarks: ''
isDeprecated: false
syntax: |
  type PolicyComplianceState = string
