name: JobRunningState
uid: '@azure/arm-appcontainers.JobRunningState'
package: '@azure/arm-appcontainers'
summary: >-
  Current running state of the job \

  [KnownJobRunningState](xref:@azure/arm-appcontainers.KnownJobRunningState) can
  be used interchangeably with JobRunningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Ready**: The job is ready to run. \

  **Progressing**: The job is transitioning to its target state. \

  **Suspended**: The job is suspended.
