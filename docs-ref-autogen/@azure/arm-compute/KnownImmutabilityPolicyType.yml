### YamlMime:TSEnum
name: KnownImmutabilityPolicyType
uid: '@azure/arm-compute.KnownImmutabilityPolicyType'
package: '@azure/arm-compute'
summary: >-
  The type of the immutability policy. 'Unlocked' allows the policy to be
  modified by privileged users; 'Locked' prevents reduction of the immutability
  duration but allows extension of the lock period.
fullName: KnownImmutabilityPolicyType
remarks: ''
isDeprecated: false
fields:
  - name: Locked
    uid: '@azure/arm-compute.KnownImmutabilityPolicyType.Locked'
    package: '@azure/arm-compute'
    summary: >-
      The snapshot immutability policy duration cannot be reduced but can be
      extended. The policy cannot be removed until the lock period expires.
  - name: Unlocked
    uid: '@azure/arm-compute.KnownImmutabilityPolicyType.Unlocked'
    package: '@azure/arm-compute'
    summary: >-
      Privileged users can modify the snapshot's immutability policy, if it is
      unlocked type.
