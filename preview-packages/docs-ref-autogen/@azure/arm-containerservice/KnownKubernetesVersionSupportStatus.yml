### YamlMime:TSEnum
name: KnownKubernetesVersionSupportStatus
uid: '@azure/arm-containerservice.KnownKubernetesVersionSupportStatus'
package: '@azure/arm-containerservice'
summary: >-
  The support status of the Kubernetes version the cluster is currently running.
  This is

  intentionally binary — there is no discrete `ApproachingEOL` value. Proximity
  to end of

  support is derived by clients from `kubernetesVersionEndOfSupportDate`
  (comparing it

  against the current time), so no server-computed "approaching EOS" flag or
  message is

  returned that could go stale in a cached record.
fullName: KnownKubernetesVersionSupportStatus
remarks: ''
isDeprecated: false
fields:
  - name: InSupport
    uid: '@azure/arm-containerservice.KnownKubernetesVersionSupportStatus.InSupport'
    package: '@azure/arm-containerservice'
    summary: >-
      The scope is running a Kubernetes version that is still within its support
      window.
  - name: OutOfSupport
    uid: >-
      @azure/arm-containerservice.KnownKubernetesVersionSupportStatus.OutOfSupport
    package: '@azure/arm-containerservice'
    summary: The scope is running a Kubernetes version that is past its end of support.
