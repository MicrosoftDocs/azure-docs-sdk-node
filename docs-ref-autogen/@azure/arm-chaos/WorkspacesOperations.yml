  - name: discover
    uid: '@azure/arm-chaos.WorkspacesOperations.discover'
    package: '@azure/arm-chaos'
    summary: >-
      Starts discovery for the workspace. The initial 202 has no body. Poll the
      operation-bound Location URL until completion: a successful or partially
      successful discovery returns the typed result; failed or canceled
      processing returns an Azure error whose target identifies the discovery
      resource. Ordinary discovery reads return the current resource, including
      failed or canceled results, while retained.
