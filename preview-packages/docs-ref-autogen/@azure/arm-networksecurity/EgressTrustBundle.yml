### YamlMime:TSType
name: EgressTrustBundle
uid: '@azure/arm-networksecurity.EgressTrustBundle'
package: '@azure/arm-networksecurity'
summary: >-
  The egress TLS-inspection trust bundle for an agent fabric.


  AgentFabric terminates and re-encrypts enrolled egress traffic, presenting
  leaf

  certificates signed by an AgentFabric-operated certificate authority. A
  workload can only

  complete those handshakes if the CA's PUBLIC anchor is already present in its
  trust store.

  This singleton publishes the anchors that are installed into the fabric's
  sandboxes, so

  the compute platform can install them during sandbox bring-up and so you can
  audit exactly

  which authorities your workloads are being asked to trust.


  The resource is read-only and computed: it is never created, updated or
  deleted through

  ARM, and reading it neither enrolls a workload nor redirects any traffic. It
  returns PUBLIC

  certificates only -- private key material never leaves AgentFabric's key
  vault.


  A bundle is always returned as a list, even when it holds a single anchor, so
  that a CA

  rollover can publish the outgoing and incoming anchors together.
