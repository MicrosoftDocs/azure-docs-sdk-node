name: BlobStorageMountProtocol
uid: '@azure/arm-discovery.BlobStorageMountProtocol'
package: '@azure/arm-discovery'
summary: >-
  The protocol to use for mounting an Azure Storage Blob store. \

  [KnownBlobStorageMountProtocol](xref:@azure/arm-discovery.KnownBlobStorageMountProtocol)
  can be used interchangeably with BlobStorageMountProtocol,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NFS**: NFS protocol. Version of NFS used may vary based on storage type \

  **BlobfuseCaching**: Blobfuse in file cache mode.
