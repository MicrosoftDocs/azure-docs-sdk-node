### YamlMime:TSType
name: CostControlPatchProperties
uid: '@azure/arm-cognitiveservices.CostControlPatchProperties'
package: '@azure/arm-cognitiveservices'
summary: >-
  Edits applied when properties is a non-empty object. Omitted fields retain
  their existing values; no defaults are applied.

  The complete merged result may contain at most one notification, including
  disabled notifications, and one Block action.

  Exceeding either limit returns HTTP 400 without changing the stored
  definition.

  Missing registration returns 403 FeatureNotRegistered before merging or no-op
  detection.

  Omitting or removing identity selections does not require this registration;
  omitted stored selections are preserved, subject to existing validation rules.
fullName: CostControlPatchProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: amount
    uid: '@azure/arm-cognitiveservices.CostControlPatchProperties.amount'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Replaces the positive budget amount, measured in United States dollars for
      the Cost category or in whole tokens for the Tokens category.
    fullName: amount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'amount?: number'
      return:
        description: ''
        type: number
  - name: category
    uid: '@azure/arm-cognitiveservices.CostControlPatchProperties.category'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The existing measurement category. Changing it after creation is not
      supported.
    fullName: category
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'category?: string'
      return:
        description: ''
        type: string
  - name: filter
    uid: '@azure/arm-cognitiveservices.CostControlPatchProperties.filter'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Replaces the complete traffic filter. Set to null to select all eligible
      traffic within the owner's scope.
    fullName: filter
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'filter?: CostControlFilter'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.CostControlFilter" />
  - name: grouping
    uid: '@azure/arm-cognitiveservices.CostControlPatchProperties.grouping'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Replaces additional grouping. Omission preserves grouping; an empty array
      restores the owner's default counter. Null is not accepted.
    fullName: grouping
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'grouping?: CostControlGrouping[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.CostControlGrouping" />[]
  - name: notifications
    uid: '@azure/arm-cognitiveservices.CostControlPatchProperties.notifications'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Merges notifications by case-insensitive name, preserving existing name
      casing. Null entries delete notifications; null clears the collection.

      Omission or an empty object preserves existing notifications. New entries
      must supply all required notification fields after merging.

      The complete merged result may contain at most one notification, including
      disabled notifications; otherwise the request returns HTTP 400.
    fullName: notifications
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'notifications?: Record<string, CostControlNotificationPatch>'
      return:
        description: ''
        type: >-
          Record&lt;string, <xref
          uid="@azure/arm-cognitiveservices.CostControlNotificationPatch" />&gt;
  - name: provider
    uid: '@azure/arm-cognitiveservices.CostControlPatchProperties.provider'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The resource provider. If supplied, it must be Microsoft.CognitiveServices
      and cannot be null.
    fullName: provider
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provider?: "Microsoft.CognitiveServices"'
      return:
        description: ''
        type: '"<xref uid="Microsoft.CognitiveServices" />"'
  - name: providerProperties
