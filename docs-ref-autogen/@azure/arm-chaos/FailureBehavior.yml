### YamlMime:TSTypeAlias
name: FailureBehavior
uid: '@azure/arm-chaos.FailureBehavior'
package: '@azure/arm-chaos'
summary: >-
  Enum of how a scenario run reacts when an action fails. \

  [KnownFailureBehavior](xref:@azure/arm-chaos.KnownFailureBehavior) can be used
  interchangeably with FailureBehavior,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Stop**: The action failure stops the scenario run and drives it to the
  `Failed` terminal state.

  This is the effective behavior when no `failureBehavior` is supplied. \

  **Continue**: The action failure is suppressed: it does not by itself end the
  scenario run, and the run

  continues with its remaining actions. Suppression affects the run's result
  only. It does not

  change dependency scheduling, which stays under the control of each action's
  `runAfter` —

  an action that should still start after a failed dependency says so there.


  A run that completes normally and whose action failures were all suppressed
  terminates as

  `PartiallySucceeded`. Any failure that is not suppressed still drives the run
  to `Failed`,

  and cancellation keeps its existing result.
fullName: FailureBehavior
remarks: ''
isDeprecated: false
syntax: |
  type FailureBehavior = string
