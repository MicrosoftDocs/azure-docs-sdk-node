name: DayOfWeek
uid: '@azure/arm-containerservicefleet.DayOfWeek'
package: '@azure/arm-containerservicefleet'
summary: >-
  The days of a week. \

  [KnownDayOfWeek](xref:@azure/arm-containerservicefleet.KnownDayOfWeek) can be
  used interchangeably with DayOfWeek,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Monday**: The day Monday. \

  **Tuesday**: The day Tuesday. \

  **Wednesday**: The day Wednesday. \

  **Thursday**: The day Thursday. \

  **Friday**: The day Friday. \

  **Saturday**: The day Saturday. \

  **Sunday**: The day Sunday.
