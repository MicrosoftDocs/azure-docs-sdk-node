type: interface
properties:
  - name: matchExpressions
    uid: '@azure/arm-network.KubeLabelSelector.matchExpressions'
    package: '@azure/arm-network'
    summary: >-
      matchExpressions is a list of label selector requirements. The
      requirements are ANDed.
    fullName: matchExpressions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'matchExpressions?: LabelSelectorExpression[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-network.LabelSelectorExpression" />[]
  - name: matchLabels
    uid: '@azure/arm-network.KubeLabelSelector.matchLabels'
    package: '@azure/arm-network'
    summary: >-
      matchLabels is a map of {key,value} pairs. A single {key,value} in the
      matchLabels

      map is equivalent to an element of matchExpressions, whose key field is
      "key", the

      operator is "In", and the values array contains only "value". The
      requirements are ANDed.
    fullName: matchLabels
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'matchLabels?: Record<string, string>'
      return:
        description: ''
        type: Record&lt;string, string&gt;
