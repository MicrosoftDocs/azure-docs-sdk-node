name: CostControlGroupingName
uid: '@azure/arm-cognitiveservices.CostControlGroupingName'
package: '@azure/arm-cognitiveservices'
summary: >-
  Built-in attributes supported for additional budget partitioning. \

  [KnownCostControlGroupingName](xref:@azure/arm-cognitiveservices.KnownCostControlGroupingName)
  can be used interchangeably with CostControlGroupingName,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **project**: Creates an independent counter for each Foundry project in the
  owning account. \

  **agent**: Creates an independent counter for each Foundry agent, qualified by
  its Foundry project so identical agent names in different projects do not
  share counters. \

  **sessionId**: Creates an independent counter for each Foundry session ID.
fullName: CostControlGroupingName
remarks: ''
isDeprecated: false
syntax: |
  type CostControlGroupingName = string
