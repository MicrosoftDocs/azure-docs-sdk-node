### YamlMime:TSEnum
name: KnownQueryType
uid: '@azure/search-documents.KnownQueryType'
package: '@azure/search-documents'
summary: >-
  Specifies the syntax of the search query. The default is 'simple'. Use 'full'
  if your query uses the Lucene query syntax and 'semantic' if query syntax is
  not needed.
fullName: KnownQueryType
remarks: ''
isDeprecated: false
fields:
  - name: Agentic
    uid: '@azure/search-documents.KnownQueryType.Agentic'
    package: '@azure/search-documents'
    summary: >-
      Uses an agentic model to generate queries and rerank search results within
      one index. Requires nonempty natural-language search text.
  - name: Full
    uid: '@azure/search-documents.KnownQueryType.Full'
    package: '@azure/search-documents'
    summary: >-
      Uses the full Lucene query syntax for searches. Search text is interpreted
      using the Lucene query language which allows field-specific and weighted
      searches, as well as other advanced features.
  - name: Semantic
    uid: '@azure/search-documents.KnownQueryType.Semantic'
    package: '@azure/search-documents'
    summary: >-
      Best suited for queries expressed in natural language as opposed to
      keywords. Improves precision of search results by re-ranking the top
      search results using a ranking model trained on the Web corpus.
  - name: Simple
    uid: '@azure/search-documents.KnownQueryType.Simple'
    package: '@azure/search-documents'
    summary: >-
      Uses the simple query syntax for searches. Search text is interpreted
      using a simple query language that allows for symbols such as +, * and "".
      Queries are evaluated across all searchable fields by default, unless the
      searchFields parameter is specified.
