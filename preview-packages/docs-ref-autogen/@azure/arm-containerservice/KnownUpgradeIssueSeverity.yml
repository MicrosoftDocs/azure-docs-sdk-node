name: KnownUpgradeIssueSeverity
uid: '@azure/arm-containerservice.KnownUpgradeIssueSeverity'
package: '@azure/arm-containerservice'
summary: The severity of a detected upgrade issue.
fullName: KnownUpgradeIssueSeverity
remarks: ''
isDeprecated: false
fields:
  - name: Blocking
    uid: '@azure/arm-containerservice.KnownUpgradeIssueSeverity.Blocking'
    package: '@azure/arm-containerservice'
    summary: The issue will block the upgrade from completing successfully.
  - name: Warning
    uid: '@azure/arm-containerservice.KnownUpgradeIssueSeverity.Warning'
    package: '@azure/arm-containerservice'
    summary: >-
      The issue may cause problems with client applications or services on the
      cluster but will not necessarily prevent the upgrade from completing.
