### YamlMime:TSType
name: ClusterProperties
uid: '@azure/arm-horizondb.ClusterProperties'
package: '@azure/arm-horizondb'
summary: Properties of a HorizonDB cluster.
fullName: ClusterProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: aiModelManagement
    uid: '@azure/arm-horizondb.ClusterProperties.aiModelManagement'
    package: '@azure/arm-horizondb'
    summary: Specifies whether AI Model Management is enabled for the cluster.
    fullName: aiModelManagement
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'aiModelManagement?: string'
      return:
        description: ''
        type: string
  - name: backup
    uid: '@azure/arm-horizondb.ClusterProperties.backup'
    package: '@azure/arm-horizondb'
    summary: The backup configuration for the cluster.
    fullName: backup
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'backup?: BackupProperties'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.BackupProperties" />
  - name: creationMode
    uid: '@azure/arm-horizondb.ClusterProperties.creationMode'
    package: '@azure/arm-horizondb'
    summary: >-
      The mode used to create the cluster. When this property is omitted while
      creating a new cluster, the service records Create. PointInTimeRestore
      creates a new cluster from an available backup; pointInTimeUtc and
      creationSourceClusterResourceId are then required, postgreSqlVersion must
      be omitted because it is obtained from the backup metadata, and
      creationSourceClusterLocation is required when the source and target
      cluster locations differ. This property is immutable and is returned as
      creation provenance. On replacement, omission preserves the recorded
      value, resubmitting the same value is accepted, and changing it is
      rejected.
    fullName: creationMode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'creationMode?: string'
      return:
        description: ''
        type: string
  - name: creationSourceClusterLocation
    uid: '@azure/arm-horizondb.ClusterProperties.creationSourceClusterLocation'
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure location of the source HorizonDB cluster used for point-in-time
      restore. This property is optional when the source and target cluster
      locations are the same. It is required when the source cluster location
      differs from the target cluster location and must identify the source
      cluster's location. This property must be absent for creation modes other
      than PointInTimeRestore or when creationMode is omitted. This immutable
      creation-provenance value does not change after creation.
    fullName: creationSourceClusterLocation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'creationSourceClusterLocation?: string'
      return:
        description: ''
        type: string
  - name: creationSourceClusterResourceId
    uid: '@azure/arm-horizondb.ClusterProperties.creationSourceClusterResourceId'
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure resource ID of the source HorizonDB cluster used by the selected
      creation mode. This property is required for PointInTimeRestore and other
      source-based creation modes, and must be absent when creationMode is
      Create or omitted. A source cluster does not need to have a pool to be
      restored, provided an available backup exists. This immutable
      creation-provenance value does not change after creation.
    fullName: creationSourceClusterResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'creationSourceClusterResourceId?: string'
      return:
        description: ''
        type: string
  - name: dataEncryption
    uid: '@azure/arm-horizondb.ClusterProperties.dataEncryption'
    package: '@azure/arm-horizondb'
    summary: >-
      The data encryption configuration for the cluster. When omitted during
      initial cluster creation, the service uses SystemManaged encryption. When
      supplied during initial cluster creation, type is required. For PUT
      updates of an existing cluster, type may be omitted; if provided, it must
      match the existing encryption type. The encryption type is selected at
      cluster creation; switching between SystemManaged and AzureKeyVault after
      creation is not supported.
    fullName: dataEncryption
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'dataEncryption?: HorizonDbClusterDataEncryption'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.HorizonDbClusterDataEncryption" />
  - name: network
    uid: '@azure/arm-horizondb.ClusterProperties.network'
    package: '@azure/arm-horizondb'
    summary: >-
      The network configuration for the cluster. When this object is omitted,
      the service defaults it to publicAccess Disabled.
    fullName: network
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'network?: Network'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.Network" />
  - name: pointInTimeUtc
    uid: '@azure/arm-horizondb.ClusterProperties.pointInTimeUtc'
    package: '@azure/arm-horizondb'
    summary: >-
      The requested point in time, in UTC. This property is required in every
      PointInTimeRestore request. For a same-location restore, the service
      restores the latest backup available at or before this value. For a
      cross-location restore, the service requires but ignores this value and
      restores the latest available backup; cross-location responses omit this
      property. This property must be absent for other creation modes or when
      creationMode is omitted and can only be specified during resource
      creation.
    fullName: pointInTimeUtc
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'pointInTimeUtc?: Date'
      return:
        description: ''
        type: Date
  - name: postgreSqlVersion
    uid: '@azure/arm-horizondb.ClusterProperties.postgreSqlVersion'
    package: '@azure/arm-horizondb'
    summary: >-
      The PostgreSQL major version used by the HorizonDB cluster. API version
      2026-10-01-preview supports versions 17 and 18. For ordinary cluster
      creation, the version is supplied in the request and is immutable after
      creation. For point-in-time restore, the service obtains the version from
      the source backup metadata and the request must omit this property. This
      API version does not support in-place PostgreSQL major-version upgrades.
    fullName: postgreSqlVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'postgreSqlVersion?: string'
      return:
        description: ''
        type: string
  - name: provisioningState
    uid: '@azure/arm-horizondb.ClusterProperties.provisioningState'
    package: '@azure/arm-horizondb'
    summary: The provisioning state of the cluster.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState: string'
      return:
        description: ''
        type: string
  - name: readWritePool
    uid: '@azure/arm-horizondb.ClusterProperties.readWritePool'
    package: '@azure/arm-horizondb'
    summary: The pool currently designated to host the cluster's read-write node.
    fullName: readWritePool
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'readWritePool: ReadWritePoolProperties'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.ReadWritePoolProperties" />
  - name: state
    uid: '@azure/arm-horizondb.ClusterProperties.state'
    package: '@azure/arm-horizondb'
    summary: Current state of the cluster.
    fullName: state
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'state: string'
      return:
        description: ''
        type: string
