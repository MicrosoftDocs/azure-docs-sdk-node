### YamlMime:TSType
name: VoiceRecording
uid: '@azure/ai-projects.VoiceRecording'
package: '@azure/ai-projects'
summary: >-
  Metadata for the merged, whole-call stereo recording of a voice conversation
  (user audio on the left channel,

  agent audio on the right). Built once from the per-turn segments after the
  session ends and durably cached.

  The common metadata (format, sample rate, channels, channel layout, duration)
  is returned for both

  Foundry-managed and bring-your-own-storage (BYOS) recordings. For BYOS the
  response also includes `blob_uri`,

  the URI of the recording in the customer's own storage (no SAS token), which
  the customer downloads using their

  own storage credentials. For Foundry-managed storage `blob_uri` is absent and
  the bytes are streamed via the

  `/audio/content` route instead.
fullName: VoiceRecording
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: blob_uri
    uid: '@azure/ai-projects.VoiceRecording.blob_uri'
    package: '@azure/ai-projects'
    summary: >-
      For bring-your-own-storage (BYOS) recordings only: the URI of the
      recording in the customer's own storage, without a SAS token. The customer
      downloads it using their own storage credentials. Absent for
      Foundry-managed storage, where the bytes are streamed via the
      `/audio/content` route instead.
    fullName: blob_uri
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'blob_uri?: string'
      return:
        description: ''
        type: string
  - name: channels
    uid: '@azure/ai-projects.VoiceRecording.channels'
    package: '@azure/ai-projects'
    summary: The number of audio channels. The merged recording is stereo (`2`).
    fullName: channels
