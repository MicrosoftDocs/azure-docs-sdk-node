name: LiveSessionCreateParamsDelegationLiveClientDelegationParam
uid: '@azure/ai-projects.LiveSessionCreateParamsDelegationLiveClientDelegationParam'
package: '@azure/ai-projects'
summary: >-
  Delegate tasks to your application. The Live session emits delegation events
  that your backend handles.
fullName: LiveSessionCreateParamsDelegationLiveClientDelegationParam
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: acknowledgement_delay_ms
    uid: >-
      @azure/ai-projects.LiveSessionCreateParamsDelegationLiveClientDelegationParam.acknowledgement_delay_ms
    package: '@azure/ai-projects'
    summary: >-
      Milliseconds to wait before requesting an automatic spoken acknowledgement
      for a delegation. The model may still speak before this delay. Any
      commentary or thinking appended to the session cancels all pending
      acknowledgements, including those for other delegations. Defaults to 400
      for Decisions sessions and 0 (request immediately) for other sessions.
      Omission in a session update preserves the current value. Updates apply to
      subsequent delegations.
    fullName: acknowledgement_delay_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'acknowledgement_delay_ms?: number'
      return:
        description: ''
        type: number
  - name: type
    uid: >-
      @azure/ai-projects.LiveSessionCreateParamsDelegationLiveClientDelegationParam.type
    package: '@azure/ai-projects'
    summary: >-
      The delegation owner. Always `client` for tasks handled by your
      application.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "client"'
      return:
        description: ''
        type: '"client"'
extends: <xref uid="@azure/ai-projects.LiveSessionCreateParamsDelegation" />
