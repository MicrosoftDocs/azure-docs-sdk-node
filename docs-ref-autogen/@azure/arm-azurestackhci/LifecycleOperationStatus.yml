name: LifecycleOperationStatus
uid: '@azure/arm-azurestackhci.LifecycleOperationStatus'
package: '@azure/arm-azurestackhci'
summary: >-
  Status of an operation. Maps to Steps.Status / SubSteps.Status. \

  [KnownLifecycleOperationStatus](xref:@azure/arm-azurestackhci.KnownLifecycleOperationStatus)
  can be used interchangeably with LifecycleOperationStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotStarted**: Operation has not started. \

  **InProgress**: Operation is in progress. \

  **Completed**: Operation has completed successfully. \

  **Failed**: Operation has failed.
fullName: LifecycleOperationStatus
remarks: ''
isDeprecated: false
syntax: |
  type LifecycleOperationStatus = string
