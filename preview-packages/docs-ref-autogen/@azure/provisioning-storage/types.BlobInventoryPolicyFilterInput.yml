### YamlMime:TSType
name: BlobInventoryPolicyFilterInput
uid: '@azure/provisioning-storage.types.BlobInventoryPolicyFilterInput'
package: '@azure/provisioning-storage'
summary: >-
  Input type for An object that defines the blob inventory rule filter
  conditions. For 'Blob' definition.objectType all filter properties are
  applicable, 'blobTypes' is required and others are optional. For 'Container'
  definition.objectType only prefixMatch is applicable and is optional.
fullName: BlobInventoryPolicyFilterInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: blobTypes
    uid: '@azure/provisioning-storage.types.BlobInventoryPolicyFilterInput.blobTypes'
    package: '@azure/provisioning-storage'
    summary: >-
      An array of predefined enum values. Valid values include blockBlob,
      appendBlob, pageBlob. Hns accounts does not support pageBlobs. This field
      is required when definition.objectType property is set to 'Blob'.
    fullName: blobTypes
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'blobTypes?: any'
      return:
        description: ''
        type: any
  - name: creationTime
    uid: >-
      @azure/provisioning-storage.types.BlobInventoryPolicyFilterInput.creationTime
    package: '@azure/provisioning-storage'
    summary: This property is used to filter objects based on the object creation time
    fullName: creationTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'creationTime?: BlobInventoryCreationTimeInput'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/provisioning-storage.types.BlobInventoryCreationTimeInput"
          />
  - name: excludePrefix
    uid: >-
      @azure/provisioning-storage.types.BlobInventoryPolicyFilterInput.excludePrefix
    package: '@azure/provisioning-storage'
    summary: >-
      An array of strings with maximum 10 blob prefixes to be excluded from the
      inventory.
    fullName: excludePrefix
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'excludePrefix?: any'
      return:
        description: ''
        type: any
  - name: includeBlobVersions
    uid: >-
      @azure/provisioning-storage.types.BlobInventoryPolicyFilterInput.includeBlobVersions
    package: '@azure/provisioning-storage'
    summary: >-
      Includes blob versions in blob inventory when value is set to true. The
      definition.schemaFields values 'VersionId and IsCurrentVersion' are
      required if this property is set to true, else they must be excluded.
    fullName: includeBlobVersions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeBlobVersions?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: includeDeleted
    uid: >-
      @azure/provisioning-storage.types.BlobInventoryPolicyFilterInput.includeDeleted
    package: '@azure/provisioning-storage'
    summary: >-
      For 'Container' definition.objectType the definition.schemaFields must
      include 'Deleted, Version, DeletedTime and RemainingRetentionDays'. For
      'Blob' definition.objectType and HNS enabled storage accounts the
      definition.schemaFields must include 'DeletionId, Deleted, DeletedTime and
      RemainingRetentionDays' and for Hns disabled accounts the
      definition.schemaFields must include 'Deleted and RemainingRetentionDays',
      else it must be excluded.
    fullName: includeDeleted
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeDeleted?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: includeSnapshots
    uid: >-
      @azure/provisioning-storage.types.BlobInventoryPolicyFilterInput.includeSnapshots
    package: '@azure/provisioning-storage'
    summary: >-
      Includes blob snapshots in blob inventory when value is set to true. The
      definition.schemaFields value 'Snapshot' is required if this property is
      set to true, else it must be excluded.
    fullName: includeSnapshots
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeSnapshots?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: prefixMatch
    uid: >-
      @azure/provisioning-storage.types.BlobInventoryPolicyFilterInput.prefixMatch
    package: '@azure/provisioning-storage'
    summary: >-
      An array of strings with maximum 10 blob prefixes to be included in the
      inventory.
    fullName: prefixMatch
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'prefixMatch?: any'
      return:
        description: ''
        type: any
extends: >-
  unknown&lt;<xref
  uid="@azure/provisioning-storage.types.BlobInventoryPolicyFilter" />&gt;
