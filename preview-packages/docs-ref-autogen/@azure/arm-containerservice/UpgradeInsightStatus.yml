### YamlMime:TSTypeAlias
name: UpgradeInsightStatus
uid: '@azure/arm-containerservice.UpgradeInsightStatus'
package: '@azure/arm-containerservice'
summary: >-
  The overall status of an upgrade insight readiness evaluation. This is an
  aggregation of the

  per-issue `severity` values in `detectedIssues`: any `Blocking` issue ⇒
  `Failed`;

  otherwise any `Warning` issue ⇒ `Warning`; otherwise (no issues) ⇒ `Passed`.
  The

  scope-level vocabulary here (Passed/Warning/Failed) intentionally differs from
  the

  issue-level `UpgradeIssueSeverity` (Blocking/Warning): a `Blocking` issue maps
  to

  a `Failed` status, while `Warning` maps through unchanged. \

  [KnownUpgradeInsightStatus](xref:@azure/arm-containerservice.KnownUpgradeInsightStatus)
  can be used interchangeably with UpgradeInsightStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Passed**: The evaluation completed and no upgrade issues were found for the
  target version; the scope appears ready to upgrade. \

  **Warning**: The evaluation found one or more non-blocking warnings; the
  upgrade is expected to succeed but the warnings should be reviewed. \

  **Failed**: The evaluation found one or more blocking issues that will prevent
  the upgrade from completing until they are resolved. This reflects the
  readiness result, not a failure of the compute operation itself (that is
  conveyed by provisioningState).
fullName: UpgradeInsightStatus
remarks: ''
isDeprecated: false
syntax: |
  type UpgradeInsightStatus = string
