### YamlMime:TSTypeAlias
name: TlsInspectionAction
uid: '@azure/arm-networksecurity.TlsInspectionAction'
package: '@azure/arm-networksecurity'
summary: >-
  The TLS inspection action. \

  [KnownTlsInspectionAction](xref:@azure/arm-networksecurity.KnownTlsInspectionAction)
  can be used interchangeably with TlsInspectionAction,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Inspect**: Intercept and decrypt the TLS connection, so policies that read
  the HTTP request apply. \

  **Bypass**: Do not intercept the TLS connection. FQDN filtering still applies,
  using the TLS server name (SNI).
fullName: TlsInspectionAction
remarks: ''
isDeprecated: false
syntax: |
  type TlsInspectionAction = string
