    summary: >-
      The error messages reported for the category. The list is empty when no
      specific errors are available.
    fullName: errorMessageDetails
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'errorMessageDetails: string[]'
      return:
        description: ''
        type: string[]
  - name: readinessPercentage
    uid: '@azure/arm-edgeoperator.SystemReadinessCategory.readinessPercentage'
    package: '@azure/arm-edgeoperator'
    summary: >-
