name: WorkspaceDiscoveryCompleteness
uid: '@azure/arm-chaos.WorkspaceDiscoveryCompleteness'
package: '@azure/arm-chaos'
summary: >-
  The coverage classification of the accepted Azure Resource Manager discovery
  result, independent of operation status and cause. \

  [KnownWorkspaceDiscoveryCompleteness](xref:@azure/arm-chaos.KnownWorkspaceDiscoveryCompleteness)
  can be used interchangeably with WorkspaceDiscoveryCompleteness,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Established**: All attainable expected resource occurrences were classified
  and represented, with no observed shortfall. \

  **BaselineUnknown**: Required work completed without an observed gap, but a
  complete inventory denominator is structurally unavailable. \

  **VerificationIncomplete**: Required system verification did not complete or a
  proven accessible required resource was not represented. \

  **KnownPartial**: Confirmed undelivered obligations remain and no required
  system-verification gap remains.
fullName: WorkspaceDiscoveryCompleteness
