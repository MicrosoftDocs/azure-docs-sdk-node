### YamlMime:TSTypeAlias
name: DeadlineType
uid: '@azure/arm-compute-bulkactions.DeadlineType'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The deadline behavior for a bulk action. \

  [KnownDeadlineType](xref:@azure/arm-compute-bulkactions.KnownDeadlineType) can
  be used interchangeably with DeadlineType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **InitiateAt**: Bulk Actions attempts to start the operation at the specified
  deadline. \

  **CompleteBy**: Bulk Actions attempts to complete the operation by the
  specified deadline.
fullName: DeadlineType
remarks: ''
isDeprecated: false
syntax: |
  type DeadlineType = string
