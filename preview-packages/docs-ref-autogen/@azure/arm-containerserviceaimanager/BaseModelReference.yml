### YamlMime:TSType
name: BaseModelReference
uid: '@azure/arm-containerserviceaimanager.BaseModelReference'
package: '@azure/arm-containerserviceaimanager'
summary: >-
  The base model a custom model was trained from. A HuggingFace repository
  supplied by the user because the platform may lack access to private source
  repositories.
fullName: BaseModelReference
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: config
    uid: '@azure/arm-containerserviceaimanager.BaseModelReference.config'
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      The verbatim `config.json` of the base model, supplied by the user.
      Required if the base model is not publicly accessible on HuggingFace.  For
      more information on CustomAIModel configuration see
      https://aka.ms/aks/aim-customaimodel.
    fullName: config
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'config?: Record<string, any>'
      return:
        description: ''
        type: Record&lt;string, any&gt;
  - name: id
    uid: '@azure/arm-containerserviceaimanager.BaseModelReference.id'
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      The HuggingFace `<org>/<repo>` id of the base model, e.g.
      `meta-llama/Llama-2-7b-chat`. Immutable after creation.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id: string'
      return:
        description: ''
        type: string
  - name: totalWeightSizeBytes
    uid: >-
      @azure/arm-containerserviceaimanager.BaseModelReference.totalWeightSizeBytes
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      The total size of the model weights in bytes. eg `28000000000`. Required
      if the base model is not publicly accessible on HuggingFace.
    fullName: totalWeightSizeBytes
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'totalWeightSizeBytes?: number'
      return:
        description: ''
        type: number
