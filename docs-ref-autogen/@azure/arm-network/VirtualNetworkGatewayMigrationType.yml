### YamlMime:TSTypeAlias
name: VirtualNetworkGatewayMigrationType
uid: '@azure/arm-network.VirtualNetworkGatewayMigrationType'
package: '@azure/arm-network'
summary: >-
  MigrationType for the virtual network gateway. \

  [KnownVirtualNetworkGatewayMigrationType](xref:@azure/arm-network.KnownVirtualNetworkGatewayMigrationType)
  can be used interchangeably with VirtualNetworkGatewayMigrationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **UpgradeDeploymentToStandardIP**: Indicates that it is a migration process
  from basic IP CSES to standard IP VMSS. \

  **UpgradeGatewayToDualStack**: Indicates a migration process to upgrade the
  virtual network gateway to dual stack (IPv4 and IPv6). \

  **MigrateGatewayForPointToSiteProfile**: Indicates a migration process for the
  virtual network gateway's point-to-site profile.
fullName: VirtualNetworkGatewayMigrationType
remarks: ''
isDeprecated: false
syntax: |
  type VirtualNetworkGatewayMigrationType = string
