### YamlMime:TSTypeAlias
name: KnowledgeSourceIngestionPermissionOption
uid: '@azure/search-documents.KnowledgeSourceIngestionPermissionOption'
package: '@azure/search-documents'
summary: >-
  Permission types to ingest together with document content. \

  [KnownKnowledgeSourceIngestionPermissionOption](xref:@azure/search-documents.KnownKnowledgeSourceIngestionPermissionOption)
  can be used interchangeably with KnowledgeSourceIngestionPermissionOption,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **userIds**: Ingest explicit user identifiers alongside document content. \

  **groupIds**: Ingest group identifiers alongside document content. \

  **rbacScope**: Ingest RBAC scope information alongside document content. \

  **oneLakeParentFolders**: Ingest OneLake parent folder paths and enable
  OneLake permission filtering on the generated index. Only supported for
  indexed OneLake knowledge sources. \

  **oneLakeLakehouseId**: Ingest the source item's OneLake lakehouse ID and
  enable OneLake permission filtering on the generated index. Only supported for
  indexed OneLake knowledge sources. \

  **sensitivityLabels**: Ingest Microsoft Purview sensitivity labels alongside
  document content.
fullName: KnowledgeSourceIngestionPermissionOption
remarks: ''
isDeprecated: false
syntax: |
  type KnowledgeSourceIngestionPermissionOption = string
