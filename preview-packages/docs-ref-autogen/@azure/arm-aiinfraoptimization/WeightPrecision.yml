### YamlMime:TSTypeAlias
name: WeightPrecision
uid: '@azure/arm-aiinfraoptimization.WeightPrecision'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  The precision a model's weights are served at. \

  [KnownWeightPrecision](xref:@azure/arm-aiinfraoptimization.KnownWeightPrecision)
  can be used interchangeably with WeightPrecision,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **FP32**: 32-bit floating point. \

  **FP16**: 16-bit floating point. \

  **BF16**: 16-bit brain floating point. \

  **FP8**: 8-bit floating point. \

  **INT8**: 8-bit integer. \

  **INT4**: 4-bit integer. \

  **FP4**: 4-bit floating point.
fullName: WeightPrecision
remarks: ''
isDeprecated: false
syntax: |
  type WeightPrecision = string
