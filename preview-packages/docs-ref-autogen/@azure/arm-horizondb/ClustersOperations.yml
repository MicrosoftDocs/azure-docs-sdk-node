  - name: createOrReplace
    uid: '@azure/arm-horizondb.ClustersOperations.createOrReplace'
    package: '@azure/arm-horizondb'
    summary: >-
      Creates a new HorizonDB cluster or replaces an existing cluster.
      PointInTimeRestore creates the new Cluster resource and hydrates its
      service-owned database storage from an available source backup. It does
      not clone source pools, Pool-scoped endpoints, firewall rules,
      parameter-group associations, or other child resources. The new Cluster
      receives its service-generated Cluster-scoped Endpoint named cluster. For
      restore, postgreSqlVersion must be omitted because the service obtains it
      from backup metadata; all other new-cluster configuration comes from the
      request or service defaults. Same-location restore requires and honors
      pointInTimeUtc and allows creationSourceClusterLocation to be omitted.
      Cross-location restore requires creationSourceClusterLocation to identify
      the source cluster's Azure location and requires pointInTimeUtc, but
      ignores the supplied timestamp and restores the latest available backup.
      Cross-location responses omit pointInTimeUtc.
    fullName: createOrReplace
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        createOrReplace: (resourceGroupName: string, clusterName: string,
        resource: ClusterCreateOrUpdate, options?:
        ClustersCreateOrReplaceOptionalParams) =>
        PollerLike<OperationState<Cluster>, Cluster>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, clusterName: string, resource:
          ClusterCreateOrUpdate, options?:
          ClustersCreateOrReplaceOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;Cluster&gt;, Cluster&gt;
