### YamlMime:TSType
name: HorizonDbClusterDataEncryptionForPatchUpdate
uid: '@azure/arm-horizondb.HorizonDbClusterDataEncryptionForPatchUpdate'
package: '@azure/arm-horizondb'
summary: >-
  Properties for sparsely updating Cluster-level data encryption. Omitted
  properties preserve their current values. Updates can modify settings within
  the existing encryption type, such as the primary Azure Key Vault key URI, but
  switching between SystemManaged and AzureKeyVault after cluster creation is
  not supported. AzureKeyVault encryption is not supported when
  backup.geoRedundancy is Enabled. An update can change only one of
  primaryKeyUri or primaryUserAssignedIdentityId; that update must complete
  before submitting a separate update to change the other property.
fullName: HorizonDbClusterDataEncryptionForPatchUpdate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: primaryKeyUri
    uid: >-
      @azure/arm-horizondb.HorizonDbClusterDataEncryptionForPatchUpdate.primaryKeyUri
    package: '@azure/arm-horizondb'
    summary: >-
      The versionless Azure Key Vault key URI used to encrypt the cluster's
      primary storage. Key version paths are not supported. This property and
      primaryUserAssignedIdentityId cannot both change in the same update; the
      first update must complete before submitting a separate update for the
      other property.
    fullName: primaryKeyUri
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'primaryKeyUri?: string'
      return:
        description: ''
        type: string
  - name: primaryUserAssignedIdentityId
    uid: >-
      @azure/arm-horizondb.HorizonDbClusterDataEncryptionForPatchUpdate.primaryUserAssignedIdentityId
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure resource ID of the user-assigned managed identity used to access
      the primary encryption key. The identity must also be assigned to the
      Cluster through its top-level identity property. This property and
      primaryKeyUri cannot both change in the same update; the first update must
      complete before submitting a separate update for the other property.
    fullName: primaryUserAssignedIdentityId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'primaryUserAssignedIdentityId?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-horizondb.HorizonDbClusterDataEncryptionForPatchUpdate.type'
    package: '@azure/arm-horizondb'
    summary: >-
      The existing data encryption type used by the cluster. PATCH is a sparse
      update, so this property may be omitted. If provided, it must match the
      existing encryption type. This value cannot be changed from SystemManaged
      to AzureKeyVault or from AzureKeyVault to SystemManaged after cluster
      creation.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type?: string'
      return:
        description: ''
        type: string
