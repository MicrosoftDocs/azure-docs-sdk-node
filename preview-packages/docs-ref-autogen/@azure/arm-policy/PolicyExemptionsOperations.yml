      return:
        description: ''
        type: >-
          (scope: string, policyExemptionName: string, parameters:
          PolicyExemptionUpdate, options?: PolicyExemptionsUpdateOptionalParams)
          =&gt; Promise&lt;PolicyExemption&gt;
