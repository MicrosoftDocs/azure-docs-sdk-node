    isDeprecated: false
    syntax:
      content: 'structured_inputs?: Record<string, StructuredInputDefinition>'
      return:
        description: ''
        type: >-
          Record&lt;string, <xref
          uid="@azure/ai-projects.StructuredInputDefinition" />&gt;
    inheritanceDescription: >-
      <b>Inherited From</b>
      [VoiceAgentBaseDefinition.structured_inputs](xref:@azure/ai-projects.VoiceAgentBaseDefinition.structured_inputs)
