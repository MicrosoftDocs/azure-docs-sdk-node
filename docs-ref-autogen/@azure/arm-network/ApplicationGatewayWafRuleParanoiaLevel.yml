summary: >-
  OWASP CRS paranoia level of a managed rule. Applicable only for DRS and OWASP
  rules. \

  [KnownApplicationGatewayWafRuleParanoiaLevel](xref:@azure/arm-network.KnownApplicationGatewayWafRuleParanoiaLevel)
  can be used interchangeably with ApplicationGatewayWafRuleParanoiaLevel,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **PL1**: Baseline detection rules. \

  **PL2**: Adds stricter detection rules. \

  **PL3**: Adds aggressive detection rules. \

  **PL4**: Strictest detection rules.
