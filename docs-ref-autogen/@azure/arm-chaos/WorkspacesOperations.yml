  - name: evaluate
    uid: '@azure/arm-chaos.WorkspacesOperations.evaluate'
    package: '@azure/arm-chaos'
    summary: >-
      Starts evaluation of published scenario-template versions, including when
      the workspace has no scenarios. Acceptance fixes the selected template
      membership and total count, qualified resource snapshot and canonical
      discovery result reference. Without a usable discovery snapshot or valid
      catalog input, the request is rejected synchronously with an Azure error
      and no evaluation result is created. A valid empty catalog completes
      successfully with zero counts and an empty results array. Outcome counts
      reflect processing after acceptance. The initial 202 has no body. Poll the
      operation-bound Location URL until completion: a completed successful or
      partially successful assessment returns the typed result; failed or
      canceled processing returns an Azure error whose target identifies the
      evaluation resource. Ordinary evaluation reads return the current
      resource, including failed or canceled results, while retained.
    fullName: evaluate
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        evaluate: (resourceGroupName: string, workspaceName: string, options?:
        WorkspacesEvaluateOptionalParams) =>
        PollerLike<OperationState<WorkspaceEvaluation>, WorkspaceEvaluation>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, workspaceName: string, options?:
          WorkspacesEvaluateOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;WorkspaceEvaluation&gt;,
          WorkspaceEvaluation&gt;
