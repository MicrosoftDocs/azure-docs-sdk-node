summary: >-
  Properties for updating Microsoft Entra authentication. State Enabled enables
  the feature and State Disabled disables it. Disabling Microsoft Entra
  authentication does not remove or modify database roles or users previously
  created through the MicrosoftEntraAdministrators control-plane API or directly
  through pgaadauth extension functions.
