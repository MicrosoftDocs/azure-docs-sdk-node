### YamlMime:TSType
name: PoolComputeModelForPatchUpdate
uid: '@azure/arm-horizondb.PoolComputeModelForPatchUpdate'
package: '@azure/arm-horizondb'
summary: >-
  The compute model properties of a HorizonDB pool that can be updated. The
  object is recursively mergeable: omitted properties preserve their current
  values. Properties that do not apply to the current or target compute model
  type are rejected. When type changes, the request must include the complete
  target compute model. Subtype-specific constraints are validated against the
  effective merged configuration; invalid requests are rejected without changing
  the resource.
fullName: PoolComputeModelForPatchUpdate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: computeGeneration
    uid: '@azure/arm-horizondb.PoolComputeModelForPatchUpdate.computeGeneration'
    package: '@azure/arm-horizondb'
    summary: >-
      The compute generation for the compute model. Omission preserves the
      current compute generation.
    fullName: computeGeneration
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'computeGeneration?: number'
      return:
        description: ''
        type: number
  - name: computeProcessor
    uid: '@azure/arm-horizondb.PoolComputeModelForPatchUpdate.computeProcessor'
    package: '@azure/arm-horizondb'
    summary: >-
      The processor type for the compute model. Omission preserves the current
      processor type.
    fullName: computeProcessor
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'computeProcessor?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-horizondb.PoolComputeModelForPatchUpdate.type'
    package: '@azure/arm-horizondb'
    summary: >-
      The compute model type. Omit this property to retain the current type.
      Resubmitting the current type succeeds as an idempotent no-op. To change
      the type, supply all common properties and all properties required by the
      target type.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type?: string'
      return:
        description: ''
        type: string
  - name: vCores
    uid: '@azure/arm-horizondb.PoolComputeModelForPatchUpdate.vCores'
    package: '@azure/arm-horizondb'
    summary: >-
      The number of provisioned vCores. Allowed values are 1 through 192. This
      property applies only to a Provisioned compute model. Omission preserves
      the current value.
    fullName: vCores
