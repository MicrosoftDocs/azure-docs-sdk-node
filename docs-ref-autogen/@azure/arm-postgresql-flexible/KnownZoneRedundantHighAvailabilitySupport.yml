uid: '@azure/arm-postgresql-flexible.KnownZoneRedundantHighAvailabilitySupport'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Indicates if high availability with zone redundancy is supported in this
  location. Will be deprecated in the future. Look to Supported Features for 
  'ZoneRedundantHa'.
fullName: KnownZoneRedundantHighAvailabilitySupport
remarks: ''
isDeprecated: false
fields:
  - name: Disabled
    uid: >-
      @azure/arm-postgresql-flexible.KnownZoneRedundantHighAvailabilitySupport.Disabled
    package: '@azure/arm-postgresql-flexible'
    summary: High availability with zone redundancy is not supported.
  - name: Enabled
    uid: >-
      @azure/arm-postgresql-flexible.KnownZoneRedundantHighAvailabilitySupport.Enabled
    package: '@azure/arm-postgresql-flexible'
    summary: High availability with zone redundancy is supported.
