### YamlMime:TSType
name: ConnectorTriggerOptions
uid: '@azure/functions.ConnectorTriggerOptions'
package: '@azure/functions'
summary: ''
fullName: ConnectorTriggerOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: cardinality
    uid: '@azure/functions.ConnectorTriggerOptions.cardinality'
    package: '@azure/functions'
    summary: >-
      Set to `many` to enable batching. If omitted or set to `one`, a single
      event is passed to the function.

      For batches, use an array as the handler's payload type, for example
      `app.connectorTrigger<MyEvent[]>`.
    fullName: cardinality
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cardinality?: "many" | "one"'
      return:
        description: ''
        type: '"many" | "one"'
  - name: connection
    uid: '@azure/functions.ConnectorTriggerOptions.connection'
    package: '@azure/functions'
    summary: The connector connection setting. Required when `deliveryMode` is `Poll`.
    fullName: connection
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'connection?: string'
      return:
        description: ''
        type: string
  - name: deliveryMode
    uid: '@azure/functions.ConnectorTriggerOptions.deliveryMode'
    package: '@azure/functions'
    summary: >-
      The connector event delivery mode. If omitted, the Functions host defaults
      to `Webhook`.
    fullName: deliveryMode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'deliveryMode?: "Poll" | "Webhook"'
      return:
        description: ''
        type: '"Poll" | "Webhook"'
  - name: maxBatchSize
    uid: '@azure/functions.ConnectorTriggerOptions.maxBatchSize'
    package: '@azure/functions'
    summary: >-
      An optional per-function override for the maximum number of events per
      batch.

      If omitted, Poll delivery uses the extension's app-wide host.json default.
    fullName: maxBatchSize
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxBatchSize?: number'
      return:
        description: ''
        type: number
  - name: maxConcurrentCalls
    uid: '@azure/functions.ConnectorTriggerOptions.maxConcurrentCalls'
    package: '@azure/functions'
    summary: >-
      An optional per-function override for the maximum number of concurrent
      single-event invocations.

      If omitted, Poll delivery uses the extension's app-wide host.json default.

      Batched invocations are processed one at a time by the extension.
    fullName: maxConcurrentCalls
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxConcurrentCalls?: number'
      return:
        description: ''
        type: number
  - name: targetPendingEventThreshold
    uid: '@azure/functions.ConnectorTriggerOptions.targetPendingEventThreshold'
    package: '@azure/functions'
    summary: >-
      The target number of pending events per function instance used for
      scaling.
    fullName: targetPendingEventThreshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetPendingEventThreshold?: number'
      return:
        description: ''
        type: number
  - name: triggerConfigName
    uid: '@azure/functions.ConnectorTriggerOptions.triggerConfigName'
    package: '@azure/functions'
    summary: >-
      The connector trigger configuration name. Supports app setting expressions
      such as `%TriggerConfigName%`.

      Required when `deliveryMode` is `Poll`.
    fullName: triggerConfigName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'triggerConfigName?: string'
      return:
        description: ''
        type: string
extends: Record&lt;string, unknown&gt;
