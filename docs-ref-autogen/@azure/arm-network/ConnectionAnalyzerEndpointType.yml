### YamlMime:TSTypeAlias
name: ConnectionAnalyzerEndpointType
uid: '@azure/arm-network.ConnectionAnalyzerEndpointType'
package: '@azure/arm-network'
summary: >-
  The endpoint type for a connection analyzer source or destination. \

  [KnownConnectionAnalyzerEndpointType](xref:@azure/arm-network.KnownConnectionAnalyzerEndpointType)
  can be used interchangeably with ConnectionAnalyzerEndpointType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **VM**: An Azure virtual machine endpoint, identified by its ARM resource ID.
  \

  **VMSS**: An Azure virtual machine scale set (or scale set instance) endpoint,
  identified by its ARM resource ID. \

  **ExternalAddress**: An external endpoint reachable from outside Azure,
  identified by an IP address or FQDN. \

  **BastionHost**: An Azure Bastion host endpoint, identified by its ARM
  resource ID. \

  **ApplicationGateway**: An Application Gateway endpoint, identified by its ARM
  resource ID.
fullName: ConnectionAnalyzerEndpointType
remarks: ''
isDeprecated: false
syntax: |
  type ConnectionAnalyzerEndpointType = string
