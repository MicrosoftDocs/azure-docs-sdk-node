### YamlMime:TSType
name: VirtualMachineDiskProperties
uid: '@azure/arm-compute.VirtualMachineDiskProperties'
package: '@azure/arm-compute'
summary: >-
  Specifies the properties of a managed disk that can be set at the time of
  implicit creation of the disk.
fullName: VirtualMachineDiskProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: availabilityPolicy
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.availabilityPolicy'
    package: '@azure/arm-compute'
    summary: >-
      In the case of an availability or connectivity issue with the disk,
      specify the behavior of your VM.
    fullName: availabilityPolicy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'availabilityPolicy?: DiskAvailabilityPolicy'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute.DiskAvailabilityPolicy" />
  - name: burstingEnabled
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.burstingEnabled'
    package: '@azure/arm-compute'
    summary: >-
      Set to true to enable bursting beyond the provisioned performance target
      of the disk. Bursting is disabled by default. Does not apply to Ultra
      disks.
    fullName: burstingEnabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'burstingEnabled?: boolean'
      return:
        description: ''
        type: boolean
  - name: diskAccessId
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.diskAccessId'
    package: '@azure/arm-compute'
    summary: >-
      Azure resource Id of the DiskAccess resource for using private endpoints
      on disks.
    fullName: diskAccessId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'diskAccessId?: string'
      return:
        description: ''
        type: string
  - name: diskIopsReadOnly
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.diskIopsReadOnly'
    package: '@azure/arm-compute'
    summary: >-
      The total number of IOPS that will be allowed across all VMs mounting the
      shared disk as ReadOnly. One operation can transfer between 4k and 256k
      bytes.
    fullName: diskIopsReadOnly
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'diskIopsReadOnly?: number'
      return:
        description: ''
        type: number
  - name: diskMBpsReadOnly
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.diskMBpsReadOnly'
    package: '@azure/arm-compute'
    summary: >-
      The total throughput (MBps) that will be allowed across all VMs mounting
      the shared disk as ReadOnly. MBps means millions of bytes per second - MB
      here uses the ISO notation, of powers of 10.
    fullName: diskMBpsReadOnly
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'diskMBpsReadOnly?: number'
      return:
        description: ''
        type: number
  - name: logicalSectorSize
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.logicalSectorSize'
    package: '@azure/arm-compute'
    summary: >-
      Logical sector size in bytes for Ultra Disks. Supported values are 512 and
      4096. 4096 is the default.
    fullName: logicalSectorSize
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'logicalSectorSize?: number'
      return:
        description: ''
        type: number
  - name: maxShares
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.maxShares'
    package: '@azure/arm-compute'
    summary: >-
      The maximum number of VMs that can attach to the disk at the same time.
      Value greater than one indicates a disk that can be mounted on multiple
      VMs at the same time. Applies to data disks only.
    fullName: maxShares
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxShares?: number'
      return:
        description: ''
        type: number
  - name: networkAccessPolicy
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.networkAccessPolicy'
    package: '@azure/arm-compute'
    summary: Policy for accessing the disk via network.
    fullName: networkAccessPolicy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'networkAccessPolicy?: string'
      return:
        description: ''
        type: string
  - name: optimizedForFrequentAttach
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.optimizedForFrequentAttach'
    package: '@azure/arm-compute'
    summary: >-
      Setting this property to true improves reliability and performance of data
      disks that are frequently (more than 5 times a day) detached from one
      virtual machine and attached to another. This property should not be set
      for disks that are not detached and attached frequently as it causes the
      disks to not align with the fault domain of the virtual machine.
    fullName: optimizedForFrequentAttach
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'optimizedForFrequentAttach?: boolean'
      return:
        description: ''
        type: boolean
  - name: performancePlus
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.performancePlus'
    package: '@azure/arm-compute'
    summary: >-
      Set this flag to true to get a boost on the performance target of the disk
      deployed. This flag can only be set on disk creation time and cannot be
      disabled after enabled.
    fullName: performancePlus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'performancePlus?: boolean'
      return:
        description: ''
        type: boolean
  - name: tier
    uid: '@azure/arm-compute.VirtualMachineDiskProperties.tier'
    package: '@azure/arm-compute'
    summary: >-
      Performance tier of the disk (e.g., P4, S10) as described here:
      https://azure.microsoft.com/en-us/pricing/details/managed-disks/. Does not
      apply to Ultra disks.
    fullName: tier
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tier?: string'
      return:
        description: ''
        type: string
