### YamlMime:TSType
name: VoiceAgentAudioOutputConfig
uid: '@azure/ai-projects.VoiceAgentAudioOutputConfig'
package: '@azure/ai-projects'
summary: >-
  Output audio configuration for a voice agent.

  Provider-specific fields are selected by `voice_type`:

  - `openai`: `voice` and `speed`.

  - `azure-standard`: `voice`, `voice_locale`, `speed`, `voice_temperature`,
  `custom_lexicon_url`,
    `custom_text_normalization_url`, `prefer_locales`, `style`, `pitch`, and `volume`.
  - `azure-custom`: all `azure-standard` fields except `style`, plus
  `custom_voice_endpoint_id`.

  - `azure-personal`: all `azure-standard` fields except `style`, plus
  `personal_voice_model`.

  - `avatar-voice-sync`: all `azure-standard` fields except `voice` and `style`,
  plus `personal_voice_model`; the voice name is derived from the avatar.

  - `azure-realtime-native`: `voice` and `speed`.

  `format` and `output_audio_timestamp_types` apply to every voice type.
fullName: VoiceAgentAudioOutputConfig
remarks: ''
isDeprecated: false
type: interface
