name: CapacityReservationType
uid: '@azure/arm-compute.CapacityReservationType'
package: '@azure/arm-compute'
summary: >-
  Specifies which type of capacity reservation the virtual machine will consume
  capacity from if eligible or whether it is explicitly opted out from being
  associated and consuming capacity from any reserved capacity available in the
  subscription. Minimum api-version: 2026-04-01. \

  [KnownCapacityReservationType](xref:@azure/arm-compute.KnownCapacityReservationType)
  can be used interchangeably with CapacityReservationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotEligible**: The virtual machine is not eligible to be implicitly
  associated with an open capacity reservation and is not explicitly associated
  with any capacity reservation group, so it will consume capacity from the
  publicly available capacity. \

  **Targeted**: The virtual machine will consume capacity from a specific
  matching capacity reservation when associated with a capacity reservation
  group resource of type targeted, but can fall back to consume capacity from
  the publicly available capacity if there is no capacity available in the
  targeted reservation. \

  **Open**: The virtual machine if eligible will implicitly associate and
  consume any available capacity from a matching open capacity reservation
  created or shared in the subscription. **Note:** The VM should not be
  explicitly associated with the open capacity reservation group resource
  containing the matching reservation. \

  **Disabled**: The virtual machine has capacity reservation assignment disabled
  and will not be allowed to implicitly or explicitly associate with any type of
  capacity reservation. \

  **Block**: The virtual machine consumes capacity from a specific matching
  capacity reservation when associated with a capacity reservation group
  resource of type block, and will hit capacity failures if there is no
  available capacity in the block reservation.
fullName: CapacityReservationType
remarks: ''
isDeprecated: false
syntax: |
  type CapacityReservationType = string
