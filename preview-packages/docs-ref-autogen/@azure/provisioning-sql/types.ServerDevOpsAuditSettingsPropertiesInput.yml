        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: storageEndpoint
    uid: >-
      @azure/provisioning-sql.types.ServerDevOpsAuditSettingsPropertiesInput.storageEndpoint
