properties:
  - name: managedBy
    uid: '@azure/arm-containerservice.AgentFabricMembership.managedBy'
    package: '@azure/arm-containerservice'
    summary: >-
      Resource ID of the AgentFabric that this cluster is a member of. The
      AgentFabric must be in the same tenant and subscription as the managed
      cluster. As the ARM envelope property, it also stops a complete mode
      deployment from deleting the membership and silently detaching the
      cluster.
    fullName: managedBy
