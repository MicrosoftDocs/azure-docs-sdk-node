### YamlMime:TSTypeAlias
name: AlertConfigurationMode
uid: '@azure/arm-containerservice.AlertConfigurationMode'
package: '@azure/arm-containerservice'
summary: >-
  The mode of the alert configuration. \

  [KnownAlertConfigurationMode](xref:@azure/arm-containerservice.KnownAlertConfigurationMode)
  can be used interchangeably with AlertConfigurationMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: Alerts are disabled. \

  **Managed**: AKS manages the alerts lifecycle including creation, updates, and
  deletion.

  Users receive alerts through the configured notification channel.
fullName: AlertConfigurationMode
