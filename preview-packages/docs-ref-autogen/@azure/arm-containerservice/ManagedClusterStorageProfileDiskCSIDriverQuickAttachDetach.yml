  - name: identity
    uid: >-
      @azure/arm-containerservice.ManagedClusterStorageProfileDiskCSIDriverQuickAttachDetach.identity
    package: '@azure/arm-containerservice'
    summary: >-
      Identity used by Quick Attach Detach. This property is returned by GET and
      cannot be set by clients. The Quick Attach Detach feature uses a managed
      identity that is automatically created and managed by the AKS resource
      provider. In most scenarios, no user action is required. An exception
      applies when using customer-managed disks that are located outside of the
      AKS node resource group (Bring Your Own Disk scenario). In this case,
      users must grant the Quick Attach Detach managed identity the required
      permissions on the resource group containing the disk.
    fullName: identity
