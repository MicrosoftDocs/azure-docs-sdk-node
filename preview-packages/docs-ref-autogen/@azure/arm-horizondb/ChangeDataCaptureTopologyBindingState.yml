name: ChangeDataCaptureTopologyBindingState
uid: '@azure/arm-horizondb.ChangeDataCaptureTopologyBindingState'
package: '@azure/arm-horizondb'
summary: >-
  The relationship of a change data capture configuration to the current writer
  topology. \

  [KnownChangeDataCaptureTopologyBindingState](xref:@azure/arm-horizondb.KnownChangeDataCaptureTopologyBindingState)
  can be used interchangeably with ChangeDataCaptureTopologyBindingState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Active**: The configuration belongs to the current active writer. \

  **Reconciling**: The service is reconciling the configuration after a writer
  change. \

  **RebindRequired**: The destination session must bind to a replacement
  configuration resource ID. \

  **Superseded**: The configuration belongs to a former writer and has been
  replaced. \

  **Conflict**: Equivalent change data capture state could not be materialized
  without overwriting unrelated state.
fullName: ChangeDataCaptureTopologyBindingState
remarks: ''
isDeprecated: false
