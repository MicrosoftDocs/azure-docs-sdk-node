    summary: >-
      The SPIFFE ID that identifies this member's workload identity,
      system-assigned by the service

      at creation time. It takes the form
      `spiffe://<trustDomain>/<agentFabricName>/<memberName>`,

      using the owning fabric's trust domain (or the default
      `microsoft.agentfabric` when unset), with

      all segments lower-cased to conform to the SPIFFE ID scheme. Read-only.
