### YamlMime:TSEnum
name: KnownAggregationType
uid: '@azure/arm-cloudhealth.KnownAggregationType'
package: '@azure/arm-cloudhealth'
summary: Aggregation strategy for combining a set of health states into one.
fullName: KnownAggregationType
remarks: ''
isDeprecated: false
fields:
  - name: BestOf
    uid: '@azure/arm-cloudhealth.KnownAggregationType.BestOf'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Best (least severe) health state across the non-Unknown members is
      propagated. Unknown members are excluded from the selection; if every
      member is Unknown the group resolves to Unknown. The 'ignoreUnknown' flag
      has no observable effect for this strategy and is documented as such.
  - name: MaxNotHealthy
    uid: '@azure/arm-cloudhealth.KnownAggregationType.MaxNotHealthy'
    package: '@azure/arm-cloudhealth'
    summary: >-
      Healthy if the count/percentage of not-healthy members stays below the
      threshold.
  - name: MinHealthy
    uid: '@azure/arm-cloudhealth.KnownAggregationType.MinHealthy'
    package: '@azure/arm-cloudhealth'
    summary: Healthy if the count/percentage of healthy members meets the threshold.
  - name: WorstOf
    uid: '@azure/arm-cloudhealth.KnownAggregationType.WorstOf'
    package: '@azure/arm-cloudhealth'
    summary: Worst health state across members is propagated. Default behavior.
