### YamlMime:TSTypeAlias
name: ComplianceLockStatus
uid: '@azure/arm-commvaultcontentstore.ComplianceLockStatus'
package: '@azure/arm-commvaultcontentstore'
summary: >-
  Compliance lock status of a Commvault Storage. \

  [KnownComplianceLockStatus](xref:@azure/arm-commvaultcontentstore.KnownComplianceLockStatus)
  can be used interchangeably with ComplianceLockStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Compliance lock is enabled — storage is protected. \

  **DisablementPending**: Disablement is pending multi-person authorization
  (MPA) approval. Status transitions to 'Disabled' once approved. \

  **Disabled**: Compliance lock is disabled.
fullName: ComplianceLockStatus
remarks: ''
isDeprecated: false
syntax: |
  type ComplianceLockStatus = string
