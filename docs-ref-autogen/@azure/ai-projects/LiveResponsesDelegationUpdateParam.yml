### YamlMime:TSType
name: LiveResponsesDelegationUpdateParam
uid: '@azure/ai-projects.LiveResponsesDelegationUpdateParam'
package: '@azure/ai-projects'
summary: >-
  Update the Responses backend for an existing Live session without changing
  delegation ownership.
fullName: LiveResponsesDelegationUpdateParam
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: acknowledgement_delay_ms
    uid: >-
      @azure/ai-projects.LiveResponsesDelegationUpdateParam.acknowledgement_delay_ms
    package: '@azure/ai-projects'
    summary: >-
      Milliseconds to wait before requesting an automatic spoken acknowledgement
      for a delegation. The model may still speak before this delay. Any
      commentary or thinking appended to the session cancels all pending
      acknowledgements, including those for other delegations. Defaults to 400
      for Decisions sessions and 0 (request immediately) for other sessions.
      Omission in a session update preserves the current value. Updates apply to
      subsequent delegations.
    fullName: acknowledgement_delay_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'acknowledgement_delay_ms?: number'
      return:
        description: ''
        type: number
  - name: responses
    uid: '@azure/ai-projects.LiveResponsesDelegationUpdateParam.responses'
    package: '@azure/ai-projects'
    summary: >-
      Responses backend settings to update. Omitted settings keep their existing
      values.
    fullName: responses
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'responses?: LiveResponsesDelegationSettingsUpdateInputParam'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/ai-projects.LiveResponsesDelegationSettingsUpdateInputParam"
          />
  - name: type
    uid: '@azure/ai-projects.LiveResponsesDelegationUpdateParam.type'
    package: '@azure/ai-projects'
    summary: >-
      The delegation owner. Always `responses` for tasks handled by the
      Responses API.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "responses"'
      return:
        description: ''
        type: '"responses"'
extends: <xref uid="@azure/ai-projects.LiveSessionUpdateParamsDelegation" />
