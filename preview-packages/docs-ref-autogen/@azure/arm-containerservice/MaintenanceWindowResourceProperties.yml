### YamlMime:TSType
name: MaintenanceWindowResourceProperties
uid: '@azure/arm-containerservice.MaintenanceWindowResourceProperties'
package: '@azure/arm-containerservice'
summary: |-
  Properties of a maintenance window.
  For more information, see https://aka.ms/aks/maintenance-windows.
fullName: MaintenanceWindowResourceProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: durationHours
    uid: >-
      @azure/arm-containerservice.MaintenanceWindowResourceProperties.durationHours
    package: '@azure/arm-containerservice'
    summary: Length of the maintenance window in hours.
    fullName: durationHours
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'durationHours: number'
      return:
        description: ''
        type: number
  - name: notAllowedDates
    uid: >-
      @azure/arm-containerservice.MaintenanceWindowResourceProperties.notAllowedDates
    package: '@azure/arm-containerservice'
    summary: >-
      Date ranges during which maintenance is not allowed. 'utcOffset' applies
      to

      these dates. For example, with 'utcOffset: +02:00' and a date span of

      '2026-12-23' to '2027-01-03', maintenance will be blocked from

      '2026-12-22 22:00' to '2027-01-03 22:00' in UTC time.
    fullName: notAllowedDates
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'notAllowedDates?: DateSpan[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.DateSpan" />[]
  - name: provisioningState
    uid: >-
      @azure/arm-containerservice.MaintenanceWindowResourceProperties.provisioningState
    package: '@azure/arm-containerservice'
    summary: The provisioning state of the maintenance window.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: schedule
    uid: '@azure/arm-containerservice.MaintenanceWindowResourceProperties.schedule'
    package: '@azure/arm-containerservice'
    summary: >-
      Recurrence schedule for the maintenance window. One and only one of the
      schedule

      types should be specified: 'daily', 'weekly', 'absoluteMonthly', or
      'relativeMonthly'.
    fullName: schedule
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'schedule: Schedule'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.Schedule" />
  - name: startDate
    uid: '@azure/arm-containerservice.MaintenanceWindowResourceProperties.startDate'
    package: '@azure/arm-containerservice'
    summary: >-
      The date the maintenance window activates. If the current date is before
      this

      date, the maintenance window is inactive and will not be used. If not
      specified,

      the maintenance window will be active right away.
    fullName: startDate
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'startDate?: Date'
      return:
        description: ''
        type: Date
  - name: startTime
    uid: '@azure/arm-containerservice.MaintenanceWindowResourceProperties.startTime'
    package: '@azure/arm-containerservice'
    summary: >-
      The start time of the maintenance window. Accepted values are from '00:00'
      to

      '23:59'. 'utcOffset' applies to this field. For example: '02:00' with

      'utcOffset: +02:00' means UTC time '00:00'.
    fullName: startTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'startTime: string'
      return:
        description: ''
        type: string
  - name: utcOffset
    uid: '@azure/arm-containerservice.MaintenanceWindowResourceProperties.utcOffset'
    package: '@azure/arm-containerservice'
    summary: >-
      The UTC offset in format +/-HH:mm. For example, '+05:30' for IST and
      '-07:00'

      for PST. If not specified, the default is '+00:00'.

      Note: this is a static offset and does not adjust for Daylight Saving
      Time.

      Customers in DST-observing regions should pick the offset that matches
      their

      preferred wall-clock time year-round; the maintenance window will shift by
      one

      hour relative to local time when DST starts or ends.
    fullName: utcOffset
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'utcOffset?: string'
      return:
        description: ''
        type: string
