### YamlMime:TSType
name: CloudShellNetworkProfile
uid: '@azure/arm-containerservice.CloudShellNetworkProfile'
package: '@azure/arm-containerservice'
summary: >-
  Network resources used by Cloud Shell. AKS peers the subnet's virtual network
  with the cluster virtual network.

  For Custom resources, their address spaces must not overlap. See
  https://aka.ms/aks/CloudShellConnect.
fullName: CloudShellNetworkProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: relayNamespaceId
    uid: '@azure/arm-containerservice.CloudShellNetworkProfile.relayNamespaceId'
    package: '@azure/arm-containerservice'
    summary: >-
      Azure Relay namespace used by Cloud Shell. For Custom networking, this
      existing namespace is required

      with subnetId. Grant the cluster identity Reader and the Azure Container
      Instance service principal Contributor

      on the namespace. Required when Cloud Shell mode is Custom.
    fullName: relayNamespaceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'relayNamespaceId?: string'
      return:
        description: ''
        type: string
  - name: subnetId
    uid: '@azure/arm-containerservice.CloudShellNetworkProfile.subnetId'
    package: '@azure/arm-containerservice'
    summary: >-
      Dedicated IPv4 subnet used by Cloud Shell containers. For Custom
      networking, this subnet must be

      delegated to Microsoft.ContainerInstance/containerGroups and be /24 or
      larger. Grant the cluster identity

      Network Contributor on the containing virtual network and grant the Azure
      Container Instance service principal

      Network Contributor on this subnet or its containing virtual network.
      Required when Cloud Shell mode is Custom.
    fullName: subnetId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'subnetId?: string'
      return:
        description: ''
        type: string
