### YamlMime:TSEnum
name: KnownReservationState
uid: '@azure/arm-compute.KnownReservationState'
package: '@azure/arm-compute'
summary: The current state of a Future capacity reservation.
fullName: KnownReservationState
remarks: ''
isDeprecated: false
fields:
  - name: Approved
    uid: '@azure/arm-compute.KnownReservationState.Approved'
    package: '@azure/arm-compute'
    summary: >-
      The capacity reservation request has been approved by Azure and is
      awaiting fulfillment.
  - name: Committed
    uid: '@azure/arm-compute.KnownReservationState.Committed'
    package: '@azure/arm-compute'
    summary: >-
      The capacity reservation is locked and cannot be updated or deleted prior
      to going live.
  - name: Declined
    uid: '@azure/arm-compute.KnownReservationState.Declined'
    package: '@azure/arm-compute'
    summary: >-
      The capacity reservation request was rejected, and will not change again
      without user action.
  - name: FulfillmentFailed
    uid: '@azure/arm-compute.KnownReservationState.FulfillmentFailed'
    package: '@azure/arm-compute'
    summary: >-
      A failure occurred while attempting to fulfill the capacity reservation
      request.
  - name: Live
    uid: '@azure/arm-compute.KnownReservationState.Live'
    package: '@azure/arm-compute'
    summary: >-
      The capacity reservation is active and available for use, and cannot be
      modified or deleted until the minimum commitment period has elapsed.
  - name: PartiallyFulfilled
    uid: '@azure/arm-compute.KnownReservationState.PartiallyFulfilled'
    package: '@azure/arm-compute'
    summary: >-
      Azure was only able to deliver a portion of the requested capacity. The
      capacity reservation cannot be modified or deleted until the minimum
      commitment period has elapsed. The portion of fulfilled capacity can be
      viewed by inspecting the capacity reservation's instance view, displayed
      as currentCapacity within the utilizationInfo.
  - name: Pending
    uid: '@azure/arm-compute.KnownReservationState.Pending'
    package: '@azure/arm-compute'
    summary: >-
      The capacity reservation request has been submitted and is awaiting
      evaluation.
