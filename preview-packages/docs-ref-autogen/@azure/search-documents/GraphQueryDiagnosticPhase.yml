name: GraphQueryDiagnosticPhase
uid: '@azure/search-documents.GraphQueryDiagnosticPhase'
package: '@azure/search-documents'
summary: >-
  The stage that produced a graph query diagnostic. \

  [KnownGraphQueryDiagnosticPhase](xref:@azure/search-documents.KnownGraphQueryDiagnosticPhase)
  can be used interchangeably with GraphQueryDiagnosticPhase,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **parse**: Query syntax and parsing. \

  **bind**: Variable, parameter, function, and semantic binding. \

  **validation**: Request-option validation. \

  **planning**: Query planning, including unsupported query shapes and
  query-breadth restrictions. \

  **execution**: Runtime evaluation, execution-limit warnings, and execution
  summaries.
