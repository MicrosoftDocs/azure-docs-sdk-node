### YamlMime:TSTypeAlias
name: FipsMode
uid: '@azure/arm-postgresql-flexible.FipsMode'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Indicates if FIPS (Federal Information Processing Standards) mode is enabled
  on the server. \

  [KnownFipsMode](xref:@azure/arm-postgresql-flexible.KnownFipsMode) can be used
  interchangeably with FipsMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: FIPS mode is enabled on the server. \

  **Disabled**: FIPS mode is disabled on the server.
fullName: FipsMode
remarks: ''
isDeprecated: false
syntax: |
  type FipsMode = string
