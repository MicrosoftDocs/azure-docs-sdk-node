name: ConnectionLifecycleState
uid: '@azure/arm-oracledatabase.ConnectionLifecycleState'
package: '@azure/arm-oracledatabase'
summary: >-
  Possible lifecycle states for connection. \

  [KnownConnectionLifecycleState](xref:@azure/arm-oracledatabase.KnownConnectionLifecycleState)
  can be used interchangeably with ConnectionLifecycleState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **CREATING**: Indicates that the resource is in creating state. \

  **UPDATING**: Indicates that the resource is in updating state. \

  **ACTIVE**: Indicates that the resource is in active state. \

  **DELETING**: Indicates that the resource is in deleting state. \

  **DELETED**: Indicates that the resource is in deleted state. \

  **FAILED**: Indicates that the resource is in failed state.
fullName: ConnectionLifecycleState
remarks: ''
isDeprecated: false
syntax: |
  type ConnectionLifecycleState = string
