properties:
  - name: createOrUpdate
    uid: '@azure/arm-policy.PolicyExemptionsOperations.createOrUpdate'
    package: '@azure/arm-policy'
    summary: >-
      This operation creates or updates a policy exemption with the given scope
      and name. Policy exemptions apply to all resources contained within their
      scope. For example, when you create a policy exemption at resource group
      scope for a policy assignment at the same or above level, the exemption
      exempts to all applicable resources in the resource group.
    fullName: createOrUpdate
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        createOrUpdate: (scope: string, policyExemptionName: string, parameters:
        PolicyExemption, options?: PolicyExemptionsCreateOrUpdateOptionalParams)
        => Promise<PolicyExemption>
      return:
        description: ''
        type: >-
          (scope: string, policyExemptionName: string, parameters:
          PolicyExemption, options?:
          PolicyExemptionsCreateOrUpdateOptionalParams) =&gt;
          Promise&lt;PolicyExemption&gt;
  - name: delete
    uid: '@azure/arm-policy.PolicyExemptionsOperations.delete'
    package: '@azure/arm-policy'
    summary: >-
      This operation deletes a policy exemption, given its name and the scope it
      was created in. The scope of a policy exemption is the part of its ID
      preceding
      '/providers/Microsoft.Authorization/policyExemptions/{policyExemptionName}'.
    fullName: delete
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        delete: (scope: string, policyExemptionName: string, options?:
        PolicyExemptionsDeleteOptionalParams) => Promise<void>
      return:
        description: ''
        type: >-
          (scope: string, policyExemptionName: string, options?:
          PolicyExemptionsDeleteOptionalParams) =&gt; Promise&lt;void&gt;
  - name: get
    uid: '@azure/arm-policy.PolicyExemptionsOperations.get'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves a single policy exemption, given its name and the
      scope it was created at.
    fullName: get
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        get: (scope: string, policyExemptionName: string, options?:
        PolicyExemptionsGetOptionalParams) => Promise<PolicyExemption>
      return:
        description: ''
        type: >-
          (scope: string, policyExemptionName: string, options?:
          PolicyExemptionsGetOptionalParams) =&gt;
          Promise&lt;PolicyExemption&gt;
  - name: list
    uid: '@azure/arm-policy.PolicyExemptionsOperations.list'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy exemptions associated with
      the given subscription that match the optional given $filter. Valid values
      for $filter are: 'atScope()', 'atExactScope()', 'excludeExpired()' or
      'policyAssignmentId eq '{value}''. If $filter is not provided, the
      unfiltered list includes all policy exemptions associated with the
      subscription, including those that apply directly or from management
      groups that contain the given subscription, as well as any applied to
      objects contained within the subscription.
    fullName: list
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        list: (options?: PolicyExemptionsListOptionalParams) =>
        PagedAsyncIterableIterator<PolicyExemption, PolicyExemption[],
        PageSettings>
      return:
        description: ''
        type: >-
          (options?: PolicyExemptionsListOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;PolicyExemption, PolicyExemption[],
          PageSettings&gt;
  - name: listForManagementGroup
    uid: '@azure/arm-policy.PolicyExemptionsOperations.listForManagementGroup'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy exemptions applicable to
      the management group that match the given $filter. Valid values for
      $filter are: 'atScope()', 'atExactScope()', 'excludeExpired()' or
      'policyAssignmentId eq '{value}''. If $filter=atScope() is provided, the
      returned list includes all policy exemptions that are assigned to the
      management group or the management group's ancestors.
    fullName: listForManagementGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        listForManagementGroup: (managementGroupId: string, options?:
        PolicyExemptionsListForManagementGroupOptionalParams) =>
        PagedAsyncIterableIterator<PolicyExemption, PolicyExemption[],
        PageSettings>
      return:
        description: ''
        type: >-
          (managementGroupId: string, options?:
          PolicyExemptionsListForManagementGroupOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;PolicyExemption, PolicyExemption[],
          PageSettings&gt;
  - name: listForResource
    uid: '@azure/arm-policy.PolicyExemptionsOperations.listForResource'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy exemptions associated with
      the specified resource in the given resource group and subscription that
      match the optional given $filter. Valid values for $filter are:
      'atScope()', 'atExactScope()', 'excludeExpired()' or 'policyAssignmentId
      eq '{value}''. If $filter is not provided, the unfiltered list includes
      all policy exemptions associated with the resource, including those that
      apply directly or from all containing scopes, as well as any applied to
      resources contained within the resource. Three parameters plus the
      resource name are used to identify a specific resource. If the resource is
      not part of a parent resource (the more common case), the parent resource
      path should not be provided (or provided as ''). For example a web app
      could be specified as ({resourceProviderNamespace} == 'Microsoft.Web',
      {parentResourcePath} == '', {resourceType} == 'sites', {resourceName} ==
      'MyWebApp'). If the resource is part of a parent resource, then all
      parameters should be provided. For example a virtual machine DNS name
      could be specified as ({resourceProviderNamespace} == 'Microsoft.Compute',
      {parentResourcePath} == 'virtualMachines/MyVirtualMachine', {resourceType}
      == 'domainNames', {resourceName} == 'MyComputerName'). A convenient
      alternative to providing the namespace and type name separately is to
      provide both in the {resourceType} parameter, format:
      ({resourceProviderNamespace} == '', {parentResourcePath} == '',
      {resourceType} == 'Microsoft.Web/sites', {resourceName} == 'MyWebApp').
    fullName: listForResource
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        listForResource: (resourceGroupName: string, resourceProviderNamespace:
        string, parentResourcePath: string, resourceType: string, resourceName:
        string, options?: PolicyExemptionsListForResourceOptionalParams) =>
        PagedAsyncIterableIterator<PolicyExemption, PolicyExemption[],
        PageSettings>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, resourceProviderNamespace: string,
          parentResourcePath: string, resourceType: string, resourceName:
          string, options?: PolicyExemptionsListForResourceOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;PolicyExemption, PolicyExemption[],
          PageSettings&gt;
  - name: listForResourceGroup
    uid: '@azure/arm-policy.PolicyExemptionsOperations.listForResourceGroup'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy exemptions associated with
      the given resource group in the given subscription that match the optional
      given $filter. Valid values for $filter are: 'atScope()',
      'atExactScope()', 'excludeExpired()' or 'policyAssignmentId eq '{value}''.
      If $filter is not provided, the unfiltered list includes all policy
      exemptions associated with the resource group, including those that apply
      directly or apply from containing scopes, as well as any applied to
      resources contained within the resource group.
    fullName: listForResourceGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        listForResourceGroup: (resourceGroupName: string, options?:
        PolicyExemptionsListForResourceGroupOptionalParams) =>
        PagedAsyncIterableIterator<PolicyExemption, PolicyExemption[],
        PageSettings>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, options?:
          PolicyExemptionsListForResourceGroupOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;PolicyExemption, PolicyExemption[],
          PageSettings&gt;
