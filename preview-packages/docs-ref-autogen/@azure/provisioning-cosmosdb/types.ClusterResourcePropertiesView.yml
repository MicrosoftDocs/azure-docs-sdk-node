    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.delegatedManagementSubnetId
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      Resource id of a subnet that this cluster's management service should have
      its network interface attached to. The subnet must be routable to all
      subnets that will be delegated to data centers. The resource id must be of
      the form '/subscriptions/<subscription id>/resourceGroups/<resource
      group>/providers/Microsoft.Network/virtualNetworks/<virtual
      network>/subnets/<subnet>'
    fullName: delegatedManagementSubnetId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delegatedManagementSubnetId?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: extensions
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.extensions
    package: '@azure/provisioning-cosmosdb'
    summary: Extensions to be added or updated on cluster.
    fullName: extensions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'extensions?: any'
      return:
        description: ''
        type: any
  - name: externalDataCenters
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.externalDataCenters
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      List of the data center names for unmanaged data centers in this cluster
      to be included in auto-replication.
    fullName: externalDataCenters
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'externalDataCenters?: any'
      return:
        description: ''
        type: any
  - name: externalGossipCertificates
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.externalGossipCertificates
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      List of TLS certificates used to authorize gossip from unmanaged data
