name: PartialFulfillmentMode
uid: '@azure/arm-compute-bulkactions.PartialFulfillmentMode'
package: '@azure/arm-compute-bulkactions'
summary: >-
  Whether the service may launch fewer instances than requested when the full
  capacity cannot be satisfied. \

  [KnownPartialFulfillmentMode](xref:@azure/arm-compute-bulkactions.KnownPartialFulfillmentMode)
  can be used interchangeably with PartialFulfillmentMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Partial fulfillment is allowed. \

  **Disabled**: Partial fulfillment is not allowed.
fullName: PartialFulfillmentMode
remarks: ''
isDeprecated: false
syntax: |
  type PartialFulfillmentMode = string
