### YamlMime:TSTypeAlias
name: McpPolicyDestinationType
uid: '@azure/arm-networksecurity.McpPolicyDestinationType'
package: '@azure/arm-networksecurity'
summary: >-
  The type of destination selector for an MCP policy. \

  [KnownMcpPolicyDestinationType](xref:@azure/arm-networksecurity.KnownMcpPolicyDestinationType)
  can be used interchangeably with McpPolicyDestinationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **WorkloadIdPatterns**: Select destinations by workload ID patterns. \

  **AddressPrefixes**: Select destinations by IP address prefixes in CIDR
  notation. \

  **Fqdns**: Select destinations by fully qualified domain names.
fullName: McpPolicyDestinationType
remarks: ''
isDeprecated: false
syntax: |
  type McpPolicyDestinationType = string
