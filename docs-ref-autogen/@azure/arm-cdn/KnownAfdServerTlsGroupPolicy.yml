name: KnownAfdServerTlsGroupPolicy
uid: '@azure/arm-cdn.KnownAfdServerTlsGroupPolicy'
package: '@azure/arm-cdn'
summary: >-
  Server TLS group policy that will be used for Https. Standard and Enhanced are
  service-managed sets; Custom allows specifying serverTlsGroups explicitly.
fullName: KnownAfdServerTlsGroupPolicy
remarks: ''
isDeprecated: false
fields:
  - name: Custom
    uid: '@azure/arm-cdn.KnownAfdServerTlsGroupPolicy.Custom'
    package: '@azure/arm-cdn'
    summary: Uses the server TLS groups specified by serverTlsGroups.
  - name: Enhanced
    uid: '@azure/arm-cdn.KnownAfdServerTlsGroupPolicy.Enhanced'
    package: '@azure/arm-cdn'
    summary: Uses the enhanced service-managed set of server TLS groups.
  - name: Standard
    uid: '@azure/arm-cdn.KnownAfdServerTlsGroupPolicy.Standard'
    package: '@azure/arm-cdn'
    summary: Uses the standard service-managed set of server TLS groups.
