  - name: approveOrReject
    uid: '@azure/arm-horizondb.PrivateEndpointConnectionsOperations.approveOrReject'
    package: '@azure/arm-horizondb'
    summary: >-
      Approves or rejects an existing private endpoint connection. Approval
      requires the parent Cluster to contain at least one Pool. An approval
      attempt when the Cluster has no Pools fails with 409 Conflict and the
      stable error code PrivateEndpointRequiresPool. Rejection remains allowed
      when the Cluster has no Pools so that existing connections can be cleaned
      up.
    fullName: approveOrReject
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        approveOrReject: (resourceGroupName: string, clusterName: string,
        privateEndpointConnectionName: string, resource:
        PrivateEndpointConnectionResourceCreateOrUpdate, options?:
        PrivateEndpointConnectionsApproveOrRejectOptionalParams) =>
