### YamlMime:TSTypeAlias
name: NeuroShieldMitigationStatus
uid: '@azure/arm-networksecurity.NeuroShieldMitigationStatus'
package: '@azure/arm-networksecurity'
summary: >-
  Runtime operational status for mitigations. \

  [KnownNeuroShieldMitigationStatus](xref:@azure/arm-networksecurity.KnownNeuroShieldMitigationStatus)
  can be used interchangeably with NeuroShieldMitigationStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Queued**: Mitigation is queued for execution. \

  **AwaitingApproval**: Mitigation is waiting for explicit approval. \

  **InProgress**: Mitigation execution is in progress. \

  **Succeeded**: Mitigation completed successfully. \

  **Skipped**: Mitigation was not applied because validation determined it was
  unnecessary. \

  **Failed**: Mitigation execution failed. \

  **RollbackInProgress**: Rollback execution is in progress. \

  **RolledBack**: Mitigation rollback completed successfully. \

  **RollbackFailed**: Mitigation rollback failed.
fullName: NeuroShieldMitigationStatus
remarks: ''
isDeprecated: false
syntax: |
  type NeuroShieldMitigationStatus = string
