name: SummaryLogsIdentityType
uid: '@azure/provisioning-operationalinsights.types.SummaryLogsIdentityType'
package: '@azure/provisioning-operationalinsights'
summary: >-
  Type of managed service identity.


  Known values:


  - `"None"`: The default identity type. summary logs do not have a managed
  identity.


  - `"UserAssigned"`: summary logs is associated with a user assigned managed
  identity. User assigned identities are created as separate Azure resources and
  can be shared across multiple summary logs.
