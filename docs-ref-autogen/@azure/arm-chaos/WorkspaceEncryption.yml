  - name: customerManagedKeyEncryption
    uid: '@azure/arm-chaos.WorkspaceEncryption.customerManagedKeyEncryption'
    package: '@azure/arm-chaos'
    summary: >-
      The requested customer-managed key. Its presence is fixed by accepted

      Workspace creation: adding CMK to a Microsoft-managed Workspace or
      removing

      CMK from a CMK-created Workspace is rejected with
      InvalidEncryptionConfiguration.

      The key pair remains updateable on CMK-created Workspaces, including after

      a failed creation. A present object requires a coherent
      keyEncryptionKeyUrl and

      keyVaultResourceId pair. After synchronous caller and vault validation,

      the accepted pair can be returned while configuration is Pending.

      It does not prove that active data already uses the requested key.
    fullName: customerManagedKeyEncryption
    remarks: ''
    isDeprecated: false
