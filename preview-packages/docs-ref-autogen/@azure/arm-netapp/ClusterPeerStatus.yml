name: ClusterPeerStatus
uid: '@azure/arm-netapp.ClusterPeerStatus'
package: '@azure/arm-netapp'
summary: >-
  Cluster Peer status enum \

  [KnownClusterPeerStatus](xref:@azure/arm-netapp.KnownClusterPeerStatus) can be
  used interchangeably with ClusterPeerStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Active**: Active peering \

  **Error**: Error state, an error occurred during peering, the error details
  can be seen by running this command on the external ONTAP cluster for more
  details (command: cluster peer show) \

  **Pending**: Pending state, the peering needs to be accepted on your cluster
