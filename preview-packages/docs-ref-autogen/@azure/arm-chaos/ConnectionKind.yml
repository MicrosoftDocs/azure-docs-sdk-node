### YamlMime:TSTypeAlias
name: ConnectionKind
uid: '@azure/arm-chaos.ConnectionKind'
package: '@azure/arm-chaos'
summary: >-
  The kind of connection, indicating the actor type authorized to reach the
  Chaos Studio data plane for the workspace and target. \

  [KnownConnectionKind](xref:@azure/arm-chaos.KnownConnectionKind) can be used
  interchangeably with ConnectionKind,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AksExtension**: A connection backed by the Chaos AKS cluster extension. \

  **ChaosAgent**: A connection backed by the Chaos agent installed on the target
  resource. \

  **Csfi**: A connection backed by Cloud Service Fault Injection (CSFI).
fullName: ConnectionKind
remarks: ''
isDeprecated: false
syntax: |
  type ConnectionKind = string
