  - name: autoCompleteMessages
    uid: '@azure/functions.ServiceBusQueueTriggerOptions.autoCompleteMessages'
    package: '@azure/functions'
    summary: >-
      Gets or sets a value indicating whether the trigger should automatically
      complete the message after successful processing.

      If not explicitly set, the behavior will be based on the
      autoCompleteMessages configuration in host.json.

      For more information, <see cref="https://aka.ms/AAp8dm9"/>"
    fullName: autoCompleteMessages
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'autoCompleteMessages?: boolean'
      return:
        description: ''
        type: boolean
  - name: cardinality
    uid: '@azure/functions.ServiceBusQueueTriggerOptions.cardinality'
    package: '@azure/functions'
    summary: >-
      Set to `many` in order to enable batching. If omitted or set to `one`, a
      single message is passed to the function.
    fullName: cardinality
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cardinality?: "many" | "one"'
      return:
        description: ''
        type: '"many" | "one"'
  - name: connection
    uid: '@azure/functions.ServiceBusQueueTriggerOptions.connection'
    package: '@azure/functions'
