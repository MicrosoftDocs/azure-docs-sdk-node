### YamlMime:TSTypeAlias
name: UsernameClaimPrefixPolicy
uid: '@azure/arm-redhatopenshifthcp.UsernameClaimPrefixPolicy'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  UsernameClaimPrefixPolicy configures whether to add a prefix to a JWT claim. \

  [KnownUsernameClaimPrefixPolicy](xref:@azure/arm-redhatopenshifthcp.KnownUsernameClaimPrefixPolicy)
  can be used interchangeably with UsernameClaimPrefixPolicy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: No opinion; the platform is left to choose a prefix for the JWT
  claim \

  **Prefix**: Add a user-provided prefix to the JWT claim \

  **NoPrefix**: Do not add a prefix to the JWT claim
fullName: UsernameClaimPrefixPolicy
remarks: ''
isDeprecated: false
syntax: |
  type UsernameClaimPrefixPolicy = string
