    uid: >-
      @azure/ai-projects.AgentOptimizationResultCandidateSummary.latest_promoted_candidate
    package: '@azure/ai-projects'
    summary: >-
      Most recently promoted candidate for the job. Omitted if no candidates
      have been promoted.
    fullName: latest_promoted_candidate
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'latest_promoted_candidate?: AgentOptimizationCandidatePromotionInfo'
