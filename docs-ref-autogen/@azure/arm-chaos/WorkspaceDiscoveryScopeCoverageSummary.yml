### YamlMime:TSType
name: WorkspaceDiscoveryScopeCoverageSummary
uid: '@azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary'
package: '@azure/arm-chaos'
summary: >-
  Two independent partitions of expanded scope occurrences after
  normalized-scope deduplication. Distinct service groups remain distinct even
  if their members coincide. The known/unknown counts and the four completeness
  counts each sum to totalCount.
fullName: WorkspaceDiscoveryScopeCoverageSummary
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: baselineUnknownCount
    uid: >-
      @azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary.baselineUnknownCount
    package: '@azure/arm-chaos'
    summary: >-
      The number of scopes with a structurally unavailable denominator and no
      observed shortfall, including successful observed-empty container scans.
    fullName: baselineUnknownCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'baselineUnknownCount: number'
      return:
        description: ''
        type: number
  - name: establishedCount
    uid: '@azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary.establishedCount'
    package: '@azure/arm-chaos'
    summary: The number of scopes with Established coverage.
    fullName: establishedCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'establishedCount: number'
      return:
        description: ''
        type: number
  - name: knownExpectedSetCount
    uid: >-
      @azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary.knownExpectedSetCount
    package: '@azure/arm-chaos'
    summary: >-
      The number of scopes with an authoritative complete expected
      resource-occurrence set, including authoritatively empty sets.
    fullName: knownExpectedSetCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'knownExpectedSetCount: number'
      return:
        description: ''
        type: number
  - name: knownPartialCount
    uid: '@azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary.knownPartialCount'
    package: '@azure/arm-chaos'
    summary: >-
      The number of scopes with confirmed undelivered obligations and no
      remaining system-verification gap.
    fullName: knownPartialCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'knownPartialCount: number'
      return:
        description: ''
        type: number
  - name: totalCount
    uid: '@azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary.totalCount'
    package: '@azure/arm-chaos'
    summary: >-
      The number of expanded Azure Resource Manager scope occurrences
      represented by the result.
    fullName: totalCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'totalCount: number'
      return:
        description: ''
        type: number
  - name: unknownExpectedSetCount
    uid: >-
      @azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary.unknownExpectedSetCount
    package: '@azure/arm-chaos'
    summary: >-
      The number of scopes whose complete expected inventory set is unavailable.
      A service group's known subscription or resource-group membership does not
      establish its descendant-resource denominator.
    fullName: unknownExpectedSetCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'unknownExpectedSetCount: number'
      return:
        description: ''
        type: number
  - name: verificationIncompleteCount
    uid: >-
      @azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary.verificationIncompleteCount
    package: '@azure/arm-chaos'
    summary: >-
      The number of scopes with required verification failure, unavailable
      required child enumeration, or a proven accessible required resource
      absent from the snapshot.
    fullName: verificationIncompleteCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'verificationIncompleteCount: number'
      return:
        description: ''
        type: number
