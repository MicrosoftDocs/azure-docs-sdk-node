### YamlMime:TSTypeAlias
name: MessagePhase
uid: '@azure/ai-projects.MessagePhase'
package: '@azure/ai-projects'
summary: >-
  Labels an `assistant` message as intermediate commentary (`commentary`) or the
  final answer (`final_answer`).

  For models like `gpt-5.3-codex` and beyond, when sending follow-up requests,
  preserve and resend

  phase on all assistant messages — dropping it can degrade performance. Not
  used for user messages.
fullName: MessagePhase
remarks: ''
isDeprecated: false
syntax: |
  type MessagePhase = "commentary" | "final_answer"
