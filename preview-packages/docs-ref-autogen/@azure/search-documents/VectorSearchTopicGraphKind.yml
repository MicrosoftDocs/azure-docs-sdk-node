### YamlMime:TSTypeAlias
name: VectorSearchTopicGraphKind
uid: '@azure/search-documents.VectorSearchTopicGraphKind'
package: '@azure/search-documents'
summary: >-
  The kind of topic graph vector search to use. \

  [KnownVectorSearchTopicGraphKind](xref:@azure/search-documents.KnownVectorSearchTopicGraphKind)
  can be used interchangeably with VectorSearchTopicGraphKind,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **none**: Use normal vector search when topic graph diverse retrieval is off.
  \

  **diverse**: Use topic graph diverse retrieval. \

  **balanced**: Blends pure vector similarity with diversity-aware retrieval.
  Recommended default to balance diversity with relevance.
fullName: VectorSearchTopicGraphKind
remarks: ''
isDeprecated: false
syntax: |
  type VectorSearchTopicGraphKind = string
