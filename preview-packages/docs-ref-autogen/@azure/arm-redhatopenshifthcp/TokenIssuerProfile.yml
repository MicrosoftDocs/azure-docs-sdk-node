### YamlMime:TSType
name: TokenIssuerProfile
uid: '@azure/arm-redhatopenshifthcp.TokenIssuerProfile'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  Token issuer profile

  This configures how the platform interacts with the identity provider and

  how tokens issued from the identity provider are evaluated by the Kubernetes
  API server.
fullName: TokenIssuerProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audiences
    uid: '@azure/arm-redhatopenshifthcp.TokenIssuerProfile.audiences'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      This configures the acceptable audiences the JWT token, issued by the
      identity

      provider, must be issued to. At least one of the entries must match the

      'aud' claim in the JWT token.


      audiences must contain at least one entry and must not exceed ten entries.
    fullName: audiences
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audiences: string[]'
      return:
        description: ''
        type: string[]
  - name: ca
    uid: '@azure/arm-redhatopenshifthcp.TokenIssuerProfile.ca'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      The issuer of the token


      Certificate bundle to use to validate server certificates for the
      configured URL.

      It must be PEM encoded and when not specified, the system trust is used.
    fullName: ca
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ca?: string'
      return:
        description: ''
        type: string
  - name: url
    uid: '@azure/arm-redhatopenshifthcp.TokenIssuerProfile.url'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      This configures the URL used to issue tokens by the identity provider.

      The Kubernetes API server determines how authentication tokens should be
      handled

      by matching the 'iss' claim in the JWT to the issuerURL of configured
      identity providers.


      issuerURL must use the 'https' scheme.
    fullName: url
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'url: string'
      return:
        description: ''
        type: string
