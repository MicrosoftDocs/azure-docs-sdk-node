### YamlMime:TSType
name: EgressTrustBundleProperties
uid: '@azure/arm-networksecurity.EgressTrustBundleProperties'
package: '@azure/arm-networksecurity'
summary: Properties of the platform egress TLS-inspection trust bundle.
fullName: EgressTrustBundleProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: bundleVersion
    uid: '@azure/arm-networksecurity.EgressTrustBundleProperties.bundleVersion'
    package: '@azure/arm-networksecurity'
    summary: >-
      Opaque identifier of this bundle's content. It changes whenever the set of
      anchors

      changes and is stable otherwise, so a caller can record what a sandbox was
      provisioned

      with and detect drift without comparing certificate bytes.
    fullName: bundleVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'bundleVersion: string'
      return:
        description: ''
        type: string
  - name: cacheExpiresAt
    uid: '@azure/arm-networksecurity.EgressTrustBundleProperties.cacheExpiresAt'
    package: '@azure/arm-networksecurity'
    summary: >-
      The absolute deadline matching `cacheValiditySeconds`. A cached copy must
      not be used

      after this instant without re-reading. Reaching it means the earlier
      refresh was missed

      or failing; a caller that cannot obtain an acceptable bundle must fail or
      retry

      bring-up rather than silently skip anchor installation.
    fullName: cacheExpiresAt
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cacheExpiresAt: Date'
      return:
        description: ''
        type: Date
  - name: cacheValiditySeconds
    uid: >-
      @azure/arm-networksecurity.EgressTrustBundleProperties.cacheValiditySeconds
    package: '@azure/arm-networksecurity'
    summary: >-
      How long, in seconds, a caller may serve this bundle from its own cache.
      This is a

      ceiling, not a target: refresh well before it elapses, at roughly half
      this value, so a

      transient failure still leaves time to retry before the cached copy must
      be discarded.

      The service sets this value and may change it to steer how often callers
      re-read, so

      honour the value returned rather than hard-coding an interval. Callers are
      expected to

      cache; a synchronous dependency on this operation during every sandbox
      launch is not

      intended.
    fullName: cacheValiditySeconds
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cacheValiditySeconds: number'
      return:
        description: ''
        type: number
  - name: certificates
    uid: '@azure/arm-networksecurity.EgressTrustBundleProperties.certificates'
    package: '@azure/arm-networksecurity'
    summary: >-
      The public certificate authority anchors that make up the bundle, ordered
      with the

      currently signing anchor first. Always contains at least one entry.
    fullName: certificates
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'certificates: EgressTrustBundleCertificate[]'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-networksecurity.EgressTrustBundleCertificate"
          />[]
  - name: provisioningState
    uid: '@azure/arm-networksecurity.EgressTrustBundleProperties.provisioningState'
    package: '@azure/arm-networksecurity'
    summary: >-
      The provisioning state of the resource. This resource is computed rather
      than

      provisioned, so a successful read always reports `Succeeded`.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
