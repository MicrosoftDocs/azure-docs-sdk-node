    syntax:
      content: 'provisionError?: CassandraErrorInput'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-cosmosdb.types.CassandraErrorInput" />
  - name: provisioningState
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.provisioningState
