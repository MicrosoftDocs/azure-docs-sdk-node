        type: Record&lt;string, string&gt;
  - name: output
    uid: '@azure/ai-projects.VoiceResponse.output'
    package: '@azure/ai-projects'
    summary: >-
      The output items produced by the response. May be omitted in list results;
      retrieve the full response (GET .../responses/{response_id}) or use the
      paged response-items route (GET .../responses/{response_id}/items) for its
      output items. Each item's `response_id` also links it back to this
      response in the conversation-level items list.
    fullName: output
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'output?: RealtimeConversationItemUnion[]'
