### YamlMime:TSType
name: SkuInput
uid: '@azure/provisioning-search.types.SkuInput'
package: '@azure/provisioning-search'
summary: >-
  Input type for Defines the SKU of a search service, which determines billing
  rate and capacity limits.
fullName: SkuInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: name
    uid: '@azure/provisioning-search.types.SkuInput.name'
    package: '@azure/provisioning-search'
    summary: >-
      The SKU of the search service. Valid values include: 'free': Shared
      service. 'basic': Dedicated service with up to 3 replicas. 'standard':
      Dedicated service with up to 12 partitions and 12 replicas. 'standard2':
      Similar to standard, but with more capacity per search unit. 'standard3':
      The largest Standard offering with up to 12 partitions and 12 replicas (or
      up to 3 partitions with more indexes if you also set the hostingMode
      property to 'highDensity'). 'storage_optimized_l1': Supports 1TB per
      partition, up to 12 partitions. 'storage_optimized_l2': Supports 2TB per
      partition, up to 12 partitions. 'serverless': Serverless tier with
      auto-scaling capabilities.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
extends: unknown&lt;<xref uid="@azure/provisioning-search.types.Sku" />&gt;
