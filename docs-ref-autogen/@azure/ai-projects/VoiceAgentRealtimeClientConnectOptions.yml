  - name: transport
    uid: '@azure/ai-projects.VoiceAgentRealtimeClientConnectOptions.transport'
    package: '@azure/ai-projects'
    summary: >-
      Connection transport. Defaults to "websocket".

      Use "webrtc" only if your app handles the SDP offer/answer exchange
      through

      the rtc.call.sdp.create and rtc.call.sdp.created events.
    fullName: transport
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'transport?: VoiceAgentTransport'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentTransport" />
