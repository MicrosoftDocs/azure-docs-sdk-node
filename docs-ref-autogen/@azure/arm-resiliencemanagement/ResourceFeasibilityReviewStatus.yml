### YamlMime:TSTypeAlias
name: ResourceFeasibilityReviewStatus
uid: '@azure/arm-resiliencemanagement.ResourceFeasibilityReviewStatus'
package: '@azure/arm-resiliencemanagement'
summary: >-
  Outcome of a resource feasibility review for a recovery resource. \

  [KnownResourceFeasibilityReviewStatus](xref:@azure/arm-resiliencemanagement.KnownResourceFeasibilityReviewStatus)
  can be used interchangeably with ResourceFeasibilityReviewStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unavailable**: The review could not complete. Advisory only; it never blocks
  failover. \

  **Passed**: The review identified no risk. \

  **Flagged**: The review identified a risk the operator should consider. \

  **NotApplicable**: The review did not apply to this resource and was skipped.
fullName: ResourceFeasibilityReviewStatus
remarks: ''
isDeprecated: false
syntax: |
  type ResourceFeasibilityReviewStatus = string
