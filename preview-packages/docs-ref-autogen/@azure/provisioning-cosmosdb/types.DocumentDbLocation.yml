    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id?: string'
      return:
        description: ''
        type: string
  - name: isZoneRedundant
    uid: '@azure/provisioning-cosmosdb.types.DocumentDbLocation.isZoneRedundant'
    package: '@azure/provisioning-cosmosdb'
