### YamlMime:TSType
name: NeuroShieldProtectedResourceIdentity
uid: '@azure/arm-networksecurity.NeuroShieldProtectedResourceIdentity'
package: '@azure/arm-networksecurity'
summary: >-
  Caller-supplied identity of the target VM or VMSS, retained on the protected
  resource.

  These identifiers are not independently resolved or verified by this API
  contract.
fullName: NeuroShieldProtectedResourceIdentity
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: principalId
    uid: >-
      @azure/arm-networksecurity.NeuroShieldProtectedResourceIdentity.principalId
    package: '@azure/arm-networksecurity'
    summary: >-
      Microsoft Entra service principal ID of the target's system-assigned
      identity.

      A nonzero value is required for SystemAssigned; omit for UserAssigned.
    fullName: principalId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'principalId?: string'
      return:
        description: ''
        type: string
  - name: tenantId
    uid: '@azure/arm-networksecurity.NeuroShieldProtectedResourceIdentity.tenantId'
    package: '@azure/arm-networksecurity'
    summary: |-
      Microsoft Entra tenant ID of the target's system-assigned identity.
      A nonzero value is required for SystemAssigned; omit for UserAssigned.
    fullName: tenantId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tenantId?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-networksecurity.NeuroShieldProtectedResourceIdentity.type'
    package: '@azure/arm-networksecurity'
    summary: >-
      Type of the target identity. None, SystemAssigned, and UserAssigned are
      supported.

      The declared combined system/user-assigned value is rejected by the
      operation.

      There is no default when an identity object is supplied.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: string'
      return:
        description: ''
        type: string
  - name: userAssignedIdentities
    uid: >-
      @azure/arm-networksecurity.NeuroShieldProtectedResourceIdentity.userAssignedIdentities
    package: '@azure/arm-networksecurity'
    summary: >-
      User-assigned identities keyed by Azure Resource Manager resource ID.

      For UserAssigned, supply exactly one non-null entry with a nonblank key
      and

      nonzero principalId and clientId. Other identity kinds reject a nonempty
      map.
    fullName: userAssignedIdentities
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'userAssignedIdentities?: Record<string, any>'
      return:
        description: ''
        type: Record&lt;string, any&gt;
