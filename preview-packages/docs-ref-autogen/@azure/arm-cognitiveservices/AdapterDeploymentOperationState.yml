name: AdapterDeploymentOperationState
uid: '@azure/arm-cognitiveservices.AdapterDeploymentOperationState'
package: '@azure/arm-cognitiveservices'
summary: >-
  Lifecycle operation states reported by an adapter deployment. \

  [KnownAdapterDeploymentOperationState](xref:@azure/arm-cognitiveservices.KnownAdapterDeploymentOperationState)
  can be used interchangeably with AdapterDeploymentOperationState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Accepted**: The operation was accepted. \

  **Running**: The operation is running. \

  **Succeeded**: The operation completed successfully. \

  **Failed**: The operation failed.
