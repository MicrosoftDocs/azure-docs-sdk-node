### YamlMime:TSTypeAlias
name: WorkspaceEncryptionState
uid: '@azure/arm-chaos.WorkspaceEncryptionState'
package: '@azure/arm-chaos'
summary: >-
  The observed encryption state; this does not replace Workspace
  provisioningState. \

  [KnownWorkspaceEncryptionState](xref:@azure/arm-chaos.KnownWorkspaceEncryptionState)
  can be used interchangeably with WorkspaceEncryptionState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotConfigured**: No per-Workspace encryption configuration exists.
  Microsoft-managed protection applies. \

  **Pending**: An encryption configuration operation is in progress. \

  **Applied**: A fresh check confirms the requested customer key and scoped
  customer-data access. \

  **Failed**: An encryption configuration step or health check failed. See the
  error for corrective action. \

  **Unknown**: No usable fresh observation is available.
fullName: WorkspaceEncryptionState
remarks: ''
isDeprecated: false
syntax: |
  type WorkspaceEncryptionState = string
