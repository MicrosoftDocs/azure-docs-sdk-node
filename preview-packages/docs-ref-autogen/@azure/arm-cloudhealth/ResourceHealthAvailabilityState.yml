name: ResourceHealthAvailabilityState
uid: '@azure/arm-cloudhealth.ResourceHealthAvailabilityState'
package: '@azure/arm-cloudhealth'
summary: >-
  Availability state of an Azure resource as reported by Azure Resource Health.
  \

  [KnownResourceHealthAvailabilityState](xref:@azure/arm-cloudhealth.KnownResourceHealthAvailabilityState)
  can be used interchangeably with ResourceHealthAvailabilityState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Available**: The resource is available. \

  **Unavailable**: The resource is unavailable. \

  **Degraded**: The resource is degraded. \

  **Unknown**: The resource availability state is unknown.
fullName: ResourceHealthAvailabilityState
