### YamlMime:TSTypeAlias
name: RebalanceJobAdminStatus
uid: '@azure/arm-storagecache.RebalanceJobAdminStatus'
package: '@azure/arm-storagecache'
summary: >-
  The administrative status of the rebalance job. Active means the job is
  running normally. Cancel requests the job to stop. \

  [KnownRebalanceJobAdminStatus](xref:@azure/arm-storagecache.KnownRebalanceJobAdminStatus)
  can be used interchangeably with RebalanceJobAdminStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Active**: The rebalance job is running normally. \

  **Cancel**: Request the rebalance job to stop.
fullName: RebalanceJobAdminStatus
remarks: ''
isDeprecated: false
syntax: |
  type RebalanceJobAdminStatus = string
