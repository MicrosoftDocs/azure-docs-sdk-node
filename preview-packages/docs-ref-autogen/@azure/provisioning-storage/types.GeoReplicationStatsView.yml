    uid: '@azure/provisioning-storage.types.GeoReplicationStatsView.canFailover'
    package: '@azure/provisioning-storage'
    summary: >-
      Read-only output: A boolean flag which indicates whether or not account
      failover is supported for the account.
    fullName: canFailover
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'canFailover?: Expression<boolean>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;boolean&gt;
  - name: canPlannedFailover
    uid: >-
      @azure/provisioning-storage.types.GeoReplicationStatsView.canPlannedFailover
    package: '@azure/provisioning-storage'
    summary: >-
      Read-only output: A boolean flag which indicates whether or not planned
      account failover is supported for the account.
    fullName: canPlannedFailover
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'canPlannedFailover?: Expression<boolean>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;boolean&gt;
  - name: lastSyncTime
    uid: '@azure/provisioning-storage.types.GeoReplicationStatsView.lastSyncTime'
    package: '@azure/provisioning-storage'
    summary: >-
      Read-only output: All primary writes preceding this UTC date/time value
      are guaranteed to be available for read operations. Primary writes
      following this point in time may or may not be available for reads.
      Element may be default value if value of LastSyncTime is not available,
      this can happen if secondary is offline or we are in bootstrap.
    fullName: lastSyncTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastSyncTime?: Expression<Date>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;Date&gt;
