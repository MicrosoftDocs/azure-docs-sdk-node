name: KnownPrincipalTypes
uid: '@azure/arm-horizondb.KnownPrincipalTypes'
package: '@azure/arm-horizondb'
summary: The type of Microsoft Entra principal mapped to a PostgreSQL role.
fullName: KnownPrincipalTypes
remarks: ''
isDeprecated: false
fields:
  - name: Group
    uid: '@azure/arm-horizondb.KnownPrincipalTypes.Group'
    package: '@azure/arm-horizondb'
    summary: >-
      A Microsoft Entra ID security group. All members of the group inherit
      administrator privileges.
  - name: ServicePrincipal
    uid: '@azure/arm-horizondb.KnownPrincipalTypes.ServicePrincipal'
    package: '@azure/arm-horizondb'
    summary: >-
      A Microsoft Entra ID application or service principal used for automated
      workloads.
  - name: Unknown
    uid: '@azure/arm-horizondb.KnownPrincipalTypes.Unknown'
    package: '@azure/arm-horizondb'
    summary: >-
      An unknown or unrecognized type. This value is for internal use and is not
      accepted in requests.
  - name: User
    uid: '@azure/arm-horizondb.KnownPrincipalTypes.User'
    package: '@azure/arm-horizondb'
    summary: A Microsoft Entra ID user account.
