### YamlMime:TSType
name: LiveClientEventLiveOutputAudioFixturePlayParam
uid: '@azure/ai-projects.LiveClientEventLiveOutputAudioFixturePlayParam'
package: '@azure/ai-projects'
summary: >-
  Play one complete audio fixture through the session output. Send this event
  over the primary WebSocket or a server sideband. Audio must be raw mono PCM16
  little-endian at 24 kHz, regardless of the session audio format, and at most
  30 seconds. The entire payload is validated before model speech is interrupted
  and input is muted. Only one fixture can be active. fixture.playing
  acknowledges acceptance and fixture.played reports server mixer drain. These
  notifications are not exact transport-media boundaries. Input arriving during
  playback is dropped and not replayed.
fullName: LiveClientEventLiveOutputAudioFixturePlayParam
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.LiveClientEventLiveOutputAudioFixturePlayParam.audio'
    package: '@azure/ai-projects'
    summary: >-
      Base64-encoded raw mono PCM16 audio, little-endian, at 24 kHz. Do not
      include a WAV or other container header.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio: string'
      return:
        description: ''
        type: string
  - name: event_id
    uid: '@azure/ai-projects.LiveClientEventLiveOutputAudioFixturePlayParam.event_id'
    package: '@azure/ai-projects'
    summary: A client-generated ID used to correlate this command with server events.
    fullName: event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'event_id?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/ai-projects.LiveClientEventLiveOutputAudioFixturePlayParam.type'
    package: '@azure/ai-projects'
    summary: The event type. Always `session.output_audio.fixture.play`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "session.output_audio.fixture.play"'
      return:
        description: ''
        type: '"<xref uid="session.output_audio.fixture.play" />"'
extends: <xref uid="@azure/ai-projects.LiveClientEvent" />
