  - name: appTerminate(AppTerminateHandler)
    uid: '@azure/functions.app.hook.appTerminate'
    package: '@azure/functions'
    summary: >-
      Register a hook to be run during graceful shutdown of your application.

      This hook will not be executed if your application is terminated
      forcefully.

      Hooks have a limited time to execute during the termination grace period.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function appTerminate(handler: AppTerminateHandler): Disposable'
