### YamlMime:TSEnum
name: KnownSnapshotAccessState
uid: '@azure/arm-elasticsan.KnownSnapshotAccessState'
package: '@azure/arm-elasticsan'
summary: >-
  The state of snapshot which determines the access availability of the
  snapshot.
fullName: KnownSnapshotAccessState
remarks: ''
isDeprecated: false
fields:
  - name: Available
    uid: '@azure/arm-elasticsan.KnownSnapshotAccessState.Available'
    package: '@azure/arm-elasticsan'
    summary: >-
      The snapshot can be used for restore, copy to different region, and
      download to offline.
  - name: AvailableWithInstantAccess
    uid: '@azure/arm-elasticsan.KnownSnapshotAccessState.AvailableWithInstantAccess'
    package: '@azure/arm-elasticsan'
    summary: >-
      The snapshot can be used for restoring volumes with fast performance,
      copied and downloaded.
  - name: InstantAccess
    uid: '@azure/arm-elasticsan.KnownSnapshotAccessState.InstantAccess'
    package: '@azure/arm-elasticsan'
    summary: >-
      The snapshot can be used for restoring volumes with fast performance but
      cannot be copied or downloaded.
  - name: Pending
    uid: '@azure/arm-elasticsan.KnownSnapshotAccessState.Pending'
    package: '@azure/arm-elasticsan'
    summary: The snapshot cannot be used for restore, copy or download to offline.
  - name: Unknown
    uid: '@azure/arm-elasticsan.KnownSnapshotAccessState.Unknown'
    package: '@azure/arm-elasticsan'
    summary: Default value.
