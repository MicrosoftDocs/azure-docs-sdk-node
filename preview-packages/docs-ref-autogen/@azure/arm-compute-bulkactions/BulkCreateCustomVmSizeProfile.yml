### YamlMime:TSType
name: BulkCreateCustomVmSizeProfile
uid: '@azure/arm-compute-bulkactions.BulkCreateCustomVmSizeProfile'
package: '@azure/arm-compute-bulkactions'
summary: >-
  A VM size profile entry that may additionally carry an optional per-VM-size
  profile override. Every VM that the service assigns to this size inherits the
  override, layered on top of the operation-level base profile and beneath any
  per-VM override. Present only on the bulkCreateCustom endpoint; the uniform
  endpoint rejects a non-null override.
fullName: BulkCreateCustomVmSizeProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: name
    uid: '@azure/arm-compute-bulkactions.BulkCreateCustomVmSizeProfile.name'
    package: '@azure/arm-compute-bulkactions'
    summary: The name of the VM size, eg Standard_D2ads_v5
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: override
    uid: '@azure/arm-compute-bulkactions.BulkCreateCustomVmSizeProfile.override'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Optional per-VM-size profile override applied to every VM the service
      assigns to this size. A size maps to many VMs, so virtualMachineName is
      not part of this shape. virtualMachineProfile is layered beneath any
      per-VM override; tags, identity, and plan are merged with the per-VM
      override, with the per-VM value winning.
    fullName: override
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'override?: BulkCreateCustomOverrideBase'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-compute-bulkactions.BulkCreateCustomOverrideBase" />
  - name: rank
    uid: '@azure/arm-compute-bulkactions.BulkCreateCustomVmSizeProfile.rank'
    package: '@azure/arm-compute-bulkactions'
    summary: The rank of this VM size in the priority order
    fullName: rank
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'rank: number'
      return:
        description: ''
        type: number
