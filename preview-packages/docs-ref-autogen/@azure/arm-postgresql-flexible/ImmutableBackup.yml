name: ImmutableBackup
uid: '@azure/arm-postgresql-flexible.ImmutableBackup'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Indicates if the server is configured to create immutable backups. \

  [KnownImmutableBackup](xref:@azure/arm-postgresql-flexible.KnownImmutableBackup)
  can be used interchangeably with ImmutableBackup,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Server is configured to create immutable backups. \

  **Disabled**: Server is not configured to create immutable backups.
