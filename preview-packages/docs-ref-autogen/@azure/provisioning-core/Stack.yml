### YamlMime:TSType
name: Stack
uid: '@azure/provisioning-core.Stack'
package: '@azure/provisioning-core'
summary: Defines resources and module deployments at a chosen Azure deployment scope.
fullName: Stack<P, O>
remarks: >-
  Create resources with this stack as their parent, or use `addResource()`.

  Use `addModule()` for child deployments. Create reusable components with this

  stack as their constructor's parent argument.


  The `targetScope` option controls the deployment scope. Default is

  `"resourceGroup"`, for resources deployed into an existing resource group.

  Set `"subscription"` for subscription-level resources, such as new resource

  groups.


  [Key Vault getting started
  example](https://github.com/Azure/azure-sdk-for-js/tree/main/sdk/keyvault/provisioning-keyvault#getting-started)
isDeprecated: false
type: class
