### YamlMime:TSType
name: PoolPropertiesForPatchUpdateUpdate
uid: '@azure/arm-horizondb.PoolPropertiesForPatchUpdateUpdate'
package: '@azure/arm-horizondb'
summary: Properties of a HorizonDB pool for update operations.
fullName: PoolPropertiesForPatchUpdateUpdate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: computeModel
    uid: '@azure/arm-horizondb.PoolPropertiesForPatchUpdateUpdate.computeModel'
    package: '@azure/arm-horizondb'
    summary: >-
      The compute model properties to update. Omitted properties preserve their
      current values. To change the compute model type, supply the complete
      target compute model, including type, computeProcessor, computeGeneration,
      and all properties required by the target type.
    fullName: computeModel
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'computeModel?: PoolComputeModelForPatchUpdateUpdate'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-horizondb.PoolComputeModelForPatchUpdateUpdate"
          />
  - name: highAvailability
    uid: '@azure/arm-horizondb.PoolPropertiesForPatchUpdateUpdate.highAvailability'
    package: '@azure/arm-horizondb'
    summary: >-
      The high-availability configuration to update. Omission preserves the
      current mode. The service recursively merges omitted PATCH properties with
      the existing resource before validating the effective nodeCount and mode
      together.
    fullName: highAvailability
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'highAvailability?: PoolHighAvailabilityPatchUpdate'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.PoolHighAvailabilityPatchUpdate" />
  - name: nodeCount
    uid: '@azure/arm-horizondb.PoolPropertiesForPatchUpdateUpdate.nodeCount'
    package: '@azure/arm-horizondb'
    summary: >-
      The number of nodes to allocate and assign to the pool. Allowed values are
      1 through 16. Omission preserves the current configured value. To
      deallocate runtime compute without changing the configured node count,
      stop the pool.
    fullName: nodeCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'nodeCount?: number'
      return:
        description: ''
        type: number
  - name: parameterGroup
    uid: '@azure/arm-horizondb.PoolPropertiesForPatchUpdateUpdate.parameterGroup'
    package: '@azure/arm-horizondb'
    summary: >-
      The corresponding default or a customer-created parameter group to
      associate with the existing pool. Customers can switch in either direction
      between these group types. Omission preserves the current association.
    fullName: parameterGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parameterGroup?: PoolParameterGroupReferenceForPatchUpdateUpdate'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-horizondb.PoolParameterGroupReferenceForPatchUpdateUpdate"
          />
  - name: scheduledMaintenance
    uid: >-
      @azure/arm-horizondb.PoolPropertiesForPatchUpdateUpdate.scheduledMaintenance
    package: '@azure/arm-horizondb'
    summary: >-
      The scheduled maintenance configuration to update for the pool. When
      supplied, the complete configuration for the selected maintenance
      management type is required. Omission preserves the current configuration.
    fullName: scheduledMaintenance
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        scheduledMaintenance?:
        ScheduledMaintenancePropertiesForPatchUpdateUpdate
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-horizondb.ScheduledMaintenancePropertiesForPatchUpdateUpdate"
          />
