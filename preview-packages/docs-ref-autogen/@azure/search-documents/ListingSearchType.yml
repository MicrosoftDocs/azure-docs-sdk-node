### YamlMime:TSTypeAlias
name: ListingSearchType
uid: '@azure/search-documents.ListingSearchType'
package: '@azure/search-documents'
summary: >-
  Specifies how the search parameter is interpreted when narrowing down a
  listing result set. Currently only 'prefix' is supported. \

  [KnownListingSearchType](xref:@azure/search-documents.KnownListingSearchType)
  can be used interchangeably with ListingSearchType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **prefix**: Matches items whose name starts with the value of the search
  parameter.
fullName: ListingSearchType
remarks: ''
isDeprecated: false
syntax: |
  type ListingSearchType = string
