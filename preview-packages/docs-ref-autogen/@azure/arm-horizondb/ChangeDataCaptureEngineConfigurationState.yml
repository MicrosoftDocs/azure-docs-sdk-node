name: ChangeDataCaptureEngineConfigurationState
uid: '@azure/arm-horizondb.ChangeDataCaptureEngineConfigurationState'
package: '@azure/arm-horizondb'
summary: >-
  The readiness of HorizonDB engine settings required for change data capture. \

  [KnownChangeDataCaptureEngineConfigurationState](xref:@azure/arm-horizondb.KnownChangeDataCaptureEngineConfigurationState)
  can be used interchangeably with ChangeDataCaptureEngineConfigurationState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Ready**: The required engine settings are ready. \

  **NotReady**: One or more required engine settings are not ready. \

  **Reconciling**: The service is reconciling required engine settings. \

  **Failed**: Engine-setting reconciliation failed.
