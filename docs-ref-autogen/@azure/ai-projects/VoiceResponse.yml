### YamlMime:TSType
name: VoiceResponse
uid: '@azure/ai-projects.VoiceResponse'
package: '@azure/ai-projects'
summary: >-
  A persisted voice response representing one model inference turn within a
  conversation. In list results the

  `output` projection may be omitted; retrieve the

  full response (`GET .../responses/{response_id}`) or the paged response-items
  route

  (`GET .../responses/{response_id}/items`) for its output items.
  `created_at`/`completed_at` are Foundry

  durable ordering extensions.
fullName: VoiceResponse
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.VoiceResponse.audio'
    package: '@azure/ai-projects'
    summary: >-
      The audio configuration used for the response, including the voice and
      audio format used for output.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio?: VoiceResponseAudio'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceResponseAudio" />
  - name: completed_at
    uid: '@azure/ai-projects.VoiceResponse.completed_at'
    package: '@azure/ai-projects'
    summary: The Unix timestamp (in seconds) for when the response completed.
    fullName: completed_at
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'completed_at?: Date'
      return:
        description: ''
        type: Date
  - name: conversation_id
    uid: '@azure/ai-projects.VoiceResponse.conversation_id'
