name: ManagedClusterNATGatewaySku
uid: '@azure/arm-containerservice.ManagedClusterNATGatewaySku'
package: '@azure/arm-containerservice'
summary: >-
  The SKU of a managed cluster NAT Gateway. \

  [KnownManagedClusterNATGatewaySku](xref:@azure/arm-containerservice.KnownManagedClusterNATGatewaySku)
  can be used interchangeably with ManagedClusterNATGatewaySku,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Standard**: Use a Standard SKU NAT Gateway. \

  **StandardV2**: Use a StandardV2 SKU NAT Gateway. This is the default for new
  clusters in regions where it is available.
