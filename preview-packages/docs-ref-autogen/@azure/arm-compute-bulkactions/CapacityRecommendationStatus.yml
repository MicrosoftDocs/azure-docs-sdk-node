name: CapacityRecommendationStatus
uid: '@azure/arm-compute-bulkactions.CapacityRecommendationStatus'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The lifecycle status of the capacity recommendation for an operation \

  [KnownCapacityRecommendationStatus](xref:@azure/arm-compute-bulkactions.KnownCapacityRecommendationStatus)
  can be used interchangeably with CapacityRecommendationStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotInitiated**: The capacity recommendation has not been initiated \

  **Succeeded**: The capacity recommendation completed successfully \

  **Failed**: The capacity recommendation failed \

  **Skipped**: The capacity recommendation was skipped
