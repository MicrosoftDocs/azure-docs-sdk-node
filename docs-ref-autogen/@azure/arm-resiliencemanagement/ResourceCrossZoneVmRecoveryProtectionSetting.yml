### YamlMime:TSType
name: ResourceCrossZoneVmRecoveryProtectionSetting
uid: '@azure/arm-resiliencemanagement.ResourceCrossZoneVmRecoveryProtectionSetting'
package: '@azure/arm-resiliencemanagement'
summary: >-
  Definition of recovery orchestration resource protection with cross-zone
  (zonally resilient) VM recovery.
fullName: ResourceCrossZoneVmRecoveryProtectionSetting
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: capacityReservationGroupId
    uid: >-
      @azure/arm-resiliencemanagement.ResourceCrossZoneVmRecoveryProtectionSetting.capacityReservationGroupId
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      ARM resource ID of the Capacity Reservation Group (in the same
      subscription as the VM) to use when moving the VM to the target zone.
    fullName: capacityReservationGroupId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'capacityReservationGroupId?: string'
      return:
        description: ''
        type: string
  - name: protectionSolutionType
    uid: >-
      @azure/arm-resiliencemanagement.ResourceCrossZoneVmRecoveryProtectionSetting.protectionSolutionType
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      The discriminator possible values: AzureNative, CustomRunbook,
      AzureSiteRecovery, CrossZoneVMRecovery
    fullName: protectionSolutionType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'protectionSolutionType: "CrossZoneVMRecovery"'
      return:
        description: ''
        type: '"CrossZoneVMRecovery"'
  - name: targetZone
    uid: >-
      @azure/arm-resiliencemanagement.ResourceCrossZoneVmRecoveryProtectionSetting.targetZone
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      Customer-requested logical target availability zone for zonal failover (a
      positive availability-zone id, e.g. "1", "2", "3"; additional zones are
      accepted where the region exposes them). Always optional; when omitted the
      service selects a healthy zone. Immutable per failover.
    fullName: targetZone
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetZone?: string'
      return:
        description: ''
        type: string
extends: >-
  <xref
  uid="@azure/arm-resiliencemanagement.ResourceBaseProtectionSolutionSetting" />
