  - name: defaultAuthConfigs
    uid: >-
      @azure/arm-network.ApplicationGatewayAdvancedRoutingMapPropertiesFormat.defaultAuthConfigs
    package: '@azure/arm-network'
    summary: >-
      Default authentication configuration bindings of the advanced routing map.
      Only one authentication configuration is supported. Authentication
      configuration names must be unique across the Application Gateway, and an
      Application Gateway can reference at most 100 distinct authentication
      policies. Authentication policies can only be bound to Application
      Gateways using the Standard_v2 or WAF_v2 SKU.
