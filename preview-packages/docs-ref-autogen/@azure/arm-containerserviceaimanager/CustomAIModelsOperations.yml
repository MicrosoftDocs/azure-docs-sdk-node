      return:
        description: ''
        type: >-
          (resourceGroupName: string, aiManagerName: string, customAIModelName:
          string, options?: CustomAIModelsCalculateCostOptionalParams) =&gt;
          Promise&lt;CalculateCostResponse&gt;
  - name: createOrUpdate
    uid: >-
      @azure/arm-containerserviceaimanager.CustomAIModelsOperations.createOrUpdate
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      Create or update a `CustomAIModel`. This is a full-replace operation: any
      optional property omitted from the request body is reset to its default
      value, or cleared if it has no default. To safely modify a subset of
      fields (e.g. `description`), perform a GET, modify the returned resource,
      and PUT it back using the returned ETag via the `If-Match` header. A PUT
      that changes the immutable `modelId` or `modelSourceResourceId` is
      rejected.
    fullName: createOrUpdate
