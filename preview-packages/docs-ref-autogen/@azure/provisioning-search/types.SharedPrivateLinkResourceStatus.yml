name: SharedPrivateLinkResourceStatus
uid: '@azure/provisioning-search.types.SharedPrivateLinkResourceStatus'
package: '@azure/provisioning-search'
summary: >-
  Status of the shared private link resource. Valid values are Pending,
  Approved, Rejected or Disconnected.


  Known values:


  - `"Pending"`: The shared private link resource has been created and is
  pending approval.


  - `"Approved"`: The shared private link resource is approved and is ready for
  use.


  - `"Rejected"`: The shared private link resource has been rejected and cannot
  be used.


  - `"Disconnected"`: The shared private link resource has been removed from the
  service.
