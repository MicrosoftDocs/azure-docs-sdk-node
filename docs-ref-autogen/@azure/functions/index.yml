variables:
  - name: arg
    uid: '@azure/functions.arg'
    package: '@azure/functions'
    summary: |+
      Factory function to create a new tool property builder

      **Example**

      ```typescript
      const toolProperties = {
        snippetName: arg
          .string()
          .describe("Some Description"),

        optionalField: arg
          .number()
          .describe("Optional number field")
          .optional(),
      };
      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        arg: { boolean() => IToolPropertyBuilder, datetime() =>
        IToolPropertyBuilder, double() => IToolPropertyBuilder, integer() =>
        IToolPropertyBuilder, long() => IToolPropertyBuilder, number() =>
        IToolPropertyBuilder, object() => IToolPropertyBuilder, string() =>
        IToolPropertyBuilder }
      return:
        description: ''
        type: >-
          { boolean() =&gt; IToolPropertyBuilder, datetime() =&gt;
          IToolPropertyBuilder, double() =&gt; IToolPropertyBuilder, integer()
          =&gt; IToolPropertyBuilder, long() =&gt; IToolPropertyBuilder,
          number() =&gt; IToolPropertyBuilder, object() =&gt;
          IToolPropertyBuilder, string() =&gt; IToolPropertyBuilder }
  - name: promptArg
    uid: '@azure/functions.promptArg'
    package: '@azure/functions'
    summary: |-
      Factory for creating MCP **prompt** argument builders.

      Kept separate from the tool-property `arg` helper because prompt arguments
      are untyped (only `name`, optional `description`, and a `required` flag).
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'promptArg: { describe(description: string) => McpPromptArgumentBuilder }'
      return:
        description: ''
        type: '{ describe(description: string) =&gt; McpPromptArgumentBuilder }'
functions:
  - name: McpContent<T>(T)
    uid: '@azure/functions.McpContent'
    package: '@azure/functions'
    summary: >-
      Marks a class or constructor function as an MCP result type that should be
      serialized

      as structured content.


      When a function returns an instance of a type decorated with this marker,

      the result will be serialized as both text content (for backwards
      compatibility)

      and structured content (for clients that support it).


      Without the marker, a plain object is serialized as text-only (JSON
      stringified).

      Use `McpToolResponse` if you need explicit control over structuredContent
      without a class.


      **Programmatic usage** (works without `experimentalDecorators`):

      ```typescript

      class ImageMetadata {
        constructor(public imageId: string, public format: string) {}
      }

      McpContent(ImageMetadata);  // marks the class


      app.mcpTool('GetImage', {
        toolName: 'GetImage',
        description: 'Returns image info',
        handler: async () => new ImageMetadata('logo', 'png')
      });

      ```


      **Decorator usage** (requires `experimentalDecorators: true` in tsconfig):

      ```typescript

      @McpContent

      class ImageMetadata { ... }

      ```


      Supported forms:

      - `@McpContent`

      - `@McpContent()`

      - `McpContent(MyClass)`


      See [McpToolResponse](xref:@azure/functions.McpToolResponse)See For
      explicit content blocks + structuredContent

      See [McpTextContent](xref:@azure/functions.McpTextContent)See For
      returning single content blocks
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function McpContent<T>(target: T): T'
      parameters:
        - id: target
          type: T
          description: >-
            Optional class or constructor function to mark for structured
            content.
      return:
        description: The target class/function unchanged or a class decorator.
        type: T
  - name: McpContent()
    uid: '@azure/functions.McpContent_1'
    package: '@azure/functions'
    summary: ''
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function McpContent(): (target: T) => T'
      return:
        description: ''
        type: '(target: T) =&gt; T'
