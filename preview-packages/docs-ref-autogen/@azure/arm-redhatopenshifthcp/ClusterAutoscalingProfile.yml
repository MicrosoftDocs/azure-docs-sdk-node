### YamlMime:TSType
name: ClusterAutoscalingProfile
uid: '@azure/arm-redhatopenshifthcp.ClusterAutoscalingProfile'
package: '@azure/arm-redhatopenshifthcp'
summary: |-
  ClusterAutoscaling specifies auto-scaling behavior that
  applies to all NodePools associated with a control plane.
fullName: ClusterAutoscalingProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: maxNodeProvisionTimeSeconds
    uid: >-
      @azure/arm-redhatopenshifthcp.ClusterAutoscalingProfile.maxNodeProvisionTimeSeconds
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      maxNodeProvisionTimeSeconds is the maximum time to wait for node
      provisioning before considering the

      provisioning to be unsuccessful. The default is 900 seconds, or 15
      minutes.
    fullName: maxNodeProvisionTimeSeconds
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxNodeProvisionTimeSeconds?: number'
      return:
        description: ''
        type: number
  - name: maxNodesTotal
    uid: '@azure/arm-redhatopenshifthcp.ClusterAutoscalingProfile.maxNodesTotal'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      maxNodesTotal is the maximum allowable number of nodes for the Autoscaler
      scale out to be operational.

      The autoscaler will not grow the cluster beyond this number. If omitted,
      the autoscaler will not have a maximum limit.
    fullName: maxNodesTotal
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxNodesTotal?: number'
      return:
        description: ''
        type: number
  - name: maxPodGracePeriodSeconds
    uid: >-
      @azure/arm-redhatopenshifthcp.ClusterAutoscalingProfile.maxPodGracePeriodSeconds
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      maxPodGracePeriod is the maximum seconds to wait for graceful pod
      termination before scaling down a NodePool.

      The default is 600 seconds.
    fullName: maxPodGracePeriodSeconds
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxPodGracePeriodSeconds?: number'
      return:
        description: ''
        type: number
  - name: podPriorityThreshold
    uid: >-
      @azure/arm-redhatopenshifthcp.ClusterAutoscalingProfile.podPriorityThreshold
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      podPriorityThreshold enables users to schedule "best-effort" pods, which
      shouldn't trigger autoscaler actions,

      but only run when there are spare resources available. The default is -10.

      See the following for more details:

      https://github.com/kubernetes/autoscaler/blob/master/cluster-autoscaler/FAQ.md#how-does-cluster-autoscaler-work-with-pod-priority-and-preemption
    fullName: podPriorityThreshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'podPriorityThreshold?: number'
      return:
        description: ''
        type: number
