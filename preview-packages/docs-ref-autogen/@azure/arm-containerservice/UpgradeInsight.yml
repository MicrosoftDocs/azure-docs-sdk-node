### YamlMime:TSType
name: UpgradeInsight
uid: '@azure/arm-containerservice.UpgradeInsight'
package: '@azure/arm-containerservice'
summary: >-
  An upgrade insight for a managed cluster: an on-demand readiness evaluation
  for an

  upgrade scope, produced by the generateUpgradeInsights action on the managed
  cluster

  and addressable by a server-generated name. The name identifies

  the scope and evaluated target —

  `controlPlane-<targetKubernetesVersion>` (for example `controlPlane-1.33.5`),

  `controlPlaneAndAgentPools-<targetKubernetesVersion>`,

  `agentPool-<agentPoolName>-<targetKubernetesVersion>` (for example

  `agentPool-nodepool1-1.33.5`), or

  `nodeImage-<agentPoolName>-<nodeImageVersion>` (for example

  `nodeImage-nodepool1-202607.01.0`). The node image segment contains only the
  numeric

  image version, while `properties.targetNodeImageVersion` returns the full
  image name.

  The resource itself

  is read-only: GET returns the stored evaluation and LIST returns the stored

  evaluations for the cluster. Evaluations are (re)generated via the managed
  cluster's

  generateUpgradeInsights action, whose response body is the same UpgradeInsight

  representation returned by GET.
fullName: UpgradeInsight
