### YamlMime:TSTypeAlias
name: AutoGeneratedDomainNameLabelScope
uid: '@azure/arm-search.AutoGeneratedDomainNameLabelScope'
package: '@azure/arm-search'
summary: >-
  Defines the level of reuse for the auto-generated domain name label for the
  search service. \

  [KnownAutoGeneratedDomainNameLabelScope](xref:@azure/arm-search.KnownAutoGeneratedDomainNameLabelScope)
  can be used interchangeably with AutoGeneratedDomainNameLabelScope,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **TenantReuse**: Service name will always have the same auto-generated hash
  within the same tenant. \

  **SubscriptionReuse**: Service name will always have the same auto-generated
  hash within the same subscription. \

  **NoReuse**: Service name will always have a unique auto-generated hash
  (regardless of tenant or subscription).
fullName: AutoGeneratedDomainNameLabelScope
remarks: ''
isDeprecated: false
syntax: |
  type AutoGeneratedDomainNameLabelScope = string
