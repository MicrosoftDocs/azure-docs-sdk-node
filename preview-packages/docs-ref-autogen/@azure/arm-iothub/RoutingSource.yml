### YamlMime:TSTypeAlias
name: RoutingSource
uid: '@azure/arm-iothub.RoutingSource'
package: '@azure/arm-iothub'
summary: >-
  The source that the routing rule is to be applied to, such as DeviceMessages.
  \

  [KnownRoutingSource](xref:@azure/arm-iothub.KnownRoutingSource) can be used
  interchangeably with RoutingSource,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Invalid**: Invalid \

  **DeviceMessages**: DeviceMessages \

  **TwinChangeEvents**: TwinChangeEvents \

  **DeviceLifecycleEvents**: DeviceLifecycleEvents \

  **DeviceJobLifecycleEvents**: DeviceJobLifecycleEvents \

  **DigitalTwinChangeEvents**: DigitalTwinChangeEvents \

  **DeviceConnectionStateEvents**: DeviceConnectionStateEvents \

  **MqttBrokerMessages**: MqttBrokerMessages
fullName: RoutingSource
remarks: ''
isDeprecated: false
syntax: |
  type RoutingSource = string
