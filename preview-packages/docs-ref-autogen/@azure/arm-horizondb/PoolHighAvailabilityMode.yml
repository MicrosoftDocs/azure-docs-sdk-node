### YamlMime:TSTypeAlias
name: PoolHighAvailabilityMode
uid: '@azure/arm-horizondb.PoolHighAvailabilityMode'
package: '@azure/arm-horizondb'
summary: >-
  The high-availability mode requested for a HorizonDB pool. \

  [KnownPoolHighAvailabilityMode](xref:@azure/arm-horizondb.KnownPoolHighAvailabilityMode)
  can be used interchangeably with PoolHighAvailabilityMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: High availability is disabled. This mode is valid only when
  nodeCount is 1. \

  **AnyZone**: The service may allocate nodes in the same availability zone or
  across availability zones. This mode is valid only when nodeCount is 2 through
  16. \

  **ZoneRedundant**: The service must allocate nodes across availability zones.
  This mode is valid only when nodeCount is 2 through 16.
fullName: PoolHighAvailabilityMode
remarks: ''
isDeprecated: false
syntax: |
  type PoolHighAvailabilityMode = string
