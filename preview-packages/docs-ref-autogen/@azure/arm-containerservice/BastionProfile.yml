### YamlMime:TSType
name: BastionProfile
uid: '@azure/arm-containerservice.BastionProfile'
package: '@azure/arm-containerservice'
summary: >-
  Profile to enable managed Azure Bastion or reference to an existing Bastion
  for the managed cluster.

  See https://aka.ms/aks/BastionConnect for more details.
fullName: BastionProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: bastionId
    uid: '@azure/arm-containerservice.BastionProfile.bastionId'
    package: '@azure/arm-containerservice'
    summary: >-
      The resource ID of the managed bastion associated with the managed
      cluster.
    fullName: bastionId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'bastionId?: string'
      return:
        description: ''
        type: string
  - name: enabled
    uid: '@azure/arm-containerservice.BastionProfile.enabled'
    package: '@azure/arm-containerservice'
    summary: Indicates whether managed bastion is enabled.
    fullName: enabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabled?: boolean'
      return:
        description: ''
        type: boolean
  - name: publicIpAddressId
    uid: '@azure/arm-containerservice.BastionProfile.publicIpAddressId'
    package: '@azure/arm-containerservice'
    summary: >-
      The resource ID of the public IP address associated with the managed
      bastion.


      When provided during creation, the managed bastion will reference this
      existing public IP address instead of creating a new one.

      The referenced public IP address must be in the same subscription and
      region as the managed cluster.


      When not provided during creation, AKS will automatically create a new
      public IP address.


      This field cannot be updated. To change IP address after creation, please
      disable and re-enable the managed bastion with the new public IP address.
    fullName: publicIpAddressId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publicIpAddressId?: string'
      return:
        description: ''
        type: string
  - name: scaleUnits
    uid: '@azure/arm-containerservice.BastionProfile.scaleUnits'
    package: '@azure/arm-containerservice'
    summary: The scale units of the managed bastion. Default value is 2.
    fullName: scaleUnits
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scaleUnits?: number'
      return:
        description: ''
        type: number
  - name: sku
    uid: '@azure/arm-containerservice.BastionProfile.sku'
    package: '@azure/arm-containerservice'
    summary: >-
      The SKU of the managed bastion.


      Only Standard and Premium SKUs are supported.

      SKU downgrading is not allowed. To downgrade SKU, please disable then
      re-enable the managed bastion with new SKU.


      See https://aka.ms/aks/BastionSKUs for more details.
    fullName: sku
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sku?: string'
      return:
        description: ''
        type: string
