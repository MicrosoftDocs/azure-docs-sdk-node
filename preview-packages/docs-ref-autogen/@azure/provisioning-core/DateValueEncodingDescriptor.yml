### YamlMime:TSTypeAlias
name: DateValueEncodingDescriptor
uid: '@azure/provisioning-core.DateValueEncodingDescriptor'
package: '@azure/provisioning-core'
summary: |-
  Encodings whose client-side value is a JavaScript `Date`.

  `offsetDateTime` is intentionally absent: the emitter exposes it as a
  string so the original offset is not erased.
fullName: DateValueEncodingDescriptor
remarks: ''
isDeprecated: false
syntax: |
  type DateValueEncodingDescriptor =
    | (DateTimeTextEncodingDescriptor & {
        clientMode: "client"
        source: "utcDateTime"
      })
    | (UnixTimestampEncodingDescriptor & { clientMode: "client" })
    | (PlainDateEncodingDescriptor & { clientMode: "client" })
