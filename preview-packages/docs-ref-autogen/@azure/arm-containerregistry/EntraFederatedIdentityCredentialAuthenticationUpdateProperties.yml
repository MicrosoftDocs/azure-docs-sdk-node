### YamlMime:TSType
name: EntraFederatedIdentityCredentialAuthenticationUpdateProperties
uid: >-
  @azure/arm-containerregistry.EntraFederatedIdentityCredentialAuthenticationUpdateProperties
package: '@azure/arm-containerregistry'
summary: >-
  Partial Microsoft Entra federated identity credential authentication
  configuration.

  When authentication is first configured, sourceTenantId and
  federatedApplicationClientId

  must be supplied.
fullName: EntraFederatedIdentityCredentialAuthenticationUpdateProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: authenticationType
    uid: >-
      @azure/arm-containerregistry.EntraFederatedIdentityCredentialAuthenticationUpdateProperties.authenticationType
    package: '@azure/arm-containerregistry'
    summary: >-
      The discriminator possible values: GoogleArtifactRegistry,
      AwsElasticContainerRegistry, EntraFederatedIdentityCredential
    fullName: authenticationType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'authenticationType: "EntraFederatedIdentityCredential"'
      return:
        description: ''
        type: '"EntraFederatedIdentityCredential"'
  - name: federatedApplicationClientId
    uid: >-
      @azure/arm-containerregistry.EntraFederatedIdentityCredentialAuthenticationUpdateProperties.federatedApplicationClientId
    package: '@azure/arm-containerregistry'
    summary: >-
      The client ID of the multi-tenant application. Its application
      registration and

      federated identity credential must be in the cache rule managed identity's
      home tenant.

      The credential's subject is the managed identity's principal/object ID,
      not its client ID.

      Its enterprise application (service principal) must exist in
      `sourceTenantId`.
    fullName: federatedApplicationClientId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'federatedApplicationClientId?: string'
      return:
        description: ''
        type: string
  - name: sourceTenantId
    uid: >-
      @azure/arm-containerregistry.EntraFederatedIdentityCredentialAuthenticationUpdateProperties.sourceTenantId
    package: '@azure/arm-containerregistry'
    summary: >-
      The upstream tenant that issues the token for
      `federatedApplicationClientId` and contains

      the application's enterprise application (service principal).
    fullName: sourceTenantId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sourceTenantId?: string'
      return:
        description: ''
        type: string
extends: >-
  <xref
  uid="@azure/arm-containerregistry.AdditionalAuthenticationUpdateProperties" />
