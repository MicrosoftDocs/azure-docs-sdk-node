### YamlMime:TSType
name: ResponseRetrievalItemGenerationParams
uid: '@azure/ai-projects.ResponseRetrievalItemGenerationParams'
package: '@azure/ai-projects'
summary: >-
  Parameters for retrieving deployed conversations for evaluation.


  See [evaluate deployed
  conversations](https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-deployed-conversations?tabs=python).
fullName: ResponseRetrievalItemGenerationParams
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: data_mapping
    uid: '@azure/ai-projects.ResponseRetrievalItemGenerationParams.data_mapping'
    package: '@azure/ai-projects'
    summary: >-
      Maps `response_id` to the source field that contains a stored Responses
      API

      response identifier. For example, `{"response_id": "{{item.resp_id}}"}`.

      Field names are case-sensitive.
    fullName: data_mapping
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'data_mapping: Record<string, string>'
      return:
        description: ''
        type: Record&lt;string, string&gt;
  - name: max_num_turns
    uid: '@azure/ai-projects.ResponseRetrievalItemGenerationParams.max_num_turns'
    package: '@azure/ai-projects'
    summary: The maximum number of turns of chat history to evaluate.
    fullName: max_num_turns
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_num_turns: number'
      return:
        description: ''
        type: number
  - name: source
    uid: '@azure/ai-projects.ResponseRetrievalItemGenerationParams.source'
    package: '@azure/ai-projects'
    summary: |-
      The inline JSONL content containing the response identifiers to retrieve.
      The `azure_ai_responses` data source supports `file_content` only;
      providing a `file_id` results in a `400 Bad Request` response.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source: EvalJsonlFileContentSource | EvalJsonlFileIdSource'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.EvalJsonlFileContentSource" /> | <xref
          uid="@azure/ai-projects.EvalJsonlFileIdSource" />
  - name: type
    uid: '@azure/ai-projects.ResponseRetrievalItemGenerationParams.type'
    package: '@azure/ai-projects'
    summary: The type of item generation parameters, always `response_retrieval`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "response_retrieval"'
      return:
        description: ''
        type: '"response_retrieval"'
extends: <xref uid="@azure/ai-projects.ItemGenerationParams" />
