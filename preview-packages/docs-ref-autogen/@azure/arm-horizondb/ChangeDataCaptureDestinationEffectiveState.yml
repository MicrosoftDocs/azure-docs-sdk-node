name: ChangeDataCaptureDestinationEffectiveState
uid: '@azure/arm-horizondb.ChangeDataCaptureDestinationEffectiveState'
package: '@azure/arm-horizondb'
summary: >-
  The effective state of a HorizonDB change data capture destination. \

  [KnownChangeDataCaptureDestinationEffectiveState](xref:@azure/arm-horizondb.KnownChangeDataCaptureDestinationEffectiveState)
  can be used interchangeably with ChangeDataCaptureDestinationEffectiveState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **WaitingForIdentity**: The destination is waiting for a validated active
  identity assignment. \

  **Enabling**: The destination is being enabled. \

  **Enabled**: The destination is enabled. \

  **Disabling**: The destination is being disabled. \

  **Disabled**: The destination is disabled. \

  **Degraded**: The destination is available with reduced functionality or
  impaired health. \

  **Failed**: The destination is not operational because reconciliation failed.
fullName: ChangeDataCaptureDestinationEffectiveState
remarks: ''
isDeprecated: false
syntax: |
  type ChangeDataCaptureDestinationEffectiveState = string
