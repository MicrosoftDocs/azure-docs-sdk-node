### YamlMime:TSType
name: SearchIndexKnowledgeSourceFilterHint
uid: '@azure/search-documents.SearchIndexKnowledgeSourceFilterHint'
package: '@azure/search-documents'
summary: >-
  A hint that identifies a field and exhaustive grounding values the query
  planner can use when constructing a filter.
fullName: SearchIndexKnowledgeSourceFilterHint
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: autoConfiguration
    uid: >-
      @azure/search-documents.SearchIndexKnowledgeSourceFilterHint.autoConfiguration
    package: '@azure/search-documents'
    summary: >-
      Configures the service to resolve grounding values from the field's
      facets. Its presence enables auto-configuration. The field must be
      filterable and facetable. Not supported when the target index has
      document-level permissions or Purview sensitivity labels enabled; this
      restriction is validated at knowledge source create/update and knowledge
      base retrieval time. Mutually exclusive with `fieldValues`. Supported only
      in a knowledge source's stored `queryHints`, not in request-time
      `queryHintOverrides`.
    fullName: autoConfiguration
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        autoConfiguration?:
        SearchIndexKnowledgeSourceFilterHintAutoConfiguration
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/search-documents.SearchIndexKnowledgeSourceFilterHintAutoConfiguration"
          />
  - name: field
    uid: '@azure/search-documents.SearchIndexKnowledgeSourceFilterHint.field'
    package: '@azure/search-documents'
    summary: The name of the filterable search index field.
    fullName: field
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'field: string'
      return:
        description: ''
        type: string
  - name: fieldValues
    uid: '@azure/search-documents.SearchIndexKnowledgeSourceFilterHint.fieldValues'
    package: '@azure/search-documents'
    summary: >-
      The exhaustive set of values for the field. At most 160 values, with a
      maximum of 128 characters per value and 2048 characters combined. In
      versions supporting `autoConfiguration`, required unless
      `autoConfiguration` is specified, and mutually exclusive with it.
    fullName: fieldValues
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'fieldValues?: string[]'
      return:
        description: ''
        type: string[]
  - name: filterInstructions
    uid: >-
      @azure/search-documents.SearchIndexKnowledgeSourceFilterHint.filterInstructions
    package: '@azure/search-documents'
    summary: >-
      Natural-language instructions that explain when and how to filter on the
      field.
    fullName: filterInstructions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'filterInstructions?: string'
      return:
        description: ''
        type: string
