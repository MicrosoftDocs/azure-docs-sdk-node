name: NetworkRuleSetInput
uid: '@azure/provisioning-search.types.NetworkRuleSetInput'
package: '@azure/provisioning-search'
summary: >-
  Input type for Network specific rules that determine how the Azure AI Search
  service may be reached.
fullName: NetworkRuleSetInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: bypass
    uid: '@azure/provisioning-search.types.NetworkRuleSetInput.bypass'
    package: '@azure/provisioning-search'
    summary: >-
      Possible origins of inbound traffic that can bypass the rules defined in
      the 'ipRules' section.
    fullName: bypass
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'bypass?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: ipRules
    uid: '@azure/provisioning-search.types.NetworkRuleSetInput.ipRules'
    package: '@azure/provisioning-search'
    summary: >-
      A list of IP restriction rules that defines the inbound network(s) with
      allowing access to the search service endpoint. At the meantime, all other
      public IP networks are blocked by the firewall. These restriction rules
      are applied only when the 'publicNetworkAccess' of the search service is
      'enabled'; otherwise, traffic over public interface is not allowed even
      with any public IP rules, and private endpoint connections would be the
      exclusive access method.
    fullName: ipRules
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ipRules?: any'
      return:
        description: ''
        type: any
extends: unknown&lt;<xref uid="@azure/provisioning-search.types.NetworkRuleSet" />&gt;
