### YamlMime:TSEnum
name: KnownStorageInitiatorType
uid: '@azure/arm-azurestackhci.KnownStorageInitiatorType'
package: '@azure/arm-azurestackhci'
summary: Transport type of a storage fabric initiator port on the edge machine.
fullName: KnownStorageInitiatorType
remarks: ''
isDeprecated: false
fields:
  - name: FibreChannel
    uid: '@azure/arm-azurestackhci.KnownStorageInitiatorType.FibreChannel'
    package: '@azure/arm-azurestackhci'
    summary: >-
      Fibre Channel initiator. The initiator identifier is the node WWN (WWNN);
      the port is identified by its WWPN.
  - name: IScsi
    uid: '@azure/arm-azurestackhci.KnownStorageInitiatorType.IScsi'
    package: '@azure/arm-azurestackhci'
    summary: >-
      iSCSI initiator. The initiator identifier is an IQN (iSCSI Qualified
      Name).
  - name: Unknown
    uid: '@azure/arm-azurestackhci.KnownStorageInitiatorType.Unknown'
    package: '@azure/arm-azurestackhci'
    summary: The initiator transport type could not be determined.
