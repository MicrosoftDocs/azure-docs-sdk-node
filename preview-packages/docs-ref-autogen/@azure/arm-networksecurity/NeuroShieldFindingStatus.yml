### YamlMime:TSTypeAlias
name: NeuroShieldFindingStatus
uid: '@azure/arm-networksecurity.NeuroShieldFindingStatus'
package: '@azure/arm-networksecurity'
summary: >-
  Runtime operational status for findings. \

  [KnownNeuroShieldFindingStatus](xref:@azure/arm-networksecurity.KnownNeuroShieldFindingStatus)
  can be used interchangeably with NeuroShieldFindingStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AwaitingApproval**: Candidate mitigations were generated and are waiting for
  explicit approval. \

  **Active**: No mitigation has resolved the finding yet. \

  **MitigationInProgress**: One or more mitigation actions are currently
  running. \

  **Mitigated**: The finding has at least one successful mitigation. \

  **Skipped**: Pre-execution validation determined that the vulnerability is no
  longer present. \

  **MitigationsExhausted**: All mitigations were attempted without successful
  resolution. \

  **Unreachable**: Mitigation execution is blocked by communication failure.
fullName: NeuroShieldFindingStatus
remarks: ''
isDeprecated: false
syntax: |
  type NeuroShieldFindingStatus = string
