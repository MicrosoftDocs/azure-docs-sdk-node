### YamlMime:TSTypeAlias
name: GetFeatureFlagResponse
uid: '@azure/app-configuration.GetFeatureFlagResponse'
package: '@azure/app-configuration'
summary: >-
  Response from retrieving a feature flag through the dedicated feature flag
  endpoint.


  When a conditional request is made with `onlyIfChanged` and the feature flag
  has

  not changed, the service responds with a 304 status and an otherwise empty
  body. In

  that case `statusCode` is `304` and the feature flag fields (other than
  `name`) are

  left unset.
fullName: GetFeatureFlagResponse
remarks: ''
isDeprecated: false
syntax: |
  type GetFeatureFlagResponse =
    | (FeatureFlag &
        SyncTokenHeaderField &
        HttpResponseField<SyncTokenHeaderField> & { statusCode: 200 })
    | (Pick<FeatureFlag, "name"> &
        Partial<Omit<FeatureFlag, "name">> &
        SyncTokenHeaderField &
        HttpResponseField<SyncTokenHeaderField> & { statusCode: 304 })
