### YamlMime:TSTypeAlias
name: BlobAccessPointTlsVerification
uid: '@azure/arm-storage.BlobAccessPointTlsVerification'
package: '@azure/arm-storage'
summary: >-
  TLS certificate verification behavior. \

  [KnownBlobAccessPointTlsVerification](xref:@azure/arm-storage.KnownBlobAccessPointTlsVerification)
  can be used interchangeably with BlobAccessPointTlsVerification,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Perform**: Verify the TLS certificate chain. \

  **Skip**: Skip TLS certificate-chain verification. Use only when the backing
  source uses a certificate that cannot be validated against a trusted root.
  Skipping verification exposes credentials and data to an on-path attacker.
fullName: BlobAccessPointTlsVerification
remarks: ''
isDeprecated: false
syntax: |
  type BlobAccessPointTlsVerification = string
