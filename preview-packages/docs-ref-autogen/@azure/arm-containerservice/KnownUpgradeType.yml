### YamlMime:TSEnum
name: KnownUpgradeType
uid: '@azure/arm-containerservice.KnownUpgradeType'
package: '@azure/arm-containerservice'
summary: >-
  The type of upgrade an upgrade insight evaluates. Each upgrade insight
  resource

  represents exactly one of these scopes; the scope is encoded in the resource
  name.
fullName: KnownUpgradeType
remarks: ''
isDeprecated: false
fields:
  - name: AgentPool
    uid: '@azure/arm-containerservice.KnownUpgradeType.AgentPool'
    package: '@azure/arm-containerservice'
    summary: An agent pool (node pool) Kubernetes version upgrade.
  - name: ControlPlane
    uid: '@azure/arm-containerservice.KnownUpgradeType.ControlPlane'
    package: '@azure/arm-containerservice'
    summary: The control plane (managed cluster) Kubernetes version upgrade.
  - name: ControlPlaneAndAgentPools
    uid: '@azure/arm-containerservice.KnownUpgradeType.ControlPlaneAndAgentPools'
    package: '@azure/arm-containerservice'
    summary: >-
      A combined evaluation of the control plane plus every agent pool for a
      single target Kubernetes version. This scope covers Kubernetes version
      upgrades only; node OS image upgrades are not included and must be
      evaluated separately using the NodeImage scope.
  - name: NodeImage
    uid: '@azure/arm-containerservice.KnownUpgradeType.NodeImage'
    package: '@azure/arm-containerservice'
    summary: >-
      An agent pool node OS image upgrade. NodeImage upgrade insights are
      evaluated per agent pool, mirroring the per-pool node-image upgrade API
      (.../agentPools/{name}), and cover the node OS image only; agent-pool
      Kubernetes version readiness is evaluated separately via the AgentPool or
      ControlPlaneAndAgentPools scopes.
