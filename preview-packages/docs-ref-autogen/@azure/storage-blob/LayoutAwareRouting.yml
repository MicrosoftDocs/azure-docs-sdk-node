### YamlMime:TSTypeAlias
name: LayoutAwareRouting
uid: '@azure/storage-blob.LayoutAwareRouting'
package: '@azure/storage-blob'
summary: >-
  Whether a download may route its range requests to the endpoints that
  physically hold them, as

  reported by Get Blob Layout.


  `auto` leaves the choice to the SDK, which today resolves to `disabled` and
  may change in a later

  version. Set `enabled` to opt in.
fullName: LayoutAwareRouting
remarks: ''
isDeprecated: false
syntax: |
  type LayoutAwareRouting = "auto" | "enabled" | "disabled"
