### YamlMime:TSEnum
name: KnownOriginAuthenticationTokenDestinationHeader
uid: '@azure/arm-cdn.KnownOriginAuthenticationTokenDestinationHeader'
package: '@azure/arm-cdn'
summary: >-
  The HTTP request header where the origin authentication token is placed when
  forwarding the request to the origin.
fullName: KnownOriginAuthenticationTokenDestinationHeader
remarks: ''
isDeprecated: false
fields:
  - name: Authorization
    uid: >-
      @azure/arm-cdn.KnownOriginAuthenticationTokenDestinationHeader.Authorization
    package: '@azure/arm-cdn'
    summary: >-
      Place the token in the standard `Authorization` request header (default
      behavior).
  - name: XAzureAuthorization
    uid: >-
      @azure/arm-cdn.KnownOriginAuthenticationTokenDestinationHeader.XAzureAuthorization
    package: '@azure/arm-cdn'
    summary: >-
      Place the token in the `X-Azure-Authorization` request header to avoid
      conflicts with an existing `Authorization` header set by the client.
