### YamlMime:TSTypeAlias
name: VolumeSourceType
uid: '@azure/arm-purestorageblock.VolumeSourceType'
package: '@azure/arm-purestorageblock'
summary: >-
  Source type for volume creation \

  [KnownVolumeSourceType](xref:@azure/arm-purestorageblock.KnownVolumeSourceType)
  can be used interchangeably with VolumeSourceType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **none**: No source; create an empty volume with the specified provisioned
  size \

  **volume**: Clone from an existing volume \

  **serialNumber**: Import a volume by its serial number \

  **snapshot**: Restore from a volume group snapshot \

  **recoverableVolume**: Recover a soft-deleted volume within the same volume
  group
fullName: VolumeSourceType
remarks: ''
isDeprecated: false
syntax: |
  type VolumeSourceType = string
