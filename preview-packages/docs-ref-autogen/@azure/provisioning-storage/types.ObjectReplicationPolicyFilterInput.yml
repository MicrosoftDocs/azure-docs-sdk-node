### YamlMime:TSType
name: ObjectReplicationPolicyFilterInput
uid: '@azure/provisioning-storage.types.ObjectReplicationPolicyFilterInput'
package: '@azure/provisioning-storage'
summary: >-
  Input type for Filters limit replication to a subset of blobs within the
  storage account. A logical OR is performed on values in the filter. If
  multiple filters are defined, a logical AND is performed on all filters.
fullName: ObjectReplicationPolicyFilterInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: minCreationTime
    uid: >-
      @azure/provisioning-storage.types.ObjectReplicationPolicyFilterInput.minCreationTime
    package: '@azure/provisioning-storage'
    summary: >-
      Blobs created after the time will be replicated to the destination. It
      must be in datetime format 'yyyy-MM-ddTHH:mm:ssZ'. Example:
      2020-02-19T16:05:00Z
    fullName: minCreationTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'minCreationTime?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: prefixMatch
    uid: >-
      @azure/provisioning-storage.types.ObjectReplicationPolicyFilterInput.prefixMatch
    package: '@azure/provisioning-storage'
    summary: >-
      Optional. Filters the results to replicate only blobs whose names begin
      with the specified prefix.
    fullName: prefixMatch
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'prefixMatch?: any'
      return:
        description: ''
        type: any
extends: >-
  unknown&lt;<xref
  uid="@azure/provisioning-storage.types.ObjectReplicationPolicyFilter" />&gt;
