### YamlMime:TSType
name: AgentOptimizationFixedTraceWindow
uid: '@azure/ai-projects.AgentOptimizationFixedTraceWindow'
package: '@azure/ai-projects'
summary: >-
  Selects the latest readable trace conversations in a half-open interval,
  independently of feedback availability.
fullName: AgentOptimizationFixedTraceWindow
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: end_time
    uid: '@azure/ai-projects.AgentOptimizationFixedTraceWindow.end_time'
    package: '@azure/ai-projects'
    summary: >-
      Exclusive UTC Unix timestamp in seconds. A future value is truncated to
      job submission time, and the effective end is returned in the job
      configuration. The service does not wait for future traces.
    fullName: end_time
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'end_time: Date'
      return:
        description: ''
        type: Date
  - name: max_traces
    uid: '@azure/ai-projects.AgentOptimizationFixedTraceWindow.max_traces'
    package: '@azure/ai-projects'
    summary: >-
      Maximum number of trace conversations to select, from 1 to 100 inclusive.
      If omitted, the service defaults to 100. Selects the latest matching
      readable traces before collecting their annotations or evaluation results;
      feedback availability does not affect selection priority.
    fullName: max_traces
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_traces?: number'
      return:
        description: ''
        type: number
  - name: start_time
    uid: '@azure/ai-projects.AgentOptimizationFixedTraceWindow.start_time'
    package: '@azure/ai-projects'
    summary: >-
      Inclusive UTC Unix timestamp in seconds, at or after the Unix epoch. Must
      precede the effective end_time after truncation to job submission time.
      The service rejects empty or inverted effective intervals.
    fullName: start_time
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'start_time: Date'
      return:
        description: ''
        type: Date
  - name: type
    uid: '@azure/ai-projects.AgentOptimizationFixedTraceWindow.type'
    package: '@azure/ai-projects'
    summary: Fixed-window discriminator.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "fixed"'
      return:
        description: ''
        type: '"fixed"'
extends: <xref uid="@azure/ai-projects.AgentOptimizationTraceWindow" />
