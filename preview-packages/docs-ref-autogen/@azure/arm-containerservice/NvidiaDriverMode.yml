name: NvidiaDriverMode
uid: '@azure/arm-containerservice.NvidiaDriverMode'
package: '@azure/arm-containerservice'
summary: >-
  NVIDIA GPU resource allocation mode. \

  [KnownNvidiaDriverMode](xref:@azure/arm-containerservice.KnownNvidiaDriverMode)
  can be used interchangeably with NvidiaDriverMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **DevicePlugin**: NVIDIA Kubernetes device plugin is installed on the nodes
  for resource allocation and scheduling. \

  **DRA**: NVIDIA Device Resource Allocation (DRA) driver is installed on the
  nodes for resource allocation and scheduling.
