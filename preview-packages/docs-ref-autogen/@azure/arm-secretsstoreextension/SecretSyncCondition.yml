### YamlMime:TSType
name: SecretSyncCondition
uid: '@azure/arm-secretsstoreextension.SecretSyncCondition'
package: '@azure/arm-secretsstoreextension'
summary: A condition represents the status of the secret create and update processes.
fullName: SecretSyncCondition
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: lastTransitionTime
    uid: '@azure/arm-secretsstoreextension.SecretSyncCondition.lastTransitionTime'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      LastTransitionTime is the last time the condition transitioned from one
      status to another. This should be when the underlying condition changed.
      If that is not known, then using the time when the API field changed is
      acceptable.
    fullName: lastTransitionTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastTransitionTime?: Date'
      return:
        description: ''
        type: Date
  - name: message
    uid: '@azure/arm-secretsstoreextension.SecretSyncCondition.message'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      Message is a human readable message indicating details about the
      transition. This may be an empty string.
    fullName: message
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'message: string'
      return:
        description: ''
        type: string
  - name: observedGeneration
    uid: '@azure/arm-secretsstoreextension.SecretSyncCondition.observedGeneration'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      ObservedGeneration represents the .metadata.generation that the condition
      was set based upon. For instance, if .metadata.generation is currently 12,
      but the .status.conditions[x].observedGeneration is 9, the condition is
      out of date with respect to the current state of the instance.
    fullName: observedGeneration
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'observedGeneration?: number'
      return:
        description: ''
        type: number
  - name: reason
    uid: '@azure/arm-secretsstoreextension.SecretSyncCondition.reason'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      Reason contains a programmatic identifier indicating the reason for the
      condition's last transition. Producers of specific condition types may
      define expected values and meanings for this field, and whether the values
      are considered a guaranteed API. The value should be a CamelCase string.
      This field may not be empty.
    fullName: reason
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'reason: string'
      return:
        description: ''
        type: string
  - name: status
    uid: '@azure/arm-secretsstoreextension.SecretSyncCondition.status'
    package: '@azure/arm-secretsstoreextension'
    summary: Status of the condition, one of True, False, Unknown.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-secretsstoreextension.SecretSyncCondition.type'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      Type of condition in CamelCase or in foo.example.com/CamelCase. Many
      .condition.type values are consistent across resources like Available, but
      because arbitrary conditions can be useful (see .node.status.conditions),
      the ability to de-conflict is important. The regex it matches is
      (dns1123SubdomainFmt/)?(qualifiedNameFmt)
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: string'
      return:
        description: ''
        type: string
