### YamlMime:TSEnum
name: KnownUpgradeInsightStatus
uid: '@azure/arm-containerservice.KnownUpgradeInsightStatus'
package: '@azure/arm-containerservice'
summary: >-
  The overall status of an upgrade insight readiness evaluation. This is an
  aggregation of the

  per-issue `severity` values in `detectedIssues`: any `Blocking` issue ⇒
  `Failed`;

  otherwise any `Warning` issue ⇒ `Warning`; otherwise (no issues) ⇒ `Passed`.
  The

  scope-level vocabulary here (Passed/Warning/Failed) intentionally differs from
  the

  issue-level `UpgradeIssueSeverity` (Blocking/Warning): a `Blocking` issue maps
  to

  a `Failed` status, while `Warning` maps through unchanged.
fullName: KnownUpgradeInsightStatus
remarks: ''
isDeprecated: false
fields:
  - name: Failed
    uid: '@azure/arm-containerservice.KnownUpgradeInsightStatus.Failed'
    package: '@azure/arm-containerservice'
    summary: >-
      The evaluation found one or more blocking issues that will prevent the
      upgrade from completing until they are resolved. This reflects the
      readiness result, not a failure of the compute operation itself (that is
      conveyed by provisioningState).
  - name: Passed
    uid: '@azure/arm-containerservice.KnownUpgradeInsightStatus.Passed'
    package: '@azure/arm-containerservice'
    summary: >-
      The evaluation completed and no upgrade issues were found for the target
      version; the scope appears ready to upgrade.
  - name: Warning
    uid: '@azure/arm-containerservice.KnownUpgradeInsightStatus.Warning'
    package: '@azure/arm-containerservice'
    summary: >-
      The evaluation found one or more non-blocking warnings; the upgrade is
      expected to succeed but the warnings should be reviewed.
