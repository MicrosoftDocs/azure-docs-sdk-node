### YamlMime:TSTypeAlias
name: SessionPoolIdentityLifeCycle
uid: '@azure/arm-appcontainers.SessionPoolIdentityLifeCycle'
package: '@azure/arm-appcontainers'
summary: >-
  Use to select the lifecycle stages of a Session Pool during which the Managed
  Identity should be available. \

  [KnownSessionPoolIdentityLifeCycle](xref:@azure/arm-appcontainers.KnownSessionPoolIdentityLifeCycle)
  can be used interchangeably with SessionPoolIdentityLifeCycle,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: Do not use managed identity during any lifecycle stage. \

  **Main**: Use managed identity during the main stage of the Container App
  lifecycle.
fullName: SessionPoolIdentityLifeCycle
remarks: ''
isDeprecated: false
syntax: |
  type SessionPoolIdentityLifeCycle = string
