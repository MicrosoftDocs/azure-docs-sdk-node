  - name: createOrUpdate
    uid: '@azure/arm-cognitiveservices.AttachedAksClustersOperations.createOrUpdate'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Attaches an existing AKS cluster to the account, or updates its
      attachment.

      A 202 response contains the current attachment; poll GET and inspect

      properties.status.stage for progress. A 200 response also contains the

      current attachment state and does not by itself guarantee workload
      readiness.
    fullName: createOrUpdate
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        createOrUpdate: (resourceGroupName: string, accountName: string,
        attachedAksClusterName: string, resource: AttachedAksCluster, options?:
        AttachedAksClustersCreateOrUpdateOptionalParams) =>
        Promise<AttachedAksCluster>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, accountName: string,
          attachedAksClusterName: string, resource: AttachedAksCluster,
          options?: AttachedAksClustersCreateOrUpdateOptionalParams) =&gt;
          Promise&lt;AttachedAksCluster&gt;
  - name: delete
    uid: '@azure/arm-cognitiveservices.AttachedAksClustersOperations.delete'
    package: '@azure/arm-cognitiveservices'
    summary: |-
      Detaches an AKS cluster while retaining the physical AKS and AI Manager
      resources. A 202 response contains the current attachment; poll GET until
      the attachment is no longer found. A 204 response indicates that the
      attachment has been removed or did not exist.
    fullName: delete
    remarks: ''
    isDeprecated: false
    syntax:
