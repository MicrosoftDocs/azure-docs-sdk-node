name: RaiAcsAnnotatorType
uid: '@azure/arm-cognitiveservices.RaiAcsAnnotatorType'
package: '@azure/arm-cognitiveservices'
summary: >-
  Extensible kinds of Agent Control Specification annotator dispatchers. \

  [KnownRaiAcsAnnotatorType](xref:@azure/arm-cognitiveservices.KnownRaiAcsAnnotatorType)
  can be used interchangeably with RaiAcsAnnotatorType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **classifier**: Obtains annotations from a classifier dispatcher. \

  **llm**: Obtains annotations from a language-model dispatcher. \

  **endpoint**: Obtains annotations from an external endpoint dispatcher.
