name: ManifestCheckinOption
uid: '@azure/arm-providerhub.ManifestCheckinOption'
package: '@azure/arm-providerhub'
summary: >-
  The manifest checkin option. \

  [KnownManifestCheckinOption](xref:@azure/arm-providerhub.KnownManifestCheckinOption)
  can be used interchangeably with ManifestCheckinOption,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AttemptAutomaticManifestCheckin**: Attempt an automatic manifest checkin as
  part of the rollout. \

  **DoNotAttemptAutomaticManifestCheckin**: Do not attempt an automatic manifest
  checkin as part of the rollout.
