name: DrillReportGenerationStatus
uid: '@azure/arm-resiliencemanagement.DrillReportGenerationStatus'
package: '@azure/arm-resiliencemanagement'
summary: >-
  Report generation status. \

  [KnownDrillReportGenerationStatus](xref:@azure/arm-resiliencemanagement.KnownDrillReportGenerationStatus)
  can be used interchangeably with DrillReportGenerationStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotStarted**: Report generation has not been attempted yet. \

  **InProgress**: Report generation is currently running. \

  **Succeeded**: Report generation completed successfully. \

  **Failed**: Report generation failed. Details are captured in the lastError
  field.
fullName: DrillReportGenerationStatus
remarks: ''
isDeprecated: false
syntax: |
  type DrillReportGenerationStatus = string
