name: SkuMixPlacementZonalDistributionStrategy
uid: '@azure/arm-computerecommender.SkuMixPlacementZonalDistributionStrategy'
package: '@azure/arm-computerecommender'
summary: >-
  Strategy for distributing capacity across availability zones. \

  [KnownSkuMixPlacementZonalDistributionStrategy](xref:@azure/arm-computerecommender.KnownSkuMixPlacementZonalDistributionStrategy)
  can be used interchangeably with SkuMixPlacementZonalDistributionStrategy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **BestEffortBalanced**: Capacity distributed across zones on a best-effort
  balanced basis. \

  **Prioritized**: Zones filled based on zone preferences/rank. Higher priority
  zones filled first. \

  **BestEffortSingleZone**: Capacity allocated within a single zone on a
  best-effort basis; may spill across zones if single-zone capacity is
  insufficient.
fullName: SkuMixPlacementZonalDistributionStrategy
remarks: ''
isDeprecated: false
