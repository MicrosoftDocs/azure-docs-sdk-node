### YamlMime:TSTypeAlias
name: LinkingState
uid: '@azure/arm-deviceprovisioningservices.LinkingState'
package: '@azure/arm-deviceprovisioningservices'
summary: >-
  The state of ADR linking for a provisioning service. \

  [KnownLinkingState](xref:@azure/arm-deviceprovisioningservices.KnownLinkingState)
  can be used interchangeably with LinkingState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotLinked**: The provisioning service is not linked to a Device Registry
  namespace. \

  **InProgress**: The linking process is in progress. \

  **Succeeded**: The linking process succeeded. \

  **Orphaned**: The linked Device Registry namespace no longer exists.
fullName: LinkingState
remarks: ''
isDeprecated: false
syntax: |
  type LinkingState = string
