### YamlMime:TSTypeAlias
name: WorkspaceEvaluationStatus
uid: '@azure/arm-chaos.WorkspaceEvaluationStatus'
package: '@azure/arm-chaos'
summary: >-
  Enum of the workspace evaluation status. \

  [KnownWorkspaceEvaluationStatus](xref:@azure/arm-chaos.KnownWorkspaceEvaluationStatus)
  can be used interchangeably with WorkspaceEvaluationStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Pending**: The evaluation is pending and has not started. \

  **Queued**: The evaluation has been accepted and is queued for execution. \

  **InProgress**: The evaluation is in progress. \

  **Succeeded**: The evaluation completed successfully. \

  **PartiallySucceeded**: Unless cancellation won terminal settlement, at least
  one template applicability test completed and at least one failed or was
  canceled. Discovery completeness does not determine this processing status.
  The first terminal settlement is authoritative; a later cancellation does not
  replace it. \

  **Failed**: No template applicability test completed and at least one failed,
  unless cancellation won terminal settlement. The accepted resource snapshot
  and discovery result reference remain present; an admission failure creates no
  evaluation result. \

  **Canceled**: Cancellation won terminal settlement, or all admitted template
  tests were canceled. Previously recorded outcomes may remain. A later callback
  cannot replace this terminal result, and cancellation cannot replace an
  already settled result.
fullName: WorkspaceEvaluationStatus
remarks: ''
isDeprecated: false
syntax: |
  type WorkspaceEvaluationStatus = string
