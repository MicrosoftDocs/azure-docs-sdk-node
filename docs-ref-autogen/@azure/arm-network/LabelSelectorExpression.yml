### YamlMime:TSType
name: LabelSelectorExpression
uid: '@azure/arm-network.LabelSelectorExpression'
package: '@azure/arm-network'
summary: >-
  A label selector requirement is a selector that contains values, a key, and an
  operator that

  relates the key and values.
fullName: LabelSelectorExpression
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: key
    uid: '@azure/arm-network.LabelSelectorExpression.key'
    package: '@azure/arm-network'
    summary: >-
      key is a string of 63 characters or less, and must consist of alphanumeric
      characters,

      '-', '_' or '.'.
    fullName: key
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'key?: string'
      return:
        description: ''
        type: string
  - name: operator
    uid: '@azure/arm-network.LabelSelectorExpression.operator'
    package: '@azure/arm-network'
    summary: |-
      operator represents a key's relationship to a set of values.
      Valid operators are In, NotIn, Exists and DoesNotExist.
    fullName: operator
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'operator?: string'
      return:
        description: ''
        type: string
  - name: values
    uid: '@azure/arm-network.LabelSelectorExpression.values'
    package: '@azure/arm-network'
    summary: >-
      values is an array of string values. If the operator is In or NotIn,

      the values array must be non-empty. If the operator is Exists or
      DoesNotExist,

      the values array must be empty.
    fullName: values
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'values?: string[]'
      return:
        description: ''
        type: string[]
