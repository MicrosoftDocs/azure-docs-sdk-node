### YamlMime:TSType
name: PropertyShape
uid: '@azure/provisioning-core.PropertyShape'
package: '@azure/provisioning-core'
summary: A single property's shape entry.
fullName: PropertyShape
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: armPath
    uid: '@azure/provisioning-core.PropertyShape.armPath'
    package: '@azure/provisioning-core'
    summary: |-
      ARM wire path from the owning model's root to this property.
      Single-segment for direct properties; multi-segment for properties
      hoisted through one or more `@flattenProperty` wrappers.
    fullName: armPath
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'armPath: readonly string[]'
      return:
        description: ''
        type: readonly string[]
  - name: readOnly
    uid: '@azure/provisioning-core.PropertyShape.readOnly'
    package: '@azure/provisioning-core'
    summary: |-
      `true` when ARM treats this property as server-set (visible in GET
      responses but rejected on PUT). Omitted (i.e. `undefined`/`false`)
      for writable properties.

      Currently consumed by the `Resource` constructor's deployment-context
      inheritance to skip readonly properties (notably `location` on many
      child resources where the field exists in the read model only).
    fullName: readOnly
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'readOnly?: boolean'
      return:
        description: ''
        type: boolean
  - name: value
    uid: '@azure/provisioning-core.PropertyShape.value'
    package: '@azure/provisioning-core'
    summary: >-
      Describes this property's value for navigation and wire conversion.

      Model and container shapes recurse into nested values; a

      [TerminalValueShape](xref:@azure/provisioning-core.TerminalValueShape)
      explicitly terminates recursion. Scalar

      terminal shapes carry only the encodings valid for their client-side

      JavaScript representation.
    fullName: value
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'value: ValueShape'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.ValueShape" />
