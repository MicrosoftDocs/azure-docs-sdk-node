### YamlMime:TSType
name: AgentOptimizationEvaluationConfiguration
uid: '@azure/ai-projects.AgentOptimizationEvaluationConfiguration'
package: '@azure/ai-projects'
summary: Reusable quality-measurement configuration.
fullName: AgentOptimizationEvaluationConfiguration
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: evaluation_model
    uid: >-
      @azure/ai-projects.AgentOptimizationEvaluationConfiguration.evaluation_model
    package: '@azure/ai-projects'
    summary: >-
      Model configuration used by model-based evaluators and conversation
      simulation.
    fullName: evaluation_model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluation_model: EvaluationModelConfiguration'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluationModelConfiguration" />
  - name: evaluators
    uid: '@azure/ai-projects.AgentOptimizationEvaluationConfiguration.evaluators'
    package: '@azure/ai-projects'
    summary: Evaluator references used to score candidate quality.
    fullName: evaluators
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluators: AgentOptimizationEvaluator[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationEvaluator" />[]
  - name: max_concurrent_agent_runs
    uid: >-
      @azure/ai-projects.AgentOptimizationEvaluationConfiguration.max_concurrent_agent_runs
    package: '@azure/ai-projects'
    summary: >-
      Maximum number of target-agent runs executed concurrently during each
      single-turn evaluation. If omitted, the service defaults to 1.
      Conversation evaluation supports only 1.
    fullName: max_concurrent_agent_runs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_concurrent_agent_runs?: number'
      return:
        description: ''
        type: number
  - name: training_set
    uid: '@azure/ai-projects.AgentOptimizationEvaluationConfiguration.training_set'
    package: '@azure/ai-projects'
    summary: >-
      Evaluation set used to guide the optimization search. Inline data supports
      up to 2,000 test cases when a separate validation set is supplied;
      otherwise it is also used for validation and is limited to 500.
    fullName: training_set
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'training_set: AgentOptimizationEvaluationSetUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationEvaluationSetUnion" />
  - name: validation_set
    uid: '@azure/ai-projects.AgentOptimizationEvaluationConfiguration.validation_set'
    package: '@azure/ai-projects'
    summary: >-
      Held-out evaluation set used for full candidate evaluation, limited to 500
      inline test cases. The training set is reused and subject to the same
      500-test-case validation limit when omitted.
    fullName: validation_set
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'validation_set?: AgentOptimizationEvaluationSetUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationEvaluationSetUnion" />
