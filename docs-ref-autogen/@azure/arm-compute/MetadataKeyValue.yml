properties:
  - name: metadataKey
    uid: '@azure/arm-compute.MetadataKeyValue.metadataKey'
    package: '@azure/arm-compute'
    summary: >-
      The metadata key. Known keys emitted by the service include
      'Linux.AzureSecretsProvisioning.Enabled', 'OS.Name', and
      '{componentName}.Version' (e.g., 'AzureGuestAgent.Version'). All values
      are non-sensitive configuration; no secrets, credentials, or cryptographic
      material transit this field.
