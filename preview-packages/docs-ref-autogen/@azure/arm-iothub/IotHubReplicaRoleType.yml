### YamlMime:TSTypeAlias
name: IotHubReplicaRoleType
uid: '@azure/arm-iothub.IotHubReplicaRoleType'
package: '@azure/arm-iothub'
summary: >-
  The role of the region, can be either primary or secondary. The primary region
  is where the IoT hub is currently provisioned. The secondary region is the
  Azure disaster recovery (DR) paired region and also the region where the IoT
  hub can failover to. \

  [KnownIotHubReplicaRoleType](xref:@azure/arm-iothub.KnownIotHubReplicaRoleType)
  can be used interchangeably with IotHubReplicaRoleType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **primary**: primary \

  **secondary**: secondary
fullName: IotHubReplicaRoleType
remarks: ''
isDeprecated: false
syntax: |
  type IotHubReplicaRoleType = string
