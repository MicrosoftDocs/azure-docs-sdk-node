### YamlMime:TSTypeAlias
name: AgenticSearchTerminationReason
uid: '@azure/search-documents.AgenticSearchTerminationReason'
package: '@azure/search-documents'
summary: >-
  Why agentic processing stopped. Non-model failures retain their existing error
  details and HTTP status. \

  [KnownAgenticSearchTerminationReason](xref:@azure/search-documents.KnownAgenticSearchTerminationReason)
  can be used interchangeably with AgenticSearchTerminationReason,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **modelStopped**: Processing completed normally after a valid model stop or a
  service-owned iteration bound. This does not guarantee complete evidence. \

  **maxRuntimeExceeded**: The request deadline ended agentic processing before a
  valid stop. \

  **modelFailed**: Agentic model processing failed before a valid model stop.
fullName: AgenticSearchTerminationReason
remarks: ''
isDeprecated: false
syntax: |
  type AgenticSearchTerminationReason = string
