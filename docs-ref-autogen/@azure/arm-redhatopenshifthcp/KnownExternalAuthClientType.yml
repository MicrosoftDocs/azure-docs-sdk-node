### YamlMime:TSEnum
name: KnownExternalAuthClientType
uid: '@azure/arm-redhatopenshifthcp.KnownExternalAuthClientType'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  Representation of the possible values of an external authentication client's
  type
fullName: KnownExternalAuthClientType
remarks: ''
isDeprecated: false
fields:
  - name: Confidential
    uid: '@azure/arm-redhatopenshifthcp.KnownExternalAuthClientType.Confidential'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      Indicates that the client is confidential.
      Confidential clients must provide a client secret.
      The secret should be provided within the cluster itself.
  - name: Public
    uid: '@azure/arm-redhatopenshifthcp.KnownExternalAuthClientType.Public'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      Indicates that the client is public.
      Public clients must not provide a client secret.
