      return:
        description: ''
        type: >-
          (resourceGroupName: string, workspaceName: string, evaluationName:
          string, options?: WorkspaceEvaluationsGetOptionalParams) =&gt;
          Promise&lt;WorkspaceEvaluation&gt;
  - name: list
    uid: '@azure/arm-chaos.WorkspaceEvaluationsOperations.list'
    package: '@azure/arm-chaos'
    summary: >-
      Lists retained GA template evaluations under the workspace. Each result
      has its canonical ID; latest is an alias and is not a separate collection
      entry. This operation does not extend retention or convert scenario-backed
      legacy evaluations.
    fullName: list
    remarks: ''
    isDeprecated: false
