### YamlMime:TSTypeAlias
name: ReservationState
uid: '@azure/arm-compute.ReservationState'
package: '@azure/arm-compute'
summary: >-
  The current state of a Future capacity reservation. \

  [KnownReservationState](xref:@azure/arm-compute.KnownReservationState) can be
  used interchangeably with ReservationState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Pending**: The capacity reservation request has been submitted and is
  awaiting evaluation. \

  **Declined**: The capacity reservation request was rejected, and will not
  change again without user action. \

  **Approved**: The capacity reservation request has been approved by Azure and
  is awaiting fulfillment. \

  **FulfillmentFailed**: A failure occurred while attempting to fulfill the
  capacity reservation request. \

  **Committed**: The capacity reservation is locked and cannot be updated or
  deleted prior to going live. \

  **Live**: The capacity reservation is active and available for use, and cannot
  be modified or deleted until the minimum commitment period has elapsed. \

  **PartiallyFulfilled**: Azure was only able to deliver a portion of the
  requested capacity. The capacity reservation cannot be modified or deleted
  until the minimum commitment period has elapsed. The portion of fulfilled
  capacity can be viewed by inspecting the capacity reservation's instance view,
  displayed as currentCapacity within the utilizationInfo.
fullName: ReservationState
remarks: ''
isDeprecated: false
syntax: |
  type ReservationState = string
