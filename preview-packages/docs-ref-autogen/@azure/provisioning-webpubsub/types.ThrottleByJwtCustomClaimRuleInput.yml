name: ThrottleByJwtCustomClaimRuleInput
uid: '@azure/provisioning-webpubsub.types.ThrottleByJwtCustomClaimRuleInput'
package: '@azure/provisioning-webpubsub'
summary: Input type for Throttle the client connection by a custom JWT claim
fullName: ThrottleByJwtCustomClaimRuleInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: claimName
    uid: >-
      @azure/provisioning-webpubsub.types.ThrottleByJwtCustomClaimRuleInput.claimName
    package: '@azure/provisioning-webpubsub'
    summary: >-
      The name of the claim in the JWT token. The client connection with the
      same claim value will be aggregated. If the claim is not found in the
      token, the connection will be allowed.
    fullName: claimName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'claimName: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: maxCount
    uid: >-
      @azure/provisioning-webpubsub.types.ThrottleByJwtCustomClaimRuleInput.maxCount
    package: '@azure/provisioning-webpubsub'
    summary: >-
      Maximum connection count allowed for the same Jwt claim value. Clients
      with the same Jwt claim will get rejected if the connection count exceeds
      this value. Default value is 20.
    fullName: maxCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxCount?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
