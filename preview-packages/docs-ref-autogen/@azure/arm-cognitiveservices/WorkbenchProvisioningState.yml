name: WorkbenchProvisioningState
uid: '@azure/arm-cognitiveservices.WorkbenchProvisioningState'
package: '@azure/arm-cognitiveservices'
summary: >-
  Provisioning state of a workbench resource, independent of runtime lifecycle
  status. \

  [KnownWorkbenchProvisioningState](xref:@azure/arm-cognitiveservices.KnownWorkbenchProvisioningState)
  can be used interchangeably with WorkbenchProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Creating**: The workbench resource is being created. \

  **Succeeded**: The workbench resource has been provisioned. \

  **Failed**: Provisioning of the workbench resource failed. \

  **Canceled**: Provisioning of the workbench resource was canceled.
