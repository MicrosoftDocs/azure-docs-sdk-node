### YamlMime:TSTypeAlias
name: WorkspaceLifecycleStatus
uid: '@azure/arm-koreaiartemis.WorkspaceLifecycleStatus'
package: '@azure/arm-koreaiartemis'
summary: >-
  Lifecycle status of a Workspace as reported by the Kore partner. \

  [KnownWorkspaceLifecycleStatus](xref:@azure/arm-koreaiartemis.KnownWorkspaceLifecycleStatus)
  can be used interchangeably with WorkspaceLifecycleStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **active**: Workspace is active and operational. \

  **suspended**: Workspace is suspended; operations are blocked but resource is
  retained. \

  **archived**: Workspace is archived (delete pending).
fullName: WorkspaceLifecycleStatus
remarks: ''
isDeprecated: false
syntax: |
  type WorkspaceLifecycleStatus = string
