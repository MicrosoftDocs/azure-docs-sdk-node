### YamlMime:TSTypeAlias
name: ContextLengthSource
uid: '@azure/arm-aiinfraoptimization.ContextLengthSource'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  Where a context length was resolved from. \

  [KnownContextLengthSource](xref:@azure/arm-aiinfraoptimization.KnownContextLengthSource)
  can be used interchangeably with ContextLengthSource,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Request**: The context length is the sum of the request's
  `workload.tokenBudget.promptTokens` and `maxOutputTokens`. \

  **Default**: No token budget was supplied, so the service default context
  length was used.
fullName: ContextLengthSource
remarks: ''
isDeprecated: false
syntax: |
  type ContextLengthSource = string
