### YamlMime:TSType
name: PlatformProfile
uid: '@azure/arm-redhatopenshifthcp.PlatformProfile'
package: '@azure/arm-redhatopenshifthcp'
summary: Azure specific configuration
fullName: PlatformProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: issuerUrl
    uid: '@azure/arm-redhatopenshifthcp.PlatformProfile.issuerUrl'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      URL for the OIDC provider to be used for authentication
      to authenticate against user Azure cloud account
    fullName: issuerUrl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'issuerUrl: string'
      return:
        description: ''
        type: string
  - name: managedResourceGroup
    uid: '@azure/arm-redhatopenshifthcp.PlatformProfile.managedResourceGroup'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      Resource group name to put cluster resources

      If not specified then a unique name is generated from the
      following pattern

      "aro-hcp-" + clusterName + "-" + UUID

      where clusterName means the hcpOpenShiftClusters resource name
      (up to 45 characters) followed by a 16-byte universally unique
      identifier per RFC 4122.
    fullName: managedResourceGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'managedResourceGroup?: string'
      return:
        description: ''
        type: string
  - name: networkSecurityGroupId
    uid: '@azure/arm-redhatopenshifthcp.PlatformProfile.networkSecurityGroupId'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      ResourceId for the NSG (network security group) attached to the cluster
      subnet


      Note that NSGs cannot be reused for other ARO-HCP clusters.
    fullName: networkSecurityGroupId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'networkSecurityGroupId: string'
      return:
        description: ''
        type: string
  - name: operatorsAuthentication
    uid: '@azure/arm-redhatopenshifthcp.PlatformProfile.operatorsAuthentication'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      The configuration that the operators of the cluster have to authenticate
      to Azure
    fullName: operatorsAuthentication
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'operatorsAuthentication: OperatorsAuthenticationProfile'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-redhatopenshifthcp.OperatorsAuthenticationProfile" />
  - name: outboundType
    uid: '@azure/arm-redhatopenshifthcp.PlatformProfile.outboundType'
    package: '@azure/arm-redhatopenshifthcp'
    summary: The core outgoing configuration
    fullName: outboundType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'outboundType?: string'
      return:
        description: ''
        type: string
  - name: subnetId
    uid: '@azure/arm-redhatopenshifthcp.PlatformProfile.subnetId'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      The Azure resource ID of the worker subnet
      Note that a subnet cannot be reused between ARO-HCP Clusters.
    fullName: subnetId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'subnetId: string'
      return:
        description: ''
        type: string
  - name: vnetIntegrationSubnetId
    uid: '@azure/arm-redhatopenshifthcp.PlatformProfile.vnetIntegrationSubnetId'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      The Azure resource ID of a subnet that enables direct,
      private network connectivity between the hosted control plane
      and your cluster's nodes. This subnet must be dedicated to ARO HCP
      and cannot be shared with the cluster subnet or any node pool subnets.
    fullName: vnetIntegrationSubnetId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'vnetIntegrationSubnetId: string'
      return:
        description: ''
        type: string
