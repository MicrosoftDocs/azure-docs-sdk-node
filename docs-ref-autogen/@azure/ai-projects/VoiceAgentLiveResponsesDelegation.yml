name: VoiceAgentLiveResponsesDelegation
uid: '@azure/ai-projects.VoiceAgentLiveResponsesDelegation'
package: '@azure/ai-projects'
summary: Delegates work to a Responses backend using native Responses settings.
fullName: VoiceAgentLiveResponsesDelegation
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: acknowledgement_delay_ms
    uid: >-
      @azure/ai-projects.VoiceAgentLiveResponsesDelegation.acknowledgement_delay_ms
    package: '@azure/ai-projects'
    summary: >-
      Milliseconds to wait before requesting an automatic spoken acknowledgement
      for a delegation. The model may still speak before this delay. Any
      commentary or thinking appended to the session cancels all pending
      acknowledgements, including those for other delegations. Defaults to 400
      for Decisions sessions and 0 (request immediately) for other sessions.
      Omission in a session update preserves the current value. Updates apply to
      subsequent delegations.
    fullName: acknowledgement_delay_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'acknowledgement_delay_ms?: number'
      return:
        description: ''
        type: number
  - name: responses
    uid: '@azure/ai-projects.VoiceAgentLiveResponsesDelegation.responses'
    package: '@azure/ai-projects'
    summary: >-
      Backend model, prompt, and tools used when the Live session delegates a
      task to Responses.
    fullName: responses
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'responses: LiveResponsesDelegationSettingsInputParam'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/ai-projects.LiveResponsesDelegationSettingsInputParam" />
  - name: type
    uid: '@azure/ai-projects.VoiceAgentLiveResponsesDelegation.type'
