### YamlMime:TSEnum
name: KnownConnectionStatus
uid: '@azure/arm-chaos.KnownConnectionStatus'
package: '@azure/arm-chaos'
summary: The status of a connection.
fullName: KnownConnectionStatus
remarks: ''
isDeprecated: false
fields:
  - name: Connected
    uid: '@azure/arm-chaos.KnownConnectionStatus.Connected'
    package: '@azure/arm-chaos'
    summary: The connection is established and actively heartbeating.
  - name: Disconnected
    uid: '@azure/arm-chaos.KnownConnectionStatus.Disconnected'
    package: '@azure/arm-chaos'
    summary: >-
      The connection's heartbeat has gone stale; heartbeats are no longer being
      received.
  - name: Pending
    uid: '@azure/arm-chaos.KnownConnectionStatus.Pending'
    package: '@azure/arm-chaos'
    summary: >-
      The connection has been created but is not yet sending heartbeats; the
      trust relationship is not yet established.
  - name: Revoked
    uid: '@azure/arm-chaos.KnownConnectionStatus.Revoked'
    package: '@azure/arm-chaos'
    summary: The connection's credentials have been revoked.
