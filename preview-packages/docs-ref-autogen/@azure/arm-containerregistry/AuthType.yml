### YamlMime:TSTypeAlias
name: AuthType
uid: '@azure/arm-containerregistry.AuthType'
package: '@azure/arm-containerregistry'
summary: >-
  The authentication type used for the connected registry to sync with its
  parent. \

  [KnownAuthType](xref:@azure/arm-containerregistry.KnownAuthType) can be used
  interchangeably with AuthType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **SyncToken**: Sync authentication is done using ACR tokens \

  **ManagedIdentity**: Sync authentication is done using managed identity
fullName: AuthType
remarks: ''
isDeprecated: false
syntax: |
  type AuthType = string
