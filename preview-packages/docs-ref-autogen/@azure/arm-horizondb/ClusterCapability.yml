    fullName: supportedFeatures
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'supportedFeatures: ClusterFeatureCapability[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.ClusterFeatureCapability" />[]
  - name: supportedPostgreSqlVersions
    uid: '@azure/arm-horizondb.ClusterCapability.supportedPostgreSqlVersions'
    package: '@azure/arm-horizondb'
    summary: The PostgreSQL major versions supported by Clusters in the region.
    fullName: supportedPostgreSqlVersions
    remarks: ''
