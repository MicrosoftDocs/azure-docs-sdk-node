name: ChangeDataCaptureIdentityActivationState
uid: '@azure/arm-horizondb.ChangeDataCaptureIdentityActivationState'
package: '@azure/arm-horizondb'
summary: >-
  The activation state of a change data capture identity assignment. \

  [KnownChangeDataCaptureIdentityActivationState](xref:@azure/arm-horizondb.KnownChangeDataCaptureIdentityActivationState)
  can be used interchangeably with ChangeDataCaptureIdentityActivationState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Inactive**: The identity assignment is not active. \

  **Activating**: The identity assignment is being activated. \

  **Active**: The identity assignment is active. \

  **Deactivating**: The identity assignment is being deactivated. \

  **Failed**: The identity activation transition failed.
