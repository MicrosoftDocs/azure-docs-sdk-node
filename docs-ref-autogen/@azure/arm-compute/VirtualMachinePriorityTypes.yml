### YamlMime:TSTypeAlias
name: VirtualMachinePriorityTypes
uid: '@azure/arm-compute.VirtualMachinePriorityTypes'
package: '@azure/arm-compute'
summary: >-
  Specifies the priority for a standalone virtual machine or the virtual
  machines in the scale set. \

  [KnownVirtualMachinePriorityTypes](xref:@azure/arm-compute.KnownVirtualMachinePriorityTypes)
  can be used interchangeably with VirtualMachinePriorityTypes,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Regular**: Regular Priority for a standalone virtual machine or the virtual
  machines in the scale set.

  This is the default priority and it will be used to deploy regular VM/VMSS. \

  **Low**: Low priority for a standalone virtual machine or the virtual machines
  in the scale set. Will be Deprecated, use Spot instead. \

  **Spot**: Spot priority for a standalone virtual machine or the virtual
  machines in the scale set. \

  **SpotPlus**: SpotPlus priority for a standalone virtual machine or the
  virtual machines in the scale set.

  This is an enum value that will be used to deploy Azure Spot Plus VM/VMSS,
  which is the next

  generation of Azure Spot VM/VMSS with more reliability and longer running
  time.
fullName: VirtualMachinePriorityTypes
remarks: ''
isDeprecated: false
syntax: |
  type VirtualMachinePriorityTypes = string
