### YamlMime:TSType
name: ScheduleProfile
uid: '@azure/arm-compute.ScheduleProfile'
package: '@azure/arm-compute'
summary: >-
  Defines the schedule for Block and Future capacity reservations. Specifies the
  schedule during which capacity reservation is active and VM or VMSS resource
  can be allocated using reservation. For Block capacity reservations, the
  scheduleProfile, start, and end fields are immutable after creation. Please
  refer to https://aka.ms/blockcapacityreservation for more details. Minimum API
  version for Block capacity reservations: 2025-04-01. Future capacity
  reservations must use this property with only a start time, which can be
  changed until the ‘modifiableUntil’ time. Please refer to
  https://aka.ms/futurecapacityreservation for more details. Minimum API version
  for Future capacity reservations: 2026-04-01.
fullName: ScheduleProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: end
    uid: '@azure/arm-compute.ScheduleProfile.end'
    package: '@azure/arm-compute'
    summary: >-
      The required end date for Block capacity reservations. Must be after the
      start date, with a duration of either 1–14 whole days or 3–26 whole weeks.
      Example: 2025-06-28.
    fullName: end
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'end?: string'
      return:
        description: ''
        type: string
  - name: minimumCommitmentDays
    uid: '@azure/arm-compute.ScheduleProfile.minimumCommitmentDays'
    package: '@azure/arm-compute'
    summary: >-
      The minimum number of days that must pass after the start date before a
      Future capacity reservation can be updated or deleted once it has been
      committed. Will be populated with a default value if not provided.
    fullName: minimumCommitmentDays
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'minimumCommitmentDays?: number'
      return:
        description: ''
        type: number
  - name: modifiableUntil
    uid: '@azure/arm-compute.ScheduleProfile.modifiableUntil'
    package: '@azure/arm-compute'
    summary: >-
      The date/time until which a Future capacity reservation can be updated or
      deleted. Read-only.
    fullName: modifiableUntil
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'modifiableUntil?: Date'
      return:
        description: ''
        type: Date
  - name: start
    uid: '@azure/arm-compute.ScheduleProfile.start'
    package: '@azure/arm-compute'
    summary: >-
      The required start date for Block or Future capacity reservations. Block
      capacity reservations: Must be today or within 56 days in the future. For
      same-day scheduling, requests must be submitted before 11:30 AM UTC.
      Future capacity reservations: Must be at least 7 days in the future, and
      maximum 6 months in the future. Minimum API version for Future capacity
      reservations: 2026-04-01. Example: 2025-06-27, applicable for both Block
      and Future capacity reservations.
    fullName: start
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'start?: string'
      return:
        description: ''
        type: string
