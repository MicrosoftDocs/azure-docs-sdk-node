### YamlMime:TSType
name: AuthenticationProviderProperties
uid: '@azure/arm-network.AuthenticationProviderProperties'
package: '@azure/arm-network'
summary: >-
  Properties for authentication provider configuration. A policy must configure
  either JWT validation fields or user sign-in fields; the two configurations
  are mutually exclusive and cannot be combined.
fullName: AuthenticationProviderProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audience
    uid: '@azure/arm-network.AuthenticationProviderProperties.audience'
    package: '@azure/arm-network'
    summary: >-
      The intended audience for the JWT. Only a single audience value is
      supported in this API version. Example:
      https://audience.com/{application-id}
    fullName: audience
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audience?: string'
      return:
        description: ''
        type: string
  - name: clientId
    uid: '@azure/arm-network.AuthenticationProviderProperties.clientId'
    package: '@azure/arm-network'
    summary: >-
      The Application (client) ID for the related application registered in
      Microsoft Entra ID, formatted as a GUID.
    fullName: clientId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clientId: string'
      return:
        description: ''
        type: string
  - name: clientSecret
    uid: '@azure/arm-network.AuthenticationProviderProperties.clientSecret'
    package: '@azure/arm-network'
    summary: >-
      The absolute HTTPS Key Vault secret URL identifying the client secret used
      for authentication. This property is required for user sign-in policies.
      It holds only the Key Vault reference; the secret value itself is never
      accepted or returned by this API and is read from Key Vault at runtime
      using the resource's user-assigned identity. The secret value stored in
      Key Vault can contain up to 4096 characters. Example:
      https://myvault.vault.azure.net/secrets/mysecret
    fullName: clientSecret
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clientSecret?: string'
      return:
        description: ''
        type: string
  - name: issuer
    uid: '@azure/arm-network.AuthenticationProviderProperties.issuer'
    package: '@azure/arm-network'
    summary: >-
      The absolute HTTPS URL of the Secure Token Service. Include a trailing
      slash at the end of the value. Example:
      https://login.microsoftonline.com/{Microsoft Entra Tenant ID}/
    fullName: issuer
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'issuer: string'
      return:
        description: ''
        type: string
  - name: jwksUri
    uid: '@azure/arm-network.AuthenticationProviderProperties.jwksUri'
    package: '@azure/arm-network'
    summary: >-
      The JSON Web Key Set (JWKS) URI used to retrieve the public keys for JWT
      validation. Example: https://login.microsoftonline.com/{Microsoft Entra
      Tenant ID}/discovery/v2.0/keys
    fullName: jwksUri
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'jwksUri?: string'
      return:
        description: ''
        type: string
  - name: scope
    uid: '@azure/arm-network.AuthenticationProviderProperties.scope'
    package: '@azure/arm-network'
    summary: >-
      The scopes used by an application during authentication to authorize
      access to a user's details. A maximum of 10 scopes is supported, each
      scope can contain up to 128 characters, and all scopes can contain up to
      256 characters combined.
    fullName: scope
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scope?: string[]'
      return:
        description: ''
        type: string[]
  - name: sessionCookieName
    uid: '@azure/arm-network.AuthenticationProviderProperties.sessionCookieName'
    package: '@azure/arm-network'
    summary: >-
      The name of the session cookie used for user authentication. Applicable to
      the Application Gateway post-OIDC workflow.
    fullName: sessionCookieName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sessionCookieName?: string'
      return:
        description: ''
        type: string
  - name: sessionTimeout
    uid: '@azure/arm-network.AuthenticationProviderProperties.sessionTimeout'
    package: '@azure/arm-network'
    summary: >-
      The timeout of the session cookie used for user authentication. The
      service accepts and returns this value as a string containing a base-10
      unsigned integer number of seconds with no sign, decimal point, unit
      suffix, or whitespace (for example `86400`). The supported range is 1 to
      604800 seconds, and the default is 86400 seconds. Applicable to the
      Application Gateway post-OIDC workflow.
    fullName: sessionTimeout
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sessionTimeout?: string'
      return:
        description: ''
        type: string
