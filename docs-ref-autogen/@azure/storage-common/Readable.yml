    uid: '@azure/storage-common.Readable.resume'
    package: '@azure/storage-common'
    summary: >-
      The `readable.resume()` method causes an explicitly paused `Readable`
      stream to

      resume emitting `'data'` events, switching the stream into flowing mode.


      The `readable.resume()` method can be used to fully consume the data from
      a

      stream without actually processing any of that data:


      ```js

      getReadableStreamSomehow()
        .resume()
        .on('end', () => {
          console.log('Reached the end, but did not read anything.');
        });
      ```


      The `readable.resume()` method has no effect if there is a `'readable'`
      event listener.
