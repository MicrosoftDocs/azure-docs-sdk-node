name: IpAddressType
uid: '@azure/provisioning-servicebus.types.IpAddressType'
package: '@azure/provisioning-servicebus'
summary: >-
  The IP address type for the namespace. Determines whether the namespace
  supports IPv4 only or both IPv4 and IPv6 (dual stack).


  Known values:


  - `"IPv4"`: The namespace supports IPv4 addresses only.


  - `"DualStack"`: The namespace supports both IPv4 and IPv6 addresses (dual
  stack).
