### YamlMime:TSTypeAlias
name: KnowledgeSourceNetworkAccessMode
uid: '@azure/search-documents.KnowledgeSourceNetworkAccessMode'
package: '@azure/search-documents'
summary: >-
  Specifies the network access mode for knowledge source ingestion. Default is
  'public'. \

  [KnownKnowledgeSourceNetworkAccessMode](xref:@azure/search-documents.KnownKnowledgeSourceNetworkAccessMode)
  can be used interchangeably with KnowledgeSourceNetworkAccessMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **public**: Ingestion runs in the standard, publicly reachable execution
  environment. This is the default. \

  **private**: Ingestion runs in a private execution environment so it can reach
  data sources and dependencies over a private network (private endpoint /
  shared private link).
fullName: KnowledgeSourceNetworkAccessMode
remarks: ''
isDeprecated: false
syntax: |
  type KnowledgeSourceNetworkAccessMode = string
