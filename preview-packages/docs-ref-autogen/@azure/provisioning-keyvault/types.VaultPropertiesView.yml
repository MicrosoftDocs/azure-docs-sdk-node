### YamlMime:TSType
name: VaultPropertiesView
uid: '@azure/provisioning-keyvault.types.VaultPropertiesView'
package: '@azure/provisioning-keyvault'
summary: View type for Properties of the vault
fullName: VaultPropertiesView
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: accessPolicies
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.accessPolicies'
    package: '@azure/provisioning-keyvault'
    summary: >-
      An array of 0 to 1024 identities that have access to the key vault. All
      identities in the array must use the same tenant ID as the key vault's
      tenant ID. When `createMode` is set to `recover`, access policies are not
      required. Otherwise, access policies are required.
    fullName: accessPolicies
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'accessPolicies?: any'
      return:
        description: ''
        type: any
  - name: createMode
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.createMode'
    package: '@azure/provisioning-keyvault'
    summary: >-
      The vault's create mode to indicate whether the vault need to be recovered
      or not.
    fullName: createMode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'createMode?: ExpressionOrValue<CreateMode>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;<xref
          uid="@azure/provisioning-keyvault.types.CreateMode" />&gt;
  - name: enabledForDeployment
    uid: >-
      @azure/provisioning-keyvault.types.VaultPropertiesView.enabledForDeployment
    package: '@azure/provisioning-keyvault'
    summary: >-
      Property to specify whether Azure Virtual Machines are permitted to
      retrieve certificates stored as secrets from the key vault.
    fullName: enabledForDeployment
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabledForDeployment?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: enabledForDiskEncryption
    uid: >-
      @azure/provisioning-keyvault.types.VaultPropertiesView.enabledForDiskEncryption
    package: '@azure/provisioning-keyvault'
    summary: >-
      Property to specify whether Azure Disk Encryption is permitted to retrieve
      secrets from the vault and unwrap keys.
    fullName: enabledForDiskEncryption
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabledForDiskEncryption?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: enabledForTemplateDeployment
    uid: >-
      @azure/provisioning-keyvault.types.VaultPropertiesView.enabledForTemplateDeployment
    package: '@azure/provisioning-keyvault'
    summary: >-
      Property to specify whether Azure Resource Manager is permitted to
      retrieve secrets from the key vault.
    fullName: enabledForTemplateDeployment
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabledForTemplateDeployment?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: enablePurgeProtection
    uid: >-
      @azure/provisioning-keyvault.types.VaultPropertiesView.enablePurgeProtection
    package: '@azure/provisioning-keyvault'
    summary: >-
      Property specifying whether protection against purge is enabled for this
      vault. Setting this property to true activates protection against purge
      for this vault and its content - only the Key Vault service may initiate a
      hard, irrecoverable deletion. The setting is effective only if soft delete
      is also enabled. Enabling this functionality is irreversible - that is,
      the property does not accept false as its value.
    fullName: enablePurgeProtection
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enablePurgeProtection?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: enableRbacAuthorization
    uid: >-
      @azure/provisioning-keyvault.types.VaultPropertiesView.enableRbacAuthorization
    package: '@azure/provisioning-keyvault'
    summary: >-
      Property that controls how data actions are authorized. When true, the key
      vault will use Role Based Access Control (RBAC) for authorization of data
      actions, and the access policies specified in vault properties will be
      ignored. When false, the key vault will use the access policies specified
      in vault properties, and any policy stored on Azure Resource Manager will
      be ignored. If null or not specified, the vault is created with the
      default value of false. Note that management actions are always authorized
      with RBAC.
    fullName: enableRbacAuthorization
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enableRbacAuthorization?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: enableSoftDelete
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.enableSoftDelete'
    package: '@azure/provisioning-keyvault'
    summary: >-
      Property to specify whether the 'soft delete' functionality is enabled for
      this key vault. If it's not set to any value(true or false) when creating
      new key vault, it will be set to true by default. Once set to true, it
      cannot be reverted to false.
    fullName: enableSoftDelete
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enableSoftDelete?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: hsmPoolResourceId
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.hsmPoolResourceId'
    package: '@azure/provisioning-keyvault'
    summary: 'Read-only output: The resource id of HSM Pool.'
    fullName: hsmPoolResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'hsmPoolResourceId?: Expression<string>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;string&gt;
  - name: networkAcls
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.networkAcls'
    package: '@azure/provisioning-keyvault'
    summary: >-
      Rules governing the accessibility of the key vault from specific network
      locations.
    fullName: networkAcls
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'networkAcls?: NetworkRuleSetInput'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-keyvault.types.NetworkRuleSetInput" />
  - name: privateEndpointConnections
    uid: >-
      @azure/provisioning-keyvault.types.VaultPropertiesView.privateEndpointConnections
    package: '@azure/provisioning-keyvault'
    summary: >-
      Read-only output: List of private endpoint connections associated with the
      key vault.
    fullName: privateEndpointConnections
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'privateEndpointConnections?: Expression<PrivateEndpointConnectionItem[]>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-keyvault.types.PrivateEndpointConnectionItem"
          />[]&gt;
  - name: publicNetworkAccess
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.publicNetworkAccess'
    package: '@azure/provisioning-keyvault'
    summary: >-
      Property to specify whether the vault will accept traffic from public
      internet. If set to 'disabled' all traffic except private endpoint traffic
      and that that originates from trusted services will be blocked. This will
      override the set firewall rules, meaning that even if the firewall rules
      are present we will not honor the rules.
    fullName: publicNetworkAccess
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publicNetworkAccess?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: sku
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.sku'
    package: '@azure/provisioning-keyvault'
    summary: SKU details
    fullName: sku
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sku: SkuView'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-keyvault.types.SkuView" />
  - name: softDeleteRetentionInDays
    uid: >-
      @azure/provisioning-keyvault.types.VaultPropertiesView.softDeleteRetentionInDays
    package: '@azure/provisioning-keyvault'
    summary: softDelete data retention days. It accepts \>=7 and \<=90.
    fullName: softDeleteRetentionInDays
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'softDeleteRetentionInDays?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
  - name: tenantId
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.tenantId'
    package: '@azure/provisioning-keyvault'
    summary: >-
      The Azure Active Directory tenant ID that should be used for
      authenticating requests to the key vault.
    fullName: tenantId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tenantId: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: vaultUri
    uid: '@azure/provisioning-keyvault.types.VaultPropertiesView.vaultUri'
    package: '@azure/provisioning-keyvault'
    summary: The URI of the vault for performing operations on keys and secrets.
    fullName: vaultUri
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'vaultUri?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
extends: >-
  unknown&lt;<xref uid="@azure/provisioning-keyvault.types.VaultProperties"
  />&gt;
