name: ClusterResourcePropertiesView
uid: '@azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView'
package: '@azure/provisioning-cosmosdb'
summary: View type for Properties of a managed Cassandra cluster.
fullName: ClusterResourcePropertiesView
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: authenticationMethod
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.authenticationMethod
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      Which authentication method Cassandra should use to authenticate clients.
      'None' turns off authentication, so should not be used except in
      emergencies. 'Cassandra' is the default password based authentication. The
      default is 'Cassandra'.
    fullName: authenticationMethod
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'authenticationMethod?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: autoReplicate
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.autoReplicate
    package: '@azure/provisioning-cosmosdb'
    summary: The form of AutoReplicate that is being used by this cluster.
    fullName: autoReplicate
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'autoReplicate?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: azureConnectionMethod
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.azureConnectionMethod
