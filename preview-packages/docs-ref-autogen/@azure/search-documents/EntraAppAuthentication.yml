### YamlMime:TSType
name: EntraAppAuthentication
uid: '@azure/search-documents.EntraAppAuthentication'
package: '@azure/search-documents'
summary: >-
  Configuration for a customer-owned Microsoft Entra app registration used for
  federated credential-based on-behalf-of authentication.
fullName: EntraAppAuthentication
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: applicationId
    uid: '@azure/search-documents.EntraAppAuthentication.applicationId'
    package: '@azure/search-documents'
    summary: The application (client) ID of the customer-owned Entra app registration.
    fullName: applicationId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'applicationId: string'
      return:
        description: ''
        type: string
  - name: federatedCredentialId
    uid: '@azure/search-documents.EntraAppAuthentication.federatedCredentialId'
    package: '@azure/search-documents'
    summary: >-
      The federated credential ID configured on the app registration, enabling
      the search service to authenticate as the app without a stored client
      secret.
    fullName: federatedCredentialId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'federatedCredentialId: string'
      return:
        description: ''
        type: string
  - name: tenantId
    uid: '@azure/search-documents.EntraAppAuthentication.tenantId'
    package: '@azure/search-documents'
    summary: >-
      The tenant ID of the app registration. Required when the app registration
