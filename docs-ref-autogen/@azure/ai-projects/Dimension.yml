### YamlMime:TSType
name: Dimension
uid: '@azure/ai-projects.Dimension'
package: '@azure/ai-projects'
summary: >-
  One measurable criterion within a rubric. Quality criteria may use rating
  weights; safety criteria classify a behavior as allowed or disallowed.
fullName: Dimension
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: allowed
    uid: '@azure/ai-projects.Dimension.allowed'
    package: '@azure/ai-projects'
    summary: >-
      Safety behavior classification: true means allowed behavior and false
      means disallowed behavior. Required on every safety criterion instead of
      weight. This is not an evaluation verdict. Omit for ordinary quality
      criteria; omission never defaults a safety criterion to false. Preserved
      through edits and regeneration.
    fullName: allowed
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowed?: boolean'
      return:
        description: ''
        type: boolean
  - name: always_applicable
    uid: '@azure/ai-projects.Dimension.always_applicable'
    package: '@azure/ai-projects'
    summary: >-
      When true, the LLM judge always scores this dimension regardless of
      relevance (skips applicability assessment). The service-generated general
      quality/policy dimension has this set to true and is non-editable. Users
      may set this on their own custom dimensions. The service defaults to
      `false` if a value is not specified by the caller.
    fullName: always_applicable
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'always_applicable?: boolean'
      return:
        description: ''
        type: boolean
  - name: description
    uid: '@azure/ai-projects.Dimension.description'
    package: '@azure/ai-projects'
    summary: >-
      What this dimension measures (e.g., 'Correctly identifies the user's
      reservation intent and pursues the appropriate workflow').
    fullName: description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'description: string'
      return:
        description: ''
        type: string
  - name: generated_weight
    uid: '@azure/ai-projects.Dimension.generated_weight'
    package: '@azure/ai-projects'
    summary: >-
      Read-only model-suggested weight (1-10) returned for unweighted Likert
      dimensions.
    fullName: generated_weight
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'generated_weight?: number'
      return:
        description: ''
        type: number
  - name: id
    uid: '@azure/ai-projects.Dimension.id'
    package: '@azure/ai-projects'
    summary: >-
      Stable identifier for this dimension (snake_case, e.g.,
      `correct_resolution`). Required. Provided by the user when manually
      creating a rubric evaluator or during human-in-the-loop review of a
      generated set; the generation pipeline produces an initial value the user
      can edit. Editable when saving new versions.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id: string'
      return:
        description: ''
        type: string
  - name: weight
    uid: '@azure/ai-projects.Dimension.weight'
    package: '@azure/ai-projects'
    summary: >-
      Optional configured weight for legacy or Likert scoring. For Likert, omit
      every weight for equal contribution or supply a weight for every
      dimension; partially weighted definitions are rejected. Boolean scoring
      rejects every configured weight, including explicit unit weights. No
      schema default is emitted.
    fullName: weight
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'weight?: number'
      return:
        description: ''
        type: number
