      `azure-custom`, `azure-personal`, and `avatar-voice-sync`.
    fullName: custom_lexicon_url
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'custom_lexicon_url?: string'
      return:
        description: ''
        type: string
