### YamlMime:TSType
name: StorageInitiator
uid: '@azure/arm-azurestackhci.StorageInitiator'
package: '@azure/arm-azurestackhci'
summary: >-
  A storage fabric initiator port (iSCSI or Fibre Channel) discovered on the
  edge machine.
fullName: StorageInitiator
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: ethernetAdapterMacAddress
    uid: '@azure/arm-azurestackhci.StorageInitiator.ethernetAdapterMacAddress'
    package: '@azure/arm-azurestackhci'
    summary: >-
      MAC address of the Ethernet adapter the iSCSI initiator is bound to.
      Populated for iSCSI initiators only; matches
      EdgeMachineNicDetail.macAddress.
    fullName: ethernetAdapterMacAddress
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ethernetAdapterMacAddress?: string'
      return:
        description: ''
        type: string
  - name: ethernetAdapterName
    uid: '@azure/arm-azurestackhci.StorageInitiator.ethernetAdapterName'
    package: '@azure/arm-azurestackhci'
    summary: >-
      Name of the Ethernet adapter the iSCSI initiator is bound to. Populated
      for iSCSI initiators only; matches EdgeMachineNicDetail.adapterName.
    fullName: ethernetAdapterName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ethernetAdapterName?: string'
      return:
        description: ''
        type: string
  - name: initiatorIdentifier
    uid: '@azure/arm-azurestackhci.StorageInitiator.initiatorIdentifier'
    package: '@azure/arm-azurestackhci'
    summary: >-
      Node identifier of the initiator. IQN for iSCSI or node WWN (WWNN) for
      Fibre Channel. Corresponds to the NodeAddress reported by
      Get-InitiatorPort.
    fullName: initiatorIdentifier
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'initiatorIdentifier: string'
      return:
        description: ''
        type: string
  - name: initiatorType
    uid: '@azure/arm-azurestackhci.StorageInitiator.initiatorType'
    package: '@azure/arm-azurestackhci'
    summary: Transport type of the initiator port.
    fullName: initiatorType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'initiatorType: string'
      return:
        description: ''
        type: string
  - name: operationalStatus
    uid: '@azure/arm-azurestackhci.StorageInitiator.operationalStatus'
    package: '@azure/arm-azurestackhci'
    summary: >-
      Operational status of the initiator port as reported by the host.
      Corresponds to OperationalStatus from Get-InitiatorPort.
    fullName: operationalStatus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'operationalStatus?: string'
      return:
        description: ''
        type: string
  - name: portWorldWideName
    uid: '@azure/arm-azurestackhci.StorageInitiator.portWorldWideName'
    package: '@azure/arm-azurestackhci'
    summary: >-
      Fibre Channel port World Wide Name (WWPN). Populated for FibreChannel
      initiators only; corresponds to the PortAddress reported by
      Get-InitiatorPort.
    fullName: portWorldWideName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'portWorldWideName?: string'
      return:
        description: ''
        type: string
