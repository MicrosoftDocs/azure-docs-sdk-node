### YamlMime:TSType
name: AccountKeyMetadata
uid: '@azure/arm-cosmosdb.AccountKeyMetadata'
package: '@azure/arm-cosmosdb'
summary: The metadata related to an access key for a given database account.
fullName: AccountKeyMetadata
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: approximateLastUsageTime
    uid: '@azure/arm-cosmosdb.AccountKeyMetadata.approximateLastUsageTime'
    package: '@azure/arm-cosmosdb'
    summary: >-
      Approximate time in UTC of the most recent usage of the key in ISO-8601
      format.

      If the value is missing from the object, it means there is no recorded
      data plane

      usage for this key.
    fullName: approximateLastUsageTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'approximateLastUsageTime?: Date'
      return:
        description: ''
        type: Date
  - name: generationTime
    uid: '@azure/arm-cosmosdb.AccountKeyMetadata.generationTime'
    package: '@azure/arm-cosmosdb'
    summary: >-
      Generation time in UTC of the key in ISO-8601 format. If the value is
      missing from the object, it means that the last key regeneration was
      triggered before 2022-06-18.
    fullName: generationTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'generationTime?: Date'
      return:
        description: ''
        type: Date
