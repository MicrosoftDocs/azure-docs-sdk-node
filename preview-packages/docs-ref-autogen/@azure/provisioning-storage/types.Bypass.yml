### YamlMime:TSTypeAlias
name: Bypass
uid: '@azure/provisioning-storage.types.Bypass'
package: '@azure/provisioning-storage'
summary: >-
  Specifies whether traffic is bypassed for Logging/Metrics/AzureServices.
  Possible values are any combination of Logging|Metrics|AzureServices (For
  example, "Logging, Metrics"), or None to bypass none of those traffics.


  Known values:


  - `"None"`


  - `"Logging"`


  - `"Metrics"`


  - `"AzureServices"`
fullName: Bypass
remarks: ''
isDeprecated: false
syntax: |
  type Bypass = string
