    fullName: confidence
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'confidence: EvaluatorHealthConfidence'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluatorHealthConfidence" />
  - name: coverage
