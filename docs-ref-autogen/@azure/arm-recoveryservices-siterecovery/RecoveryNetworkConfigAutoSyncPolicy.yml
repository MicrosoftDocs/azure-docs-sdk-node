### YamlMime:TSTypeAlias
name: RecoveryNetworkConfigAutoSyncPolicy
uid: '@azure/arm-recoveryservices-siterecovery.RecoveryNetworkConfigAutoSyncPolicy'
package: '@azure/arm-recoveryservices-siterecovery'
summary: >-
  The vault level policy controlling whether the A2A recovery network
  configuration is automatically kept in sync with the source virtual machine. \

  [KnownRecoveryNetworkConfigAutoSyncPolicy](xref:@azure/arm-recoveryservices-siterecovery.KnownRecoveryNetworkConfigAutoSyncPolicy)
  can be used interchangeably with RecoveryNetworkConfigAutoSyncPolicy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: Automatic synchronization of the recovery network configuration
  is turned off. Recovery NIC settings are changed only through an explicit
  update operation. \

  **Enabled**: Automatic synchronization of the recovery network configuration
  is turned on. Recovery NIC settings are refreshed from the source virtual
  machine as its network configuration changes.
fullName: RecoveryNetworkConfigAutoSyncPolicy
remarks: ''
isDeprecated: false
syntax: |
  type RecoveryNetworkConfigAutoSyncPolicy = string
