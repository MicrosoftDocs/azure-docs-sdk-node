  - name: getConnectOptions
    uid: '@azure/playwright.getConnectOptions'
    package: '@azure/playwright'
    summary: >+
      Get connect options required to connect to Azure Playwright's cloud hosted
      browsers.


      **Example**


      ```

      import playwright, { test, expect, BrowserType } from "@playwright/test";

      import { getConnectOptions } from "@azure/playwright";


      test('has title', async ({ browserName }) => {
       const { wsEndpoint, options } = await getConnectOptions();
       const browser = await (playwright[browserName] as BrowserType).connect(wsEndpoint, options);
       const context = await browser.newContext();
       const page = await context.newPage();

       await page.goto('https://playwright.dev/');
       await expect(page).toHaveTitle(/Playwright/);

       await page.close();
       await context.close();
       await browser.close();
      });

      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        getConnectOptions: (options?: PlaywrightServiceAdditionalOptions) =>
        Promise<BrowserConnectOptions>
      return:
        description: ''
        type: >-
          (options?: PlaywrightServiceAdditionalOptions) =&gt;
          Promise&lt;BrowserConnectOptions&gt;
  - name: getServiceConfig
    uid: '@azure/playwright.getServiceConfig'
    package: '@azure/playwright'
    summary: >+
      Generate playwright configuration integrated with Azure Playwright.


      **Example**


      ```

      import { defineConfig } from "playwright/test";

      import { getServiceConfig } from "@azure/playwright";

      import playwrightConfig from "./playwright.config";


      export default defineConfig(playwrightConfig,
      getServiceConfig(playwrightConfig));

      ```




      **Example**


      ```

      import { defineConfig } from "playwright/test";

      import { getServiceConfig, ServiceOS } from "@azure/playwright";

      import playwrightConfig from "./playwright.config";


      export default defineConfig(playwrightConfig,
      getServiceConfig(playwrightConfig, {
       runId: "custom run id",
       os: ServiceOS.WINDOWS
      }));

      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        getServiceConfig: (config: PlaywrightTestConfig<PlaywrightTestOptions &
        CustomProperties<{}>, PlaywrightWorkerOptions & CustomProperties<{}>>,
        options?: PlaywrightServiceAdditionalOptions) =>
        PlaywrightTestConfig<PlaywrightTestOptions & CustomProperties<{}>,
        PlaywrightWorkerOptions & CustomProperties<{}>>
      return:
        description: ''
        type: >-
          (config: PlaywrightTestConfig&lt;PlaywrightTestOptions &
          CustomProperties&lt;{}&gt;, PlaywrightWorkerOptions &
          CustomProperties&lt;{}&gt;&gt;, options?:
          PlaywrightServiceAdditionalOptions) =&gt;
          PlaywrightTestConfig&lt;PlaywrightTestOptions &
