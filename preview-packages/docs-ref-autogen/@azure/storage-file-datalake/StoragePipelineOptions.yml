### YamlMime:TSType
name: StoragePipelineOptions
uid: '@azure/storage-file-datalake.StoragePipelineOptions'
package: '@azure/storage-file-datalake'
summary: >-
  Options interface for the
  [newPipeline](xref:@azure/storage-file-datalake.newPipeline) function.


  In Node.js, Data Lake clients send requests that have a body, such as appends,
  with the

  `Expect: 100-continue` header for a minute after the service responds with
  status 429, 500 or

  503, unless `httpClient` is set, as `@azure/storage-blob` clients do by
  default. Data Lake

  clients have no option to change this. To turn it off, set the environment
  variable

  `AZURE_STORAGE_DISABLE_EXPECT_CONTINUE_HEADER` to `true` or `1`.
fullName: StoragePipelineOptions
remarks: ''
isDeprecated: false
type: interface
