### YamlMime:TSTypeAlias
name: ParameterValue
uid: '@azure/provisioning-core.ParameterValue'
package: '@azure/provisioning-core'
summary: |-
  A value accepted as a parameter's `defaultValue`: a literal of the declared
  type or an `Expression` of it. Resource views are intentionally excluded —
  a Bicep `param` default cannot reference resources.
fullName: ParameterValue<T>
remarks: ''
isDeprecated: false
syntax: |
  type ParameterValue<T> = ExpressionOrValue<PrimitiveTypeMap[T]>
