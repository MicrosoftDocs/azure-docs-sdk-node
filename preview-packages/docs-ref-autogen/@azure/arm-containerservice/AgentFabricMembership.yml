name: AgentFabricMembership
uid: '@azure/arm-containerservice.AgentFabricMembership'
package: '@azure/arm-containerservice'
summary: >-
  The AgentFabric membership of a managed cluster. A cluster may belong to at
  most one AgentFabric, so this resource always has the name 'default'. See
  https://aka.ms/aks/agentfabric-membership.
fullName: AgentFabricMembership
remarks: ''
isDeprecated: false
