### YamlMime:TSType
name: WorkspaceDiscoveryResourceCoverageSummary
uid: '@azure/arm-chaos.WorkspaceDiscoveryResourceCoverageSummary'
package: '@azure/arm-chaos'
summary: >-
  Required resource occurrences from known-set scopes, keyed by normalized scope
  and resource before global inventory-row deduplication. classifiedCount plus
  unclassifiedCount equals expectedCount, and coveredCount does not exceed
  classifiedCount.
fullName: WorkspaceDiscoveryResourceCoverageSummary
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: classifiedCount
    uid: '@azure/arm-chaos.WorkspaceDiscoveryResourceCoverageSummary.classifiedCount'
    package: '@azure/arm-chaos'
    summary: >-
      The number of expected occurrences with a terminal access or presence
      classification.
    fullName: classifiedCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'classifiedCount: number'
      return:
        description: ''
        type: number
  - name: coveredCount
    uid: '@azure/arm-chaos.WorkspaceDiscoveryResourceCoverageSummary.coveredCount'
    package: '@azure/arm-chaos'
    summary: >-
      The number of classified expected occurrences actually represented in the
      produced snapshot. Access to a container or its descendants does not
      invent a resource occurrence.
    fullName: coveredCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'coveredCount: number'
      return:
        description: ''
        type: number
  - name: expectedCount
    uid: '@azure/arm-chaos.WorkspaceDiscoveryResourceCoverageSummary.expectedCount'
    package: '@azure/arm-chaos'
    summary: >-
      The number of unique required resource occurrences across known-set
      scopes, not the number of service-group container members or listed
      inventory rows.
    fullName: expectedCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'expectedCount: number'
      return:
        description: ''
        type: number
  - name: unclassifiedCount
    uid: >-
      @azure/arm-chaos.WorkspaceDiscoveryResourceCoverageSummary.unclassifiedCount
    package: '@azure/arm-chaos'
    summary: >-
      The number of expected occurrences that required system verification could
      not classify.
    fullName: unclassifiedCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'unclassifiedCount: number'
      return:
        description: ''
        type: number
