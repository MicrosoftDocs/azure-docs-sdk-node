### YamlMime:TSTypeAlias
name: RubricGenerationInputQualityWarningSource
uid: '@azure/ai-projects.RubricGenerationInputQualityWarningSource'
package: '@azure/ai-projects'
summary: >-
  Warning source attribution for a rubric-generation input-quality warning.
  Per-source values (`prompt`, `agent`, `dataset`) match the source category
  visible to the generation runtime. `aggregate` is a synthetic value used only
  for warnings computed across successfully resolved sources. `traces` is not
  exposed because trace sources resolve into dataset content upstream.
fullName: RubricGenerationInputQualityWarningSource
remarks: ''
isDeprecated: false
syntax: |
  type RubricGenerationInputQualityWarningSource =
    | "prompt"
    | "agent"
    | "dataset"
    | "aggregate"
