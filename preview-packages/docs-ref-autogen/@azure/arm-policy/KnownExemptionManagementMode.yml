### YamlMime:TSEnum
name: KnownExemptionManagementMode
uid: '@azure/arm-policy.KnownExemptionManagementMode'
package: '@azure/arm-policy'
summary: >-
  The mode indicating how the policy exemption is managed. Possible values are
  Admin and UserSelfServe.
fullName: KnownExemptionManagementMode
remarks: ''
isDeprecated: false
fields:
  - name: Admin
    uid: '@azure/arm-policy.KnownExemptionManagementMode.Admin'
    package: '@azure/arm-policy'
    summary: >-
      This mode means the exemption is managed by an administrator and requires
      permission for the policy exemption action.
  - name: UserSelfServe
    uid: '@azure/arm-policy.KnownExemptionManagementMode.UserSelfServe'
    package: '@azure/arm-policy'
    summary: >-
      This mode means the exemption is managed by the user it applies to,
      through the self-serve exemption settings on the policy assignment.
