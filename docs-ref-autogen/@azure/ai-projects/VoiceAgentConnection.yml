### YamlMime:TSType
name: VoiceAgentConnection
uid: '@azure/ai-projects.VoiceAgentConnection'
package: '@azure/ai-projects'
summary: >-
  A connected, bidirectional voice-agent stream.


  Supports exactly one `for await` iteration over server events; a second
  attempt throws.

  Exiting the loop early (`break`, `return`, or an uncaught error in the loop
  body) closes

  the connection as a side effect.

  Unrecognized server event types are delivered as
  [VoiceAgentUnknownEvent](xref:@azure/ai-projects.VoiceAgentUnknownEvent)
  without

  interrupting the stream. Malformed events still fail the iteration with a
  protocol error.
fullName: VoiceAgentConnection
remarks: ''
isDeprecated: false
type: interface
