### YamlMime:TSType
name: ResourceFeasibilityReview
uid: '@azure/arm-resiliencemanagement.ResourceFeasibilityReview'
package: '@azure/arm-resiliencemanagement'
summary: >-
  Result of a single feasibility review performed against one resource in a
  recovery plan.
fullName: ResourceFeasibilityReview
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: currentTargetSku
    uid: '@azure/arm-resiliencemanagement.ResourceFeasibilityReview.currentTargetSku'
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      The SKU the resource is currently configured to recover into, enriched for
      comparison against the recommendations. Absent when it could not be
      resolved, and always absent on `Passed` and `NotApplicable` reviews.
    fullName: currentTargetSku
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'currentTargetSku?: SkuDetails'
      return:
        description: ''
        type: <xref uid="@azure/arm-resiliencemanagement.SkuDetails" />
  - name: feasibilityType
    uid: '@azure/arm-resiliencemanagement.ResourceFeasibilityReview.feasibilityType'
    package: '@azure/arm-resiliencemanagement'
    summary: The resource feasibility review type.
    fullName: feasibilityType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'feasibilityType: string'
      return:
        description: ''
        type: string
  - name: recommendedTargetSkus
    uid: >-
      @azure/arm-resiliencemanagement.ResourceFeasibilityReview.recommendedTargetSkus
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      Alternative SKUs surfaced for this review. Absent or empty means a
      `Flagged` review has no alternatives, an `Unavailable` review has no
      applicable recommendations to surface, or the review has a minimal
      `Passed` / `NotApplicable` outcome. Callers should treat an absent array
      and an empty array identically.
    fullName: recommendedTargetSkus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recommendedTargetSkus?: SkuDetails[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-resiliencemanagement.SkuDetails" />[]
  - name: resourceType
    uid: '@azure/arm-resiliencemanagement.ResourceFeasibilityReview.resourceType'
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      Fully qualified ARM resource type evaluated, e.g.
      `Microsoft.Compute/virtualMachines`.
    fullName: resourceType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resourceType: string'
      return:
        description: ''
        type: string
  - name: status
    uid: '@azure/arm-resiliencemanagement.ResourceFeasibilityReview.status'
    package: '@azure/arm-resiliencemanagement'
    summary: Outcome of this feasibility review.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status: string'
      return:
        description: ''
        type: string
