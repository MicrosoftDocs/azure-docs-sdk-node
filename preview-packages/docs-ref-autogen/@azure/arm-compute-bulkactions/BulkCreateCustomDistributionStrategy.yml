name: BulkCreateCustomDistributionStrategy
uid: '@azure/arm-compute-bulkactions.BulkCreateCustomDistributionStrategy'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The distribution strategy for zone allocation in BulkCreateCustom. \

  [KnownBulkCreateCustomDistributionStrategy](xref:@azure/arm-compute-bulkactions.KnownBulkCreateCustomDistributionStrategy)
  can be used interchangeably with BulkCreateCustomDistributionStrategy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **BestEffortSingleZone**: Platform attempts to place as many VMs as possible
  in a single zone, falls back to multiple zones if needed \

  **Prioritized**: Platform uses customer-provided zone rankings to allocate VMs
  \

  **BestEffortBalanced**: Platform attempts to evenly distribute VMs across all
  available zones with best effort
fullName: BulkCreateCustomDistributionStrategy
remarks: ''
isDeprecated: false
syntax: |
  type BulkCreateCustomDistributionStrategy = string
