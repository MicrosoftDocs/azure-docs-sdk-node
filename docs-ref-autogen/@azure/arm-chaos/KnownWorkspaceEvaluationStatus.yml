### YamlMime:TSEnum
name: KnownWorkspaceEvaluationStatus
uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus'
package: '@azure/arm-chaos'
summary: Enum of the workspace evaluation status.
fullName: KnownWorkspaceEvaluationStatus
remarks: ''
isDeprecated: false
fields:
  - name: Canceled
    uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus.Canceled'
    package: '@azure/arm-chaos'
    summary: >-
      Cancellation won terminal settlement, or all admitted template tests were
      canceled. Previously recorded outcomes may remain. A later callback cannot
      replace this terminal result, and cancellation cannot replace an already
      settled result.
  - name: Failed
    uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus.Failed'
    package: '@azure/arm-chaos'
    summary: >-
      No template applicability test completed and at least one failed, unless
      cancellation won terminal settlement. The accepted resource snapshot and
      discovery result reference remain present; an admission failure creates no
      evaluation result.
  - name: InProgress
    uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus.InProgress'
    package: '@azure/arm-chaos'
    summary: The evaluation is in progress.
  - name: PartiallySucceeded
    uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus.PartiallySucceeded'
    package: '@azure/arm-chaos'
    summary: >-
      Unless cancellation won terminal settlement, at least one template
      applicability test completed and at least one failed or was canceled.
      Discovery completeness does not determine this processing status. The
      first terminal settlement is authoritative; a later cancellation does not
      replace it.
  - name: Pending
    uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus.Pending'
    package: '@azure/arm-chaos'
    summary: The evaluation is pending and has not started.
  - name: Queued
    uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus.Queued'
    package: '@azure/arm-chaos'
    summary: The evaluation has been accepted and is queued for execution.
  - name: Succeeded
    uid: '@azure/arm-chaos.KnownWorkspaceEvaluationStatus.Succeeded'
    package: '@azure/arm-chaos'
    summary: The evaluation completed successfully.
