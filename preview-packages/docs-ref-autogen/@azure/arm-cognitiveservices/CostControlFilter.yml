    uid: '@azure/arm-cognitiveservices.CostControlFilter.additionalInfo'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      A single additional-info condition. Must not be combined with `and` on the
      same filter object.
    fullName: additionalInfo
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'additionalInfo?: CostControlAdditionalInfoFilter'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-cognitiveservices.CostControlAdditionalInfoFilter" />
  - name: and
    uid: '@azure/arm-cognitiveservices.CostControlFilter.and'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      A conjunction of at least two conditions. Must not be combined with
      `additionalInfo` on the same filter object.
    fullName: and
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'and?: CostControlFilter[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.CostControlFilter" />[]
