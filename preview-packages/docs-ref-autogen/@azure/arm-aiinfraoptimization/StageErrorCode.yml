### YamlMime:TSTypeAlias
name: StageErrorCode
uid: '@azure/arm-aiinfraoptimization.StageErrorCode'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  The reason an optional subscription-scoped stage did not complete. \

  [KnownStageErrorCode](xref:@azure/arm-aiinfraoptimization.KnownStageErrorCode)
  can be used interchangeably with StageErrorCode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **TimedOut**: The stage exceeded its deadline. \

  **Throttled**: The stage was throttled. \

  **PartitionCapacityExceeded**: The service reached its active caller partition
  capacity. \

  **DependencyError**: A downstream dependency call failed. \

  **DataUnavailable**: Required downstream data was unavailable. \

  **EvaluationBudgetExceeded**: The optional evaluation call budget was
  exhausted.
fullName: StageErrorCode
remarks: ''
isDeprecated: false
syntax: |
  type StageErrorCode = string
