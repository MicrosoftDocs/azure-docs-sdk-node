### YamlMime:TSTypeAlias
name: MetadataType
uid: '@azure/arm-compute.MetadataType'
package: '@azure/arm-compute'
summary: >-
  The type of metadata associated with the image. \

  [KnownMetadataType](xref:@azure/arm-compute.KnownMetadataType) can be used
  interchangeably with MetadataType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **SecretsProvisioningImageMetadata**: Metadata related to secrets provisioning
  for the image. \

  **UserProvidedSecretsProvisioningMetadata**: Metadata related to user-provided
  secrets provisioning for the image.
fullName: MetadataType
remarks: ''
isDeprecated: false
syntax: |
  type MetadataType = string
