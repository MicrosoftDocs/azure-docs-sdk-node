  - name: targetIdentity
    uid: >-
      @azure/arm-networksecurity.NeuroShieldProtectedResourceProperties.targetIdentity
    package: '@azure/arm-networksecurity'
    summary: >-
      The optional customer VM or VMSS identity used by the Neuron agent.
      Omission

      and explicit None are accepted on create. SystemAssigned requires nonzero

      principalId and tenantId; UserAssigned requires exactly one non-null
      dictionary

      entry with nonzero principalId and clientId and no top-level IDs. The
      declared

      combined identity kind is rejected. Caller-supplied identifiers are
      returned

      on read; service-side verification of their association with the target
      remains

      required. Omission on update preserves the stored identity; a supplied
      identity

      must be unchanged. Explicit None cannot clear an existing identity.
      Changing

      identity requires deleting and recreating the protected resource.
    fullName: targetIdentity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetIdentity?: NeuroShieldProtectedResourceIdentity'
      return:
        description: ''
        type: >-
