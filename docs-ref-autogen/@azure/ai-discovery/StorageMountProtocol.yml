name: StorageMountProtocol
uid: '@azure/ai-discovery.StorageMountProtocol'
package: '@azure/ai-discovery'
summary: >-
  The protocol to use for mounting an storage container. \

  [KnownStorageMountProtocol](xref:@azure/ai-discovery.KnownStorageMountProtocol)
  can be used interchangeably with StorageMountProtocol,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NFS**: NFS protocol. Version of NFS used may vary based on storage type \

  **BlobfuseCaching**: Blobfuse in file cache mode.
fullName: StorageMountProtocol
remarks: ''
isDeprecated: false
syntax: |
  type StorageMountProtocol = string
