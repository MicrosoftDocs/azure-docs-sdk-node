### YamlMime:TSType
name: ExistingResourceProps
uid: '@azure/provisioning-core.ExistingResourceProps'
package: '@azure/provisioning-core'
summary: >-
  Identifies an existing Azure resource without deploying or configuring it.

  Its properties remain available as expressions resolved at deployment time.


  For child or extension resources, pass the owning resource as the first

  constructor argument. Use `scope` to look up a resource in another deployment
  scope.
fullName: ExistingResourceProps<TName>
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: name
    uid: '@azure/provisioning-core.ExistingResourceProps.name'
    package: '@azure/provisioning-core'
    summary: Required. The actual Azure name of the existing resource.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: ExpressionOrValue<TName>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;TName&gt;
  - name: scope
    uid: '@azure/provisioning-core.ExistingResourceProps.scope'
    package: '@azure/provisioning-core'
    summary: |-
      Optional. The scope at which to look up the resource. Used when the
      resource lives outside the current deployment's scope (different RG,
      subscription, management group, or tenant).

      Pass a scope-function call expression (e.g. `resourceGroup("name")`,
      `subscription()`, `managementGroup("mg")`, `tenant()`).
    fullName: scope
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scope?: ScopeExpression'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.ScopeExpression" />
