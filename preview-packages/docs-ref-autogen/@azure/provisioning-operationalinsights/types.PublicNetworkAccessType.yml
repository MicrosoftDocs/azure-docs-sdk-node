### YamlMime:TSTypeAlias
name: PublicNetworkAccessType
uid: '@azure/provisioning-operationalinsights.types.PublicNetworkAccessType'
package: '@azure/provisioning-operationalinsights'
summary: >-
  The network access type for operating on the Log Analytics Workspace. By
  default it is Enabled


  Known values:


  - `"Enabled"`: Enables connectivity to Log Analytics through public DNS.


  - `"Disabled"`: Disables public connectivity to Log Analytics through public
  DNS.


  - `"SecuredByPerimeter"`: Resource is only accessible from private networks
  and access approved by network security perimeter associated to this resource.
fullName: PublicNetworkAccessType
remarks: ''
isDeprecated: false
syntax: |
  type PublicNetworkAccessType = string
