name: RubricGenerationInputQualityWarning
uid: '@azure/ai-projects.RubricGenerationInputQualityWarning'
package: '@azure/ai-projects'
summary: >-
  A non-fatal advisory produced during rubric evaluator generation when resolved
  inputs are technically valid but likely too weak to produce a high-quality
  rubric. Read-only; service-generated. Persisted with the terminal
  EvaluatorGenerationJob.
fullName: RubricGenerationInputQualityWarning
remarks: ''
isDeprecated: false
type: interface
