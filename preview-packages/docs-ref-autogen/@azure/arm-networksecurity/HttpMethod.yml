### YamlMime:TSTypeAlias
name: HttpMethod
uid: '@azure/arm-networksecurity.HttpMethod'
package: '@azure/arm-networksecurity'
summary: >-
  The HTTP method matched by a URL filtering rule. \

  [KnownHttpMethod](xref:@azure/arm-networksecurity.KnownHttpMethod) can be used
  interchangeably with HttpMethod,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **GET**: HTTP GET method. \

  **POST**: HTTP POST method. \

  **PUT**: HTTP PUT method. \

  **DELETE**: HTTP DELETE method. \

  **PATCH**: HTTP PATCH method. \

  **HEAD**: HTTP HEAD method. \

  **OPTIONS**: HTTP OPTIONS method.
fullName: HttpMethod
remarks: ''
isDeprecated: false
syntax: |
  type HttpMethod = string
