name: ProfileStatus
uid: '@azure/arm-privatetrafficmanager.ProfileStatus'
package: '@azure/arm-privatetrafficmanager'
summary: >-
  The status of the Traffic Manager profile. \

  [KnownProfileStatus](xref:@azure/arm-privatetrafficmanager.KnownProfileStatus)
  can be used interchangeably with ProfileStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: The profile is enabled and traffic routing is active. \

  **Disabled**: The profile is disabled and traffic routing is inactive.
