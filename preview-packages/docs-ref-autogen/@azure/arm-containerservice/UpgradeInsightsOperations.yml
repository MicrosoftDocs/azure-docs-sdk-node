### YamlMime:TSType
name: UpgradeInsightsOperations
uid: '@azure/arm-containerservice.UpgradeInsightsOperations'
package: '@azure/arm-containerservice'
summary: Interface representing a UpgradeInsights operations.
fullName: UpgradeInsightsOperations
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: generate
    uid: '@azure/arm-containerservice.UpgradeInsightsOperations.generate'
    package: '@azure/arm-containerservice'
    summary: >-
      Generates (or refreshes) an upgrade readiness evaluation for the managed
      cluster.

      The requested scope and target version(s) are supplied in the request
      body; the

      server runs the readiness checks — the control plane Kubernetes version
      upgrade, a

      single agent pool Kubernetes version upgrade, a single agent pool node OS
      image

      upgrade, or the combined control plane and agent pools upgrade — persists
      the result

      as an UpgradeInsight resource with a server-generated name, and returns
      that

      resource. The response body is identical to a subsequent GET of the
      resource.
    fullName: generate
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        generate: (resourceGroupName: string, resourceName: string, body:
        GenerateUpgradeInsightsContentUnion, options?:
        UpgradeInsightsGenerateOptionalParams) => Promise<UpgradeInsight>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, resourceName: string, body:
          GenerateUpgradeInsightsContentUnion, options?:
          UpgradeInsightsGenerateOptionalParams) =&gt;
          Promise&lt;UpgradeInsight&gt;
  - name: get
    uid: '@azure/arm-containerservice.UpgradeInsightsOperations.get'
    package: '@azure/arm-containerservice'
    summary: >-
      Gets a stored upgrade insight for the managed cluster by its
      server-generated name.

      This is a read-only operation: it returns the most recently generated
      readiness

      evaluation for that scope from the data store, including the detected

      upgrade-blocking issues and contextual upgrade information. It does not
      regenerate

      the evaluation. If no non-expired evaluation exists for the name, it
      returns 404.
    fullName: get
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        get: (resourceGroupName: string, resourceName: string,
        upgradeInsightName: string, options?: UpgradeInsightsGetOptionalParams)
        => Promise<UpgradeInsight>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, resourceName: string, upgradeInsightName:
          string, options?: UpgradeInsightsGetOptionalParams) =&gt;
          Promise&lt;UpgradeInsight&gt;
  - name: list
    uid: '@azure/arm-containerservice.UpgradeInsightsOperations.list'
    package: '@azure/arm-containerservice'
    summary: >-
      Lists the stored upgrade insights for the specified managed cluster, one
      entry per

      scope that has been generated and not yet expired. This is a read-only
      operation and

      does not regenerate any evaluation.
    fullName: list
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        list: (resourceGroupName: string, resourceName: string, options?:
        UpgradeInsightsListOptionalParams) =>
        PagedAsyncIterableIterator<UpgradeInsight, UpgradeInsight[],
        PageSettings>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, resourceName: string, options?:
          UpgradeInsightsListOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;UpgradeInsight, UpgradeInsight[],
          PageSettings&gt;
