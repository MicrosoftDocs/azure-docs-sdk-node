properties:
  - name: get
    uid: '@azure/arm-networksecurity.EgressTrustBundlesOperations.get'
    package: '@azure/arm-networksecurity'
    summary: >-
      Gets the egress TLS-inspection trust bundle for the fabric.


      The bundle changes rarely, so callers are expected to cache it for the
      advertised

      validity period rather than reading it per workload. To decide whether a
      cached copy is

      still current, compare `bundleVersion`: it is derived from the anchor set,
      so it changes

      exactly when the anchors change and is stable otherwise. Every read
      returns the full

      bundle together with refreshed cache metadata.
    fullName: get
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        get: (resourceGroupName: string, agentFabricName: string, options?:
        EgressTrustBundlesGetOptionalParams) => Promise<EgressTrustBundle>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, agentFabricName: string, options?:
          EgressTrustBundlesGetOptionalParams) =&gt;
          Promise&lt;EgressTrustBundle&gt;
  - name: listByParent
    uid: '@azure/arm-networksecurity.EgressTrustBundlesOperations.listByParent'
    package: '@azure/arm-networksecurity'
    summary: >-
      Lists the egress TLS-inspection trust bundles for the fabric. The bundle
      is a singleton,

      so this returns the single `default` bundle. It exists because Azure
      Policy cannot

      populate compliance data for a resource type that has no collection GET.
    fullName: listByParent
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        listByParent: (resourceGroupName: string, agentFabricName: string,
        options?: EgressTrustBundlesListByParentOptionalParams) =>
        PagedAsyncIterableIterator<EgressTrustBundle, EgressTrustBundle[],
        PageSettings>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, agentFabricName: string, options?:
          EgressTrustBundlesListByParentOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;EgressTrustBundle, EgressTrustBundle[],
          PageSettings&gt;
