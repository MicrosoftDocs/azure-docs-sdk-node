### YamlMime:TSType
name: WrappingKeyValue
uid: '@azure/arm-keyvault.WrappingKeyValue'
package: '@azure/arm-keyvault'
summary: Reference to an external Managed HSM wrapping key.
fullName: WrappingKeyValue
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: kty
    uid: '@azure/arm-keyvault.WrappingKeyValue.kty'
    package: '@azure/arm-keyvault'
    summary: Wrapping key type. Only oct is supported.
    fullName: kty
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'kty: "oct"'
      return:
        description: ''
        type: '"oct"'
  - name: url
    uid: '@azure/arm-keyvault.WrappingKeyValue.url'
    package: '@azure/arm-keyvault'
    summary: >-
      Absolute HTTPS URL of a key on a supported Managed HSM endpoint.

      The path must be /keys/{key-name} or /keys/{key-name}/{key-version}.

      User information, query strings, fragments, and non-default ports are not
      supported.
    fullName: url
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'url: string'
      return:
        description: ''
        type: string
