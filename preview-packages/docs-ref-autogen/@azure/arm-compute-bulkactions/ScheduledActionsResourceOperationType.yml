name: ScheduledActionsResourceOperationType
uid: '@azure/arm-compute-bulkactions.ScheduledActionsResourceOperationType'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The operation to retry when a scheduled action fails. \

  [KnownScheduledActionsResourceOperationType](xref:@azure/arm-compute-bulkactions.KnownScheduledActionsResourceOperationType)
  can be used interchangeably with ScheduledActionsResourceOperationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: The operation is not specified. \

  **Start**: Starts the resources. \

  **Deallocate**: Deallocates the resources. \

  **Hibernate**: Hibernates the resources. \

  **Create**: Creates the resources. \

  **Delete**: Deletes the resources.
