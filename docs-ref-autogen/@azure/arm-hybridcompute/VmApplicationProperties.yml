### YamlMime:TSType
name: VmApplicationProperties
uid: '@azure/arm-hybridcompute.VmApplicationProperties'
package: '@azure/arm-hybridcompute'
summary: >-
  The properties of a VM application. Exactly one gallery application reference
  must be specified when creating or replacing the resource.
fullName: VmApplicationProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: communityGalleryApplicationId
    uid: >-
      @azure/arm-hybridcompute.VmApplicationProperties.communityGalleryApplicationId
    package: '@azure/arm-hybridcompute'
    summary: >-
      The identifier of a community gallery application version. Use
      `/communityGalleries/{communityGalleryPublicName}/applications/{applicationName}/versions/{versionName}`,
      where the version name can be `latest` or a specific version. This
      property is mutually exclusive with packageReferenceId and
      sharedGalleryApplicationId.
    fullName: communityGalleryApplicationId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'communityGalleryApplicationId?: string'
      return:
        description: ''
        type: string
  - name: configurationReference
    uid: '@azure/arm-hybridcompute.VmApplicationProperties.configurationReference'
    package: '@azure/arm-hybridcompute'
    summary: >-
      The URI of configuration data that replaces the package's default
      configuration.
    fullName: configurationReference
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'configurationReference?: string'
      return:
        description: ''
        type: string
  - name: instanceView
    uid: '@azure/arm-hybridcompute.VmApplicationProperties.instanceView'
    package: '@azure/arm-hybridcompute'
    summary: The instance view of the VM application.
    fullName: instanceView
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instanceView?: VmApplicationInstanceView'
      return:
        description: ''
        type: <xref uid="@azure/arm-hybridcompute.VmApplicationInstanceView" />
  - name: order
    uid: '@azure/arm-hybridcompute.VmApplicationProperties.order'
    package: '@azure/arm-hybridcompute'
    summary: The order in which the application is installed.
    fullName: order
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'order?: number'
      return:
        description: ''
        type: number
  - name: packageReferenceId
    uid: '@azure/arm-hybridcompute.VmApplicationProperties.packageReferenceId'
    package: '@azure/arm-hybridcompute'
    summary: >-
      The resource ID of the gallery application version. The version name can
      be `latest` or a specific version. This property is mutually exclusive
      with sharedGalleryApplicationId and communityGalleryApplicationId.
    fullName: packageReferenceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'packageReferenceId?: string'
      return:
        description: ''
        type: string
  - name: provisioningState
    uid: '@azure/arm-hybridcompute.VmApplicationProperties.provisioningState'
    package: '@azure/arm-hybridcompute'
    summary: The provisioning state of the VM application.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: sharedGalleryApplicationId
    uid: >-
      @azure/arm-hybridcompute.VmApplicationProperties.sharedGalleryApplicationId
    package: '@azure/arm-hybridcompute'
    summary: >-
      The identifier of a direct shared gallery application version. Use
      `/sharedGalleries/{sharedGalleryUniqueName}/applications/{applicationName}/versions/{versionName}`,
      where the version name can be `latest` or a specific version. This
      property is mutually exclusive with packageReferenceId and
      communityGalleryApplicationId.
    fullName: sharedGalleryApplicationId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sharedGalleryApplicationId?: string'
      return:
        description: ''
        type: string
  - name: treatFailureAsDeploymentFailure
    uid: >-
      @azure/arm-hybridcompute.VmApplicationProperties.treatFailureAsDeploymentFailure
    package: '@azure/arm-hybridcompute'
    summary: >-
      Indicates whether an application operation failure causes the deployment
      to fail.
    fullName: treatFailureAsDeploymentFailure
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'treatFailureAsDeploymentFailure?: boolean'
      return:
        description: ''
