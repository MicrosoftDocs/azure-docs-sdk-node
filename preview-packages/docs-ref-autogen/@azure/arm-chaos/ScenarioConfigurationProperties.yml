  - name: resourceTargeting
    uid: '@azure/arm-chaos.ScenarioConfigurationProperties.resourceTargeting'
    package: '@azure/arm-chaos'
    summary: >-
      Unified resource targeting policy that controls which discovered resources
      participate

      in fault injection. Replaces the separate `exclusions` and `filters`
      properties with

      symmetric include/exclude criteria.


      Include uses AND logic — a resource must match ALL active include
      dimensions.

      Exclude uses OR logic — a resource is removed if it matches ANY exclude
      dimension.

      When include and exclude conflict on the same resource, exclude wins.


      Null or omitted means all discovered resources participate (no targeting
      constraints).
    fullName: resourceTargeting
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resourceTargeting?: ResourceTargeting'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ResourceTargeting" />
  - name: scenarioId
    uid: '@azure/arm-chaos.ScenarioConfigurationProperties.scenarioId'
    package: '@azure/arm-chaos'
    summary: Resource ID of the scenario this configuration applies to.
    fullName: scenarioId
    remarks: ''
    isDeprecated: false
    syntax:
