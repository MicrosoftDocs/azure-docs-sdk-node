  - name: create
    uid: '@azure/arm-computelimit.TrustedHostSubscriptionsOperations.create'
    package: '@azure/arm-computelimit'
    summary: >-
      Adds a host subscription to the guest subscription's list of trusted
      hosts. A guest

      subscription can trust multiple host subscriptions; this only establishes
      trust and

      does not check the guest in to the host. Guest-to-host association is
      determined at

      check-in time, where a subscription can be a guest of at most one host per
      region.
    fullName: create
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        create: (location: string, hostSubscriptionId: string, resource:
        TrustedHostSubscription, options?:
        TrustedHostSubscriptionsCreateOptionalParams) =>
