### YamlMime:TSType
name: PoolProperties
uid: '@azure/arm-horizondb.PoolProperties'
package: '@azure/arm-horizondb'
summary: Properties of a HorizonDB pool.
fullName: PoolProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: computeModel
    uid: '@azure/arm-horizondb.PoolProperties.computeModel'
    package: '@azure/arm-horizondb'
    summary: The required compute model for the HorizonDB pool.
    fullName: computeModel
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'computeModel: PoolComputeModel'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.PoolComputeModel" />
  - name: highAvailability
    uid: '@azure/arm-horizondb.PoolProperties.highAvailability'
    package: '@azure/arm-horizondb'
    summary: >-
      The required high-availability configuration for the pool. mode must be
      Disabled when nodeCount is 1, and must be AnyZone or ZoneRedundant when
      nodeCount is 2 through 16.
    fullName: highAvailability
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'highAvailability: PoolHighAvailability'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.PoolHighAvailability" />
  - name: nodeCount
    uid: '@azure/arm-horizondb.PoolProperties.nodeCount'
    package: '@azure/arm-horizondb'
    summary: >-
      The required number of nodes to allocate and assign to the pool. Allowed
      values are 1 through 16. To deallocate runtime compute without changing
      the configured node count, stop the pool.
    fullName: nodeCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'nodeCount: number'
      return:
        description: ''
        type: number
  - name: parameterGroup
    uid: '@azure/arm-horizondb.PoolProperties.parameterGroup'
    package: '@azure/arm-horizondb'
    summary: >-
      The required parameter group associated with the pool. When creating a new
      pool in this API version, the caller must supply the corresponding default
      parameter group; customer-created parameter groups are not accepted during
      creation. For an existing pool, PUT or PATCH can associate either the
      corresponding default parameter group or a customer-created parameter
      group. The create-visible shape intentionally supports both resource ID
      forms so a future API version can allow customer-created parameter groups
      during creation without a breaking schema change.
    fullName: parameterGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parameterGroup: PoolParameterGroupReference'
      return:
        description: ''
        type: <xref uid="@azure/arm-horizondb.PoolParameterGroupReference" />
  - name: provisioningState
    uid: '@azure/arm-horizondb.PoolProperties.provisioningState'
    package: '@azure/arm-horizondb'
    summary: The provisioning state of the pool.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: scheduledMaintenance
    uid: '@azure/arm-horizondb.PoolProperties.scheduledMaintenance'
    package: '@azure/arm-horizondb'
    summary: >-
      The scheduled maintenance configuration for the pool. The properties
      available depend on the selected maintenance management type.
    fullName: scheduledMaintenance
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scheduledMaintenance?: ScheduledMaintenancePropertiesUnion'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-horizondb.ScheduledMaintenancePropertiesUnion"
          />
  - name: state
    uid: '@azure/arm-horizondb.PoolProperties.state'
    package: '@azure/arm-horizondb'
    summary: Current state of the pool.
    fullName: state
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'state?: string'
      return:
        description: ''
        type: string
