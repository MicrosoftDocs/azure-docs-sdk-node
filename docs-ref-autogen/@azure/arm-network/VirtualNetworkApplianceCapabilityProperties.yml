  - name: ipVersion
    uid: '@azure/arm-network.VirtualNetworkApplianceCapabilityProperties.ipVersion'
    package: '@azure/arm-network'
    summary: >-
      The IP version the capability applies to. Private Link Gateway FastPath
      (`PLGatewayFastpath`)

      only accepts `DualStack`; Private Link Gateway (`PLGateway`) and Private
      Link IP-forwarders

      (`PLIPForwarders`) only accept `IPv6`. Not applicable to `NAT64`, which is
      property-less and must

      omit this value. The service validates the value against the resource's
      `kind` when the

      capability is created or updated.
    fullName: ipVersion
    remarks: ''
