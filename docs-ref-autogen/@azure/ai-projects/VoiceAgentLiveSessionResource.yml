### YamlMime:TSType
name: VoiceAgentLiveSessionResource
uid: '@azure/ai-projects.VoiceAgentLiveSessionResource'
package: '@azure/ai-projects'
summary: >-
  Live session resource reported to Foundry clients. GPT Live runs native client
  delegation for foundry_managed_agent sessions; Foundry reports the effective
  owner.
fullName: VoiceAgentLiveSessionResource
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.audio'
    package: '@azure/ai-projects'
    summary: >-
      Startup audio configuration. Only primary WebSockets accept audio.format;
      WebRTC and SIP negotiate their media format. Voice and format are
      immutable after startup.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio?: LiveInitialSessionAudioParam'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveInitialSessionAudioParam" />
  - name: client
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.client'
    package: '@azure/ai-projects'
    summary: >-
      Startup-only capabilities for an untrusted frontend attached to a unified
      WebRTC session. Trusted sideband connections are unaffected.
    fullName: client
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'client?: LiveClientConfigParam'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveClientConfigParam" />
  - name: delegation
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.delegation'
    package: '@azure/ai-projects'
    summary: >-
      Delegation owner. foundry_managed_agent sessions report the pinned target,
      including the resolved agent_version.
    fullName: delegation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delegation?: VoiceAgentLiveDelegationUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentLiveDelegationUnion" />
  - name: expires_at
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.expires_at'
    package: '@azure/ai-projects'
    summary: The Unix timestamp, in seconds, at which the Live session expires.
    fullName: expires_at
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'expires_at: number'
      return:
        description: ''
        type: number
  - name: id
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.id'
    package: '@azure/ai-projects'
    summary: >-
      The unique ID of the Live session. Use this ID for sideband connections,
      forking, and recording download.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id: string'
      return:
        description: ''
        type: string
  - name: input
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.input'
    package: '@azure/ai-projects'
    summary: >-
      Ordered text-only history supplied before startup. Supports developer,
      user, and assistant messages with one text part each; at most 128 messages
      and a configured rendered-token limit (8,192 by default).
    fullName: input
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'input?: LiveInitialItemUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveInitialItemUnion" />[]
  - name: instructions
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.instructions'
    package: '@azure/ai-projects'
    summary: Instructions that guide the Live model's behavior during the session.
    fullName: instructions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instructions?: string'
      return:
        description: ''
        type: string
  - name: model
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.model'
    package: '@azure/ai-projects'
    summary: The Live model used to process audio and generate spoken responses.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model: "gpt-live-1"'
      return:
        description: ''
        type: '"gpt-live-1"'
  - name: status
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.status'
    package: '@azure/ai-projects'
    summary: >-
      The status of the session snapshot. Always `active`, including the final
      snapshot in session.closed; use the event type to determine that the
      session has closed.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status: "active"'
      return:
        description: ''
        type: '"active"'
  - name: store
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.store'
    package: '@azure/ai-projects'
    summary: >-
      Whether to store the session for later forking and recording download.
      Defaults to false for new sessions.
    fullName: store
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'store?: boolean'
      return:
        description: ''
        type: boolean
  - name: triggers
    uid: '@azure/ai-projects.VoiceAgentLiveSessionResource.triggers'
    package: '@azure/ai-projects'
    summary: >-
      At most one Decisions trigger per transcript event type. Triggers run
      independently of delegation. On update, omit triggers to keep the current
      configuration, send a list to replace it, or send an empty list to disable
      triggers.
    fullName: triggers
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'triggers?: LiveDecisionTriggerInputParam[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveDecisionTriggerInputParam" />[]
