### YamlMime:TSEnum
name: KnownVirtualMachinePriorityTypes
uid: '@azure/arm-compute.KnownVirtualMachinePriorityTypes'
package: '@azure/arm-compute'
summary: >-
  Specifies the priority for a standalone virtual machine or the virtual
  machines in the scale set.
fullName: KnownVirtualMachinePriorityTypes
remarks: ''
isDeprecated: false
fields:
  - name: Low
    uid: '@azure/arm-compute.KnownVirtualMachinePriorityTypes.Low'
    package: '@azure/arm-compute'
    summary: >-
      Low priority for a standalone virtual machine or the virtual machines in
      the scale set. Will be Deprecated, use Spot instead.
  - name: Regular
    uid: '@azure/arm-compute.KnownVirtualMachinePriorityTypes.Regular'
    package: '@azure/arm-compute'
    summary: >-
      Regular Priority for a standalone virtual machine or the virtual machines
      in the scale set.

      This is the default priority and it will be used to deploy regular
      VM/VMSS.
  - name: Spot
    uid: '@azure/arm-compute.KnownVirtualMachinePriorityTypes.Spot'
    package: '@azure/arm-compute'
    summary: >-
      Spot priority for a standalone virtual machine or the virtual machines in
      the scale set.
  - name: SpotPlus
    uid: '@azure/arm-compute.KnownVirtualMachinePriorityTypes.SpotPlus'
    package: '@azure/arm-compute'
    summary: >-
      SpotPlus priority for a standalone virtual machine or the virtual machines
      in the scale set.

      This is an enum value that will be used to deploy Azure Spot Plus VM/VMSS,
      which is the next

      generation of Azure Spot VM/VMSS with more reliability and longer running
      time.
