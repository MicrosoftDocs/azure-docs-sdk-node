name: SoftDeleteActionKind
uid: '@azure/arm-cosmosdb.SoftDeleteActionKind'
package: '@azure/arm-cosmosdb'
summary: >-
  The kind of soft delete action to perform. \

  [KnownSoftDeleteActionKind](xref:@azure/arm-cosmosdb.KnownSoftDeleteActionKind)
  can be used interchangeably with SoftDeleteActionKind,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **RestoreSoftDeletedResource**: Restores the soft-deleted resource to
  active/online state. \

  **PermanentDeleteResource**: Permanently deletes the soft-deleted resource.
