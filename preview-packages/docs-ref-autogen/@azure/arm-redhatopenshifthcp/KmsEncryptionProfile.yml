name: KmsEncryptionProfile
uid: '@azure/arm-redhatopenshifthcp.KmsEncryptionProfile'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  Configure etcd encryption Key Management Service (KMS) key.

  Your Microsoft Entra application used to create the cluster must be authorized
  to access this keyvault,

  e.g using the AzureCLI: `az keyvault set-policy -n $KEYVAULT_NAME
  --key-permissions decrypt encrypt --spn (YOUR APPLICATION CLIENT ID)`
fullName: KmsEncryptionProfile
