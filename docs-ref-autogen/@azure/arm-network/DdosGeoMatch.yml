### YamlMime:TSType
name: DdosGeoMatch
uid: '@azure/arm-network.DdosGeoMatch'
package: '@azure/arm-network'
summary: >-
  A geographic source match. The service validates that at least one of
  continent or countryCode is specified. If both are specified, the service
  validates that the country belongs to the continent according to the
  service-defined mapping. For example, RU, TR, and KZ map to Asia, EG maps to
  Africa, and CY maps to Europe.
fullName: DdosGeoMatch
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: continent
    uid: '@azure/arm-network.DdosGeoMatch.continent'
    package: '@azure/arm-network'
    summary: >-
      The continent to match. Country membership follows the service-defined
      mapping documented on DdosGeoMatch.
    fullName: continent
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'continent?: string'
      return:
        description: ''
        type: string
  - name: countryCode
    uid: '@azure/arm-network.DdosGeoMatch.countryCode'
    package: '@azure/arm-network'
    summary: >-
      The uppercase two-letter ISO 3166-1 alpha-2 code for the country or
      territory to match.
    fullName: countryCode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'countryCode?: string'
      return:
        description: ''
        type: string
