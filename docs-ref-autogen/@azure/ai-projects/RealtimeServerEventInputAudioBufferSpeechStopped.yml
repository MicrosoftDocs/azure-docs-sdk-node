name: RealtimeServerEventInputAudioBufferSpeechStopped
uid: '@azure/ai-projects.RealtimeServerEventInputAudioBufferSpeechStopped'
package: '@azure/ai-projects'
summary: |-
  Returned in `server_vad` mode when the server detects the end of speech in
  the audio buffer. The server will also send an `conversation.item.created`
  event with the user message item that is created from the audio buffer.
fullName: RealtimeServerEventInputAudioBufferSpeechStopped
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio_end_ms
    uid: >-
      @azure/ai-projects.RealtimeServerEventInputAudioBufferSpeechStopped.audio_end_ms
    package: '@azure/ai-projects'
    summary: |-
      Milliseconds since the session started when speech stopped. This will
        correspond to the end of audio sent to the model, and thus includes the
        `min_silence_duration_ms` configured in the Session.
    fullName: audio_end_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio_end_ms: number'
      return:
        description: ''
        type: number
  - name: event_id
