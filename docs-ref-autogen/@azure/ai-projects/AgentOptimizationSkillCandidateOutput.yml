### YamlMime:TSType
name: AgentOptimizationSkillCandidateOutput
uid: '@azure/ai-projects.AgentOptimizationSkillCandidateOutput'
package: '@azure/ai-projects'
summary: >-
  Output of the single generated candidate produced by trace-driven skill
  optimization. It can contain zero or more independent skill outcomes. Optional
  reporting-only evaluation reuses a baseline candidate and each candidate's
  evaluation summary; the baseline is not a generated alternative.
fullName: AgentOptimizationSkillCandidateOutput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: skill_results
    uid: '@azure/ai-projects.AgentOptimizationSkillCandidateOutput.skill_results'
    package: '@azure/ai-projects'
    summary: >-
      Independent proposed skill outcomes. A completed empty array means no
      changes were proposed, for example because there were no new learnings; no
      new versions are published in that case. Discovered but untouched skills
      do not require outcomes. Populated on candidate GET when available and
      omitted from LIST summaries.
    fullName: skill_results
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'skill_results?: AgentOptimizationSkillResult[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationSkillResult" />[]
  - name: type
    uid: '@azure/ai-projects.AgentOptimizationSkillCandidateOutput.type'
    package: '@azure/ai-projects'
    summary: Skill optimization output discriminator.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "skill_optimization"'
      return:
        description: ''
        type: '"skill_optimization"'
extends: <xref uid="@azure/ai-projects.AgentOptimizationCandidateOutput" />
