### YamlMime:TSType
name: LiveDataChannelConfigParam
uid: '@azure/ai-projects.LiveDataChannelConfigParam'
package: '@azure/ai-projects'
summary: >-
  Control which Live events an untrusted WebRTC frontend can send and receive
  over its data channel. These restrictions do not apply to trusted sideband
  connections.
fullName: LiveDataChannelConfigParam
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: allowed_client_events
    uid: '@azure/ai-projects.LiveDataChannelConfigParam.allowed_client_events'
    package: '@azure/ai-projects'
    summary: >-
      Client event types that the frontend data channel may send. Use 'all' to
      allow every client event; an empty array allows none. Omission preserves
      the existing allow-all behavior.
    fullName: allowed_client_events
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowed_client_events?: string[] | "all"'
      return:
        description: ''
        type: string[] | "all"
  - name: allowed_server_events
    uid: '@azure/ai-projects.LiveDataChannelConfigParam.allowed_server_events'
    package: '@azure/ai-projects'
    summary: >-
      Server events that may be sent to the frontend data channel. Use 'all' to
      allow every server event; an empty array allows none. Omission preserves
      the existing allow-all behavior. Responses events use an object with type
      'response.event' and a response_event selector.
    fullName: allowed_server_events
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowed_server_events?: "all" | LiveAllowedServerEventParam[]'
      return:
        description: ''
        type: >-
          "all" | <xref uid="@azure/ai-projects.LiveAllowedServerEventParam"
          />[]
