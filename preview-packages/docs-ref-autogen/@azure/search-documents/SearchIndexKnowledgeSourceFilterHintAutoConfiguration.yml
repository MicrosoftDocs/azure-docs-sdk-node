### YamlMime:TSType
name: SearchIndexKnowledgeSourceFilterHintAutoConfiguration
uid: '@azure/search-documents.SearchIndexKnowledgeSourceFilterHintAutoConfiguration'
package: '@azure/search-documents'
summary: >-
  Configures automatic resolution of a filter hint's grounding values from the
  target index facets.
fullName: SearchIndexKnowledgeSourceFilterHintAutoConfiguration
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: cacheTtl
    uid: >-
      @azure/search-documents.SearchIndexKnowledgeSourceFilterHintAutoConfiguration.cacheTtl
    package: '@azure/search-documents'
    summary: >-
      The number of seconds resolved facet values are cached. The allowed range
      is 60 through 3600 on dedicated services and 60 through 900 on serverless
      services. When omitted, defaults to 3600 seconds on dedicated services and
      900 seconds on serverless services.
    fullName: cacheTtl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cacheTtl?: number'
      return:
        description: ''
        type: number
  - name: maxFacetValueCount
    uid: >-
      @azure/search-documents.SearchIndexKnowledgeSourceFilterHintAutoConfiguration.maxFacetValueCount
    package: '@azure/search-documents'
    summary: >-
      The maximum number of facet values to use as grounding. Defaults to 64;
      allowed range is 1 through 64. Values are selected in descending
      facet-count order, subject to the same 2048-character combined-length
      limit and 128-character per-value limit as manually specified filter
      values.
    fullName: maxFacetValueCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxFacetValueCount?: number'
      return:
        description: ''
        type: number
