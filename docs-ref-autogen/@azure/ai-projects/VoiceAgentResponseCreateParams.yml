name: VoiceAgentResponseCreateParams
uid: '@azure/ai-projects.VoiceAgentResponseCreateParams'
package: '@azure/ai-projects'
summary: Parameters accepted by a voice-agent `response.create` event.
fullName: VoiceAgentResponseCreateParams
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.VoiceAgentResponseCreateParams.audio'
    package: '@azure/ai-projects'
    summary: Response-specific audio settings.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio?: PickPropertiesVoiceAgentAudioConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.PickPropertiesVoiceAgentAudioConfig" />
  - name: conversation
    uid: '@azure/ai-projects.VoiceAgentResponseCreateParams.conversation'
    package: '@azure/ai-projects'
    summary: |-
      Controls which conversation the response is added to. Currently supports
        `auto` and `none`, with `auto` as the default value. The `auto` value
        means that the contents of the response will be added to the default
        conversation. Set this to `none` to create an out-of-band response which
        will not add items to default conversation.
    fullName: conversation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'conversation?: "auto" | "none"'
      return:
        description: ''
        type: '"auto" | "none"'
  - name: input
    uid: '@azure/ai-projects.VoiceAgentResponseCreateParams.input'
    package: '@azure/ai-projects'
    summary: Conversation items used as inline response input.
    fullName: input
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'input?: RealtimeConversationItemUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.RealtimeConversationItemUnion" />[]
  - name: instructions
    uid: '@azure/ai-projects.VoiceAgentResponseCreateParams.instructions'
    package: '@azure/ai-projects'
    summary: >-
      The default system instructions (i.e. system message) prepended to model
      calls. This field allows the client to guide the model on desired
      responses. The model can be instructed on response content and format,
      (e.g. "be extremely succinct", "act friendly", "here are examples of good
      responses") and on audio behavior (e.g. "talk quickly", "inject emotion
      into your voice", "laugh frequently"). The instructions are not guaranteed
      to be followed by the model, but they provide guidance to the model on the
      desired behavior.
        Note that the server sets default instructions which will be used if this field is not set and are visible in the `session.created` event at the start of the session.
    fullName: instructions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instructions?: string'
      return:
        description: ''
        type: string
  - name: interim_response
    uid: '@azure/ai-projects.VoiceAgentResponseCreateParams.interim_response'
    package: '@azure/ai-projects'
    summary: Interim-response settings for this response.
    fullName: interim_response
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'interim_response?: VoiceAgentInterimResponseConfigUnion'
      return:
        description: ''
