  - name: createOrReplace
    uid: >-
      @azure/arm-horizondb.MicrosoftEntraAuthenticationsOperations.createOrReplace
    package: '@azure/arm-horizondb'
    summary: >-
      Creates or replaces the service-created Microsoft Entra authentication
      method. State Enabled enables the feature and State Disabled disables it;
      no additional properties are required. Repeating the same request is
      idempotent. Disabling the feature does not remove or modify database roles
      or users previously created through the MicrosoftEntraAdministrators
      control-plane API or directly through pgaadauth extension functions.
