### YamlMime:TSType
name: EndpointUpdateProperties
uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties'
package: '@azure/arm-privatetrafficmanager'
summary: The updatable properties of the Endpoint.
fullName: EndpointUpdateProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: alwaysServe
    uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties.alwaysServe'
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      Indicates whether endpoint is Always Serve or not. Always Serve endpoints
      are always considered to be healthy.
    fullName: alwaysServe
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'alwaysServe?: string'
      return:
        description: ''
        type: string
  - name: endpointStatus
    uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties.endpointStatus'
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      The status of the endpoint. If the endpoint is Enabled, it is probed for
      endpoint health and is included in the traffic routing method.
    fullName: endpointStatus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'endpointStatus?: string'
      return:
        description: ''
        type: string
  - name: healthPolicyId
    uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties.healthPolicyId'
    package: '@azure/arm-privatetrafficmanager'
    summary: The health policy associated with this endpoint.
    fullName: healthPolicyId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'healthPolicyId?: string'
      return:
        description: ''
        type: string
  - name: monitoringTarget
    uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties.monitoringTarget'
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      Monitoring target is where Private Traffic Manager will gather health
      information.It can differ from the endpoint target, for example when the
      target is an IPv6 address. If not configured, the endpoint target is used.
      It is required when the target is IPv6 and cannot itself be an IPv6
      address.
    fullName: monitoringTarget
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'monitoringTarget?: string'
      return:
        description: ''
        type: string
  - name: priority
    uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties.priority'
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      The priority of this endpoint when using the 'Priority' traffic routing
      method. Possible values are from 1 to 1000, lower values represent higher
      priority. This is an optional parameter.  If specified, it must be
      specified on all endpoints, and no two endpoints can share the same
      priority value.
    fullName: priority
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'priority?: number'
      return:
        description: ''
        type: number
  - name: target
    uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties.target'
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      The fully-qualified DNS name or IP address of the endpoint. Traffic
      Manager returns this value in DNS responses to direct traffic to this
      endpoint.
    fullName: target
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'target?: string'
      return:
        description: ''
        type: string
  - name: virtualNetworkIds
    uid: >-
      @azure/arm-privatetrafficmanager.EndpointUpdateProperties.virtualNetworkIds
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      The virtual network ARM resource IDs assigned to this endpoint when using
      the 'VNet' traffic routing method. A virtual network must not be assigned
      to more than one endpoint in the profile. A profile can have at most one
      fallback endpoint; an endpoint with no virtual networks is that fallback.
    fullName: virtualNetworkIds
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'virtualNetworkIds?: string[]'
      return:
        description: ''
        type: string[]
  - name: weight
    uid: '@azure/arm-privatetrafficmanager.EndpointUpdateProperties.weight'
    package: '@azure/arm-privatetrafficmanager'
    summary: >-
      The weight of this endpoint when using the 'Weighted' traffic routing
      method. Possible values are from 1 to 1000.
    fullName: weight
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'weight?: number'
      return:
        description: ''
        type: number
