### YamlMime:TSEnum
name: KnownPoolHighAvailabilityMode
uid: '@azure/arm-horizondb.KnownPoolHighAvailabilityMode'
package: '@azure/arm-horizondb'
summary: The high-availability mode requested for a HorizonDB pool.
fullName: KnownPoolHighAvailabilityMode
remarks: ''
isDeprecated: false
fields:
  - name: AnyZone
    uid: '@azure/arm-horizondb.KnownPoolHighAvailabilityMode.AnyZone'
    package: '@azure/arm-horizondb'
    summary: >-
      The service may allocate nodes in the same availability zone or across
      availability zones. This mode is valid only when nodeCount is 2 through
      16.
  - name: Disabled
    uid: '@azure/arm-horizondb.KnownPoolHighAvailabilityMode.Disabled'
    package: '@azure/arm-horizondb'
    summary: >-
      High availability is disabled. This mode is valid only when nodeCount is
      1.
  - name: ZoneRedundant
    uid: '@azure/arm-horizondb.KnownPoolHighAvailabilityMode.ZoneRedundant'
    package: '@azure/arm-horizondb'
    summary: >-
      The service must allocate nodes across availability zones. This mode is
      valid only when nodeCount is 2 through 16.
