  - name: delete
    uid: '@azure/arm-networksecurity.ClusterAssociationsOperations.delete'
    package: '@azure/arm-networksecurity'
    summary: >-
      Deletes the association. Idempotent: returns `202 Accepted` when
      completion is

      asynchronous, and `204 No Content` when it completes synchronously or the

      association is already absent.


      For an association enrolling an ACI SandboxGroup (`clusterResourceId` of
      type

      `Microsoft.ContainerInstance/sandboxGroups`), the service returns

      `409 ClusterAssociationNotEmpty` while any Member still references the

      SandboxGroup. All such Members must be deleted before the association can
      be

      removed.


      ```json

      {
        "error": {
          "code": "ClusterAssociationNotEmpty",
          "message": "The ClusterAssociation cannot be deleted because one or more members still reference it.",
          "target": "properties.clusterResourceId"
        }
      }

      ```
    fullName: delete
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        delete: (resourceGroupName: string, agentFabricName: string,
        clusterAssociationName: string, options?:
        ClusterAssociationsDeleteOptionalParams) =>
        PollerLike<OperationState<void>, void>
      return:
