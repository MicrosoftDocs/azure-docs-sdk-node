  - name: networkSecurityPolicies
    uid: '@azure/arm-networksecurity.PolicyGroupProperties.networkSecurityPolicies'
    package: '@azure/arm-networksecurity'
    summary: >-
      The list of network security policies. A PUT introducing a
      ContentInspection

      policy is incompatible if any associated fabric has no configured
      inspection connection,

      regardless of whether selectors currently match traffic. The request is
      rejected before

      persisting or distributing the proposed changes, preserving the previously

      accepted policies; mixed compatible and incompatible associations cannot
      partially apply

      changes or silently skip inspection. An unattached group, or one attached
      only to compatible

      fabrics, may contain ContentInspection policies. Removing
      ContentInspection policies remains allowed,

      subject to other validation.
    fullName: networkSecurityPolicies
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'networkSecurityPolicies?: NetworkSecurityPolicyBaseUnion[]'
      return:
        description: ''
        type: >-
