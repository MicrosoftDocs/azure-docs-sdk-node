  - name: createOrReplace
    uid: '@azure/arm-horizondb.PoolsOperations.createOrReplace'
    package: '@azure/arm-horizondb'
    summary: >-
      Creates a new HorizonDB pool or replaces an existing pool, including its
      node allocation, compute model, high-availability configuration, or
      associated parameter group. nodeCount and highAvailability.mode are
      required and have no service defaults. nodeCount must be 1 through 16.
      Disabled is valid only when nodeCount is 1. AnyZone and ZoneRedundant are
      valid only when nodeCount is 2 through 16. AnyZone permits same-zone or
      cross-zone placement, while ZoneRedundant requires nodes to be allocated
      across availability zones. Node allocation and high-availability
      reconfiguration are atomic: if all requested nodes or the required zonal
      topology cannot be provisioned, the long-running operation fails and the
      previous resource state is preserved. A pool name must differ from its
      parent cluster name because the Cluster-scoped ReadWrite Endpoint is named
      after the Cluster and the Pool-scoped ReadOnly Endpoint is named after the
      Pool; the service rejects a request whose names would collide. Creating a
      pool also creates exactly one service-managed Pool-scoped ReadOnly
      Endpoint representing that Pool and its network boundary. The Endpoint's
      associatedResourceId identifies the Pool, and the Endpoint cannot outlive
      or be deleted independently from it. When the first pool is created, the
      service automatically designates it to host the cluster's read-write node
      when an eligible node is available. A Cluster must contain at least one
      Pool before a private endpoint connection can be created or approved. This
      API version supports at most one pool per cluster; an attempt to create
      another pool is rejected with 409 Conflict. parameterGroup,
      parameterGroupResourceId, and applyMethod are required. When creating a
      new pool in this API version, parameterGroupResourceId must identify the
      corresponding default parameter group; a customer-created parameter group
      is rejected. When replacing an existing pool, the request can switch its
      association in either direction between the corresponding default
      parameter group and a customer-created parameter group. applyMethod
      controls when dynamic parameter changes become effective. Static parameter
      changes always require a customer-initiated Restart; Stop followed by
      Start and scheduled maintenance do not apply pending changes.
      Subtype-specific compute constraints are validated before the resource is
      changed.
    fullName: createOrReplace
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        createOrReplace: (resourceGroupName: string, clusterName: string,
        poolName: string, resource: PoolCreateOrUpdate, options?:
        PoolsCreateOrReplaceOptionalParams) => PollerLike<OperationState<Pool>,
        Pool>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, clusterName: string, poolName: string,
          resource: PoolCreateOrUpdate, options?:
          PoolsCreateOrReplaceOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;Pool&gt;, Pool&gt;
  - name: delete
    uid: '@azure/arm-horizondb.PoolsOperations.delete'
    package: '@azure/arm-horizondb'
    summary: >-
      Deletes a HorizonDB pool together with the Pool-scoped Endpoint whose
      associatedResourceId identifies that Pool and all FirewallRule children of
      that Endpoint. The Endpoint cannot outlive or be deleted independently
      from its Pool. When this is the Cluster's last surviving Pool, the service
      also disconnects every existing private endpoint connection associated
      with the Cluster by setting its privateLinkServiceConnectionState.status
      to Rejected and providing a description that the last Pool was deleted.
      The HorizonDB private endpoint connection resources remain available for
      inspection and cleanup, and customer-owned
      Microsoft.Network/privateEndpoints resources are not deleted. The delete
      long-running operation completes only after all required private endpoint
      disconnections have completed.
    fullName: delete
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        delete: (resourceGroupName: string, clusterName: string, poolName:
        string, options?: PoolsDeleteOptionalParams) =>
        PollerLike<OperationState<void>, void>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, clusterName: string, poolName: string,
          options?: PoolsDeleteOptionalParams) =&gt;
          PollerLike&lt;OperationState&lt;void&gt;, void&gt;
