  - name: isDefaultVersion
    uid: '@azure/arm-edgeactions.EdgeActionVersionProperties.isDefaultVersion'
    package: '@azure/arm-edgeactions'
    summary: >-
      Indicates whether this is the default version. When creating a version, if
      the Edge Action has no default version, the service makes the new version
      the default even when false is supplied. If another default version
      exists, supplying true is rejected. When updating an existing version, any
      supplied value must match the existing value. Use swapDefault to change
      the default version.
    fullName: isDefaultVersion
