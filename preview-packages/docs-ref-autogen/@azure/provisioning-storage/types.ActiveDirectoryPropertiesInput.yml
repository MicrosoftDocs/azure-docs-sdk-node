### YamlMime:TSType
name: ActiveDirectoryPropertiesInput
uid: '@azure/provisioning-storage.types.ActiveDirectoryPropertiesInput'
package: '@azure/provisioning-storage'
summary: Input type for Settings properties for Active Directory (AD).
fullName: ActiveDirectoryPropertiesInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: accountType
    uid: >-
      @azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.accountType
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the Active Directory account type for Azure Storage. If
      directoryServiceOptions is set to AD (AD DS authentication), this property
      is optional. If provided, samAccountName should also be provided. For
      directoryServiceOptions AADDS (Entra DS authentication) or AADKERB (Entra
      authentication), this property can be omitted.
    fullName: accountType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'accountType?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: azureStorageSid
    uid: >-
      @azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.azureStorageSid
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the security identifier (SID) for Azure Storage. If
      directoryServiceOptions is set to AD (AD DS authentication), this property
      is required. Otherwise, it can be omitted.
    fullName: azureStorageSid
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'azureStorageSid?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: domainGuid
    uid: >-
      @azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.domainGuid
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the domain GUID. If directoryServiceOptions is set to AD (AD DS
      authentication), this property is required. If directoryServiceOptions is
      set to AADDS (Entra DS authentication), this property can be omitted. If
      directoryServiceOptions is set to AADKERB (Entra authentication), this
      property is optional; it is needed to support configuration of directory-
      and file-level permissions via Windows File Explorer, but is not required
      for authentication.
    fullName: domainGuid
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'domainGuid?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: domainName
    uid: >-
      @azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.domainName
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the primary domain that the AD DNS server is authoritative for.
      This property is required if directoryServiceOptions is set to AD (AD DS
      authentication). If directoryServiceOptions is set to AADDS (Entra DS
      authentication), providing this property is optional, as it will be
      inferred automatically if omitted. If directoryServiceOptions is set to
      AADKERB (Entra authentication), this property is optional; it is needed to
      support configuration of directory- and file-level permissions via Windows
      File Explorer, but is not required for authentication.
    fullName: domainName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'domainName?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: domainSid
    uid: '@azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.domainSid'
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the security identifier (SID) of the AD domain. If
      directoryServiceOptions is set to AD (AD DS authentication), this property
      is required. Otherwise, it can be omitted.
    fullName: domainSid
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'domainSid?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: forestName
    uid: >-
      @azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.forestName
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the Active Directory forest to get. If directoryServiceOptions
      is set to AD (AD DS authentication), this property is required. Otherwise,
      it can be omitted.
    fullName: forestName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'forestName?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: netBiosDomainName
    uid: >-
      @azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.netBiosDomainName
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the NetBIOS domain name. If directoryServiceOptions is set to AD
      (AD DS authentication), this property is required. Otherwise, it can be
      omitted.
    fullName: netBiosDomainName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'netBiosDomainName?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: samAccountName
    uid: >-
      @azure/provisioning-storage.types.ActiveDirectoryPropertiesInput.samAccountName
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the Active Directory SAMAccountName for Azure Storage. If
      directoryServiceOptions is set to AD (AD DS authentication), this property
      is optional. If provided, accountType should also be provided. For
      directoryServiceOptions AADDS (Entra DS authentication) or AADKERB (Entra
      authentication), this property can be omitted.
    fullName: samAccountName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'samAccountName?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
extends: >-
  unknown&lt;<xref
  uid="@azure/provisioning-storage.types.ActiveDirectoryProperties" />&gt;
