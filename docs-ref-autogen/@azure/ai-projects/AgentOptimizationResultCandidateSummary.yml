    uid: >-
      @azure/ai-projects.AgentOptimizationResultCandidateSummary.completed_candidate_count
    package: '@azure/ai-projects'
    summary: Number of completed candidates. Does not include the baseline.
    fullName: completed_candidate_count
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'completed_candidate_count: number'
      return:
        description: ''
        type: number
