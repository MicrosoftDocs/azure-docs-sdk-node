name: ImmutabilityType
uid: '@azure/arm-dataprotection.ImmutabilityType'
package: '@azure/arm-dataprotection'
summary: >-
  Type of immutability configuration. \

  [KnownImmutabilityType](xref:@azure/arm-dataprotection.KnownImmutabilityType)
  can be used interchangeably with ImmutabilityType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AsPerPolicy**: Immutability is enforced as per the backup policy retention.
  \

  **TimeBased**: Time-based immutability with a configurable duration window.
