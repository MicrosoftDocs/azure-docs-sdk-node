    syntax:
      content: 'lastOperation?: AdapterDeploymentLastOperation'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-cognitiveservices.AdapterDeploymentLastOperation" />
  - name: provisioningState
    uid: '@azure/arm-cognitiveservices.AdapterDeploymentProperties.provisioningState'
    package: '@azure/arm-cognitiveservices'
    summary: The provisioning state of the adapter deployment.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: sourceModelId
    uid: '@azure/arm-cognitiveservices.AdapterDeploymentProperties.sourceModelId'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The immutable Project Models version produced by Foundry fine-tuning.

      The identifier uses the Azure AI project model URI format.

      Model and version segments use ASCII letters, digits, periods,
      underscores, and hyphens.

      The service validates LoRA weight type, protected status, provenance,

      compatibility metadata, and registration state.
    fullName: sourceModelId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sourceModelId: string'
      return:
        description: ''
        type: string
  - name: targetDeploymentName
    uid: >-
      @azure/arm-cognitiveservices.AdapterDeploymentProperties.targetDeploymentName
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The name of the compatible managed compute parent deployment.

      The service resolves this name within the adapter's owning account; full

      Azure Resource Manager resource IDs and cross-account references are not
      accepted. It cannot

      equal the adapter deployment's resource name. Updating this value

      re-targets the adapter while its source model remains unchanged.
    fullName: targetDeploymentName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetDeploymentName: string'
      return:
        description: ''
        type: string
