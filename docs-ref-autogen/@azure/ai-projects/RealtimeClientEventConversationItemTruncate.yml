### YamlMime:TSType
name: RealtimeClientEventConversationItemTruncate
uid: '@azure/ai-projects.RealtimeClientEventConversationItemTruncate'
package: '@azure/ai-projects'
summary: |-
  Send this event to truncate a previous assistant message’s audio. The server
  will produce audio faster than realtime, so this event is useful when the user
  interrupts to truncate audio that has already been sent to the client but not
  yet played. This will synchronize the server's understanding of the audio with
  the client's playback.
  Truncating audio will delete the server-side text transcript to ensure there
  is not text in the context that hasn't been heard by the user.
  If successful, the server will respond with a `conversation.item.truncated`
  event.
fullName: RealtimeClientEventConversationItemTruncate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio_end_ms
    uid: >-
      @azure/ai-projects.RealtimeClientEventConversationItemTruncate.audio_end_ms
    package: '@azure/ai-projects'
    summary: |-
      Inclusive duration up to which audio is truncated, in milliseconds. If
        the audio_end_ms is greater than the actual audio duration, the server
        will respond with an error.
    fullName: audio_end_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio_end_ms: number'
      return:
        description: ''
        type: number
  - name: content_index
    uid: >-
      @azure/ai-projects.RealtimeClientEventConversationItemTruncate.content_index
    package: '@azure/ai-projects'
    summary: The index of the content part to truncate. Set this to `0`.
    fullName: content_index
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'content_index: number'
      return:
        description: ''
        type: number
  - name: event_id
    uid: '@azure/ai-projects.RealtimeClientEventConversationItemTruncate.event_id'
    package: '@azure/ai-projects'
    summary: Optional client-generated ID used to identify this event.
    fullName: event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'event_id?: string'
      return:
        description: ''
        type: string
  - name: item_id
    uid: '@azure/ai-projects.RealtimeClientEventConversationItemTruncate.item_id'
    package: '@azure/ai-projects'
    summary: |-
      The ID of the assistant message item to truncate. Only assistant message
