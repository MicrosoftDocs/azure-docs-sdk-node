name: AlertConfigurationProvisioningState
uid: '@azure/arm-containerservice.AlertConfigurationProvisioningState'
package: '@azure/arm-containerservice'
summary: >-
  The current provisioning state of the alert configuration. \

  [KnownAlertConfigurationProvisioningState](xref:@azure/arm-containerservice.KnownAlertConfigurationProvisioningState)
  can be used interchangeably with AlertConfigurationProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: Resource has been created. \

  **Failed**: Resource creation failed. \

  **Canceled**: Resource creation was canceled. \

  **Creating**: The alert configuration is being created. \

  **Updating**: The alert configuration is being updated. \

  **Deleting**: The alert configuration is being deleted.
