properties:
  - name: maxPrice
    uid: '@azure/arm-compute-bulkactions.BillingProfile.maxPrice'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Specifies the maximum price, in US Dollars, you are willing to pay per
      hour for each Azure Spot virtual machine. This price is compared with the
      current Azure Spot price for the virtual machine size at create time, and
      the operation only succeeds if maxPrice is greater than the current Azure
      Spot price. It is also used to evict a virtual machine if the current
      Azure Spot price rises above it after creation. Possible values are any
      decimal value greater than zero, or -1 to indicate the default price is
      up-to on-demand and the virtual machine should not be evicted for price
      reasons. The default is -1 when not provided.
    fullName: maxPrice
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxPrice?: number'
      return:
        description: ''
        type: number
