### YamlMime:TSType
name: RecommendedActionStateInfoView
uid: '@azure/provisioning-sql.types.RecommendedActionStateInfoView'
package: '@azure/provisioning-sql'
summary: >-
  View type for Contains information of current state for an Azure SQL Database,
  Server or Elastic Pool Recommended Action.
fullName: RecommendedActionStateInfoView
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: actionInitiatedBy
    uid: >-
      @azure/provisioning-sql.types.RecommendedActionStateInfoView.actionInitiatedBy
    package: '@azure/provisioning-sql'
    summary: >-
      Read-only output: Gets who initiated the execution of this recommended
      action. Possible Value are: User -> When user explicity notified system to
      apply the recommended action. System -> When auto-execute status of this
      advisor was set to 'Enabled', in which case the system applied it.
    fullName: actionInitiatedBy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'actionInitiatedBy?: Expression<RecommendedActionInitiatedBy>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-sql.types.RecommendedActionInitiatedBy"
          />&gt;
  - name: currentValue
    uid: '@azure/provisioning-sql.types.RecommendedActionStateInfoView.currentValue'
    package: '@azure/provisioning-sql'
    summary: >-
      Current state the recommended action is in. Some commonly used states are:
      Active -> recommended action is active and no action has been taken yet.
      Pending -> recommended action is approved for and is awaiting execution.
      Executing -> recommended action is being applied on the user database.
      Verifying -> recommended action was applied and is being verified of its
      usefulness by the system. Success -> recommended action was applied and
      improvement found during verification. Pending Revert -> verification
      found little or no improvement so recommended action is queued for revert
      or user has manually reverted. Reverting -> changes made while applying
      recommended action are being reverted on the user database. Reverted ->
      successfully reverted the changes made by recommended action on user
      database. Ignored -> user explicitly ignored/discarded the recommended
      action.
    fullName: currentValue
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'currentValue: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: lastModified
    uid: '@azure/provisioning-sql.types.RecommendedActionStateInfoView.lastModified'
    package: '@azure/provisioning-sql'
    summary: 'Read-only output: Gets the time when the state was last modified'
    fullName: lastModified
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastModified?: Expression<Date>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;Date&gt;
extends: >-
  unknown&lt;<xref
  uid="@azure/provisioning-sql.types.RecommendedActionStateInfo" />&gt;
