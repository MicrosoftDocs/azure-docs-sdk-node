### YamlMime:TSTypeAlias
name: VirtualMachineDiskNetworkAccessPolicy
uid: '@azure/arm-compute.VirtualMachineDiskNetworkAccessPolicy'
package: '@azure/arm-compute'
summary: >-
  Policy for accessing the disk via network. \

  [KnownVirtualMachineDiskNetworkAccessPolicy](xref:@azure/arm-compute.KnownVirtualMachineDiskNetworkAccessPolicy)
  can be used interchangeably with VirtualMachineDiskNetworkAccessPolicy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AllowAll**: The disk can be exported or uploaded from any network. \

  **AllowPrivate**: The disk can be exported or uploaded using a DiskAccess
  resource's private endpoints. \

  **DenyAll**: The disk cannot be exported.
fullName: VirtualMachineDiskNetworkAccessPolicy
remarks: ''
isDeprecated: false
syntax: |
  type VirtualMachineDiskNetworkAccessPolicy = string
