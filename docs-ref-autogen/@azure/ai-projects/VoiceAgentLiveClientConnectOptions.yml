    uid: '@azure/ai-projects.VoiceAgentLiveClientConnectOptions.onEvent'
    package: '@azure/ai-projects'
    summary: >-
      Receives events from startup onward, before connect() returns. An iterator
      started later receives subsequent events. Synchronous callback exceptions
      are logged without interrupting the connection.
    fullName: onEvent
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'onEvent?: (event: VoiceAgentLiveEvent) => void'
      return:
        description: ''
        type: '(event: VoiceAgentLiveEvent) =&gt; void'
  - name: sessionTimeoutInMs
    uid: '@azure/ai-projects.VoiceAgentLiveClientConnectOptions.sessionTimeoutInMs'
    package: '@azure/ai-projects'
    summary: >-
      Overrides the timeout for the service's session.started event, in
      milliseconds.
    fullName: sessionTimeoutInMs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sessionTimeoutInMs?: number'
      return:
        description: ''
        type: number
