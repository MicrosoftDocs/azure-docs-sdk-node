### YamlMime:TSTypeAlias
name: StringValueEncodingDescriptor
uid: '@azure/provisioning-core.StringValueEncodingDescriptor'
package: '@azure/provisioning-core'
summary: |-
  Encodings whose client-side value is a JavaScript `string`.

  The source TypeSpec scalar can be a date/time, duration, byte sequence,
  numeric value, or boolean. `clientMode: "wire"` is the important invariant:
  it means the generated TypeScript API exposes the encoded string itself.
fullName: StringValueEncodingDescriptor
remarks: ''
isDeprecated: false
syntax: |
  type StringValueEncodingDescriptor =
    | (DateTimeTextEncodingDescriptor & { clientMode: "wire" })
    | DurationIso8601EncodingDescriptor
    | (BytesEncodingDescriptor & { clientMode: "wire" })
    | (PlainDateEncodingDescriptor & { clientMode: "wire" })
    | NumericStringEncodingDescriptor
    | (BooleanStringEncodingDescriptor & { clientMode: "wire" })
