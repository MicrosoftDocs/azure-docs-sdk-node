name: NodeStorageType
uid: '@azure/arm-azurestackhci.NodeStorageType'
package: '@azure/arm-azurestackhci'
summary: >-
  Node storage type for an edge machine. \

  [KnownNodeStorageType](xref:@azure/arm-azurestackhci.KnownNodeStorageType) can
  be used interchangeably with NodeStorageType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **S2D**: Storage Spaces Direct (S2D) storage type. \

  **SANISCSI**: SAN iSCSI storage type. \

  **SANFC**: SAN Fibre Channel storage type.
