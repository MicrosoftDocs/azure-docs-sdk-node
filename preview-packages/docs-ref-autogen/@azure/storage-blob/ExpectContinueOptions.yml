### YamlMime:TSType
name: ExpectContinueOptions
uid: '@azure/storage-blob.ExpectContinueOptions'
package: '@azure/storage-blob'
summary: >-
  ONLY AVAILABLE IN NODE.JS RUNTIME.


  Options for sending the `Expect: 100-continue` header on requests with a body,
  such as uploads.

  The header lets the service reject a request, for example while it is
  throttling, before the

  body is sent.


  The default HTTP client in Node.js holds the body back until the service
  responds with

  `100 Continue`, and sends it anyway if that hasn't arrived after one second,
  so each request

  sent with the header can take up to one extra round trip, or one second,
  longer. When the

  service rejects a request before its body is sent, that connection isn't
  reused, so the next

  request, such as the retry, opens a new one. An HTTP client set with
  `httpClient` may send the

  body without waiting.


  Setting the environment variable
  `AZURE_STORAGE_DISABLE_EXPECT_CONTINUE_HEADER` to `true`

  (case-insensitive) or `1` stops the header from being sent, whatever these
  options say. The

  variable is read once per pipeline, when the first client on that pipeline is
  created.


  These options are exported from the browser and React Native entry points for
  type

  compatibility, but they have no effect there: the header is only sent in
  Node.js.
fullName: ExpectContinueOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: autoIntervalInMs
    uid: '@azure/storage-blob.ExpectContinueOptions.autoIntervalInMs'
    package: '@azure/storage-blob'
    summary: >-
      In `auto` mode, how long, in milliseconds, the header is sent after a
      response with status

      429, 500 or 503. Defaults to 60000 (one minute). Must be a finite number
      of 0 or more: in

      Node.js, creating a client with any other value throws a `RangeError`.
    fullName: autoIntervalInMs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'autoIntervalInMs?: number'
      return:
        description: ''
        type: number
  - name: minBodySizeInBytes
    uid: '@azure/storage-blob.ExpectContinueOptions.minBodySizeInBytes'
    package: '@azure/storage-blob'
    summary: >-
      The smallest body size, in bytes, that is sent with the header. Requests
      whose body is empty

      or smaller than this are sent without it. A body of unknown length counts
      as large. Defaults

      to 0. Must be a finite number of 0 or more: in Node.js, creating a client
      with any other value

      throws a `RangeError`.
    fullName: minBodySizeInBytes
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'minBodySizeInBytes?: number'
      return:
        description: ''
        type: number
  - name: mode
    uid: '@azure/storage-blob.ExpectContinueOptions.mode'
    package: '@azure/storage-blob'
    summary: >-
      When to send the header. Defaults to `auto`, or to `never` when
      `httpClient` is set, because

      some HTTP clients, such as ones built on `fetch`, reject the `Expect`
      header.
    fullName: mode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'mode?: ExpectContinueMode'
      return:
        description: ''
        type: <xref uid="@azure/storage-blob.ExpectContinueMode" />
