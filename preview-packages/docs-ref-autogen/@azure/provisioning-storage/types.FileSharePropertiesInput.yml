    fullName: enabledProtocols
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabledProtocols?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: fileSharePaidBursting
    uid: >-
      @azure/provisioning-storage.types.FileSharePropertiesInput.fileSharePaidBursting
