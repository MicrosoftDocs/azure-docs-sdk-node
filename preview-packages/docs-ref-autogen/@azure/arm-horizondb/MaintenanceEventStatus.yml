### YamlMime:TSTypeAlias
name: MaintenanceEventStatus
uid: '@azure/arm-horizondb.MaintenanceEventStatus'
package: '@azure/arm-horizondb'
summary: >-
  The status of a maintenance event. \

  [KnownMaintenanceEventStatus](xref:@azure/arm-horizondb.KnownMaintenanceEventStatus)
  can be used interchangeably with MaintenanceEventStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Planned**: The maintenance event is scheduled and has not yet started. \

  **InProgress**: The maintenance event is currently in progress. \

  **Complete**: The maintenance event completed successfully. \

  **Rescheduled**: The customer rescheduled the maintenance event. \

  **Canceled**: The maintenance event was canceled, failed, or timed out.
fullName: MaintenanceEventStatus
remarks: ''
isDeprecated: false
syntax: |
  type MaintenanceEventStatus = string
