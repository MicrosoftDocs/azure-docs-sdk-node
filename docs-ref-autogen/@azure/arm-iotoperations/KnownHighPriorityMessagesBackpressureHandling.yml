### YamlMime:TSEnum
name: KnownHighPriorityMessagesBackpressureHandling
uid: '@azure/arm-iotoperations.KnownHighPriorityMessagesBackpressureHandling'
package: '@azure/arm-iotoperations'
summary: Handling of high-priority messages during backpressure state.
fullName: KnownHighPriorityMessagesBackpressureHandling
remarks: ''
isDeprecated: false
fields:
  - name: Accept
    uid: >-
      @azure/arm-iotoperations.KnownHighPriorityMessagesBackpressureHandling.Accept
    package: '@azure/arm-iotoperations'
    summary: >-
      When the broker rejects regular-priority messages due to backpressure, it
      continues to accept high-priority messages.
  - name: Reject
    uid: >-
      @azure/arm-iotoperations.KnownHighPriorityMessagesBackpressureHandling.Reject
    package: '@azure/arm-iotoperations'
    summary: >-
      When the broker rejects regular-priority messages due to backpressure, it
      also rejects high-priority messages.
