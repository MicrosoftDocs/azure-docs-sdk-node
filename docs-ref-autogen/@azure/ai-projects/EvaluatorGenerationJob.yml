### YamlMime:TSType
name: EvaluatorGenerationJob
uid: '@azure/ai-projects.EvaluatorGenerationJob'
package: '@azure/ai-projects'
summary: >-
  Evaluator Generation Job resource — a long-running job that generates
  rubric-based evaluator definitions from source materials. On success, the
  result is the persisted EvaluatorVersion.
fullName: EvaluatorGenerationJob
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: created_at
    uid: '@azure/ai-projects.EvaluatorGenerationJob.created_at'
    package: '@azure/ai-projects'
    summary: >-
      The timestamp when the job was created, represented in Unix time (seconds
      since January 1, 1970).
    fullName: created_at
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'created_at?: Date'
      return:
        description: ''
        type: Date
  - name: error
    uid: '@azure/ai-projects.EvaluatorGenerationJob.error'
    package: '@azure/ai-projects'
    summary: Error details — populated only on failure.
    fullName: error
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'error?: ErrorModel'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.ErrorModel" />
  - name: evaluator_description
    uid: '@azure/ai-projects.EvaluatorGenerationJob.evaluator_description'
    package: '@azure/ai-projects'
    summary: >-
      Optional human-friendly description for the resulting evaluator. Surfaced
      as `EvaluatorVersion.description` on the persisted evaluator. Typically
      collected from the UI alongside `evaluator_display_name`. The `evaluator_`
      prefix disambiguates this from any other description fields on related
      models.
    fullName: evaluator_description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluator_description?: string'
      return:
        description: ''
        type: string
  - name: evaluator_display_name
    uid: '@azure/ai-projects.EvaluatorGenerationJob.evaluator_display_name'
    package: '@azure/ai-projects'
    summary: >-
      Optional human-friendly display name for the resulting evaluator. Surfaced
      as `EvaluatorVersion.display_name` on the persisted evaluator. When
      omitted, the service uses `evaluator_name` as the display name. The
      `evaluator_` prefix disambiguates this from the immutable `evaluator_name`
      identifier.
    fullName: evaluator_display_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluator_display_name?: string'
      return:
        description: ''
        type: string
  - name: evaluator_name
    uid: '@azure/ai-projects.EvaluatorGenerationJob.evaluator_name'
    package: '@azure/ai-projects'
    summary: >-
      The evaluator name (immutable identifier). 1-256 characters; allowed
      characters are ASCII letters, digits, underscore (`_`), period (`.`),
      tilde (`~`), and hyphen (`-`). The prefix `builtin.` is reserved for
      system-managed evaluators and is rejected by the service. If an evaluator
      with this name already exists in the project (and is rubric-subtype), the
      service creates a new version under the same name and uses the prior
      version's `dimensions` as context for incremental improvement (foundation
      of the post-//build adaptive loop). Old versions remain queryable via
      `get_version(name, version)`. If the existing evaluator is not a
      rubric-subtype evaluator (built-in, prompt-based, code-based), the request
      is rejected with `400 Bad Request`.
    fullName: evaluator_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluator_name: string'
      return:
        description: ''
        type: string
  - name: finished_at
    uid: '@azure/ai-projects.EvaluatorGenerationJob.finished_at'
    package: '@azure/ai-projects'
    summary: >-
      The timestamp when the job finished, represented in Unix time (seconds
      since January 1, 1970).
    fullName: finished_at
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'finished_at?: Date'
      return:
        description: ''
        type: Date
  - name: id
    uid: '@azure/ai-projects.EvaluatorGenerationJob.id'
    package: '@azure/ai-projects'
    summary: Server-assigned unique identifier.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id?: string'
      return:
        description: ''
        type: string
  - name: input_quality_warnings
    uid: '@azure/ai-projects.EvaluatorGenerationJob.input_quality_warnings'
    package: '@azure/ai-projects'
    summary: >-
      Non-fatal input-quality advisories produced by the generation pipeline.
      Read-only; service-generated; populated only on terminal jobs when
      advisories fired. Omitted when generation was clean. Cleared when a
      subsequent `PATCH` to the paired `EvaluatorVersion.definition` invalidates
      the advisories.
    fullName: input_quality_warnings
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'input_quality_warnings?: RubricGenerationInputQualityWarning[]'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.RubricGenerationInputQualityWarning"
          />[]
  - name: model
    uid: '@azure/ai-projects.EvaluatorGenerationJob.model'
    package: '@azure/ai-projects'
    summary: >-
      The LLM model to use for rubric generation (e.g., 'gpt-4o'). Required —
      users must provide their own model rather than relying on service-owned
      capacity.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model: string'
      return:
        description: ''
        type: string
  - name: result
    uid: '@azure/ai-projects.EvaluatorGenerationJob.result'
    package: '@azure/ai-projects'
    summary: Result produced on success.
    fullName: result
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'result?: EvaluatorVersion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluatorVersion" />
  - name: sources
    uid: '@azure/ai-projects.EvaluatorGenerationJob.sources'
    package: '@azure/ai-projects'
    summary: >-
      Source materials for generation — agent descriptions, prompts, traces, or
      datasets. Each entry is an `EvaluatorGenerationJobSource` variant
      discriminated by `type`.
    fullName: sources
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sources: EvaluatorGenerationJobSourceUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluatorGenerationJobSourceUnion" />[]
  - name: status
    uid: '@azure/ai-projects.EvaluatorGenerationJob.status'
    package: '@azure/ai-projects'
    summary: Current lifecycle status.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status?: JobStatus'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.JobStatus" />
  - name: usage
    uid: '@azure/ai-projects.EvaluatorGenerationJob.usage'
    package: '@azure/ai-projects'
    summary: >-
      Token consumption summary. Populated when the job reaches a terminal
      state.
    fullName: usage
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'usage?: EvaluatorGenerationTokenUsage'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluatorGenerationTokenUsage" />
