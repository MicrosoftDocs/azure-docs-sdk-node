      Disable compliance lock on the storage. Initiates an out-of-band
      multi-person authorization (MPA) email approval workflow on the partner
      side. The storage compliance lock status transitions to
      'DisablementPending' immediately; once the MPA approval completes, the
      status becomes 'Disabled' (observable via the refresh action).
