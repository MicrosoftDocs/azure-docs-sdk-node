### YamlMime:TSTypeAlias
name: DiskApiVersion
uid: '@azure/arm-compute.DiskApiVersion'
package: '@azure/arm-compute'
summary: >-
  Specifies the Disk API version used when applying additionalDiskProperties to
  managed disks. The value must be in the format YYYY-MM-DD. \

  [KnownDiskApiVersion](xref:@azure/arm-compute.KnownDiskApiVersion) can be used
  interchangeably with DiskApiVersion,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **2025-01-02**: The 2025-01-02 Disk RP API version. \

  **2026-03-02**: The 2026-03-02 Disk RP API version.
fullName: DiskApiVersion
remarks: ''
isDeprecated: false
syntax: |
  type DiskApiVersion = string
