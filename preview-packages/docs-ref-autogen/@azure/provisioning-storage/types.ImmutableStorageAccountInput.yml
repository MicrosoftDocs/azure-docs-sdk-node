### YamlMime:TSType
name: ImmutableStorageAccountInput
uid: '@azure/provisioning-storage.types.ImmutableStorageAccountInput'
package: '@azure/provisioning-storage'
summary: >-
  Input type for This property enables and defines account-level immutability.
  Enabling the feature auto-enables Blob Versioning.
fullName: ImmutableStorageAccountInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: enabled
    uid: '@azure/provisioning-storage.types.ImmutableStorageAccountInput.enabled'
    package: '@azure/provisioning-storage'
    summary: >-
      A boolean flag which enables account-level immutability. All the
      containers under such an account have object-level immutability enabled by
      default.
    fullName: enabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabled?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: immutabilityPolicy
    uid: >-
      @azure/provisioning-storage.types.ImmutableStorageAccountInput.immutabilityPolicy
    package: '@azure/provisioning-storage'
    summary: >-
      Specifies the default account-level immutability policy which is inherited
      and applied to objects that do not possess an explicit immutability policy
      at the object level. The object-level immutability policy has higher
      precedence than the container-level immutability policy, which has a
      higher precedence than the account-level immutability policy.
    fullName: immutabilityPolicy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'immutabilityPolicy?: AccountImmutabilityPolicyPropertiesInput'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/provisioning-storage.types.AccountImmutabilityPolicyPropertiesInput"
          />
extends: >-
  unknown&lt;<xref
  uid="@azure/provisioning-storage.types.ImmutableStorageAccount" />&gt;
