### YamlMime:TSTypeAlias
name: DbAgentState
uid: '@azure/arm-postgresql-flexible.DbAgentState'
package: '@azure/arm-postgresql-flexible'
summary: >-
  The state of the database agent. \

  [KnownDbAgentState](xref:@azure/arm-postgresql-flexible.KnownDbAgentState) can
  be used interchangeably with DbAgentState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabling**: The database agent is being enabled. \

  **Enabled**: The database agent is enabled. \

  **Disabling**: The database agent is being disabled. \

  **Disabled**: The database agent is disabled. \

  **Failed**: The database agent lifecycle operation failed.
fullName: DbAgentState
remarks: ''
isDeprecated: false
syntax: |
  type DbAgentState = string
