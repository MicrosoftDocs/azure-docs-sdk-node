name: ProvisioningState
uid: '@azure/arm-computeworkloadmanager.ProvisioningState'
package: '@azure/arm-computeworkloadmanager'
summary: >-
  The provisioning state of a Workload Manager resource. \

  [KnownProvisioningState](xref:@azure/arm-computeworkloadmanager.KnownProvisioningState)
  can be used interchangeably with ProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: Resource has been created. \

  **Failed**: Resource creation failed. \

  **Canceled**: Resource creation was canceled. \

  **Accepted**: The request has been accepted for processing. \

  **Provisioning**: The resource is being provisioned. \

  **Updating**: The resource is being updated. \

  **Deleting**: The resource is being deleted.
