### YamlMime:TSType
name: PromptCacheBreakpointConfig
uid: '@azure/ai-projects.PromptCacheBreakpointConfig'
package: '@azure/ai-projects'
summary: >-
  Marks the exact end of a reusable prompt prefix. When `ttl` is omitted, the
  breakpoint inherits the request's `prompt_cache_options.ttl`; the boundary is
  not rounded to a token block.
fullName: PromptCacheBreakpointConfig
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: mode
    uid: '@azure/ai-projects.PromptCacheBreakpointConfig.mode'
    package: '@azure/ai-projects'
    summary: The breakpoint mode. Always `explicit`.
    fullName: mode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'mode: "explicit"'
      return:
        description: ''
        type: '"explicit"'
  - name: ttl
    uid: '@azure/ai-projects.PromptCacheBreakpointConfig.ttl'
    package: '@azure/ai-projects'
    summary: >-
      The minimum lifetime of this cache breakpoint. Defaults to the request
      TTL.
    fullName: ttl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ttl?: "30m" | "12h"'
      return:
        description: ''
        type: '"30m" | "12h"'
