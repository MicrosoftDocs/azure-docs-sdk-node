### YamlMime:TSType
name: VirtualMachineReimageParameters
uid: '@azure/arm-compute-bulkactions.VirtualMachineReimageParameters'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The parameters for reimaging a virtual machine. The operating system disk is
  always reimaged.
fullName: VirtualMachineReimageParameters
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: exactVersion
    uid: >-
      @azure/arm-compute-bulkactions.VirtualMachineReimageParameters.exactVersion
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      The exact image version to use when reimaging the operating system disk.
      When omitted, the disk is reimaged to its current image version.
    fullName: exactVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'exactVersion?: string'
      return:
        description: ''
        type: string
  - name: osProfile
    uid: '@azure/arm-compute-bulkactions.VirtualMachineReimageParameters.osProfile'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      The operating system profile used when reimaging a non-ephemeral operating
      system disk.
    fullName: osProfile
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'osProfile?: OSProfileProvisioningData'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-compute-bulkactions.OSProfileProvisioningData"
          />
  - name: tempDisk
    uid: '@azure/arm-compute-bulkactions.VirtualMachineReimageParameters.tempDisk'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Indicates whether to reimage the temporary disk. The default value is
      `false`. This option is supported only for virtual machines or virtual
      machine scale sets that use an ephemeral operating system disk.
    fullName: tempDisk
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tempDisk?: boolean'
      return:
        description: ''
        type: boolean
