### YamlMime:TSType
name: UserConversationSimulationEvalRunDataSource
uid: '@azure/ai-projects.UserConversationSimulationEvalRunDataSource'
package: '@azure/ai-projects'
summary: >-
  Evaluates a model or agent by simulating user conversations against it.


  Each source item defines a test scenario. Use a JSONL source or an
  `inline_user_conversation_simulation` source with strongly typed test cases.
  JSONL attributes use the inline test-case property names by default; specify
  `data_mapping` only when the dataset uses different names. The model specified
  by `model_configuration` generates the simulated user's turns and drives the
  conversation with `target` until it reaches the desired length or maximum turn
  limit. The evaluation's testing criteria are then applied to the conversation.
fullName: UserConversationSimulationEvalRunDataSource
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: data_mapping
    uid: >-
      @azure/ai-projects.UserConversationSimulationEvalRunDataSource.data_mapping
    package: '@azure/ai-projects'
    summary: >-
      Maps JSONL dataset attributes to user conversation simulation inputs when
      their names differ from the defaults. The default attribute names are
      `test_case_id`, `test_case_category`, `test_case_description`, and
      `simulation_configuration`, matching `UserConversationSimulationTestCase`.
      Omit when the dataset uses these names or when using
      `inline_user_conversation_simulation`.
    fullName: data_mapping
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'data_mapping?: Record<string, string>'
      return:
        description: ''
        type: Record&lt;string, string&gt;
  - name: default_simulation_configuration
    uid: >-
      @azure/ai-projects.UserConversationSimulationEvalRunDataSource.default_simulation_configuration
    package: '@azure/ai-projects'
    summary: >-
      Default configuration for generating simulated user conversations and
      persisting their output. Conversation properties in a test case's
      `simulation_configuration` override the corresponding defaults.
    fullName: default_simulation_configuration
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        default_simulation_configuration?:
        UserConversationSimulationDefaultConfiguration
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/ai-projects.UserConversationSimulationDefaultConfiguration"
          />
  - name: model_configuration
    uid: >-
      @azure/ai-projects.UserConversationSimulationEvalRunDataSource.model_configuration
    package: '@azure/ai-projects'
    summary: >-
      Model used to simulate the user side of each conversation by generating
      turns sent to the evaluated `target`.
    fullName: model_configuration
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model_configuration: EvaluationModelConfiguration'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluationModelConfiguration" />
  - name: source
    uid: '@azure/ai-projects.UserConversationSimulationEvalRunDataSource.source'
    package: '@azure/ai-projects'
    summary: Test scenarios supplied as JSONL rows or strongly typed inline test cases.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source: UserConversationSimulationSource'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.UserConversationSimulationSource" />
  - name: target
    uid: '@azure/ai-projects.UserConversationSimulationEvalRunDataSource.target'
    package: '@azure/ai-projects'
    summary: Model or agent being evaluated. It receives turns from the simulated user.
    fullName: target
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'target: EvaluationTargetUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluationTargetUnion" />
  - name: type
    uid: '@azure/ai-projects.UserConversationSimulationEvalRunDataSource.type'
    package: '@azure/ai-projects'
    summary: The type of data source, always `azure_ai_user_conversation_simulation`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "azure_ai_user_conversation_simulation"'
      return:
        description: ''
        type: '"azure_ai_user_conversation_simulation"'
extends: <xref uid="@azure/ai-projects.EvalRunDataSource" />
