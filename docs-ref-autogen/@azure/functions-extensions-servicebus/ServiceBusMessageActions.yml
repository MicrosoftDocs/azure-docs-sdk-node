### YamlMime:TSType
name: ServiceBusMessageActions
uid: '@azure/functions-extensions-servicebus.ServiceBusMessageActions'
package: '@azure/functions-extensions-servicebus'
summary: >-
  Provides actions for settling and managing messages in Azure Service Bus via
  gRPC.


  This class wraps gRPC client calls to perform message settlement operations
  such as complete, abandon, deadletter, defer,

  as well as session management operations like renewing locks, setting session
  state, and releasing sessions.
fullName: ServiceBusMessageActions
remarks: >-
  - Requires a gRPC server implementing the Settlement service as defined in the
  proto file.

  - All methods throw if the required parameters are missing or if the gRPC call
  fails.
isDeprecated: false
type: class
