### YamlMime:TSType
name: AgentOptimizationCandidate
uid: '@azure/ai-projects.AgentOptimizationCandidate'
package: '@azure/ai-projects'
summary: A candidate generated by an optimization job.
fullName: AgentOptimizationCandidate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: agent_version
    uid: '@azure/ai-projects.AgentOptimizationCandidate.agent_version'
    package: '@azure/ai-projects'
    summary: >-
      Foundry agent version associated with this candidate. Omitted when no
      temporary or evaluated agent version was created.
    fullName: agent_version
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agent_version?: string'
      return:
        description: ''
        type: string
  - name: candidate_id
    uid: '@azure/ai-projects.AgentOptimizationCandidate.candidate_id'
    package: '@azure/ai-projects'
    summary: Server-assigned candidate identifier.
    fullName: candidate_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'candidate_id: string'
      return:
        description: ''
        type: string
  - name: error
    uid: '@azure/ai-projects.AgentOptimizationCandidate.error'
    package: '@azure/ai-projects'
    summary: Primary failure or skip reason. Omitted for other candidate statuses.
    fullName: error
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'error?: ErrorModel'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.ErrorModel" />
  - name: evaluation
    uid: '@azure/ai-projects.AgentOptimizationCandidate.evaluation'
    package: '@azure/ai-projects'
    summary: >-
      Evaluation summary, including reporting-only measurements for skill
      baseline and generated candidates. Omitted when no measurements are
      available. Missing scores do not imply success or zero.
    fullName: evaluation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluation?: AgentOptimizationCandidateEvaluation'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationCandidateEvaluation" />
  - name: execution_summary
    uid: '@azure/ai-projects.AgentOptimizationCandidate.execution_summary'
    package: '@azure/ai-projects'
    summary: >-
      Persisted skill execution snapshot, including partial outcomes. Populated
      on candidate GET when available and omitted from LIST.
    fullName: execution_summary
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'execution_summary?: AgentOptimizationSkillExecutionSummary'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.AgentOptimizationSkillExecutionSummary"
          />
  - name: files
    uid: '@azure/ai-projects.AgentOptimizationCandidate.files'
    package: '@azure/ai-projects'
    summary: >-
      Metadata for files generated for this candidate, such as trace analysis.
      Populated on candidate GET when available and omitted from LIST. An empty
      list means no files were generated; omission means the inventory is not
      available. Metadata does not provide file content or a download URL.
    fullName: files
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'files?: AgentOptimizationCandidateFile[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationCandidateFile" />[]
  - name: job_id
    uid: '@azure/ai-projects.AgentOptimizationCandidate.job_id'
    package: '@azure/ai-projects'
    summary: Identifier of the parent optimization job.
    fullName: job_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'job_id: string'
      return:
        description: ''
        type: string
  - name: name
    uid: '@azure/ai-projects.AgentOptimizationCandidate.name'
    package: '@azure/ai-projects'
    summary: Display name of the candidate (e.g., 'baseline', 'instruction-v2').
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: output
    uid: '@azure/ai-projects.AgentOptimizationCandidate.output'
    package: '@azure/ai-projects'
    summary: >-
      Typed output generated for this candidate. The output type matches the
      parent job's optimization type. Omitted until output is available.
    fullName: output
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'output?: AgentOptimizationCandidateOutputUnion'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.AgentOptimizationCandidateOutputUnion"
          />
  - name: promotion
    uid: '@azure/ai-projects.AgentOptimizationCandidate.promotion'
    package: '@azure/ai-projects'
    summary: Promotion metadata. Omitted if this candidate has not been promoted.
    fullName: promotion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'promotion?: AgentOptimizationCandidatePromotionInfo'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.AgentOptimizationCandidatePromotionInfo"
          />
  - name: rationale
    uid: '@azure/ai-projects.AgentOptimizationCandidate.rationale'
    package: '@azure/ai-projects'
    summary: >-
      Human-readable explanation of why the optimizer produced this candidate.
      Populated on candidate GET when available and omitted from LIST.
    fullName: rationale
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'rationale?: string'
      return:
        description: ''
        type: string
  - name: resolved_context
    uid: '@azure/ai-projects.AgentOptimizationCandidate.resolved_context'
    package: '@azure/ai-projects'
    summary: >-
      Frozen trace cohort and discovered agent skills for skill optimization.
      Populated on candidate GET when available and omitted from LIST.
    fullName: resolved_context
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resolved_context?: AgentOptimizationSkillResolvedContext'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.AgentOptimizationSkillResolvedContext"
          />
  - name: started_at
    uid: '@azure/ai-projects.AgentOptimizationCandidate.started_at'
    package: '@azure/ai-projects'
    summary: >-
      Timestamp when work on this candidate slot began, represented in Unix
      time.
    fullName: started_at
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'started_at: Date'
      return:
        description: ''
        type: Date
  - name: status
    uid: '@azure/ai-projects.AgentOptimizationCandidate.status'
    package: '@azure/ai-projects'
    summary: The candidate's current lifecycle state.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status: AgentOptimizationCandidateStatus'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationCandidateStatus" />
