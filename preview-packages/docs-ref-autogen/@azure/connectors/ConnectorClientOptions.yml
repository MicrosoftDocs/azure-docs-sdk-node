name: ConnectorClientOptions
uid: '@azure/connectors.ConnectorClientOptions'
package: '@azure/connectors'
summary: Configuration options for connector clients.
fullName: ConnectorClientOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: applicationId
    uid: '@azure/connectors.ConnectorClientOptions.applicationId'
    package: '@azure/connectors'
    summary: >-
      Optional application identifier prepended to the SDK user agent. Maximum
      24 characters, with no whitespace.

      Use userAgentOptions.userAgentPrefix for wrapping SDK identifiers; that
      prefix is not an application ID.
    fullName: applicationId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'applicationId?: string'
      return:
        description: ''
        type: string
  - name: baseUri
    uid: '@azure/connectors.ConnectorClientOptions.baseUri'
    package: '@azure/connectors'
    summary: The base URI for the connector endpoint.
    fullName: baseUri
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'baseUri?: string'
      return:
        description: ''
        type: string
  - name: httpClient
    uid: '@azure/connectors.ConnectorClientOptions.httpClient'
    package: '@azure/connectors'
    summary: The HTTP transport used by the request pipeline.
    fullName: httpClient
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'httpClient?: HttpClient'
      return:
        description: ''
        type: <xref uid="@azure/core-rest-pipeline.HttpClient" />
  - name: retryUnsafeHttpMethods
    uid: '@azure/connectors.ConnectorClientOptions.retryUnsafeHttpMethods'
    package: '@azure/connectors'
    summary: >-
      Whether retries are allowed for unsafe HTTP methods such as POST, PUT,
      PATCH, and DELETE.

      Defaults to false because retrying a completed connector action can
      duplicate side effects.
    fullName: retryUnsafeHttpMethods
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'retryUnsafeHttpMethods?: boolean'
      return:
        description: ''
        type: boolean
  - name: telemetryEnabled
    uid: '@azure/connectors.ConnectorClientOptions.telemetryEnabled'
    package: '@azure/connectors'
    summary: >-
      Whether SDK and platform identification is added to requests. Explicit
      values override AZURE_TELEMETRY_DISABLED.

      Defaults to true unless that environment variable is 'true'
      (case-insensitive) or '1' at client construction.

      Does not disable authentication, retries, correlation, tracing, logging,
      or caller-supplied request headers.
    fullName: telemetryEnabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'telemetryEnabled?: boolean'
      return:
        description: ''
        type: boolean
