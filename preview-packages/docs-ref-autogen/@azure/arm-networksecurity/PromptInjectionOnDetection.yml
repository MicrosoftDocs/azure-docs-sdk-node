name: PromptInjectionOnDetection
uid: '@azure/arm-networksecurity.PromptInjectionOnDetection'
package: '@azure/arm-networksecurity'
summary: >-
  The action to take when prompt injection is detected. \

  [KnownPromptInjectionOnDetection](xref:@azure/arm-networksecurity.KnownPromptInjectionOnDetection)
  can be used interchangeably with PromptInjectionOnDetection,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **BlockAndAlert**: Block the request or response and raise an alert. \

  **Alert**: Raise an alert but allow the request or response to proceed. \

  **Sanitize**: Remove the detected content and allow the request or response to
  proceed.
fullName: PromptInjectionOnDetection
remarks: ''
isDeprecated: false
syntax: |
  type PromptInjectionOnDetection = string
