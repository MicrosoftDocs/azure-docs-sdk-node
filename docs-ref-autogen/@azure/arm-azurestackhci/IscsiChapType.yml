name: IscsiChapType
uid: '@azure/arm-azurestackhci.IscsiChapType'
package: '@azure/arm-azurestackhci'
summary: >-
  The CHAP authentication mode for an iSCSI connection. \

  [KnownIscsiChapType](xref:@azure/arm-azurestackhci.KnownIscsiChapType) can be
  used interchangeably with IscsiChapType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NoChap**: No CHAP authentication is used. \

  **OneWay**: The target authenticates the initiator. \

  **Bidirectional**: The initiator and target authenticate each other.
fullName: IscsiChapType
remarks: ''
isDeprecated: false
syntax: |
  type IscsiChapType = string
