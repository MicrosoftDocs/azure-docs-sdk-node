### YamlMime:TSTypeAlias
name: ConnectionStatus
uid: '@azure/arm-chaos.ConnectionStatus'
package: '@azure/arm-chaos'
summary: >-
  The status of a connection. \

  [KnownConnectionStatus](xref:@azure/arm-chaos.KnownConnectionStatus) can be
  used interchangeably with ConnectionStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Pending**: The connection has been created but is not yet sending
  heartbeats; the trust relationship is not yet established. \

  **Connected**: The connection is established and actively heartbeating. \

  **Disconnected**: The connection's heartbeat has gone stale; heartbeats are no
  longer being received. \

  **Revoked**: The connection's credentials have been revoked.
fullName: ConnectionStatus
remarks: ''
isDeprecated: false
syntax: |
  type ConnectionStatus = string
