### YamlMime:TSType
name: ResourceGroup
uid: '@azure/provisioning-core.ResourceGroup'
package: '@azure/provisioning-core'
summary: >+
  Defines an Azure resource group.


  **Example**


  ```typescript snippet:ignore

  import { ResourceGroup, Stack } from "@azure/provisioning-core";


  const stack = new Stack("main", { targetScope: "subscription" });

  stack.addResource(ResourceGroup, {
    name: "my-rg",
    location: "eastus",
  });

  ```




  **Example**


  Select a declared group or a group that already exists as a module's scope.

  Add workload resources to the resource-owning modules.

  ```typescript snippet:ignore

  import { fn, ResourceGroup, Stack } from "@azure/provisioning-core";


  const stack = new Stack("main", { targetScope: "subscription" });

  const rg = stack.addResource(ResourceGroup, {
    name: "new-rg",
    location: "eastus",
  });

  stack.addModule({ name: "new-group-resources", targetScope: "resourceGroup",
  scope: rg });

  stack.addModule({
    name: "existing-group-resources",
    targetScope: "resourceGroup",
    scope: fn.resourceGroup("existing-rg"),
  });

  ```

fullName: ResourceGroup
remarks: |-
  Define the group's resources in a resource-group-scoped `Stack` or `Module`,
  not as children of the group. Create new groups within a subscription-scoped
  stack or module. Use `existing: true` with a lookup scope to refer to a group
  that already exists.
isDeprecated: false
