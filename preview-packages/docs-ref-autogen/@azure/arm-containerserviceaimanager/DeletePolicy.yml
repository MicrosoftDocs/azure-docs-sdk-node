name: DeletePolicy
uid: '@azure/arm-containerserviceaimanager.DeletePolicy'
package: '@azure/arm-containerserviceaimanager'
summary: >-
  Delete options of the AI Manager. \

  [KnownDeletePolicy](xref:@azure/arm-containerserviceaimanager.KnownDeletePolicy)
  can be used interchangeably with DeletePolicy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Keep**: Keep the underlying cluster resources even if the AIManager resource
  is deleted. \

  **Delete**: Delete both the underlying cluster resources and the AIManager
  resource together.
