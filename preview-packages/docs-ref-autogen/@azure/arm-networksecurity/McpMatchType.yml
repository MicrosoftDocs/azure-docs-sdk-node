### YamlMime:TSTypeAlias
name: McpMatchType
uid: '@azure/arm-networksecurity.McpMatchType'
package: '@azure/arm-networksecurity'
summary: >-
  How an MCP string condition compares a request or response string with its
  values. \

  [KnownMcpMatchType](xref:@azure/arm-networksecurity.KnownMcpMatchType) can be
  used interchangeably with McpMatchType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ExactMatch**: The string equals one of the values. \

  **Contains**: The string contains one of the values. \

  **NotExactMatch**: The string equals none of the values. \

  **NotContains**: The string contains none of the values.
fullName: McpMatchType
remarks: ''
isDeprecated: false
syntax: |
  type McpMatchType = string
