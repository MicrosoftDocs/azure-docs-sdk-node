### YamlMime:TSType
name: TrustedHostSubscription
uid: '@azure/arm-computelimit.TrustedHostSubscription'
package: '@azure/arm-computelimit'
summary: >-
  A host subscription that a guest subscription trusts for sharing compute
  limits.

  A guest subscription can trust multiple host subscriptions; establishing trust
  does

  not by itself associate the guest with a host. Guest-to-host association
  happens at

  check-in time, where a subscription can be a guest of at most one host per
  region.
fullName: TrustedHostSubscription
remarks: ''
isDeprecated: false
