name: IpVersion
uid: '@azure/arm-iothub.IpVersion'
package: '@azure/arm-iothub'
summary: >-
  This property specifies the IP Version the hub is currently utilizing. \

  [KnownIpVersion](xref:@azure/arm-iothub.KnownIpVersion) can be used
  interchangeably with IpVersion,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ipv4**: ipv4 \

  **ipv6**: ipv6 \

  **ipv4ipv6**: ipv4ipv6
