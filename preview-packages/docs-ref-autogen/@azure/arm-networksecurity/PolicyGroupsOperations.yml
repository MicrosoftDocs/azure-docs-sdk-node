properties:
  - name: createOrUpdate
    uid: '@azure/arm-networksecurity.PolicyGroupsOperations.createOrUpdate'
    package: '@azure/arm-networksecurity'
    summary: >-
      Creates or replaces a PolicyGroup.


      If the PUT introduces a ContentInspection policy in
      networkSecurityPolicies and any

      associated fabric has no configured inspection connection, reject the

      request with HTTP 409 and error code ContentInspectionCapabilityDisabled,
      targeting

      properties.networkSecurityPolicies. Validate before persisting or
      distributing policy changes,

      preserving the previously accepted policies on rejection. Do not partially
      apply changes to

      compatible fabrics or silently skip inspection for fabrics without an
      inspection connection.


      Compatibility uses the associated fabrics' stored configuration,
      independent of whether

      policy selectors currently match traffic. This is a configuration check,
      not a fresh Content

      Safety connectivity probe. Changes that do not introduce ContentInspection
      policies do not

      require this check; transient connection failures do not remove a fabric's
      configuration.

      Existing legacy fabrics without a profile retain their regional Content
      Safety connection,

      which satisfies the inspection prerequisite without new probes, management
      calls, or key

      retrieval. A connection still being validated is not an absent connection.

      Unattached groups and groups associated only with compatible fabrics may

      contain ContentInspection policies. Removing those policies or detaching a
      group

      remains allowed, subject to other validation. Tags-only PATCH does not
      change policy contents.

      Error messages must not disclose associated fabric IDs the caller is not
      authorized to read.


      Example rejection response (HTTP 409 Conflict):


      ```json

      {
        "error": {
          "code": "ContentInspectionCapabilityDisabled",
          "message": "The proposed ContentInspection policy is incompatible with an associated fabric that has no configured inspection connection.",
          "target": "properties.networkSecurityPolicies"
        }
      }

      ```
