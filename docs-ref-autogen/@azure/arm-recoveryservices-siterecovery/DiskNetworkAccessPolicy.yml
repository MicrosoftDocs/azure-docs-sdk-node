name: DiskNetworkAccessPolicy
uid: '@azure/arm-recoveryservices-siterecovery.DiskNetworkAccessPolicy'
package: '@azure/arm-recoveryservices-siterecovery'
summary: >-
  The network access policy for managed disks. \

  [KnownDiskNetworkAccessPolicy](xref:@azure/arm-recoveryservices-siterecovery.KnownDiskNetworkAccessPolicy)
  can be used interchangeably with DiskNetworkAccessPolicy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AllowAll**: Allow all network access. \

  **AllowPrivate**: Allow private access through disk access resource. \

  **DenyAll**: Deny all network access.
