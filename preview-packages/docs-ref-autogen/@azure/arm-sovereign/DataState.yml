### YamlMime:TSTypeAlias
name: DataState
uid: '@azure/arm-sovereign.DataState'
package: '@azure/arm-sovereign'
summary: >-
  The state of the report data. \

  [KnownDataState](xref:@azure/arm-sovereign.KnownDataState) can be used
  interchangeably with DataState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Processing**: The data is still being processed and is not yet available. \

  **Processed**: The data is processed and available. \

  **Error**: An error occurred while processing the data.
fullName: DataState
remarks: ''
isDeprecated: false
syntax: |
  type DataState = string
