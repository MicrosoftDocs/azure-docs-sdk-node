properties:
  - name: state
    uid: '@azure/arm-redhatopenshifthcp.ClusterImageRegistryProfile.state'
    package: '@azure/arm-redhatopenshifthcp'
    summary: >-
      state indicates the desired ImageStream-backed cluster image registry
      installation mode.

      This can only be set during cluster creation and cannot be changed after
      cluster creation.

      Enabled means the ImageStream-backed image registry will be run as pods on
      worker nodes in

      the cluster. Disabled means the ImageStream-backed image registry will not
      be present in

      the cluster. The default is Enabled.
    fullName: state
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'state?: string'
