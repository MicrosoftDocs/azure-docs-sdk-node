### YamlMime:TSEnum
name: KnownFailureBehavior
uid: '@azure/arm-chaos.KnownFailureBehavior'
package: '@azure/arm-chaos'
summary: Enum of how a scenario run reacts when an action fails.
fullName: KnownFailureBehavior
remarks: ''
isDeprecated: false
fields:
  - name: Continue
    uid: '@azure/arm-chaos.KnownFailureBehavior.Continue'
    package: '@azure/arm-chaos'
    summary: >-
      The action failure is suppressed: it does not by itself end the scenario
      run, and the run

      continues with its remaining actions. Suppression affects the run's result
      only. It does not

      change dependency scheduling, which stays under the control of each
      action's `runAfter` —

      an action that should still start after a failed dependency says so there.


      A run that completes normally and whose action failures were all
      suppressed terminates as

      `PartiallySucceeded`. Any failure that is not suppressed still drives the
      run to `Failed`,

      and cancellation keeps its existing result.
  - name: Stop
    uid: '@azure/arm-chaos.KnownFailureBehavior.Stop'
    package: '@azure/arm-chaos'
    summary: >-
      The action failure stops the scenario run and drives it to the `Failed`
      terminal state.

      This is the effective behavior when no `failureBehavior` is supplied.
