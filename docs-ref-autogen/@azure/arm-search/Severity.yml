### YamlMime:TSTypeAlias
name: Severity
uid: '@azure/arm-search.Severity'
package: '@azure/arm-search'
summary: >-
  Severity of the issue. \

  [KnownSeverity](xref:@azure/arm-search.KnownSeverity) can be used
  interchangeably with Severity,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Warning**: The issue is a warning and does not prevent the configuration
  from being applied. \

  **Error**: The issue is an error and prevents the configuration from being
  applied.
fullName: Severity
remarks: ''
isDeprecated: false
syntax: |
  type Severity = string
