### YamlMime:TSTypeAlias
name: ExternalConnectionSetupState
uid: '@azure/arm-netapp.ExternalConnectionSetupState'
package: '@azure/arm-netapp'
summary: >-
  Provides a machine-readable value for the status of the external connection
  setup. \

  [KnownExternalConnectionSetupState](xref:@azure/arm-netapp.KnownExternalConnectionSetupState)
  can be used interchangeably with ExternalConnectionSetupState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ClusterPeerPending**: The peering needs to be accepted on your cluster
  before the setup can proceed. see the command in 'SetupInformation.command'
  property \

  **VServerPeerRequired**: Need to accept the returned 'vserver peer accept'
  command on your cluster to finish SVM peering. See the command in
  'SetupInformation.command' property \

  **NoActionRequired**: External cache connection setup is complete.
fullName: ExternalConnectionSetupState
remarks: ''
isDeprecated: false
syntax: |
  type ExternalConnectionSetupState = string
