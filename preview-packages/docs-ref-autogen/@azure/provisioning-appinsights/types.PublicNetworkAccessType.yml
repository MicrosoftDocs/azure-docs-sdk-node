name: PublicNetworkAccessType
uid: '@azure/provisioning-appinsights.types.PublicNetworkAccessType'
package: '@azure/provisioning-appinsights'
summary: >-
  The network access type for operating on the Application Insights Component.
  By default it is Enabled


  Known values:


  - `"Enabled"`: Enables connectivity to Application Insights through public
  DNS.


  - `"Disabled"`: Disables public connectivity to Application Insights through
  public DNS.
