### YamlMime:TSTypeAlias
name: DdosContinent
uid: '@azure/arm-network.DdosContinent'
package: '@azure/arm-network'
summary: >-
  A continent used for DDoS geographic source matching. \

  [KnownDdosContinent](xref:@azure/arm-network.KnownDdosContinent) can be used
  interchangeably with DdosContinent,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Africa**: Matches traffic originating from countries and territories in
  Africa. \

  **Antarctica**: Matches traffic originating from Antarctica. \

  **Asia**: Matches traffic originating from countries and territories in Asia.
  \

  **Europe**: Matches traffic originating from countries and territories in
  Europe. \

  **NorthAmerica**: Matches traffic originating from countries and territories
  in North America. \

  **Oceania**: Matches traffic originating from countries and territories in
  Oceania. \

  **SouthAmerica**: Matches traffic originating from countries and territories
  in South America.
fullName: DdosContinent
remarks: ''
isDeprecated: false
syntax: |
  type DdosContinent = string
