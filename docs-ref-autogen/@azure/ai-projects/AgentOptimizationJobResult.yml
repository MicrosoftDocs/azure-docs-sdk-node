    summary: >-
      Summary of candidates produced by the job. Omitted until candidate
      processing begins.
    fullName: candidate_summary
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'candidate_summary?: AgentOptimizationResultCandidateSummary'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.AgentOptimizationResultCandidateSummary"
          />
  - name: latency_metrics
    uid: '@azure/ai-projects.AgentOptimizationJobResult.latency_metrics'
    package: '@azure/ai-projects'
    summary: >-
      Aggregate latency per stage and model. Always present; empty when no
      server-measured latency is available.
    fullName: latency_metrics
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'latency_metrics: AgentOptimizationJobLatency[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.AgentOptimizationJobLatency" />[]
  - name: termination_reason
    uid: '@azure/ai-projects.AgentOptimizationJobResult.termination_reason'
