### YamlMime:TSTypeAlias
name: ResourceOperationType
uid: '@azure/arm-compute-bulkactions.ResourceOperationType'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The kind of bulk operation that can be performed on resources using
  Bulkactions API \

  [KnownResourceOperationType](xref:@azure/arm-compute-bulkactions.KnownResourceOperationType)
  can be used interchangeably with ResourceOperationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: The default value for this enum type \

  **Start**: Start operations on the resources \

  **Deallocate**: Deallocate operations on the resources \

  **Hibernate**: Hibernate operations on the resources \

  **Create**: Create operations on the resources \

  **Delete**: Delete operations on the resources \

  **GetInstanceView**: Post-Start VM agent health-check sub-operation; surfaced
  when the customer opts into verifyVmAgentHealth on a Start request
fullName: ResourceOperationType
remarks: ''
isDeprecated: false
syntax: |
  type ResourceOperationType = string
