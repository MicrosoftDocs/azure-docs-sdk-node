### YamlMime:TSTypeAlias
name: DetectorStatusId
uid: '@azure/arm-durabletask.DetectorStatusId'
package: '@azure/arm-durabletask'
summary: >-
  The status of a detector result. \

  [KnownDetectorStatusId](xref:@azure/arm-durabletask.KnownDetectorStatusId) can
  be used interchangeably with DetectorStatusId,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **0**: A critical issue was detected. \

  **1**: A warning was detected. \

  **2**: An informational result was returned. \

  **3**: The detector completed without detecting an issue. \

  **4**: The detector did not run or returned no insights.
fullName: DetectorStatusId
remarks: ''
isDeprecated: false
syntax: |
  type DetectorStatusId = number
