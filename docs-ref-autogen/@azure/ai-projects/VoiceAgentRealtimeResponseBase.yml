### YamlMime:TSType
name: VoiceAgentRealtimeResponseBase
uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase'
package: '@azure/ai-projects'
summary: Properties shared by realtime responses returned by the voice-agent service.
fullName: VoiceAgentRealtimeResponseBase
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: conversation_id
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.conversation_id'
    package: '@azure/ai-projects'
    summary: >-
      Which conversation the response is added to, determined by the
      `conversation`
        field in the `response.create` event. If `auto`, the response will be added to
        the default conversation and the value of `conversation_id` will be an id like
        `conv_1234`. If `none`, the response will not be added to any conversation and
        the value of `conversation_id` will be `null`. If responses are being triggered
        automatically by VAD the response will be added to the default conversation
    fullName: conversation_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'conversation_id?: string'
      return:
        description: ''
        type: string
  - name: id
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.id'
    package: '@azure/ai-projects'
    summary: The unique ID of the response, will look like `resp_1234`.
    fullName: id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'id?: string'
      return:
        description: ''
        type: string
  - name: max_output_tokens
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.max_output_tokens'
    package: '@azure/ai-projects'
    summary: |-
      Maximum number of output tokens for a single assistant response,
        inclusive of tool calls, that was used in this response.
    fullName: max_output_tokens
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_output_tokens?: number | "inf"'
      return:
        description: ''
        type: number | "inf"
  - name: metadata
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.metadata'
