### YamlMime:TSType
name: ManagedClusterSecurityProfileDefenderSecurityGating
uid: >-
  @azure/arm-containerservice.ManagedClusterSecurityProfileDefenderSecurityGating
package: '@azure/arm-containerservice'
summary: >-
  Microsoft Defender settings for security gating. This validates container
  image eligibility for deployment based on Defender for Containers security
  findings. Using Admission Controller, it either audits or prevents deployment
  of images that do not meet security standards.
fullName: ManagedClusterSecurityProfileDefenderSecurityGating
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: allowSecretAccess
    uid: >-
      @azure/arm-containerservice.ManagedClusterSecurityProfileDefenderSecurityGating.allowSecretAccess
    package: '@azure/arm-containerservice'
    summary: >-
      In use only while registry access is granted by secret rather than managed
      identity. Sets whether to grant the Defender gating agent access to
      cluster secrets for pulling images from registries. If secret access is
      denied and the registry requires pull secrets, the add-on will not perform
      image validation. Default value is false.
    fullName: allowSecretAccess
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowSecretAccess?: boolean'
      return:
        description: ''
        type: boolean
  - name: enabled
    uid: >-
      @azure/arm-containerservice.ManagedClusterSecurityProfileDefenderSecurityGating.enabled
    package: '@azure/arm-containerservice'
    summary: >-
      Whether to enable Defender security gating. When enabled, the gating
      feature scans container images and audits or blocks deployment of images
      that do not meet security standards according to configured security
      rules. For more information, see
      https://aka.ms/KubernetesDefenderAuditRule.
    fullName: enabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'enabled?: boolean'
      return:
        description: ''
        type: boolean
  - name: identities
    uid: >-
      @azure/arm-containerservice.ManagedClusterSecurityProfileDefenderSecurityGating.identities
    package: '@azure/arm-containerservice'
    summary: >-
      List of identities that the admission controller uses to pull security
      artifacts from registries. These are the same identities used by the
      cluster to pull container images. For more information on configuring this
      identity, see
      https://learn.microsoft.com/en-us/azure/defender-for-cloud/gated-deployment-infrastructure-as-code.
    fullName: identities
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        identities?:
        ManagedClusterSecurityProfileDefenderSecurityGatingIdentity[]
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-containerservice.ManagedClusterSecurityProfileDefenderSecurityGatingIdentity"
          />[]
