name: BulkCreateCustomAllocationStrategy
uid: '@azure/arm-compute-bulkactions.BulkCreateCustomAllocationStrategy'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The allocation strategy for VM size selection in BulkCreateCustom. \

  [KnownBulkCreateCustomAllocationStrategy](xref:@azure/arm-compute-bulkactions.KnownBulkCreateCustomAllocationStrategy)
  can be used interchangeably with BulkCreateCustomAllocationStrategy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **LowestPrice**: Platform prioritizes VM sizes with the lowest hourly cost \

  **Prioritized**: Customer specifies a rank for each VM size, platform uses VM
  sizes in rank order
fullName: BulkCreateCustomAllocationStrategy
remarks: ''
isDeprecated: false
syntax: |
  type BulkCreateCustomAllocationStrategy = string
