name: CostControlThresholdType
uid: '@azure/arm-cognitiveservices.CostControlThresholdType'
package: '@azure/arm-cognitiveservices'
summary: >-
  The interpretation of a notification or blocking-action threshold. \

  [KnownCostControlThresholdType](xref:@azure/arm-cognitiveservices.KnownCostControlThresholdType)
  can be used interchangeably with CostControlThresholdType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Percentage**: The threshold is a percentage of the configured budget amount.
  \

  **Absolute**: The threshold is expressed in United States dollars or tokens,
  according to the budget category.
fullName: CostControlThresholdType
