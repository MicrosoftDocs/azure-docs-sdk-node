### YamlMime:TSType
name: AcsHarmResult
uid: '@azure/ai-content-safety.AcsHarmResult'
package: '@azure/ai-content-safety'
summary: >-
  The moderation and policy-attribution result for one harm category. The
  category name is the key in the harmResults map and is not restricted to a
  predefined set.
fullName: AcsHarmResult
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: blocked
    uid: '@azure/ai-content-safety.AcsHarmResult.blocked'
    package: '@azure/ai-content-safety'
    summary: >-
      Whether this harm contributed to the overall ACS verdict blocking the
      content.
    fullName: blocked
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'blocked: boolean'
      return:
        description: ''
        type: boolean
  - name: details
    uid: '@azure/ai-content-safety.AcsHarmResult.details'
    package: '@azure/ai-content-safety'
    summary: >-
      Optional blocklist results. Each item identifies one evaluated blocklist
      and whether it was detected.
    fullName: details
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'details?: AcsHarmDetail[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-content-safety.AcsHarmDetail" />[]
  - name: detected
    uid: '@azure/ai-content-safety.AcsHarmResult.detected'
    package: '@azure/ai-content-safety'
    summary: >-
      Whether this harm was detected, regardless of whether it caused the
      overall verdict to block.
    fullName: detected
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'detected: boolean'
      return:
        description: ''
        type: boolean
  - name: license
    uid: '@azure/ai-content-safety.AcsHarmResult.license'
    package: '@azure/ai-content-safety'
    summary: >-
      An optional license description associated with detected protected
      material.
    fullName: license
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'license?: string'
      return:
        description: ''
        type: string
  - name: severity
    uid: '@azure/ai-content-safety.AcsHarmResult.severity'
    package: '@azure/ai-content-safety'
    summary: >-
      An optional harm-specific severity value. The value is defined by the
      moderation model or policy that produced the result.
    fullName: severity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'severity?: string'
      return:
        description: ''
        type: string
  - name: url
    uid: '@azure/ai-content-safety.AcsHarmResult.url'
    package: '@azure/ai-content-safety'
    summary: An optional internet location associated with detected protected material.
    fullName: url
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'url?: string'
      return:
        description: ''
        type: string
