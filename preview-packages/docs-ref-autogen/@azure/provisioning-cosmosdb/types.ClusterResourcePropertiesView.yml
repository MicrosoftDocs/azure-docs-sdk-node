    fullName: hoursBetweenBackups
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'hoursBetweenBackups?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
  - name: initialCassandraAdminPassword
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.initialCassandraAdminPassword
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      Initial password for clients connecting as admin to the cluster. Should be
      changed after cluster creation. Returns null on GET. This field only
      applies when the authenticationMethod field is 'Cassandra'.
    fullName: initialCassandraAdminPassword
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'initialCassandraAdminPassword?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: privateLinkResourceId
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.privateLinkResourceId
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      Read-only output: If the Connection Method is Vpn, this is the Id of the
      private link resource that the datacenters need to connect to.
    fullName: privateLinkResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'privateLinkResourceId?: Expression<string>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;string&gt;
