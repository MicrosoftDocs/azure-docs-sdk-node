### YamlMime:TSEnum
name: KnownContextLengthSource
uid: '@azure/arm-aiinfraoptimization.KnownContextLengthSource'
package: '@azure/arm-aiinfraoptimization'
summary: Where a context length was resolved from.
fullName: KnownContextLengthSource
remarks: ''
isDeprecated: false
fields:
  - name: Default
    uid: '@azure/arm-aiinfraoptimization.KnownContextLengthSource.Default'
    package: '@azure/arm-aiinfraoptimization'
    summary: >-
      No token budget was supplied, so the service default context length was
      used.
  - name: Request
    uid: '@azure/arm-aiinfraoptimization.KnownContextLengthSource.Request'
    package: '@azure/arm-aiinfraoptimization'
    summary: >-
      The context length is the sum of the request's
      `workload.tokenBudget.promptTokens` and `maxOutputTokens`.
