name: ClusterCapability
uid: '@azure/arm-horizondb.ClusterCapability'
package: '@azure/arm-horizondb'
summary: The HorizonDB Cluster capabilities available in a location.
fullName: ClusterCapability
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: recommendedPostgreSqlVersion
    uid: '@azure/arm-horizondb.ClusterCapability.recommendedPostgreSqlVersion'
    package: '@azure/arm-horizondb'
    summary: >-
      The PostgreSQL major version recommended for clients to select for
      HorizonDB Clusters in the region. This recommendation does not describe
      backend behavior when the PostgreSQL version is omitted from a request.
    fullName: recommendedPostgreSqlVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recommendedPostgreSqlVersion: string'
      return:
        description: ''
        type: string
  - name: supportedFeatures
    uid: '@azure/arm-horizondb.ClusterCapability.supportedFeatures'
