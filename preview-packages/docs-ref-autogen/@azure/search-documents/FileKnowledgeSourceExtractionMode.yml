### YamlMime:TSTypeAlias
name: FileKnowledgeSourceExtractionMode
uid: '@azure/search-documents.FileKnowledgeSourceExtractionMode'
package: '@azure/search-documents'
summary: >-
  The extraction effort applied to an individual file. 'minimal' (the default)
  uses built-in extraction; 'standard' uses Content Understanding. \

  [KnownFileKnowledgeSourceExtractionMode](xref:@azure/search-documents.KnownFileKnowledgeSourceExtractionMode)
  can be used interchangeably with FileKnowledgeSourceExtractionMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **minimal**: Built-in extraction was performed. \

  **standard**: Content Understanding extraction was performed.
fullName: FileKnowledgeSourceExtractionMode
remarks: ''
isDeprecated: false
syntax: |
  type FileKnowledgeSourceExtractionMode = string
