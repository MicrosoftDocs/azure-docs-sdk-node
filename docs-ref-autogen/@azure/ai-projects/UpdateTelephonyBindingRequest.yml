    package: '@azure/ai-projects'
    summary: >-
      SIP caller restrictions: omit to preserve, [] to clear; null is invalid.
      Network restrictions belong to the connection.
    fullName: allowed_calling_numbers
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowed_calling_numbers?: string[]'
      return:
        description: ''
        type: string[]
  - name: connection_name
    uid: '@azure/ai-projects.UpdateTelephonyBindingRequest.connection_name'
    package: '@azure/ai-projects'
    summary: >-
      Replacement same-project connection for Teams or SIP (SipInbound only);
      immutable for Twilio. Null/blank names are invalid.
    fullName: connection_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'connection_name?: string'
      return:
        description: ''
        type: string
  - name: label
    uid: '@azure/ai-projects.UpdateTelephonyBindingRequest.label'
    package: '@azure/ai-projects'
    summary: >-
      Replacement label: omit to preserve, null/blank to clear. Trimmed before
