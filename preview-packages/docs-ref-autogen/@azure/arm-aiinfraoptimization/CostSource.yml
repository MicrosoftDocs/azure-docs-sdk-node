name: CostSource
uid: '@azure/arm-aiinfraoptimization.CostSource'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  The source a price was resolved from. \

  [KnownCostSource](xref:@azure/arm-aiinfraoptimization.KnownCostSource) can be
  used interchangeably with CostSource,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AzureRetail**: The price came from the public Azure retail catalog. \

  **AzureSubscription**: The price came from the caller's Azure subscription. \

  **StaticPreview**: The price is fixed illustrative data for a contract
  preview.
