name: KnownEceSecrets
uid: '@azure/arm-azurestackhci.KnownEceSecrets'
package: '@azure/arm-azurestackhci'
summary: Secret names allowed for Enterprise Cloud Engine (ECE) deployment.
fullName: KnownEceSecrets
remarks: ''
isDeprecated: false
fields:
  - name: AzureStackLCMUserCredential
    uid: '@azure/arm-azurestackhci.KnownEceSecrets.AzureStackLCMUserCredential'
    package: '@azure/arm-azurestackhci'
    summary: >-
      AzureStackLCMUserCredential used for LCM operations for AzureStackHCI
      cluster.
  - name: ChapCredential
    uid: '@azure/arm-azurestackhci.KnownEceSecrets.ChapCredential'
    package: '@azure/arm-azurestackhci'
    summary: >-
      chapCredential used for iSCSI CHAP authentication during edge machine node
      preparation.
  - name: DefaultARBApplication
    uid: '@azure/arm-azurestackhci.KnownEceSecrets.DefaultARBApplication'
    package: '@azure/arm-azurestackhci'
    summary: >-
      DefaultARBApplication used to manage Azure Arc resource bridge (ARB) for
      AzureStackHCI cluster.
  - name: LocalAdminCredential
    uid: '@azure/arm-azurestackhci.KnownEceSecrets.LocalAdminCredential'
    package: '@azure/arm-azurestackhci'
    summary: LocalAdminCredential used for admin operations for AzureStackHCI cluster.
  - name: MutualChapCredential
    uid: '@azure/arm-azurestackhci.KnownEceSecrets.MutualChapCredential'
    package: '@azure/arm-azurestackhci'
    summary: >-
      mutualChapCredential used for iSCSI mutual (bidirectional) CHAP
      authentication during edge machine node preparation.
  - name: WitnessStorageKey
    uid: '@azure/arm-azurestackhci.KnownEceSecrets.WitnessStorageKey'
