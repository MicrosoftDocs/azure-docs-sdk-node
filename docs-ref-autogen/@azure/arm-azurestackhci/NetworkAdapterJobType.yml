name: NetworkAdapterJobType
uid: '@azure/arm-azurestackhci.NetworkAdapterJobType'
package: '@azure/arm-azurestackhci'
summary: >-
  Type of network adapter job operation. \

  [KnownNetworkAdapterJobType](xref:@azure/arm-azurestackhci.KnownNetworkAdapterJobType)
