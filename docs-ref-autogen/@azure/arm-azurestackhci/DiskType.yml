### YamlMime:TSTypeAlias
name: DiskType
uid: '@azure/arm-azurestackhci.DiskType'
package: '@azure/arm-azurestackhci'
summary: >-
  Type of disk. \

  [KnownDiskType](xref:@azure/arm-azurestackhci.KnownDiskType) can be used
  interchangeably with DiskType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: Unknown disk type. \

  **SCM**: Storage Class Memory disk. \

  **NVMe**: NVMe disk. \

  **SATA**: SATA disk. \

  **SSD**: Solid State Drive. \

  **HDD**: Hard Disk Drive. \

  **Virtual**: Virtual disk. \

  **Other**: Other disk type.
fullName: DiskType
remarks: ''
isDeprecated: false
syntax: |
  type DiskType = string
