### YamlMime:TSTypeAlias
name: ApplicationGatewayAdvancedRoutingConditionType
uid: '@azure/arm-network.ApplicationGatewayAdvancedRoutingConditionType'
package: '@azure/arm-network'
summary: >-
  The type of request property that an advanced routing condition is evaluated
  against. \

  [KnownApplicationGatewayAdvancedRoutingConditionType](xref:@azure/arm-network.KnownApplicationGatewayAdvancedRoutingConditionType)
  can be used interchangeably with
  ApplicationGatewayAdvancedRoutingConditionType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Header**: The condition is evaluated against an HTTP request header
  identified by propertyName. \

  **QueryString**: The condition is evaluated against a query string argument
  identified by propertyName. \

  **Path**: The condition is evaluated against the request path. propertyName is
  not applicable. \

  **ClientIP**: The condition is evaluated against the client IP address.
  propertyName and propertyValueMatcher are not applicable. \

  **Method**: The condition is evaluated against the HTTP method. propertyName
  and propertyValueMatcher are not applicable.
fullName: ApplicationGatewayAdvancedRoutingConditionType
remarks: ''
isDeprecated: false
syntax: |
  type ApplicationGatewayAdvancedRoutingConditionType = string
