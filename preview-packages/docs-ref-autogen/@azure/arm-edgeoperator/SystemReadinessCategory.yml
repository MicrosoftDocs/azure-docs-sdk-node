### YamlMime:TSType
name: SystemReadinessCategory
uid: '@azure/arm-edgeoperator.SystemReadinessCategory'
package: '@azure/arm-edgeoperator'
summary: The readiness state reported for a single provider-defined category.
fullName: SystemReadinessCategory
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: categoryName
    uid: '@azure/arm-edgeoperator.SystemReadinessCategory.categoryName'
