name: ScheduledActionType
uid: '@azure/arm-compute-bulkactions.ScheduledActionType'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The operation performed by the scheduled action. \

  [KnownScheduledActionType](xref:@azure/arm-compute-bulkactions.KnownScheduledActionType)
  can be used interchangeably with ScheduledActionType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Start**: Starts the targeted resources. \

  **Deallocate**: Deallocates the targeted resources. \

  **Hibernate**: Hibernates the targeted resources.
