### YamlMime:TSType
name: VirtualMachineScaleSetStorageProfile
uid: '@azure/arm-compute.VirtualMachineScaleSetStorageProfile'
package: '@azure/arm-compute'
summary: Describes a virtual machine scale set storage profile.
fullName: VirtualMachineScaleSetStorageProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: dataDisks
    uid: '@azure/arm-compute.VirtualMachineScaleSetStorageProfile.dataDisks'
    package: '@azure/arm-compute'
    summary: >-
      Specifies the parameters that are used to add data disks to the virtual
      machines in the scale set. For more information about disks, see [About
      disks and VHDs for Azure virtual
      machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).
    fullName: dataDisks
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'dataDisks?: VirtualMachineScaleSetDataDisk[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute.VirtualMachineScaleSetDataDisk" />[]
  - name: diskApiVersion
    uid: '@azure/arm-compute.VirtualMachineScaleSetStorageProfile.diskApiVersion'
    package: '@azure/arm-compute'
    summary: >-
      Specifies the Disk API version used when applying additionalDiskProperties
      to managed disks. The value must be in the format YYYY-MM-DD (e.g.,
      "2026-03-02").
    fullName: diskApiVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'diskApiVersion?: string'
      return:
        description: ''
        type: string
  - name: diskControllerType
    uid: '@azure/arm-compute.VirtualMachineScaleSetStorageProfile.diskControllerType'
    package: '@azure/arm-compute'
    summary: >-
      Specifies the disk controller type configured for the virtual machines in
      the scale set. Minimum api-version: 2022-08-01
    fullName: diskControllerType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'diskControllerType?: string'
      return:
        description: ''
        type: string
  - name: imageReference
    uid: '@azure/arm-compute.VirtualMachineScaleSetStorageProfile.imageReference'
    package: '@azure/arm-compute'
    summary: >-
      Specifies information about the image to use. You can specify information
      about platform images, marketplace images, or virtual machine images. This
      element is required when you want to use a platform image, marketplace
      image, or virtual machine image, but is not used in other creation
      operations.
    fullName: imageReference
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'imageReference?: ImageReference'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute.ImageReference" />
  - name: osDisk
    uid: '@azure/arm-compute.VirtualMachineScaleSetStorageProfile.osDisk'
    package: '@azure/arm-compute'
    summary: >-
      Specifies information about the operating system disk used by the virtual
      machines in the scale set. For more information about disks, see [About
      disks and VHDs for Azure virtual
      machines](https://docs.microsoft.com/azure/virtual-machines/managed-disks-overview).
    fullName: osDisk
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'osDisk?: VirtualMachineScaleSetOSDisk'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute.VirtualMachineScaleSetOSDisk" />
