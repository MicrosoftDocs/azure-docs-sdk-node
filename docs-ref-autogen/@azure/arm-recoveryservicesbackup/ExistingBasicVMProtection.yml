name: ExistingBasicVMProtection
uid: '@azure/arm-recoveryservicesbackup.ExistingBasicVMProtection'
package: '@azure/arm-recoveryservicesbackup'
summary: >-
  Specifies how existing Basic VM protection is handled when configuring
  protection. \

  [KnownExistingBasicVMProtection](xref:@azure/arm-recoveryservicesbackup.KnownExistingBasicVMProtection)
  can be used interchangeably with ExistingBasicVMProtection,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **DisableWithDeleteRPsNow**: Disables existing Basic VM protection and
  immediately deletes its recovery points.
fullName: ExistingBasicVMProtection
