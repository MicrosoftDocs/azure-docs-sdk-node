    uid: >-
      @azure/arm-containerservicefleet.IdentityBindingLabelSelector.matchExpressions
    package: '@azure/arm-containerservicefleet'
    summary: >-
      matchExpressions is a list of label selector requirements. The
      requirements are ANDed.
    fullName: matchExpressions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'matchExpressions?: IdentityBindingLabelSelectorRequirement[]'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-containerservicefleet.IdentityBindingLabelSelectorRequirement"
          />[]
  - name: matchLabels
    uid: '@azure/arm-containerservicefleet.IdentityBindingLabelSelector.matchLabels'
    package: '@azure/arm-containerservicefleet'
    summary: >-
      matchLabels is an array of {key=value} pairs. A single {key=value} in the
      matchLabels map is equivalent to an element of matchExpressions, whose key
      field is `key`, the operator is `In`, and the values array contains only
      `value`. The requirements are ANDed.
    fullName: matchLabels
    remarks: ''
