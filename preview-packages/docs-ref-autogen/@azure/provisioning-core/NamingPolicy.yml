### YamlMime:TSType
name: NamingPolicy
uid: '@azure/provisioning-core.NamingPolicy'
package: '@azure/provisioning-core'
summary: >-
  Strategy for generating Azure resource names when a resource is created

  without an explicit `name`.


  Implement this interface to provide a custom naming convention. Two

  built-in implementations are provided:


  - [DefaultNamingPolicy](xref:@azure/provisioning-core.DefaultNamingPolicy) —
  workload-based names with abbreviations,
    ordinals, and `uniqueString()` for globally-scoped resources.
  - [namingRequiredPolicy](xref:@azure/provisioning-core.namingRequiredPolicy) —
  a singleton that throws if a resource
    doesn't provide an explicit `name`.
fullName: NamingPolicy
remarks: ''
isDeprecated: false
type: interface
