### YamlMime:TSType
name: ServingPerformanceEstimation
uid: '@azure/arm-containerserviceaimanager.ServingPerformanceEstimation'
package: '@azure/arm-containerserviceaimanager'
summary: >-
  Estimated relative inference performance of a single model replica on a given
  GPU SKU. Each metric is a scaling coefficient in the range `[0, 1]` relative
  to the best-performing SKU for this model, which scores `1`.
fullName: ServingPerformanceEstimation
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: relativeLatencyScore
    uid: >-
      @azure/arm-containerserviceaimanager.ServingPerformanceEstimation.relativeLatencyScore
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      Relative inference latency score in `[0, 1]`. Higher is better (`1`
      matches the best-performing SKU's latency for this model). Note: this is a
      normalized score, not a raw latency ratio -- a larger value indicates
      lower latency.
    fullName: relativeLatencyScore
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'relativeLatencyScore: number'
      return:
        description: ''
        type: number
  - name: relativeThroughputScore
    uid: >-
      @azure/arm-containerserviceaimanager.ServingPerformanceEstimation.relativeThroughputScore
    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      Relative inference throughput score in `[0, 1]`. Higher is better (`1`
      matches the best-performing SKU's throughput for this model).
    fullName: relativeThroughputScore
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'relativeThroughputScore: number'
      return:
        description: ''
        type: number
