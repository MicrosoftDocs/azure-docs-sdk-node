      return:
        description: ''
        type: >-
          (location: string, hostSubscriptionId: string, resource:
          TrustedHostSubscription, options?:
          TrustedHostSubscriptionsCreateOptionalParams) =&gt;
          Promise&lt;TrustedHostSubscription&gt;
