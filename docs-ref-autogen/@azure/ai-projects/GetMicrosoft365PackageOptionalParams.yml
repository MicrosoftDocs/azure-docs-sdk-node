name: GetMicrosoft365PackageOptionalParams
uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams'
package: '@azure/ai-projects'
summary: Optional parameters.
fullName: GetMicrosoft365PackageOptionalParams
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: accessBoundaries
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.accessBoundaries'
    package: '@azure/ai-projects'
    summary: >-
      Activity-protocol access boundaries to apply to the agent when publishing
      as an autopilot agent.

      An empty list clears the existing boundaries. When omitted, the existing
      boundaries are left

      unchanged.
    fullName: accessBoundaries
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'accessBoundaries?: ActivityProtocolAccessBoundary[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.ActivityProtocolAccessBoundary" />[]
  - name: agentDisplayName
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.agentDisplayName'
    package: '@azure/ai-projects'
    summary: >-
      Display name used as the published Teams app name. When omitted, the agent
      name from the route is

      used.
    fullName: agentDisplayName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agentDisplayName?: string'
      return:
        description: ''
        type: string
  - name: appVersion
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.appVersion'
    package: '@azure/ai-projects'
    summary: >-
      App version (for example `1.2.3`) written into the Teams manifest. May
      contain only digits and

      periods, must not start with `0`, and must end with a digit. When omitted,
      a platform default is

      used.
    fullName: appVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'appVersion?: string'
      return:
        description: ''
        type: string
  - name: botServiceArmId
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.botServiceArmId'
    package: '@azure/ai-projects'
    summary: >-
      ARM resource id of the Azure Bot Service that fronts this agent in
      Microsoft Teams. Required for

      workspaces on the default bot-based Teams backend; optional for workspaces
      on the API-based backend.

      Must not be supplied when `publishAsAutopilot` is true.
    fullName: botServiceArmId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'botServiceArmId?: string'
      return:
        description: ''
        type: string
  - name: canRespondWithoutMention
    uid: >-
      @azure/ai-projects.GetMicrosoft365PackageOptionalParams.canRespondWithoutMention
    package: '@azure/ai-projects'
    summary: >-
      Controls how the published agent responds to Teams messages: when true it
      responds to all messages

      on its surfaces, when false only when it is at-mentioned. When omitted,
      the agent's existing Teams

      message-notification setting is left unchanged.
    fullName: canRespondWithoutMention
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'canRespondWithoutMention?: boolean'
      return:
        description: ''
        type: boolean
  - name: colorIconBase64
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.colorIconBase64'
    package: '@azure/ai-projects'
    summary: >-
      Optional base64-encoded PNG used as the color (full-bleed) icon in the
      Teams app package. Must be a

      192x192 PNG (perfect square, no border or rounded corners). Max 1 MB after
      decode. When omitted, the

      platform default color icon is used.
    fullName: colorIconBase64
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'colorIconBase64?: string'
      return:
        description: ''
        type: string
  - name: developerName
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.developerName'
    package: '@azure/ai-projects'
    summary: Display name of the developer / publisher shown in the Teams app listing.
    fullName: developerName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'developerName?: string'
      return:
        description: ''
        type: string
  - name: developerWebsiteUrl
    uid: >-
      @azure/ai-projects.GetMicrosoft365PackageOptionalParams.developerWebsiteUrl
    package: '@azure/ai-projects'
    summary: >-
      Developer / publisher website URL shown in the Teams app listing. Must be
      an https URL.
    fullName: developerWebsiteUrl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'developerWebsiteUrl?: string'
      return:
        description: ''
        type: string
  - name: fullDescription
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.fullDescription'
    package: '@azure/ai-projects'
    summary: Full description shown on the Teams app details page.
    fullName: fullDescription
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'fullDescription?: string'
      return:
        description: ''
        type: string
  - name: optionalPermissionScopes
    uid: >-
      @azure/ai-projects.GetMicrosoft365PackageOptionalParams.optionalPermissionScopes
    package: '@azure/ai-projects'
    summary: >-
      Exact selection of delegated permission scopes to grant to the autopilot
      blueprint. May only be

      supplied when `publishAsAutopilot` is true. When omitted or empty, the
      platform's default

      permission set is used. Mandatory platform permissions are always granted
      and are not affected by

      this value.
    fullName: optionalPermissionScopes
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'optionalPermissionScopes?: Microsoft365PermissionScopes[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.Microsoft365PermissionScopes" />[]
  - name: outlineIconBase64
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.outlineIconBase64'
    package: '@azure/ai-projects'
    summary: >-
      Optional base64-encoded PNG used as the outline icon in the Teams app
      package. Must be a 32x32 PNG.

      Max 1 MB after decode. When omitted, the platform default outline icon is
      used.
    fullName: outlineIconBase64
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'outlineIconBase64?: string'
      return:
        description: ''
        type: string
  - name: privacyUrl
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.privacyUrl'
    package: '@azure/ai-projects'
    summary: >-
      Privacy policy URL shown in the Teams app listing. Must be an http or
      https URL.
    fullName: privacyUrl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'privacyUrl?: string'
      return:
        description: ''
        type: string
  - name: publishAsAutopilot
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.publishAsAutopilot'
    package: '@azure/ai-projects'
    summary: >-
      When true, the agent is published as an autopilot (digital worker) agent:
      the bot id is taken from

      the agent's blueprint identity and the generated Teams manifest is marked
      as a digital worker.
    fullName: publishAsAutopilot
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publishAsAutopilot?: boolean'
      return:
        description: ''
        type: boolean
  - name: shortDescription
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.shortDescription'
    package: '@azure/ai-projects'
    summary: Short, one-line description shown in the Teams app listing.
    fullName: shortDescription
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'shortDescription?: string'
      return:
        description: ''
        type: string
  - name: termsOfUseUrl
    uid: '@azure/ai-projects.GetMicrosoft365PackageOptionalParams.termsOfUseUrl'
    package: '@azure/ai-projects'
    summary: Terms-of-use URL shown in the Teams app listing.
    fullName: termsOfUseUrl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'termsOfUseUrl?: string'
      return:
        description: ''
        type: string
