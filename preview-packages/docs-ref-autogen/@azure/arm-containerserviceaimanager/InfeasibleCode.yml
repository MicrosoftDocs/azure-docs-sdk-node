### YamlMime:TSTypeAlias
name: InfeasibleCode
uid: '@azure/arm-containerserviceaimanager.InfeasibleCode'
package: '@azure/arm-containerserviceaimanager'
summary: >-
  The reason a `CalculateCostPlan` is not deployable. \

  [KnownInfeasibleCode](xref:@azure/arm-containerserviceaimanager.KnownInfeasibleCode)
  can be used interchangeably with InfeasibleCode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **InsufficientQuota**: The caller's subscription does not have enough GPU
  quota in the target region to deploy this plan. \

  **RegionUnavailable**: The VM SKU is not available in the target region. \

  **InefficientDeployment**: The deployment can start successfully on this SKU,
  but its estimated runtime performance falls below the acceptable threshold for
  serving this model.
fullName: InfeasibleCode
remarks: ''
isDeprecated: false
syntax: |
  type InfeasibleCode = string
