### YamlMime:TSTypeAlias
name: QuotaStatus
uid: '@azure/arm-aiinfraoptimization.QuotaStatus'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  Whether subscription quota is sufficient for a requested deployment. \

  [KnownQuotaStatus](xref:@azure/arm-aiinfraoptimization.KnownQuotaStatus) can
  be used interchangeably with QuotaStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Available**: Quota is sufficient for the requested replicas. \

  **Unavailable**: Quota is insufficient for the requested replicas. \

  **Unknown**: Quota could not be determined.
fullName: QuotaStatus
remarks: ''
isDeprecated: false
syntax: |
  type QuotaStatus = string
