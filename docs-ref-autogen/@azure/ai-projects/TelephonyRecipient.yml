### YamlMime:TSType
name: TelephonyRecipient
uid: '@azure/ai-projects.TelephonyRecipient'
package: '@azure/ai-projects'
summary: >-
  One recipient in an inline campaign input. Each input position is a separate
  intended call, including repeated destinations.
fullName: TelephonyRecipient
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: destination
    uid: '@azure/ai-projects.TelephonyRecipient.destination'
    package: '@azure/ai-projects'
    summary: >-
      Recipient address; currently phone_number only. Unsupported types fail
      preparation; future variants can reuse this field.
    fullName: destination
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'destination: TelephonyAddressUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.TelephonyAddressUnion" />
  - name: scheduled_at
    uid: '@azure/ai-projects.TelephonyRecipient.scheduled_at'
    package: '@azure/ai-projects'
    summary: >-
      Earliest dispatch time for recipient scheduling. Required only when
      schedule.type is recipient; forbidden for other modes.
    fullName: scheduled_at
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scheduled_at?: Date'
      return:
        description: ''
        type: Date
  - name: structured_inputs
    uid: '@azure/ai-projects.TelephonyRecipient.structured_inputs'
    package: '@azure/ai-projects'
    summary: >-
      Agent inputs with nested JSON/null, unique names and depth at most 16.
      Agent schemas/defaults apply. Replay preserves types, exact numbers, array
      order and null/omission, but ignores object order; use lossless numeric
      serialization.
    fullName: structured_inputs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'structured_inputs?: Record<string, any>'
      return:
        description: ''
        type: Record&lt;string, any&gt;
