name: SkuMixPlacementAllocationStrategy
uid: '@azure/arm-computerecommender.SkuMixPlacementAllocationStrategy'
package: '@azure/arm-computerecommender'
summary: >-
  Allocation strategy for determining the optimal SKU split. \

  [KnownSkuMixPlacementAllocationStrategy](xref:@azure/arm-computerecommender.KnownSkuMixPlacementAllocationStrategy)
  can be used interchangeably with SkuMixPlacementAllocationStrategy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **LowestPrice**: VMs allocated to optimize for lowest price. \

  **Prioritized**: VMs allocated based on customer-specified rank for each VM
  size. \

  **EvictionOptimized**: VMs allocated to optimize for lowest eviction rate
  (Spot only).
fullName: SkuMixPlacementAllocationStrategy
remarks: ''
isDeprecated: false
syntax: |
  type SkuMixPlacementAllocationStrategy = string
