### YamlMime:TSTypeAlias
name: DeviceRegistryLinkingState
uid: '@azure/arm-iothub.DeviceRegistryLinkingState'
package: '@azure/arm-iothub'
summary: >-
  Indicates whether the IoT Hub is linked with an Azure Device Registry. \

  [KnownDeviceRegistryLinkingState](xref:@azure/arm-iothub.KnownDeviceRegistryLinkingState)
  can be used interchangeably with DeviceRegistryLinkingState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **InProgress**: The IoT Hub linking with an Azure Device Registry is in
  progress. \

  **Success**: The IoT Hub is successfully linked with an Azure Device Registry.
  \

  **Orphaned**: The linked Azure Device Registry is no longer associated with
  the IoT Hub. \

  **Failed**: The IoT Hub failed to link with an Azure Device Registry.
fullName: DeviceRegistryLinkingState
remarks: ''
isDeprecated: false
syntax: |
  type DeviceRegistryLinkingState = string
