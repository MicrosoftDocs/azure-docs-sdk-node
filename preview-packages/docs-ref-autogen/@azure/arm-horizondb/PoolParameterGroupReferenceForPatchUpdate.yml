name: PoolParameterGroupReferenceForPatchUpdate
uid: '@azure/arm-horizondb.PoolParameterGroupReferenceForPatchUpdate'
package: '@azure/arm-horizondb'
summary: >-
  A parameter group reference for updating an existing HorizonDB pool. The pool
  can switch in either direction between its corresponding default parameter
  group and a customer-created parameter group.
fullName: PoolParameterGroupReferenceForPatchUpdate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: applyMethod
    uid: '@azure/arm-horizondb.PoolParameterGroupReferenceForPatchUpdate.applyMethod'
    package: '@azure/arm-horizondb'
    summary: >-
      Determines when dynamic parameter changes from the associated parameter
      group become effective. Static parameter changes always require a
      customer-initiated pool Restart, regardless of this value. Stop followed
      by Start and scheduled maintenance do not apply pending parameter changes.
    fullName: applyMethod
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'applyMethod?: string'
      return:
        description: ''
        type: string
  - name: parameterGroupResourceId
    uid: >-
      @azure/arm-horizondb.PoolParameterGroupReferenceForPatchUpdate.parameterGroupResourceId
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure resource ID of the corresponding default or customer-created
      parameter group to associate with the existing pool.
    fullName: parameterGroupResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parameterGroupResourceId?: string'
      return:
        description: ''
        type: string
