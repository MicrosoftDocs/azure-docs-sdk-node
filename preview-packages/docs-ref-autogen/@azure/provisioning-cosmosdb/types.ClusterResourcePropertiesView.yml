    fullName: backupSchedules
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'backupSchedules?: any'
      return:
        description: ''
        type: any
  - name: cassandraAuditLoggingEnabled
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.cassandraAuditLoggingEnabled
    package: '@azure/provisioning-cosmosdb'
    summary: Whether Cassandra audit logging is enabled
    fullName: cassandraAuditLoggingEnabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cassandraAuditLoggingEnabled?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: cassandraVersion
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.cassandraVersion
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      Which version of Cassandra should this cluster converge to running (e.g.,
      3.11). When updated, the cluster may take some time to migrate to the new
      version.
    fullName: cassandraVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cassandraVersion?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: clientCertificates
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.clientCertificates
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      List of TLS certificates used to authorize clients connecting to the
      cluster. All connections are TLS encrypted whether clientCertificates is
      set or not, but if clientCertificates is set, the managed Cassandra
      cluster will reject all connections not bearing a TLS client certificate
      that can be validated from one or more of the public certificates in this
      property.
    fullName: clientCertificates
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clientCertificates?: any'
      return:
        description: ''
        type: any
  - name: clusterNameOverride
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.clusterNameOverride
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      If you need to set the clusterName property in cassandra.yaml to something
      besides the resource name of the cluster, set the value to use on this
      property.
    fullName: clusterNameOverride
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clusterNameOverride?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: deallocated
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.deallocated
    package: '@azure/provisioning-cosmosdb'
