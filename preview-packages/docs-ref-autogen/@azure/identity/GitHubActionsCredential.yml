### YamlMime:TSType
name: GitHubActionsCredential
uid: '@azure/identity.GitHubActionsCredential'
package: '@azure/identity'
summary: >-
  Enables authentication to Microsoft Entra ID using GitHub Actions

  OIDC federated identity credentials.


  This credential is designed for use in GitHub Actions workflows that have

  `permissions: id-token: write` configured. It reads the following environment

  variables:

  - `AZURE_TENANT_ID` — The Entra ID tenant.

  - `AZURE_CLIENT_ID` — The client ID of the app registration with a federated
  identity credential.

  - `ACTIONS_ID_TOKEN_REQUEST_URL` — Set automatically by GitHub Actions runner.

  - `ACTIONS_ID_TOKEN_REQUEST_TOKEN` — Set automatically by GitHub Actions
  runner.
fullName: GitHubActionsCredential
remarks: ''
isDeprecated: false
type: class
constructors:
  - name: GitHubActionsCredential(GitHubActionsCredentialOptions)
    uid: '@azure/identity.GitHubActionsCredential.constructor'
    package: '@azure/identity'
    summary: >-
      Creates a new instance of GitHubActionsCredential.


      Reads `AZURE_TENANT_ID` and `AZURE_CLIENT_ID` from environment variables,

      as well as GitHub Actions OIDC variables `ACTIONS_ID_TOKEN_REQUEST_URL`
      and

      `ACTIONS_ID_TOKEN_REQUEST_TOKEN`.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'new GitHubActionsCredential(options?: GitHubActionsCredentialOptions)'
      parameters:
        - id: options
          type: <xref uid="@azure/identity.GitHubActionsCredentialOptions" />
          description: Options to configure the credential.
methods:
  - name: getToken(string | string[], GetTokenOptions)
    uid: '@azure/identity.GitHubActionsCredential.getToken'
    package: '@azure/identity'
    summary: >-
      Authenticates with Microsoft Entra ID and returns an access token if
      successful.

      If authentication fails, a
      [CredentialUnavailableError](xref:@azure/identity.CredentialUnavailableError)
      or

      [AuthenticationError](xref:@azure/identity.AuthenticationError) will be
      thrown with the details of the failure.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function getToken(scopes: string | string[], options?: GetTokenOptions):
        Promise<AccessToken>
      parameters:
        - id: scopes
          type: string | string[]
          description: The list of scopes for which the token will have access.
        - id: options
          type: <xref uid="@azure/identity.GetTokenOptions" />
          description: |-
            The options used to configure any requests this
                           TokenCredential implementation might make.
      return:
        description: ''
        type: Promise&lt;<xref uid="@azure/identity.AccessToken" />&gt;
