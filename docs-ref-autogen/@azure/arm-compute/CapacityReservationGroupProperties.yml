  - name: reservationType
    uid: '@azure/arm-compute.CapacityReservationGroupProperties.reservationType'
    package: '@azure/arm-compute'
    summary: >-
      Indicates the type of capacity reservation. Allowed values are 'Block' for
      block capacity reservations that enable a VM to consume capacity only from
      this capacity block when it is associated using a capacity reservation
      group, 'Targeted' for reservations that enable a VM to consume capacity
      from an explicitly associated capacity reservation group and fall back to
      the publicly available capacity if the reservation is full, and 'Open' for
      reservations that a VM consumes when it is eligible from an implicitly
      associated capacity reservation group with the matching VM size and zone
      without associating that capacity reservation group and fall back to the
      publicly available capacity if the reservation is full. The reservation
      type is immutable and cannot be changed after the capacity reservation
      group is created.
    fullName: reservationType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'reservationType?: string'
      return:
        description: ''
        type: string
  - name: sharingProfile
    uid: '@azure/arm-compute.CapacityReservationGroupProperties.sharingProfile'
    package: '@azure/arm-compute'
    summary: >-
      Specifies the settings to enable sharing across subscriptions for the
      capacity reservation group resource. The capacity reservation group
      resource can generally be shared across subscriptions belonging to a
      single Azure AAD tenant or across AAD tenants if there is a trust
      relationship established between the tenants.  Block capacity reservation
      does not support sharing across subscriptions. **Note:** Minimum
      api-version: 2023-09-01. Please refer to
      https://aka.ms/computereservationsharing for more details.
    fullName: sharingProfile
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sharingProfile?: ResourceSharingProfile'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute.ResourceSharingProfile" />
