### YamlMime:TSType
name: ExistingResourceProps
uid: '@azure/provisioning-core.ExistingResourceProps'
package: '@azure/provisioning-core'
summary: >-
  Public-facing props for a reference to an existing (pre-deployed) Azure

  resource. This is strictly narrower than the deployable resource props —

  Bicep `existing` declarations only accept `name` and optional `scope:`.


  Read-side access on the returned resource handle is unrestricted —

  `kv.properties.vaultUri`, `sa.id`, etc. all work and compile to symbolic

  references that ARM resolves at deployment time.


  Symbolic parent/extension scopes are expressed by passing the parent

  resource as the ProvisioningComponent `context` argument to the resource
  constructor

  (with `{ existing: true }`), not via this `scope` field.
fullName: ExistingResourceProps
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: name
    uid: '@azure/provisioning-core.ExistingResourceProps.name'
    package: '@azure/provisioning-core'
    summary: Required. The actual Azure name of the existing resource.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: scope
    uid: '@azure/provisioning-core.ExistingResourceProps.scope'
    package: '@azure/provisioning-core'
    summary: |-
      Optional. The scope at which to look up the resource. Used when the
      resource lives outside the current deployment's scope (different RG,
      subscription, management group, or tenant).

      Pass a scope-function call expression (e.g. `resourceGroup("name")`,
      `subscription()`, `managementGroup("mg")`, `tenant()`).
    fullName: scope
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scope?: ScopeExpression'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.ScopeExpression" />
