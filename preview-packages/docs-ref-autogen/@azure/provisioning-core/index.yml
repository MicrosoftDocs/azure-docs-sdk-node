      VariableOptions)
    uid: '@azure/provisioning-core.createVariable'
    package: '@azure/provisioning-core'
    summary: |+
      Defines a named value evaluated at deployment time.

      **Example**

      ```typescript snippet:ignore
      import { Stack, createVariable } from "@azure/provisioning-core";

      const stack = new Stack("my-app");
      const suffix = createVariable(stack, "suffix", "prod");
      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function createVariable<TValue>(stack: DeploymentComponent, name:
        string, value: TValue, options?: VariableOptions): Variable<TValue>
      parameters:
