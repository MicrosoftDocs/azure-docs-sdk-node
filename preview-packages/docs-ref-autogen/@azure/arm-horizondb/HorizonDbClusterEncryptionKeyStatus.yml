name: HorizonDbClusterEncryptionKeyStatus
uid: '@azure/arm-horizondb.HorizonDbClusterEncryptionKeyStatus'
package: '@azure/arm-horizondb'
summary: >-
  The validation status of a customer-managed encryption key used by a HorizonDB
  cluster. \

  [KnownHorizonDbClusterEncryptionKeyStatus](xref:@azure/arm-horizondb.KnownHorizonDbClusterEncryptionKeyStatus)
  can be used interchangeably with HorizonDbClusterEncryptionKeyStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Valid**: The encryption key is valid and accessible to the configured
  user-assigned managed identity. \

  **Invalid**: The encryption key is invalid or inaccessible to the configured
  user-assigned managed identity.
