### YamlMime:TSTypeAlias
name: ExecutionStatus
uid: '@azure/arm-postgresql-flexible.ExecutionStatus'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Service-set extensible enumeration indicating the status of operation. \

  [KnownExecutionStatus](xref:@azure/arm-postgresql-flexible.KnownExecutionStatus)
  can be used interchangeably with ExecutionStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Running**: Operation is currently running. \

  **Cancelled**: Operation has been cancelled. \

  **Failed**: Operation has failed. \

  **Succeeded**: Operation has succeeded.
fullName: ExecutionStatus
remarks: ''
isDeprecated: false
syntax: |
  type ExecutionStatus = string
