### YamlMime:TSType
name: AciWorkload
uid: '@azure/arm-networksecurity.AciWorkload'
package: '@azure/arm-networksecurity'
summary: ACI (Azure Container Instances) sandbox workload configuration.
fullName: AciWorkload
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: agentIdentity
    uid: '@azure/arm-networksecurity.AciWorkload.agentIdentity'
    package: '@azure/arm-networksecurity'
    summary: The Entra agent identity associated with the workload.
    fullName: agentIdentity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agentIdentity?: AgentIdentity'
      return:
        description: ''
        type: <xref uid="@azure/arm-networksecurity.AgentIdentity" />
  - name: resourceId
    uid: '@azure/arm-networksecurity.AciWorkload.resourceId'
    package: '@azure/arm-networksecurity'
    summary: >-
      The Azure Resource Manager resource ID of the Azure Container Instances
      (ACI)

      resource backing this member's sandbox. Starting in API version

      `2026-10-07-preview`, this identifies the parent SandboxGroup -- the
      enrollment

      boundary associated with the fabric through a ClusterAssociation -- rather
      than

      the individual container group.
    fullName: resourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resourceId: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-networksecurity.AciWorkload.type'
    package: '@azure/arm-networksecurity'
    summary: The workload type.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "ACI"'
      return:
        description: ''
        type: '"ACI"'
  - name: workloadId
    uid: '@azure/arm-networksecurity.AciWorkload.workloadId'
    package: '@azure/arm-networksecurity'
    summary: >-
      The human-readable name of the ACI sandbox. The ACI resource provider
      supplies it at creation.

      It must be unique within the agent fabric and cannot be changed after the
      member is created.

      The member resource name is the sandbox GUID, not this name.
    fullName: workloadId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'workloadId: string'
      return:
        description: ''
        type: string
inheritedProperties:
  - name: memberGuid
    uid: '@azure/arm-networksecurity.AciWorkload.memberGuid'
    package: '@azure/arm-networksecurity'
    summary: >-
      The unique identifier (GUID) assigned to the member when it is created.
      For most workload

      types this is assigned by the resource provider and is read-only. Starting
      in API version

      `2026-10-07-preview`, ACI workloads instead supply this value at creation:
      the ACI resource

      provider generates the GUID for the sandbox and this field is immutable
      afterward. Starting in

      API version `2026-11-02-preview`, the ACI member resource name is this
      GUID: the service sets

      memberGuid from the member name, and a value supplied in the request must
      match the member name.
    fullName: memberGuid
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'memberGuid?: string'
      return:
        description: ''
        type: string
    inheritanceDescription: >-
      <b>Inherited From</b>
      [WorkloadBase.memberGuid](xref:@azure/arm-networksecurity.WorkloadBase.memberGuid)
extends: <xref uid="@azure/arm-networksecurity.WorkloadBase" />
