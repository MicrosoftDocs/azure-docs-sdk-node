name: ResourceAssociationAccessMode
uid: '@azure/provisioning-search.types.ResourceAssociationAccessMode'
package: '@azure/provisioning-search'
summary: >-
  Access mode of the resource association


  Known values:


  - `"Enforced"`: Enforced access mode - traffic to the resource that failed
  access checks is blocked


  - `"Learning"`: Learning access mode - traffic to the resource is enabled for
  analysis but not blocked


  - `"Audit"`: Audit access mode - traffic to the resource that fails access
  checks is logged but not blocked
