### YamlMime:TSTypeAlias
name: PostgreSqlFlexibleServerHighAvailabilityMode
uid: '@azure/arm-postgresql-flexible.PostgreSqlFlexibleServerHighAvailabilityMode'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Mode of high availability supported for this compute. \

  [KnownPostgreSqlFlexibleServerHighAvailabilityMode](xref:@azure/arm-postgresql-flexible.KnownPostgreSqlFlexibleServerHighAvailabilityMode)
  can be used interchangeably with PostgreSqlFlexibleServerHighAvailabilityMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: High availability is disabled for the server. \

  **ZoneRedundant**: High availability is enabled for the server, with standby
  server in a different availability zone than that of the primary. \

  **SameZone**: High availability is enabled for the server, with standby server
  in the same availability zone as the primary.
fullName: PostgreSqlFlexibleServerHighAvailabilityMode
remarks: ''
isDeprecated: false
syntax: |
  type PostgreSqlFlexibleServerHighAvailabilityMode = string
