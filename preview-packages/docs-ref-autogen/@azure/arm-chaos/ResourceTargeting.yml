### YamlMime:TSType
name: ResourceTargeting
uid: '@azure/arm-chaos.ResourceTargeting'
package: '@azure/arm-chaos'
summary: >-
  Model that represents unified resource targeting with symmetric
  include/exclude criteria.

  Both sides support the same set of dimensions.
fullName: ResourceTargeting
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: exclude
    uid: '@azure/arm-chaos.ResourceTargeting.exclude'
    package: '@azure/arm-chaos'
    summary: |-
      Exclusion criteria. Resources matching ANY active dimension are removed.
      Null or omitted means no exclusions applied.
    fullName: exclude
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'exclude?: ResourceTargetingCriteria'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ResourceTargetingCriteria" />
  - name: include
    uid: '@azure/arm-chaos.ResourceTargeting.include'
    package: '@azure/arm-chaos'
    summary: >-
      Inclusion criteria. Resources must match ALL active dimensions to be
      candidates.

      Null or omitted means no inclusion filtering (all resources are
      candidates).
    fullName: include
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'include?: ResourceTargetingCriteria'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ResourceTargetingCriteria" />
