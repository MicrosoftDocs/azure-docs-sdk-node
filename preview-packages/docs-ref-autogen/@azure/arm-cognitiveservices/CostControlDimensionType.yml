name: CostControlDimensionType
uid: '@azure/arm-cognitiveservices.CostControlDimensionType'
package: '@azure/arm-cognitiveservices'
summary: >-
  Cost control counter dimensions, including Custom retained for legacy read
  compatibility. \

  [KnownCostControlDimensionType](xref:@azure/arm-cognitiveservices.KnownCostControlDimensionType)
  can be used interchangeably with CostControlDimensionType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Agent**: Consumption is partitioned by the stable Foundry agent ID. \

  **Identity**: Consumption is partitioned by the authenticated principal object
  ID. \

  **Session**: Consumption is partitioned by the Foundry session ID. \

  **Project**: Consumption is partitioned by the Foundry project resource ID. \

  **Account**: Consumption is partitioned by the owning Cognitive Services
  account. \

  **Custom**: Legacy read-only dimension using `CostControlDimension.Attribute`.

  New Custom counter authoring is reserved for future support.
fullName: CostControlDimensionType
remarks: ''
isDeprecated: false
syntax: |
  type CostControlDimensionType = string
