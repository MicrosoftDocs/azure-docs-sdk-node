### YamlMime:TSEnum
name: KnownIdentitySettingsLifeCycle
uid: '@azure/arm-appcontainers.KnownIdentitySettingsLifeCycle'
package: '@azure/arm-appcontainers'
summary: >-
  Use to select the lifecycle stages of a Container App during which the Managed
  Identity should be available.
fullName: KnownIdentitySettingsLifeCycle
remarks: ''
isDeprecated: false
fields:
  - name: All
    uid: '@azure/arm-appcontainers.KnownIdentitySettingsLifeCycle.All'
    package: '@azure/arm-appcontainers'
    summary: Use managed identity during all lifecycle stages of the Container App.
  - name: Init
    uid: '@azure/arm-appcontainers.KnownIdentitySettingsLifeCycle.Init'
    package: '@azure/arm-appcontainers'
    summary: Use managed identity during the init stage of the Container App lifecycle.
  - name: Main
    uid: '@azure/arm-appcontainers.KnownIdentitySettingsLifeCycle.Main'
    package: '@azure/arm-appcontainers'
    summary: Use managed identity during the main stage of the Container App lifecycle.
  - name: None
    uid: '@azure/arm-appcontainers.KnownIdentitySettingsLifeCycle.None'
    package: '@azure/arm-appcontainers'
    summary: Do not use managed identity during any lifecycle stage.
