name: KubernetesSecretType
uid: '@azure/arm-secretsstoreextension.KubernetesSecretType'
package: '@azure/arm-secretsstoreextension'
summary: >-
  Supported Kubernetes secret types. \

  [KnownKubernetesSecretType](xref:@azure/arm-secretsstoreextension.KnownKubernetesSecretType)
  can be used interchangeably with KubernetesSecretType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Opaque**: Opaque is the default secret type. \

  **kubernetes.io/tls**: The kubernetes.io/tls secret type is for storing a
  certificate and its associated key that are typically used for TLS.
