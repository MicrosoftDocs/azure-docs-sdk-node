    fullName: fileShareName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'fileShareName?: string'
      return:
        description: ''
        type: string
  - name: mode
    uid: '@azure/arm-containerservice.CloudShellStorageProfile.mode'
