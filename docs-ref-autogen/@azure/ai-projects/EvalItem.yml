        type: <xref uid="@azure/ai-projects.EvalItemContent" />
  - name: role
    uid: '@azure/ai-projects.EvalItem.role'
    package: '@azure/ai-projects'
    summary: |-
      The role of the message input. One of `user`, `assistant`, `system`, or
        `developer`.
    fullName: role
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'role: "user" | "system" | "assistant" | "developer"'
