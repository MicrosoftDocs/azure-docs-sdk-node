### YamlMime:TSType
name: WorkspaceEncryptionStatus
uid: '@azure/arm-chaos.WorkspaceEncryptionStatus'
package: '@azure/arm-chaos'
summary: >-
  Service observations of protection and access for customer data under the
  Workspace encryption scope.
fullName: WorkspaceEncryptionStatus
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: error
    uid: '@azure/arm-chaos.WorkspaceEncryptionStatus.error'
    package: '@azure/arm-chaos'
    summary: >-
      The configuration or health error. Failed state includes a code and
      message.

      CustomerKeyAccessFailed means Azure Storage cannot use the customer key.

      EncryptionConfigurationFailed means a service-side configuration step
      failed.

      A more specific cause is included only when the platform response
      identifies it.
    fullName: error
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'error?: ErrorDetail'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.ErrorDetail" />
  - name: lastCheckedAt
    uid: '@azure/arm-chaos.WorkspaceEncryptionStatus.lastCheckedAt'
    package: '@azure/arm-chaos'
    summary: The UTC time of the observation, including a failed check.
    fullName: lastCheckedAt
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastCheckedAt?: Date'
      return:
        description: ''
        type: Date
  - name: observedKeyEncryptionKeyUrl
    uid: '@azure/arm-chaos.WorkspaceEncryptionStatus.observedKeyEncryptionKeyUrl'
    package: '@azure/arm-chaos'
    summary: |-
      The active key URI reported by Azure Storage, including its version when
      available. Omitted when unknown or when protection is Microsoft-managed.
      This value is not inferred from the requested key.
    fullName: observedKeyEncryptionKeyUrl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'observedKeyEncryptionKeyUrl?: string'
      return:
        description: ''
        type: string
  - name: observedProtection
    uid: '@azure/arm-chaos.WorkspaceEncryptionStatus.observedProtection'
    package: '@azure/arm-chaos'
    summary: The last directly observed active protection. Omitted when unknown.
    fullName: observedProtection
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'observedProtection?: string'
      return:
        description: ''
        type: string
  - name: state
    uid: '@azure/arm-chaos.WorkspaceEncryptionStatus.state'
    package: '@azure/arm-chaos'
    summary: The result of configuration or the most recent usable health observation.
    fullName: state
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'state: string'
      return:
        description: ''
        type: string
