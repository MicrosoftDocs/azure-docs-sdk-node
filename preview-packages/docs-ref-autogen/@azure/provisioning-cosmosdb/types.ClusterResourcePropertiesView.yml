      be verifiable using one of the certificates provided in this property.
    fullName: externalGossipCertificates
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'externalGossipCertificates?: any'
      return:
        description: ''
        type: any
  - name: externalSeedNodes
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.externalSeedNodes
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      List of IP addresses of seed nodes in unmanaged data centers. These will
      be added to the seed node lists of all managed nodes.
    fullName: externalSeedNodes
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'externalSeedNodes?: any'
      return:
        description: ''
        type: any
  - name: gossipCertificates
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.gossipCertificates
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      Read-only output: List of TLS certificates that unmanaged nodes must trust
      for gossip with managed nodes. All managed nodes will present TLS client
      certificates that are verifiable using one of the certificates provided in
      this property.
    fullName: gossipCertificates
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'gossipCertificates?: Expression<Certificate[]>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-cosmosdb.types.Certificate" />[]&gt;
