### YamlMime:TSType
name: UpgradeContext
uid: '@azure/arm-containerservice.UpgradeContext'
package: '@azure/arm-containerservice'
summary: >-
  Contextual information for a specific upgrade type (Kubernetes version or node
  OS

  image). Because the Kubernetes version and node OS image can be managed

  independently — for example, auto-upgrade for the node image but manual for
  the

  Kubernetes version — this context is reported per upgrade type rather than
  once

  for the whole cluster.
fullName: UpgradeContext
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: currentUpgradeStrategy
    uid: '@azure/arm-containerservice.UpgradeContext.currentUpgradeStrategy'
    package: '@azure/arm-containerservice'
    summary: >-
      The strategy currently used to perform this type of upgrade (manual or
      auto-upgrade).
    fullName: currentUpgradeStrategy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'currentUpgradeStrategy?: string'
      return:
        description: ''
        type: string
  - name: lastSuccessfulUpgradeTime
    uid: '@azure/arm-containerservice.UpgradeContext.lastSuccessfulUpgradeTime'
    package: '@azure/arm-containerservice'
    summary: >-
      The UTC time of the last successful upgrade of this type for this scope.

      Clients can compute "days since last successful upgrade" from this value
      and the

      current time; the server intentionally does not return a precomputed value
      so that

      cached results do not go stale.
    fullName: lastSuccessfulUpgradeTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastSuccessfulUpgradeTime?: Date'
      return:
        description: ''
        type: Date
  - name: nextMaintenanceWindow
    uid: '@azure/arm-containerservice.UpgradeContext.nextMaintenanceWindow'
    package: '@azure/arm-containerservice'
    summary: >-
      The next scheduled automatic upgrade maintenance window for this upgrade
      type, if auto-upgrade is configured.
    fullName: nextMaintenanceWindow
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'nextMaintenanceWindow?: UpgradeInsightMaintenanceWindow'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-containerservice.UpgradeInsightMaintenanceWindow" />
