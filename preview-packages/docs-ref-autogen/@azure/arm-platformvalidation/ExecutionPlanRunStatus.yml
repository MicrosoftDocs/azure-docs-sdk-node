### YamlMime:TSTypeAlias
name: ExecutionPlanRunStatus
uid: '@azure/arm-platformvalidation.ExecutionPlanRunStatus'
package: '@azure/arm-platformvalidation'
summary: >-
  The status of the execution plan run. \

  [KnownExecutionPlanRunStatus](xref:@azure/arm-platformvalidation.KnownExecutionPlanRunStatus)
  can be used interchangeably with ExecutionPlanRunStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: The execution plan run is succeeded. \

  **Queued**: The execution plan run has been queued. \

  **Running**: The execution plan run is running. \

  **Completed**: The execution plan run is completed. \

  **Failed**: The execution plan run is failed. \

  **TimedOut**: The execution plan run is timed out. \

  **Unknown**: The execution plan run is unknown.
fullName: ExecutionPlanRunStatus
remarks: ''
isDeprecated: false
syntax: |
  type ExecutionPlanRunStatus = string
