  - name: getConnectOptions
    uid: '@azure/microsoft-playwright-testing.getConnectOptions'
    package: '@azure/microsoft-playwright-testing'
    summary: >+
      Get connect options required to connect to Microsoft Playwright Testing's
      cloud hosted browsers.


      **Example**


      ```

      import playwright, { test, expect, BrowserType } from "@playwright/test";

      import { getConnectOptions } from "@azure/microsoft-playwright-testing";


      test('has title', async ({ browserName }) => {
       const { wsEndpoint, options } = await getConnectOptions();
       const browser = await (playwright[browserName] as BrowserType).connect(wsEndpoint, options);
       const context = await browser.newContext();
       const page = await context.newPage();

       await page.goto('https://playwright.dev/');
       await expect(page).toHaveTitle(/Playwright/);

       await page.close();
       await context.close();
       await browser.close();
      });

      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        getConnectOptions: (options?: Omit<PlaywrightServiceAdditionalOptions,
        "serviceAuthType">) => Promise<BrowserConnectOptions>
      return:
        description: ''
        type: >-
          (options?: Omit&lt;PlaywrightServiceAdditionalOptions,
          "serviceAuthType"&gt;) =&gt; Promise&lt;BrowserConnectOptions&gt;
  - name: getServiceConfig
    uid: '@azure/microsoft-playwright-testing.getServiceConfig'
    package: '@azure/microsoft-playwright-testing'
    summary: >+
      Generate playwright configuration integrated with Microsoft Playwright
      Testing.


      **Example**


      ```

      import { defineConfig } from "playwright/test";

      import { getServiceConfig } from "@azure/microsoft-playwright-testing";

      import playwrightConfig from "./playwright.config";


      export default defineConfig(playwrightConfig,
      getServiceConfig(playwrightConfig));

      ```




      **Example**


      ```

      import { defineConfig } from "playwright/test";

      import { getServiceConfig, ServiceOS } from
      "@azure/microsoft-playwright-testing";

      import playwrightConfig from "./playwright.config";


      export default defineConfig(playwrightConfig,
      getServiceConfig(playwrightConfig, {
       runId: "custom run id",
       os: ServiceOS.WINDOWS
      }));

      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        getServiceConfig: (config: PlaywrightTestConfig<PlaywrightTestOptions &
        CustomProperties<{}>, PlaywrightWorkerOptions & CustomProperties<{}>>,
        options?: PlaywrightServiceAdditionalOptions) =>
        PlaywrightTestConfig<PlaywrightTestOptions & CustomProperties<{}>,
        PlaywrightWorkerOptions & CustomProperties<{}>>
      return:
        description: ''
        type: >-
