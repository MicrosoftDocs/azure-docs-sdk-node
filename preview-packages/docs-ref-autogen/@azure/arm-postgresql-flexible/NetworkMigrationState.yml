### YamlMime:TSTypeAlias
name: NetworkMigrationState
uid: '@azure/arm-postgresql-flexible.NetworkMigrationState'
package: '@azure/arm-postgresql-flexible'
summary: >-
  State of the network migration operation. \

  [KnownNetworkMigrationState](xref:@azure/arm-postgresql-flexible.KnownNetworkMigrationState)
  can be used interchangeably with NetworkMigrationState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Pending**: Network migration is pending. \

  **InProgress**: Network migration is in progress. \

  **Succeeded**: Network migration succeeded. \

  **Failed**: Network migration failed. \

  **CancelInProgress**: Network migration cancellation is in progress. \

  **Cancelled**: Network migration was cancelled.
fullName: NetworkMigrationState
remarks: ''
isDeprecated: false
syntax: |
  type NetworkMigrationState = string
