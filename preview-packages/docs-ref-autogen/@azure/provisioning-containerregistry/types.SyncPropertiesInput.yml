    summary: >-
      The period of time for which a message is available to sync before it is
      expired. Specify the duration using the format P[n]Y[n]M[n]DT[n]H[n]M[n]S
      as per ISO8601.
    fullName: messageTtl
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'messageTtl: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
