name: ScenarioTemplateVersion
uid: '@azure/arm-chaos.ScenarioTemplateVersion'
package: '@azure/arm-chaos'
summary: >-
  Model that represents a single published version of a scenario template. A
  published version

  is immutable: corrections are shipped as a new version rather than by changing
  an existing

  one, so a scenario that records the version it was created from always
  resolves to the same

  content.
fullName: ScenarioTemplateVersion
