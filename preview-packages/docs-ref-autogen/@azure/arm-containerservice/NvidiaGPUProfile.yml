### YamlMime:TSType
name: NvidiaGPUProfile
uid: '@azure/arm-containerservice.NvidiaGPUProfile'
package: '@azure/arm-containerservice'
summary: NVIDIA-specific GPU settings
fullName: NvidiaGPUProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: driverMode
    uid: '@azure/arm-containerservice.NvidiaGPUProfile.driverMode'
    package: '@azure/arm-containerservice'
    summary: |-
      NVIDIA GPU resource allocation mode. DevicePlugin installs the NVIDIA
      Kubernetes device plugin. DRA installs the NVIDIA DRA driver.
    fullName: driverMode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'driverMode?: string'
      return:
        description: ''
        type: string
  - name: managementMode
    uid: '@azure/arm-containerservice.NvidiaGPUProfile.managementMode'
    package: '@azure/arm-containerservice'
    summary: >-
      The Managed GPU experience installs additional components, such as the
      Data Center GPU Manager (DCGM) metrics for monitoring, on top of the GPU
      driver for you. For more details of what is installed, check out
      aka.ms/aks/managed-gpu.
    fullName: managementMode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'managementMode?: string'
      return:
        description: ''
        type: string
  - name: migProfiles
    uid: '@azure/arm-containerservice.NvidiaGPUProfile.migProfiles'
    package: '@azure/arm-containerservice'
    summary: >-
      The ordered list of MIG (Multi-Instance GPU) partition profiles to assign
      to each supported NVIDIA GPU. When `migStrategy` is `Single`, exactly one
      profile must be specified. When `migStrategy` is `Mixed`, one or more
      profiles may be specified and the combination is validated against the
      supported MIG geometry for the agent pool's GPU VM size. The same value
      may appear more than once to request multiple partitions of that size.
      This field is mutually exclusive with the top-level `gpuInstanceProfile`
      property. For more information, see https://aka.ms/aks/managed-gpu.
    fullName: migProfiles
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'migProfiles?: string[]'
      return:
        description: ''
        type: string[]
  - name: migStrategy
    uid: '@azure/arm-containerservice.NvidiaGPUProfile.migStrategy'
    package: '@azure/arm-containerservice'
    summary: >-
      Sets the MIG (Multi-Instance GPU) strategy that will be used for managed
      MIG support. For more information about the different strategies, visit
      aka.ms/aks/managed-gpu. When not specified, the default is None.
    fullName: migStrategy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'migStrategy?: string'
      return:
        description: ''
        type: string
