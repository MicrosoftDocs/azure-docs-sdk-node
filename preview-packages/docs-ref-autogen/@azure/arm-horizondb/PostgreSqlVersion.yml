name: PostgreSqlVersion
uid: '@azure/arm-horizondb.PostgreSqlVersion'
package: '@azure/arm-horizondb'
summary: >-
  A PostgreSQL major version supported by HorizonDB. API version
  2026-10-01-preview accepts 17 and 18. Future API versions may add named
  values, and clients must tolerate unknown values returned by the service. \

  [KnownPostgreSqlVersion](xref:@azure/arm-horizondb.KnownPostgreSqlVersion) can
  be used interchangeably with PostgreSqlVersion,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **17**: PostgreSQL major version 17. \

  **18**: PostgreSQL major version 18.
fullName: PostgreSqlVersion
remarks: ''
isDeprecated: false
syntax: |
  type PostgreSqlVersion = string
