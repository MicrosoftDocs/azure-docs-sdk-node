### YamlMime:TSType
name: MicrosoftEntraAdministratorPropertiesForAdd
uid: '@azure/arm-horizondb.MicrosoftEntraAdministratorPropertiesForAdd'
package: '@azure/arm-horizondb'
summary: >-
  Properties for creating or updating a PostgreSQL role that is a member of
  azure_pg_admin and mapped to a Microsoft Entra principal.
fullName: MicrosoftEntraAdministratorPropertiesForAdd
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: principalName
    uid: >-
      @azure/arm-horizondb.MicrosoftEntraAdministratorPropertiesForAdd.principalName
    package: '@azure/arm-horizondb'
    summary: >-
      The display name or user principal name of the Microsoft Entra principal
      to map to the PostgreSQL role. For users, this is typically the user
      principal name, such as admin@contoso.com. For groups, this is the group
      display name. For service principals, this is the application display
      name.
    fullName: principalName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'principalName: string'
      return:
        description: ''
        type: string
  - name: principalType
    uid: >-
      @azure/arm-horizondb.MicrosoftEntraAdministratorPropertiesForAdd.principalType
    package: '@azure/arm-horizondb'
    summary: The type of Microsoft Entra principal to map to the PostgreSQL role.
    fullName: principalType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'principalType: string'
      return:
        description: ''
        type: string
  - name: tenantId
    uid: '@azure/arm-horizondb.MicrosoftEntraAdministratorPropertiesForAdd.tenantId'
    package: '@azure/arm-horizondb'
    summary: >-
      The identifier of the Microsoft Entra tenant containing the principal to
      map, represented as an RFC 4122 GUID. If omitted, this value defaults to
      the tenant of the subscription.
    fullName: tenantId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tenantId?: string'
      return:
        description: ''
        type: string
