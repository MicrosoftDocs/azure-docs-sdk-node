### YamlMime:TSEnum
name: KnownExemptionCategory
uid: '@azure/arm-policy.KnownExemptionCategory'
package: '@azure/arm-policy'
summary: The policy exemption category. Possible values are Waiver and Mitigated.
fullName: KnownExemptionCategory
remarks: ''
isDeprecated: false
fields:
  - name: Mitigated
    uid: '@azure/arm-policy.KnownExemptionCategory.Mitigated'
    package: '@azure/arm-policy'
    summary: >-
      This category of exemptions usually means the mitigation actions have been
      applied to the scope.
  - name: Waiver
    uid: '@azure/arm-policy.KnownExemptionCategory.Waiver'
    package: '@azure/arm-policy'
    summary: >-
      This category of exemptions usually means the scope is not applicable for
      the policy.
