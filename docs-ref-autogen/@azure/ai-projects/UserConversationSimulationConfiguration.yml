### YamlMime:TSType
name: UserConversationSimulationConfiguration
uid: '@azure/ai-projects.UserConversationSimulationConfiguration'
package: '@azure/ai-projects'
summary: >-
  Configures the number, length, audio effects, and simulated user behavior of
  conversations.
fullName: UserConversationSimulationConfiguration
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio_effects
    uid: '@azure/ai-projects.UserConversationSimulationConfiguration.audio_effects'
    package: '@azure/ai-projects'
    summary: >-
      Audio effects applied to voice conversation simulations. This property is
      ignored for text-only simulations.
    fullName: audio_effects
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio_effects?: UserConversationSimulationAudioEffectsConfiguration'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/ai-projects.UserConversationSimulationAudioEffectsConfiguration"
          />
  - name: conversation_repetitions
    uid: >-
      @azure/ai-projects.UserConversationSimulationConfiguration.conversation_repetitions
    package: '@azure/ai-projects'
    summary: >-
      Number of independent conversation repetitions for each test case.
      Defaults to 1 when not specified at either the data-source or test-case
      level.
    fullName: conversation_repetitions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'conversation_repetitions?: number'
      return:
        description: ''
        type: number
  - name: desired_num_turns
    uid: >-
      @azure/ai-projects.UserConversationSimulationConfiguration.desired_num_turns
    package: '@azure/ai-projects'
    summary: >-
      Target number of turns in each conversation. The effective value cannot
      exceed the effective `max_num_turns`. When omitted, no target is set and
      the simulation model determines the conversation length dynamically from
      the scenario.
    fullName: desired_num_turns
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'desired_num_turns?: number'
      return:
        description: ''
        type: number
  - name: max_num_turns
    uid: '@azure/ai-projects.UserConversationSimulationConfiguration.max_num_turns'
    package: '@azure/ai-projects'
    summary: >-
      Hard limit on turns in each conversation. When omitted, the service
      defaults to 20.
    fullName: max_num_turns
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_num_turns?: number'
      return:
        description: ''
        type: number
  - name: user_behavior
    uid: '@azure/ai-projects.UserConversationSimulationConfiguration.user_behavior'
    package: '@azure/ai-projects'
    summary: Conversation behavior of the simulated user.
    fullName: user_behavior
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'user_behavior?: UserConversationSimulationUserBehaviorConfiguration'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/ai-projects.UserConversationSimulationUserBehaviorConfiguration"
          />
