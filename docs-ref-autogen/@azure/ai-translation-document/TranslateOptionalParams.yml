  - name: deploymentName
    uid: '@azure/ai-translation-document.TranslateOptionalParams.deploymentName'
    package: '@azure/ai-translation-document'
    summary: >-
      Deployment name of the custom translation model for the translation
      request.
    fullName: deploymentName
    remarks: ''
    isDeprecated: false
    syntax:
