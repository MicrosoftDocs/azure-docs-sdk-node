### YamlMime:TSType
name: EvaluatorGenerationInputs
uid: '@azure/ai-projects.EvaluatorGenerationInputs'
package: '@azure/ai-projects'
summary: Caller-supplied inputs for an evaluator generation job.
fullName: EvaluatorGenerationInputs
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: category
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.category'
    package: '@azure/ai-projects'
    summary: >-
      Generation intent. Omission preserves the existing quality path.
      Explicitly select safety for safety generation and regeneration. Safety
      output uses Boolean scoring, allowed classifications, and two named
      violation metrics.
    fullName: category
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'category?: EvaluatorGenerationCategory'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluatorGenerationCategory" />
  - name: dimensions
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.dimensions'
    package: '@azure/ai-projects'
    summary: >-
      Caller-approved dimensions to preserve while generating other checks.
      Omission preserves prior approved dimensions on regeneration; an explicit
      list replaces the fixed set. Safety fixed dimensions require an explicit
      allowed Boolean, omit weights, and preserve classification as part of
      their policy meaning.
    fullName: dimensions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'dimensions?: Dimension[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.Dimension" />[]
  - name: evaluator_description
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.evaluator_description'
    package: '@azure/ai-projects'
    summary: >-
      Optional human-friendly description for the resulting evaluator. Surfaced
      as `EvaluatorVersion.description` on the persisted evaluator. Typically
      collected from the UI alongside `evaluator_display_name`. The `evaluator_`
      prefix disambiguates this from any other description fields on related
      models.
    fullName: evaluator_description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluator_description?: string'
      return:
        description: ''
        type: string
  - name: evaluator_display_name
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.evaluator_display_name'
    package: '@azure/ai-projects'
    summary: >-
      Optional human-friendly display name for the resulting evaluator. Surfaced
      as `EvaluatorVersion.display_name` on the persisted evaluator. When
      omitted, the service uses `evaluator_name` as the display name. The
      `evaluator_` prefix disambiguates this from the immutable `evaluator_name`
      identifier.
    fullName: evaluator_display_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluator_display_name?: string'
      return:
        description: ''
        type: string
  - name: evaluator_name
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.evaluator_name'
    package: '@azure/ai-projects'
    summary: >-
      The evaluator name (immutable identifier). 1-256 characters; allowed
      characters are ASCII letters, digits, underscore (`_`), period (`.`),
      tilde (`~`), and hyphen (`-`). The prefix `builtin.` is reserved for
      system-managed evaluators and is rejected by the service. If an evaluator
      with this name already exists in the project (and is rubric-subtype), the
      service creates a new version under the same name and uses the prior
      version's `dimensions` as context for incremental improvement (foundation
      of the post-//build adaptive loop). Old versions remain queryable via
      `get_version(name, version)`. If the existing evaluator is not a
      rubric-subtype evaluator (built-in, prompt-based, code-based), the request
      is rejected with `400 Bad Request`.
    fullName: evaluator_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluator_name: string'
      return:
        description: ''
        type: string
  - name: model
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.model'
    package: '@azure/ai-projects'
    summary: >-
      The caller's model for quality rubric generation (e.g., 'gpt-4o').
      Required by the service when category is quality or omitted. Safety
      generation and regeneration use centrally managed red teaming simulation
      capacity, ignore this field when supplied, and do not fall back to caller
      capacity. Safety rubric scoring separately uses centrally managed red
      teaming evaluator capacity.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model?: string'
      return:
        description: ''
        type: string
  - name: pass_threshold
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.pass_threshold'
    package: '@azure/ai-projects'
    summary: >-
      Optional normalized Likert threshold: omission uses 0.5 for fresh
      generation and inherits the saved threshold on regeneration. For ordinary
      Boolean generation, omit this field or set it to 1; other values are
      rejected and its all-pass threshold is fixed at 1. Safety generation omits
      this field because its two violation metrics have no overall threshold.
    fullName: pass_threshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'pass_threshold?: number'
      return:
        description: ''
        type: number
  - name: scoring
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.scoring'
    package: '@azure/ai-projects'
    summary: >-
      Scoring choices for the generated evaluator. For quality, supplied scoring
      defaults to Likert; omitted weights on first creation yield equal
      contribution, and regeneration preserves saved choices. Omitting scoring
      preserves existing quality generation behavior. Safety generation resolves
      omitted scoring to Boolean and rejects a conflicting supplied mode; its
      dimensions use allowed rather than weights and its two metric results are
      not combined.
    fullName: scoring
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scoring?: RubricScoring'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.RubricScoring" />
  - name: sources
    uid: '@azure/ai-projects.EvaluatorGenerationInputs.sources'
    package: '@azure/ai-projects'
    summary: >-
      Source materials for generation. Safety generation requires a nonempty
      prompt source for the objective and at least one agent or trace source for
      application context. An arbitrary dataset cannot replace safety
      application context. Ordinary generation keeps its existing supported
      sources.
    fullName: sources
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sources: EvaluatorGenerationJobSourceUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluatorGenerationJobSourceUnion" />[]
