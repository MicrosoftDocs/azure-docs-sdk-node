### YamlMime:TSTypeAlias
name: RoutingMethod
uid: '@azure/arm-oracledatabase.RoutingMethod'
package: '@azure/arm-oracledatabase'
summary: >-
  Allowed network traffic routing method. \

  [KnownRoutingMethod](xref:@azure/arm-oracledatabase.KnownRoutingMethod) can be
  used interchangeably with RoutingMethod,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **SHARED_SERVICE_ENDPOINT**: Indicates that traffic flows through the
  GoldenGate service network to public hosts. \

  **SHARED_DEPLOYMENT_ENDPOINT**: Indicates that traffic flows from the assigned
  deployment's private endpoint through the deployment's subnet. \

  **DEDICATED_ENDPOINT**: Indicates that a dedicated private endpoint is created
  in the target VCN subnet for the connection.
fullName: RoutingMethod
remarks: ''
isDeprecated: false
syntax: |
  type RoutingMethod = string
