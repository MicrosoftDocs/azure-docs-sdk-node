### YamlMime:TSTypeAlias
name: SkuTier
uid: '@azure/arm-postgresql-flexible.SkuTier'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Tier of the compute assigned to a server. \

  [KnownSkuTier](xref:@azure/arm-postgresql-flexible.KnownSkuTier) can be used
  interchangeably with SkuTier,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Burstable**: Cost-effective tier for infrequent CPU usage, ideal for
  development and testing workloads with low performance requirements. \

  **GeneralPurpose**: Balanced compute and memory for most workloads, offering
  scalable performance and I/O throughput. \

  **MemoryOptimized**: High memory-to-core ratio for demanding workloads needing
  fast in-memory processing and high concurrency.
fullName: SkuTier
remarks: ''
isDeprecated: false
syntax: |
  type SkuTier = string
