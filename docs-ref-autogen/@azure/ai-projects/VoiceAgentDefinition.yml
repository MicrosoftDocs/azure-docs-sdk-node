### YamlMime:TSType
name: VoiceAgentDefinition
uid: '@azure/ai-projects.VoiceAgentDefinition'
package: '@azure/ai-projects'
summary: >-
  The voice agent definition. Its configuration (model, instructions, audio,
  tools, and optional avatar) drives a

  managed speech-to-speech experience. Establish realtime voice sessions through

  `GET /agents/{agent_name}/endpoint/protocols/voice`. Every create or update
  produces a new immutable version.
fullName: VoiceAgentDefinition
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.VoiceAgentDefinition.audio'
    package: '@azure/ai-projects'
    summary: >-
      The audio configuration, including input and output formats, voice, turn
      detection, noise reduction, and

      transcription. These values are session defaults; a client may override
      supported fields when connecting.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio?: VoiceAgentAudioConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentAudioConfig" />
  - name: avatar
    uid: '@azure/ai-projects.VoiceAgentDefinition.avatar'
    package: '@azure/ai-projects'
    summary: >-
      Optional avatar configuration. These values are session defaults and may
      be overridden when connecting.
    fullName: avatar
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'avatar?: VoiceAgentAvatarConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentAvatarConfig" />
  - name: conversation_engine
    uid: '@azure/ai-projects.VoiceAgentDefinition.conversation_engine'
    package: '@azure/ai-projects'
    summary: >-
      The engine that owns conversation handling for this voice agent. Exactly
      one of this property and the model-backed configuration (`model_type` with
      `model`) must be provided. When this property is provided, `model_type`,
      `model`, `instructions`, `tools`, and `tool_choice` must be omitted, and
      `greeting.tool_choice` cannot be `required`, because the engine owns the
      conversation logic. The initial implementation supports a hosted-agent
      engine.
    fullName: conversation_engine
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'conversation_engine?: VoiceConversationEngineUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceConversationEngineUnion" />
  - name: greeting
    uid: '@azure/ai-projects.VoiceAgentDefinition.greeting'
    package: '@azure/ai-projects'
    summary: >-
      Optional session-start greeting. Template mode speaks exact rendered text;
      LLM-generated mode asks the session model to author the opening response
      and may use configured tools.
    fullName: greeting
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'greeting?: VoiceAgentGreetingConfigUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentGreetingConfigUnion" />
  - name: include
    uid: '@azure/ai-projects.VoiceAgentDefinition.include'
    package: '@azure/ai-projects'
    summary: Additional fields to include in service outputs.
    fullName: include
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'include?: VoiceAgentSessionIncludeOption[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentSessionIncludeOption" />[]
  - name: instructions
    uid: '@azure/ai-projects.VoiceAgentDefinition.instructions'
    package: '@azure/ai-projects'
    summary: >-
      A system (or developer) message inserted into the model's context.
      Supports template substitution via `structured_inputs`, rendered per
      session before the live session starts.
    fullName: instructions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instructions?: string'
      return:
        description: ''
        type: string
  - name: interim_response
    uid: '@azure/ai-projects.VoiceAgentDefinition.interim_response'
    package: '@azure/ai-projects'
    summary: Interim-response settings for latency and tool execution.
    fullName: interim_response
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'interim_response?: VoiceAgentInterimResponseConfigUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentInterimResponseConfigUnion" />
  - name: kind
    uid: '@azure/ai-projects.VoiceAgentDefinition.kind'
    package: '@azure/ai-projects'
    summary: The kind discriminator for a voice agent definition. Always `voice`.
    fullName: kind
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'kind: "voice"'
      return:
        description: ''
        type: '"voice"'
  - name: max_output_tokens
    uid: '@azure/ai-projects.VoiceAgentDefinition.max_output_tokens'
    package: '@azure/ai-projects'
    summary: The maximum output-token count for one response.
    fullName: max_output_tokens
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_output_tokens?: VoiceAgentMaxOutputTokens'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentMaxOutputTokens" />
  - name: model
    uid: '@azure/ai-projects.VoiceAgentDefinition.model'
    package: '@azure/ai-projects'
    summary: >-
      The model to use for this agent. Required with `model_type` for a
      model-backed voice agent and omitted when `conversation_engine` is
      provided. The model must support realtime or cascaded voice.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model?: string'
      return:
        description: ''
        type: string
  - name: model_type
    uid: '@azure/ai-projects.VoiceAgentDefinition.model_type'
    package: '@azure/ai-projects'
    summary: >-
      How the model backing this voice agent is served. Required with `model`
      for a model-backed voice agent and omitted when `conversation_engine` is
      provided. This is independent of the architecture (realtime or cascaded),
      which the service derives from the selected model.
    fullName: model_type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model_type?: VoiceModelType'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceModelType" />
  - name: output_modalities
    uid: '@azure/ai-projects.VoiceAgentDefinition.output_modalities'
    package: '@azure/ai-projects'
    summary: >-
      The output modalities the agent produces. Defaults to `["audio"]`.
      `animation` and `avatar` are available

      when an avatar is configured.
    fullName: output_modalities
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'output_modalities?: VoiceOutputModality[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceOutputModality" />[]
  - name: parallel_tool_calls
    uid: '@azure/ai-projects.VoiceAgentDefinition.parallel_tool_calls'
    package: '@azure/ai-projects'
    summary: Whether the model may call multiple tools in parallel.
    fullName: parallel_tool_calls
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'parallel_tool_calls?: boolean'
      return:
        description: ''
        type: boolean
  - name: store
    uid: '@azure/ai-projects.VoiceAgentDefinition.store'
    package: '@azure/ai-projects'
    summary: >-
      Whether conversations with this agent are persisted. A single,
      all-or-nothing persistence switch that defaults to

      `false` (privacy-safe: off by default). When `true`, Foundry persists the
      full conversation — the transcript/event

      timeline and raw audio. When `false`, nothing is persisted and no
      conversation is surfaced. There is no separate

      audio-logging control; audio is persisted only as part of this switch.
      Latency/performance telemetry (e.g.

      time-to-first-audio, inter-token latency, interruption) is
      observability-only (customer trace / App Insights) and

      is not part of the persisted conversation content.
    fullName: store
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'store?: boolean'
      return:
        description: ''
        type: boolean
  - name: structured_inputs
    uid: '@azure/ai-projects.VoiceAgentDefinition.structured_inputs'
    package: '@azure/ai-projects'
    summary: >-
      Set of structured inputs that participate in prompt template substitution,
      rendered per session before the live session starts.
    fullName: structured_inputs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'structured_inputs?: Record<string, StructuredInputDefinition>'
      return:
        description: ''
        type: >-
          Record&lt;string, <xref
          uid="@azure/ai-projects.StructuredInputDefinition" />&gt;
  - name: subagent_config
    uid: '@azure/ai-projects.VoiceAgentDefinition.subagent_config'
    package: '@azure/ai-projects'
    summary: >-
      Optional configuration for sibling Foundry text agents that this voice
      agent may consult as background specialists.
    fullName: subagent_config
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'subagent_config?: VoiceAgentSubagentConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentSubagentConfig" />
  - name: tools
    uid: '@azure/ai-projects.VoiceAgentDefinition.tools'
    package: '@azure/ai-projects'
    summary: >-
      The tools the voice agent may use. Supported tool kinds are `function`
      (executed by the client), `mcp`,

      `system` (service-managed session controls), and `toolbox`. Server-side
      tools such as `web_search`,

      `azure_ai_search`, and `openapi` are provided through a toolbox rather
      than declared directly.
    fullName: tools
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tools?: VoiceAgentToolUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentToolUnion" />[]
  - name: tool_choice
    uid: '@azure/ai-projects.VoiceAgentDefinition.tool_choice'
    package: '@azure/ai-projects'
    summary: >-
      How the model chooses tools for generated responses. `none` prevents tool
      calls, `auto` lets the model decide,

      `required` requires at least one tool call, and a specific function or MCP
      tool can be selected with an object.

      Defaults to `auto`.
    fullName: tool_choice
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tool_choice?: VoiceAgentToolChoice'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentToolChoice" />
inheritedProperties:
  - name: rai_config
    uid: '@azure/ai-projects.VoiceAgentDefinition.rai_config'
    package: '@azure/ai-projects'
    summary: >-
      Configuration for Responsible AI (RAI) content filtering and safety
      features.
    fullName: rai_config
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'rai_config?: RaiConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.RaiConfig" />
    inheritanceDescription: >-
      <b>Inherited From</b>
      [AgentDefinition.rai_config](xref:@azure/ai-projects.AgentDefinition.rai_config)
extends: <xref uid="@azure/ai-projects.AgentDefinition" />
