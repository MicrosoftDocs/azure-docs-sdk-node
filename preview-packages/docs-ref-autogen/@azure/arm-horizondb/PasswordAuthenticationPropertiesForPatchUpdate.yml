### YamlMime:TSType
name: PasswordAuthenticationPropertiesForPatchUpdate
uid: '@azure/arm-horizondb.PasswordAuthenticationPropertiesForPatchUpdate'
package: '@azure/arm-horizondb'
summary: >-
  Properties for updating PostgreSQL username-and-password authentication.
  Omitted properties preserve their current values. This API version supports
  enabling or disabling the authentication method, and resetting its password.
  Supported changes can be combined.
fullName: PasswordAuthenticationPropertiesForPatchUpdate
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: administratorLoginPassword
    uid: >-
      @azure/arm-horizondb.PasswordAuthenticationPropertiesForPatchUpdate.administratorLoginPassword
    package: '@azure/arm-horizondb'
    summary: >-
      The PostgreSQL administrator password. Supplying this property resets the
      configured administrator's password. When password authentication is
      currently disabled for a cluster that already has an administrator, this
      property can be combined with state Enabled to re-enable password
      authentication and reset the password.
    fullName: administratorLoginPassword
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'administratorLoginPassword?: string'
      return:
        description: ''
        type: string
  - name: state
    uid: '@azure/arm-horizondb.PasswordAuthenticationPropertiesForPatchUpdate.state'
    package: '@azure/arm-horizondb'
    summary: >-
      The target password-authentication state. Enabled can be combined with
      administratorLoginPassword to re-enable password authentication and reset
      the password for a cluster that already has an administrator. Disabling
      password authentication does not remove or modify existing database users
      or roles. Disabled cannot be combined with administratorLoginPassword.
    fullName: state
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'state?: string'
      return:
        description: ''
        type: string
