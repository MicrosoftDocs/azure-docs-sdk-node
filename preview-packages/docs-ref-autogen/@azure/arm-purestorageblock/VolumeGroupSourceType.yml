name: VolumeGroupSourceType
uid: '@azure/arm-purestorageblock.VolumeGroupSourceType'
package: '@azure/arm-purestorageblock'
summary: >-
  Source type for volume group creation \

  [KnownVolumeGroupSourceType](xref:@azure/arm-purestorageblock.KnownVolumeGroupSourceType)
  can be used interchangeably with VolumeGroupSourceType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **none**: No source; create an empty volume group \

  **volumeGroup**: Clone from an existing volume group \

  **snapshot**: Restore from a volume group snapshot \

  **recoverableVolumeGroup**: Recover a soft-deleted volume group
