name: ControlPlaneAndAgentPoolsUpgradeInsightProperties
uid: '@azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties'
package: '@azure/arm-containerservice'
summary: >-
  Properties for a combined control plane and agent pools Kubernetes version
  upgrade

  insight: a single evaluation of the control plane plus every agent pool for
  one

  target Kubernetes version. This scope is Kubernetes-version-only — node OS
  image

  upgrades are never part of a combined evaluation and must be requested
  separately

  with a `nodeImage-<agentPoolName>-<nodeImageVersion>` insight.
fullName: ControlPlaneAndAgentPoolsUpgradeInsightProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: agentPools
    uid: >-
      @azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties.agentPools
    package: '@azure/arm-containerservice'
    summary: >-
      The readiness evaluation for each agent pool Kubernetes version upgrade,
      one entry per agent pool.
    fullName: agentPools
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agentPools?: AgentPoolScopeEvaluation[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.AgentPoolScopeEvaluation" />[]
  - name: controlPlane
    uid: >-
      @azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties.controlPlane
    package: '@azure/arm-containerservice'
    summary: The readiness evaluation for the control plane Kubernetes version upgrade.
    fullName: controlPlane
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'controlPlane?: ScopeEvaluationResult'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.ScopeEvaluationResult" />
  - name: targetKubernetesVersion
    uid: >-
      @azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties.targetKubernetesVersion
    package: '@azure/arm-containerservice'
    summary: The target Kubernetes version that was evaluated for all scopes.
    fullName: targetKubernetesVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetKubernetesVersion?: string'
      return:
        description: ''
        type: string
  - name: upgradeType
    uid: >-
      @azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties.upgradeType
    package: '@azure/arm-containerservice'
    summary: The type of upgrade this insight evaluates.
    fullName: upgradeType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'upgradeType: "ControlPlaneAndAgentPools"'
      return:
        description: ''
        type: '"ControlPlaneAndAgentPools"'
inheritedProperties:
  - name: expiresAt
    uid: >-
      @azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties.expiresAt
    package: '@azure/arm-containerservice'
    summary: >-
      The UTC time at which this stored upgrade insight expires and is removed
      from the

      data store (currently `lastEvaluatedAt` plus a 14-day retention window).
      After this

      time a GET for the resource returns 404 Not Found and it no longer appears
      in the

      list, indicating the caller should call the compute operation to produce a
      fresh

      evaluation. Exposing the expiry lets clients decide when to recompute
      without

      hardcoding the retention period.
    fullName: expiresAt
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'expiresAt?: Date'
      return:
        description: ''
        type: Date
    inheritanceDescription: >-
      <b>Inherited From</b>
      [UpgradeInsightProperties.expiresAt](xref:@azure/arm-containerservice.UpgradeInsightProperties.expiresAt)
  - name: lastEvaluatedAt
    uid: >-
      @azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties.lastEvaluatedAt
    package: '@azure/arm-containerservice'
    summary: >-
      The UTC time at which this upgrade insight was last computed (the last
      time the

      compute operation ran for this resource). This is the resource-level "last
      run"

      marker and, for a cached record, indicates how stale the stored evaluation
      is. For

      a combined evaluation it is the umbrella run time across all scopes,
      whereas each

      scope's `evaluation.evaluatedAt` records when that specific snapshot was
      produced.
    fullName: lastEvaluatedAt
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastEvaluatedAt?: Date'
      return:
        description: ''
        type: Date
    inheritanceDescription: >-
      <b>Inherited From</b>
      [UpgradeInsightProperties.lastEvaluatedAt](xref:@azure/arm-containerservice.UpgradeInsightProperties.lastEvaluatedAt)
  - name: provisioningState
    uid: >-
      @azure/arm-containerservice.ControlPlaneAndAgentPoolsUpgradeInsightProperties.provisioningState
    package: '@azure/arm-containerservice'
    summary: The provisioning state of the upgrade insight evaluation.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
    inheritanceDescription: >-
      <b>Inherited From</b>
      [UpgradeInsightProperties.provisioningState](xref:@azure/arm-containerservice.UpgradeInsightProperties.provisioningState)
extends: <xref uid="@azure/arm-containerservice.UpgradeInsightProperties" />
