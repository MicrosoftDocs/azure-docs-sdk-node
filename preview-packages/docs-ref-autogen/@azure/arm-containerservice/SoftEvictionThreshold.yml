### YamlMime:TSType
name: SoftEvictionThreshold
uid: '@azure/arm-containerservice.SoftEvictionThreshold'
package: '@azure/arm-containerservice'
summary: >-
  Soft eviction thresholds for kubelet. These thresholds trigger graceful pod
  eviction when node resources drop below the specified values for at least the
  corresponding grace period defined in softEvictionGracePeriod. Supported
  formats are Ki, Mi, Gi, or percentages using %.
fullName: SoftEvictionThreshold
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: memoryAvailable
    uid: '@azure/arm-containerservice.SoftEvictionThreshold.memoryAvailable'
    package: '@azure/arm-containerservice'
    summary: >-
      The threshold for available memory below which soft pod eviction is
      triggered. Accepts absolute values (e.g. '500Mi') or percentage values
      (e.g. '5%'). Absolute minimum is 100Mi; percentage minimum is 2%. Default
      uses a capacity-based step ladder: 500Mi for nodes with <=8GiB, 750Mi for
      16GiB, and 1024Mi (1Gi) for >=32GiB. Must also be greater than the
      effective hardEvictionThreshold.memoryAvailable.
    fullName: memoryAvailable
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'memoryAvailable?: string'
      return:
        description: ''
        type: string
  - name: nodeFsAvailable
    uid: '@azure/arm-containerservice.SoftEvictionThreshold.nodeFsAvailable'
    package: '@azure/arm-containerservice'
    summary: >-
      The threshold for available node filesystem space below which soft pod
      eviction is triggered. Accepts absolute values (e.g. '1Gi') or percentage
      values (e.g. '10%'). Default is '12%'. Must be greater than or equal to
      10% and greater than the effective hardEvictionThreshold.nodeFsAvailable.
    fullName: nodeFsAvailable
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'nodeFsAvailable?: string'
      return:
        description: ''
        type: string
  - name: nodeFsInodesFree
    uid: '@azure/arm-containerservice.SoftEvictionThreshold.nodeFsInodesFree'
    package: '@azure/arm-containerservice'
    summary: >-
      The threshold for available inodes on the node filesystem below which soft
      pod eviction is triggered. Accepts absolute inode counts (e.g. '100000')
      or percentage values (e.g. '5%'). Default is '7%'. Percentage values must
      be greater than or equal to 5% and greater than the effective
      hardEvictionThreshold.nodeFsInodesFree.
    fullName: nodeFsInodesFree
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'nodeFsInodesFree?: string'
      return:
        description: ''
        type: string
