name: InvocationPoint
uid: '@azure/arm-cdn.InvocationPoint'
package: '@azure/arm-cdn'
summary: >-
  Defines at which point in the request processing pipeline the edge action will
  be invoked. \

  [KnownInvocationPoint](xref:@azure/arm-cdn.KnownInvocationPoint) can be used
  interchangeably with InvocationPoint,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ClientRequest** \

  **OriginRequest** \

  **ClientResponse**: Invoked at the client response stage, before the response
  is returned to the client. Currently only supported for edge actions.
fullName: InvocationPoint
remarks: ''
isDeprecated: false
syntax: |
  type InvocationPoint = string
