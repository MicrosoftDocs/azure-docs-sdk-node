### YamlMime:TSTypeAlias
name: SearchBypass
uid: '@azure/provisioning-search.types.SearchBypass'
package: '@azure/provisioning-search'
summary: >-
  Possible origins of inbound traffic that can bypass the rules defined in the
  'ipRules' section.


  Known values:


  - `"None"`: Indicates that no origin can bypass the rules defined in the
  'ipRules' section. This is the default.


  - `"AzureServices"`: Indicates that requests originating from Azure trusted
  services can bypass the rules defined in the 'ipRules' section.
fullName: SearchBypass
remarks: ''
isDeprecated: false
syntax: |
  type SearchBypass = string
