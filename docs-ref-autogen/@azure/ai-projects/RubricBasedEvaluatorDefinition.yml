### YamlMime:TSType
name: RubricBasedEvaluatorDefinition
uid: '@azure/ai-projects.RubricBasedEvaluatorDefinition'
package: '@azure/ai-projects'
summary: >-
  Rubric evaluator definition. Ordinary quality rubrics report one aggregate.
  Safety rubrics require Boolean scoring and an explicit allowed classification
  on every dimension, and report disallowed_behavior_violated and
  allowed_behavior_violated as two independent lower-is-better metrics. Safety
  rubrics have no weights, threshold, or combined safety score.
fullName: RubricBasedEvaluatorDefinition
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: dimensions
    uid: '@azure/ai-projects.RubricBasedEvaluatorDefinition.dimensions'
    package: '@azure/ai-projects'
    summary: >-
      The rubric criteria. Safety dimensions require allowed and omit weight.
      Rating generation includes a service residual; Boolean generation does not
      inject a generic residual. Existing ordinary and legacy definitions retain
      their behavior.
    fullName: dimensions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'dimensions: Dimension[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.Dimension" />[]
  - name: pass_threshold
    uid: '@azure/ai-projects.RubricBasedEvaluatorDefinition.pass_threshold'
    package: '@azure/ai-projects'
    summary: >-
      Optional normalized threshold for Likert scoring, interpreted as 0.5 when
      omitted. Ordinary Boolean scoring requires all applicable checks to pass:
      omit this field or set it to 1; its effective threshold is 1 and other
      values are rejected. Safety rubrics omit this field and report two
      separate metrics without an overall threshold.
    fullName: pass_threshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'pass_threshold?: number'
      return:
        description: ''
        type: number
  - name: scoring
    uid: '@azure/ai-projects.RubricBasedEvaluatorDefinition.scoring'
    package: '@azure/ai-projects'
    summary: >-
      Simple scoring choices. Omission preserves existing legacy scoring for
      existing clients. No policy version is required from the caller.
    fullName: scoring
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scoring?: RubricScoring'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.RubricScoring" />
  - name: type
    uid: '@azure/ai-projects.RubricBasedEvaluatorDefinition.type'
    package: '@azure/ai-projects'
    summary: >-
      The evaluator definition type. Always `rubric` for an evaluator that
      scores against rubric

      dimensions.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "rubric"'
      return:
        description: ''
        type: '"rubric"'
