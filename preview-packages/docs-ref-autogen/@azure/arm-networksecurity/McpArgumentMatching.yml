### YamlMime:TSType
name: McpArgumentMatching
uid: '@azure/arm-networksecurity.McpArgumentMatching'
package: '@azure/arm-networksecurity'
summary: >-
  Compares the argument values of an MCP request with a list of values. Only
  string values

  are compared, and a boolean compares as true or false. Without a path, object
  keys are

  compared too.
fullName: McpArgumentMatching
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: matchCase
    uid: '@azure/arm-networksecurity.McpArgumentMatching.matchCase'
    package: '@azure/arm-networksecurity'
    summary: Whether the comparison is case-sensitive. The default is CaseSensitive.
    fullName: matchCase
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'matchCase?: string'
      return:
        description: ''
        type: string
  - name: matchType
    uid: '@azure/arm-networksecurity.McpArgumentMatching.matchType'
    package: '@azure/arm-networksecurity'
    summary: How the string is compared with the values.
    fullName: matchType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'matchType: string'
      return:
        description: ''
        type: string
  - name: path
    uid: '@azure/arm-networksecurity.McpArgumentMatching.path'
    package: '@azure/arm-networksecurity'
    summary: >-
      A JSONPath into the request's params.arguments object, which is `$`: 1 to
      8 segments,

      the first `.name` and the others `.name` or `[*]` (at most once), for
      example

      `$.repoName` or `$.paths[*]`. With a path, a missing key (also in an array
      element), a key

      that differs only in case, or a value of the wrong type on the way is a
      mismatch: an Allow

      condition holds only when there is none and every selected value passes,
      and a Deny

      condition also holds when there is one, when the path selects nothing, or
      when a selected

      value is not a string or boolean. Without a path every string or boolean
      argument value and

      every object key is compared; this is allowed only for ExactMatch or
      Contains in a Deny

      rule and for NotExactMatch or NotContains in an Allow rule.
    fullName: path
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'path?: string'
      return:
        description: ''
        type: string
  - name: values
    uid: '@azure/arm-networksecurity.McpArgumentMatching.values'
    package: '@azure/arm-networksecurity'
    summary: >-
      The values to compare with: 1 to 64, or 1 to 16 non-empty values for
      Contains and NotContains.
    fullName: values
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'values: string[]'
      return:
        description: ''
        type: string[]
