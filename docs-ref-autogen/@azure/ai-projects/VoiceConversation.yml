### YamlMime:TSType
name: VoiceConversation
uid: '@azure/ai-projects.VoiceConversation'
package: '@azure/ai-projects'
summary: >-
  A persisted voice conversation. The Foundry envelope that owns a voice agent's
  stored

  transcript, responses, per-turn metrics, and audio. It is the parent,
  retention, and delete boundary:

  deleting it cascades to its responses, items, metrics, and audio. When
  finalization fails, any partial persisted

  responses, items, and item audio remain readable.
fullName: VoiceConversation
remarks: ''
isDeprecated: false
type: interface
