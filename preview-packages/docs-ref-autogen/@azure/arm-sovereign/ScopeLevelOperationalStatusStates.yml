name: ScopeLevelOperationalStatusStates
uid: '@azure/arm-sovereign.ScopeLevelOperationalStatusStates'
package: '@azure/arm-sovereign'
summary: >-
  The operational status states for an individual scope within a sovereign view.
  \

  [KnownScopeLevelOperationalStatusStates](xref:@azure/arm-sovereign.KnownScopeLevelOperationalStatusStates)
  can be used interchangeably with ScopeLevelOperationalStatusStates,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unhealthy**: The scope is unhealthy and its operability is impacted. \

  **Unknown**: The operational status of the scope could not be determined. \

  **Deleted**: The scope has been deleted.
fullName: ScopeLevelOperationalStatusStates
