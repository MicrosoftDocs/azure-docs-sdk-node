        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: repairEnabled
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.repairEnabled
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      Should automatic repairs run on this cluster? If omitted, this is true,
