### YamlMime:TSType
name: AgentPoolScopeEvaluation
uid: '@azure/arm-containerservice.AgentPoolScopeEvaluation'
package: '@azure/arm-containerservice'
summary: The readiness evaluation for a single agent pool within a combined evaluation.
fullName: AgentPoolScopeEvaluation
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: agentPoolName
    uid: '@azure/arm-containerservice.AgentPoolScopeEvaluation.agentPoolName'
    package: '@azure/arm-containerservice'
    summary: The name of the agent pool this evaluation applies to.
    fullName: agentPoolName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agentPoolName?: string'
      return:
        description: ''
        type: string
  - name: context
    uid: '@azure/arm-containerservice.AgentPoolScopeEvaluation.context'
    package: '@azure/arm-containerservice'
    summary: >-
      Contextual information about how this upgrade is managed, such as the
      upgrade strategy, next maintenance window, and last successful upgrade
      time.
    fullName: context
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'context?: UpgradeContext'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.UpgradeContext" />
  - name: currentKubernetesVersion
    uid: >-
      @azure/arm-containerservice.AgentPoolScopeEvaluation.currentKubernetesVersion
    package: '@azure/arm-containerservice'
    summary: >-
      The Kubernetes version the scope was evaluated from (the upgrade source
      version the scope is currently running). Lets consumers read the result as
      "from X to targetKubernetesVersion" and detect a stale cached record by
      comparing against the live cluster version. Populated for Kubernetes
      version upgrades.
    fullName: currentKubernetesVersion
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'currentKubernetesVersion?: string'
      return:
        description: ''
        type: string
  - name: evaluation
    uid: '@azure/arm-containerservice.AgentPoolScopeEvaluation.evaluation'
    package: '@azure/arm-containerservice'
    summary: >-
      The evaluation result, including overall status, evaluation time, and any
      detected issues.
    fullName: evaluation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluation?: UpgradeInsightEvaluation'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.UpgradeInsightEvaluation" />
  - name: kubernetesVersionEndOfSupportDate
    uid: >-
      @azure/arm-containerservice.AgentPoolScopeEvaluation.kubernetesVersionEndOfSupportDate
    package: '@azure/arm-containerservice'
    summary: >-
      The date on which support ends for the Kubernetes version the scope is
      currently

      running (its end-of-support date). Returned as an absolute date so clients
      can apply

      their own "approaching end of support" threshold and compute the remaining
      days against

      the current time; a precomputed remaining-days value is intentionally not
      returned so

      that cached results do not go stale. Populated for Kubernetes version
      upgrades.
    fullName: kubernetesVersionEndOfSupportDate
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'kubernetesVersionEndOfSupportDate?: Date'
      return:
        description: ''
        type: Date
  - name: kubernetesVersionSupportStatus
    uid: >-
      @azure/arm-containerservice.AgentPoolScopeEvaluation.kubernetesVersionSupportStatus
    package: '@azure/arm-containerservice'
    summary: >-
      The support status of the Kubernetes version the scope is currently
      running (not the target version). Populated for Kubernetes version
      upgrades.
    fullName: kubernetesVersionSupportStatus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'kubernetesVersionSupportStatus?: string'
      return:
        description: ''
        type: string
