name: SvmPeerStatus
uid: '@azure/arm-netapp.SvmPeerStatus'
package: '@azure/arm-netapp'
summary: >-
  SVM Peer status enum \

  [KnownSvmPeerStatus](xref:@azure/arm-netapp.KnownSvmPeerStatus) can be used
  interchangeably with SvmPeerStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Active**: Active peering \

  **Error**: Error state, use command on your cluster for more details(command:
  vserver peer show) \

  **Pending**: Pending state, the peering needs to be accepted on your SVM
  (command: vserver peer accept)
