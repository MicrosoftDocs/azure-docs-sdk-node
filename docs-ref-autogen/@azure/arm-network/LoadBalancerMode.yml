name: LoadBalancerMode
uid: '@azure/arm-network.LoadBalancerMode'
package: '@azure/arm-network'
summary: >-
  The load balancer mode. Set to `Advanced` to enable additional capabilities on
  a Standard SKU load balancer. Advanced mode must be specified at creation and
  cannot be changed afterward. \

  [KnownLoadBalancerMode](xref:@azure/arm-network.KnownLoadBalancerMode) can be
  used interchangeably with LoadBalancerMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Advanced**: Advanced mode, which enables additional capabilities on a
  Standard SKU load balancer.
fullName: LoadBalancerMode
remarks: ''
isDeprecated: false
syntax: |
  type LoadBalancerMode = string
