name: SliTypeMatchState
uid: '@azure/arm-resiliencemanagement.SliTypeMatchState'
package: '@azure/arm-resiliencemanagement'
summary: >-
  Whether the user-declared SLI type matches the SLI's actual category. \

  [KnownSliTypeMatchState](xref:@azure/arm-resiliencemanagement.KnownSliTypeMatchState)
  can be used interchangeably with SliTypeMatchState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Matched**: Declared type matches the SLI's actual category. \

  **Mismatched**: Declared type does not match the SLI's actual category.
