  - name: listFeatureFlags(ListFeatureFlagsOptions)
    uid: '@azure/app-configuration.FeatureFlagClient.listFeatureFlags'
    package: '@azure/app-configuration'
    summary: >-
      List feature flags through the dedicated feature flag endpoint.


      Example usage:

      ```ts snippet:ListFeatureFlags

      import { DefaultAzureCredential } from "@azure/identity";

      import { FeatureFlagClient } from "@azure/app-configuration";


      const endpoint = "https://example.azconfig.io";

      const credential = new DefaultAzureCredential();

      const client = new FeatureFlagClient(endpoint, credential);


      for await (const featureFlag of client.listFeatureFlags()) {
        console.log(`Feature flag: ${featureFlag.name}`);
      }

      ```


      To conditionally retrieve pages, pass a `pageEtags` array (one etag per
      page). Each etag is sent

      as an `If-None-Match` header, and unchanged pages are returned as empty
      pages with their `etag`

      preserved, mirroring `AppConfigurationClient.listConfigurationSettings`.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function listFeatureFlags(options?: ListFeatureFlagsOptions):
        PagedAsyncIterableIterator<FeatureFlag, ListFeatureFlagPage,
        PageSettings>
      parameters:
        - id: options
          type: <xref uid="@azure/app-configuration.ListFeatureFlagsOptions" />
          description: Optional parameters for the request.
      return:
        description: ''
        type: >-
          <xref uid="@azure/core-paging.PagedAsyncIterableIterator" />&lt;<xref
          uid="@azure/app-configuration.FeatureFlag" />, <xref
          uid="@azure/app-configuration.ListFeatureFlagPage" />, <xref
          uid="@azure/app-configuration.PageSettings" />&gt;
