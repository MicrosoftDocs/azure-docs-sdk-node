name: McpStringMatching
uid: '@azure/arm-networksecurity.McpStringMatching'
package: '@azure/arm-networksecurity'
summary: >-
  Compares one string of an MCP request or response with a list of values.
  ExactMatch and

  Contains hold when one value matches; NotExactMatch and NotContains hold when
  no value matches.
