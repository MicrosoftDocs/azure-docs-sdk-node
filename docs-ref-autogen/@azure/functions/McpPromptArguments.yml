### YamlMime:TSTypeAlias
name: McpPromptArguments
uid: '@azure/functions.McpPromptArguments'
package: '@azure/functions'
summary: >-
  Accepted shapes for declaring prompt arguments.


  - **Array form** (explicit): an array of
  [McpPromptArgument](xref:@azure/functions.McpPromptArgument) objects with
  `name`, optional `description` and `required`.

  - **Record/fluent form**: an object whose keys are argument names and values
  are [McpPromptArgumentBuilder](xref:@azure/functions.McpPromptArgumentBuilder)
  instances built from `promptArg.describe(...)`.
fullName: McpPromptArguments
remarks: ''
isDeprecated: false
syntax: |
  type McpPromptArguments =
    | McpPromptArgument[]
    | Record<string, McpPromptArgumentBuilder>
