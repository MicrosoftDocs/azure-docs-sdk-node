### YamlMime:TSType
name: VoiceResponseBase
uid: '@azure/ai-projects.VoiceResponseBase'
package: '@azure/ai-projects'
summary: Properties shared by persisted voice responses.
fullName: VoiceResponseBase
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: max_output_tokens
    uid: '@azure/ai-projects.VoiceResponseBase.max_output_tokens'
    package: '@azure/ai-projects'
    summary: |-
      Maximum number of output tokens for a single assistant response,
        inclusive of tool calls, that was used in this response.
    fullName: max_output_tokens
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_output_tokens?: number | "inf"'
      return:
        description: ''
        type: number | "inf"
  - name: object
    uid: '@azure/ai-projects.VoiceResponseBase.object'
    package: '@azure/ai-projects'
    summary: The object type, must be `realtime.response`.
    fullName: object
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'object?: "realtime.response"'
      return:
        description: ''
        type: '"<xref uid="realtime.response" />"'
  - name: output_modalities
    uid: '@azure/ai-projects.VoiceResponseBase.output_modalities'
    package: '@azure/ai-projects'
    summary: >-
      The set of modalities the model used to respond, currently the only
      possible values are
        `[\"audio\"]`, `[\"text\"]`. Audio output always include a text transcript. Setting the
        output to mode `text` will disable audio output from the model.
    fullName: output_modalities
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'output_modalities?: ("text" | "audio")[]'
      return:
        description: ''
        type: ("text" | "audio")[]
  - name: status
    uid: '@azure/ai-projects.VoiceResponseBase.status'
    package: '@azure/ai-projects'
    summary: |-
      The final status of the response (`completed`, `cancelled`, `failed`, or
        `incomplete`, `in_progress`).
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        status?: "failed" | "in_progress" | "cancelled" | "completed" |
        "incomplete"
      return:
        description: ''
        type: '"failed" | "in_progress" | "cancelled" | "completed" | "incomplete"'
  - name: status_details
    uid: '@azure/ai-projects.VoiceResponseBase.status_details'
    package: '@azure/ai-projects'
    summary: Additional details about the status.
    fullName: status_details
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status_details?: RealtimeResponseStatusDetails'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.RealtimeResponseStatusDetails" />
  - name: usage
    uid: '@azure/ai-projects.VoiceResponseBase.usage'
    package: '@azure/ai-projects'
    summary: |-
      Usage statistics for the Response, this will correspond to billing. A
        Realtime API session will maintain a conversation context and append new
        Items to the Conversation, thus output from previous turns (text and
        audio tokens) will become the input for later turns.
    fullName: usage
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'usage?: RealtimeResponseUsage'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.RealtimeResponseUsage" />
