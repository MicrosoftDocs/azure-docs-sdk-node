### YamlMime:TSTypeAlias
name: DiskState
uid: '@azure/arm-azurestackhci.DiskState'
package: '@azure/arm-azurestackhci'
summary: >-
  State of the disk. \

  [KnownDiskState](xref:@azure/arm-azurestackhci.KnownDiskState) can be used
  interchangeably with DiskState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Online**: Disk is online and available. \

  **Offline**: Disk is offline. \

  **Failed**: Disk has failed. \

  **Missing**: Disk is missing. \

  **Unknown**: Disk state is unknown.
fullName: DiskState
remarks: ''
isDeprecated: false
syntax: |
  type DiskState = string
