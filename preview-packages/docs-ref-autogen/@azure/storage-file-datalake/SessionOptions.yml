### YamlMime:TSType
name: SessionOptions
uid: '@azure/storage-file-datalake.SessionOptions'
package: '@azure/storage-file-datalake'
summary: >-
  ONLY AVAILABLE IN NODE.JS RUNTIME.


  Options for configuring session token authentication for blob operations.


  Session authentication currently applies only to blob download requests made
  with a

  `TokenCredential`. These options are exported from the browser and React
  Native entry points

  for type compatibility, but they have no effect there: signing a session
  requires Shared Key,

  which is unavailable outside Node.js, so those builds always use a bearer
  token.
fullName: SessionOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: accountName
    uid: '@azure/storage-file-datalake.SessionOptions.accountName'
    package: '@azure/storage-file-datalake'
    summary: >-
      The account name used to sign requests within a session. Optional; by
      default the account

      name is derived from the request URL. Set this explicitly when using a
      custom endpoint URL

      from which the account name cannot be derived.
    fullName: accountName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'accountName?: string'
      return:
        description: ''
        type: string
  - name: mode
    uid: '@azure/storage-file-datalake.SessionOptions.mode'
    package: '@azure/storage-file-datalake'
    summary: >-
      The session authentication mode. Defaults to `auto`, whose behavior is
      determined by the

      client library and may change in future releases.
    fullName: mode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'mode?: SessionMode'
      return:
        description: ''
        type: <xref uid="@azure/storage-file-datalake.SessionMode" />
