name: ManagedInstanceAdministratorPrincipalType
uid: '@azure/arm-sql.ManagedInstanceAdministratorPrincipalType'
package: '@azure/arm-sql'
summary: >-
  Principal type of the managed instance administrator. \

  [KnownManagedInstanceAdministratorPrincipalType](xref:@azure/arm-sql.KnownManagedInstanceAdministratorPrincipalType)
  can be used interchangeably with ManagedInstanceAdministratorPrincipalType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **User**: Indicates that the principal is a user. \

  **Group**: Indicates that the principal is a group. \

  **Application**: Indicates that the principal is an application.
