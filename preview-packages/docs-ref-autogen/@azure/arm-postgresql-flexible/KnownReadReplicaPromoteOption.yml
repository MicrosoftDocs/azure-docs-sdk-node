### YamlMime:TSEnum
name: KnownReadReplicaPromoteOption
uid: '@azure/arm-postgresql-flexible.KnownReadReplicaPromoteOption'
package: '@azure/arm-postgresql-flexible'
summary: >-
  Data synchronization option to use when processing the operation specified in
  the promoteMode property. This property is write only.
fullName: KnownReadReplicaPromoteOption
remarks: ''
isDeprecated: false
fields:
  - name: Forced
    uid: '@azure/arm-postgresql-flexible.KnownReadReplicaPromoteOption.Forced'
    package: '@azure/arm-postgresql-flexible'
    summary: >-
      Initiate the operation immediately, without waiting for data in the read
      replica to be synchronized with its source server.
  - name: Planned
    uid: '@azure/arm-postgresql-flexible.KnownReadReplicaPromoteOption.Planned'
    package: '@azure/arm-postgresql-flexible'
    summary: >-
      Wait for data in the read replica to be fully synchronized with its source
      server before it initiates the operation.
