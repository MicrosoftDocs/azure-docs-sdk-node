    remarks: ''
    isDeprecated: false
    syntax:
      content: 'azureConnectionMethod?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: backupSchedules
    uid: >-
      @azure/provisioning-cosmosdb.types.ClusterResourcePropertiesView.backupSchedules
    package: '@azure/provisioning-cosmosdb'
