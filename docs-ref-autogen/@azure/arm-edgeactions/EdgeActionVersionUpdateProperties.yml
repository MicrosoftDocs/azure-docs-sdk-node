  - name: deploymentType
    uid: '@azure/arm-edgeactions.EdgeActionVersionUpdateProperties.deploymentType'
    package: '@azure/arm-edgeactions'
    summary: >-
      The deployment type for the Edge Action version. Set this value when
      creating the version. When updating an existing version, any supplied
      value must match the existing value.
    fullName: deploymentType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'deploymentType?: string'
      return:
