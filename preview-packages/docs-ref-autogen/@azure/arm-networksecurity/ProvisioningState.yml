### YamlMime:TSTypeAlias
name: ProvisioningState
uid: '@azure/arm-networksecurity.ProvisioningState'
package: '@azure/arm-networksecurity'
summary: >-
  Provisioning state of the resource \

  [KnownProvisioningState](xref:@azure/arm-networksecurity.KnownProvisioningState)
  can be used interchangeably with ProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: Resource provisioning succeeded \

  **Failed**: Resource provisioning failed \

  **Canceled**: Resource provisioning was canceled \

  **Provisioning**: The resource create request has been accepted; provisioning
  is in progress. \

  **Creating**: The resource is being created. \

  **Updating**: The resource update request has been accepted; the update is in
  progress. \

  **Deleting**: The resource delete request has been accepted; deletion is in
  progress. \

  **Accepted**: The long-running operation has been accepted and is not yet
  complete.
fullName: ProvisioningState
remarks: ''
isDeprecated: false
syntax: |
  type ProvisioningState = string
