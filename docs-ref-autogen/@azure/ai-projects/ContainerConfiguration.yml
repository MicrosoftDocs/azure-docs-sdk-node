  - name: registry_connection_id
    uid: '@azure/ai-projects.ContainerConfiguration.registry_connection_id'
    package: '@azure/ai-projects'
    summary: >-
      The id (or name) of the Foundry project connection that provides the
      credentials used to

      authenticate to the private container registry hosting `image`. The
      connection abstracts the

      auth mechanism — for example a managed-identity-federated token exchange,
      or a username/token

      secret — so registry credentials are never part of the agent definition.
      Omit for public images

      or registries already reachable by the platform's default identity (for
      example, Azure Container Registry).
    fullName: registry_connection_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'registry_connection_id?: string'
      return:
        description: ''
        type: string
