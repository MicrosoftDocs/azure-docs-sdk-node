name: FailoverState
uid: '@azure/arm-durabletask.FailoverState'
package: '@azure/arm-durabletask'
summary: >-
  The current state of the failover operation \

  [KnownFailoverState](xref:@azure/arm-durabletask.KnownFailoverState) can be
  used interchangeably with FailoverState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: No failover operation is active \

  **InProgress**: The failover operation is in progress \

  **Succeeded**: The failover operation completed successfully \

  **Failed**: The failover operation failed
fullName: FailoverState
