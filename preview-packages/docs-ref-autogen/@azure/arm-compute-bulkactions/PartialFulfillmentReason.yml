### YamlMime:TSTypeAlias
name: PartialFulfillmentReason
uid: '@azure/arm-compute-bulkactions.PartialFulfillmentReason'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The reason the requested capacity could only be partially fulfilled. \

  [KnownPartialFulfillmentReason](xref:@azure/arm-compute-bulkactions.KnownPartialFulfillmentReason)
  can be used interchangeably with PartialFulfillmentReason,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **InsufficientCapacity**: The requested capacity could not be fully satisfied
  due to insufficient capacity in the region. \

  **InsufficientQuota**: The requested capacity could not be fully satisfied due
  to insufficient quota in the subscription. \

  **None**: The requested capacity was successfully satisfied without any
  partial fulfillment.
fullName: PartialFulfillmentReason
remarks: ''
isDeprecated: false
syntax: |
  type PartialFulfillmentReason = string
