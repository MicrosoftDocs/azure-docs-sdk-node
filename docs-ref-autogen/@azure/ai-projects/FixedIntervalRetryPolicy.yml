name: FixedIntervalRetryPolicy
uid: '@azure/ai-projects.FixedIntervalRetryPolicy'
package: '@azure/ai-projects'
summary: >-
  Shared direct-call/Campaign retry policy. Omission means one attempt; CallJobs
  return max_attempts=1 and interval=0 seconds.
fullName: FixedIntervalRetryPolicy
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: interval
    uid: '@azure/ai-projects.FixedIntervalRetryPolicy.interval'
    package: '@azure/ai-projects'
    summary: >-
      The nonnegative delay between attempts, from 0 to 2147483647 seconds. Zero
      permits an immediate retry, subject to scheduling and capacity.
    fullName: interval
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'interval: number'
      return:
        description: ''
        type: number
