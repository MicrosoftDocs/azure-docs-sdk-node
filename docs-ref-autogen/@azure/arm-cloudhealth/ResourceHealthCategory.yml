name: ResourceHealthCategory
uid: '@azure/arm-cloudhealth.ResourceHealthCategory'
package: '@azure/arm-cloudhealth'
summary: >-
  Whether an Azure Resource Health status changing event was planned or
  unplanned. \

  [KnownResourceHealthCategory](xref:@azure/arm-cloudhealth.KnownResourceHealthCategory)
  can be used interchangeably with ResourceHealthCategory,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Planned**: The event was planned. \

  **Unplanned**: The event was unplanned.
