### YamlMime:TSType
name: ToLlmInputOptions
uid: '@azure/ai-content-understanding.ToLlmInputOptions'
package: '@azure/ai-content-understanding'
summary: Options for [toLlmInput](xref:@azure/ai-content-understanding.toLlmInput).
fullName: ToLlmInputOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: customMetadata
    uid: '@azure/ai-content-understanding.ToLlmInputOptions.customMetadata'
    package: '@azure/ai-content-understanding'
    summary: |-
      Optional caller-supplied key/value pairs emitted under a nested
      `customMetadata:` YAML front-matter block. Common keys include `source`
      (filename), `documentId`, or `department`. Kept separate from service
      `AnalysisContent.metadata` (rendered under top-level `metadata:`) so
      caller keys never collide with helper-owned keys (`mimeType`,
      `fields`, `metadata`, ...).
    fullName: customMetadata
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'customMetadata?: Record<string, unknown>'
      return:
        description: ''
        type: Record&lt;string, unknown&gt;
  - name: includeFields
    uid: '@azure/ai-content-understanding.ToLlmInputOptions.includeFields'
    package: '@azure/ai-content-understanding'
    summary: |-
      Whether to include structured fields in the output. Defaults to `true`.
      Set to `false` for markdown-only output (smaller token footprint, no
      structured data).
    fullName: includeFields
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeFields?: boolean'
      return:
        description: ''
        type: boolean
  - name: includeMarkdown
    uid: '@azure/ai-content-understanding.ToLlmInputOptions.includeMarkdown'
    package: '@azure/ai-content-understanding'
    summary: |-
      Whether to include markdown content in the output. Defaults to `true`.
      Set to `false` for fields-only output.
    fullName: includeMarkdown
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeMarkdown?: boolean'
      return:
        description: ''
        type: boolean
