### YamlMime:TSTypeAlias
name: CostControlPeriod
uid: '@azure/arm-cognitiveservices.CostControlPeriod'
package: '@azure/arm-cognitiveservices'
summary: >-
  Calendar-aligned UTC renewal periods, including legacy values retained for
  read compatibility. \

  [KnownCostControlPeriod](xref:@azure/arm-cognitiveservices.KnownCostControlPeriod)
  can be used interchangeably with CostControlPeriod,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Minute**: Legacy read-only period renewing at the start of the next UTC
  minute. \

  **Hour**: Legacy read-only period renewing at the start of the next UTC hour.
  \

  **Day**: Renews daily at 00:00 UTC. \

  **Week**: Renews Monday at 00:00 UTC. \

  **Month**: Renews on the first day of each month at 00:00 UTC. \

  **Year**: Legacy read-only period renewing January 1 at 00:00 UTC.
fullName: CostControlPeriod
remarks: ''
isDeprecated: false
syntax: |
  type CostControlPeriod = string
