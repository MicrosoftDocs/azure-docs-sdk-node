### YamlMime:TSTypeAlias
name: GraphQueryDiagnosticSeverity
uid: '@azure/search-documents.GraphQueryDiagnosticSeverity'
package: '@azure/search-documents'
summary: >-
  The importance of a graph query diagnostic. \

  [KnownGraphQueryDiagnosticSeverity](xref:@azure/search-documents.KnownGraphQueryDiagnosticSeverity)
  can be used interchangeably with GraphQueryDiagnosticSeverity,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **error**: The query was rejected or could not be evaluated successfully. \

  **warning**: Execution returned a result with a caveat, such as an execution
  or provenance limit. \

  **info**: Informational diagnostics, such as an optional execution summary.
fullName: GraphQueryDiagnosticSeverity
remarks: ''
isDeprecated: false
syntax: |
  type GraphQueryDiagnosticSeverity = string
