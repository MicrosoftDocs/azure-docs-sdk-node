    syntax:
      content: 'delegation_id: string | null'
      return:
        description: ''
        type: string | null
  - name: event
    uid: '@azure/ai-projects.LiveServerEventLiveDecisionEvent.event'
    package: '@azure/ai-projects'
    summary: The completed Decision evaluation, including its response and token usage.
    fullName: event
    remarks: ''
