name: McpRuleDestinationMatching
uid: '@azure/arm-networksecurity.McpRuleDestinationMatching'
package: '@azure/arm-networksecurity'
summary: >-
  The MCP servers and requests an MCP rule matches. Present properties are
  ANDed. A rule has

  at most one of toolMatching and promptMatching. Without either, it matches
  every request to

  its servers.
fullName: McpRuleDestinationMatching
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: promptMatching
    uid: '@azure/arm-networksecurity.McpRuleDestinationMatching.promptMatching'
