    summary: Conditions on prompt requests.
    fullName: promptMatching
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'promptMatching?: McpPromptMatching'
      return:
        description: ''
        type: <xref uid="@azure/arm-networksecurity.McpPromptMatching" />
  - name: protocolVersions
    uid: '@azure/arm-networksecurity.McpRuleDestinationMatching.protocolVersions'
    package: '@azure/arm-networksecurity'
    summary: >-
      Compared with params.protocolVersion of an initialize request, the
      protocol version such as

      2025-06-18 that a client names when it starts a session. A request that
      names no protocol

      version does not match the rule, so a Deny rule blocks sessions that start
      with a listed version.
    fullName: protocolVersions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'protocolVersions?: McpStringMatching'
      return:
        description: ''
        type: <xref uid="@azure/arm-networksecurity.McpStringMatching" />
  - name: serverFqdns
    uid: '@azure/arm-networksecurity.McpRuleDestinationMatching.serverFqdns'
    package: '@azure/arm-networksecurity'
    summary: >-
      The MCP servers: exact names or one leading `*.`, each inside the policy
      destination.

      Omitted means every server of the policy destination.
    fullName: serverFqdns
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'serverFqdns?: string[]'
      return:
        description: ''
        type: string[]
