name: AggregationUnit
uid: '@azure/arm-cloudhealth.AggregationUnit'
package: '@azure/arm-cloudhealth'
summary: >-
  Unit type for the thresholds used by threshold-bearing aggregation strategies.
  \

  [KnownAggregationUnit](xref:@azure/arm-cloudhealth.KnownAggregationUnit) can
  be used interchangeably with AggregationUnit,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Absolute**: Threshold is an absolute count of members. \

  **Percentage**: Threshold is a percentage of members (0-100).
fullName: AggregationUnit
remarks: ''
isDeprecated: false
syntax: |
  type AggregationUnit = string
