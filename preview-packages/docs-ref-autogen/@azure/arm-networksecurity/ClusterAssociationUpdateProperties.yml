properties:
  - name: clusterResourceId
    uid: >-
      @azure/arm-networksecurity.ClusterAssociationUpdateProperties.clusterResourceId
    package: '@azure/arm-networksecurity'
    summary: |-
      The existing AKS managed cluster or ACI SandboxGroup. This value is
      required so Azure Resource Manager can perform linked authorization and
      must match the immutable clusterResourceId already stored on the
      association.
    fullName: clusterResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clusterResourceId?: string'
      return:
        description: ''
        type: string
  - name: sku
    uid: '@azure/arm-networksecurity.ClusterAssociationUpdateProperties.sku'
    package: '@azure/arm-networksecurity'
    summary: |-
      Determines which AgentFabric components are deployed to the cluster.
      Only an upgrade from Standard to Premium is supported; Premium cannot be
      downgraded to Standard. When omitted, the PATCH request is an authorized
      no-op and the existing SKU remains unchanged.
    fullName: sku
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sku?: string'
      return:
        description: ''
        type: string
  - name: workloadClusterGatewayIp
    uid: >-
      @azure/arm-networksecurity.ClusterAssociationUpdateProperties.workloadClusterGatewayIp
    package: '@azure/arm-networksecurity'
    summary: |-
      The IPv4 or IPv6 address of the workload cluster gateway used for
      internal Agent Fabric routing. The resource provider validates the value.
    fullName: workloadClusterGatewayIp
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'workloadClusterGatewayIp?: string'
      return:
        description: ''
        type: string
