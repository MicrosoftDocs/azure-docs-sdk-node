  - name: defaultDomain
    uid: '@azure/arm-appcontainers.SandboxGroupProperties.defaultDomain'
    package: '@azure/arm-appcontainers'
    summary: >-
      The default domain of the linked Azure Container Apps environment. Sandbox
      endpoints use subdomains of this domain. This read-only property is
      populated by the service and is omitted when no environment is linked.
    fullName: defaultDomain
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'defaultDomain?: string'
      return:
        description: ''
        type: string
  - name: environmentId
    uid: '@azure/arm-appcontainers.SandboxGroupProperties.environmentId'
    package: '@azure/arm-appcontainers'
    summary: >-
      The resource ID of the Azure Container Apps environment to link to the
      sandbox group. A sandbox group can be linked after creation, but the link
      cannot then be changed or removed. For subsequent create-or-update (PUT)
      requests, specify the same environment ID; omitting or changing it returns
      409 Conflict. Omitting it from an update (PATCH) request leaves the
      existing link unchanged.
    fullName: environmentId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'environmentId?: string'
      return:
        description: ''
        type: string
