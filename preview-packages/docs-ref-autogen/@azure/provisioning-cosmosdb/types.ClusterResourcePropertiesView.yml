    remarks: ''
    isDeprecated: false
    syntax:
      content: 'restoreFromBackupId?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
