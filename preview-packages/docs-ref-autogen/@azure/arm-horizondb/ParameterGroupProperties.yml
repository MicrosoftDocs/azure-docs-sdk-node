  - name: postgreSqlVersion
    uid: '@azure/arm-horizondb.ParameterGroupProperties.postgreSqlVersion'
    package: '@azure/arm-horizondb'
    summary: >-
      The PostgreSQL major version for the parameter group. This property is
      required during creation and is immutable thereafter. The service selects
      the unique location-scoped default parameter group for this version in the
      resource location. The DefaultParameterGroups APIs return at most one
      default parameter group for each PostgreSQL version in a location, so this
      selection is unambiguous.
