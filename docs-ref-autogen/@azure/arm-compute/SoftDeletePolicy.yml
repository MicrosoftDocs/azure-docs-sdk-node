### YamlMime:TSType
name: SoftDeletePolicy
uid: '@azure/arm-compute.SoftDeletePolicy'
package: '@azure/arm-compute'
summary: Contains information about the soft deletion policy of the gallery.
fullName: SoftDeletePolicy
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: gracePeriodInDays
    uid: '@azure/arm-compute.SoftDeletePolicy.gracePeriodInDays'
    package: '@azure/arm-compute'
    summary: >-
      The grace period in days for a simulated hard-deleted resource. During
      this period the gallery image version is unusable but can still be
      recovered if required. After this period elapses, the gallery image
      version is permanently (hard) deleted.
    fullName: gracePeriodInDays
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'gracePeriodInDays?: number'
      return:
        description: ''
        type: number
  - name: isSoftDeleteEnabled
    uid: '@azure/arm-compute.SoftDeletePolicy.isSoftDeleteEnabled'
    package: '@azure/arm-compute'
    summary: >-
      Enables soft-deletion for resources in this gallery, allowing them to be
      recovered within retention time.
    fullName: isSoftDeleteEnabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'isSoftDeleteEnabled?: boolean'
      return:
        description: ''
        type: boolean
  - name: retentionPeriodInDays
    uid: '@azure/arm-compute.SoftDeletePolicy.retentionPeriodInDays'
    package: '@azure/arm-compute'
    summary: >-
      The retention period in days for a soft-deleted resource. After this
      period elapses, the soft-deleted gallery image version transitions to a
      simulated hard-deleted state.
    fullName: retentionPeriodInDays
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'retentionPeriodInDays?: number'
      return:
        description: ''
        type: number
