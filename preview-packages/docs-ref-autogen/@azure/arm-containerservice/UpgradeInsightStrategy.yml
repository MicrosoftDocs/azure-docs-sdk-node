name: UpgradeInsightStrategy
uid: '@azure/arm-containerservice.UpgradeInsightStrategy'
package: '@azure/arm-containerservice'
summary: >-
  The strategy currently used to perform an upgrade (manual or automatic). \

  [KnownUpgradeInsightStrategy](xref:@azure/arm-containerservice.KnownUpgradeInsightStrategy)
  can be used interchangeably with UpgradeInsightStrategy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Manual**: Upgrades are initiated manually by the customer. \

  **Auto**: Upgrades are performed automatically by AKS auto-upgrade.
