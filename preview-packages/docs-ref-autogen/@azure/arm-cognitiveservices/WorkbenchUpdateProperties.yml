### YamlMime:TSType
name: WorkbenchUpdateProperties
uid: '@azure/arm-cognitiveservices.WorkbenchUpdateProperties'
package: '@azure/arm-cognitiveservices'
summary: Mutable properties for a Workbench resource.
fullName: WorkbenchUpdateProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: gpuCount
    uid: '@azure/arm-cognitiveservices.WorkbenchUpdateProperties.gpuCount'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      GPU count for GPU pools or vCPU count for CPU pools. Must be 1, 2, 4, 8,
      or a positive multiple of 8. Omit to preserve the current value; null
      clears the override to use the full node or the instance type's default
      count. Full-node Azure VM sizes permit partition selection. A supplied
      count must match an exact Singularity instance type; the Singularity.D4_v3
      fallback accepts 4.
    fullName: gpuCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'gpuCount?: number'
      return:
        description: ''
        type: number
  - name: idleTimeBeforeShutdown
    uid: >-
      @azure/arm-cognitiveservices.WorkbenchUpdateProperties.idleTimeBeforeShutdown
    package: '@azure/arm-cognitiveservices'
    summary: >-
      ISO 8601 duration before the idle workbench is automatically shut down
      (e.g., 'PT30M').
    fullName: idleTimeBeforeShutdown
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'idleTimeBeforeShutdown?: string'
      return:
        description: ''
        type: string
  - name: instanceType
    uid: '@azure/arm-cognitiveservices.WorkbenchUpdateProperties.instanceType'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      For virtual clusters, an exact Singularity instance type or a full-node
      Azure VM size. Omit to preserve the current value; null resets to the
      Singularity.D4_v3 fallback. Foundry Compute ignores this override and uses
      the pool configuration. An actual instance type change requires the
      workbench to be stopped.
    fullName: instanceType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instanceType?: string'
      return:
        description: ''
        type: string
  - name: targetClusterId
    uid: '@azure/arm-cognitiveservices.WorkbenchUpdateProperties.targetClusterId'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Resource ID of the Foundry Compute or virtual cluster that hosts this
      workbench. Changing the cluster requires the workbench to be stopped.
    fullName: targetClusterId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetClusterId?: string'
      return:
        description: ''
        type: string
