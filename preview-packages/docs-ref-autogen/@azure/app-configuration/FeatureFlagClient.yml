methods:
  - name: addFeatureFlag(FeatureFlagParam, AddFeatureFlagOptions)
    uid: '@azure/app-configuration.FeatureFlagClient.addFeatureFlag'
    package: '@azure/app-configuration'
    summary: >-
      Adds a feature flag through the dedicated feature flag endpoint, failing
      if the

      feature flag already exists.


      Example usage:

      ```ts snippet:AddFeatureFlag

      import { DefaultAzureCredential } from "@azure/identity";

      import { FeatureFlagClient } from "@azure/app-configuration";


      const endpoint = "https://example.azconfig.io";

      const credential = new DefaultAzureCredential();

      const client = new FeatureFlagClient(endpoint, credential);


      const result = await client.addFeatureFlag({
        name: "MyFeatureFlag",
        enabled: true,
      });

      console.log(`Feature flag ${result.name} is enabled: ${result.enabled}`);

      ```
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function addFeatureFlag(featureFlag: FeatureFlagParam, options?:
        AddFeatureFlagOptions): Promise<AddFeatureFlagResponse>
      parameters:
        - id: featureFlag
          type: <xref uid="@azure/app-configuration.FeatureFlagParam" />
          description: >-
            The feature flag to add. Its `name` and `label` identify the
            resource.
        - id: options
          type: <xref uid="@azure/app-configuration.AddFeatureFlagOptions" />
          description: Optional parameters for the request.
      return:
        description: ''
        type: >-
          Promise&lt;<xref uid="@azure/app-configuration.AddFeatureFlagResponse"
          />&gt;
