### YamlMime:TSTypeAlias
name: NodeRole
uid: '@azure/arm-horizondb.NodeRole'
package: '@azure/arm-horizondb'
summary: >-
  The role performed by a node within its HorizonDB pool. \

  [KnownNodeRole](xref:@azure/arm-horizondb.KnownNodeRole) can be used
  interchangeably with NodeRole,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ReadWrite**: The node accepts read and write traffic for its cluster. \

  **ReadOnly**: The node accepts read-only traffic. \

  **Unassigned**: The node is not currently assigned a read-write or read-only
  role.
fullName: NodeRole
remarks: ''
isDeprecated: false
syntax: |
  type NodeRole = string
