### YamlMime:TSType
name: TrustedCertificateSource
uid: '@azure/arm-cognitiveservices.TrustedCertificateSource'
package: '@azure/arm-cognitiveservices'
summary: >-
  An Azure resource containing the CA certificate bundles trusted by supported
  features in the account.
fullName: TrustedCertificateSource
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: certificateBundleReferences
    uid: >-
      @azure/arm-cognitiveservices.TrustedCertificateSource.certificateBundleReferences
    package: '@azure/arm-cognitiveservices'
    summary: >-
      References to secrets containing one or more PEM-encoded CA certificates.
      Each secret name and version pair must be unique within the source, using
      case-insensitive comparison. The same secret name can be referenced with
      different versions.
    fullName: certificateBundleReferences
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'certificateBundleReferences: CertificateBundleReference[]'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-cognitiveservices.CertificateBundleReference"
          />[]
  - name: resourceId
    uid: '@azure/arm-cognitiveservices.TrustedCertificateSource.resourceId'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Azure resource ID of the Key Vault containing the referenced secrets. The
      account identity must have permission to read these secrets.
    fullName: resourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resourceId: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-cognitiveservices.TrustedCertificateSource.type'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Type of resource containing the certificate bundles. Currently only
      AzureKeyVault is supported.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: string'
      return:
        description: ''
        type: string
