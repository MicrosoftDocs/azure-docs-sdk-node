### YamlMime:TSType
name: KnowledgeBaseTool
uid: '@azure/search-documents.KnowledgeBaseTool'
package: '@azure/search-documents'
summary: >-
  A named retrieval tool with a customer-provided description and a subset of
  its knowledge base's sources.
fullName: KnowledgeBaseTool
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: description
    uid: '@azure/search-documents.KnowledgeBaseTool.description'
    package: '@azure/search-documents'
    summary: >-
      A nonempty description of when to use the tool, at most 1024 characters.
      Advertised verbatim in the MCP catalog.
    fullName: description
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'description: string'
      return:
        description: ''
        type: string
  - name: knowledgeSources
    uid: '@azure/search-documents.KnowledgeBaseTool.knowledgeSources'
    package: '@azure/search-documents'
    summary: >-
      A nonempty list of unique source references. Each source must belong to
      the knowledge base. Different tools may reference the same source.
    fullName: knowledgeSources
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'knowledgeSources: KnowledgeBaseToolKnowledgeSourceReference[]'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/search-documents.KnowledgeBaseToolKnowledgeSourceReference"
          />[]
  - name: name
    uid: '@azure/search-documents.KnowledgeBaseTool.name'
    package: '@azure/search-documents'
    summary: >-
      The unique, case-sensitive tool name. Contains 2 to 64 lowercase ASCII
      letters, digits, or hyphens, with no leading or trailing hyphen.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: retrievalReasoningEffort
    uid: '@azure/search-documents.KnowledgeBaseTool.retrievalReasoningEffort'
    package: '@azure/search-documents'
    summary: >-
      Overrides the knowledge base's reasoning effort for this tool. Explicit
      retrieve-request values take precedence.
    fullName: retrievalReasoningEffort
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'retrievalReasoningEffort?: KnowledgeRetrievalReasoningEffortUnion'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/search-documents.KnowledgeRetrievalReasoningEffortUnion"
          />
  - name: retrieveDefaults
    uid: '@azure/search-documents.KnowledgeBaseTool.retrieveDefaults'
    package: '@azure/search-documents'
    summary: >-
      Retrieve defaults that override the knowledge base's defaults for this
      tool. Explicit retrieve-request values take precedence.
    fullName: retrieveDefaults
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'retrieveDefaults?: KnowledgeBaseRetrieveDefaults'
      return:
        description: ''
        type: <xref uid="@azure/search-documents.KnowledgeBaseRetrieveDefaults" />
