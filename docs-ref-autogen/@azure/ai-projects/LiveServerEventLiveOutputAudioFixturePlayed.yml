name: LiveServerEventLiveOutputAudioFixturePlayed
uid: '@azure/ai-projects.LiveServerEventLiveOutputAudioFixturePlayed'
package: '@azure/ai-projects'
summary: >-
  The complete audio fixture has drained from the server mixer and normal
  inference has resumed. Transport buffers may still contain audio; this event
  does not prove listener-side completion. The optional client_event_id echoes
  the play command. This event is not emitted for canceled or failed playback.
