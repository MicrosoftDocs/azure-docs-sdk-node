### YamlMime:TSTypeAlias
name: TrafficRoutingMethod
uid: '@azure/arm-privatetrafficmanager.TrafficRoutingMethod'
package: '@azure/arm-privatetrafficmanager'
summary: >-
  The traffic routing method of the Traffic Manager profile. \

  [KnownTrafficRoutingMethod](xref:@azure/arm-privatetrafficmanager.KnownTrafficRoutingMethod)
  can be used interchangeably with TrafficRoutingMethod,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Priority**: Routes traffic to endpoints based on priority values, directing
  to the highest priority available endpoint. \

  **Weighted**: Distributes traffic across endpoints based on assigned weight
  values. \

  **VNet**: Routes traffic to an endpoint by matching the virtual network of the
  DNS query to the endpoint's configured virtual networks.
fullName: TrafficRoutingMethod
remarks: ''
isDeprecated: false
syntax: |
  type TrafficRoutingMethod = string
