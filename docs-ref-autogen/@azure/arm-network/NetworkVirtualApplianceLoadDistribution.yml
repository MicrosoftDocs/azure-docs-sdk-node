### YamlMime:TSTypeAlias
name: NetworkVirtualApplianceLoadDistribution
uid: '@azure/arm-network.NetworkVirtualApplianceLoadDistribution'
package: '@azure/arm-network'
summary: >-
  The load distribution policy for a managed Network Virtual Appliance
  load-balancing rule. \

  [KnownNetworkVirtualApplianceLoadDistribution](xref:@azure/arm-network.KnownNetworkVirtualApplianceLoadDistribution)
  can be used interchangeably with NetworkVirtualApplianceLoadDistribution,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Default**: Distributes traffic using a five-tuple hash of source IP,
  destination IP, source port, destination port, and protocol. \

  **SourceIP**: Distributes traffic using a two-tuple hash of source IP and
  destination IP. \

  **SourceIPProtocol**: Distributes traffic using a three-tuple hash of source
  IP, destination IP, and protocol.
fullName: NetworkVirtualApplianceLoadDistribution
remarks: ''
isDeprecated: false
syntax: |
  type NetworkVirtualApplianceLoadDistribution = string
