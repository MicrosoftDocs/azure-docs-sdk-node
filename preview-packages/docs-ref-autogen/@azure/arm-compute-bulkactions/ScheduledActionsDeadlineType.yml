name: ScheduledActionsDeadlineType
uid: '@azure/arm-compute-bulkactions.ScheduledActionsDeadlineType'
package: '@azure/arm-compute-bulkactions'
summary: >-
  How the scheduled time is interpreted for the resource operation. \

  [KnownScheduledActionsDeadlineType](xref:@azure/arm-compute-bulkactions.KnownScheduledActionsDeadlineType)
  can be used interchangeably with ScheduledActionsDeadlineType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: The deadline type is not specified. \

  **InitiateAt**: Starts the operation at the scheduled time. \

  **CompleteBy**: Completes the operation by the scheduled time.
