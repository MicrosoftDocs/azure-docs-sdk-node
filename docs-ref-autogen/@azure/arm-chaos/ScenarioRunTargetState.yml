### YamlMime:TSTypeAlias
name: ScenarioRunTargetState
uid: '@azure/arm-chaos.ScenarioRunTargetState'
package: '@azure/arm-chaos'
summary: >-
  Enum of the execution states for a concrete action target. \

  [KnownScenarioRunTargetState](xref:@azure/arm-chaos.KnownScenarioRunTargetState)
  can be used interchangeably with ScenarioRunTargetState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: The action completed successfully for the target. \

  **NotApplicable**: Evaluation determined that the action cannot apply because
  the target lacks required

  properties or capabilities, or does not satisfy the action criteria. For
  example,

  a SQL server without failover configured. \

  **Skipped**: The action applies, but execution intentionally made no change
  because the target is

  already in the desired state or the change would not be safely recoverable.
  For example,

  a virtual machine that is already shut down. \

  **Failed**: Evaluation, authorization, lookup, mutation, or cleanup failed for
  the target.
fullName: ScenarioRunTargetState
remarks: ''
isDeprecated: false
syntax: |
  type ScenarioRunTargetState = string
