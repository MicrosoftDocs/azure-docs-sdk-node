### YamlMime:TSTypeAlias
name: ValidationTestRunStatus
uid: '@azure/arm-platformvalidation.ValidationTestRunStatus'
package: '@azure/arm-platformvalidation'
summary: >-
  The overall status of the test run. \

  [KnownValidationTestRunStatus](xref:@azure/arm-platformvalidation.KnownValidationTestRunStatus)
  can be used interchangeably with ValidationTestRunStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotRunning**: The test run is not running. \

  **Scheduled**: The test run is scheduled. \

  **Ready**: The test run is ready. \

  **Running**: The test run is running. \

  **Completed**: The test run is completed. \

  **Stopped**: The test run is stopped. \

  **Error**: The test run is errored out.
fullName: ValidationTestRunStatus
remarks: ''
isDeprecated: false
syntax: |
  type ValidationTestRunStatus = string
