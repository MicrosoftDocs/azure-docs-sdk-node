### YamlMime:TSTypeAlias
name: ResourceOperationType
uid: '@azure/arm-compute-bulkactions.ResourceOperationType'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The type of operation performed by Bulk Actions. \

  [KnownResourceOperationType](xref:@azure/arm-compute-bulkactions.KnownResourceOperationType)
  can be used interchangeably with ResourceOperationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Start**: Starts the specified virtual machines. \

  **Deallocate**: Deallocates the specified virtual machines. \

  **Hibernate**: Hibernates the specified virtual machines. \

  **Create**: Creates the specified virtual machines. \

  **Delete**: Deletes the specified virtual machines.
fullName: ResourceOperationType
remarks: ''
isDeprecated: false
syntax: |
  type ResourceOperationType = string
