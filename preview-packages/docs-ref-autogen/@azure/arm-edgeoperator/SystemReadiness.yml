### YamlMime:TSType
name: SystemReadiness
uid: '@azure/arm-edgeoperator.SystemReadiness'
package: '@azure/arm-edgeoperator'
summary: >-
  The system readiness status for Azure Local Disconnected Operations (ALDO).

  Reports whether the ALDO system is ready. This is a read-only singleton
  resource — the only

  accepted resource name is `default`.


  The subscription in the request path must be the Operator subscription. This
  subscription is used

  only for the access check: the resource provider verifies it on every request,
  and only operators

  have access to the Operator subscription and can therefore invoke the
  Microsoft.EdgeOperator APIs.

  Requests scoped to any other subscription are rejected.
fullName: SystemReadiness
remarks: ''
isDeprecated: false
