### YamlMime:TSTypeAlias
name: HttpResponseBodyInit
uid: '@azure/functions.HttpResponseBodyInit'
package: '@azure/functions'
summary: >-
  Represents the body types that can be used in an HTTP response.

  This is a local definition to avoid dependency on lib.dom.

  Compatible with Node.js native Fetch API body types.

  Includes Node.js Readable streams and AsyncIterable for HTTP streaming
  scenarios.
fullName: HttpResponseBodyInit
remarks: ''
isDeprecated: false
syntax: |
  type HttpResponseBodyInit =
    | ReadableStream
    | Readable
    | Blob
    | ArrayBufferView
    | ArrayBuffer
    | AsyncIterable<Uint8Array>
    | FormData
    | URLSearchParams
    | string
    | null
    | undefined
