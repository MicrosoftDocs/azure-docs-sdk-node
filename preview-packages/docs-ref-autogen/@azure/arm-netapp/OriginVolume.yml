### YamlMime:TSTypeAlias
name: OriginVolume
uid: '@azure/arm-netapp.OriginVolume'
package: '@azure/arm-netapp'
summary: >-
  Indicates whether a volume is designated as an origin for cache volumes. \

  [KnownOriginVolume](xref:@azure/arm-netapp.KnownOriginVolume) can be used
  interchangeably with OriginVolume,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Disabled**: This volume is not designated as an origin for cache volumes. \

  **Enabled**: This volume is designated as an origin for one or more cache
  volumes.
fullName: OriginVolume
remarks: ''
isDeprecated: false
syntax: |
  type OriginVolume = string
