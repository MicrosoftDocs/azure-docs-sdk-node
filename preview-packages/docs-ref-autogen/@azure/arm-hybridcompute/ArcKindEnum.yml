name: ArcKindEnum
uid: '@azure/arm-hybridcompute.ArcKindEnum'
package: '@azure/arm-hybridcompute'
summary: >-
  Indicates which kind of Arc machine placement on-premises, such as HCI, SCVMM
  or VMware etc. \

  [KnownArcKindEnum](xref:@azure/arm-hybridcompute.KnownArcKindEnum) can be used
  interchangeably with ArcKindEnum,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AVS**: AVS \

  **HCI**: HCI \

  **SCVMM**: SCVMM \

  **VMware**: VMware \

  **EPS**: EPS \

  **GCP**: GCP \

  **AWS**: AWS
