name: ContextCacheCheckNameAvailabilityFailureReason
uid: '@azure/arm-storage.ContextCacheCheckNameAvailabilityFailureReason'
package: '@azure/arm-storage'
summary: >-
  The reason why the context cache name is not available. The Reason element is
  only returned if NameAvailable is false. \

  [KnownContextCacheCheckNameAvailabilityFailureReason](xref:@azure/arm-storage.KnownContextCacheCheckNameAvailabilityFailureReason)
  can be used interchangeably with
  ContextCacheCheckNameAvailabilityFailureReason,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AlreadyExists**: The context cache name is already in use. \

  **ContextCacheNameInvalid**: The context cache name is invalid.
