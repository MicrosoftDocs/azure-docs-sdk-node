### YamlMime:TSEnum
name: KnownMigStrategy
uid: '@azure/arm-containerservice.KnownMigStrategy'
package: '@azure/arm-containerservice'
summary: >-
  Sets the MIG (Multi-Instance GPU) strategy that will be used for managed MIG
  support. For more information about the different strategies, visit
  aka.ms/aks/managed-gpu. When not specified, the default is None.
fullName: KnownMigStrategy
remarks: ''
isDeprecated: false
fields:
  - name: Mixed
    uid: '@azure/arm-containerservice.KnownMigStrategy.Mixed'
    package: '@azure/arm-containerservice'
    summary: >-
      Each GPU in the pool can host heterogeneous partitions of different sizes
      simultaneously (`nvidia.com/mig.strategy: mixed`). The exact partition mix
      per GPU is declared via `nvidia.migProfiles`.
  - name: None
    uid: '@azure/arm-containerservice.KnownMigStrategy.None'
    package: '@azure/arm-containerservice'
    summary: >-
      No MIG partitioning is applied; the GPU is exposed as a single unified
      whole-device instance. Specifying this value removes any previously active
      MIG strategy.
  - name: Single
    uid: '@azure/arm-containerservice.KnownMigStrategy.Single'
    package: '@azure/arm-containerservice'
    summary: >-
      All MIG partitions on every GPU in the pool are the same size
      (`nvidia.com/mig.strategy: single`). The uniform partition size is
      controlled by `nvidia.migProfiles` (exactly one element required).
