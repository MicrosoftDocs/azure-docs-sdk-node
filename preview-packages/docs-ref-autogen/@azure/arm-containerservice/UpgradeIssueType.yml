### YamlMime:TSTypeAlias
name: UpgradeIssueType
uid: '@azure/arm-containerservice.UpgradeIssueType'
package: '@azure/arm-containerservice'
summary: >-
  The type of a detected upgrade issue. \

  [KnownUpgradeIssueType](xref:@azure/arm-containerservice.KnownUpgradeIssueType)
  can be used interchangeably with UpgradeIssueType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **PDBConstraint**: A restrictive PodDisruptionBudget prevents node drain
  during upgrade. See https://aka.ms/aks/upgrade-insights/pdb-constraint for
  remediation guidance. \

  **SubnetIPExhausted**: The cluster subnet does not have sufficient available
  IP addresses for surge nodes during upgrade. See
  https://aka.ms/aks/upgrade-insights/subnet-ip-exhaustion for remediation
  guidance. \

  **QuotaExceeded**: Compute quota for the node pool VM SKU is insufficient to
  accommodate surge nodes during upgrade. See
  https://aka.ms/aks/upgrade-insights/quota-exceeded for remediation guidance. \

  **APIBreakingChange**: The cluster is using deprecated Kubernetes APIs that
  are removed in the target version. See
  https://aka.ms/aks/upgrade-insights/api-breaking-change for remediation
  guidance. \

  **ComponentVersionMismatch**: An add-on or system component is not compatible
  with the target Kubernetes version. See
  https://aka.ms/aks/upgrade-insights/component-version-mismatch for remediation
  guidance. \

  **UnsupportedKubernetesVersion**: The cluster is running a Kubernetes version
  that is no longer supported. See
  https://aka.ms/aks/upgrade-insights/unsupported-kubernetes-version for
  remediation guidance. \

  **NodeImageOutOfSLA**: The cluster node image has not been upgraded within the
  required compliance interval. See
  https://aka.ms/aks/upgrade-insights/node-image-out-of-sla for remediation
  guidance.
fullName: UpgradeIssueType
remarks: ''
isDeprecated: false
syntax: |
  type UpgradeIssueType = string
