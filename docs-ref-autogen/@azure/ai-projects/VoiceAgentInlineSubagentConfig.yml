### YamlMime:TSType
name: VoiceAgentInlineSubagentConfig
uid: '@azure/ai-projects.VoiceAgentInlineSubagentConfig'
package: '@azure/ai-projects'
summary: >-
  Configuration for inline voice subagents that may become active through
  Handoff.
fullName: VoiceAgentInlineSubagentConfig
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: handoff_policy
    uid: '@azure/ai-projects.VoiceAgentInlineSubagentConfig.handoff_policy'
    package: '@azure/ai-projects'
    summary: >-
      Session-wide Handoff limits. Requires `$entrypoint` with at least one
      outgoing condition. When omitted, the service permits up to 16 completed
      and 16 attempted handoffs.
    fullName: handoff_policy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'handoff_policy?: VoiceAgentHandoffPolicy'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentHandoffPolicy" />
  - name: subagents
    uid: '@azure/ai-projects.VoiceAgentInlineSubagentConfig.subagents'
    package: '@azure/ai-projects'
    summary: >-
      Inline voice subagents owned and versioned with the parent Voice Agent.
      `$entrypoint` must be first, followed

      by at least one specialist and at most 31 additional subagents. Each
      subagent declares its outgoing

      `handoff_conditions`; condition identifiers and the 128-condition limit
      apply across the entire Agent.
    fullName: subagents
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'subagents: InlineVoiceSubagent[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.InlineVoiceSubagent" />[]
  - name: subagentType
    uid: '@azure/ai-projects.VoiceAgentInlineSubagentConfig.subagentType'
    package: '@azure/ai-projects'
    summary: The subagent mode for inline voice subagents.
    fullName: subagentType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'subagentType: "inline"'
      return:
        description: ''
        type: '"inline"'
extends: <xref uid="@azure/ai-projects.VoiceAgentSubagentConfig" />
