name: EndpointScope
uid: '@azure/arm-horizondb.EndpointScope'
package: '@azure/arm-horizondb'
summary: >-
  The scope of a HorizonDB endpoint. \

  [KnownEndpointScope](xref:@azure/arm-horizondb.KnownEndpointScope) can be used
  interchangeably with EndpointScope,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Cluster**: The Endpoint is associated with its parent Cluster. \

  **Pool**: The Endpoint is associated with a Pool under its parent Cluster and
  has the ReadOnly role.
