name: OccurrenceResourceProvisioningState
uid: '@azure/arm-compute-bulkactions.OccurrenceResourceProvisioningState'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The provisioning state of a scheduled-action resource within an occurrence. \

  [KnownOccurrenceResourceProvisioningState](xref:@azure/arm-compute-bulkactions.KnownOccurrenceResourceProvisioningState)
  can be used interchangeably with OccurrenceResourceProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: Resource has been created. \

  **Failed**: Resource creation failed. \

  **Canceled**: Resource creation was canceled. \

  **Created**: The resource has been created \

  **Scheduled**: The resource has been scheduled \

  **Cancelling**: The resource is going through cancellation \

  **Rescheduling**: The resource is being rescheduled \

  **InvalidState**: The resource is in an invalid state
fullName: OccurrenceResourceProvisioningState
