summary: >-
  Provisioning states shared by NeuroShield resources. The non-terminal states
  are used by

  asynchronous protected-resource operations; synchronous NeuroShield operations
  return only

  terminal states. \

  [KnownProvisioningStateNeuroShield](xref:@azure/arm-networksecurity.KnownProvisioningStateNeuroShield)
  can be used interchangeably with ProvisioningStateNeuroShield,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: Resource has been created. \

  **Failed**: Resource creation failed. \

  **Canceled**: Resource creation was canceled. \

  **Creating**: Resource is being created. \

  **Updating**: Resource is being updated. \

  **Deleting**: Resource is being deleted.
