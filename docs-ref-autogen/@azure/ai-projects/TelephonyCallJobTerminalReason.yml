name: TelephonyCallJobTerminalReason
uid: '@azure/ai-projects.TelephonyCallJobTerminalReason'
package: '@azure/ai-projects'
summary: >-
  Known terminal reasons for an overall outbound call job, which can span
  multiple provider attempts. These are distinct from individual call lifecycle
  reasons. Additional string codes may be returned.
fullName: TelephonyCallJobTerminalReason
remarks: ''
isDeprecated: false
syntax: |
  type TelephonyCallJobTerminalReason =
    | "no_answer"
    | "no_answer_timeout"
    | "answer_failed"
    | "bridge_cancelled"
    | "bridge_failed"
    | "voice_session_configuration_invalid"
    | "connection_project_mismatch"
    | "outbound_connection_changed"
    | "outbound_connection_unavailable"
    | "telephony_binding_invalid"
    | "telephony_binding_not_found"
    | "telephony_binding_inactive"
    | "telephony_binding_changed"
    | "campaign_not_found"
    | "campaign_cancelled"
    | "campaign_completed"
    | "campaign_failed"
    | "origination_fence_not_recorded"
    | "origination_reconciliation_timeout"
    | "cancellation_reconciliation_timeout"
    | "provider_callback_timeout_cancellation_reconciliation_timeout"
    | string
