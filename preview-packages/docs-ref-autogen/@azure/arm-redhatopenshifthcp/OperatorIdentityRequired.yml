summary: >-
  Indicates if the identity is required \

  [KnownOperatorIdentityRequired](xref:@azure/arm-redhatopenshifthcp.KnownOperatorIdentityRequired)
  can be used interchangeably with OperatorIdentityRequired,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Always**: Indicates the identity is always required. \

  **OnEnablement**: Indicates the identity is only required when a functionality
  that leverages the operator is enabled.
