### YamlMime:TSType
name: SearchServicePropertiesInput
uid: '@azure/provisioning-search.types.SearchServicePropertiesInput'
package: '@azure/provisioning-search'
summary: Input type for Properties of the search service.
fullName: SearchServicePropertiesInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: authOptions
    uid: '@azure/provisioning-search.types.SearchServicePropertiesInput.authOptions'
    package: '@azure/provisioning-search'
    summary: >-
      Defines the options for how the data plane API of a search service
      authenticates requests. This cannot be set if 'disableLocalAuth' is set to
      true.
    fullName: authOptions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'authOptions?: DataPlaneAuthOptionsInput'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-search.types.DataPlaneAuthOptionsInput"
          />
  - name: computeType
    uid: '@azure/provisioning-search.types.SearchServicePropertiesInput.computeType'
    package: '@azure/provisioning-search'
    summary: >-
      Configure this property to support the search service using either the
      Default Compute or Azure Confidential Compute.
    fullName: computeType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'computeType?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: dataExfiltrationProtections
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.dataExfiltrationProtections
    package: '@azure/provisioning-search'
    summary: >-
      A list of data exfiltration scenarios that are explicitly disallowed for
      the search service. Currently, the only supported value is 'All' to
      disable all possible data export scenarios with more fine grained controls
      planned for the future.
    fullName: dataExfiltrationProtections
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'dataExfiltrationProtections?: any'
      return:
        description: ''
        type: any
  - name: disableLocalAuth
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.disableLocalAuth
    package: '@azure/provisioning-search'
    summary: >-
      When set to true, calls to the search service will not be permitted to
      utilize API keys for authentication. This cannot be set to true if
      'dataPlaneAuthOptions' are defined.
    fullName: disableLocalAuth
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'disableLocalAuth?: ExpressionOrValue<boolean | null>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;boolean |
          null&gt;
  - name: encryptionWithCmk
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.encryptionWithCmk
    package: '@azure/provisioning-search'
    summary: >-
      Specifies any policy regarding encryption of resources (such as indexes)
      using customer manager keys within a search service.
    fullName: encryptionWithCmk
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'encryptionWithCmk?: EncryptionWithCmkInput'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-search.types.EncryptionWithCmkInput" />
  - name: endpoint
    uid: '@azure/provisioning-search.types.SearchServicePropertiesInput.endpoint'
    package: '@azure/provisioning-search'
    summary: The endpoint of the Azure AI Search service.
    fullName: endpoint
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'endpoint?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: hostingMode
    uid: '@azure/provisioning-search.types.SearchServicePropertiesInput.hostingMode'
    package: '@azure/provisioning-search'
    summary: >-
      Applicable only for the standard3 SKU. You can set this property to enable
      up to 3 high density partitions that allow up to 1000 indexes, which is
      much higher than the maximum indexes allowed for any other SKU. For the
      standard3 SKU, the value is either 'Default' or 'HighDensity'. For all
      other SKUs, this value must be 'Default'.
    fullName: hostingMode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'hostingMode?: ExpressionOrValue<HostingMode>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;<xref
          uid="@azure/provisioning-search.types.HostingMode" />&gt;
  - name: networkRuleSet
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.networkRuleSet
    package: '@azure/provisioning-search'
    summary: >-
      Network specific rules that determine how the Azure AI Search service may
      be reached.
    fullName: networkRuleSet
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'networkRuleSet?: NetworkRuleSetInput'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-search.types.NetworkRuleSetInput" />
  - name: partitionCount
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.partitionCount
    package: '@azure/provisioning-search'
    summary: >-
      The number of partitions in the dedicated search service; if specified, it
      can be 1, 2, 3, 4, 6, or 12. Values greater than 1 are only valid for
      standard SKUs. For 'standard3' services with hostingMode set to
      'highDensity', the allowed values are between 1 and 3.
    fullName: partitionCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'partitionCount?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
  - name: publicNetworkAccess
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.publicNetworkAccess
    package: '@azure/provisioning-search'
    summary: >-
      This value can be set to 'Enabled' to avoid breaking changes on existing
      customer resources and templates. If set to 'Disabled', traffic over
      public interface is not allowed, and private endpoint connections would be
      the exclusive access method.
    fullName: publicNetworkAccess
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publicNetworkAccess?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: replicaCount
    uid: '@azure/provisioning-search.types.SearchServicePropertiesInput.replicaCount'
    package: '@azure/provisioning-search'
    summary: >-
      The number of replicas in the dedicated search service. If specified, it
      must be a value between 1 and 12 inclusive for standard SKUs or between 1
      and 3 inclusive for basic SKU.
    fullName: replicaCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'replicaCount?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
  - name: semanticSearch
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.semanticSearch
    package: '@azure/provisioning-search'
    summary: >-
      Specifies the availability and billing plan for semantic search on the
      Azure AI Search service. This configuration is only available for certain
      pricing tiers in certain regions.
    fullName: semanticSearch
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'semanticSearch?: ExpressionOrValue<string | null>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;string |
          null&gt;
  - name: upgradeAvailable
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesInput.upgradeAvailable
    package: '@azure/provisioning-search'
    summary: Indicates if the search service has an upgrade available.
    fullName: upgradeAvailable
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'upgradeAvailable?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
extends: >-
  unknown&lt;<xref
  uid="@azure/provisioning-search.types.SearchServiceProperties" />&gt;
