properties:
  - name: type
    uid: '@azure/provisioning-cosmosdb.types.ManagedServiceIdentityInput.type'
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      The type of identity used for the resource. The type
      'SystemAssigned,UserAssigned' includes both an implicitly created identity
      and a set of user assigned identities. The type 'None' will remove any
      identities from the service.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type?: ExpressionOrValue<ResourceIdentityType>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;<xref
          uid="@azure/provisioning-cosmosdb.types.ResourceIdentityType" />&gt;
  - name: userAssignedIdentities
    uid: >-
      @azure/provisioning-cosmosdb.types.ManagedServiceIdentityInput.userAssignedIdentities
    package: '@azure/provisioning-cosmosdb'
    summary: >-
      The list of user identities associated with resource. The user identity
      dictionary key references will be ARM resource ids in the form:
      '/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}'.
    fullName: userAssignedIdentities
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'userAssignedIdentities?: any'
      return:
        description: ''
        type: any
