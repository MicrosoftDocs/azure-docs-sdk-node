package: '@azure/arm-compute-bulkactions'
summary: >-
  The provisioning state of the recurring bulk action. \

  [KnownScheduledActionsProvisioningState](xref:@azure/arm-compute-bulkactions.KnownScheduledActionsProvisioningState)
  can be used interchangeably with ScheduledActionsProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: Resource has been created. \

  **Failed**: Resource creation failed. \

  **Canceled**: Resource creation was canceled. \

  **Deleting**: The recurring bulk action is being deleted. \

  **Updating**: The recurring bulk action is being updated.
