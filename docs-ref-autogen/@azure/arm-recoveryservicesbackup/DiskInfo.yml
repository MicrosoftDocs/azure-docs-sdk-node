name: DiskInfo
uid: '@azure/arm-recoveryservicesbackup.DiskInfo'
package: '@azure/arm-recoveryservicesbackup'
summary: >-
  Metadata for a physical disk that backs a filesystem volume or Storage Spaces
  pool.

  Unlike DiskInformation, this model describes storage topology; DiskInformation
  only identifies disks included in or excluded from a virtual machine recovery
  point.
fullName: DiskInfo
remarks: ''
isDeprecated: false
