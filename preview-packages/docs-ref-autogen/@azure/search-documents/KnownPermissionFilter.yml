### YamlMime:TSEnum
name: KnownPermissionFilter
uid: '@azure/search-documents.KnownPermissionFilter'
package: '@azure/search-documents'
summary: A value indicating whether the field should be used as a permission filter.
fullName: KnownPermissionFilter
remarks: ''
isDeprecated: false
fields:
  - name: GroupIds
    uid: '@azure/search-documents.KnownPermissionFilter.GroupIds'
    package: '@azure/search-documents'
    summary: >-
      Field represents group IDs that should be used to filter document access
      on queries.
  - name: OneLakeLakehouseId
    uid: '@azure/search-documents.KnownPermissionFilter.OneLakeLakehouseId'
    package: '@azure/search-documents'
    summary: >-
      Field represents a OneLake lakehouse ID that should be used to filter
      document access on queries. The index must also specify
      'oneLakeSecuritySource'.
  - name: OneLakeParentFolders
    uid: '@azure/search-documents.KnownPermissionFilter.OneLakeParentFolders'
    package: '@azure/search-documents'
    summary: >-
      Field represents the OneLake parent folder paths of the source item that
      should be used to filter document access on queries. The index must also
      specify 'oneLakeSecuritySource'.
  - name: RbacScope
    uid: '@azure/search-documents.KnownPermissionFilter.RbacScope'
    package: '@azure/search-documents'
    summary: >-
      Field represents an RBAC scope that should be used to filter document
      access on queries.
  - name: UserIds
    uid: '@azure/search-documents.KnownPermissionFilter.UserIds'
    package: '@azure/search-documents'
    summary: >-
      Field represents user IDs that should be used to filter document access on
      queries.
