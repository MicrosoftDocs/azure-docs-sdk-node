name: HorizonDbClusterIdentityType
uid: '@azure/arm-horizondb.HorizonDbClusterIdentityType'
package: '@azure/arm-horizondb'
summary: >-
  The managed identity types supported by a HorizonDB cluster. \

  [KnownHorizonDbClusterIdentityType](xref:@azure/arm-horizondb.KnownHorizonDbClusterIdentityType)
  can be used interchangeably with HorizonDbClusterIdentityType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: No managed identity is assigned. Setting type to None clears all
  managed identity assignments. \

  **UserAssigned**: User-assigned managed identities are assigned.
fullName: HorizonDbClusterIdentityType
