package: '@azure/provisioning-operationalinsights'
summary: >-
  The protection level of the table. Determines the default data access
  isolation behavior.


  Known values:


  - `"General"`: The default protection level. Table data is accessible through
  standard permissions.


  - `"Protected"`: Table data is isolated by default. Accessing or exporting
  data requires explicit, scoped authorization.
