  - name: schedule
    uid: '@azure/provisioning-containerregistry.types.SyncPropertiesInput.schedule'
    package: '@azure/provisioning-containerregistry'
    summary: >-
      The cron expression indicating the schedule that the connected registry
      will sync with its parent.
    fullName: schedule
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'schedule?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
