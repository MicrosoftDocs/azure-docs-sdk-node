  - name: createOrReplace
    uid: '@azure/arm-horizondb.IdentityAssignmentsOperations.createOrReplace'
    package: '@azure/arm-horizondb'
    summary: >-
      Creates or idempotently replaces a change data capture identity
      assignment. The identity resource ID is immutable and must reference a
      user-assigned managed identity already attached to the parent cluster. The
      service also validates destination permissions, which are not granted by
      attaching the identity to the cluster.
