name: GeoRedundancyState
uid: '@azure/arm-horizondb.GeoRedundancyState'
package: '@azure/arm-horizondb'
summary: >-
  Indicates the geo-redundancy state. \

  [KnownGeoRedundancyState](xref:@azure/arm-horizondb.KnownGeoRedundancyState)
  can be used interchangeably with GeoRedundancyState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Geo-redundancy is enabled. This value is not supported when
  dataEncryption.type is AzureKeyVault. \

  **Disabled**: Geo-redundancy is disabled
fullName: GeoRedundancyState
