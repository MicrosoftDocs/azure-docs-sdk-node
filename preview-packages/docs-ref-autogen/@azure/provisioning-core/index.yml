functions:
  - name: asDiscriminator<L>(ExpressionOrValue<L>)
    uid: '@azure/provisioning-core.asDiscriminator'
    package: '@azure/provisioning-core'
    summary: |-
      Asserts that a deploy-time expression resolves to a specific literal,
      so it can be used where a discriminator is expected.

      Discriminator properties on a `@discriminator` model are typed as bare
      literals (`kind: "cache"`) rather than `ExpressionOrValue<"cache">`.
      That is deliberate: TypeScript only treats a property as a discriminant
      when its type is a *unit* type in every constituent of the union, and a
      single widened arm disables narrowing for the whole union — completions
      then offer every variant's properties and excess-property checking
      degrades to "allowed if the property exists in any variant".

      When the discriminator genuinely isn't known until deployment, wrap the
      expression with this to state which variant you mean:

      ```ts snippet:ignore
      widget.properties.primaryRule = {
        kind: asDiscriminator(kindParam),
        cacheKind: "long",
        days: 7,
      };
      ```

      Every other property is still fully checked — only the discriminator's
      type safety is waived. Note that the runtime cannot dispatch on a
      non-literal discriminator, so serialization falls back to structural
      variant inference; prefer a literal wherever possible.

      The literal is inferred from the expression's own type argument. If the
      expression is loosely typed (`Expression<string>`), name the variant
      explicitly: `asDiscriminator<"cache">(param)`.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function asDiscriminator<L>(value: ExpressionOrValue<L>): L'
      parameters:
        - id: value
          type: <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;L&gt;
          description: ''
      return:
        description: ''
        type: L
  - name: >-
      createOutput<T>(Stack, string, T, OutputValueFor<NoInfer<T>>,
      OutputOptions)
    uid: '@azure/provisioning-core.createOutput'
    package: '@azure/provisioning-core'
    summary: |+
      A deployment output, compiled to a Bicep `output` declaration.

      **Example**

      ```typescript snippet:ignore
      import { Stack } from "@azure/provisioning-core";
      import { KeyVault } from "@azure/provisioning-keyvault";

      const stack = new Stack("my-app", { targetScope: "resourceGroup" });
      const vault = new KeyVault(stack, {
        name: "kv-my-app",
        location: "eastus",
        properties: {
          tenantId: "11111111-1111-1111-1111-111111111111",
          sku: { family: "A", name: "standard" },
        },
      });
      stack.outputs.add("vaultUri", "string", vault.properties.vaultUri);
      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function createOutput<T>(stack: Stack, name: string, type: T, value:
        OutputValueFor<NoInfer<T>>, options?: OutputOptions): OutputMetadata
      parameters:
        - id: stack
          type: <xref uid="@azure/provisioning-core.Stack" />
          description: ''
        - id: name
          type: string
          description: ''
        - id: type
          type: T
          description: ''
        - id: value
          type: >-
            <xref uid="@azure/provisioning-core.OutputValueFor"
            />&lt;NoInfer&lt;T&gt;&gt;
