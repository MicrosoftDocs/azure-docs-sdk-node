  - name: delete
    uid: '@azure/arm-search.QueryKeysOperations.delete'
    package: '@azure/arm-search'
    summary: >-
      Deletes the specified query key. Unlike admin keys, query keys are not
      regenerated. The process for regenerating a query key is to delete and
      then recreate it.

      Returns 200 (OK) on successful deletion, 204 (No Content) if the service
      exists but the query keys not found, or 404 (Not Found) if the service is
      not found.

      NOTE: The behavior of returning 404 is inconsistent with ARM guidelines.
      Clients should expect a 204 response in future versions and avoid new
      dependencies on the 404 response.
    fullName: delete
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        delete: (resourceGroupName: string, searchServiceName: string, key:
        string, options?: QueryKeysDeleteOptionalParams) => Promise<void>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, searchServiceName: string, key: string,
          options?: QueryKeysDeleteOptionalParams) =&gt; Promise&lt;void&gt;
