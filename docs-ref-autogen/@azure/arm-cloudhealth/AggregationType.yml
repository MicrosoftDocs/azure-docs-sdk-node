### YamlMime:TSTypeAlias
name: AggregationType
uid: '@azure/arm-cloudhealth.AggregationType'
package: '@azure/arm-cloudhealth'
summary: >-
  Aggregation strategy for combining a set of health states into one. \

  [KnownAggregationType](xref:@azure/arm-cloudhealth.KnownAggregationType) can
  be used interchangeably with AggregationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **WorstOf**: Worst health state across members is propagated. Default
  behavior. \

  **BestOf**: Best (least severe) health state across the non-Unknown members is
  propagated. Unknown members are excluded from the selection; if every member
  is Unknown the group resolves to Unknown. The 'ignoreUnknown' flag has no
  observable effect for this strategy and is documented as such. \

  **MinHealthy**: Healthy if the count/percentage of healthy members meets the
  threshold. \

  **MaxNotHealthy**: Healthy if the count/percentage of not-healthy members
  stays below the threshold.
fullName: AggregationType
remarks: ''
isDeprecated: false
syntax: |
  type AggregationType = string
