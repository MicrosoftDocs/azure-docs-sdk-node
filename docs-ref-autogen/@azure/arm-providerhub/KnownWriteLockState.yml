### YamlMime:TSEnum
name: KnownWriteLockState
uid: '@azure/arm-providerhub.KnownWriteLockState'
package: '@azure/arm-providerhub'
summary: The state of the write lock feature.
fullName: KnownWriteLockState
remarks: ''
isDeprecated: false
fields:
  - name: Disabled
    uid: '@azure/arm-providerhub.KnownWriteLockState.Disabled'
    package: '@azure/arm-providerhub'
    summary: >-
      The write lock feature is disabled. The write-operations on the resource
      will follow the last-write-wins semantics when the write lock feature is
      disabled.
  - name: Enabled
    uid: '@azure/arm-providerhub.KnownWriteLockState.Enabled'
    package: '@azure/arm-providerhub'
    summary: >-
      The write lock feature is enabled. Ensures that only one write-operation
      i.e., PUT, PATCH and DELETE, is allowed on a resource at any given time.
      Other concurrent write-operations, if any, will be rejected until the lock
      on the resource is released by the ongoing write-operation. The feature
      overrides the 'resourceConcurrencyControlOptions'.
