### YamlMime:TSTypeAlias
name: ExpectContinueMode
uid: '@azure/storage-blob.ExpectContinueMode'
package: '@azure/storage-blob'
summary: >-
  ONLY AVAILABLE IN NODE.JS RUNTIME.


  Determines when requests with a body are sent with the `Expect: 100-continue`
  header. Only

  requests whose body is non-empty and at least
  [ExpectContinueOptions.minBodySizeInBytes](xref:@azure/storage-blob.ExpectContinueOptions.minBodySizeInBytes)

  bytes long, or of unknown length, qualify.


  - `auto`: for
  [ExpectContinueOptions.autoIntervalInMs](xref:@azure/storage-blob.ExpectContinueOptions.autoIntervalInMs)
  after the latest response with
    status 429, 500 or 503 to any request on the same pipeline. Clients created from one another,
    for example with `getContainerClient()`, share a pipeline.
  - `always`: on every qualifying request.

  - `never`: never.
fullName: ExpectContinueMode
remarks: ''
isDeprecated: false
syntax: |
  type ExpectContinueMode = "auto" | "always" | "never"
