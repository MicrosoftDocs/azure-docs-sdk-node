### YamlMime:TSTypeAlias
name: MessagePayloadFormat
uid: '@azure/arm-iothub.MessagePayloadFormat'
package: '@azure/arm-iothub'
summary: >-
  The supported formats for message payloads delivered to routing endpoints. \

  [KnownMessagePayloadFormat](xref:@azure/arm-iothub.KnownMessagePayloadFormat)
  can be used interchangeably with MessagePayloadFormat,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **DOObservationV1**: Formats the message as a com.do.telemetry.observation.v1
  payload. \

  **None**: Preserves the original message payload.
fullName: MessagePayloadFormat
remarks: ''
isDeprecated: false
syntax: |
  type MessagePayloadFormat = string
