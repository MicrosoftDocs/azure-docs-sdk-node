### YamlMime:TSTypeAlias
name: OperationState
uid: '@azure/arm-compute-bulkactions.OperationState'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The current state of a bulk action. \

  [KnownOperationState](xref:@azure/arm-compute-bulkactions.KnownOperationState)
  can be used interchangeably with OperationState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Scheduled**: The operation has been scheduled. \

  **Executing**: The operation is in progress. \

  **Succeeded**: The operation completed successfully. \

  **Failed**: The operation failed. \

  **Cancelled**: The operation was canceled by the caller. \

  **Blocked**: The operation cannot currently make progress.
fullName: OperationState
remarks: ''
isDeprecated: false
syntax: |
  type OperationState = string
