    package: '@azure/arm-containerserviceaimanager'
    summary: >-
      The Azure resource ID of an existing AKS cluster to attach
      (bring-your-own). When omitted, AI Manager provisions and manages its own
      underlying cluster. The referenced cluster must be in the same region as
      this AI Manager, but may reside in a different subscription within the
      same Microsoft Entra tenant. This property is immutable after creation.
    fullName: clusterResourceId
