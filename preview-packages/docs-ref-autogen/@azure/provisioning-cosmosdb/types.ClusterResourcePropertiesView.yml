    remarks: ''
    isDeprecated: false
    syntax:
      content: 'deallocated?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
