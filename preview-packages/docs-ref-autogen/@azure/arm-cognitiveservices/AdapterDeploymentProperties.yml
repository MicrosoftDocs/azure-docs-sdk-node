properties:
  - name: activeTargetDeploymentName
    uid: >-
      @azure/arm-cognitiveservices.AdapterDeploymentProperties.activeTargetDeploymentName
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The managed compute deployment currently serving the adapter.

      During re-targeting this remains the prior deployment until atomic
      cutover.
    fullName: activeTargetDeploymentName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'activeTargetDeploymentName?: string'
      return:
        description: ''
        type: string
  - name: lastOperation
    uid: '@azure/arm-cognitiveservices.AdapterDeploymentProperties.lastOperation'
    package: '@azure/arm-cognitiveservices'
    summary: Information about the most recently requested lifecycle operation.
    fullName: lastOperation
    remarks: ''
