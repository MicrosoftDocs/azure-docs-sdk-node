### YamlMime:TSType
name: UpgradeInsightEvaluation
uid: '@azure/arm-containerservice.UpgradeInsightEvaluation'
package: '@azure/arm-containerservice'
summary: >-
  The evaluation payload shared by all upgrade insight results, containing the

  overall status, evaluation time, and any detected issues. Whenever this object
  is

  present the evaluation has run, so `status` and `evaluatedAt` are always
  populated;

  the "not yet evaluated" state is signaled by the absence of this `evaluation`
  object

  (and by `provisioningState`), never by a present evaluation with an absent
  status.
fullName: UpgradeInsightEvaluation
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: detectedIssues
    uid: '@azure/arm-containerservice.UpgradeInsightEvaluation.detectedIssues'
    package: '@azure/arm-containerservice'
    summary: >-
      The list of detected upgrade issues, if any. Empty or absent for a
      `Passed` status.
    fullName: detectedIssues
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'detectedIssues?: DetectedUpgradeIssue[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.DetectedUpgradeIssue" />[]
  - name: evaluatedAt
    uid: '@azure/arm-containerservice.UpgradeInsightEvaluation.evaluatedAt'
    package: '@azure/arm-containerservice'
    summary: The UTC time at which the upgrade insight evaluation was performed.
    fullName: evaluatedAt
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluatedAt: Date'
      return:
        description: ''
        type: Date
  - name: status
    uid: '@azure/arm-containerservice.UpgradeInsightEvaluation.status'
    package: '@azure/arm-containerservice'
    summary: >-
      The overall upgrade insight status indicating whether issues were
      detected. Always present when the evaluation has run; absence of the
      enclosing `evaluation` object—not an absent status—represents "not yet
      evaluated".
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status: string'
      return:
        description: ''
        type: string
