### YamlMime:TSType
name: LiveOutputAudioDelta
uid: '@azure/ai-projects.LiveOutputAudioDelta'
package: '@azure/ai-projects'
summary: >-
  An audio chunk generated by the Live model. Decode and play primary WebSocket
  chunks in delivery order using the configured session audio format. Sideband
  connections receive reflected output audio with timestamps.
fullName: LiveOutputAudioDelta
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: delta
    uid: '@azure/ai-projects.LiveOutputAudioDelta.delta'
    package: '@azure/ai-projects'
    summary: >-
      Base64-encoded raw audio. Primary WebSocket events use the session's
      configured format; reflected sideband events use mono PCM16LE at 24 kHz.
    fullName: delta
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delta: string'
      return:
        description: ''
        type: string
  - name: end_ms
    uid: '@azure/ai-projects.LiveOutputAudioDelta.end_ms'
    package: '@azure/ai-projects'
    summary: >-
      Exclusive session-relative end in milliseconds. Required on reflected
      sideband events; omitted on the primary WebSocket. Dropped output frames
      leave gaps between reflected ranges.
    fullName: end_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'end_ms?: number'
      return:
        description: ''
        type: number
  - name: start_ms
    uid: '@azure/ai-projects.LiveOutputAudioDelta.start_ms'
    package: '@azure/ai-projects'
    summary: >-
      Inclusive session-relative start in milliseconds. Required on reflected
      sideband events; omitted on the primary WebSocket.
    fullName: start_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'start_ms?: number'
      return:
        description: ''
        type: number
  - name: type
    uid: '@azure/ai-projects.LiveOutputAudioDelta.type'
    package: '@azure/ai-projects'
    summary: The event type, always `session.output_audio.delta`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "session.output_audio.delta"'
      return:
        description: ''
        type: '"<xref uid="session.output_audio.delta" />"'
extends: <xref uid="@azure/ai-projects.LiveServerEvent" />
