### YamlMime:TSType
name: VoiceAgentLiveConnection
uid: '@azure/ai-projects.VoiceAgentLiveConnection'
package: '@azure/ai-projects'
summary: >-
  A GPT Live voice session.


  Read events with one `for await` loop or use `on`, `off`, and `once`
  listeners.

  Leaving the loop closes the session. Received audio chunks are base64 strings.
fullName: VoiceAgentLiveConnection
remarks: ''
isDeprecated: false
type: interface
