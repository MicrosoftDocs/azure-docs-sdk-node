### YamlMime:TSType
name: EventNameFilter
uid: '@azure/provisioning-webpubsub.types.EventNameFilter'
package: '@azure/provisioning-webpubsub'
summary: Filter events by their name.
fullName: EventNameFilter
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: systemEvents
    uid: '@azure/provisioning-webpubsub.types.EventNameFilter.systemEvents'
    package: '@azure/provisioning-webpubsub'
    summary: >-
      Gets or sets a list of system events. Supported events: "connected" and
      "disconnected". Blocking event "connect" is not supported because it
      requires a response.
    fullName: systemEvents
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'systemEvents?: string[]'
      return:
        description: ''
        type: string[]
  - name: type
    uid: '@azure/provisioning-webpubsub.types.EventNameFilter.type'
    package: '@azure/provisioning-webpubsub'
    summary: Selects this variant. Must be "EventName".
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "EventName"'
      return:
        description: ''
        type: '"EventName"'
  - name: userEventPattern
    uid: '@azure/provisioning-webpubsub.types.EventNameFilter.userEventPattern'
    package: '@azure/provisioning-webpubsub'
    summary: >-
      Gets or sets a matching pattern for event names.

      There are 3 kinds of patterns supported:

      1. "*", it matches any event name

      2. Combine multiple events with ",", for example "event1,event2", it
      matches events "event1" and "event2"

      3. A single event name, for example, "event1", it matches "event1"
    fullName: userEventPattern
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'userEventPattern?: string'
      return:
        description: ''
        type: string
