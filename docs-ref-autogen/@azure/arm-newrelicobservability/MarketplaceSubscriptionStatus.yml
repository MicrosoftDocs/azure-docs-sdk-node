package: '@azure/arm-newrelicobservability'
summary: >-
  Flag specifying the Marketplace Subscription Status of the resource. If
  payment is not made in time, the resource will go in Suspended state. \

  [KnownMarketplaceSubscriptionStatus](xref:@azure/arm-newrelicobservability.KnownMarketplaceSubscriptionStatus)
  can be used interchangeably with MarketplaceSubscriptionStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Active**: monitoring is enabled \

  **Suspended**: monitoring is disabled
