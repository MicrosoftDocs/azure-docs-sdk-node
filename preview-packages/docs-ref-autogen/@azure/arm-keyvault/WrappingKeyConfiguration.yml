### YamlMime:TSType
name: WrappingKeyConfiguration
uid: '@azure/arm-keyvault.WrappingKeyConfiguration'
package: '@azure/arm-keyvault'
summary: >-
  Configuration of the external key used to wrap a vault's protection keys.

  Unsupported properties in this configuration and its nested objects are
  rejected.

  Unsupported API versions or a feature that is not enabled result in HTTP 400
  with NotSupported.

  Invalid configurations or attempted replacement result in HTTP 400 with
  BadRequest or InvalidParameter.

  Protection key wrapping throttling results in HTTP 429 with InternalError.

  Other protection key wrapping failures result in HTTP 503 with InternalError.

  Errors use the existing CloudError response.
fullName: WrappingKeyConfiguration
remarks: ''
isDeprecated: false
type: interface
