name: RaiRegoEncoding
uid: '@azure/arm-cognitiveservices.RaiRegoEncoding'
package: '@azure/arm-cognitiveservices'
summary: >-
  The transport encoding of reusable Rego source. \

  [KnownRaiRegoEncoding](xref:@azure/arm-cognitiveservices.KnownRaiRegoEncoding)
  can be used interchangeably with RaiRegoEncoding,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: The Rego property contains plain UTF-8 source. \

  **Base64**: The Rego property contains Base64-encoded UTF-8 source.
