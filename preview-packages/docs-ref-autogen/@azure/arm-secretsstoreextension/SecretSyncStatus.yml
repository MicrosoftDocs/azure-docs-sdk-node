### YamlMime:TSType
name: SecretSyncStatus
uid: '@azure/arm-secretsstoreextension.SecretSyncStatus'
package: '@azure/arm-secretsstoreextension'
summary: >-
  SecretSyncStatus defines the observed state of the secret synchronization
  process.
fullName: SecretSyncStatus
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: conditions
    uid: '@azure/arm-secretsstoreextension.SecretSyncStatus.conditions'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      Conditions represent the status of the secret create and update processes.
      The status can be True, False, or Unknown with various reasons and
      messages explaining the state. Examples of reasons include
      CreateSucceeded, ProviderError, InvalidClusterSecretLabelError,
      InvalidClusterSecretAnnotationError, UnknownError,
      ValidatingAdmissionPolicyCheckFailed, UserInputValidationFailed,
      ControllerSpcError, ControllerInternalError, NoValueChange, and
      ValueChangeOrForceUpdateDetected.
    fullName: conditions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'conditions?: SecretSyncCondition[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-secretsstoreextension.SecretSyncCondition" />[]
  - name: lastSuccessfulSyncTime
    uid: '@azure/arm-secretsstoreextension.SecretSyncStatus.lastSuccessfulSyncTime'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      LastSuccessfulSyncTime represents the last time the secret was retrieved
      from the Provider and updated.
    fullName: lastSuccessfulSyncTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastSuccessfulSyncTime?: Date'
      return:
        description: ''
        type: Date
