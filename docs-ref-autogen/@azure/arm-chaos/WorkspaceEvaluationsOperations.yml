    package: '@azure/arm-chaos'
    summary: >-
      Gets a retained template evaluation by its ID, or uses latest to select
      the most recently durably admitted GA template evaluation. Returns 200
      with the current representation while processing or terminal. Returns 404
      if no qualifying retained result exists; scenario-backed legacy operations
      are not substituted. This is not an LRO polling endpoint.
    fullName: get
    remarks: ''
    isDeprecated: false
