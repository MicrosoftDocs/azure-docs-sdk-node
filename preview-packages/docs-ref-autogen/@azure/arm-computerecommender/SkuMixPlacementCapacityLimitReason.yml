### YamlMime:TSTypeAlias
name: SkuMixPlacementCapacityLimitReason
uid: '@azure/arm-computerecommender.SkuMixPlacementCapacityLimitReason'
package: '@azure/arm-computerecommender'
summary: >-
  Reason the capacity limit for a (VM size, zone) is below the requested
  capacity. \

  [KnownSkuMixPlacementCapacityLimitReason](xref:@azure/arm-computerecommender.KnownSkuMixPlacementCapacityLimitReason)
  can be used interchangeably with SkuMixPlacementCapacityLimitReason,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: The full requested capacity is available for this (VM size, zone). \

  **InsufficientCapacity**: Allocable capacity bounded the limit below the
  requested capacity. \

  **InsufficientQuota**: Quota bounded the limit below the requested capacity.
  Takes precedence when both capacity and quota are insufficient. \

  **SkuNotAvailable**: This VM size is not available in this zone for the
  subscription.
fullName: SkuMixPlacementCapacityLimitReason
remarks: ''
isDeprecated: false
syntax: |
  type SkuMixPlacementCapacityLimitReason = string
