### YamlMime:TSType
name: WorkspaceDiscoveryProperties
uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties'
package: '@azure/arm-chaos'
summary: Model that represents the properties of the workspace discovery.
fullName: WorkspaceDiscoveryProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: completeness
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.completeness'
    package: '@azure/arm-chaos'
    summary: >-
      The coverage established by the accepted discovery result for Azure
      Resource Manager scopes. Present with coverageSummary on newly produced
      snapshot results; absence is not Established or a known zero.
    fullName: completeness
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'completeness?: string'
      return:
        description: ''
        type: string
  - name: coverageSummary
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.coverageSummary'
    package: '@azure/arm-chaos'
    summary: >-
      Coverage facts for the accepted result. Scope counts, resource-occurrence
      counts, warning counts, and returned inventory-row counts are different
      units and must not be combined.
    fullName: coverageSummary
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'coverageSummary?: WorkspaceDiscoveryCoverageSummary'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.WorkspaceDiscoveryCoverageSummary" />
  - name: endTime
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.endTime'
    package: '@azure/arm-chaos'
    summary: The discovery UTC end time.
    fullName: endTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'endTime?: Date'
      return:
        description: ''
        type: Date
  - name: errors
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.errors'
    package: '@azure/arm-chaos'
    summary: System or infrastructure errors encountered during discovery.
    fullName: errors
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'errors?: OperationError[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.OperationError" />[]
  - name: resourceSnapshotId
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.resourceSnapshotId'
    package: '@azure/arm-chaos'
    summary: The resource snapshot ID produced by this discovery.
    fullName: resourceSnapshotId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resourceSnapshotId?: string'
      return:
        description: ''
        type: string
  - name: startTime
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.startTime'
    package: '@azure/arm-chaos'
    summary: The discovery UTC start time.
    fullName: startTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'startTime?: Date'
      return:
        description: ''
        type: Date
  - name: status
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.status'
    package: '@azure/arm-chaos'
    summary: The discovery status.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status: string'
      return:
        description: ''
        type: string
  - name: warnings
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.warnings'
    package: '@azure/arm-chaos'
    summary: >-
      Confirmed access, missing-resource, or access-indeterminate guidance.
      System verification failures are reported in errors, not as permission
      warnings. The returned array may be a subset; use warningsTotalCount and
      warningsTruncated.
    fullName: warnings
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'warnings?: WorkspaceDiscoveryWarningUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.WorkspaceDiscoveryWarningUnion" />[]
  - name: warningsTotalCount
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.warningsTotalCount'
    package: '@azure/arm-chaos'
    summary: >-
      The deduplicated number of warning identities before sampling. Identity
      consists of the expanded scope, affected resource, and reason. Absent
      means no accepted warning population was recorded, not zero warnings.
    fullName: warningsTotalCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'warningsTotalCount?: number'
      return:
        description: ''
        type: number
  - name: warningsTruncated
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.warningsTruncated'
    package: '@azure/arm-chaos'
    summary: >-
      Whether warnings contains fewer entries than warningsTotalCount. False
      requires equality; true requires a smaller returned array. An accepted
      empty warning population is an empty array, zero total, and false.
    fullName: warningsTruncated
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'warningsTruncated?: boolean'
      return:
        description: ''
        type: boolean
  - name: workspaceId
    uid: '@azure/arm-chaos.WorkspaceDiscoveryProperties.workspaceId'
    package: '@azure/arm-chaos'
    summary: The workspace ID this discovery belongs to.
    fullName: workspaceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'workspaceId: string'
      return:
        description: ''
        type: string
