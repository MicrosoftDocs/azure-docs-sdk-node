### YamlMime:TSTypeAlias
name: IndexerPermissionOption
uid: '@azure/search-documents.IndexerPermissionOption'
package: '@azure/search-documents'
summary: >-
  Options with various types of permission data to index. \

  [KnownIndexerPermissionOption](xref:@azure/search-documents.KnownIndexerPermissionOption)
  can be used interchangeably with IndexerPermissionOption,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **userIds**: Indexer to ingest ACL userIds from data source to index. \

  **groupIds**: Indexer to ingest ACL groupIds from data source to index. \

  **rbacScope**: Indexer to ingest Azure RBAC scope from data source to index. \

  **oneLakeParentFolders**: For OneLake data sources only, ingest all ancestor
  folder paths from '/Files' through the immediate parent, excluding the file
  name, as the string collection 'metadata_onelake_parent_folders'. Use indexer
  fieldMappings to map this source metadata to a filterable
  Collection(Edm.String) field with permissionFilter 'oneLakeParentFolders';
  index projections use source '/document/metadata_onelake_parent_folders'. The
  index must also specify 'oneLakeSecuritySource'. \

  **oneLakeLakehouseId**: For OneLake data sources only, ingest the source
  item's lakehouse ID for mapping to an index field with permissionFilter
  'oneLakeLakehouseId'. The index must also specify 'oneLakeSecuritySource'.
fullName: IndexerPermissionOption
remarks: ''
isDeprecated: false
syntax: |
  type IndexerPermissionOption = string
