### YamlMime:TSType
name: SasPolicy
uid: '@azure/arm-storage.SasPolicy'
package: '@azure/arm-storage'
summary: SasPolicy assigned to the storage account.
fullName: SasPolicy
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: expirationAction
    uid: '@azure/arm-storage.SasPolicy.expirationAction'
    package: '@azure/arm-storage'
    summary: >-
      The SAS Expiration Action defines the action to be performed when
      sasPolicy.sasExpirationPeriod is violated. The 'Log' action can be used
      for audit purposes and the 'Block' action can be used to block and deny
      the usage of SAS tokens that do not adhere to the sas policy expiration
      period.
    fullName: expirationAction
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'expirationAction: string'
      return:
        description: ''
        type: string
  - name: requireUserBoundUserDelegationSas
    uid: '@azure/arm-storage.SasPolicy.requireUserBoundUserDelegationSas'
    package: '@azure/arm-storage'
    summary: >-
      Indicates whether user delegation SAS (shared access signature) tokens are
      required to be bound to a specific user. The default interpretation is
      false for this property.
    fullName: requireUserBoundUserDelegationSas
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'requireUserBoundUserDelegationSas?: boolean'
      return:
        description: ''
        type: boolean
  - name: requireUserBoundUserDelegationSasAction
    uid: '@azure/arm-storage.SasPolicy.requireUserBoundUserDelegationSasAction'
    package: '@azure/arm-storage'
    summary: >-
      The action to perform when a user delegation SAS (shared access signature)
      token is not bound to a user as required by
      requireUserBoundUserDelegationSas.
    fullName: requireUserBoundUserDelegationSasAction
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'requireUserBoundUserDelegationSasAction?: string'
      return:
        description: ''
        type: string
  - name: sasExpirationPeriod
    uid: '@azure/arm-storage.SasPolicy.sasExpirationPeriod'
    package: '@azure/arm-storage'
    summary: The SAS expiration period, DD.HH:MM:SS.
    fullName: sasExpirationPeriod
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sasExpirationPeriod: string'
      return:
        description: ''
        type: string
