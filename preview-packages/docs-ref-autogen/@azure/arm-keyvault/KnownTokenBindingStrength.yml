### YamlMime:TSEnum
name: KnownTokenBindingStrength
uid: '@azure/arm-keyvault.KnownTokenBindingStrength'
package: '@azure/arm-keyvault'
summary: >-
  Must be one of the following values "NoValidation", "Unattested",
  "AttestedTrustedLaunch", "AttestedConfidential". Strength of the token binding
  increases with each value in that order.
fullName: KnownTokenBindingStrength
remarks: ''
isDeprecated: false
fields:
  - name: AttestedConfidential
    uid: '@azure/arm-keyvault.KnownTokenBindingStrength.AttestedConfidential'
    package: '@azure/arm-keyvault'
    summary: >-
      Bounded Entra token must originate from a confidential VM with attestation
      proof from the attestation authority like Microsoft Azure Attestation.
  - name: AttestedTrustedLaunch
    uid: '@azure/arm-keyvault.KnownTokenBindingStrength.AttestedTrustedLaunch'
    package: '@azure/arm-keyvault'
    summary: >-
      Bounded Entra token must originate from a trusted launch VM with
      attestation proof from the attestation authority like Microsoft Azure
      Attestation.
  - name: NoValidation
    uid: '@azure/arm-keyvault.KnownTokenBindingStrength.NoValidation'
    package: '@azure/arm-keyvault'
    summary: This is default when token binding is not enabled.
  - name: Unattested
    uid: '@azure/arm-keyvault.KnownTokenBindingStrength.Unattested'
    package: '@azure/arm-keyvault'
    summary: No attestation proof is required for the bounded token.
