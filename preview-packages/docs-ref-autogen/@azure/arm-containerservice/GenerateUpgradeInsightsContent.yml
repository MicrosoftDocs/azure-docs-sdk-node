name: GenerateUpgradeInsightsContent
uid: '@azure/arm-containerservice.GenerateUpgradeInsightsContent'
package: '@azure/arm-containerservice'
summary: >-
  The base request body for the generateUpgradeInsights action. The concrete
  shape is

  determined by `upgradeType`, so that each scope declares exactly the inputs it
  needs:

  the schema itself enforces which of `targetKubernetesVersion`,

  `targetNodeImageVersion`, and `agentPoolName` are required or optional, rather
  than

  relying on documented conventions plus server-side validation. The server
  generates

  (or refreshes) the corresponding UpgradeInsight and returns it.
