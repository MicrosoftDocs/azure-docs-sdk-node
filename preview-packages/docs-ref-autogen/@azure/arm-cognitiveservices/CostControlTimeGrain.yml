name: CostControlTimeGrain
uid: '@azure/arm-cognitiveservices.CostControlTimeGrain'
package: '@azure/arm-cognitiveservices'
summary: >-
  Calendar-aligned UTC renewal intervals. \

  [KnownCostControlTimeGrain](xref:@azure/arm-cognitiveservices.KnownCostControlTimeGrain)
  can be used interchangeably with CostControlTimeGrain,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Daily**: Renews each day at 00:00 UTC. \

  **Weekly**: Renews each Monday at 00:00 UTC. \

  **Monthly**: Renews on the first day of each month at 00:00 UTC.
