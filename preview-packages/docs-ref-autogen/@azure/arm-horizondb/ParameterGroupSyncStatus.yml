### YamlMime:TSTypeAlias
name: ParameterGroupSyncStatus
uid: '@azure/arm-horizondb.ParameterGroupSyncStatus'
package: '@azure/arm-horizondb'
summary: >-
  Indicates synchronization status between a HorizonDB resource and its
  parameter group. \

  [KnownParameterGroupSyncStatus](xref:@azure/arm-horizondb.KnownParameterGroupSyncStatus)
  can be used interchangeably with ParameterGroupSyncStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Applying**: Parameter updates are currently being applied. \

  **InSync**: Parameter values are synchronized and up to date. \

  **FailedToApply**: Applying parameter updates failed. \

  **PendingReboot**: Parameter updates are pending and require a
  customer-initiated pool Restart to take effect. Stop followed by Start and
  scheduled maintenance preserve this status.
fullName: ParameterGroupSyncStatus
remarks: ''
isDeprecated: false
syntax: |
  type ParameterGroupSyncStatus = string
