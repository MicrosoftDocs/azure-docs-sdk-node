### YamlMime:TSType
name: LiveClientEventLiveInputAudioAppendEvent
uid: '@azure/ai-projects.LiveClientEventLiveInputAudioAppendEvent'
package: '@azure/ai-projects'
summary: >-
  Send audio to a Live session over its primary WebSocket. WebRTC and SIP
  sessions send audio over their media transport.
fullName: LiveClientEventLiveInputAudioAppendEvent
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.LiveClientEventLiveInputAudioAppendEvent.audio'
    package: '@azure/ai-projects'
    summary: >-
      Base64-encoded raw audio in the startup-selected format, without a WAV or
      other container header. Primary WebSocket only; media transports use their
      audio track. Audio appends have no acknowledgment. Reflected sideband
      server events reuse this event type and audio key, with no timestamps or
      event_id; their audio is always mono PCM16LE at 24 kHz.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio: string'
      return:
        description: ''
        type: string
  - name: event_id
    uid: '@azure/ai-projects.LiveClientEventLiveInputAudioAppendEvent.event_id'
    package: '@azure/ai-projects'
    summary: A client-generated ID used to correlate this command with server events.
    fullName: event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'event_id?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/ai-projects.LiveClientEventLiveInputAudioAppendEvent.type'
    package: '@azure/ai-projects'
    summary: The Live client event type. Always `session.input_audio.append`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "session.input_audio.append"'
      return:
        description: ''
        type: '"<xref uid="session.input_audio.append" />"'
extends: <xref uid="@azure/ai-projects.LiveClientEvent" />
