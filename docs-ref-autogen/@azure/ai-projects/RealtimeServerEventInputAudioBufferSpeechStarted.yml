### YamlMime:TSType
name: RealtimeServerEventInputAudioBufferSpeechStarted
uid: '@azure/ai-projects.RealtimeServerEventInputAudioBufferSpeechStarted'
package: '@azure/ai-projects'
summary: >-
  Sent by the server when in `server_vad` mode to indicate that speech has been

  detected in the audio buffer. This can happen any time audio is added to the

  buffer (unless speech is already detected). The client may want to use this

  event to interrupt audio playback or provide visual feedback to the user.

  The client should expect to receive a `input_audio_buffer.speech_stopped`
  event

  when speech stops. The `item_id` property is the ID of the user message item

  that will be created when speech stops and will also be included in the

  `input_audio_buffer.speech_stopped` event (unless the client manually commits

  the audio buffer during VAD activation).
fullName: RealtimeServerEventInputAudioBufferSpeechStarted
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio_start_ms
    uid: >-
      @azure/ai-projects.RealtimeServerEventInputAudioBufferSpeechStarted.audio_start_ms
    package: '@azure/ai-projects'
    summary: |-
      Milliseconds from the start of all audio written to the buffer during the
        session when speech was first detected. This will correspond to the
        beginning of audio sent to the model, and thus includes the
        `prefix_padding_ms` configured in the Session.
    fullName: audio_start_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio_start_ms: number'
      return:
        description: ''
        type: number
  - name: event_id
    uid: >-
      @azure/ai-projects.RealtimeServerEventInputAudioBufferSpeechStarted.event_id
    package: '@azure/ai-projects'
    summary: The unique ID of the server event.
    fullName: event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'event_id: string'
      return:
        description: ''
        type: string
  - name: item_id
    uid: >-
      @azure/ai-projects.RealtimeServerEventInputAudioBufferSpeechStarted.item_id
    package: '@azure/ai-projects'
    summary: The ID of the user message item that will be created when speech stops.
    fullName: item_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'item_id: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/ai-projects.RealtimeServerEventInputAudioBufferSpeechStarted.type'
    package: '@azure/ai-projects'
    summary: The event type, must be `input_audio_buffer.speech_started`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "input_audio_buffer.speech_started"'
      return:
        description: ''
        type: '"<xref uid="input_audio_buffer.speech_started" />"'
