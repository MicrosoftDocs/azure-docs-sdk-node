    uid: >-
      @azure/provisioning-storage.types.GeoReplicationStatsView.postFailoverRedundancy
    package: '@azure/provisioning-storage'
    summary: >-
      Read-only output: The redundancy type of the account after an account
      failover is performed.
    fullName: postFailoverRedundancy
    remarks: ''
