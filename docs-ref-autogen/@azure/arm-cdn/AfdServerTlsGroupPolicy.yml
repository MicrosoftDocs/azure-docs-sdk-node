### YamlMime:TSTypeAlias
name: AfdServerTlsGroupPolicy
uid: '@azure/arm-cdn.AfdServerTlsGroupPolicy'
package: '@azure/arm-cdn'
summary: >-
  Server TLS group policy that will be used for Https. Standard and Enhanced are
  service-managed sets; Custom allows specifying serverTlsGroups explicitly. \

  [KnownAfdServerTlsGroupPolicy](xref:@azure/arm-cdn.KnownAfdServerTlsGroupPolicy)
  can be used interchangeably with AfdServerTlsGroupPolicy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Standard**: Uses the standard service-managed set of server TLS groups. \

  **Enhanced**: Uses the enhanced service-managed set of server TLS groups. \

  **Custom**: Uses the server TLS groups specified by serverTlsGroups.
fullName: AfdServerTlsGroupPolicy
remarks: ''
isDeprecated: false
syntax: |
  type AfdServerTlsGroupPolicy = string
