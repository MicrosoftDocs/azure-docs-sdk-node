name: RecurringScheduledActionsDeadlineType
uid: '@azure/arm-compute-bulkactions.RecurringScheduledActionsDeadlineType'
package: '@azure/arm-compute-bulkactions'
summary: >-
  The type of deadline the scheduled action follows for its schedule. \

  [KnownRecurringScheduledActionsDeadlineType](xref:@azure/arm-compute-bulkactions.KnownRecurringScheduledActionsDeadlineType)
  can be used interchangeably with RecurringScheduledActionsDeadlineType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: Default value of Unknown. \

  **InitiateAt**: Initiate the operation at the given deadline. \

  **CompleteBy**: Complete the operation by the given deadline.
fullName: RecurringScheduledActionsDeadlineType
