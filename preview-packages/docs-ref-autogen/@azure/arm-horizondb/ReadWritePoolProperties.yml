### YamlMime:TSType
name: ReadWritePoolProperties
uid: '@azure/arm-horizondb.ReadWritePoolProperties'
package: '@azure/arm-horizondb'
summary: >-
  The pool currently designated to host a HorizonDB cluster's read-write node.
  When a pool is created while the cluster currently has no pools, the service
  automatically designates the new pool as the read-write pool. This behavior
  also applies after all pools that existed earlier in the cluster's lifetime
  have been deleted.
fullName: ReadWritePoolProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: designatedPoolResourceId
    uid: '@azure/arm-horizondb.ReadWritePoolProperties.designatedPoolResourceId'
    package: '@azure/arm-horizondb'
    summary: >-
      The Azure resource ID of the pool designated to host the cluster's
      read-write node. The pool is a child resource of this cluster. When a pool
      is created while the cluster currently has no pools, the service
      automatically sets this property to the new pool's resource ID, including
      when all pools that existed earlier in the cluster's lifetime were
      deleted. This property is absent when no pool is designated, such as after
      clearReadWritePool succeeds.
    fullName: designatedPoolResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'designatedPoolResourceId?: string'
      return:
        description: ''
        type: string
