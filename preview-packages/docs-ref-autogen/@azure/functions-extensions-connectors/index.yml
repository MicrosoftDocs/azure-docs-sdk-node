  - name: connectors
    uid: '@azure/functions-extensions-connectors.connectors'
    package: '@azure/functions-extensions-connectors'
    summary: >+
      First-class connector trigger registrations.


      **Example**


      ```typescript

      import { connectors, GraphClientReceiveMessage } from
      '@azure/functions-extensions-connectors';


      connectors.office365.onNewEmail('OnNewEmail', {
          handler: async (context, invocationContext) => {
              // context.emails is GraphClientReceiveMessage[] — fully typed, no cast needed
              for (const email of context.emails) {
                  invocationContext.log(`Subject: '${email.subject}'.`);
              }
          },
      });

      ```

    remarks: ''
    isDeprecated: false
    syntax:
      content: 'connectors: ConnectorTriggers'
      return:
        description: ''
        type: >-
          <xref uid="@azure/functions-extensions-connectors.ConnectorTriggers"
          />
functions:
  - name: >-
      connectorTrigger<TItem>(string, ConnectorTriggerOptions<TItem,
      ConnectorTriggerContext<TItem>>)
    uid: '@azure/functions-extensions-connectors.connectorTrigger'
    package: '@azure/functions-extensions-connectors'
    summary: >-
      Registers a connector trigger function with the Azure Functions app.


      This wraps <xref:app.connectorTrigger> with a strongly-typed
      [ConnectorTriggerContext](xref:@azure/functions-extensions-connectors.ConnectorTriggerContext)

      that normalises the raw host payload into a consistent `items` array.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function connectorTrigger<TItem>(name: string, options:
        ConnectorTriggerOptions<TItem, ConnectorTriggerContext<TItem>>)
      parameters:
        - id: name
          type: string
          description: The function name used for registration and routing.
        - id: options
          type: >-
            <xref
            uid="@azure/functions-extensions-connectors.ConnectorTriggerOptions"
            />&lt;TItem, ConnectorTriggerContext&lt;TItem&gt;&gt;
          description: The trigger configuration including handler and optional bindings.
