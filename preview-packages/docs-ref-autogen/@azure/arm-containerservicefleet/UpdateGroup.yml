  - name: maxAllowedFailures
    uid: '@azure/arm-containerservicefleet.UpdateGroup.maxAllowedFailures'
    package: '@azure/arm-containerservicefleet'
    summary: >-
      Limits the number of member (cluster) upgrade failures tolerated within
      this group.

      Failures are evaluated over members within this group only.

      Accepts either:
        • A fixed count n, where n >= 0
        • A percentage p%, where 0 <= p <= 100
          Percentage resolves at stage start using: resolvedThreshold = ceil(p * N),
          where p is the percentage as a decimal and N is the number of members in this group at scope start.
      Examples:
        • "3"   --> up to 3 member upgrade failures are tolerated within this group. The 4th failure causes the group to fail.
        • "25%" --> up to 25% of the members in this group can fail their upgrade before the group is considered failed.
    fullName: maxAllowedFailures
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxAllowedFailures?: string'
      return:
        description: ''
        type: string
  - name: maxConcurrency
    uid: '@azure/arm-containerservicefleet.UpdateGroup.maxConcurrency'
    package: '@azure/arm-containerservicefleet'
    summary: >-
      The max number of upgrades that can run concurrently in this specific
      group.

      Acts as a ceiling (and not a quota) for the number of concurrent upgrades
      within the group you want to tolerate at a time.

      Actual concurrency may be lower depending on stage-level concurrency
      limits or individual member conditions.

      Group maxConcurrency has a min value of "1". The max value is min(number
      of clusters in the group, the stage maxConcurrency).

      If no value is provided, defaults to 1.

      Accepts either:
          • A fixed count, e.g. "3"
          • A percentage, e.g. "25%" (range 1–100). Percentage is of the number of clusters in the group.
            Fractional results are rounded down. A minimum of 1 upgrade is enforced.
      Examples:
          • "3" --> up to 3 members from this group upgrade at once.
          • "100%" --> “all at once”, up to all members for this group upgrade at the same time.
          • "25%" --> up to 25% of the members in the group will be upgraded at the same time.
    fullName: maxConcurrency
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxConcurrency?: string'
      return:
        description: ''
        type: string
  - name: memberSelector
    uid: '@azure/arm-containerservicefleet.UpdateGroup.memberSelector'
    package: '@azure/arm-containerservicefleet'
    summary: |-
      Select the members of the group.
        * If specified, label-based selection will override group name based selection,
          and Name is only used as an identifier.
        * If not specified, group name based selection will be used, and Name must match a
          group name of an existing fleet member.
    fullName: memberSelector
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'memberSelector?: MemberSelector'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservicefleet.MemberSelector" />
  - name: name
    uid: '@azure/arm-containerservicefleet.UpdateGroup.name'
    package: '@azure/arm-containerservicefleet'
    summary: |-
      Name of the group.
      It must match a group name of an existing fleet member.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
