### YamlMime:TSTypeAlias
name: UrlFilteringDestinationType
uid: '@azure/arm-networksecurity.UrlFilteringDestinationType'
package: '@azure/arm-networksecurity'
summary: >-
  The type of destination selector for a URL filtering policy. \

  [KnownUrlFilteringDestinationType](xref:@azure/arm-networksecurity.KnownUrlFilteringDestinationType)
  can be used interchangeably with UrlFilteringDestinationType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **WorkloadIdPatterns**: Select destinations by workload ID patterns. \

  **AddressPrefixes**: Select destinations by IP address prefixes in CIDR
  notation. \

  **Fqdns**: Deprecated. Select destinations by fully qualified domain names;
  use rule hostname for new configurations.
fullName: UrlFilteringDestinationType
remarks: ''
isDeprecated: false
syntax: |
  type UrlFilteringDestinationType = string
