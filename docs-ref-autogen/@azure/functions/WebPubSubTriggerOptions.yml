### YamlMime:TSType
name: WebPubSubTriggerOptions
uid: '@azure/functions.WebPubSubTriggerOptions'
package: '@azure/functions'
summary: ''
fullName: WebPubSubTriggerOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: clientProtocols
    uid: '@azure/functions.WebPubSubTriggerOptions.clientProtocols'
    package: '@azure/functions'
    summary: >-
      Optional - Specifies which client protocol can trigger the Web PubSub
      trigger functions

      Default is 'all'
    fullName: clientProtocols
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clientProtocols?: "all" | "webPubSub" | "mqtt"'
      return:
        description: ''
        type: '"all" | "webPubSub" | "mqtt"'
  - name: connection
    uid: '@azure/functions.WebPubSubTriggerOptions.connection'
    package: '@azure/functions'
    summary: >-
      Optional - The name of the app setting that contains the Web PubSub
      Service connection string.

      Defaults to "WebPubSubConnectionString" if not specified.
    fullName: connection
    remarks: ''
    isDeprecated: true
    customDeprecatedMessage: Use `connections` instead.
    syntax:
      content: 'connection?: string'
      return:
        description: ''
        type: string
  - name: connections
    uid: '@azure/functions.WebPubSubTriggerOptions.connections'
    package: '@azure/functions'
    summary: >-
      Optional - The names of app settings or setting collections that specify
      the upstream Azure Web PubSub services

      Used for signature validation

      Defaults to "WebPubSubConnectionString" if not specified
    fullName: connections
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'connections?: string[]'
      return:
        description: ''
        type: string[]
  - name: eventName
    uid: '@azure/functions.WebPubSubTriggerOptions.eventName'
    package: '@azure/functions'
    summary: >-
      Required - The name of the event to which the function should respond

      For system event type: 'connect', 'connected', or 'disconnected'

      For user-defined subprotocols: 'message'

      For system supported subprotocol json.webpubsub.azure.v1: user-defined
      event name
    fullName: eventName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'eventName: string'
      return:
        description: ''
        type: string
  - name: eventType
    uid: '@azure/functions.WebPubSubTriggerOptions.eventType'
    package: '@azure/functions'
    summary: |-
      Required - The type of event to which the function should respond
      Must be either 'user' or 'system'
    fullName: eventType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'eventType: "user" | "system"'
      return:
        description: ''
        type: '"user" | "system"'
  - name: hub
    uid: '@azure/functions.WebPubSubTriggerOptions.hub'
    package: '@azure/functions'
    summary: Required - The name of the hub to which the function is bound
    fullName: hub
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'hub: string'
      return:
        description: ''
        type: string
  - name: name
    uid: '@azure/functions.WebPubSubTriggerOptions.name'
    package: '@azure/functions'
    summary: >-
      Required - The variable name used in function code for the parameter that
      receives the event data
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
