### YamlMime:TSType
name: CostControlRule
uid: '@azure/arm-cognitiveservices.CostControlRule'
package: '@azure/arm-cognitiveservices'
summary: A cost limit and the population to which it applies.
fullName: CostControlRule
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: amount
    uid: '@azure/arm-cognitiveservices.CostControlRule.amount'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The maximum consumption allowed by this rule, expressed in the selected
      unit.
    fullName: amount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'amount: number'
      return:
        description: ''
        type: number
  - name: counterKey
    uid: '@azure/arm-cognitiveservices.CostControlRule.counterKey'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Gets or sets the single built-in dimension used to partition consumption.

      Custom dimensions are retained only for legacy reads and metadata-only
      updates.

      Legacy singleton arrays are accepted on read; serialization always emits
      an object.

      To track another field, create another rule.
    fullName: counterKey
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'counterKey: CostControlDimension'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.CostControlDimension" />
  - name: match
    uid: '@azure/arm-cognitiveservices.CostControlRule.match'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Gets or sets optional match arrays keyed by `agentResourceIds`,
      `identityObjectIds`,

      `sessionIds`, or `projectIds`. Each array contains 1 to 20 non-empty
      values.

      Agent resource IDs use
      /subscriptions/{subscription_guid}/accounts/{account-name}/project/{project-name}/agent/{agent_name}.

      Legacy dotted identity, session, and project keys remain accepted, but
      cannot be combined with their canonical key.
    fullName: match
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'match?: CostControlMatch'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.CostControlMatch" />
  - name: name
    uid: '@azure/arm-cognitiveservices.CostControlRule.name'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The stable rule identifier, unique within the cost control without regard
      to case.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: period
    uid: '@azure/arm-cognitiveservices.CostControlRule.period'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Gets or sets the calendar-aligned UTC renewal period. Authored rules
      support Day, Week, or Month.

      This field is required for recurring rules and must be omitted for
      non-recurring rules.

      Legacy stored minute, hour, and year periods are preserved when reading
      definitions.
    fullName: period
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'period?: string'
      return:
        description: ''
        type: string
  - name: recurring
    uid: '@azure/arm-cognitiveservices.CostControlRule.recurring'
    package: '@azure/arm-cognitiveservices'
    summary: Whether the cost control renews. The default is true.
    fullName: recurring
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recurring?: boolean'
      return:
        description: ''
        type: boolean
  - name: thresholds
    uid: '@azure/arm-cognitiveservices.CostControlRule.thresholds'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Gets or sets optional thresholds. Omitted or empty thresholds track usage
      without explicit actions.

      Authored thresholds must explicitly specify Alert or Block; Audit is
      retained for legacy reads.
    fullName: thresholds
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'thresholds?: CostControlThreshold[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.CostControlThreshold" />[]
  - name: unit
    uid: '@azure/arm-cognitiveservices.CostControlRule.unit'
    package: '@azure/arm-cognitiveservices'
    summary: The unit used for the cost control amount and absolute thresholds.
    fullName: unit
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'unit: string'
      return:
        description: ''
        type: string
