### YamlMime:TSEnum
name: KnownOsDiskType
uid: '@azure/arm-redhatopenshifthcp.KnownOsDiskType'
package: '@azure/arm-redhatopenshifthcp'
summary: |-
  The type of the OS disk
  - https://learn.microsoft.com/en-us/azure/virtual-machines/ephemeral-os-disks
fullName: KnownOsDiskType
remarks: ''
isDeprecated: false
fields:
  - name: Ephemeral
    uid: '@azure/arm-redhatopenshifthcp.KnownOsDiskType.Ephemeral'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      Ephemeral OS disk - stored on local VM cache/temporary storage.
      Provides lower latency and faster node operations.
      Requires VM with sufficient cache size.
  - name: Managed
    uid: '@azure/arm-redhatopenshifthcp.KnownOsDiskType.Managed'
    package: '@azure/arm-redhatopenshifthcp'
    summary: |-
      Managed OS disk - stored as an Azure managed disk (network-attached).
      Default behavior for VMs without sufficient cache.
