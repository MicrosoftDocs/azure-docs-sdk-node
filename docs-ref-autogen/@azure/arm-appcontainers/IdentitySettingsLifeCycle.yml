### YamlMime:TSTypeAlias
name: IdentitySettingsLifeCycle
uid: '@azure/arm-appcontainers.IdentitySettingsLifeCycle'
package: '@azure/arm-appcontainers'
summary: >-
  Use to select the lifecycle stages of a Container App during which the Managed
  Identity should be available. \

  [KnownIdentitySettingsLifeCycle](xref:@azure/arm-appcontainers.KnownIdentitySettingsLifeCycle)
  can be used interchangeably with IdentitySettingsLifeCycle,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **None**: Do not use managed identity during any lifecycle stage. \

  **Main**: Use managed identity during the main stage of the Container App
  lifecycle. \

  **Init**: Use managed identity during the init stage of the Container App
  lifecycle. \

  **All**: Use managed identity during all lifecycle stages of the Container
  App.
fullName: IdentitySettingsLifeCycle
remarks: ''
isDeprecated: false
syntax: |
  type IdentitySettingsLifeCycle = string
