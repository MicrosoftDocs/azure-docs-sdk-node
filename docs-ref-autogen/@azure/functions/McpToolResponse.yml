### YamlMime:TSType
name: McpToolResponse
uid: '@azure/functions.McpToolResponse'
package: '@azure/functions'
summary: >-
  Full MCP tool response with explicit content blocks and optional structured
  content.

  Return an instance of this class from a tool handler when you need full
  control over

  both the content array and `structuredContent`.


  ```typescript

  return new McpToolResponse({
    content: [
      new McpTextContent('Here is the image'),
      new McpImageContent({ data: base64Data, mimeType: 'image/png' })
    ],
    structuredContent: { imageId: 'logo', format: 'png' }
  });

  ```
