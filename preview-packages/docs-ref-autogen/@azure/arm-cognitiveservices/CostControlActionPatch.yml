name: CostControlActionPatch
uid: '@azure/arm-cognitiveservices.CostControlActionPatch'
package: '@azure/arm-cognitiveservices'
summary: >-
  Edits to an existing named blocking action. New actions require all fields
  after merging; supplied fields cannot be null.
fullName: CostControlActionPatch
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: operator
    uid: '@azure/arm-cognitiveservices.CostControlActionPatch.operator'
    package: '@azure/arm-cognitiveservices'
    summary: The threshold comparison. Only `GreaterThanOrEqualTo` is supported.
    fullName: operator
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'operator?: "GreaterThanOrEqualTo"'
      return:
        description: ''
        type: '"GreaterThanOrEqualTo"'
  - name: threshold
    uid: '@azure/arm-cognitiveservices.CostControlActionPatch.threshold'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The positive threshold. Percentages cannot exceed 100; absolute thresholds
      cannot exceed amount and must be whole numbers for Tokens budgets.
    fullName: threshold
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'threshold?: number'
      return:
        description: ''
        type: number
  - name: thresholdType
    uid: '@azure/arm-cognitiveservices.CostControlActionPatch.thresholdType'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Whether threshold is a percentage of amount or an absolute value in the
      budget's unit.
    fullName: thresholdType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'thresholdType?: string'
      return:
        description: ''
        type: string
  - name: type
    uid: '@azure/arm-cognitiveservices.CostControlActionPatch.type'
    package: '@azure/arm-cognitiveservices'
    summary: The enforcement action. Only `Block` is supported.
