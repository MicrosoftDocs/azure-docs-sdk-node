### YamlMime:TSTypeAlias
name: AdministrativeStatus
uid: '@azure/arm-privatetrafficmanager.AdministrativeStatus'
package: '@azure/arm-privatetrafficmanager'
summary: >-
  The status of the endpoint. If the endpoint is Enabled, it is probed for
  endpoint health and is included in the traffic routing method. \

  [KnownAdministrativeStatus](xref:@azure/arm-privatetrafficmanager.KnownAdministrativeStatus)
  can be used interchangeably with AdministrativeStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: The endpoint is enabled and is probed for health. \

  **Disabled**: The endpoint is disabled and is not probed for health.
fullName: AdministrativeStatus
remarks: ''
isDeprecated: false
syntax: |
  type AdministrativeStatus = string
