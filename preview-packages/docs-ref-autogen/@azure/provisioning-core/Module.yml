name: Module
uid: '@azure/provisioning-core.Module'
package: '@azure/provisioning-core'
summary: >-
  Defines a child deployment whose resources are authored directly in the
  module.


  The module inherits its containing stack's parameters. Create resources in the

  module and assign its declared outputs through `outputs`.
