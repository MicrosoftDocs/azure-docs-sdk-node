### YamlMime:TSType
name: AdvisorPropertiesView
uid: '@azure/provisioning-sql.types.AdvisorPropertiesView'
package: '@azure/provisioning-sql'
summary: View type for Properties for a Database, Server or Elastic Pool Advisor.
fullName: AdvisorPropertiesView
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: advisorStatus
    uid: '@azure/provisioning-sql.types.AdvisorPropertiesView.advisorStatus'
    package: '@azure/provisioning-sql'
    summary: >-
      Read-only output: Gets the status of availability of this advisor to
      customers. Possible values are 'GA', 'PublicPreview',
      'LimitedPublicPreview' and 'PrivatePreview'.
    fullName: advisorStatus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'advisorStatus?: Expression<AdvisorStatus>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-sql.types.AdvisorStatus" />&gt;
  - name: autoExecuteStatus
    uid: '@azure/provisioning-sql.types.AdvisorPropertiesView.autoExecuteStatus'
    package: '@azure/provisioning-sql'
    summary: >-
      Gets the auto-execute status (whether to let the system execute the
      recommendations) of this advisor. Possible values are 'Enabled' and
      'Disabled'
    fullName: autoExecuteStatus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'autoExecuteStatus: ExpressionOrValue<AutoExecuteStatus>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;<xref
          uid="@azure/provisioning-sql.types.AutoExecuteStatus" />&gt;
  - name: autoExecuteStatusInheritedFrom
    uid: >-
      @azure/provisioning-sql.types.AdvisorPropertiesView.autoExecuteStatusInheritedFrom
    package: '@azure/provisioning-sql'
    summary: >-
      Read-only output: Gets the resource from which current value of
      auto-execute status is inherited. Auto-execute status can be set on (and
      inherited from) different levels in the resource hierarchy. Possible
      values are 'Subscription', 'Server', 'ElasticPool', 'Database' and
      'Default' (when status is not explicitly set on any level).
    fullName: autoExecuteStatusInheritedFrom
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        autoExecuteStatusInheritedFrom?:
        Expression<AutoExecuteStatusInheritedFrom>
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-sql.types.AutoExecuteStatusInheritedFrom"
          />&gt;
  - name: lastChecked
    uid: '@azure/provisioning-sql.types.AdvisorPropertiesView.lastChecked'
    package: '@azure/provisioning-sql'
    summary: >-
      Read-only output: Gets the time when the current resource was analyzed for
      recommendations by this advisor.
    fullName: lastChecked
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'lastChecked?: Expression<Date>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;Date&gt;
  - name: recommendationsStatus
    uid: '@azure/provisioning-sql.types.AdvisorPropertiesView.recommendationsStatus'
    package: '@azure/provisioning-sql'
    summary: >-
      Read-only output: Gets that status of recommendations for this advisor and
      reason for not having any recommendations. Possible values include, but
      are not limited to, 'Ok' (Recommendations available),LowActivity (not
      enough workload to analyze), 'DbSeemsTuned' (Database is doing well), etc.
    fullName: recommendationsStatus
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recommendationsStatus?: Expression<string>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;string&gt;
  - name: recommendedActions
    uid: '@azure/provisioning-sql.types.AdvisorPropertiesView.recommendedActions'
    package: '@azure/provisioning-sql'
    summary: 'Read-only output: Gets the recommended actions for this advisor.'
    fullName: recommendedActions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'recommendedActions?: Expression<SqlRecommendedAction[]>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-sql.types.SqlRecommendedAction" />[]&gt;
extends: unknown&lt;<xref uid="@azure/provisioning-sql.types.AdvisorProperties" />&gt;
