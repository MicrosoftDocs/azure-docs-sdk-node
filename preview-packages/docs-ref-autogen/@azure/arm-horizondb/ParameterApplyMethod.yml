### YamlMime:TSTypeAlias
name: ParameterApplyMethod
uid: '@azure/arm-horizondb.ParameterApplyMethod'
package: '@azure/arm-horizondb'
summary: >-
  Controls when dynamic parameter changes become effective. Static parameter
  changes always become effective only after a customer-initiated pool Restart.
  Stop followed by Start and scheduled maintenance do not apply pending
  parameter changes. \

  [KnownParameterApplyMethod](xref:@azure/arm-horizondb.KnownParameterApplyMethod)
  can be used interchangeably with ParameterApplyMethod,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Immediate**: Apply dynamic parameter changes immediately. Static parameter
  changes remain pending until a customer-initiated pool Restart. \

  **PendingReboot**: Keep dynamic and static parameter changes pending until a
  customer-initiated pool Restart. Stop followed by Start and scheduled
  maintenance do not apply them.
fullName: ParameterApplyMethod
remarks: ''
isDeprecated: false
syntax: |
  type ParameterApplyMethod = string
