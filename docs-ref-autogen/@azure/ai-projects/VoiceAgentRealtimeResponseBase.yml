    summary: Custom string key-value pairs associated with the response.
    fullName: metadata
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'metadata?: Metadata'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.Metadata" />
  - name: object
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.object'
    package: '@azure/ai-projects'
    summary: The object type, must be `realtime.response`.
    fullName: object
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'object?: "realtime.response"'
      return:
        description: ''
        type: '"<xref uid="realtime.response" />"'
  - name: output_modalities
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.output_modalities'
    package: '@azure/ai-projects'
    summary: >-
      The set of modalities the model used to respond, currently the only
      possible values are
        `[\"audio\"]`, `[\"text\"]`. Audio output always include a text transcript. Setting the
        output to mode `text` will disable audio output from the model.
    fullName: output_modalities
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'output_modalities?: ("text" | "audio")[]'
      return:
        description: ''
        type: ("text" | "audio")[]
  - name: status
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.status'
    package: '@azure/ai-projects'
    summary: |-
      The final status of the response (`completed`, `cancelled`, `failed`, or
        `incomplete`, `in_progress`).
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        status?: "failed" | "in_progress" | "cancelled" | "completed" |
        "incomplete"
      return:
        description: ''
        type: '"failed" | "in_progress" | "cancelled" | "completed" | "incomplete"'
  - name: status_details
    uid: '@azure/ai-projects.VoiceAgentRealtimeResponseBase.status_details'
