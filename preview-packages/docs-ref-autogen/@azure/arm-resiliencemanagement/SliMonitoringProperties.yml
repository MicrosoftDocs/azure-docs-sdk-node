### YamlMime:TSType
name: SliMonitoringProperties
uid: '@azure/arm-resiliencemanagement.SliMonitoringProperties'
package: '@azure/arm-resiliencemanagement'
summary: >-
  SLI monitoring properties of a Drill. At most two SLIs may be selected: at
  most one Availability and one Latency.
fullName: SliMonitoringProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: identity
    uid: '@azure/arm-resiliencemanagement.SliMonitoringProperties.identity'
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      Identity that the Drill uses to read evaluated SLI results from each SLI's
      destination Azure Monitor Workspace. The Drill is granted Monitoring
      Reader on every destination AMW of every selected SLI for this identity.
    fullName: identity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'identity: AssociatedIdentity'
      return:
        description: ''
        type: <xref uid="@azure/arm-resiliencemanagement.AssociatedIdentity" />
  - name: slis
    uid: '@azure/arm-resiliencemanagement.SliMonitoringProperties.slis'
    package: '@azure/arm-resiliencemanagement'
    summary: >-
      The SLIs selected for Drill monitoring. Maximum of two entries: at most
      one Availability and one Latency. Duplicate types or duplicate SLI Ids are
      rejected.
    fullName: slis
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'slis: SliSelection[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-resiliencemanagement.SliSelection" />[]
