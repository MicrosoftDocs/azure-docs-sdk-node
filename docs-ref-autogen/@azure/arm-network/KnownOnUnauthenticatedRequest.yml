### YamlMime:TSEnum
name: KnownOnUnauthenticatedRequest
uid: '@azure/arm-network.KnownOnUnauthenticatedRequest'
package: '@azure/arm-network'
summary: Action to take when a request is unauthenticated.
fullName: KnownOnUnauthenticatedRequest
remarks: ''
isDeprecated: false
fields:
  - name: Allow
    uid: '@azure/arm-network.KnownOnUnauthenticatedRequest.Allow'
    package: '@azure/arm-network'
    summary: Allow the request to pass through without authentication.
  - name: Authenticate
    uid: '@azure/arm-network.KnownOnUnauthenticatedRequest.Authenticate'
    package: '@azure/arm-network'
    summary: >-
      Redirect the request to the authentication provider. Only valid for the
      user authentication capability.
  - name: Deny
    uid: '@azure/arm-network.KnownOnUnauthenticatedRequest.Deny'
    package: '@azure/arm-network'
    summary: Deny the request when no credential is presented.
