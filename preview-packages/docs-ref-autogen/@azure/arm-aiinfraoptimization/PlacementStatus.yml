### YamlMime:TSTypeAlias
name: PlacementStatus
uid: '@azure/arm-aiinfraoptimization.PlacementStatus'
package: '@azure/arm-aiinfraoptimization'
summary: >-
  The outcome of a capacity placement query. \

  [KnownPlacementStatus](xref:@azure/arm-aiinfraoptimization.KnownPlacementStatus)
  can be used interchangeably with PlacementStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Evaluated**: The placement check completed successfully. \

  **Failed**: The placement check failed. \

  **NotEvaluated**: The placement check was not run. \

  **Unsupported**: The placement check is not supported for this option.
fullName: PlacementStatus
remarks: ''
isDeprecated: false
syntax: |
  type PlacementStatus = string
