### YamlMime:TSTypeAlias
name: UpgradeType
uid: '@azure/arm-containerservice.UpgradeType'
package: '@azure/arm-containerservice'
summary: >-
  The type of upgrade an upgrade insight evaluates. Each upgrade insight
  resource

  represents exactly one of these scopes; the scope is encoded in the resource
  name. \

  [KnownUpgradeType](xref:@azure/arm-containerservice.KnownUpgradeType) can be
  used interchangeably with UpgradeType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ControlPlane**: The control plane (managed cluster) Kubernetes version
  upgrade. \

  **AgentPool**: An agent pool (node pool) Kubernetes version upgrade. \

  **NodeImage**: An agent pool node OS image upgrade. NodeImage upgrade insights
  are evaluated per agent pool, mirroring the per-pool node-image upgrade API
  (.../agentPools/{name}), and cover the node OS image only; agent-pool
  Kubernetes version readiness is evaluated separately via the AgentPool or
  ControlPlaneAndAgentPools scopes. \

  **ControlPlaneAndAgentPools**: A combined evaluation of the control plane plus
  every agent pool for a single target Kubernetes version. This scope covers
  Kubernetes version upgrades only; node OS image upgrades are not included and
  must be evaluated separately using the NodeImage scope.
fullName: UpgradeType
remarks: ''
isDeprecated: false
syntax: |
  type UpgradeType = string
