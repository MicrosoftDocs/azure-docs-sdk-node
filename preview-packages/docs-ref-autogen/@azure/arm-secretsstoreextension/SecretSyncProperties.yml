### YamlMime:TSType
name: SecretSyncProperties
uid: '@azure/arm-secretsstoreextension.SecretSyncProperties'
package: '@azure/arm-secretsstoreextension'
summary: The properties of the SecretSync instance.
fullName: SecretSyncProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: forceSynchronization
    uid: '@azure/arm-secretsstoreextension.SecretSyncProperties.forceSynchronization'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      ForceSynchronization can be used to force the secret synchronization. The
      secret synchronization is triggered by changing the value in this field.
      This field is not used to resolve synchronization conflicts.
    fullName: forceSynchronization
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'forceSynchronization?: string'
      return:
        description: ''
        type: string
  - name: kubernetesSecretType
    uid: '@azure/arm-secretsstoreextension.SecretSyncProperties.kubernetesSecretType'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      Type specifies the type of the Kubernetes secret object, e.g. `Opaque` or
      `kubernetes.io/tls`. The controller must have permission to create secrets
      of the specified type.
    fullName: kubernetesSecretType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'kubernetesSecretType: string'
      return:
        description: ''
        type: string
  - name: objectSecretMapping
    uid: '@azure/arm-secretsstoreextension.SecretSyncProperties.objectSecretMapping'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      An array of SecretObjectData that maps secret data from the external
      secret provider to the Kubernetes secret. Each entry specifies the source
      secret in the external provider and the corresponding key in the
      Kubernetes secret.
    fullName: objectSecretMapping
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'objectSecretMapping: KubernetesSecretObjectMapping[]'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-secretsstoreextension.KubernetesSecretObjectMapping"
          />[]
  - name: provisioningState
    uid: '@azure/arm-secretsstoreextension.SecretSyncProperties.provisioningState'
    package: '@azure/arm-secretsstoreextension'
    summary: Provisioning state of the SecretSync instance.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: secretProviderClassName
    uid: >-
      @azure/arm-secretsstoreextension.SecretSyncProperties.secretProviderClassName
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      SecretProviderClassName specifies the name of the SecretProviderClass
      resource, which contains the information needed to access the cloud
      provider secret store.
    fullName: secretProviderClassName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'secretProviderClassName: string'
      return:
        description: ''
        type: string
  - name: serviceAccountName
    uid: '@azure/arm-secretsstoreextension.SecretSyncProperties.serviceAccountName'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      ServiceAccountName specifies the name of the service account used to
      access the cloud provider secret store. The audience field in the service
      account token must be passed as parameter in the controller configuration.
      The audience is used when requesting a token from the API server for the
      service account; the supported audiences are defined by each provider.
    fullName: serviceAccountName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'serviceAccountName: string'
      return:
        description: ''
        type: string
  - name: status
    uid: '@azure/arm-secretsstoreextension.SecretSyncProperties.status'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      SecretSyncStatus defines the observed state of the secret synchronization
      process.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status?: SecretSyncStatus'
      return:
        description: ''
        type: <xref uid="@azure/arm-secretsstoreextension.SecretSyncStatus" />
