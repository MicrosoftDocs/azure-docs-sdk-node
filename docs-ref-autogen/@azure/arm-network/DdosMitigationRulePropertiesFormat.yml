name: DdosMitigationRulePropertiesFormat
uid: '@azure/arm-network.DdosMitigationRulePropertiesFormat'
package: '@azure/arm-network'
summary: >-
  DDoS mitigation rule properties. The service validates that each rule
  specifies at least one applicable default mitigation or source policy override
  and that the default mitigations match the selected trafficScope.
fullName: DdosMitigationRulePropertiesFormat
remarks: ''
isDeprecated: false
type: interface
