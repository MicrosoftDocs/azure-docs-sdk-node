name: WorkbenchProperties
uid: '@azure/arm-cognitiveservices.WorkbenchProperties'
package: '@azure/arm-cognitiveservices'
summary: Properties for a Workbench resource.
fullName: WorkbenchProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: connectivityEndpoints
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.connectivityEndpoints'
    package: '@azure/arm-cognitiveservices'
    summary: Network connectivity endpoints assigned to the workbench.
    fullName: connectivityEndpoints
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'connectivityEndpoints?: ConnectivityEndpoints'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.ConnectivityEndpoints" />
  - name: creationTime
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.creationTime'
    package: '@azure/arm-cognitiveservices'
    summary: Creation time of the workbench resource.
    fullName: creationTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'creationTime?: Date'
      return:
        description: ''
        type: Date
  - name: datasetId
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.datasetId'
    package: '@azure/arm-cognitiveservices'
    summary: The dataset ID to mount for the workbench. Set only during creation.
    fullName: datasetId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'datasetId?: string'
      return:
        description: ''
        type: string
  - name: errors
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.errors'
    package: '@azure/arm-cognitiveservices'
    summary: Error details for the workbench resource.
    fullName: errors
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'errors?: ErrorDetail[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.ErrorDetail" />[]
  - name: gpuCount
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.gpuCount'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      GPU count for GPU pools or vCPU count for CPU pools. Must be 1, 2, 4, 8,
      or a positive multiple of 8. A full-node Azure VM size permits partition
      selection; omission uses the full node. For an exact Singularity instance
      type, a supplied count must match that type; the Singularity.D4_v3
      fallback accepts 4.
    fullName: gpuCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'gpuCount?: number'
      return:
        description: ''
        type: number
  - name: idleTimeBeforeShutdown
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.idleTimeBeforeShutdown'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      ISO 8601 duration before the idle workbench is automatically shut down
      (e.g., 'PT30M').
    fullName: idleTimeBeforeShutdown
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'idleTimeBeforeShutdown?: string'
      return:
        description: ''
        type: string
  - name: imageLink
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.imageLink'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Container image URI (e.g., MCR or ACR image path) for the workbench.
      Immutable after creation.
    fullName: imageLink
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'imageLink: string'
      return:
        description: ''
        type: string
  - name: instanceType
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.instanceType'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      For virtual clusters, an exact Singularity instance type or a full-node
      Azure VM size. If omitted on creation, defaults to Singularity.D4_v3.
      Foundry Compute ignores this override and uses the pool configuration.
      Changing the instance type requires the workbench to be stopped.
    fullName: instanceType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instanceType?: string'
      return:
        description: ''
        type: string
  - name: provisioningState
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.provisioningState'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Provisioning state of the workbench resource, independent of runtime
      lifecycle status.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: sshSettings
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.sshSettings'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      SSH configuration for remote access to the workbench. Set only during
      creation.
    fullName: sshSettings
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sshSettings?: SshSettings'
      return:
        description: ''
        type: <xref uid="@azure/arm-cognitiveservices.SshSettings" />
  - name: status
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.status'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Runtime lifecycle status of the workbench. Independent of resource
      provisioning; start, stop, restart, and runtime health changes do not
      change provisioningState.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status?: string'
      return:
        description: ''
        type: string
  - name: targetClusterId
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.targetClusterId'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Resource ID of the Foundry Compute or virtual cluster that hosts this
      workbench. Changing the cluster requires the workbench to be stopped.
    fullName: targetClusterId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetClusterId: string'
      return:
        description: ''
        type: string
  - name: webEndpoint
    uid: '@azure/arm-cognitiveservices.WorkbenchProperties.webEndpoint'
    package: '@azure/arm-cognitiveservices'
    summary: The web endpoint URL for accessing the workbench.
    fullName: webEndpoint
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'webEndpoint?: string'
      return:
        description: ''
        type: string
