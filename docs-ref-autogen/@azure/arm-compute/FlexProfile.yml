### YamlMime:TSType
name: FlexProfile
uid: '@azure/arm-compute.FlexProfile'
package: '@azure/arm-compute'
summary: >-
  Specifies the FlexProfile for a virtual machine. When set, Azure may deploy a
  compatible alternative VM size based on capacity and placement considerations,
  and the deployed size is returned in hardwareProfile.vmSize. See the
  properties.flexProfile description for the full usage rules, including how it
  interacts with hardwareProfile.vmSize.
fullName: FlexProfile
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: preferredVMSize
    uid: '@azure/arm-compute.FlexProfile.preferredVMSize'
    package: '@azure/arm-compute'
    summary: >-
      Specifies the preferred VM size, for example Standard_D4s_v5. Azure may
      deploy a compatible alternative size based on capacity and placement
      considerations. Supported VM families for FlexProfile may vary by region.
      The recommended way to get the list of available sizes is using these
      APIs: [List all available virtual machine sizes in a
      region](https://docs.microsoft.com/rest/api/compute/resourceskus/list),
      [List all available virtual machine sizes for
      resizing](https://docs.microsoft.com/rest/api/compute/virtualmachines/listavailablesizes).
    fullName: preferredVMSize
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'preferredVMSize: string'
      return:
        description: ''
        type: string
