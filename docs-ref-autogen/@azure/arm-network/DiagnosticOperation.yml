### YamlMime:TSTypeAlias
name: DiagnosticOperation
uid: '@azure/arm-network.DiagnosticOperation'
package: '@azure/arm-network'
summary: >-
  The type of diagnostic operation to run on a connection analyzer. \

  [KnownDiagnosticOperation](xref:@azure/arm-network.KnownDiagnosticOperation)
  can be used interchangeably with DiagnosticOperation,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NextHop**: Determines the next hop for traffic from the source to the
  destination. \

  **NSG**: Evaluates the network security group rules that apply to the traffic.
  \

  **PortScan**: Scans the destination ports to determine their reachability. \

  **ConnectivityCheck**: Performs an end-to-end connectivity check between the
  source and destination. \

  **ExpressRouteDiagnostic**: Runs Express Route specific diagnostics for the
  connection.
fullName: DiagnosticOperation
remarks: ''
isDeprecated: false
syntax: |
  type DiagnosticOperation = string
