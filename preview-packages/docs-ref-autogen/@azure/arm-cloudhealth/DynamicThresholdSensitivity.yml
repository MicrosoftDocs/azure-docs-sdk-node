### YamlMime:TSTypeAlias
name: DynamicThresholdSensitivity
uid: '@azure/arm-cloudhealth.DynamicThresholdSensitivity'
package: '@azure/arm-cloudhealth'
summary: >-
  Sensitivity level for dynamic threshold detection \

  [KnownDynamicThresholdSensitivity](xref:@azure/arm-cloudhealth.KnownDynamicThresholdSensitivity)
  can be used interchangeably with DynamicThresholdSensitivity,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Low**: Low sensitivity — fewer anomalies detected, wider threshold band \

  **Medium**: Medium sensitivity — balanced detection \

  **High**: High sensitivity — more anomalies detected, tighter threshold band
fullName: DynamicThresholdSensitivity
remarks: ''
isDeprecated: false
syntax: |
  type DynamicThresholdSensitivity = string
