name: BlobAccessPointConnectionType
uid: '@azure/arm-storage.BlobAccessPointConnectionType'
package: '@azure/arm-storage'
summary: >-
  The connection type used to reach a non-Azure backing data source. \

  [KnownBlobAccessPointConnectionType](xref:@azure/arm-storage.KnownBlobAccessPointConnectionType)
  can be used interchangeably with BlobAccessPointConnectionType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Endpoint**: Connect directly to a public or otherwise routable endpoint. \

  **PrivateLink**: Connect through Azure Private Link.
