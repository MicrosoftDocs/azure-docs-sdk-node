name: BaseExportModel
uid: '@azure/arm-terraform.BaseExportModel'
package: '@azure/arm-terraform'
summary: The base export parameter
fullName: BaseExportModel
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: excludeAzureResource
    uid: '@azure/arm-terraform.BaseExportModel.excludeAzureResource'
    package: '@azure/arm-terraform'
    summary: >-
      Excludes specified Azure Resource Ids. Case-insensitive Azure Resource ID
      regular expression. Example:
      `["/subscriptions/[0-9a-f-]+/resourceGroups/my-rg.*"]`.
    fullName: excludeAzureResource
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'excludeAzureResource?: string[]'
      return:
        description: ''
        type: string[]
  - name: excludeTerraformResource
    uid: '@azure/arm-terraform.BaseExportModel.excludeTerraformResource'
    package: '@azure/arm-terraform'
    summary: >-
      Excludes specified Terraform resource types. Example:
      `["azurerm_virtual_network"]`.
    fullName: excludeTerraformResource
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'excludeTerraformResource?: string[]'
      return:
        description: ''
        type: string[]
  - name: fullProperties
    uid: '@azure/arm-terraform.BaseExportModel.fullProperties'
    package: '@azure/arm-terraform'
    summary: >-
      Whether to output all non-computed properties in the generated Terraform
      configuration. If set to `false` empty-valued properties will be omitted
      from the configuration. Defaults to `true`.
    fullName: fullProperties
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'fullProperties?: boolean'
      return:
        description: ''
        type: boolean
  - name: includeExtensions
    uid: '@azure/arm-terraform.BaseExportModel.includeExtensions'
    package: '@azure/arm-terraform'
    summary: >-
      Include extension resource types directly associated to the resources
      exported
    fullName: includeExtensions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeExtensions?: string[]'
      return:
        description: ''
        type: string[]
  - name: includeManagedResource
    uid: '@azure/arm-terraform.BaseExportModel.includeManagedResource'
    package: '@azure/arm-terraform'
    summary: >-
      Whether to include internal resources managed by Azure in the exported
      configuration. Defaults to `false`.
    fullName: includeManagedResource
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeManagedResource?: boolean'
      return:
        description: ''
        type: boolean
  - name: includeRoleAssignment
    uid: '@azure/arm-terraform.BaseExportModel.includeRoleAssignment'
    package: '@azure/arm-terraform'
    summary: >-
      Whether to include role assignments assigned to the resources exported.
      Defaults to `false`. This is deprecated in favor of `includeExtensions`
      (with `role-assignments` specified).
    fullName: includeRoleAssignment
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'includeRoleAssignment?: boolean'
      return:
        description: ''
        type: boolean
