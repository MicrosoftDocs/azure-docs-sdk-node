### YamlMime:TSTypeAlias
name: ParameterFormatType
uid: '@azure/arm-chaos.ParameterFormatType'
package: '@azure/arm-chaos'
summary: >-
  Enum of the built-in formats a scenario parameter's value can be validated
  against. \

  [KnownParameterFormatType](xref:@azure/arm-chaos.KnownParameterFormatType) can
  be used interchangeably with ParameterFormatType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **AzureResourceId**: The value must be an Azure resource ID. \

  **AzureRegion**: The value must be an Azure region name. \

  **AzureZone**: The value must be an Azure availability zone. \

  **Duration**: The value must be an ISO 8601 duration. \

  **Json**: The value must be well-formed JSON.
fullName: ParameterFormatType
remarks: ''
isDeprecated: false
syntax: |
  type ParameterFormatType = string
