### YamlMime:TSType
name: ManagedClusterAgentHostingConfiguration
uid: '@azure/arm-cognitiveservices.ManagedClusterAgentHostingConfiguration'
package: '@azure/arm-cognitiveservices'
summary: >-
  Configuration for hosting Foundry agents on an Azure Kubernetes Service
  managed cluster.
fullName: ManagedClusterAgentHostingConfiguration
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: clusterResourceId
    uid: >-
      @azure/arm-cognitiveservices.ManagedClusterAgentHostingConfiguration.clusterResourceId
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Azure resource ID of the customer-owned AKS managed cluster that runs the
      hosted agent workloads.
    fullName: clusterResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'clusterResourceId: string'
      return:
        description: ''
        type: string
  - name: hostingManagementIdentityResourceId
    uid: >-
      @azure/arm-cognitiveservices.ManagedClusterAgentHostingConfiguration.hostingManagementIdentityResourceId
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Azure resource ID of the user-assigned managed identity used by the
      Foundry resource provider to manage the hosting configuration. The
      identity must be assigned to the Foundry account in
      identity.userAssignedIdentities.
    fullName: hostingManagementIdentityResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'hostingManagementIdentityResourceId: string'
      return:
        description: ''
        type: string
  - name: hostingType
    uid: >-
      @azure/arm-cognitiveservices.ManagedClusterAgentHostingConfiguration.hostingType
    package: '@azure/arm-cognitiveservices'
    summary: Type of infrastructure used to host Foundry agents.
    fullName: hostingType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'hostingType: "ManagedCluster"'
      return:
        description: ''
        type: '"ManagedCluster"'
  - name: storageAccountResourceId
    uid: >-
      @azure/arm-cognitiveservices.ManagedClusterAgentHostingConfiguration.storageAccountResourceId
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Azure resource ID of the customer-owned storage account used by the hosted
      agents. The storage account must be in the same subscription and region as
      the AKS cluster, and its data-plane endpoint must be reachable from the
      workload network.
    fullName: storageAccountResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'storageAccountResourceId: string'
      return:
        description: ''
        type: string
  - name: workloadIdentityResourceId
    uid: >-
      @azure/arm-cognitiveservices.ManagedClusterAgentHostingConfiguration.workloadIdentityResourceId
    package: '@azure/arm-cognitiveservices'
    summary: >-
      Azure resource ID of the separate user-assigned managed identity federated
      to service accounts on the AKS cluster. Hosted agents use this identity to
      access the Azure Storage blob data plane.
    fullName: workloadIdentityResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'workloadIdentityResourceId: string'
      return:
        description: ''
        type: string
