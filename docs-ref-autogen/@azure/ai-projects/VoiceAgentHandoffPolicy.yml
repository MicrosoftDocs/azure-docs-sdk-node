### YamlMime:TSType
name: VoiceAgentHandoffPolicy
uid: '@azure/ai-projects.VoiceAgentHandoffPolicy'
package: '@azure/ai-projects'
summary: >-
  Session-wide limits shared by all handoff conditions in one Voice Agent
  session.
fullName: VoiceAgentHandoffPolicy
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: max_attempts
    uid: '@azure/ai-projects.VoiceAgentHandoffPolicy.max_attempts'
    package: '@azure/ai-projects'
    summary: >-
      The maximum number of attempted handoffs, from 1 through 100. If omitted,
      the service uses `max_transfers`. The service requires this value to be
      greater than or equal to `max_transfers`.
    fullName: max_attempts
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_attempts?: number'
      return:
        description: ''
        type: number
  - name: max_transfers
    uid: '@azure/ai-projects.VoiceAgentHandoffPolicy.max_transfers'
    package: '@azure/ai-projects'
    summary: >-
      The maximum number of successfully completed handoffs in one session, from
      1 through 100. If omitted, the service defaults to 16.
    fullName: max_transfers
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'max_transfers?: number'
      return:
        description: ''
        type: number
