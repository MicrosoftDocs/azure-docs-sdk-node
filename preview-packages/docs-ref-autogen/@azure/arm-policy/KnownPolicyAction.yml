### YamlMime:TSEnum
name: KnownPolicyAction
uid: '@azure/arm-policy.KnownPolicyAction'
package: '@azure/arm-policy'
summary: >-
  The effective outcome of the policy evaluation based on both the policy effect
  and evaluation result. Possible values are Unknown, Allow, Audit, Deny, Error.
fullName: KnownPolicyAction
remarks: ''
isDeprecated: false
fields:
  - name: Allow
    uid: '@azure/arm-policy.KnownPolicyAction.Allow'
    package: '@azure/arm-policy'
    summary: The effective outcome of policy evaluation is to allow the request.
  - name: Audit
    uid: '@azure/arm-policy.KnownPolicyAction.Audit'
    package: '@azure/arm-policy'
    summary: The effective outcome of policy evaluation is to audit the request.
  - name: Deny
    uid: '@azure/arm-policy.KnownPolicyAction.Deny'
    package: '@azure/arm-policy'
    summary: The effective outcome of policy evaluation is to deny the request.
  - name: Error
    uid: '@azure/arm-policy.KnownPolicyAction.Error'
    package: '@azure/arm-policy'
    summary: The policy evaluation resulted in an error.
  - name: Unknown
    uid: '@azure/arm-policy.KnownPolicyAction.Unknown'
    package: '@azure/arm-policy'
    summary: The effective outcome of policy evaluation is unknown.
