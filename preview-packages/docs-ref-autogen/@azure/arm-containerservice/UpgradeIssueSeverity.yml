### YamlMime:TSTypeAlias
name: UpgradeIssueSeverity
uid: '@azure/arm-containerservice.UpgradeIssueSeverity'
package: '@azure/arm-containerservice'
summary: >-
  The severity of a detected upgrade issue. \

  [KnownUpgradeIssueSeverity](xref:@azure/arm-containerservice.KnownUpgradeIssueSeverity)
  can be used interchangeably with UpgradeIssueSeverity,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Blocking**: The issue will block the upgrade from completing successfully. \

  **Warning**: The issue may cause problems with client applications or services
  on the cluster but will not necessarily prevent the upgrade from completing.
fullName: UpgradeIssueSeverity
remarks: ''
isDeprecated: false
syntax: |
  type UpgradeIssueSeverity = string
