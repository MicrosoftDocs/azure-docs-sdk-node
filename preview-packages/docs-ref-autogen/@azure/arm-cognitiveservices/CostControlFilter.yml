### YamlMime:TSType
name: CostControlFilter
uid: '@azure/arm-cognitiveservices.CostControlFilter'
package: '@azure/arm-cognitiveservices'
summary: >-
  Traffic selection using exactly one of `additionalInfo` or `and`.
  Additional-info names must be unique across the complete expression.

  Filters narrow the owner's scope and cannot extend a project-owned control to
  another project.

  Values within one condition are alternatives; conditions are combined with
  AND. An agent selection requires an explicit project filter selecting exactly
  one project, including for project-owned controls.
fullName: CostControlFilter
remarks: ''
isDeprecated: false
type: interface
properties:
