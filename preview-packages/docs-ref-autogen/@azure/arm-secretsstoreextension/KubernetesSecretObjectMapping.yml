### YamlMime:TSType
name: KubernetesSecretObjectMapping
uid: '@azure/arm-secretsstoreextension.KubernetesSecretObjectMapping'
package: '@azure/arm-secretsstoreextension'
summary: >-
  Properties defining the mapping between a cloud secret store object and a
  Kubernetes Secret.
fullName: KubernetesSecretObjectMapping
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: sourcePath
    uid: '@azure/arm-secretsstoreextension.KubernetesSecretObjectMapping.sourcePath'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      SourcePath is the identifier for the secret data as defined by the
      external secret provider. This is the key or path to the secret in the
      provider's system, which gets mounted to a specific path in the pod. The
      value should match the name of the secret as specified in the
      SecretProviderClass's objects array.
    fullName: sourcePath
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sourcePath: string'
      return:
        description: ''
        type: string
  - name: targetKey
    uid: '@azure/arm-secretsstoreextension.KubernetesSecretObjectMapping.targetKey'
    package: '@azure/arm-secretsstoreextension'
    summary: >-
      TargetKey is the key in the Kubernetes secret's data field where the
      secret value will be stored. This key is used to reference the secret data
      within Kubernetes, and it should be unique within the secret.
    fullName: targetKey
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetKey: string'
      return:
        description: ''
        type: string
