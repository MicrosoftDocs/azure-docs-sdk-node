### YamlMime:TSType
name: GarAuthenticationUpdateProperties
uid: '@azure/arm-containerregistry.GarAuthenticationUpdateProperties'
package: '@azure/arm-containerregistry'
summary: >-
  Partial Google Artifact Registry (GAR) authentication configuration.

  When authentication is first configured, projectNumber, workloadIdentityPool,
  and

  workloadIdentityProvider must be supplied.
fullName: GarAuthenticationUpdateProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: authenticationType
    uid: >-
      @azure/arm-containerregistry.GarAuthenticationUpdateProperties.authenticationType
    package: '@azure/arm-containerregistry'
    summary: >-
      The discriminator possible values: GoogleArtifactRegistry,
      AwsElasticContainerRegistry, EntraFederatedIdentityCredential
    fullName: authenticationType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'authenticationType: "GoogleArtifactRegistry"'
      return:
        description: ''
        type: '"GoogleArtifactRegistry"'
  - name: projectNumber
    uid: >-
      @azure/arm-containerregistry.GarAuthenticationUpdateProperties.projectNumber
    package: '@azure/arm-containerregistry'
    summary: >-
      The Google Cloud Platform project that is configured for authentication

      Permissions should be granted to
      principal://iam.googleapis.com/projects/{ProjectNumber}/locations/global/workloadIdentityPools/{WorkloadIdentityPool}/providers/{WorkloadIdentityProvider}/subject/{ManagedIdentityPrincipal}
    fullName: projectNumber
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'projectNumber?: string'
      return:
        description: ''
        type: string
  - name: workloadIdentityPool
    uid: >-
      @azure/arm-containerregistry.GarAuthenticationUpdateProperties.workloadIdentityPool
    package: '@azure/arm-containerregistry'
    summary: The Google Cloud platform workload identity pool used for authentication.
    fullName: workloadIdentityPool
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'workloadIdentityPool?: string'
      return:
        description: ''
        type: string
  - name: workloadIdentityProvider
    uid: >-
      @azure/arm-containerregistry.GarAuthenticationUpdateProperties.workloadIdentityProvider
    package: '@azure/arm-containerregistry'
    summary: >-
      The Google Cloud Platform workload identity provider used for
      authentication.
    fullName: workloadIdentityProvider
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'workloadIdentityProvider?: string'
      return:
        description: ''
        type: string
extends: >-
  <xref
  uid="@azure/arm-containerregistry.AdditionalAuthenticationUpdateProperties" />
