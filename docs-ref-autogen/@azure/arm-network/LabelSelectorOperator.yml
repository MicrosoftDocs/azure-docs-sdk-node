### YamlMime:TSTypeAlias
name: LabelSelectorOperator
uid: '@azure/arm-network.LabelSelectorOperator'
package: '@azure/arm-network'
summary: >-
  operator represents a Kubernetes label selector requirement's relationship to
  a set of values. \

  [KnownLabelSelectorOperator](xref:@azure/arm-network.KnownLabelSelectorOperator)
  can be used interchangeably with LabelSelectorOperator,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **In**: The label value must be in the supplied set of values. \

  **NotIn**: The label value must not be in the supplied set of values. \

  **Exists**: The label key must exist, regardless of its value. \

  **DoesNotExist**: The label key must not exist.
fullName: LabelSelectorOperator
remarks: ''
isDeprecated: false
syntax: |
  type LabelSelectorOperator = string
