### YamlMime:TSEnum
name: KnownKnowledgeSourceResultsProcessing
uid: '@azure/search-documents.KnownKnowledgeSourceResultsProcessing'
package: '@azure/search-documents'
summary: Controls whether a knowledge source's results are reranked.
fullName: KnownKnowledgeSourceResultsProcessing
remarks: ''
isDeprecated: false
fields:
  - name: None
    uid: '@azure/search-documents.KnownKnowledgeSourceResultsProcessing.None'
    package: '@azure/search-documents'
    summary: >-
      Results from this knowledge source bypass reranking and preserve their
      underlying order.
  - name: Rerank
    uid: '@azure/search-documents.KnownKnowledgeSourceResultsProcessing.Rerank'
    package: '@azure/search-documents'
    summary: >-
      Results from this knowledge source go through the reranking pipeline. This
      is the default behavior.
