name: VirtualNetworkApplianceCapabilityKind
uid: '@azure/arm-network.VirtualNetworkApplianceCapabilityKind'
package: '@azure/arm-network'
summary: >-
  The kinds of virtual network appliance capability. The value is the top-level
  `kind` discriminator. \

  [KnownVirtualNetworkApplianceCapabilityKind](xref:@azure/arm-network.KnownVirtualNetworkApplianceCapabilityKind)
  can be used interchangeably with VirtualNetworkApplianceCapabilityKind,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **PLGatewayFastpath**: Private Link Gateway FastPath. \

  **PLGateway**: Private Link Gateway (slow-path). \

  **PLIPForwarders**: Private Link IP-forwarders (NVA). \

  **NAT64**: NAT64 (stateful IPv6-to-IPv4 translation).
