properties:
  - name: createOrUpdate
    uid: '@azure/arm-policy.PolicyEnrollmentsOperations.createOrUpdate'
    package: '@azure/arm-policy'
    summary: >-
      This operation creates or updates a policy enrollment with the given scope
      and name. Policy enrollments apply to all resources contained within their
      scope. For example, when you create a policy enrollment at resource group
      scope for a policy assignment at the same or above level, the enrollment
      applies to all applicable resources in the resource group.
    fullName: createOrUpdate
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        createOrUpdate: (scope: string, policyEnrollmentName: string,
        parameters: PolicyEnrollment, options?:
        PolicyEnrollmentsCreateOrUpdateOptionalParams) =>
        Promise<PolicyEnrollment>
      return:
        description: ''
        type: >-
          (scope: string, policyEnrollmentName: string, parameters:
          PolicyEnrollment, options?:
          PolicyEnrollmentsCreateOrUpdateOptionalParams) =&gt;
          Promise&lt;PolicyEnrollment&gt;
  - name: delete
    uid: '@azure/arm-policy.PolicyEnrollmentsOperations.delete'
    package: '@azure/arm-policy'
    summary: >-
      This operation deletes a policy enrollment, given its name and the scope
      it was created in. The scope of a policy enrollment is the part of its ID
      preceding
      '/providers/Microsoft.Authorization/policyEnrollments/{policyEnrollmentName}'.
    fullName: delete
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        delete: (scope: string, policyEnrollmentName: string, options?:
        PolicyEnrollmentsDeleteOptionalParams) => Promise<void>
      return:
        description: ''
        type: >-
          (scope: string, policyEnrollmentName: string, options?:
          PolicyEnrollmentsDeleteOptionalParams) =&gt; Promise&lt;void&gt;
  - name: get
    uid: '@azure/arm-policy.PolicyEnrollmentsOperations.get'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves a single policy enrollment, given its name and
      the scope it was created at.
    fullName: get
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        get: (scope: string, policyEnrollmentName: string, options?:
        PolicyEnrollmentsGetOptionalParams) => Promise<PolicyEnrollment>
      return:
        description: ''
        type: >-
          (scope: string, policyEnrollmentName: string, options?:
          PolicyEnrollmentsGetOptionalParams) =&gt;
          Promise&lt;PolicyEnrollment&gt;
  - name: list
    uid: '@azure/arm-policy.PolicyEnrollmentsOperations.list'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy enrollments associated
      with the given subscription that match the optional given $filter. Valid
      values for $filter are: 'atScope()' or 'atExactScope()'. If $filter is not
      provided, the unfiltered list includes all policy enrollments associated
      with the subscription, including those that apply directly or from
      management groups that contain the given subscription, as well as any
      applied to objects contained within the subscription.
    fullName: list
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        list: (options?: PolicyEnrollmentsListOptionalParams) =>
        PagedAsyncIterableIterator<PolicyEnrollment, PolicyEnrollment[],
        PageSettings>
      return:
        description: ''
        type: >-
          (options?: PolicyEnrollmentsListOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;PolicyEnrollment, PolicyEnrollment[],
          PageSettings&gt;
  - name: listForManagementGroup
    uid: '@azure/arm-policy.PolicyEnrollmentsOperations.listForManagementGroup'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy enrollments applicable to
      the management group that match the given $filter. Valid values for
      $filter are: 'atScope()' or 'atExactScope()'. If $filter=atScope() is
      provided, the returned list includes all policy enrollments that are
      assigned to the management group or the management group's ancestors.
    fullName: listForManagementGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        listForManagementGroup: (managementGroupId: string, options?:
        PolicyEnrollmentsListForManagementGroupOptionalParams) =>
        PagedAsyncIterableIterator<PolicyEnrollment, PolicyEnrollment[],
        PageSettings>
      return:
        description: ''
        type: >-
          (managementGroupId: string, options?:
          PolicyEnrollmentsListForManagementGroupOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;PolicyEnrollment, PolicyEnrollment[],
          PageSettings&gt;
  - name: listForResource
    uid: '@azure/arm-policy.PolicyEnrollmentsOperations.listForResource'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy enrollments associated
      with the specified resource in the given resource group and subscription
      that match the optional given $filter. Valid values for $filter are:
      'atScope()' or 'atExactScope()'. If $filter is not provided, the
      unfiltered list includes all policy enrollments associated with the
      resource, including those that apply directly or from all containing
      scopes, as well as any applied to resources contained within the resource.
      Three parameters plus the resource name are used to identify a specific
      resource. If the resource is not part of a parent resource (the more
      common case), the parent resource path should not be provided (or provided
      as ''). For example a web app could be specified as
      ({resourceProviderNamespace} == 'Microsoft.Web', {parentResourcePath} ==
      '', {resourceType} == 'sites', {resourceName} == 'MyWebApp'). If the
      resource is part of a parent resource, then all parameters should be
      provided. For example a virtual machine DNS name could be specified as
      ({resourceProviderNamespace} == 'Microsoft.Compute', {parentResourcePath}
      == 'virtualMachines/MyVirtualMachine', {resourceType} == 'domainNames',
      {resourceName} == 'MyComputerName'). A convenient alternative to providing
      the namespace and type name separately is to provide both in the
      {resourceType} parameter, format: ({resourceProviderNamespace} == '',
      {parentResourcePath} == '', {resourceType} == 'Microsoft.Web/sites',
      {resourceName} == 'MyWebApp').
    fullName: listForResource
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        listForResource: (resourceGroupName: string, resourceProviderNamespace:
        string, parentResourcePath: string, resourceType: string, resourceName:
        string, options?: PolicyEnrollmentsListForResourceOptionalParams) =>
        PagedAsyncIterableIterator<PolicyEnrollment, PolicyEnrollment[],
        PageSettings>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, resourceProviderNamespace: string,
          parentResourcePath: string, resourceType: string, resourceName:
          string, options?: PolicyEnrollmentsListForResourceOptionalParams)
          =&gt; PagedAsyncIterableIterator&lt;PolicyEnrollment,
          PolicyEnrollment[], PageSettings&gt;
  - name: listForResourceGroup
    uid: '@azure/arm-policy.PolicyEnrollmentsOperations.listForResourceGroup'
    package: '@azure/arm-policy'
    summary: >-
      This operation retrieves the list of all policy enrollments associated
      with the given resource group in the given subscription that match the
      optional given $filter. Valid values for $filter are: 'atScope()' or
      'atExactScope()'. If $filter is not provided, the unfiltered list includes
      all policy enrollments associated with the resource group, including those
      that apply directly or apply from containing scopes, as well as any
      applied to resources contained within the resource group.
    fullName: listForResourceGroup
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        listForResourceGroup: (resourceGroupName: string, options?:
        PolicyEnrollmentsListForResourceGroupOptionalParams) =>
        PagedAsyncIterableIterator<PolicyEnrollment, PolicyEnrollment[],
        PageSettings>
      return:
        description: ''
        type: >-
          (resourceGroupName: string, options?:
          PolicyEnrollmentsListForResourceGroupOptionalParams) =&gt;
          PagedAsyncIterableIterator&lt;PolicyEnrollment, PolicyEnrollment[],
          PageSettings&gt;
