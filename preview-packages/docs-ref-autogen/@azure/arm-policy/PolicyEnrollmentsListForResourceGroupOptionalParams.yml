properties:
  - name: filter
    uid: >-
      @azure/arm-policy.PolicyEnrollmentsListForResourceGroupOptionalParams.filter
    package: '@azure/arm-policy'
    summary: >-
      The filter to apply on the operation. Valid values for $filter are:
      'atScope()' or 'atExactScope()'. If $filter is not provided, no filtering
      is performed. If $filter is not provided, the unfiltered list includes all
      policy enrollments associated with the scope, including those that apply
      directly or from containing scopes. If $filter=atScope() is provided, the
      returned list includes all policy enrollments that apply to the scope,
      which is everything in the unfiltered list except those applied to
      sub-scopes contained within the given scope. If $filter=atExactScope() is
      provided, the returned list only includes all policy enrollments that
      apply at the given scope.
    fullName: filter
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'filter?: string'
      return:
        description: ''
        type: string
