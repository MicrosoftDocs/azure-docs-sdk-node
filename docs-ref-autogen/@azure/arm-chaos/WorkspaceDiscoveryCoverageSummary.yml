name: WorkspaceDiscoveryCoverageSummary
uid: '@azure/arm-chaos.WorkspaceDiscoveryCoverageSummary'
package: '@azure/arm-chaos'
summary: >-
  Aggregate coverage of expanded Azure Resource Manager scope occurrences.
  Non-Azure Resource Manager discovery ingress is outside this population.
  VerificationIncomplete dominates KnownPartial, then BaselineUnknown, then
  Established.
fullName: WorkspaceDiscoveryCoverageSummary
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: resources
    uid: '@azure/arm-chaos.WorkspaceDiscoveryCoverageSummary.resources'
    package: '@azure/arm-chaos'
    summary: >-
      Required resource occurrences only from scopes with a known complete
      expected inventory set. Absent exactly when knownExpectedSetCount is zero.
      Unknown is not a known empty set.
    fullName: resources
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resources?: WorkspaceDiscoveryResourceCoverageSummary'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-chaos.WorkspaceDiscoveryResourceCoverageSummary"
          />
  - name: scopes
    uid: '@azure/arm-chaos.WorkspaceDiscoveryCoverageSummary.scopes'
    package: '@azure/arm-chaos'
    summary: The scope-occurrence coverage partitions for this discovery result.
    fullName: scopes
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'scopes: WorkspaceDiscoveryScopeCoverageSummary'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.WorkspaceDiscoveryScopeCoverageSummary" />
