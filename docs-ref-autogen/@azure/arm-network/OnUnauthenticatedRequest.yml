### YamlMime:TSTypeAlias
name: OnUnauthenticatedRequest
uid: '@azure/arm-network.OnUnauthenticatedRequest'
package: '@azure/arm-network'
summary: >-
  Action to take when a request is unauthenticated. \

  [KnownOnUnauthenticatedRequest](xref:@azure/arm-network.KnownOnUnauthenticatedRequest)
  can be used interchangeably with OnUnauthenticatedRequest,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **allow**: Allow the request to pass through without authentication. \

  **authenticate**: Redirect the request to the authentication provider. Only
  valid for the user authentication capability. \

  **deny**: Deny the request when no credential is presented.
fullName: OnUnauthenticatedRequest
remarks: ''
isDeprecated: false
syntax: |
  type OnUnauthenticatedRequest = string
