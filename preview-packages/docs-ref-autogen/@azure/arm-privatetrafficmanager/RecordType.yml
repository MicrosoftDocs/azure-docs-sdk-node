name: RecordType
uid: '@azure/arm-privatetrafficmanager.RecordType'
package: '@azure/arm-privatetrafficmanager'
summary: >-
  The record type of the Traffic Manager profile. \

  [KnownRecordType](xref:@azure/arm-privatetrafficmanager.KnownRecordType) can
  be used interchangeably with RecordType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **A**: IPv4 address record type for DNS resolution. \

  **AAAA**: IPv6 address record type for DNS resolution. \

  **CNAME**: Canonical name record type that maps an alias to a domain name.
fullName: RecordType
remarks: ''
