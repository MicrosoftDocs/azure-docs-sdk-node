### YamlMime:TSType
name: JWTAuthenticatorProperties
uid: '@azure/arm-containerservice.JWTAuthenticatorProperties'
package: '@azure/arm-containerservice'
summary: >-
  The properties of JWTAuthenticator. For details on how to configure the
  properties of a JWT authenticator, please refer to the Kubernetes
  documentation:
  https://kubernetes.io/docs/reference/access-authn-authz/authentication/#using-authentication-configuration.
  Please note that not all fields available in the Kubernetes documentation are
  supported by AKS. For troubleshooting, please see
  https://aka.ms/aks-external-issuers-docs.
fullName: JWTAuthenticatorProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: certificateAuthorityBundle
    uid: >-
      @azure/arm-containerservice.JWTAuthenticatorProperties.certificateAuthorityBundle
    package: '@azure/arm-containerservice'
    summary: >-
      PEM-encoded CA certificate bundle used to validate the connection when
      fetching discovery information. Use this for issuer endpoints that use
      private certificate authorities

      or environments where TLS inspection is performed.


      The bundle must contain only CERTIFICATE PEM blocks, up to 10 CA
      certificates, and must be no larger than 20 KB in total. Include all CA
      certificates needed to validate

      the issuer endpoint's TLS certificate. Certificate revocation checking is
      not supported.


      If provided, only these CAs are trusted instead of the well-known root
      CAs.

      If not provided and the managed cluster's
      properties.securityProfile.customCATrustCertificates is set, those
      certificates will be used instead. Otherwise, only the well-known

      root CAs are trusted.
    fullName: certificateAuthorityBundle
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'certificateAuthorityBundle?: string'
      return:
        description: ''
        type: string
  - name: claimMappings
    uid: '@azure/arm-containerservice.JWTAuthenticatorProperties.claimMappings'
    package: '@azure/arm-containerservice'
    summary: >-
      The mappings that define how user attributes are extracted from the token
      claims.
    fullName: claimMappings
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'claimMappings: JWTAuthenticatorClaimMappings'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-containerservice.JWTAuthenticatorClaimMappings"
          />
  - name: claimValidationRules
    uid: >-
      @azure/arm-containerservice.JWTAuthenticatorProperties.claimValidationRules
    package: '@azure/arm-containerservice'
    summary: >-
      The rules that are applied to validate token claims to authenticate users.
      All the expressions must evaluate to true for validation to succeed.
    fullName: claimValidationRules
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'claimValidationRules?: JWTAuthenticatorValidationRule[]'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-containerservice.JWTAuthenticatorValidationRule"
          />[]
  - name: issuer
    uid: '@azure/arm-containerservice.JWTAuthenticatorProperties.issuer'
    package: '@azure/arm-containerservice'
    summary: The JWT OIDC issuer details.
    fullName: issuer
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'issuer: JWTAuthenticatorIssuer'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.JWTAuthenticatorIssuer" />
  - name: provisioningState
    uid: '@azure/arm-containerservice.JWTAuthenticatorProperties.provisioningState'
    package: '@azure/arm-containerservice'
    summary: The current provisioning state of the JWT authenticator.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: userValidationRules
    uid: '@azure/arm-containerservice.JWTAuthenticatorProperties.userValidationRules'
    package: '@azure/arm-containerservice'
    summary: >-
      The rules that are applied to the mapped user before completing
      authentication. All the expressions must evaluate to true for validation
      to succeed.
    fullName: userValidationRules
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'userValidationRules?: JWTAuthenticatorValidationRule[]'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-containerservice.JWTAuthenticatorValidationRule"
          />[]
