### YamlMime:TSEnum
name: KnownExternalConnectionSetupState
uid: '@azure/arm-netapp.KnownExternalConnectionSetupState'
package: '@azure/arm-netapp'
summary: >-
  Provides a machine-readable value for the status of the external connection
  setup.
fullName: KnownExternalConnectionSetupState
remarks: ''
isDeprecated: false
fields:
  - name: ClusterPeerPending
    uid: '@azure/arm-netapp.KnownExternalConnectionSetupState.ClusterPeerPending'
    package: '@azure/arm-netapp'
    summary: >-
      The peering needs to be accepted on your cluster before the setup can
      proceed. see the command in 'SetupInformation.command' property
  - name: NoActionRequired
    uid: '@azure/arm-netapp.KnownExternalConnectionSetupState.NoActionRequired'
    package: '@azure/arm-netapp'
    summary: External cache connection setup is complete.
  - name: VServerPeerRequired
    uid: '@azure/arm-netapp.KnownExternalConnectionSetupState.VServerPeerRequired'
    package: '@azure/arm-netapp'
    summary: >-
      Need to accept the returned 'vserver peer accept' command on your cluster
      to finish SVM peering. See the command in 'SetupInformation.command'
      property
