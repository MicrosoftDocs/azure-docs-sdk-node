### YamlMime:TSType
name: ResourceTargetingCriteria
uid: '@azure/arm-chaos.ResourceTargetingCriteria'
package: '@azure/arm-chaos'
summary: |-
  Model that represents a set of targeting criteria for resource selection.
  Used on both the include and exclude sides of ResourceTargeting.

  All dimensions use unified null/empty semantics:
  - Null or omitted means "no constraint" (this dimension is inactive).
  - Empty array is treated the same as null (no constraint).
  - Non-empty array means the dimension is active.
fullName: ResourceTargetingCriteria
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: locations
    uid: '@azure/arm-chaos.ResourceTargetingCriteria.locations'
    package: '@azure/arm-chaos'
    summary: |-
      Array of Azure location strings (e.g., "eastus", "westeurope", "global").
      Case-insensitive, normalized form only (e.g., "eastus" not "East US").
    fullName: locations
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'locations?: string[]'
      return:
        description: ''
        type: string[]
  - name: physicalZones
    uid: '@azure/arm-chaos.ResourceTargetingCriteria.physicalZones'
    package: '@azure/arm-chaos'
    summary: >-
      Array of physical datacenter zone identifiers in `{region}-az{N}` format

      (e.g., "westus2-az1"). Resolved to logical zones per-subscription at
      execution time.


      Mutually exclusive with `zones` — set one or the other, not both.
    fullName: physicalZones
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'physicalZones?: string[]'
      return:
        description: ''
        type: string[]
  - name: resources
    uid: '@azure/arm-chaos.ResourceTargetingCriteria.resources'
    package: '@azure/arm-chaos'
    summary: Array of fully qualified Azure resource IDs. Case-insensitive equality.
    fullName: resources
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'resources?: string[]'
      return:
        description: ''
        type: string[]
  - name: tags
    uid: '@azure/arm-chaos.ResourceTargetingCriteria.tags'
    package: '@azure/arm-chaos'
    summary: >-
      Array of tag key-value pairs for filtering by Azure resource tags.

      Key and value are matched case-insensitively. Use "*" as value to match
      any value for a key.
    fullName: tags
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'tags?: KeyValuePair[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-chaos.KeyValuePair" />[]
  - name: types
    uid: '@azure/arm-chaos.ResourceTargetingCriteria.types'
    package: '@azure/arm-chaos'
    summary: >-
      Array of Azure resource type strings (e.g.,
      "Microsoft.Compute/virtualMachines").

      Case-insensitive equality. Supports trailing wildcard (e.g.,
      "Microsoft.Compute/*").
    fullName: types
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'types?: string[]'
      return:
        description: ''
        type: string[]
  - name: zones
    uid: '@azure/arm-chaos.ResourceTargetingCriteria.zones'
    package: '@azure/arm-chaos'
    summary: >-
      Array of logical availability zone identifiers (e.g., "1", "2", "3",
      "zone-redundant").


      Mutually exclusive with `physicalZones` — set one or the other, not both.

      When set, `locations` must also be set on the same side (zone IDs are only
      meaningful within a region).
    fullName: zones
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'zones?: string[]'
      return:
        description: ''
        type: string[]
