name: KnownHighAvailabilityMode
uid: '@azure/arm-postgresql-flexible.KnownHighAvailabilityMode'
package: '@azure/arm-postgresql-flexible'
summary: Mode of high availability supported for this compute.
fullName: KnownHighAvailabilityMode
remarks: ''
isDeprecated: false
fields:
  - name: SameZone
    uid: '@azure/arm-postgresql-flexible.KnownHighAvailabilityMode.SameZone'
    package: '@azure/arm-postgresql-flexible'
    summary: >-
      High availability is supported for this compute, with standby server in
      the same availability zone as the primary.
  - name: ZoneRedundant
    uid: '@azure/arm-postgresql-flexible.KnownHighAvailabilityMode.ZoneRedundant'
    package: '@azure/arm-postgresql-flexible'
    summary: >-
      High availability is supported for this compute, with standby server in a
      different availability zone than that of the primary.
