properties:
  - name: isAzureMonitorTargetEnabled
    uid: >-
      @azure/provisioning-sql.types.ServerDevOpsAuditSettingsPropertiesInput.isAzureMonitorTargetEnabled
    package: '@azure/provisioning-sql'
    summary: >-
      Specifies whether DevOps audit events are sent to Azure Monitor.

      In order to send the events to Azure Monitor, specify 'State' as 'Enabled'
      and 'IsAzureMonitorTargetEnabled' as true.


      When using REST API to configure DevOps audit, Diagnostic Settings with
      'DevOpsOperationsAudit' diagnostic logs category on the master database
      should be also created.


      Diagnostic Settings URI format:

      PUT
      https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.Sql/servers/{serverName}/databases/master/providers/microsoft.insights/diagnosticSettings/{settingsName}?api-version=2017-05-01-preview


      For more information, see [Diagnostic Settings REST
      API](https://go.microsoft.com/fwlink/?linkid=2033207)

      or [Diagnostic Settings
      PowerShell](https://go.microsoft.com/fwlink/?linkid=2033043)
    fullName: isAzureMonitorTargetEnabled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'isAzureMonitorTargetEnabled?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: isManagedIdentityInUse
    uid: >-
      @azure/provisioning-sql.types.ServerDevOpsAuditSettingsPropertiesInput.isManagedIdentityInUse
    package: '@azure/provisioning-sql'
    summary: Specifies whether Managed Identity is used to access blob storage
    fullName: isManagedIdentityInUse
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'isManagedIdentityInUse?: ExpressionOrValue<boolean>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;boolean&gt;
  - name: state
    uid: >-
      @azure/provisioning-sql.types.ServerDevOpsAuditSettingsPropertiesInput.state
    package: '@azure/provisioning-sql'
    summary: >-
      Specifies the state of the audit. If state is Enabled, storageEndpoint or
      isAzureMonitorTargetEnabled are required.
    fullName: state
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'state: ExpressionOrValue<BlobAuditingPolicyState>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;<xref
          uid="@azure/provisioning-sql.types.BlobAuditingPolicyState" />&gt;
  - name: storageAccountAccessKey
    uid: >-
      @azure/provisioning-sql.types.ServerDevOpsAuditSettingsPropertiesInput.storageAccountAccessKey
    package: '@azure/provisioning-sql'
    summary: >-
      Specifies the identifier key of the auditing storage account.

      If state is Enabled and storageEndpoint is specified, not specifying the
      storageAccountAccessKey will use SQL server system-assigned managed
      identity to access the storage.

      Prerequisites for using managed identity authentication:

      1. Assign SQL Server a system-assigned managed identity in Azure Active
      Directory (AAD).

      2. Grant SQL Server identity access to the storage account by adding
      'Storage Blob Data Contributor' RBAC role to the server identity.

      For more information, see [Auditing to storage using Managed Identity
      authentication](https://go.microsoft.com/fwlink/?linkid=2114355)
    fullName: storageAccountAccessKey
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'storageAccountAccessKey?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: storageAccountSubscriptionId
    uid: >-
      @azure/provisioning-sql.types.ServerDevOpsAuditSettingsPropertiesInput.storageAccountSubscriptionId
