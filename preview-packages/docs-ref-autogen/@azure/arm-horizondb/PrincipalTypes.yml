### YamlMime:TSTypeAlias
name: PrincipalTypes
uid: '@azure/arm-horizondb.PrincipalTypes'
package: '@azure/arm-horizondb'
summary: >-
  The type of the Entra ID principal. \

  [KnownPrincipalTypes](xref:@azure/arm-horizondb.KnownPrincipalTypes) can be
  used interchangeably with PrincipalTypes,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: Unknown or unrecognized type (internal only, not accepted in
  requests). \

  **User**: An Entra ID user account (UPN-based principal). \

  **Group**: An Entra ID security group. All members of the group inherit admin
  privileges. \

  **ServicePrincipal**: An Entra ID application / service principal (used for
  automated workloads).
fullName: PrincipalTypes
remarks: ''
isDeprecated: false
syntax: |
  type PrincipalTypes = string
