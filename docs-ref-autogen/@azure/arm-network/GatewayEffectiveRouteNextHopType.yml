name: GatewayEffectiveRouteNextHopType
uid: '@azure/arm-network.GatewayEffectiveRouteNextHopType'
package: '@azure/arm-network'
summary: >-
  The next hop type of a gateway effective route. \

  [KnownGatewayEffectiveRouteNextHopType](xref:@azure/arm-network.KnownGatewayEffectiveRouteNextHopType)
  can be used interchangeably with GatewayEffectiveRouteNextHopType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Tunnel**: The next hop is a VPN tunnel. \

  **VirtualNetwork**: The next hop is within the local virtual network. \

  **Unknown**: The next hop type could not be determined.
fullName: GatewayEffectiveRouteNextHopType
remarks: ''
