### YamlMime:TSTypeAlias
name: ProcessorMode
uid: '@azure/arm-compute.ProcessorMode'
package: '@azure/arm-compute'
summary: >-
  Specifies the processor frequency behavior for the virtual machine. See each
  member for the behavior it controls. \

  [KnownProcessorMode](xref:@azure/arm-compute.KnownProcessorMode) can be used
  interchangeably with ProcessorMode,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Deterministic**: Ensures predictable and consistent processor frequency at
  the base/nominal level. Turbo/Boost is disabled. \

  **Opportunistic**: Allows higher frequency bursts when thermal and power
  headroom permits.
fullName: ProcessorMode
remarks: ''
isDeprecated: false
syntax: |
  type ProcessorMode = string
