### YamlMime:TSTypeAlias
name: PatchOperationStatus
uid: '@azure/arm-hybridcompute.PatchOperationStatus'
package: '@azure/arm-hybridcompute'
summary: >-
  The overall success or failure status of the operation. It remains
  "InProgress" until the operation completes. At that point it will become
  "Unknown", "Failed", "Succeeded", or "CompletedWithWarnings." \

  [KnownPatchOperationStatus](xref:@azure/arm-hybridcompute.KnownPatchOperationStatus)
  can be used interchangeably with PatchOperationStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Unknown**: Unknown \

  **InProgress**: InProgress \

  **Failed**: Failed \

  **Succeeded**: Succeeded \

  **CompletedWithWarnings**: CompletedWithWarnings
fullName: PatchOperationStatus
remarks: ''
isDeprecated: false
syntax: |
  type PatchOperationStatus = string
