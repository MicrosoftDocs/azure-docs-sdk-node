    remarks: ''
    isDeprecated: false
    syntax:
      content: 'metadata?: any'
      return:
        description: ''
        type: any
  - name: provisionedBandwidthMibps
    uid: >-
      @azure/provisioning-storage.types.FileSharePropertiesInput.provisionedBandwidthMibps
    package: '@azure/provisioning-storage'
    summary: >-
      The provisioned bandwidth of the share, in mebibytes per second. This
      property is only for file shares created under Files Provisioned v2
      account type. Please refer to the GetFileServiceUsage API response for the
      minimum and maximum allowed value for provisioned bandwidth.
