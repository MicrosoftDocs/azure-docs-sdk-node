### YamlMime:TSType
name: VoiceAgentLiveDefinition
uid: '@azure/ai-projects.VoiceAgentLiveDefinition'
package: '@azure/ai-projects'
summary: >-
  The Live voice agent definition. Its configuration (model, instructions,
  audio, and delegation) drives a

  managed speech-to-speech experience using a Foundry GPT Live deployment.
  Establish Live voice sessions through

  `GET /agents/{agent_name}/endpoint/protocols/voice/live/sessions`. Every
  create or update produces a new immutable version.
fullName: VoiceAgentLiveDefinition
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.VoiceAgentLiveDefinition.audio'
    package: '@azure/ai-projects'
    summary: Startup audio formats and output voice.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio?: LiveInitialSessionAudioParam'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveInitialSessionAudioParam" />
  - name: delegation
    uid: '@azure/ai-projects.VoiceAgentLiveDefinition.delegation'
    package: '@azure/ai-projects'
    summary: >-
      Delegation settings. Omit for client mode. responses.model is a backend
      deployment name in the Live resource, not a model catalog ID.
    fullName: delegation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delegation?: VoiceAgentLiveDelegationUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentLiveDelegationUnion" />
  - name: greeting
    uid: '@azure/ai-projects.VoiceAgentLiveDefinition.greeting'
    package: '@azure/ai-projects'
    summary: >-
      Template-only startup greeting, rendered with session structured inputs.
      Foundry-only; not sent in native Live settings.
    fullName: greeting
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'greeting?: VoiceAgentTemplateGreetingConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentTemplateGreetingConfig" />
  - name: model
    uid: '@azure/ai-projects.VoiceAgentLiveDefinition.model'
    package: '@azure/ai-projects'
    summary: The GPT Live deployment name.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model: string'
      return:
        description: ''
        type: string
  - name: model_type
    uid: '@azure/ai-projects.VoiceAgentLiveDefinition.model_type'
    package: '@azure/ai-projects'
    summary: Uses a Foundry model deployment.
    fullName: model_type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model_type: "self_deployed"'
      return:
        description: ''
        type: '"self_deployed"'
  - name: sub_protocol
    uid: '@azure/ai-projects.VoiceAgentLiveDefinition.sub_protocol'
    package: '@azure/ai-projects'
    summary: Selects the Live protocol.
    fullName: sub_protocol
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sub_protocol: "live"'
      return:
        description: ''
        type: '"live"'
