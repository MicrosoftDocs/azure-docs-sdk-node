### YamlMime:TSTypeAlias
name: VoiceAgentNoiseReductionType
uid: '@azure/ai-projects.VoiceAgentNoiseReductionType'
package: '@azure/ai-projects'
summary: >-
  The input audio noise reduction mode.

  - `azure_deep_noise_suppression_headset`: Azure headset-optimized noise
  suppression for local voice activity detection. Optimized for low-sample-rate
  audio, including 8 kHz telephony audio. Enhances detection audio without
  changing the audio used for recognition. The mode is not restricted to headset
  devices.

  - `azure_personal_noise_suppression`: Azure personalized noise suppression for
  local voice activity detection. Starts with headset suppression and
  personalizes detection after automatic speaker enrollment. Recognition audio
  is unchanged; headset suppression remains active when personalization is
  unavailable.
fullName: VoiceAgentNoiseReductionType
remarks: ''
isDeprecated: false
syntax: |
  type VoiceAgentNoiseReductionType =
    | "near_field"
    | "far_field"
    | "azure_deep_noise_suppression"
    | "azure_deep_noise_suppression_headset"
    | "azure_personal_noise_suppression"
