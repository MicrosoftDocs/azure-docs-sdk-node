name: ImagePullPolicy
uid: '@azure/arm-networksecurity.ImagePullPolicy'
package: '@azure/arm-networksecurity'
summary: >-
  The image pull policy for a sandbox workload container image. \

  [KnownImagePullPolicy](xref:@azure/arm-networksecurity.KnownImagePullPolicy)
  can be used interchangeably with ImagePullPolicy,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Always**: Always pull the image. \

  **IfNotPresent**: Pull the image only if it is not already present on the
  host.
