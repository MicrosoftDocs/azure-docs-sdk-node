name: InternalClientOptions
uid: '@azure-rest/core-client.InternalClientOptions'
package: '@azure-rest/core-client'
summary: >-
  Options for [getClient](xref:@azure-rest/core-client.getClient_1) that are
  intended for use by generated clients.

  These are grouped under <xref:ClientOptions.internal> so they are not

  surfaced as top-level options on every generated client.
fullName: InternalClientOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: noDefaultAcceptHeader
    uid: '@azure-rest/core-client.InternalClientOptions.noDefaultAcceptHeader'
    package: '@azure-rest/core-client'
    summary: |-
      When set to `true`, the client does not add a default
      `Accept: application/json` request header to operations that do not
      otherwise specify an `Accept` header. This allows operations that expect
      no response body to omit the `Accept` header.
    fullName: noDefaultAcceptHeader
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'noDefaultAcceptHeader?: boolean'
      return:
        description: ''
        type: boolean
