      return:
        description: ''
        type: <xref uid="@azure/storage-file-datalake.CpkInfo" />
  - name: layoutAwareRouting
    uid: '@azure/storage-file-datalake.FileReadToBufferOptions.layoutAwareRouting'
    package: '@azure/storage-file-datalake'
    summary: >-
      Optional. ONLY AVAILABLE IN NODE.JS.


      Whether the parallel range requests this read issues are routed to the
      endpoints that hold

      them, as reported by Get Blob Layout. A performance optimization only: the
      bytes returned are

      the same either way.


      Defaults to `auto`, which currently leaves routing off; set `enabled` to
      opt in.


      With routing enabled, the first chunk is read from the account endpoint,
      and the rest are

      routed only if the service hints that the file has a layout. If the
      service answers the

      layout request with 400 or a 5xx status, the rest is read from the account
      endpoint too. Any

      other failure fails the read as it would without routing, including a
      layout request that is

      cancelled or times out, and a routed read that still fails after the
      pipeline's retries, which

      is not retried through the account endpoint.
    fullName: layoutAwareRouting
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'layoutAwareRouting?: LayoutAwareRouting'
      return:
        description: ''
        type: <xref uid="@azure/storage-file-datalake.LayoutAwareRouting" />
  - name: maxRetryRequestsPerChunk
    uid: >-
      @azure/storage-file-datalake.FileReadToBufferOptions.maxRetryRequestsPerChunk
    package: '@azure/storage-file-datalake'
    summary: >-
      How many retries will perform for each read when the original chunk read
      stream ends unexpectedly.

      Above kind of ends will not trigger retry policy defined in a pipeline,

      because they doesn't emit network errors. Default value is 5.
    fullName: maxRetryRequestsPerChunk
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maxRetryRequestsPerChunk?: number'
      return:
        description: ''
        type: number
