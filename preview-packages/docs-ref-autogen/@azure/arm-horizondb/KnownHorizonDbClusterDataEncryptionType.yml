### YamlMime:TSEnum
name: KnownHorizonDbClusterDataEncryptionType
uid: '@azure/arm-horizondb.KnownHorizonDbClusterDataEncryptionType'
package: '@azure/arm-horizondb'
summary: >-
  The type of data encryption used by a HorizonDB cluster. The type is selected
  at cluster creation; switching between SystemManaged and AzureKeyVault after
  creation is not supported.
fullName: KnownHorizonDbClusterDataEncryptionType
remarks: ''
isDeprecated: false
fields:
  - name: AzureKeyVault
    uid: '@azure/arm-horizondb.KnownHorizonDbClusterDataEncryptionType.AzureKeyVault'
    package: '@azure/arm-horizondb'
    summary: Data encryption uses customer-managed keys stored in Azure Key Vault.
  - name: SystemManaged
    uid: '@azure/arm-horizondb.KnownHorizonDbClusterDataEncryptionType.SystemManaged'
    package: '@azure/arm-horizondb'
    summary: Data encryption is managed by Azure using platform-managed keys.
