### YamlMime:TSType
name: UpgradeInsightMaintenanceWindow
uid: '@azure/arm-containerservice.UpgradeInsightMaintenanceWindow'
package: '@azure/arm-containerservice'
summary: >-
  A scheduled maintenance window during which an automatic upgrade of this type
  is

  expected to run. The window is derived from the maintenance configuration that

  governs this upgrade type — the cluster auto-upgrade schedule for Kubernetes

  version upgrades or the node OS upgrade schedule for node image upgrades — so
  the

  same model describes both without duplicating types.
fullName: UpgradeInsightMaintenanceWindow
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: endTime
    uid: '@azure/arm-containerservice.UpgradeInsightMaintenanceWindow.endTime'
    package: '@azure/arm-containerservice'
    summary: The UTC end time of the next scheduled maintenance window.
    fullName: endTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'endTime?: Date'
      return:
        description: ''
        type: Date
  - name: maintenanceConfigurationName
    uid: >-
      @azure/arm-containerservice.UpgradeInsightMaintenanceWindow.maintenanceConfigurationName
    package: '@azure/arm-containerservice'
    summary: >-
      The name of the maintenance configuration that governs this window (for
      example, aksManagedAutoUpgradeSchedule or
      aksManagedNodeOSUpgradeSchedule).
    fullName: maintenanceConfigurationName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maintenanceConfigurationName?: string'
      return:
        description: ''
        type: string
  - name: source
    uid: '@azure/arm-containerservice.UpgradeInsightMaintenanceWindow.source'
    package: '@azure/arm-containerservice'
    summary: The auto-upgrade schedule that this window is derived from.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source?: string'
      return:
        description: ''
        type: string
  - name: startTime
    uid: '@azure/arm-containerservice.UpgradeInsightMaintenanceWindow.startTime'
    package: '@azure/arm-containerservice'
    summary: The UTC start time of the next scheduled maintenance window.
    fullName: startTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'startTime?: Date'
      return:
        description: ''
        type: Date
