name: PolicyDirection
uid: '@azure/arm-networksecurity.PolicyDirection'
package: '@azure/arm-networksecurity'
summary: >-
  The direction of network traffic for a policy. \

  [KnownPolicyDirection](xref:@azure/arm-networksecurity.KnownPolicyDirection)
