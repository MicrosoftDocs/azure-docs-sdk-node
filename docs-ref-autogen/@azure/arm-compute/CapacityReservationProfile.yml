  - name: disableCapacityReservationAssignment
    uid: >-
      @azure/arm-compute.CapacityReservationProfile.disableCapacityReservationAssignment
    package: '@azure/arm-compute'
    summary: >-
      Specifies whether the virtual machine is explicitly opted out from being
      associated with any capacity reservation. When set to true, the virtual
      machine will not be allowed to implicitly or explicitly associate with any
      type of capacity reservation and will consume capacity from the publicly
      available capacity. Minimum api-version: 2026-04-01.
    fullName: disableCapacityReservationAssignment
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'disableCapacityReservationAssignment?: boolean'
