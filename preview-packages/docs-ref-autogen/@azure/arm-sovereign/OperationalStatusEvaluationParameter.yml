name: OperationalStatusEvaluationParameter
uid: '@azure/arm-sovereign.OperationalStatusEvaluationParameter'
package: '@azure/arm-sovereign'
summary: >-
  An evaluation parameter that controls which checks are performed when
  determining operational status. \

  [KnownOperationalStatusEvaluationParameter](xref:@azure/arm-sovereign.KnownOperationalStatusEvaluationParameter)
  can be used interchangeably with OperationalStatusEvaluationParameter,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **PermissionsEvaluation**: Evaluate managed identity permissions on the scopes
  in the sovereign view. \

  **PolicyAssignmentEvaluation**: Evaluate policy assignments on the scopes in
  the sovereign view.
fullName: OperationalStatusEvaluationParameter
remarks: ''
isDeprecated: false
syntax: |
  type OperationalStatusEvaluationParameter = string
