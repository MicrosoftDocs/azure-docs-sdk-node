### YamlMime:TSTypeAlias
name: OriginAuthenticationTokenDestinationHeader
uid: '@azure/arm-cdn.OriginAuthenticationTokenDestinationHeader'
package: '@azure/arm-cdn'
summary: >-
  The HTTP request header where the origin authentication token is placed when
  forwarding the request to the origin. \

  [KnownOriginAuthenticationTokenDestinationHeader](xref:@azure/arm-cdn.KnownOriginAuthenticationTokenDestinationHeader)
  can be used interchangeably with OriginAuthenticationTokenDestinationHeader,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Authorization**: Place the token in the standard `Authorization` request
  header (default behavior). \

  **X-Azure-Authorization**: Place the token in the `X-Azure-Authorization`
  request header to avoid conflicts with an existing `Authorization` header set
  by the client.
fullName: OriginAuthenticationTokenDestinationHeader
remarks: ''
isDeprecated: false
syntax: |
  type OriginAuthenticationTokenDestinationHeader = string
