### YamlMime:TSTypeAlias
name: KubernetesVersionSupportStatus
uid: '@azure/arm-containerservice.KubernetesVersionSupportStatus'
package: '@azure/arm-containerservice'
summary: >-
  The support status of the Kubernetes version the cluster is currently running.
  This is

  intentionally binary — there is no discrete `ApproachingEOL` value. Proximity
  to end of

  support is derived by clients from `kubernetesVersionEndOfSupportDate`
  (comparing it

  against the current time), so no server-computed "approaching EOS" flag or
  message is

  returned that could go stale in a cached record. \

  [KnownKubernetesVersionSupportStatus](xref:@azure/arm-containerservice.KnownKubernetesVersionSupportStatus)
  can be used interchangeably with KubernetesVersionSupportStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **InSupport**: The scope is running a Kubernetes version that is still within
  its support window. \

  **OutOfSupport**: The scope is running a Kubernetes version that is past its
  end of support.
fullName: KubernetesVersionSupportStatus
remarks: ''
isDeprecated: false
syntax: |
  type KubernetesVersionSupportStatus = string
