name: HighPriorityMessagesBackpressureHandling
uid: '@azure/arm-iotoperations.HighPriorityMessagesBackpressureHandling'
package: '@azure/arm-iotoperations'
summary: >-
  Handling of high-priority messages during backpressure state. \

  [KnownHighPriorityMessagesBackpressureHandling](xref:@azure/arm-iotoperations.KnownHighPriorityMessagesBackpressureHandling)
  can be used interchangeably with HighPriorityMessagesBackpressureHandling,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Accept**: When the broker rejects regular-priority messages due to
  backpressure, it continues to accept high-priority messages. \

  **Reject**: When the broker rejects regular-priority messages due to
  backpressure, it also rejects high-priority messages.
fullName: HighPriorityMessagesBackpressureHandling
remarks: ''
isDeprecated: false
syntax: |
  type HighPriorityMessagesBackpressureHandling = string
