### YamlMime:TSType
name: UnifiedModerateOptions
uid: '@azure/ai-content-safety.UnifiedModerateOptions'
package: '@azure/ai-content-safety'
summary: >-
  A request to evaluate and enforce an applicable policy for one workload event.
  The service uses the first policy it can resolve from policyId and then from
  the policy binding for targetResourceId, in that order. The request fails if
  neither selector resolves a policy.
fullName: UnifiedModerateOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: content
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.content'
    package: '@azure/ai-content-safety'
    summary: >-
      The content to evaluate. For input and output sources, provide nonempty
      plain text. For pre_tool_call, provide a string containing a JSON-encoded
      object with the proposed tool arguments. For post_tool_call, provide a
      string containing the JSON-encoded tool result.
    fullName: content
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'content: string'
      return:
        description: ''
        type: string
  - name: context
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.context'
    package: '@azure/ai-content-safety'
    summary: >-
      Optional agent, session, and request context supplied to policy
      evaluation.
    fullName: context
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'context?: UnifiedModerateContext'
      return:
        description: ''
        type: <xref uid="@azure/ai-content-safety.UnifiedModerateContext" />
  - name: policyId
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.policyId'
    package: '@azure/ai-content-safety'
    summary: >-
      The identifier of a policy available to the Content Safety resource. When
      provided, the service attempts to resolve this policy before using the
      policy bound to targetResourceId.
    fullName: policyId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'policyId?: string'
      return:
        description: ''
        type: string
  - name: source
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.source'
    package: '@azure/ai-content-safety'
    summary: >-
      The workload event source. The source selects the policy intervention
      point.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source: UnifiedModerateSource'
      return:
        description: ''
        type: <xref uid="@azure/ai-content-safety.UnifiedModerateSource" />
  - name: targetResourceId
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.targetResourceId'
    package: '@azure/ai-content-safety'
    summary: >-
      The Azure resource identifier whose policy binding is resolved if no
      policy is resolved from policyId. The target resource must already have a
      policy binding available to the Content Safety resource.
    fullName: targetResourceId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'targetResourceId?: string'
      return:
        description: ''
        type: string
  - name: toolArguments
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.toolArguments'
    package: '@azure/ai-content-safety'
    summary: >-
      A string containing a JSON-encoded object with the original arguments for
      a completed tool call. This property applies only to post_tool_call. The
      service uses an empty object when omitted.
    fullName: toolArguments
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'toolArguments?: string'
      return:
        description: ''
        type: string
  - name: toolCallId
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.toolCallId'
    package: '@azure/ai-content-safety'
    summary: >-
      An optional caller-provided tool-call identifier. The service generates
      one when omitted for a tool-call source.
    fullName: toolCallId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'toolCallId?: string'
      return:
        description: ''
        type: string
  - name: toolDurationMs
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.toolDurationMs'
    package: '@azure/ai-content-safety'
    summary: >-
      The non-negative duration of the completed tool call, in milliseconds.
      This property applies only to post_tool_call.
    fullName: toolDurationMs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'toolDurationMs?: number'
      return:
        description: ''
        type: number
  - name: toolName
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.toolName'
    package: '@azure/ai-content-safety'
    summary: >-
      The tool name. Required and nonempty for tool-call sources and not allowed
      for input or output sources.
    fullName: toolName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'toolName?: string'
      return:
        description: ''
        type: string
  - name: toolResultIsError
    uid: '@azure/ai-content-safety.UnifiedModerateOptions.toolResultIsError'
    package: '@azure/ai-content-safety'
    summary: >-
      Whether the completed tool call returned an error. This property applies
      only to post_tool_call.
    fullName: toolResultIsError
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'toolResultIsError?: boolean'
      return:
        description: ''
        type: boolean
