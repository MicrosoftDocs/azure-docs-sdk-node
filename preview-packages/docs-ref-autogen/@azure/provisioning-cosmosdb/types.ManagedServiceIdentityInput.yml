name: ManagedServiceIdentityInput
uid: '@azure/provisioning-cosmosdb.types.ManagedServiceIdentityInput'
package: '@azure/provisioning-cosmosdb'
summary: Input type for Identity for the resource.
fullName: ManagedServiceIdentityInput
remarks: ''
