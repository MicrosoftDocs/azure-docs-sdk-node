### YamlMime:TSTypeAlias
name: BlobAccessPointSourceType
uid: '@azure/arm-storage.BlobAccessPointSourceType'
package: '@azure/arm-storage'
summary: >-
  The type of the non-Azure S3-compatible data source exposed through the Blob
  Access Point. \

  [KnownBlobAccessPointSourceType](xref:@azure/arm-storage.KnownBlobAccessPointSourceType)
  can be used interchangeably with BlobAccessPointSourceType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NetAppOntap**: NetApp ONTAP. \

  **AzureNetAppFiles**: Azure NetApp Files. \

  **DellOneFs**: Dell OneFS. \

  **Qumulo**: Qumulo S3-compatible data source. \

  **Commvault**: Commvault S3-compatible data source. \

  **Nasuni**: Nasuni S3-compatible data source. \

  **S3Compatible**: Another S3-compatible data source.
fullName: BlobAccessPointSourceType
remarks: ''
isDeprecated: false
syntax: |
  type BlobAccessPointSourceType = string
