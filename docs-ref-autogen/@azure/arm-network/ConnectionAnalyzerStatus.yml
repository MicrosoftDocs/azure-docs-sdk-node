### YamlMime:TSTypeAlias
name: ConnectionAnalyzerStatus
uid: '@azure/arm-network.ConnectionAnalyzerStatus'
package: '@azure/arm-network'
summary: >-
  Current execution status of the connection analyzer. \

  [KnownConnectionAnalyzerStatus](xref:@azure/arm-network.KnownConnectionAnalyzerStatus)
  can be used interchangeably with ConnectionAnalyzerStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **NotStarted**: The connection analyzer has been created but execution has not
  yet begun. \

  **Running**: The connection analyzer is currently running its diagnostic
  operations. \

  **Succeeded**: The connection analyzer completed all diagnostic operations
  successfully. \

  **Failed**: The connection analyzer failed to complete its diagnostic
  operations.
fullName: ConnectionAnalyzerStatus
remarks: ''
isDeprecated: false
syntax: |
  type ConnectionAnalyzerStatus = string
