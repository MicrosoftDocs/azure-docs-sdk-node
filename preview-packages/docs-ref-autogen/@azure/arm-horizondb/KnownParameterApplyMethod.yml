### YamlMime:TSEnum
name: KnownParameterApplyMethod
uid: '@azure/arm-horizondb.KnownParameterApplyMethod'
package: '@azure/arm-horizondb'
summary: >-
  Controls when dynamic parameter changes become effective. Static parameter
  changes always become effective only after a customer-initiated pool Restart.
  Stop followed by Start and scheduled maintenance do not apply pending
  parameter changes.
fullName: KnownParameterApplyMethod
remarks: ''
isDeprecated: false
fields:
  - name: Immediate
    uid: '@azure/arm-horizondb.KnownParameterApplyMethod.Immediate'
    package: '@azure/arm-horizondb'
    summary: >-
      Apply dynamic parameter changes immediately. Static parameter changes
      remain pending until a customer-initiated pool Restart.
  - name: PendingReboot
    uid: '@azure/arm-horizondb.KnownParameterApplyMethod.PendingReboot'
    package: '@azure/arm-horizondb'
    summary: >-
      Keep dynamic and static parameter changes pending until a
      customer-initiated pool Restart. Stop followed by Start and scheduled
      maintenance do not apply them.
