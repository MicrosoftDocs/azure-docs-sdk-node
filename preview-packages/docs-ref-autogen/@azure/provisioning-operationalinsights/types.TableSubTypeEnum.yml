### YamlMime:TSTypeAlias
name: TableSubTypeEnum
uid: '@azure/provisioning-operationalinsights.types.TableSubTypeEnum'
package: '@azure/provisioning-operationalinsights'
summary: >-
  The subtype describes what APIs can be used to interact with the table, and
  what features are available against it.


  Known values:


  - `"Any"`: The default subtype with which built-in tables are created.


  - `"Classic"`: Indicates a table created through the Data Collector API or
  with the custom logs feature of the MMA agent, or any table against which
  Custom Fields were created.


  - `"DataCollectionRuleBased"`: A table eligible to have data sent into it via
  any of the means supported by Data Collection Rules: the Data Collection
  Endpoint API, ingestion-time transformations, or any other mechanism provided
  by Data Collection Rules
fullName: TableSubTypeEnum
remarks: ''
isDeprecated: false
syntax: |
  type TableSubTypeEnum = string
