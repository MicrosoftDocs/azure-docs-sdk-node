name: RaiAcsHarmCategory
uid: '@azure/arm-cognitiveservices.RaiAcsHarmCategory'
package: '@azure/arm-cognitiveservices'
summary: >-
  Harm categories supported by the Unified Moderate text profile. \

  [KnownRaiAcsHarmCategory](xref:@azure/arm-cognitiveservices.KnownRaiAcsHarmCategory)
  can be used interchangeably with RaiAcsHarmCategory,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Hate**: Hate-related content. \

  **SelfHarm**: Self-harm-related content. \

  **Sexual**: Sexual content. \

  **Violence**: Violent content. \

  **PromptInjection**: Prompt-injection content. \

  **ProtectedMaterialText**: Protected text material. \

  **ProtectedMaterialCode**: Protected source-code material.
fullName: RaiAcsHarmCategory
remarks: ''
isDeprecated: false
syntax: |
  type RaiAcsHarmCategory = string
