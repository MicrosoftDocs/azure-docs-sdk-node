### YamlMime:TSType
name: DiscriminatorNames
uid: '@azure/provisioning-core.DiscriminatorNames'
package: '@azure/provisioning-core'
summary: >-
  The two names a discriminator field goes by.


  Usually identical — ARM discriminators are `type`, `name`, `kind` and

  service teams rarely rename them — but a `@clientName` on the field

  makes them differ, and the two are looked up in different keyspaces:

  JS-side state is keyed by
  [jsName](xref:@azure/provisioning-core.DiscriminatorNames.jsName), wire JSON
  by

  [armName](xref:@azure/provisioning-core.DiscriminatorNames.armName). Carrying
  both is what lets a discriminated shape

  resolve in either direction.
fullName: DiscriminatorNames
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: armName
    uid: '@azure/provisioning-core.DiscriminatorNames.armName'
    package: '@azure/provisioning-core'
    summary: Wire-level name, as it appears in an ARM template or response.
    fullName: armName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'armName: string'
      return:
        description: ''
        type: string
  - name: jsName
    uid: '@azure/provisioning-core.DiscriminatorNames.jsName'
    package: '@azure/provisioning-core'
    summary: Client-facing name, as authored in TypeScript and held in state.
    fullName: jsName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'jsName: string'
      return:
        description: ''
        type: string
