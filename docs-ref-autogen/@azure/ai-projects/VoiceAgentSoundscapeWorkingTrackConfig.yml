### YamlMime:TSType
name: VoiceAgentSoundscapeWorkingTrackConfig
uid: '@azure/ai-projects.VoiceAgentSoundscapeWorkingTrackConfig'
package: '@azure/ai-projects'
summary: >-
  A working-loop track with a delay measured from the first pending
  non-call-control tool.
fullName: VoiceAgentSoundscapeWorkingTrackConfig
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: delay_ms
    uid: '@azure/ai-projects.VoiceAgentSoundscapeWorkingTrackConfig.delay_ms'
    package: '@azure/ai-projects'
    summary: >-
      The delay in milliseconds before working audio starts, from 0 to 10000. If
      omitted, the service defaults to 1000 milliseconds. This delays only
      working audio, not tool execution, and is valid only on the working track.
    fullName: delay_ms
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delay_ms?: number'
      return:
        description: ''
        type: number
  - name: gain
    uid: '@azure/ai-projects.VoiceAgentSoundscapeWorkingTrackConfig.gain'
    package: '@azure/ai-projects'
    summary: >-
      Linear playback gain from 0 to 1, independent of agent speech volume. If
      omitted, the service defaults to 1. A value of 0 mutes this track.
    fullName: gain
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'gain?: number'
      return:
        description: ''
        type: number
  - name: source
    uid: '@azure/ai-projects.VoiceAgentSoundscapeWorkingTrackConfig.source'
    package: '@azure/ai-projects'
    summary: The required audio source for this track.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source: VoiceAgentSoundscapeSourceConfig'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.VoiceAgentSoundscapeSourceConfig" />
