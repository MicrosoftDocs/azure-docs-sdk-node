### YamlMime:TSType
name: LiveSessionCreateParams
uid: '@azure/ai-projects.LiveSessionCreateParams'
package: '@azure/ai-projects'
summary: >-
  Initial configuration for a Live session, including its model, conversation
  instructions, audio, and delegated task handling.
fullName: LiveSessionCreateParams
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: audio
    uid: '@azure/ai-projects.LiveSessionCreateParams.audio'
    package: '@azure/ai-projects'
    summary: >-
      Startup audio configuration. Only primary WebSockets accept audio.format;
      WebRTC and SIP negotiate their media format. Voice and format are
      immutable after startup.
    fullName: audio
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'audio?: LiveInitialSessionAudioParam'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveInitialSessionAudioParam" />
  - name: client
    uid: '@azure/ai-projects.LiveSessionCreateParams.client'
    package: '@azure/ai-projects'
    summary: >-
      Startup-only capabilities for an untrusted frontend attached to a unified
      WebRTC session. Trusted sideband connections are unaffected.
    fullName: client
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'client?: LiveClientConfigParam'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveClientConfigParam" />
  - name: delegation
    uid: '@azure/ai-projects.LiveSessionCreateParams.delegation'
    package: '@azure/ai-projects'
    summary: The owner and backend settings for tasks delegated by the Live model.
    fullName: delegation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'delegation?: LiveSessionCreateParamsDelegationUnion'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.LiveSessionCreateParamsDelegationUnion"
          />
  - name: input
    uid: '@azure/ai-projects.LiveSessionCreateParams.input'
    package: '@azure/ai-projects'
    summary: >-
      Ordered text-only history supplied before startup. Supports developer,
      user, and assistant messages with one text part each; at most 128 messages
      and a configured rendered-token limit (8,192 by default).
    fullName: input
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'input?: LiveInitialItemUnion[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveInitialItemUnion" />[]
  - name: instructions
    uid: '@azure/ai-projects.LiveSessionCreateParams.instructions'
    package: '@azure/ai-projects'
    summary: Instructions that guide the Live model's behavior during the session.
    fullName: instructions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'instructions?: string'
      return:
        description: ''
        type: string
  - name: model
    uid: '@azure/ai-projects.LiveSessionCreateParams.model'
    package: '@azure/ai-projects'
    summary: The Live model used to process audio and generate spoken responses.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model: "gpt-live-1"'
      return:
        description: ''
        type: '"gpt-live-1"'
  - name: store
    uid: '@azure/ai-projects.LiveSessionCreateParams.store'
    package: '@azure/ai-projects'
    summary: >-
      Whether to store the session for later forking and recording download.
      Defaults to false for new sessions.
    fullName: store
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'store?: boolean'
      return:
        description: ''
        type: boolean
  - name: triggers
    uid: '@azure/ai-projects.LiveSessionCreateParams.triggers'
    package: '@azure/ai-projects'
    summary: >-
      At most one Decisions trigger per transcript event type. Triggers run
      independently of delegation. On update, omit triggers to keep the current
      configuration, send a list to replace it, or send an empty list to disable
      triggers.
    fullName: triggers
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'triggers?: LiveDecisionTriggerInputParam[]'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveDecisionTriggerInputParam" />[]
