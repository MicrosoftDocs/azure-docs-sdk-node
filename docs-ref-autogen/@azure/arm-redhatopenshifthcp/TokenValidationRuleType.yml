name: TokenValidationRuleType
uid: '@azure/arm-redhatopenshifthcp.TokenValidationRuleType'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  Representation of the different claim validation rule types that can be
  configured. \

  [KnownTokenValidationRuleType](xref:@azure/arm-redhatopenshifthcp.KnownTokenValidationRuleType)
  can be used interchangeably with TokenValidationRuleType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **RequiredClaim**: Indicates that a Required Claim validation rule.


  When set to 'RequiredClaim', the Kubernetes API server will be configured to
  validate that the incoming JWT

  contains the required claim and that its value matches the required value.
fullName: TokenValidationRuleType
remarks: ''
isDeprecated: false
syntax: |
  type TokenValidationRuleType = string
