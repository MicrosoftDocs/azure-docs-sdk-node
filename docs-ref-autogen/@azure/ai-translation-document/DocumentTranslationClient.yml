  - name: listTranslationStatuses(ListTranslationStatusesOptionalParams)
    uid: >-
      @azure/ai-translation-document.DocumentTranslationClient.listTranslationStatuses
    package: '@azure/ai-translation-document'
    summary: >-
      Returns a list of batch requests submitted and the status for each

      request.

      This list only contains batch requests submitted by the user (based on

      the resource).


      If the number of requests exceeds our paging limit,

      server-side paging is used. Paginated responses indicate a partial result
      and

      include a continuation token in the response.

      The absence of a continuation

      token means that no additional pages are available.


      top, skip

      and maxPageSize options can be used to specify a number of results to

      return and an offset for the collection.


      top indicates the total

      number of records the user wants to be returned across all pages.

      skip

      indicates the number of records to skip from the list of batches based on
      the

      sorting method specified.  By default, we sort by descending start

      time.

      maxPageSize is the maximum items returned in a page.  If more items are

      requested via top (or top is not specified and there are more items to be

      returned),
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function listTranslationStatuses(options?:
        ListTranslationStatusesOptionalParams):
        PagedAsyncIterableIterator<TranslationStatus, TranslationStatus[],
        PageSettings>
      parameters:
        - id: options
          type: >-
            <xref
            uid="@azure/ai-translation-document.ListTranslationStatusesOptionalParams"
            />
          description: ''
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-translation-document.PagedAsyncIterableIterator"
          />&lt;<xref uid="@azure/ai-translation-document.TranslationStatus" />,
          <xref uid="@azure/ai-translation-document.TranslationStatus" />[],
          <xref uid="@azure/ai-translation-document.PageSettings" />&gt;
  - name: startTranslation(StartTranslationDetails, StartTranslationOptionalParams)
    uid: '@azure/ai-translation-document.DocumentTranslationClient.startTranslation'
    package: '@azure/ai-translation-document'
    summary: >-
      Use this API to submit a bulk (batch) translation request to the Document

      Translation service.

      Each request can contain multiple documents and must

      contain a source and destination container for each document.


      The

      prefix and suffix filter (if supplied) are used to filter folders. The
      prefix

      is applied to the subpath after the container name.


      Glossaries /

      Translation memory can be included in the request and are applied by the

      service when the document is translated.


      If the glossary is

      invalid or unreachable during translation, an error is indicated in the

      document status.

      If a file with the same name already exists at the

      destination, it will be overwritten. The targetUrl for each target
      language

      must be unique.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function startTranslation(body: StartTranslationDetails, options?:
        StartTranslationOptionalParams):
        PollerLike<OperationState<TranslationStatus>, TranslationStatus>
      parameters:
        - id: body
          type: >-
            <xref uid="@azure/ai-translation-document.StartTranslationDetails"
            />
          description: ''
        - id: options
          type: >-
            <xref
            uid="@azure/ai-translation-document.StartTranslationOptionalParams"
            />
          description: ''
      return:
        description: ''
        type: >-
          <xref uid="@azure/core-lro.PollerLike" />&lt;<xref
          uid="@azure/core-lro.OperationState" />&lt;<xref
          uid="@azure/ai-translation-document.TranslationStatus" />&gt;, <xref
          uid="@azure/ai-translation-document.TranslationStatus" />&gt;
