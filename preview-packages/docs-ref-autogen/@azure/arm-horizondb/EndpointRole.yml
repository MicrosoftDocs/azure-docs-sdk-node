### YamlMime:TSTypeAlias
name: EndpointRole
uid: '@azure/arm-horizondb.EndpointRole'
package: '@azure/arm-horizondb'
summary: >-
  Role of the endpoint. \

  [KnownEndpointRole](xref:@azure/arm-horizondb.KnownEndpointRole) can be used
  interchangeably with EndpointRole,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ReadOnly**: The Endpoint accepts read-only traffic. This applies to
  Pool-scoped Endpoints and may apply to other endpoint scenarios introduced by
  later API versions. \

  **ReadWrite**: The Cluster-scoped Endpoint accepts read and write traffic.
fullName: EndpointRole
remarks: ''
isDeprecated: false
syntax: |
  type EndpointRole = string
