### YamlMime:TSType
name: KnowledgeSourceGraphExtractionParameters
uid: '@azure/search-documents.KnowledgeSourceGraphExtractionParameters'
package: '@azure/search-documents'
summary: >-
  Configures graph extraction from an Azure Blob knowledge source with native
  Blob soft delete enabled before indexing. ADLS Gen2, ACL ingestion, and
  sensitivity-label ingestion are not supported. Distinct ontology changes must
  wait until no synchronization is active.
fullName: KnowledgeSourceGraphExtractionParameters
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: graphName
    uid: '@azure/search-documents.KnowledgeSourceGraphExtractionParameters.graphName'
    package: '@azure/search-documents'
    summary: The name of the graph to create.
    fullName: graphName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'graphName: string'
      return:
        description: ''
        type: string
  - name: grounding
    uid: '@azure/search-documents.KnowledgeSourceGraphExtractionParameters.grounding'
    package: '@azure/search-documents'
    summary: Optional grounding source used to resolve extracted entities.
    fullName: grounding
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'grounding?: KnowledgeSourceGraphGrounding'
      return:
        description: ''
        type: <xref uid="@azure/search-documents.KnowledgeSourceGraphGrounding" />
  - name: ontology
    uid: '@azure/search-documents.KnowledgeSourceGraphExtractionParameters.ontology'
    package: '@azure/search-documents'
    summary: >-
      The ontology used to extract triples. If absent or null at creation, a
      configured enrichment cache allows ingestion to produce searchable chunks
      and cached enrichment without extracting triples. Once an ontology is
      attached, it cannot be removed. Distinct ontology changes must wait until
      no synchronization is active.
    fullName: ontology
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'ontology?: KnowledgeSourceGraphOntology'
      return:
        description: ''
        type: <xref uid="@azure/search-documents.KnowledgeSourceGraphOntology" />
  - name: pageDegreeOfParallelism
    uid: >-
      @azure/search-documents.KnowledgeSourceGraphExtractionParameters.pageDegreeOfParallelism
    package: '@azure/search-documents'
    summary: Maximum number of pages processed in parallel for graph extraction.
    fullName: pageDegreeOfParallelism
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'pageDegreeOfParallelism?: number'
      return:
        description: ''
        type: number
