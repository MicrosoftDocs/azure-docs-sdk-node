### YamlMime:TSType
name: VoiceAgentCollectSmsStartArguments
uid: '@azure/ai-projects.VoiceAgentCollectSmsStartArguments'
package: '@azure/ai-projects'
summary: >-
  Model-call SMS collection arguments, validated before receiver setup. The
  model supplies the sender, not the collected SMS.
fullName: VoiceAgentCollectSmsStartArguments
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: from_phone_number
    uid: '@azure/ai-projects.VoiceAgentCollectSmsStartArguments.from_phone_number'
    package: '@azure/ai-projects'
    summary: >-
      The expected SMS sender in canonical E.164 form, explicitly selected at
      start without Caller ID fallback. This is routing, not authenticated
      identity.
    fullName: from_phone_number
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'from_phone_number: string'
      return:
        description: ''
        type: string
  - name: output_variable_name
    uid: '@azure/ai-projects.VoiceAgentCollectSmsStartArguments.output_variable_name'
    package: '@azure/ai-projects'
    summary: >-
      Preferred bare name for the output variable, required for `secret: true`
      and forbidden otherwise.
    fullName: output_variable_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'output_variable_name?: string'
      return:
        description: ''
        type: string
  - name: secret
    uid: '@azure/ai-projects.VoiceAgentCollectSmsStartArguments.secret'
    package: '@azure/ai-projects'
    summary: >-
      Required; no default. True returns a private reference, false returns the
      value. Privacy cannot be downgraded after collection starts.
    fullName: secret
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'secret: boolean'
      return:
        description: ''
        type: boolean
  - name: timeout_seconds
    uid: '@azure/ai-projects.VoiceAgentCollectSmsStartArguments.timeout_seconds'
    package: '@azure/ai-projects'
    summary: >-
      Total deadline in seconds (1-300), including receiver setup. Overrides the
      Agent timeout; if both are omitted, defaults to 60. Duplicate calls do not
      reset it.
    fullName: timeout_seconds
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'timeout_seconds?: number'
      return:
        description: ''
        type: number
