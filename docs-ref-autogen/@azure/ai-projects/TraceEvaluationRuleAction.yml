### YamlMime:TSType
name: TraceEvaluationRuleAction
uid: '@azure/ai-projects.TraceEvaluationRuleAction'
package: '@azure/ai-projects'
summary: Configures a scheduled evaluation of observed agent traces.
fullName: TraceEvaluationRuleAction
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: evalId
    uid: '@azure/ai-projects.TraceEvaluationRuleAction.evalId'
    package: '@azure/ai-projects'
    summary: Identifier of the evaluation used to score the selected traces.
    fullName: evalId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evalId: string'
      return:
        description: ''
        type: string
  - name: evaluation_level
    uid: '@azure/ai-projects.TraceEvaluationRuleAction.evaluation_level'
    package: '@azure/ai-projects'
    summary: >-
      Level at which each scheduled run evaluates. Required when the evaluation
      uses the messages item schema.
    fullName: evaluation_level
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'evaluation_level?: EvaluationLevel'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.EvaluationLevel" />
  - name: source
    uid: '@azure/ai-projects.TraceEvaluationRuleAction.source'
    package: '@azure/ai-projects'
    summary: >-
      Trace inputs for each scheduled occurrence. The selected variant's
      query-window and sampling behavior is preserved.


      For `azure_ai_traces`, set exactly one of `agent_id` or `agent_name`;
      `trace_ids` is not supported.

      For `azure_ai_trace_data_source`, set `trace_source`.

      Preview source types may appear in responses for existing schedules but
      are rejected on create and update.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source: TraceEvaluationSource'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.TraceEvaluationSource" />
  - name: type
    uid: '@azure/ai-projects.TraceEvaluationRuleAction.type'
    package: '@azure/ai-projects'
    summary: >-
      The discriminator possible values: continuousEvaluation,
      humanEvaluationPreview
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "traceEvaluation"'
      return:
        description: ''
        type: '"traceEvaluation"'
extends: <xref uid="@azure/ai-projects.EvaluationRuleAction" />
