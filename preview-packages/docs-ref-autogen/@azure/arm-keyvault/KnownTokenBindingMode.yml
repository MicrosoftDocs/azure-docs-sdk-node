### YamlMime:TSEnum
name: KnownTokenBindingMode
uid: '@azure/arm-keyvault.KnownTokenBindingMode'
package: '@azure/arm-keyvault'
summary: This specifies whether token binding is disabled, enabled or enforced.
fullName: KnownTokenBindingMode
remarks: ''
isDeprecated: false
fields:
  - name: Enforced
    uid: '@azure/arm-keyvault.KnownTokenBindingMode.Enforced'
    package: '@azure/arm-keyvault'
    summary: >-
      Token binding is enforced for the vault. Only bounded tokens will be
      accepted. Bearer tokens will be rejected.
  - name: NotEnforced
    uid: '@azure/arm-keyvault.KnownTokenBindingMode.NotEnforced'
    package: '@azure/arm-keyvault'
    summary: >-
      Token binding is not enforced for the vault. Bounded tokens will be
      rejected.
