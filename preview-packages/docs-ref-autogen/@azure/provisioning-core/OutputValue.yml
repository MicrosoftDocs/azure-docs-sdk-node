### YamlMime:TSTypeAlias
name: OutputValue
uid: '@azure/provisioning-core.OutputValue'
package: '@azure/provisioning-core'
summary: >-
  A value accepted as a deployment output's value: any JSON literal (scalar,

  `null`, array, object — recursively), an `Expression`, a resource view

  (`InputOf<unknown>`), or a [Resource](xref:@azure/provisioning-core.Resource)
  handle. The literal members are

  required so plain object/array literals are accepted (a bare

  `InputOf<unknown>` is a weak type and would reject them).
fullName: OutputValue
remarks: ''
isDeprecated: false
syntax: |
  type OutputValue =
    | string
    | number
    | boolean
    | null
    | readonly OutputValue[]
    | { [key: string]: OutputValue }
    | InputOf<unknown>
    | Resource
