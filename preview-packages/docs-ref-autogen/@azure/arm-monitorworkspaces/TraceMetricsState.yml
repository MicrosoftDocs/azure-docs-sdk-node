name: TraceMetricsState
uid: '@azure/arm-monitorworkspaces.TraceMetricsState'
package: '@azure/arm-monitorworkspaces'
summary: >-
  The state of trace-derived metrics for a trace container. \

  [KnownTraceMetricsState](xref:@azure/arm-monitorworkspaces.KnownTraceMetricsState)
  can be used interchangeably with TraceMetricsState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Trace-derived metrics are emitted. \

  **Disabled**: Trace-derived metrics are not emitted.
