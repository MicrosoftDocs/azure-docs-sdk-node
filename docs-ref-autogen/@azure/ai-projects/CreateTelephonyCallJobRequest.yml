### YamlMime:TSType
name: CreateTelephonyCallJobRequest
uid: '@azure/ai-projects.CreateTelephonyCallJobRequest'
package: '@azure/ai-projects'
summary: A request to create one durable direct outbound call job.
fullName: CreateTelephonyCallJobRequest
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: connection_name
    uid: '@azure/ai-projects.CreateTelephonyCallJobRequest.connection_name'
    package: '@azure/ai-projects'
    summary: >-
      The Foundry connection name in the current project used to originate the
      call. Its category selects Twilio or Azure Communication Services / Teams
      Phone Extension. No inbound telephony binding is required.
    fullName: connection_name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'connection_name: string'
      return:
        description: ''
        type: string
  - name: destination
    uid: '@azure/ai-projects.CreateTelephonyCallJobRequest.destination'
    package: '@azure/ai-projects'
    summary: The phone destination to call.
    fullName: destination
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'destination: TelephonyOutboundDestination'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.TelephonyOutboundDestination" />
  - name: purpose
    uid: '@azure/ai-projects.CreateTelephonyCallJobRequest.purpose'
    package: '@azure/ai-projects'
    summary: An optional customer-declared purpose for placing the call.
    fullName: purpose
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'purpose?: string'
      return:
        description: ''
        type: string
  - name: retry_policy
    uid: '@azure/ai-projects.CreateTelephonyCallJobRequest.retry_policy'
    package: '@azure/ai-projects'
    summary: >-
      The provider-attempt retry policy. Omit it for one attempt with no retry
      delay.
    fullName: retry_policy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'retry_policy?: TelephonyOutboundRetryPolicyUnion'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.TelephonyOutboundRetryPolicyUnion" />
  - name: schedule
    uid: '@azure/ai-projects.CreateTelephonyCallJobRequest.schedule'
    package: '@azure/ai-projects'
    summary: The optional execution window.
    fullName: schedule
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'schedule?: TelephonyCallJobSchedule'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.TelephonyCallJobSchedule" />
  - name: source
    uid: '@azure/ai-projects.CreateTelephonyCallJobRequest.source'
    package: '@azure/ai-projects'
    summary: >-
      The caller identity used to originate the call. For a Twilio connection,
      provide an authorized E.164 phone number. For an Azure Communication
      Services / Teams Phone Extension connection, provide the Teams Resource
      Account object ID. The identity type is inferred from the connection
      category; originating does not change inbound routing.
    fullName: source
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'source: string'
      return:
        description: ''
        type: string
  - name: structured_inputs
    uid: '@azure/ai-projects.CreateTelephonyCallJobRequest.structured_inputs'
    package: '@azure/ai-projects'
    summary: >-
      Structured input values available to the agent and greeting for this call.
      Agent-declared inputs are validated against their schemas; omitted
      optional inputs may use their Agent-defined default values, while omitted
      required inputs are rejected. Additional inputs remain available as
      dynamic template variables.
    fullName: structured_inputs
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'structured_inputs?: Record<string, any>'
      return:
        description: ''
        type: Record&lt;string, any&gt;
