name: ChangeDataCaptureEffectiveState
uid: '@azure/arm-horizondb.ChangeDataCaptureEffectiveState'
package: '@azure/arm-horizondb'
summary: >-
  The effective state of a HorizonDB change data capture capability or
  configuration. \

  [KnownChangeDataCaptureEffectiveState](xref:@azure/arm-horizondb.KnownChangeDataCaptureEffectiveState)
  can be used interchangeably with ChangeDataCaptureEffectiveState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabling**: The resource is being enabled. \

  **Enabled**: The resource is enabled. \

  **Disabling**: The resource is being disabled. \

  **Disabled**: The resource is disabled. \

  **Degraded**: The resource is available with reduced functionality or impaired
  health. \

  **Failed**: The resource is not operational because reconciliation failed.
