inheritedProperties:
  - name: cardinality
    uid: '@azure/functions-extensions-connectors.ConnectorTriggerOptions.cardinality'
    package: '@azure/functions-extensions-connectors'
    summary: >-
      Set to `many` to enable batching. Accepts enum members or the supported
      string values.

      Defaults to `one`, which passes a single event to the function.

      For batches, use an array as the handler's payload type, for example
      `app.connectorTrigger<MyEvent[]>`.
    fullName: cardinality
    remarks: ''
    isDeprecated: false
