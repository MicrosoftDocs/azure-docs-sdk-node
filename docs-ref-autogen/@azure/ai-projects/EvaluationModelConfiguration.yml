### YamlMime:TSType
name: EvaluationModelConfiguration
uid: '@azure/ai-projects.EvaluationModelConfiguration'
package: '@azure/ai-projects'
summary: >-
  Configures the model that plays the simulated user. This model is separate
  from the evaluated `target`.
fullName: EvaluationModelConfiguration
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: model
    uid: '@azure/ai-projects.EvaluationModelConfiguration.model'
    package: '@azure/ai-projects'
    summary: >-
      Model deployment that generates simulated user turns, in the format
      `{connectionName}/modelDeploymentName`.
    fullName: model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'model: string'
      return:
        description: ''
        type: string
  - name: sampling_params
    uid: '@azure/ai-projects.EvaluationModelConfiguration.sampling_params'
    package: '@azure/ai-projects'
    summary: Sampling parameters applied when the simulation model produces user turns.
    fullName: sampling_params
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sampling_params?: ModelSamplingParams'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.ModelSamplingParams" />
  - name: voice_model
    uid: '@azure/ai-projects.EvaluationModelConfiguration.voice_model'
    package: '@azure/ai-projects'
    summary: >-
      Voice configuration used to convert simulated user text to speech.
      Currently, only Azure standard voices are supported. Omit for text-only
      simulation.
    fullName: voice_model
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'voice_model?: EvaluationVoiceModelConfigurationUnion'
      return:
        description: ''
        type: >-
          <xref uid="@azure/ai-projects.EvaluationVoiceModelConfigurationUnion"
          />
