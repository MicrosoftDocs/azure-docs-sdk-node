### YamlMime:TSTypeAlias
name: ParameterValueSource
uid: '@azure/arm-horizondb.ParameterValueSource'
package: '@azure/arm-horizondb'
summary: >-
  The source of the effective value assigned to a HorizonDB parameter. \

  [KnownParameterValueSource](xref:@azure/arm-horizondb.KnownParameterValueSource)
  can be used interchangeably with ParameterValueSource,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **SystemDefault**: The effective value is the system-defined default. \

  **UserOverride**: The effective value was explicitly supplied by the user,
  even when it equals the system-defined default value.
fullName: ParameterValueSource
remarks: ''
isDeprecated: false
syntax: |
  type ParameterValueSource = string
