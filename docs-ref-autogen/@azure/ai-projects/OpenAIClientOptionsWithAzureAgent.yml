  - name: timeout
    uid: '@azure/ai-projects.OpenAIClientOptionsWithAzureAgent.timeout'
    package: '@azure/ai-projects'
    summary: >-
      The maximum amount of time (in milliseconds) that the client should wait
      for a response

      from the server before timing out a single request.


      Note that request timeouts are retried by default, so in a worst-case
      scenario you may wait

      much longer than this timeout before the promise succeeds or fails.


      Node.js fetch enforces independent response-header and body-inactivity
      timeouts, typically

      defaulting to five minutes, even when this timeout is longer. To increase
      them, install

      `undici` and configure an Agent with the matching fetch implementation:


      ```ts

      import { Agent, fetch } from 'undici';


      const timeout = 20 * 60 * 1000;

      const client = new OpenAI({
        timeout,
        fetch,
        fetchOptions: {
          dispatcher: new Agent({ headersTimeout: timeout, bodyTimeout: timeout }),
        },
      });

      ```
    fullName: timeout
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'timeout?: number'
      return:
        description: ''
        type: number
    inheritanceDescription: <b>Inherited From</b> OpenAIClientOptions.timeout
