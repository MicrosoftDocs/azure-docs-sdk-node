### YamlMime:TSEnum
name: KnownScenarioRunTargetState
uid: '@azure/arm-chaos.KnownScenarioRunTargetState'
package: '@azure/arm-chaos'
summary: Enum of the execution states for a concrete action target.
fullName: KnownScenarioRunTargetState
remarks: ''
isDeprecated: false
fields:
  - name: Failed
    uid: '@azure/arm-chaos.KnownScenarioRunTargetState.Failed'
    package: '@azure/arm-chaos'
    summary: >-
      Evaluation, authorization, lookup, mutation, or cleanup failed for the
      target.
  - name: NotApplicable
    uid: '@azure/arm-chaos.KnownScenarioRunTargetState.NotApplicable'
    package: '@azure/arm-chaos'
    summary: >-
      Evaluation determined that the action cannot apply because the target
      lacks required

      properties or capabilities, or does not satisfy the action criteria. For
      example,

      a SQL server without failover configured.
  - name: Skipped
    uid: '@azure/arm-chaos.KnownScenarioRunTargetState.Skipped'
    package: '@azure/arm-chaos'
    summary: >-
      The action applies, but execution intentionally made no change because the
      target is

      already in the desired state or the change would not be safely
      recoverable. For example,

      a virtual machine that is already shut down.
  - name: Succeeded
    uid: '@azure/arm-chaos.KnownScenarioRunTargetState.Succeeded'
    package: '@azure/arm-chaos'
    summary: The action completed successfully for the target.
