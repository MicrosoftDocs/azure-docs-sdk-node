### YamlMime:TSTypeAlias
name: KnowledgeSourceResultsProcessing
uid: '@azure/search-documents.KnowledgeSourceResultsProcessing'
package: '@azure/search-documents'
summary: >-
  Controls whether a knowledge source's results are reranked. \

  [KnownKnowledgeSourceResultsProcessing](xref:@azure/search-documents.KnownKnowledgeSourceResultsProcessing)
  can be used interchangeably with KnowledgeSourceResultsProcessing,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **rerank**: Results from this knowledge source go through the reranking
  pipeline. This is the default behavior. \

  **none**: Results from this knowledge source bypass reranking and preserve
  their underlying order.
fullName: KnowledgeSourceResultsProcessing
remarks: ''
isDeprecated: false
syntax: |
  type KnowledgeSourceResultsProcessing = string
