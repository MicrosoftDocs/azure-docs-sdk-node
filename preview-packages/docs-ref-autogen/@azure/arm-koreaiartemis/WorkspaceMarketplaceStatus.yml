name: WorkspaceMarketplaceStatus
uid: '@azure/arm-koreaiartemis.WorkspaceMarketplaceStatus'
package: '@azure/arm-koreaiartemis'
summary: >-
  Azure Marketplace fulfillment status reported by Kore. \

  [KnownWorkspaceMarketplaceStatus](xref:@azure/arm-koreaiartemis.KnownWorkspaceMarketplaceStatus)
  can be used interchangeably with WorkspaceMarketplaceStatus,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **PendingFulfillmentStart**: Fulfillment has not started. \

  **Subscribed**: The subscription is active. \

  **Suspended**: The subscription is suspended. \

  **Unsubscribed**: The subscription is unsubscribed.
