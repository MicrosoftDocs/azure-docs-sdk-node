### YamlMime:TSTypeAlias
name: AlwaysServe
uid: '@azure/arm-privatetrafficmanager.AlwaysServe'
package: '@azure/arm-privatetrafficmanager'
summary: >-
  If Always Serve is enabled, probing for endpoint health will be disabled and
  endpoints will be included in the traffic routing method. \

  [KnownAlwaysServe](xref:@azure/arm-privatetrafficmanager.KnownAlwaysServe) can
  be used interchangeably with AlwaysServe,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Enabled**: Always serve is enabled, endpoint health probing is disabled. \

  **Disabled**: Always serve is disabled, endpoint health probing is active.
fullName: AlwaysServe
remarks: ''
isDeprecated: false
syntax: |
  type AlwaysServe = string
