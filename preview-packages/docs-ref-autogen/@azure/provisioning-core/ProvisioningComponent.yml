### YamlMime:TSType
name: ProvisioningComponent
uid: '@azure/provisioning-core.ProvisioningComponent'
package: '@azure/provisioning-core'
summary: |+
  Base class for all tree nodes in the library object model.

  **Example**

  ```typescript snippet:ignore
  import { ProvisioningComponent } from "@azure/provisioning-core";
  import { KeyVault, Secret } from "@azure/provisioning-keyvault";

  class DataTier extends ProvisioningComponent {
    readonly vault: KeyVault;
    readonly secret: Secret;

    constructor(parent: ProvisioningComponent, tenantId: string, secretValue: string) {
      super(parent);
      this.vault = new KeyVault(this, {
        name: "kv-my-app",
        location: "eastus",
        properties: { tenantId, sku: { family: "A", name: "standard" } },
      });
      this.secret = new Secret(this.vault, {
        name: "database-password",
        properties: { value: secretValue },
      });
    }
  }
  ```

fullName: ProvisioningComponent
remarks: >-
  Both `Stack` and `Resource` extend `ProvisioningComponent`. It provides
  parent-child

  tree tracking and deployment context lookup — walking up the tree to find

  the nearest context set by a `Stack` or `ResourceGroup`.


  Subclass `ProvisioningComponent` directly to create reusable groupings of
  resources

  that don't correspond to an ARM resource. For ARM resources, extend

  `Resource` instead.
isDeprecated: false
