### YamlMime:TSTypeAlias
name: ModelSourceType
uid: '@azure/arm-containerserviceaimanager.ModelSourceType'
package: '@azure/arm-containerserviceaimanager'
summary: >-
  The type of a model source. \

  [KnownModelSourceType](xref:@azure/arm-containerserviceaimanager.KnownModelSourceType)
  can be used interchangeably with ModelSourceType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **HuggingFace**: A Hugging Face model registry. \

  **MicrosoftFoundry**: A Microsoft Foundry project. Tenant-private models
  produced by internal training pipelines. Authenticated via a user-assigned
  managed identity (referenced in the credential and granted the `Foundry User`
  role on the project).
fullName: ModelSourceType
remarks: ''
isDeprecated: false
syntax: |
  type ModelSourceType = string
