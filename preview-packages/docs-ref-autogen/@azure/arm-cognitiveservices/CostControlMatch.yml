name: CostControlMatch
uid: '@azure/arm-cognitiveservices.CostControlMatch'
package: '@azure/arm-cognitiveservices'
summary: >-
  Gets or sets optional match arrays keyed by `agentResourceIds`,
  `identityObjectIds`,

  `sessionIds`, or `projectIds`. Each array contains 1 to 20 non-empty values.

  Agent resource IDs use
  /subscriptions/{subscription_guid}/accounts/{account-name}/project/{project-name}/agent/{agent_name}.

  Legacy dotted identity, session, and project keys remain accepted, but cannot
  be combined with their canonical key.
fullName: CostControlMatch
remarks: ''
isDeprecated: false
type: interface
