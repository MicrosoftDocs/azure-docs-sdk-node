### YamlMime:TSType
name: LiveSessionStartEvent
uid: '@azure/ai-projects.LiveSessionStartEvent'
package: '@azure/ai-projects'
summary: >-
  Start a Live session on a primary WebSocket. Send this event before other
  commands and wait for `session.started`.
fullName: LiveSessionStartEvent
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: event_id
    uid: '@azure/ai-projects.LiveSessionStartEvent.event_id'
    package: '@azure/ai-projects'
    summary: A client-generated ID used to correlate this command with server events.
    fullName: event_id
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'event_id?: string'
      return:
        description: ''
        type: string
  - name: session
    uid: '@azure/ai-projects.LiveSessionStartEvent.session'
    package: '@azure/ai-projects'
    summary: >-
      Initial configuration for a primary WebSocket. Send session.start first
      and wait for session.started before application commands. WebRTC creation
      already starts the session; do not send this event again on its data
      channel.
    fullName: session
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'session: LiveSessionCreateParams'
      return:
        description: ''
        type: <xref uid="@azure/ai-projects.LiveSessionCreateParams" />
  - name: type
    uid: '@azure/ai-projects.LiveSessionStartEvent.type'
    package: '@azure/ai-projects'
    summary: The Live client event type. Always `session.start`.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: "session.start"'
      return:
        description: ''
        type: '"<xref uid="session.start" />"'
extends: <xref uid="@azure/ai-projects.LiveClientEvent" />
