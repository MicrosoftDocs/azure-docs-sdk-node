      return:
        description: ''
        type: <xref uid="@azure/arm-compute-bulkactions.ComputeProfile" />
  - name: createdTime
    uid: '@azure/arm-compute-bulkactions.BulkCreateProperties.createdTime'
    package: '@azure/arm-compute-bulkactions'
    summary: The UTC time the BulkCreate resource was created.
    fullName: createdTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'createdTime?: Date'
      return:
        description: ''
        type: Date
  - name: executionParameters
    uid: '@azure/arm-compute-bulkactions.BulkCreateProperties.executionParameters'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Extra parameters that control how the request is executed, including the
      retry policy.
    fullName: executionParameters
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'executionParameters?: ExecutionParameters'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute-bulkactions.ExecutionParameters" />
  - name: minCapacity
    uid: '@azure/arm-compute-bulkactions.BulkCreateProperties.minCapacity'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      The minimum capacity, expressed in units specified by capacityType, that
      Azure must be able to allocate for the request to proceed. If Azure cannot
      allocate at least this capacity with high confidence, the request is
      rejected with 409 Conflict (InsufficientCapacity) and no VMs are created.
      Otherwise, Azure allocates as much capacity as possible, up to the
      requested capacity. Must be greater than 0, less than capacity, and
      requires partialFulfillmentPolicy.mode to be Enabled.
    fullName: minCapacity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'minCapacity?: number'
      return:
        description: ''
        type: number
  - name: partialFulfillmentPolicy
    uid: >-
      @azure/arm-compute-bulkactions.BulkCreateProperties.partialFulfillmentPolicy
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Controls how partial fulfillment is handled for a BulkCreate request. When
      enabled, Azure creates only the VMs or vCPUs it has high confidence can be
      successfully allocated, instead of attempting the entire request and
      potentially returning allocation failures.
    fullName: partialFulfillmentPolicy
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'partialFulfillmentPolicy?: PartialFulfillmentPolicy'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute-bulkactions.PartialFulfillmentPolicy" />
  - name: priorityProfile
    uid: '@azure/arm-compute-bulkactions.BulkCreateProperties.priorityProfile'
    package: '@azure/arm-compute-bulkactions'
    summary: Configuration Options for Regular or Spot instances in BulkCreate.
    fullName: priorityProfile
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'priorityProfile: PriorityProfile'
      return:
        description: ''
        type: <xref uid="@azure/arm-compute-bulkactions.PriorityProfile" />
  - name: provisioningState
    uid: '@azure/arm-compute-bulkactions.BulkCreateProperties.provisioningState'
    package: '@azure/arm-compute-bulkactions'
    summary: The status of the last operation.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: string'
      return:
        description: ''
        type: string
  - name: vmSizesProfile
    uid: '@azure/arm-compute-bulkactions.BulkCreateProperties.vmSizesProfile'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      List of VM sizes supported for BulkCreate. Every virtual machine is
      created from the operation-level computeProfile regardless of the size
      selected, so no per-VM-size override can be supplied here.
    fullName: vmSizesProfile
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'vmSizesProfile?: BulkCreateVmSizeProfile[]'
      return:
        description: ''
        type: >-
          <xref uid="@azure/arm-compute-bulkactions.BulkCreateVmSizeProfile"
          />[]
