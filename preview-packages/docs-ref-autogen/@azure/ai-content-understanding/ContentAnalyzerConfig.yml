name: ContentAnalyzerConfig
uid: '@azure/ai-content-understanding.ContentAnalyzerConfig'
package: '@azure/ai-content-understanding'
summary: Configuration settings for an analyzer.
fullName: ContentAnalyzerConfig
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: allowInPageSegments
    uid: '@azure/ai-content-understanding.ContentAnalyzerConfig.allowInPageSegments'
    package: '@azure/ai-content-understanding'
    summary: >-
      Enable sub-page segmentation. When true, segments may cover a portion of a
      page instead of full pages.
    fullName: allowInPageSegments
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowInPageSegments?: boolean'
      return:
        description: ''
        type: boolean
  - name: allowInputTruncation
    uid: '@azure/ai-content-understanding.ContentAnalyzerConfig.allowInputTruncation'
    package: '@azure/ai-content-understanding'
    summary: >-
      When true, input that exceeds the service's processable-unit limit is
      truncated to the limit and returned as a

      partial result with a warning, instead of failing. Field extraction and
      segmentation, where configured, run over

      the processed content and may be inaccurate. Defaults to false.
      Overridable per request by the allowInputTruncation

      query parameter.
    fullName: allowInputTruncation
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'allowInputTruncation?: boolean'
      return:
        description: ''
        type: boolean
