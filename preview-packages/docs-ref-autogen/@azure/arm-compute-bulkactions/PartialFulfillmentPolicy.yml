### YamlMime:TSType
name: PartialFulfillmentPolicy
uid: '@azure/arm-compute-bulkactions.PartialFulfillmentPolicy'
package: '@azure/arm-compute-bulkactions'
summary: >-
  Controls how partial fulfillment is handled for a BulkCreateCustom request.
  When enabled, Azure creates only the VMs or vCPUs it has high confidence can
  be successfully allocated, instead of attempting the entire request and
  potentially returning allocation failures.
fullName: PartialFulfillmentPolicy
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: fulfilledCapacity
    uid: '@azure/arm-compute-bulkactions.PartialFulfillmentPolicy.fulfilledCapacity'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      The amount of capacity that was actually attempted, expressed in the units
      specified by capacityType. When partial fulfillment is enabled, this value
      can be less than the requested capacity.
    fullName: fulfilledCapacity
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'fulfilledCapacity?: number'
      return:
        description: ''
        type: number
  - name: mode
    uid: '@azure/arm-compute-bulkactions.PartialFulfillmentPolicy.mode'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Specifies whether partial fulfillment is allowed. When Enabled, Azure
      creates as many VMs as it has high confidence can be successfully
      allocated. When Disabled, Azure attempts to create all requested VMs,
      which may result into allocation failures.
    fullName: mode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'mode?: string'
      return:
        description: ''
        type: string
  - name: reason
    uid: '@azure/arm-compute-bulkactions.PartialFulfillmentPolicy.reason'
    package: '@azure/arm-compute-bulkactions'
    summary: >-
      Indicates why the fulfilled capacity is less than the requested capacity.
      Possible values include InsufficientCapacity and InsufficientQuota.
      Returned only in the create response when partial fulfillment is enabled
      and the request cannot be fully satisfied.
    fullName: reason
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'reason?: string'
      return:
        description: ''
        type: string
