### YamlMime:TSType
name: IdentityInput
uid: '@azure/provisioning-search.types.IdentityInput'
package: '@azure/provisioning-search'
summary: >-
  Input type for Details about the search service identity. A null value
  indicates that the search service has no identity assigned.
fullName: IdentityInput
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: type
    uid: '@azure/provisioning-search.types.IdentityInput.type'
    package: '@azure/provisioning-search'
    summary: >-
      The type of identity used for the resource. The type 'SystemAssigned,
      UserAssigned' includes both an identity created by the system and a set of
      user assigned identities. The type 'None' will remove all identities from
      the service.
    fullName: type
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'type: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: userAssignedIdentities
    uid: '@azure/provisioning-search.types.IdentityInput.userAssignedIdentities'
    package: '@azure/provisioning-search'
    summary: >-
      The list of user identities associated with the resource. The user
      identity dictionary key references will be ARM resource IDs in the form:
      '/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}'.
    fullName: userAssignedIdentities
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'userAssignedIdentities?: any'
      return:
        description: ''
        type: any
extends: unknown&lt;<xref uid="@azure/provisioning-search.types.Identity" />&gt;
