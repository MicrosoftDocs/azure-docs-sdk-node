    isDeprecated: false
    syntax:
      content: 'managedIdentity: IdentityBindingManagedIdentityProfile'
      return:
        description: ''
        type: >-
          <xref
          uid="@azure/arm-containerservicefleet.IdentityBindingManagedIdentityProfile"
          />
  - name: oidcIssuer
