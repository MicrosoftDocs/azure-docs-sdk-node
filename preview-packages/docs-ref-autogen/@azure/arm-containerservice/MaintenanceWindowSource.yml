### YamlMime:TSTypeAlias
name: MaintenanceWindowSource
uid: '@azure/arm-containerservice.MaintenanceWindowSource'
package: '@azure/arm-containerservice'
summary: >-
  The auto-upgrade schedule that a maintenance window is derived from. \

  [KnownMaintenanceWindowSource](xref:@azure/arm-containerservice.KnownMaintenanceWindowSource)
  can be used interchangeably with MaintenanceWindowSource,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ClusterAutoUpgradeSchedule**: The window is derived from the cluster
  auto-upgrade schedule (aksManagedAutoUpgradeSchedule), which governs
  Kubernetes version upgrades. \

  **NodeOSUpgradeSchedule**: The window is derived from the node OS auto-upgrade
  schedule (aksManagedNodeOSUpgradeSchedule), which governs node OS image
  upgrades.
fullName: MaintenanceWindowSource
remarks: ''
isDeprecated: false
syntax: |
  type MaintenanceWindowSource = string
