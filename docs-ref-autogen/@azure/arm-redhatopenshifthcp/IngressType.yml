name: IngressType
uid: '@azure/arm-redhatopenshifthcp.IngressType'
package: '@azure/arm-redhatopenshifthcp'
summary: >-
  The type of the default cluster ingress. \

  [KnownIngressType](xref:@azure/arm-redhatopenshifthcp.KnownIngressType) can be
  used interchangeably with IngressType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Public**: The default ingress is visible from the internet. \

  **Private**: The default ingress is not visible from the internet. \

  **Disabled**: The default ingress is disabled.
