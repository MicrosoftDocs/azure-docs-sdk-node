name: DotNetComponentProvisioningState
uid: '@azure/arm-appcontainers.DotNetComponentProvisioningState'
package: '@azure/arm-appcontainers'
summary: >-
  Provisioning state of the .NET Component. \

  [KnownDotNetComponentProvisioningState](xref:@azure/arm-appcontainers.KnownDotNetComponentProvisioningState)
  can be used interchangeably with DotNetComponentProvisioningState,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Succeeded**: The .NET component was provisioned successfully. \

  **Failed**: The .NET component failed to provision. \

  **Canceled**: Provisioning of the .NET component was canceled. \

  **Deleting**: The .NET component is being deleted. \

  **InProgress**: The .NET component is being provisioned.
fullName: DotNetComponentProvisioningState
remarks: ''
isDeprecated: false
syntax: |
  type DotNetComponentProvisioningState = string
