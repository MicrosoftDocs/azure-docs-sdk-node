### YamlMime:TSType
name: SearchServicePropertiesView
uid: '@azure/provisioning-search.types.SearchServicePropertiesView'
package: '@azure/provisioning-search'
summary: View type for Properties of the search service.
fullName: SearchServicePropertiesView
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: authOptions
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.authOptions'
    package: '@azure/provisioning-search'
    summary: >-
      Defines the options for how the data plane API of a search service
      authenticates requests. This cannot be set if 'disableLocalAuth' is set to
      true.
    fullName: authOptions
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'authOptions?: DataPlaneAuthOptionsInput'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-search.types.DataPlaneAuthOptionsInput"
          />
  - name: computeType
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.computeType'
    package: '@azure/provisioning-search'
    summary: >-
      Configure this property to support the search service using either the
      Default Compute or Azure Confidential Compute.
    fullName: computeType
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'computeType?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: dataExfiltrationProtections
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.dataExfiltrationProtections
    package: '@azure/provisioning-search'
    summary: >-
      A list of data exfiltration scenarios that are explicitly disallowed for
      the search service. Currently, the only supported value is 'All' to
      disable all possible data export scenarios with more fine grained controls
      planned for the future.
    fullName: dataExfiltrationProtections
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'dataExfiltrationProtections?: any'
      return:
        description: ''
        type: any
  - name: disableLocalAuth
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.disableLocalAuth
    package: '@azure/provisioning-search'
    summary: >-
      When set to true, calls to the search service will not be permitted to
      utilize API keys for authentication. This cannot be set to true if
      'dataPlaneAuthOptions' are defined.
    fullName: disableLocalAuth
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'disableLocalAuth?: ExpressionOrValue<boolean | null>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;boolean |
          null&gt;
  - name: encryptionWithCmk
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.encryptionWithCmk
    package: '@azure/provisioning-search'
    summary: >-
      Specifies any policy regarding encryption of resources (such as indexes)
      using customer manager keys within a search service.
    fullName: encryptionWithCmk
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'encryptionWithCmk?: EncryptionWithCmkView'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-search.types.EncryptionWithCmkView" />
  - name: endpoint
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.endpoint'
    package: '@azure/provisioning-search'
    summary: The endpoint of the Azure AI Search service.
    fullName: endpoint
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'endpoint?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: eTag
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.eTag'
    package: '@azure/provisioning-search'
    summary: >-
      Read-only output: A system generated property representing the service's
      etag that can be for optimistic concurrency control during updates.
    fullName: eTag
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'eTag?: Expression<string>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;string&gt;
  - name: hostingMode
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.hostingMode'
    package: '@azure/provisioning-search'
    summary: >-
      Applicable only for the standard3 SKU. You can set this property to enable
      up to 3 high density partitions that allow up to 1000 indexes, which is
      much higher than the maximum indexes allowed for any other SKU. For the
      standard3 SKU, the value is either 'Default' or 'HighDensity'. For all
      other SKUs, this value must be 'Default'.
    fullName: hostingMode
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'hostingMode?: ExpressionOrValue<HostingMode>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;<xref
          uid="@azure/provisioning-search.types.HostingMode" />&gt;
  - name: networkRuleSet
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.networkRuleSet
    package: '@azure/provisioning-search'
    summary: >-
      Network specific rules that determine how the Azure AI Search service may
      be reached.
    fullName: networkRuleSet
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'networkRuleSet?: NetworkRuleSetInput'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-search.types.NetworkRuleSetInput" />
  - name: partitionCount
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.partitionCount
    package: '@azure/provisioning-search'
    summary: >-
      The number of partitions in the dedicated search service; if specified, it
      can be 1, 2, 3, 4, 6, or 12. Values greater than 1 are only valid for
      standard SKUs. For 'standard3' services with hostingMode set to
      'highDensity', the allowed values are between 1 and 3.
    fullName: partitionCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'partitionCount?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
  - name: privateEndpointConnections
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.privateEndpointConnections
    package: '@azure/provisioning-search'
    summary: >-
      Read-only output: The list of private endpoint connections to the Azure AI
      Search service.
    fullName: privateEndpointConnections
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        privateEndpointConnections?:
        Expression<SearchPrivateEndpointConnection[]>
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-search.types.SearchPrivateEndpointConnection"
          />[]&gt;
  - name: provisioningState
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.provisioningState
    package: '@azure/provisioning-search'
    summary: >-
      Read-only output: The state of the last provisioning operation performed
      on the search service. Provisioning is an intermediate state that occurs
      while service capacity is being established. After capacity is set up,
      provisioningState changes to either 'Succeeded' or 'Failed'. Client
      applications can poll provisioning status (the recommended polling
      interval is from 30 seconds to one minute) by using the Get Search Service
      operation to see when an operation is completed. If you are using the free
      service, this value tends to come back as 'Succeeded' directly in the call
      to Create search service. This is because the free service uses capacity
      that is already set up.
    fullName: provisioningState
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'provisioningState?: Expression<ProvisioningState>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-search.types.ProvisioningState" />&gt;
  - name: publicNetworkAccess
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.publicNetworkAccess
    package: '@azure/provisioning-search'
    summary: >-
      This value can be set to 'Enabled' to avoid breaking changes on existing
      customer resources and templates. If set to 'Disabled', traffic over
      public interface is not allowed, and private endpoint connections would be
      the exclusive access method.
    fullName: publicNetworkAccess
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'publicNetworkAccess?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
  - name: replicaCount
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.replicaCount'
    package: '@azure/provisioning-search'
    summary: >-
      The number of replicas in the dedicated search service. If specified, it
      must be a value between 1 and 12 inclusive for standard SKUs or between 1
      and 3 inclusive for basic SKU.
    fullName: replicaCount
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'replicaCount?: ExpressionOrValue<number>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;number&gt;
  - name: semanticSearch
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.semanticSearch
    package: '@azure/provisioning-search'
    summary: >-
      Specifies the availability and billing plan for semantic search on the
      Azure AI Search service. This configuration is only available for certain
      pricing tiers in certain regions.
    fullName: semanticSearch
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'semanticSearch?: ExpressionOrValue<string | null>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue" />&lt;string |
          null&gt;
  - name: serviceUpgradedAt
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.serviceUpgradedAt
    package: '@azure/provisioning-search'
    summary: >-
      Read-only output: The date and time the search service was last upgraded.
      This field will be null until the service gets upgraded for the first
      time.
    fullName: serviceUpgradedAt
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'serviceUpgradedAt?: Expression<Date>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;Date&gt;
  - name: sharedPrivateLinkResources
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.sharedPrivateLinkResources
    package: '@azure/provisioning-search'
    summary: >-
      Read-only output: The list of shared private link resources managed by the
      Azure AI Search service.
    fullName: sharedPrivateLinkResources
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        sharedPrivateLinkResources?:
        Expression<SearchSharedPrivateLinkResource[]>
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-search.types.SearchSharedPrivateLinkResource"
          />[]&gt;
  - name: status
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.status'
    package: '@azure/provisioning-search'
    summary: >-
      Read-only output: The status of the search service. Possible values
      include: 'running': The search service is running and no provisioning
      operations are underway. 'provisioning': The search service is being
      provisioned or scaled up or down. 'deleting': The search service is being
      deleted. 'degraded': The search service is degraded. This can occur when
      the underlying search units are not healthy. The search service is most
      likely operational, but performance might be slow and some requests might
      be dropped. 'disabled': The search service is disabled. In this state, the
      service will reject all API requests. 'error': The search service is in an
      error state. 'stopped': The search service is in a subscription that's
      disabled. If your service is in the degraded, disabled, or error states,
      it means the Azure AI Search team is actively investigating the underlying
      issue. Dedicated services in these states are still chargeable based on
      the number of search units provisioned.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status?: Expression<SearchServiceStatus>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.Expression" />&lt;<xref
          uid="@azure/provisioning-search.types.SearchServiceStatus" />&gt;
  - name: statusDetails
    uid: '@azure/provisioning-search.types.SearchServicePropertiesView.statusDetails'
    package: '@azure/provisioning-search'
    summary: 'Read-only output: The details of the search service status.'
    fullName: statusDetails
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'statusDetails?: Expression<string>'
      return:
        description: ''
        type: <xref uid="@azure/provisioning-core.Expression" />&lt;string&gt;
  - name: upgradeAvailable
    uid: >-
      @azure/provisioning-search.types.SearchServicePropertiesView.upgradeAvailable
    package: '@azure/provisioning-search'
    summary: Indicates if the search service has an upgrade available.
    fullName: upgradeAvailable
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'upgradeAvailable?: ExpressionOrValue<string>'
      return:
        description: ''
        type: >-
          <xref uid="@azure/provisioning-core.ExpressionOrValue"
          />&lt;string&gt;
extends: >-
  unknown&lt;<xref
  uid="@azure/provisioning-search.types.SearchServiceProperties" />&gt;
