package: '@azure/provisioning-operationalinsights'
summary: >-
  Column data type logical hint.


  Known values:


  - `"uri"`: A string that matches the pattern of a URI, for example,
  scheme://username:password@host:1234/this/is/a/path?k1=v1&k2=v2#fragment


  - `"guid"`: A standard 128-bit GUID following the standard shape,
  xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx


  - `"armPath"`: An Azure Resource Model (ARM) path:
  /subscriptions/{...}/resourceGroups/{...}/providers/Microsoft.{...}/{...}/{...}/{...}...


  - `"ip"`: A standard V4/V6 ip address following the standard shape,
  x.x.x.x/y:y:y:y:y:y:y:y


  - `"vector16"`: A vector of single-precision floating-point values used for
  semantic / similarity search.
