  declared types and allowed values.
fullName: StackParameterValues<P>
remarks: ''
isDeprecated: false
syntax: |
  type StackParameterValues<P> = {
    readonly [K in RequiredParameterKeys<P>]:
      | ExpressionOrValue<ParameterValue<P[K]>>
      | Extract<OutputValueFor<P[K]["type"]>, ResourceDeclaration | AnyModule>
  } & {
    readonly [K in Exclude<keyof P, RequiredParameterKeys<P>>]?:
