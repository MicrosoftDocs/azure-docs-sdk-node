### YamlMime:TSType
name: CostControlAdditionalInfoFilter
uid: '@azure/arm-cognitiveservices.CostControlAdditionalInfoFilter'
package: '@azure/arm-cognitiveservices'
summary: >-
  Selects traffic whose named additional-info attribute equals at least one of
  the supplied values.
fullName: CostControlAdditionalInfoFilter
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: name
    uid: '@azure/arm-cognitiveservices.CostControlAdditionalInfoFilter.name'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      The built-in attribute: agent, sessionId, project, deployment, or
      tokenType.

      Resource selectors use owner-scoped short names, not Azure resource IDs.
      Agent selections require an explicit project filter selecting exactly one
      project; multiple agents in that project are supported.

      A project-owned control can select only its owning project. Project,
      agent, and deployment values must be plain names of 1-64 characters
      without leading or trailing whitespace, control characters,
      path/query/fragment separators, percent signs, or . and .. path segments.

      tokenType accepts input, output, or both for a Tokens budget; omission
      measures overall tokens.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name: string'
      return:
        description: ''
        type: string
  - name: operator
    uid: '@azure/arm-cognitiveservices.CostControlAdditionalInfoFilter.operator'
    package: '@azure/arm-cognitiveservices'
    summary: The comparison operator.`In` is supported.
    fullName: operator
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'operator: "In"'
      return:
        description: ''
        type: '"In"'
  - name: values
    uid: '@azure/arm-cognitiveservices.CostControlAdditionalInfoFilter.values'
    package: '@azure/arm-cognitiveservices'
    summary: >-
      One or more nonempty, non-whitespace strings to match. There is no
      per-condition value-count limit; the serialized cost-control definition
      must not exceed 32 KiB.
    fullName: values
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'values: string[]'
      return:
        description: ''
        type: string[]
