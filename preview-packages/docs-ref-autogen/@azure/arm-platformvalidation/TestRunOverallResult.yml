name: TestRunOverallResult
uid: '@azure/arm-platformvalidation.TestRunOverallResult'
package: '@azure/arm-platformvalidation'
summary: >-
  The overall result of a validation test run collection. \

  [KnownTestRunOverallResult](xref:@azure/arm-platformvalidation.KnownTestRunOverallResult)
  can be used interchangeably with TestRunOverallResult,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **Passed**: All tests passed. \

  **Failed**: One or more tests failed. \

  **PartiallyPassed**: Some tests passed and some failed.
