name: MaintenanceConfigurationProperties
uid: '@azure/arm-containerservice.MaintenanceConfigurationProperties'
package: '@azure/arm-containerservice'
summary: Properties used to configure planned maintenance for a Managed Cluster.
fullName: MaintenanceConfigurationProperties
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: maintenanceWindow
    uid: >-
      @azure/arm-containerservice.MaintenanceConfigurationProperties.maintenanceWindow
    package: '@azure/arm-containerservice'
    summary: Maintenance window for the maintenance configuration.
    fullName: maintenanceWindow
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maintenanceWindow?: MaintenanceWindow'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.MaintenanceWindow" />
  - name: maintenanceWindowId
    uid: >-
      @azure/arm-containerservice.MaintenanceConfigurationProperties.maintenanceWindowId
    package: '@azure/arm-containerservice'
    summary: >-
      The fully qualified resource ID of the maintenance window that this
      maintenance configuration is linked to. When set, the schedule is derived
      read-only from the linked maintenance window — maintenanceWindow becomes a
      computed field. When absent (the default), the schedule is defined inline
      via the maintenanceWindow property. The caller must have read access to
      the target maintenance window.
    fullName: maintenanceWindowId
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'maintenanceWindowId?: string'
      return:
        description: ''
        type: string
  - name: notAllowedTime
    uid: >-
      @azure/arm-containerservice.MaintenanceConfigurationProperties.notAllowedTime
    package: '@azure/arm-containerservice'
    summary: Time slots on which upgrade is not allowed.
    fullName: notAllowedTime
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'notAllowedTime?: TimeSpan[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.TimeSpan" />[]
  - name: timeInWeek
    uid: '@azure/arm-containerservice.MaintenanceConfigurationProperties.timeInWeek'
    package: '@azure/arm-containerservice'
    summary: >-
      Time slots during the week when planned maintenance is allowed to proceed.
      If two array entries specify the same day of the week, the applied
      configuration is the union of times in both entries.
    fullName: timeInWeek
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'timeInWeek?: TimeInWeek[]'
      return:
        description: ''
        type: <xref uid="@azure/arm-containerservice.TimeInWeek" />[]
