    uid: >-
      @azure/arm-network.DdosMitigationRulePropertiesFormat.sourcePolicyOverrides
    package: '@azure/arm-network'
    summary: >-
      Source-specific actions that override the default mitigations. A rule
      supports at most one Deny override and one Permit override.
    fullName: sourcePolicyOverrides
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'sourcePolicyOverrides?: DdosSourcePolicyOverride[]'
