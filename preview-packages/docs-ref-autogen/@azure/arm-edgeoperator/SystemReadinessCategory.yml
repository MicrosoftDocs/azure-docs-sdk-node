    summary: >-
      The provider-defined name of the readiness category (for example,
      `services`, `diagnostics`, `identity`, `networking`). Categories may be
      added, renamed, or removed without an API-version change and must be
      treated as an open string.
    fullName: categoryName
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'categoryName: string'
      return:
        description: ''
        type: string
  - name: errorMessageDetails
