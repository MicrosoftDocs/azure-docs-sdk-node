### YamlMime:TSTypeAlias
name: DiskFileSystemType
uid: '@azure/arm-azurestackhci.DiskFileSystemType'
package: '@azure/arm-azurestackhci'
summary: >-
  File system types supported for volumes. \

  [KnownDiskFileSystemType](xref:@azure/arm-azurestackhci.KnownDiskFileSystemType)
  can be used interchangeably with DiskFileSystemType,
   this enum contains the known values that the service supports.
  ### Known values supported by the service

  **ext4**: ext4 file system (Linux). \

  **xfs**: xfs file system (Linux). \

  **NTFS**: NTFS file system (Windows). \

  **ReFS**: ReFS file system (Windows). \

  **vfat**: vfat file system (Linux/cross-platform). \

  **fat32**: FAT32 file system. \

  **fat**: FAT file system.
fullName: DiskFileSystemType
remarks: ''
isDeprecated: false
syntax: |
  type DiskFileSystemType = string
